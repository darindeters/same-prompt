<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galaxy Merger</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

/* ---------------------------------------------------------------- canvas */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 1, H = 1, DPR = 1;
let bg = null;                    // offscreen starfield

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
}

function buildBackground() {
  bg = document.createElement('canvas');
  bg.width = canvas.width; bg.height = canvas.height;
  const b = bg.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);
  // very faint deep-space gradient
  const g = b.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
  g.addColorStop(0, 'rgb(6,7,14)');
  g.addColorStop(1, 'rgb(0,0,2)');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  // distant field stars
  const rng = mulberry(1234567);
  const n = Math.round(W * H / 2200);
  for (let i = 0; i < n; i++) {
    const x = rng() * W, y = rng() * H;
    const r = 0.3 + rng() * rng() * 1.1;
    const a = 0.25 + rng() * 0.6;
    const t = rng();
    const col = t < 0.15 ? '255,205,170' : t < 0.3 ? '190,205,255' : '230,235,255';
    b.fillStyle = `rgba(${col},${a})`;
    b.beginPath(); b.arc(x, y, r, 0, 6.2832); b.fill();
  }
}

/* ---------------------------------------------------------------- random */
function mulberry(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rand = Math.random;
function gauss() {
  let u = 0, v = 0;
  while (u === 0) u = rand();
  v = rand();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v);
}

/* ---------------------------------------------------------------- sprites */
function makeSprite(r, g, b, size, core, mid) {
  const s = document.createElement('canvas');
  s.width = s.height = size;
  const c = s.getContext('2d');
  const gr = c.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gr.addColorStop(0, `rgba(${r},${g},${b},${core})`);
  gr.addColorStop(0.25, `rgba(${r},${g},${b},${mid})`);
  gr.addColorStop(0.6, `rgba(${r},${g},${b},${mid * 0.18})`);
  gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
  c.fillStyle = gr; c.fillRect(0, 0, size, size);
  return s;
}
const SPR = 16;
const sprites = [
  makeSprite(255, 222, 170, SPR, 0.55, 0.22),   // 0 old, warm bulge star
  makeSprite(236, 238, 255, SPR, 0.55, 0.20),   // 1 white disk star
  makeSprite(150, 185, 255, SPR, 0.60, 0.24),   // 2 young blue arm star
  makeSprite(255, 150, 205, SPR, 0.55, 0.26),   // 3 pink HII region
  makeSprite(255, 196, 130, SPR, 0.55, 0.22),   // 4 golden bulge (second galaxy)
  makeSprite(120, 150, 255, SPR, 0.40, 0.16),   // 5 faint blue halo star
];
const coreGlowA = makeSprite(255, 236, 200, 128, 0.95, 0.35);
const coreGlowB = makeSprite(255, 215, 160, 128, 0.95, 0.32);
const haze      = makeSprite(90, 110, 190, 128, 0.10, 0.045);

/* ---------------------------------------------------------------- physics */
const G = 1;
const N = 15000;
const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
const vx = new Float32Array(N), vy = new Float32Array(N), vz = new Float32Array(N);
const kind = new Uint8Array(N);
const depth = new Float32Array(N);

// two galactic cores (point masses with Plummer softening)
const core = [
  { M: 1.00, a: 0.32, Rd: 1.10, n: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, glow: coreGlowA, bulge: 0 },
  { M: 0.65, a: 0.26, Rd: 0.85, n: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, glow: coreGlowB, bulge: 4 },
];
const EPS2 = 0.55 * 0.55;        // core-core softening
const KDF = 0.08, DSCALE = 2.0;  // dynamical friction
const DT = 0.012;

let simT = 0;
let cycleSeed = (Math.random() * 1e9) >>> 0;
let camYaw0 = 0, camPitch0 = 0.55, camRoll = 0;

function randomBasis() {
  // random unit normal + two perpendicular unit vectors
  const z = rand() * 2 - 1, ph = rand() * 6.2831853, s = Math.sqrt(1 - z * z);
  const n = [s * Math.cos(ph), s * Math.sin(ph), z];
  let t = Math.abs(n[0]) < 0.9 ? [1, 0, 0] : [0, 1, 0];
  const u = cross(n, t); norm(u);
  const v = cross(n, u);
  return { n, u, v };
}
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; a[0] /= l; a[1] /= l; a[2] /= l; }

function circV(M, a, r) { return Math.sqrt(G * M * r * r / Math.pow(r * r + a * a, 1.5)); }

function initGalaxy(gi, i0, count, sense) {
  const g = core[gi];
  const { n, u, v } = randomBasis();
  // bias the disk normal so the view is neither exactly face-on nor edge-on
  const pitch = 0.25 + rand() * 0.55;   // log-spiral pitch angle in radians
  const tanP = Math.tan(pitch);
  const nb = Math.floor(count * 0.17);
  for (let k = 0; k < count; k++) {
    const i = i0 + k;
    let r, th, zoff, vr, vt, vzz, basisU = u, basisV = v, basisN = n, kd;
    if (k < nb) {
      // bulge: spherical, circular orbits in random planes
      r = g.a * 0.9 * Math.pow(Math.pow(Math.max(rand(), 1e-4), -2 / 3) - 1, -0.5);
      r = Math.min(Math.max(r, 0.03), g.a * 3.5);
      const bb = randomBasis(); basisU = bb.u; basisV = bb.v; basisN = bb.n;
      th = rand() * 6.2831853; zoff = 0;
      vt = circV(g.M, g.a, r) * (0.9 + 0.2 * rand()); vr = 0; vzz = 0;
      kd = g.bulge;
    } else {
      // exponential disk, radius ~ Gamma(2, Rd)
      r = g.Rd * (-Math.log(rand()) - Math.log(rand())) * 0.95;
      r = Math.min(Math.max(r, 0.08), g.Rd * 4.6);
      // two trailing log-spiral arms with scatter growing outward
      const arm = Math.log(r / (0.25 * g.Rd)) / tanP;
      const sig = 0.22 + 0.14 * (r / g.Rd);
      const onArm = rand() < 0.72;
      th = onArm ? arm + (rand() < 0.5 ? 0 : Math.PI) + gauss() * sig : rand() * 6.2831853;
      th *= sense;
      zoff = gauss() * (0.035 + 0.02 * r / g.Rd) * g.Rd;
      const vc = circV(g.M, g.a, r);
      vt = vc * (1 + gauss() * 0.03) * sense;
      vr = gauss() * 0.025 * vc;
      vzz = gauss() * 0.02 * vc;
      // colour: inner → warm, arms → blue/white with pink HII, outskirts → fainter blue
      const q = rand();
      if (r < 0.45 * g.Rd) kd = q < 0.7 ? g.bulge : 1;
      else if (onArm) kd = q < 0.08 ? 3 : q < 0.6 ? 2 : 1;
      else kd = q < 0.5 ? 1 : q < 0.85 ? 5 : 0;
      if (r > 3.2 * g.Rd) kd = 5;
    }
    const ct = Math.cos(th), st = Math.sin(th);
    // position in disk plane
    const lx = r * ct, ly = r * st;
    px[i] = g.x + basisU[0] * lx + basisV[0] * ly + basisN[0] * zoff;
    py[i] = g.y + basisU[1] * lx + basisV[1] * ly + basisN[1] * zoff;
    pz[i] = g.z + basisU[2] * lx + basisV[2] * ly + basisN[2] * zoff;
    // velocity: tangential (-st, ct), radial (ct, st), vertical
    const lvx = -st * vt + ct * vr, lvy = ct * vt + st * vr;
    vx[i] = g.vx + basisU[0] * lvx + basisV[0] * lvy + basisN[0] * vzz;
    vy[i] = g.vy + basisU[1] * lvx + basisV[1] * lvy + basisN[1] * vzz;
    vz[i] = g.vz + basisU[2] * lvx + basisV[2] * lvy + basisN[2] * vzz;
    kind[i] = kd;
  }
}

function initSim() {
  rand = mulberry(cycleSeed);
  simT = 0;
  const M1 = core[0].M, M2 = core[1].M, Mt = M1 + M2;
  // parabolic approach: separation d0, pericentre rp
  const d0 = 11, rp = 1.9 + rand() * 0.9;
  const vrel = Math.sqrt(2 * G * Mt / d0);
  const h = Math.sqrt(2 * G * Mt * rp);
  const vt = h / d0, vr = -Math.sqrt(Math.max(0, vrel * vrel - vt * vt));
  // orbital plane: random orientation, but mostly inclined so we see both disks
  const ob = randomBasis();
  const rx = ob.u[0] * d0, ry = ob.u[1] * d0, rz = ob.u[2] * d0;
  const wx = ob.u[0] * vr + ob.v[0] * vt, wy = ob.u[1] * vr + ob.v[1] * vt, wz = ob.u[2] * vr + ob.v[2] * vt;
  // place in centre-of-mass frame
  const f1 = M2 / Mt, f2 = -M1 / Mt;
  core[0].x = rx * f1; core[0].y = ry * f1; core[0].z = rz * f1;
  core[0].vx = wx * f1; core[0].vy = wy * f1; core[0].vz = wz * f1;
  core[1].x = rx * f2; core[1].y = ry * f2; core[1].z = rz * f2;
  core[1].vx = wx * f2; core[1].vy = wy * f2; core[1].vz = wz * f2;

  const n1 = Math.round(N * 0.58), n2 = N - n1;
  core[0].n = n1; core[1].n = n2;
  initGalaxy(0, 0, n1, rand() < 0.5 ? 1 : -1);
  initGalaxy(1, n1, n2, rand() < 0.5 ? 1 : -1);

  camYaw0 = rand() * 6.2831853;
  camPitch0 = 0.35 + rand() * 0.5;
  camRoll = (rand() - 0.5) * 0.4;
}

function step(dt) {
  const c0 = core[0], c1 = core[1];
  // --- cores: kick-drift-kick on each other, with dynamical friction
  let dx = c0.x - c1.x, dy = c0.y - c1.y, dz = c0.z - c1.z;
  let d2 = dx * dx + dy * dy + dz * dz;
  let inv = G / Math.pow(d2 + EPS2, 1.5);
  let d = Math.sqrt(d2);
  let f = KDF / (1 + Math.pow(d / DSCALE, 3));
  let rvx = c0.vx - c1.vx, rvy = c0.vy - c1.vy, rvz = c0.vz - c1.vz;
  const Mt = c0.M + c1.M;
  // accel on c0: -M1 * r/|r|^3 - f*vrel*(M1/Mt); on c1 the opposite (momentum-conserving)
  const a0x = -c1.M * dx * inv - f * rvx * (c1.M / Mt), a0y = -c1.M * dy * inv - f * rvy * (c1.M / Mt), a0z = -c1.M * dz * inv - f * rvz * (c1.M / Mt);
  const a1x =  c0.M * dx * inv + f * rvx * (c0.M / Mt), a1y =  c0.M * dy * inv + f * rvy * (c0.M / Mt), a1z =  c0.M * dz * inv + f * rvz * (c0.M / Mt);
  c0.vx += a0x * dt; c0.vy += a0y * dt; c0.vz += a0z * dt;
  c1.vx += a1x * dt; c1.vy += a1y * dt; c1.vz += a1z * dt;
  c0.x += c0.vx * dt; c0.y += c0.vy * dt; c0.z += c0.vz * dt;
  c1.x += c1.vx * dt; c1.y += c1.vy * dt; c1.z += c1.vz * dt;

  // --- stars: massless test particles in the two softened potentials
  const x0 = c0.x, y0 = c0.y, z0 = c0.z, x1 = c1.x, y1 = c1.y, z1 = c1.z;
  const GM0 = G * c0.M, GM1 = G * c1.M, a02 = c0.a * c0.a, a12 = c1.a * c1.a;
  for (let i = 0; i < N; i++) {
    let ex = px[i] - x0, ey = py[i] - y0, ez = pz[i] - z0;
    let q = ex * ex + ey * ey + ez * ez + a02;
    let s = GM0 / (q * Math.sqrt(q));
    let ax = -ex * s, ay = -ey * s, az = -ez * s;
    ex = px[i] - x1; ey = py[i] - y1; ez = pz[i] - z1;
    q = ex * ex + ey * ey + ez * ez + a12;
    s = GM1 / (q * Math.sqrt(q));
    ax -= ex * s; ay -= ey * s; az -= ez * s;
    vx[i] += ax * dt; vy[i] += ay * dt; vz[i] += az * dt;
    px[i] += vx[i] * dt; py[i] += vy[i] * dt; pz[i] += vz[i] * dt;
  }
  simT += dt;
}

/* ---------------------------------------------------------------- camera */
const CAM_D = 34;               // camera distance in sim units
function viewMatrix(t) {
  const yaw = camYaw0 + 0.045 * t;
  const pitch = camPitch0 + 0.18 * Math.sin(0.021 * t + 1.3);
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const cr = Math.cos(camRoll), sr = Math.sin(camRoll);
  // rows of R = Rroll * Rpitch * Ryaw
  const r00 = cy, r01 = 0, r02 = -sy;
  const r10 = sy * sp, r11 = cp, r12 = cy * sp;
  const r20 = sy * cp, r21 = -sp, r22 = cy * cp;
  return [
    cr * r00 - sr * r10, cr * r01 - sr * r11, cr * r02 - sr * r12,
    sr * r00 + cr * r10, sr * r01 + cr * r11, sr * r02 + cr * r12,
    r20, r21, r22,
  ];
}

/* ---------------------------------------------------------------- render */
const CYCLE = 72;               // seconds per merger sequence
const SIM_SPEED = 1.25;         // sim time units per real second
let cycleT = 0, lastNow = performance.now(), acc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  let dtReal = (now - lastNow) / 1000; lastNow = now;
  if (dtReal > 0.1) dtReal = 0.1;
  if (dtReal < 0) dtReal = 0;
  cycleT += dtReal;
  if (cycleT >= CYCLE) {
    cycleT -= CYCLE;
    cycleSeed = (cycleSeed * 1103515245 + 12345) >>> 0;
    initSim();
  }
  // fixed-step integration
  acc += dtReal * SIM_SPEED;
  let steps = 0;
  while (acc >= DT && steps < 6) { step(DT); acc -= DT; steps++; }
  if (acc > DT * 6) acc = 0;

  // ---- fade for cycle boundary
  const fadeIn = Math.min(1, cycleT / 2.5);
  const fadeOut = Math.min(1, (CYCLE - cycleT) / 3.0);
  const vis = Math.min(fadeIn, fadeOut);
  const ease = vis * vis * (3 - 2 * vis);

  // ---- background with slight persistence (soft motion trails)
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.55;
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.globalAlpha = 1;

  // ---- camera
  const m = viewMatrix(simT);
  const prog = Math.min(1, simT / 80);
  const zoom = 1 + 0.55 * prog * prog;            // slowly tighten as the pair merges
  const base = Math.min(W, H) / 23 * zoom;
  const cxs = W / 2, cys = H / 2;
  // centre of mass of the cores
  const Mt = core[0].M + core[1].M;
  const cmx = (core[0].x * core[0].M + core[1].x * core[1].M) / Mt;
  const cmy = (core[0].y * core[0].M + core[1].y * core[1].M) / Mt;
  const cmz = (core[0].z * core[0].M + core[1].z * core[1].M) / Mt;

  ctx.globalCompositeOperation = 'lighter';

  // ---- diffuse haze around each core (gas / unresolved light)
  for (let g = 0; g < 2; g++) {
    const c = core[g];
    const X = c.x - cmx, Y = c.y - cmy, Z = c.z - cmz;
    const zc = m[6] * X + m[7] * Y + m[8] * Z;
    const persp = CAM_D / (CAM_D - zc);
    const sx = cxs + (m[0] * X + m[1] * Y + m[2] * Z) * base * persp;
    const sy = cys + (m[3] * X + m[4] * Y + m[5] * Z) * base * persp;
    const hs = base * persp * c.Rd * 5.2;
    ctx.globalAlpha = ease * 0.9;
    ctx.drawImage(haze, sx - hs / 2, sy - hs / 2, hs, hs);
  }

  // ---- stars
  const h0 = SPR / 2;
  ctx.globalAlpha = ease;
  for (let i = 0; i < N; i++) {
    const X = px[i] - cmx, Y = py[i] - cmy, Z = pz[i] - cmz;
    const zc = m[6] * X + m[7] * Y + m[8] * Z;
    if (zc > CAM_D - 2) continue;
    const persp = CAM_D / (CAM_D - zc);
    const sx = cxs + (m[0] * X + m[1] * Y + m[2] * Z) * base * persp;
    const sy = cys + (m[3] * X + m[4] * Y + m[5] * Z) * base * persp;
    if (sx < -SPR || sy < -SPR || sx > W + SPR || sy > H + SPR) continue;
    // size by perspective, with a touch of flicker-free variation from index
    const sz = SPR * (0.45 + 0.5 * persp) * (0.8 + ((i * 7) & 7) * 0.05);
    const hh = sz / 2;
    ctx.drawImage(sprites[kind[i]], sx - hh, sy - hh, sz, sz);
  }

  // ---- nuclei glow
  for (let g = 0; g < 2; g++) {
    const c = core[g];
    const X = c.x - cmx, Y = c.y - cmy, Z = c.z - cmz;
    const zc = m[6] * X + m[7] * Y + m[8] * Z;
    const persp = CAM_D / (CAM_D - zc);
    const sx = cxs + (m[0] * X + m[1] * Y + m[2] * Z) * base * persp;
    const sy = cys + (m[3] * X + m[4] * Y + m[5] * Z) * base * persp;
    const gs = base * persp * c.a * 3.6 * Math.sqrt(c.M);
    ctx.globalAlpha = ease * 0.85;
    ctx.drawImage(c.glow, sx - gs / 2, sy - gs / 2, gs, gs);
    const gs2 = gs * 0.42;
    ctx.globalAlpha = ease * 0.95;
    ctx.drawImage(c.glow, sx - gs2 / 2, sy - gs2 / 2, gs2, gs2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // ---- subtle vignette so the square frame reads as a window into space
  const vg = ctx.createRadialGradient(cxs, cys, Math.min(W, H) * 0.35, cxs, cys, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ---------------------------------------------------------------- boot */
window.addEventListener('resize', resize);
resize();
initSim();
// pre-roll a little so the disks have relaxed slightly when the page appears
for (let k = 0; k < 40; k++) step(DT);
requestAnimationFrame(t => { lastNow = t; frame(t); });
})();
</script>
</body>
</html>
