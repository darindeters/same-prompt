<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jack-o'-Lantern Carving Contest</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: #070312;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // Virtual 1080x1080 coordinate space that fills the entire window cleanly
  let vw = 1080;
  let vh = 1080;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    const scaleX = canvas.width / 1080;
    const scaleY = canvas.height / 1080;
    scale = Math.min(scaleX, scaleY);
    vw = canvas.width / scale;
    vh = canvas.height / scale;
    offsetX = (vw - 1080) * 0.5;
    offsetY = (vh - 1080) * 0.5;
  }
  window.addEventListener('resize', resize);
  resize();

  // ============================================================================
  // WEB AUDIO API PROCEDURAL SOUND ENGINE (No external files, auto-start + fallback)
  // ============================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.noiseBuffer = null;
      this.sawNode = null;
      this.sawGain = null;
      this.sawFilter = null;
      this.fireNode = null;
      this.fireGain = null;
      this.unlocked = false;
      this.init();
    }

    init() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      try {
        this.ctx = new AudioCtx();
        this.buildNoiseBuffer();
        this.setupContinuousNodes();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      } catch (e) {}

      const unlock = () => {
        if (!this.ctx) {
          try {
            this.ctx = new AudioCtx();
            this.buildNoiseBuffer();
            this.setupContinuousNodes();
          } catch (e) { return; }
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        this.unlocked = true;
      };

      window.addEventListener('pointerdown', unlock, { passive: true });
      window.addEventListener('mousedown', unlock, { passive: true });
      window.addEventListener('touchstart', unlock, { passive: true });
      window.addEventListener('keydown', unlock, { passive: true });
    }

    buildNoiseBuffer() {
      if (!this.ctx) return;
      const sr = this.ctx.sampleRate;
      const len = sr * 2;
      this.noiseBuffer = this.ctx.createBuffer(1, len, sr);
      const data = this.noiseBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + white * 0.0990460;
        b1 = 0.96300 * b1 + white * 0.2965164;
        b2 = 0.57000 * b2 + white * 1.0526913;
        data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.22;
      }
    }

    setupContinuousNodes() {
      if (!this.ctx || !this.noiseBuffer) return;

      // Sawing fibrous pumpkin-rind sound
      this.sawNode = this.ctx.createBufferSource();
      this.sawNode.buffer = this.noiseBuffer;
      this.sawNode.loop = true;

      this.sawFilter = this.ctx.createBiquadFilter();
      this.sawFilter.type = 'bandpass';
      this.sawFilter.frequency.value = 650;
      this.sawFilter.Q.value = 2.4;

      this.sawGain = this.ctx.createGain();
      this.sawGain.gain.value = 0.0001;

      this.sawNode.connect(this.sawFilter);
      this.sawFilter.connect(this.sawGain);
      this.sawGain.connect(this.ctx.destination);
      this.sawNode.start();

      // Warm candle fire crackle/rumble
      this.fireNode = this.ctx.createBufferSource();
      this.fireNode.buffer = this.noiseBuffer;
      this.fireNode.loop = true;

      const fireFilter = this.ctx.createBiquadFilter();
      fireFilter.type = 'lowpass';
      fireFilter.frequency.value = 340;

      this.fireGain = this.ctx.createGain();
      this.fireGain.gain.value = 0.0001;

      this.fireNode.connect(fireFilter);
      fireFilter.connect(this.fireGain);
      this.fireGain.connect(this.ctx.destination);
      this.fireNode.start();
    }

    ensureRunning() {
      if (!this.ctx) return false;
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      return this.ctx.state === 'running';
    }

    updateContinuous(isSawing, sawSpeedPhase, glowAmount) {
      if (!this.ensureRunning() || !this.sawGain || !this.fireGain) return;
      const now = this.ctx.currentTime;

      if (isSawing) {
        // Rhythmic back-and-forth sawing cadence
        const stroke = Math.abs(Math.sin(sawSpeedPhase));
        const targetGain = 0.04 + stroke * 0.14;
        const targetFreq = 420 + stroke * 580;
        this.sawGain.gain.setTargetAtTime(targetGain, now, 0.015);
        this.sawFilter.frequency.setTargetAtTime(targetFreq, now, 0.015);
      } else {
        this.sawGain.gain.setTargetAtTime(0.0001, now, 0.03);
      }

      if (glowAmount > 0.05) {
        this.fireGain.gain.setTargetAtTime(glowAmount * 0.09, now, 0.08);
        if (Math.random() < 0.08 * glowAmount) {
          this.playCrackle();
        }
      } else {
        this.fireGain.gain.setTargetAtTime(0.0001, now, 0.08);
      }
    }

    playKnifePlunge() {
      if (!this.ensureRunning()) return;
      const now = this.ctx.currentTime;

      // Crisp metallic + fibrous stab
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(68, now + 0.09);
      g.gain.setValueAtTime(0.22, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.11);

      if (this.noiseBuffer) {
        const n = this.ctx.createBufferSource();
        n.buffer = this.noiseBuffer;
        const f = this.ctx.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.setValueAtTime(1100, now);
        const ng = this.ctx.createGain();
        ng.gain.setValueAtTime(0.18, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        n.connect(f);
        f.connect(ng);
        ng.connect(this.ctx.destination);
        n.start(now);
        n.stop(now + 0.08);
      }
    }

    playPopOut(pitchScale = 1.0) {
      if (!this.ensureRunning()) return;
      const now = this.ctx.currentTime;

      // Hollow wet pumpkin pop
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(135 * pitchScale, now);
      osc.frequency.exponentialRampToValueAtTime(340 * pitchScale, now + 0.065);
      osc.frequency.exponentialRampToValueAtTime(95 * pitchScale, now + 0.16);

      gain.gain.setValueAtTime(0.01, now);
      gain.gain.linearRampToValueAtTime(0.32, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.19);

      // Wooden table thud bounce 260ms later
      const thudTime = now + 0.25;
      const thud = this.ctx.createOscillator();
      const thudGain = this.ctx.createGain();
      thud.type = 'sine';
      thud.frequency.setValueAtTime(115 * pitchScale, thudTime);
      thud.frequency.exponentialRampToValueAtTime(42, thudTime + 0.11);
      thudGain.gain.setValueAtTime(0.18, thudTime);
      thudGain.gain.exponentialRampToValueAtTime(0.001, thudTime + 0.12);
      thud.connect(thudGain);
      thudGain.connect(this.ctx.destination);
      thud.start(thudTime);
      thud.stop(thudTime + 0.13);
    }

    playPumpkinDrop() {
      if (!this.ensureRunning()) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(38, now + 0.22);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    playCandleIgnite() {
      if (!this.ensureRunning()) return;
      const now = this.ctx.currentTime;

      // Match strike scratch + warm flame whoosh
      if (this.noiseBuffer) {
        const scratch = this.ctx.createBufferSource();
        scratch.buffer = this.noiseBuffer;
        const sf = this.ctx.createBiquadFilter();
        sf.type = 'highpass';
        sf.frequency.setValueAtTime(2200, now);
        const sg = this.ctx.createGain();
        sg.gain.setValueAtTime(0.2, now);
        sg.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        scratch.connect(sf);
        sf.connect(sg);
        sg.connect(this.ctx.destination);
        scratch.start(now);
        scratch.stop(now + 0.1);

        const whoosh = this.ctx.createBufferSource();
        whoosh.buffer = this.noiseBuffer;
        const wf = this.ctx.createBiquadFilter();
        wf.type = 'bandpass';
        wf.frequency.setValueAtTime(520, now + 0.08);
        wf.frequency.exponentialRampToValueAtTime(160, now + 0.65);
        wf.Q.value = 1.3;
        const wg = this.ctx.createGain();
        wg.gain.setValueAtTime(0.001, now + 0.06);
        wg.gain.linearRampToValueAtTime(0.34, now + 0.16);
        wg.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        whoosh.connect(wf);
        wf.connect(wg);
        wg.connect(this.ctx.destination);
        whoosh.start(now + 0.06);
        whoosh.stop(now + 0.72);
      }

      // Magical Halloween warm shimmer chord (D minor add9 / mysterious glow)
      const freqs = [146.83, 220.0, 261.63, 329.63, 440.0, 587.33];
      freqs.forEach((f, idx) => {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(f, now + 0.12 + idx * 0.04);
        g.gain.setValueAtTime(0.0001, now + 0.12 + idx * 0.04);
        g.gain.linearRampToValueAtTime(0.045, now + 0.55 + idx * 0.04);
        g.gain.exponentialRampToValueAtTime(0.0005, now + 4.5);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(now + 0.12 + idx * 0.04);
        osc.stop(now + 4.6);
      });
    }

    playCrackle() {
      if (!this.ensureRunning() || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;
      const src = this.ctx.createBufferSource();
      src.buffer = this.noiseBuffer;
      const f = this.ctx.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.setValueAtTime(2800 + Math.random() * 2000, now);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.05 + Math.random() * 0.06, now);
      g.gain.exponentialRampToValueAtTime(0.0008, now + 0.025);
      src.connect(f);
      f.connect(g);
      g.connect(this.ctx.destination);
      src.start(now);
      src.stop(now + 0.03);
    }
  }

  const sound = new SoundEngine();

  // ============================================================================
  // JACK-O'-LANTERN FACE DESIGN & GEOMETRY
  // ============================================================================
  // Pumpkin center is (540, 575)
  const PUMPKIN_CX = 540;
  const PUMPKIN_CY = 575;

  // Five distinct, expressive carved cutouts with sharp vertices & dense sub-segments
  const RAW_SHAPES = [
    {
      name: 'leftEye',
      startTime: 1.1,
      endTime: 3.4,
      pitch: 1.15,
      popVel: { vx: -210, vy: -340, vr: -3.2 },
      points: [
        [305, 488], [332, 412], [382, 434], [412, 388],
        [478, 486], [420, 508], [358, 496]
      ]
    },
    {
      name: 'rightEye',
      startTime: 3.6,
      endTime: 5.9,
      pitch: 1.08,
      popVel: { vx: 220, vy: -330, vr: 3.4 },
      points: [
        [775, 488], [748, 412], [698, 434], [668, 388],
        [602, 486], [660, 508], [722, 496]
      ]
    },
    {
      name: 'foreheadGem',
      startTime: 6.1,
      endTime: 7.7,
      pitch: 1.38,
      popVel: { vx: -40, vy: -410, vr: 4.5 },
      points: [
        [540, 326], [574, 376], [540, 402], [506, 376]
      ]
    },
    {
      name: 'batNose',
      startTime: 7.9,
      endTime: 9.7,
      pitch: 1.24,
      popVel: { vx: 65, vy: -310, vr: -2.8 },
      points: [
        [540, 466], [592, 540], [558, 534], [540, 562],
        [522, 534], [488, 540]
      ]
    },
    {
      name: 'wickedGrin',
      startTime: 9.9,
      endTime: 13.8,
      pitch: 0.78,
      popVel: { vx: 30, vy: -270, vr: 1.6 },
      points: [
        // Upper lip left-to-right with sharp fangs
        [276, 602],
        [345, 650],
        [398, 636],
        [416, 704], // Upper Left Fang tip
        [446, 646],
        [516, 656],
        [540, 712], // Center Fang tip
        [564, 656],
        [634, 646],
        [664, 704], // Upper Right Fang tip
        [682, 636],
        [735, 650],
        [804, 602],
        // Right corner & lower lip right-to-left with lower fangs
        [768, 718],
        [706, 774],
        [684, 720], // Lower Right Fang tip
        [652, 792],
        [585, 814],
        [540, 766], // Lower Center notch
        [495, 814],
        [428, 792],
        [396, 720], // Lower Left Fang tip
        [374, 774],
        [312, 718]
      ]
    }
  ];

  // Precompute dense path perimeter lookup for smooth knife tracking & partial path drawing
  const SHAPES = RAW_SHAPES.map((s) => {
    const pts = s.points;
    const segments = [];
    let totalLen = 0;
    let cx = 0, cy = 0;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i];
      const b = pts[(i + 1) % pts.length];
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const len = Math.hypot(dx, dy);
      segments.push({
        x1: a[0], y1: a[1],
        x2: b[0], y2: b[1],
        dx, dy, len,
        startDist: totalLen,
        angle: Math.atan2(dy, dx)
      });
      totalLen += len;
      cx += a[0];
      cy += a[1];
    }
    cx /= pts.length;
    cy /= pts.length;

    // Local coordinates relative to shape centroid for 3D tumbling pop-out piece
    const localPts = pts.map(p => [p[0] - cx, p[1] - cy]);

    return {
      ...s,
      cx,
      cy,
      localPts,
      segments,
      totalLen,
      popped: false,
      plunged: false
    };
  });

  function samplePointAlongShape(shape, progress) {
    const targetDist = Math.max(0, Math.min(1, progress)) * shape.totalLen;
    for (let i = 0; i < shape.segments.length; i++) {
      const seg = shape.segments[i];
      if (targetDist <= seg.startDist + seg.len || i === shape.segments.length - 1) {
        const localT = seg.len > 0 ? (targetDist - seg.startDist) / seg.len : 0;
        return {
          x: seg.x1 + seg.dx * localT,
          y: seg.y1 + seg.dy * localT,
          angle: seg.angle,
          segIndex: i,
          localT
        };
      }
    }
    return { x: shape.points[0][0], y: shape.points[0][1], angle: 0, segIndex: 0, localT: 0 };
  }

  // ============================================================================
  // PARTICLES, POPPED CUTOUT PIECES & BACKGROUND ELEMENTS
  // ============================================================================
  const particles = [];
  const poppedPieces = [];
  const stars = [];
  const fireflies = [];
  const tableSeeds = [];

  for (let i = 0; i < 65; i++) {
    stars.push({
      x: Math.random() * 1400 - 160,
      y: Math.random() * 680 - 100,
      r: 0.8 + Math.random() * 2.2,
      phase: Math.random() * Math.PI * 2,
      speed: 1.5 + Math.random() * 2.5
    });
  }

  for (let i = 0; i < 28; i++) {
    fireflies.push({
      x: Math.random() * 1200 - 60,
      y: 120 + Math.random() * 760,
      vx: (Math.random() - 0.5) * 28,
      vy: -12 - Math.random() * 22,
      r: 2.2 + Math.random() * 3.5,
      phase: Math.random() * Math.PI * 2,
      hue: Math.random() > 0.3 ? 38 : 16
    });
  }

  for (let i = 0; i < 18; i++) {
    const angle = (i / 18) * Math.PI * 2 + Math.random() * 0.2;
    const rx = 260 + Math.random() * 180;
    const ry = 45 + Math.random() * 55;
    tableSeeds.push({
      x: PUMPKIN_CX + Math.cos(angle) * rx,
      y: 855 + Math.sin(angle) * ry,
      rot: Math.random() * Math.PI * 2,
      scale: 0.8 + Math.random() * 0.45
    });
  }

  function spawnCarvingParticles(x, y, cutAngle) {
    for (let i = 0; i < 3; i++) {
      const spread = cutAngle + Math.PI + (Math.random() - 0.5) * 1.6;
      const spd = 90 + Math.random() * 230;
      const isSeed = Math.random() < 0.16;
      particles.push({
        type: isSeed ? 'seed' : 'pulp',
        x,
        y,
        vx: Math.cos(spread) * spd + (Math.random() - 0.5) * 60,
        vy: Math.sin(spread) * spd - 90 - Math.random() * 90,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 14,
        size: isSeed ? 7 + Math.random() * 4 : 3.5 + Math.random() * 6.5,
        color: isSeed
          ? '#FFF0B8'
          : (Math.random() > 0.45 ? '#FF6D00' : '#FFB300'),
        life: 0,
        maxLife: 0.55 + Math.random() * 0.45,
        gravity: 780
      });
    }
  }

  function spawnPopBurst(cx, cy) {
    for (let i = 0; i < 22; i++) {
      const a = (i / 22) * Math.PI * 2 + Math.random() * 0.3;
      const spd = 80 + Math.random() * 240;
      particles.push({
        type: i % 4 === 0 ? 'seed' : 'pulp',
        x: cx + Math.cos(a) * 18,
        y: cy + Math.sin(a) * 18,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd - 120,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 16,
        size: 5 + Math.random() * 6,
        color: i % 2 === 0 ? '#FF8F00' : '#FF3D00',
        life: 0,
        maxLife: 0.65 + Math.random() * 0.4,
        gravity: 740
      });
    }
  }

  function spawnPoppedPiece(shape) {
    poppedPieces.push({
      cx: shape.cx,
      cy: shape.cy,
      x: shape.cx,
      y: shape.cy,
      z: 1,
      vx: shape.popVel.vx,
      vy: shape.popVel.vy,
      vz: 1.45,
      rot: 0,
      vrot: shape.popVel.vr,
      tilt: 0.15,
      vtilt: (Math.random() - 0.5) * 6,
      localPts: shape.localPts,
      bounced: false,
      alpha: 1,
      age: 0
    });
  }

  // ============================================================================
  // TIMELINE & CYCLE MANAGEMENT (~21.5 SECONDS LOOP)
  // ============================================================================
  const CYCLE_DURATION = 21.5;
  let cycleTime = 0;
  let lastTimestamp = performance.now();
  let dropPlayed = false;
  let candleIgnited = false;

  function resetCycle() {
    cycleTime = 0;
    dropPlayed = false;
    candleIgnited = false;
    poppedPieces.length = 0;
    particles.length = 0;
    SHAPES.forEach(s => {
      s.popped = false;
      s.plunged = false;
    });
  }

  // ============================================================================
  // DRAWING HELPERS
  // ============================================================================
  function tracePolygon(points) {
    if (!points.length) return;
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
  }

  function tracePartialShape(shape, progress) {
    const targetDist = Math.max(0, Math.min(1, progress)) * shape.totalLen;
    ctx.beginPath();
    ctx.moveTo(shape.points[0][0], shape.points[0][1]);
    for (let i = 0; i < shape.segments.length; i++) {
      const seg = shape.segments[i];
      if (targetDist >= seg.startDist + seg.len) {
        ctx.lineTo(seg.x2, seg.y2);
      } else if (targetDist > seg.startDist) {
        const t = (targetDist - seg.startDist) / seg.len;
        ctx.lineTo(seg.x1 + seg.dx * t, seg.y1 + seg.dy * t);
        break;
      } else {
        break;
      }
    }
  }

  // Defines the outer silhouette of the plump ribbed pumpkin
  function tracePumpkinBodyPath(cx, cy, rx, ry) {
    ctx.beginPath();
    // Top center indent under the stem
    ctx.moveTo(cx, cy - ry * 0.90);
    // Right side multi-lobed plump curve
    ctx.bezierCurveTo(cx + rx * 0.52, cy - ry * 1.07, cx + rx * 1.06, cy - ry * 0.66, cx + rx * 1.04, cy - ry * 0.02);
    ctx.bezierCurveTo(cx + rx * 1.02, cy + ry * 0.68, cx + rx * 0.56, cy + ry * 1.05, cx, cy + ry * 0.95);
    // Left side multi-lobed plump curve
    ctx.bezierCurveTo(cx - rx * 0.56, cy + ry * 1.05, cx - rx * 1.02, cy + ry * 0.68, cx - rx * 1.04, cy - ry * 0.02);
    ctx.bezierCurveTo(cx - rx * 1.06, cy - ry * 0.66, cx - rx * 0.52, cy - ry * 1.07, cx, cy - ry * 0.90);
    ctx.closePath();
  }

  function drawBackground(time, glowIntensity, darknessFactor) {
    // Rich twilight violet-indigo sky transitioning to deep midnight when the candle lights
    const skyGrad = ctx.createLinearGradient(0, -offsetY, 0, 900);
    if (darknessFactor < 0.5) {
      skyGrad.addColorStop(0, '#09021C');
      skyGrad.addColorStop(0.5, '#1D0B46');
      skyGrad.addColorStop(0.85, '#3E135C');
      skyGrad.addColorStop(1, '#5A1B52');
    } else {
      skyGrad.addColorStop(0, '#04010C');
      skyGrad.addColorStop(0.55, '#0F0529');
      skyGrad.addColorStop(1, '#240B3B');
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(-offsetX - 50, -offsetY - 50, vw + 100, vh + 100);

    // Darkening overlay during candle phase so the glowing pumpkin pops with maximum saturation
    if (darknessFactor > 0) {
      ctx.fillStyle = `rgba(3, 1, 10, ${darknessFactor * 0.55})`;
      ctx.fillRect(-offsetX - 50, -offsetY - 50, vw + 100, vh + 100);
    }

    // Luminous Harvest Moon in upper left
    ctx.save();
    const moonX = 165;
    const moonY = 165;
    const moonHalo = ctx.createRadialGradient(moonX, moonY, 30, moonX, moonY, 210);
    moonHalo.addColorStop(0, `rgba(255, 240, 180, ${0.42 - darknessFactor * 0.15})`);
    moonHalo.addColorStop(0.5, `rgba(186, 120, 255, ${0.16 - darknessFactor * 0.06})`);
    moonHalo.addColorStop(1, 'rgba(186, 120, 255, 0)');
    ctx.fillStyle = moonHalo;
    ctx.beginPath();
    ctx.arc(moonX, moonY, 210, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#FFF7D6';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 54, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Twinkling stars
    ctx.save();
    stars.forEach(st => {
      const tw = 0.35 + 0.65 * Math.sin(time * st.speed + st.phase);
      ctx.fillStyle = `rgba(255, 247, 220, ${tw * (0.75 + darknessFactor * 0.25)})`;
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();

    // Spooky gnarled silhouette hills & twisted branches in background
    ctx.save();
    ctx.fillStyle = '#0D0421';
    ctx.beginPath();
    ctx.moveTo(-300, 820);
    ctx.quadraticCurveTo(120, 710, 480, 775);
    ctx.quadraticCurveTo(860, 830, 1380, 720);
    ctx.lineTo(1380, 920);
    ctx.lineTo(-300, 920);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Rustic wooden carving table at the bottom
    const tableTopY = 790;
    const tableGrad = ctx.createLinearGradient(0, tableTopY, 0, 1200);
    tableGrad.addColorStop(0, '#2B1321');
    tableGrad.addColorStop(0.25, '#1F0C18');
    tableGrad.addColorStop(1, '#0C040A');
    ctx.fillStyle = tableGrad;
    ctx.fillRect(-offsetX - 50, tableTopY, vw + 100, vh - tableTopY + offsetY + 100);

    // Table top rim highlight & wood plank lines
    ctx.strokeStyle = 'rgba(255, 160, 90, 0.14)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-offsetX, tableTopY);
    ctx.lineTo(vw, tableTopY);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(12, 4, 10, 0.55)';
    ctx.lineWidth = 4;
    for (let y = tableTopY + 55; y < 1080; y += 65) {
      ctx.beginPath();
      ctx.moveTo(-offsetX, y);
      ctx.bezierCurveTo(360, y + 8, 720, y - 8, vw, y + 4);
      ctx.stroke();
    }

    // Warm golden candlelight pool on the wooden table when lit
    if (glowIntensity > 0.01) {
      const tableGlow = ctx.createRadialGradient(PUMPKIN_CX, 865, 20, PUMPKIN_CX, 895, 520);
      tableGlow.addColorStop(0, `rgba(255, 165, 0, ${0.62 * glowIntensity})`);
      tableGlow.addColorStop(0.45, `rgba(255, 80, 0, ${0.28 * glowIntensity})`);
      tableGlow.addColorStop(1, 'rgba(255, 40, 0, 0)');
      ctx.fillStyle = tableGlow;
      ctx.beginPath();
      ctx.ellipse(PUMPKIN_CX, 890, 520, 145, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Ambient shadow directly beneath the pumpkin
    const baseShadow = ctx.createRadialGradient(PUMPKIN_CX, 845, 40, PUMPKIN_CX, 845, 360);
    baseShadow.addColorStop(0, 'rgba(4, 1, 8, 0.92)');
    baseShadow.addColorStop(0.65, 'rgba(10, 2, 16, 0.55)');
    baseShadow.addColorStop(1, 'rgba(10, 2, 16, 0)');
    ctx.fillStyle = baseShadow;
    ctx.beginPath();
    ctx.ellipse(PUMPKIN_CX, 848, 355, 68, 0, 0, Math.PI * 2);
    ctx.fill();

    // Scattered pumpkin seeds on the table
    tableSeeds.forEach(s => {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.scale(s.scale, s.scale);
      ctx.fillStyle = glowIntensity > 0.1 ? '#FFE082' : '#D7B889';
      ctx.beginPath();
      ctx.ellipse(0, 0, 10, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8D6E63';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
    });
  }

  function drawStem(cx, topY, glowIntensity) {
    ctx.save();
    ctx.beginPath();
    // Base of stem sitting in the top notch of the pumpkin
    ctx.moveTo(cx - 56, topY + 18);
    ctx.bezierCurveTo(cx - 42, topY - 65, cx - 8, topY - 128, cx + 48, topY - 152);
    ctx.lineTo(cx + 76, topY - 122);
    ctx.bezierCurveTo(cx + 32, topY - 88, cx + 38, topY - 35, cx + 62, topY + 18);
    ctx.closePath();

    const stemGrad = ctx.createLinearGradient(cx - 50, topY - 140, cx + 70, topY + 20);
    stemGrad.addColorStop(0, '#8BC34A');
    stemGrad.addColorStop(0.35, '#558B2F');
    stemGrad.addColorStop(0.75, '#33691E');
    stemGrad.addColorStop(1, '#1B3B0E');
    ctx.fillStyle = stemGrad;
    ctx.fill();

    ctx.lineWidth = 5;
    ctx.strokeStyle = '#172E0B';
    ctx.stroke();

    // Woody ridges on the stem
    ctx.strokeStyle = 'rgba(197, 225, 165, 0.35)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(cx - 32, topY + 10);
    ctx.quadraticCurveTo(cx - 18, topY - 68, cx + 52, topY - 142);
    ctx.moveTo(cx - 5, topY + 14);
    ctx.quadraticCurveTo(cx + 4, topY - 58, cx + 62, topY - 130);
    ctx.stroke();

    // Curled tendril vine
    ctx.strokeStyle = '#689F38';
    ctx.lineWidth = 4.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - 38, topY - 4);
    ctx.bezierCurveTo(cx - 95, topY - 48, cx - 135, topY + 10, cx - 98, topY + 26);
    ctx.bezierCurveTo(cx - 72, topY + 36, cx - 68, topY - 8, cx - 95, topY - 6);
    ctx.stroke();

    if (glowIntensity > 0.05) {
      ctx.strokeStyle = `rgba(255, 193, 7, ${glowIntensity * 0.45})`;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 52, topY + 14);
      ctx.quadraticCurveTo(cx, topY + 28, cx + 58, topY + 14);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPumpkinExterior(cx, cy, rx, ry, glowIntensity, darknessFactor) {
    ctx.save();
    tracePumpkinBodyPath(cx, cy, rx, ry);
    ctx.clip();

    // Base vivid saturated pumpkin gradient
    const bodyGrad = ctx.createRadialGradient(
      cx - rx * 0.22,
      cy - ry * 0.28,
      rx * 0.08,
      cx,
      cy + ry * 0.08,
      rx * 1.12
    );

    if (glowIntensity > 0.05) {
      // Subsurface warm internal glow combined with dramatic dark contrast on outer edges
      bodyGrad.addColorStop(0, '#FFAB00');
      bodyGrad.addColorStop(0.32, '#FF6D00');
      bodyGrad.addColorStop(0.68, '#E63900');
      bodyGrad.addColorStop(0.9, '#871400');
      bodyGrad.addColorStop(1, '#3D0500');
    } else {
      bodyGrad.addColorStop(0, '#FFCA28');
      bodyGrad.addColorStop(0.26, '#FF8F00');
      bodyGrad.addColorStop(0.62, '#FF5722');
      bodyGrad.addColorStop(0.88, '#C41C00');
      bodyGrad.addColorStop(1, '#6D0900');
    }

    ctx.fillStyle = bodyGrad;
    ctx.fillRect(cx - rx * 1.2, cy - ry * 1.2, rx * 2.4, ry * 2.4);

    // Sculptural vertical lobes / ribs (from outer edges toward center)
    const ribFactors = [-0.82, -0.54, -0.26, 0, 0.26, 0.54, 0.82];
    for (let i = 0; i < ribFactors.length; i++) {
      const f = ribFactors[i];
      if (f === 0) continue;
      // Crease shadow
      ctx.beginPath();
      ctx.moveTo(cx + f * rx * 0.28, cy - ry * 0.92);
      ctx.bezierCurveTo(
        cx + f * rx * 1.08, cy - ry * 0.48,
        cx + f * rx * 1.08, cy + ry * 0.48,
        cx + f * rx * 0.30, cy + ry * 0.96
      );
      ctx.strokeStyle = 'rgba(75, 8, 0, 0.42)';
      ctx.lineWidth = 18;
      ctx.stroke();

      // Adjacent specular ridge highlight
      const hf = f * 0.93;
      ctx.beginPath();
      ctx.moveTo(cx + hf * rx * 0.28, cy - ry * 0.90);
      ctx.bezierCurveTo(
        cx + hf * rx * 1.05, cy - ry * 0.45,
        cx + hf * rx * 1.05, cy + ry * 0.45,
        cx + hf * rx * 0.30, cy + ry * 0.94
      );
      ctx.strokeStyle = 'rgba(255, 215, 110, 0.22)';
      ctx.lineWidth = 10;
      ctx.stroke();
    }

    // Glossy specular highlight on top-left lobe
    const specGrad = ctx.createRadialGradient(cx - 145, cy - 115, 10, cx - 145, cy - 115, 165);
    specGrad.addColorStop(0, `rgba(255, 245, 190, ${0.42 - darknessFactor * 0.18})`);
    specGrad.addColorStop(1, 'rgba(255, 245, 190, 0)');
    ctx.fillStyle = specGrad;
    ctx.beginPath();
    ctx.arc(cx - 145, cy - 115, 165, 0, Math.PI * 2);
    ctx.fill();

    // Cool moonlight rim light on left edge
    ctx.strokeStyle = `rgba(215, 180, 255, ${0.38 - darknessFactor * 0.12})`;
    ctx.lineWidth = 14;
    tracePumpkinBodyPath(cx + 6, cy + 2, rx, ry);
    ctx.stroke();

    // Subsurface candle glow radiating through the pumpkin skin around the face
    if (glowIntensity > 0.01) {
      const sssGrad = ctx.createRadialGradient(cx, cy + 35, 30, cx, cy + 35, rx * 0.85);
      sssGrad.addColorStop(0, `rgba(255, 210, 0, ${0.42 * glowIntensity})`);
      sssGrad.addColorStop(0.55, `rgba(255, 90, 0, ${0.25 * glowIntensity})`);
      sssGrad.addColorStop(1, 'rgba(255, 30, 0, 0)');
      ctx.fillStyle = sssGrad;
      ctx.fillRect(cx - rx, cy - ry, rx * 2, ry * 2);
    }

    ctx.restore();

    // Crisp outer contour
    ctx.save();
    tracePumpkinBodyPath(cx, cy, rx, ry);
    ctx.lineWidth = 6;
    ctx.strokeStyle = '#330600';
    ctx.stroke();
    ctx.restore();
  }

  // Draws the popped-out holes, their thick 3D inner rind walls, and the interior candle/firelight
  function drawCutoutHolesAndInterior(time, glowIntensity, candleDropProgress) {
    const poppedShapes = SHAPES.filter(s => s.popped);
    if (poppedShapes.length === 0) return;

    // 1. For each popped shape, draw the 3D thickness of the carved pumpkin rind
    //    angled slightly toward the center of the pumpkin so it looks genuinely 3D.
    poppedShapes.forEach(shape => {
      const innerPts = shape.points.map(p => {
        const dx = PUMPKIN_CX - p[0];
        const dy = (PUMPKIN_CY + 30) - p[1];
        return [p[0] + dx * 0.085, p[1] + dy * 0.085 + 6];
      });

      // Clip to outer hole polygon so only the inward-facing rind wall and hollow interior show
      ctx.save();
      tracePolygon(shape.points);
      ctx.clip();

      // Deep interior cavity background (unlit dark maroon-brown -> blazing fire when lit)
      if (glowIntensity <= 0.02) {
        const cavGrad = ctx.createRadialGradient(PUMPKIN_CX, PUMPKIN_CY + 60, 20, PUMPKIN_CX, PUMPKIN_CY + 40, 320);
        cavGrad.addColorStop(0, '#3E1208');
        cavGrad.addColorStop(0.7, '#220703');
        cavGrad.addColorStop(1, '#110200');
        ctx.fillStyle = cavGrad;
        ctx.fillRect(150, 250, 780, 620);

        // Subtle fibrous interior pumpkin ribs visible inside the dark cavity
        ctx.strokeStyle = 'rgba(95, 28, 10, 0.45)';
        ctx.lineWidth = 6;
        for (let r = -220; r <= 220; r += 55) {
          ctx.beginPath();
          ctx.moveTo(PUMPKIN_CX + r * 0.4, PUMPKIN_CY - 220);
          ctx.quadraticCurveTo(PUMPKIN_CX + r * 1.15, PUMPKIN_CY + 30, PUMPKIN_CX + r * 0.5, PUMPKIN_CY + 260);
          ctx.stroke();
        }
      } else {
        // Blazing incandescent interior when the candle lights it from inside!
        const flickerX = Math.sin(time * 23) * 8 + Math.cos(time * 37) * 5;
        const flickerY = Math.cos(time * 29) * 7;
        const fireGrad = ctx.createRadialGradient(
          PUMPKIN_CX + flickerX,
          PUMPKIN_CY + 70 + flickerY,
          18,
          PUMPKIN_CX,
          PUMPKIN_CY + 20,
          360
        );
        fireGrad.addColorStop(0, '#FFFFFF');
        fireGrad.addColorStop(0.22, '#FFF176');
        fireGrad.addColorStop(0.52, '#FFB300');
        fireGrad.addColorStop(0.82, '#FF3D00');
        fireGrad.addColorStop(1, '#9A0007');
        ctx.fillStyle = fireGrad;
        ctx.fillRect(150, 250, 780, 620);
      }

      // Draw the wax candle & dancing flame inside the cavity (visible through nose/grin/eyes)
      if (candleDropProgress > 0) {
        const dropOffset = (1 - Math.min(1, candleDropProgress)) * -240;
        const candleX = PUMPKIN_CX;
        const candleTopY = 678 + dropOffset;

        // Ivory wax pillar
        const waxGrad = ctx.createLinearGradient(candleX - 28, candleTopY, candleX + 28, candleTopY);
        waxGrad.addColorStop(0, '#FFF8E1');
        waxGrad.addColorStop(0.5, '#FFE082');
        waxGrad.addColorStop(1, '#FFB300');
        ctx.fillStyle = waxGrad;
        ctx.beginPath();
        ctx.roundRect(candleX - 26, candleTopY, 52, 130, 8);
        ctx.fill();

        // Wick
        ctx.strokeStyle = '#261405';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(candleX, candleTopY);
        ctx.lineTo(candleX + 2, candleTopY - 14);
        ctx.stroke();

        // Dancing multi-layered flame once ignited
        if (glowIntensity > 0.05) {
          const sway = Math.sin(time * 19) * 9 + Math.cos(time * 31) * 4;
          const stretch = 1 + Math.sin(time * 27) * 0.14;
          const fx = candleX + sway * 0.25;
          const fy = candleTopY - 12;

          // Outer orange flame
          ctx.fillStyle = '#FF6D00';
          ctx.beginPath();
          ctx.moveTo(fx, fy - 76 * stretch);
          ctx.bezierCurveTo(fx + 34, fy - 35, fx + 28, fy + 8, fx, fy + 8);
          ctx.bezierCurveTo(fx - 28, fy + 8, fx - 34, fy - 35, fx, fy - 76 * stretch);
          ctx.fill();

          // Inner white-gold core
          ctx.fillStyle = '#FFFFCC';
          ctx.beginPath();
          ctx.moveTo(fx + sway * 0.15, fy - 52 * stretch);
          ctx.bezierCurveTo(fx + 18, fy - 22, fx + 14, fy + 4, fx, fy + 4);
          ctx.bezierCurveTo(fx - 14, fy + 4, fx - 18, fy - 22, fx + sway * 0.15, fy - 52 * stretch);
          ctx.fill();
        }
      }

      // Draw each 3D rind bevel quad around the perimeter of the cutout
      const n = shape.points.length;
      for (let i = 0; i < n; i++) {
        const p1 = shape.points[i];
        const p2 = shape.points[(i + 1) % n];
        const q2 = innerPts[(i + 1) % n];
        const q1 = innerPts[i];

        // Normal direction to shade top/bottom/side bevels realistically
        const nx = -(p2[1] - p1[1]);
        const ny = p2[0] - p1[0];
        const lightDot = (nx * 0.2 + ny * -0.8) / (Math.hypot(nx, ny) || 1);

        ctx.beginPath();
        ctx.moveTo(p1[0], p1[1]);
        ctx.lineTo(p2[0], p2[1]);
        ctx.lineTo(q2[0], q2[1]);
        ctx.lineTo(q1[0], q1[1]);
        ctx.closePath();

        if (glowIntensity > 0.05) {
          // Glowing golden-orange inner rind catching the candle fire
          ctx.fillStyle = lightDot > 0 ? '#FFD54F' : '#FF8F00';
        } else {
          // Freshly cut pale yellow-orange pumpkin flesh
          ctx.fillStyle = lightDot > 0 ? '#FFCC80' : '#E67E22';
        }
        ctx.fill();
        ctx.strokeStyle = glowIntensity > 0.05 ? '#FF6F00' : '#BF5600';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }

      // Crisp outer cut rim
      tracePolygon(shape.points);
      ctx.strokeStyle = glowIntensity > 0.05 ? '#FFF59D' : '#FFE0B2';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      ctx.restore();
    });
  }

  // Draws volumetric god-rays and intense bloom pouring from the carved face when lit
  function drawVolumetricGlow(time, glowIntensity) {
    if (glowIntensity <= 0.01) return;

    const flicker = 0.92 + 0.08 * Math.sin(time * 24) * Math.cos(time * 17);
    const power = glowIntensity * flicker;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // Volumetric light cones projecting outward from each cutout
    SHAPES.forEach(shape => {
      if (!shape.popped) return;
      const rayGrad = ctx.createRadialGradient(
        shape.cx, shape.cy, 10,
        shape.cx, shape.cy, 240
      );
      rayGrad.addColorStop(0, `rgba(255, 245, 157, ${0.75 * power})`);
      rayGrad.addColorStop(0.35, `rgba(255, 152, 0, ${0.42 * power})`);
      rayGrad.addColorStop(0.7, `rgba(255, 61, 0, ${0.16 * power})`);
      rayGrad.addColorStop(1, 'rgba(255, 0, 85, 0)');

      ctx.fillStyle = rayGrad;
      ctx.save();
      // Expand polygon slightly for soft bloom halo around every cutout
      ctx.translate(shape.cx, shape.cy);
      ctx.scale(1.22, 1.22);
      ctx.translate(-shape.cx, -shape.cy);
      tracePolygon(shape.points);
      ctx.fill();
      ctx.restore();

      // Broad radial glow cone
      ctx.fillStyle = rayGrad;
      ctx.beginPath();
      ctx.arc(shape.cx, shape.cy, 230, 0, Math.PI * 2);
      ctx.fill();
    });

    // Overall super-saturated warm aura enveloping the entire Jack-o'-lantern
    const masterAura = ctx.createRadialGradient(PUMPKIN_CX, PUMPKIN_CY + 30, 60, PUMPKIN_CX, PUMPKIN_CY + 30, 560);
    masterAura.addColorStop(0, `rgba(255, 215, 64, ${0.38 * power})`);
    masterAura.addColorStop(0.45, `rgba(255, 109, 0, ${0.22 * power})`);
    masterAura.addColorStop(0.8, `rgba(213, 0, 249, ${0.08 * power})`);
    masterAura.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = masterAura;
    ctx.beginPath();
    ctx.arc(PUMPKIN_CX, PUMPKIN_CY + 30, 560, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Draws progressive knife cut grooves while a piece is still being carved
  function drawActiveCutGrooves() {
    SHAPES.forEach(shape => {
      if (shape.popped) return;
      if (cycleTime <= shape.startTime) return;

      const progress = Math.min(1, (cycleTime - shape.startTime) / (shape.endTime - shape.startTime));
      if (progress <= 0) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Outer pale orange flesh bevel along the slit
      tracePartialShape(shape, progress);
      ctx.strokeStyle = '#FFD180';
      ctx.lineWidth = 11;
      ctx.stroke();

      // Deep dark-orange kerf shadow where the blade has sliced through
      tracePartialShape(shape, progress);
      ctx.strokeStyle = '#2B0500';
      ctx.lineWidth = 5.5;
      ctx.stroke();
      ctx.restore();
    });
  }

  // Draws the 3D popped pumpkin pieces flying out and bouncing on the table
  function updateAndDrawPoppedPieces(dt) {
    for (let i = poppedPieces.length - 1; i >= 0; i--) {
      const p = poppedPieces[i];
      p.age += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 980 * dt; // Gravity
      p.z += p.vz * dt;
      p.rot += p.vrot * dt;
      p.tilt += p.vtilt * dt;

      // Bounce off the foreground table
      const floorY = 935;
      if (p.y > floorY && !p.bounced) {
        p.y = floorY;
        p.vy = -p.vy * 0.42;
        p.vx *= 0.72;
        p.vrot *= 0.65;
        p.bounced = true;
      }

      if (p.age > 2.2) {
        p.alpha = Math.max(0, 1 - (p.age - 2.2) / 0.8);
      }
      if (p.alpha <= 0) {
        poppedPieces.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.translate(p.x, p.y);
      ctx.scale(Math.min(1.85, p.z), Math.min(1.85, p.z));
      ctx.rotate(p.rot);

      // 3D rind thickness offset based on tumble angle
      const thickX = Math.cos(p.tilt) * 18;
      const thickY = Math.sin(p.tilt) * 18 + 10;

      // Back face & side extruded walls (creamy yellow inner pumpkin flesh)
      ctx.fillStyle = '#FFE082';
      ctx.strokeStyle = '#FFB300';
      ctx.lineWidth = 2;
      const pts = p.localPts;
      for (let j = 0; j < pts.length; j++) {
        const a = pts[j];
        const b = pts[(j + 1) % pts.length];
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.lineTo(b[0] + thickX, b[1] + thickY);
        ctx.lineTo(a[0] + thickX, a[1] + thickY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      // Front orange skin face of the popped piece
      tracePolygon(pts);
      const skinGrad = ctx.createLinearGradient(-40, -40, 40, 40);
      skinGrad.addColorStop(0, '#FF9100');
      skinGrad.addColorStop(1, '#E65100');
      ctx.fillStyle = skinGrad;
      ctx.fill();
      ctx.strokeStyle = '#FFE0B2';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.restore();
    }
  }

  // Draws the gleaming carving knife with realistic sawing motion
  function drawCarvingKnife(time, x, y, cutAngle, isSawing, visibility) {
    if (visibility <= 0.01) return;

    ctx.save();
    ctx.globalAlpha = visibility;

    // Rhythmic back-and-forth sawing motion along the blade axis + slight wrist rock
    const sawPhase = time * 42;
    const thrust = isSawing ? Math.sin(sawPhase) * 16 : 0;
    const rock = isSawing ? Math.cos(sawPhase) * 0.07 : 0;

    // Orient the knife at an ergonomic 38-degree carving angle relative to the cut normal
    const knifeAngle = -0.68 + Math.sin(cutAngle) * 0.18 + rock;

    ctx.translate(x, y);
    ctx.rotate(knifeAngle);
    ctx.translate(thrust, 0);

    // Drop shadow cast by the knife onto the pumpkin surface
    ctx.save();
    ctx.translate(-8, 22);
    ctx.fillStyle = 'rgba(20, 2, 0, 0.42)';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(135, -20);
    ctx.lineTo(245, -14);
    ctx.lineTo(245, 22);
    ctx.lineTo(135, 16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Steel blade (tip is inserted into the pumpkin at (0,0), handle extends to +X)
    const bladeGrad = ctx.createLinearGradient(0, -22, 0, 22);
    bladeGrad.addColorStop(0, '#FFFFFF');
    bladeGrad.addColorStop(0.45, '#CFD8DC');
    bladeGrad.addColorStop(0.55, '#78909C');
    bladeGrad.addColorStop(1, '#ECEFF1');

    ctx.fillStyle = bladeGrad;
    ctx.beginPath();
    ctx.moveTo(-12, 0); // Buried tip inside the cut
    ctx.lineTo(132, -18);
    ctx.lineTo(132, 15);
    ctx.quadraticCurveTo(55, 17, -12, 0);
    ctx.closePath();
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = '#37474F';
    ctx.stroke();

    // Serrated carving teeth along the bottom edge of the blade
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let sx = 8; sx < 120; sx += 10) {
      ctx.moveTo(sx, 11);
      ctx.lineTo(sx + 5, 16);
      ctx.lineTo(sx + 10, 11);
    }
    ctx.stroke();

    // Orange pumpkin juice/pulp sheen near the tip of the blade
    ctx.fillStyle = 'rgba(255, 109, 0, 0.75)';
    ctx.beginPath();
    ctx.ellipse(8, 2, 16, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Polished brass bolster / guard
    const bolsterGrad = ctx.createLinearGradient(128, -26, 128, 26);
    bolsterGrad.addColorStop(0, '#FFF59D');
    bolsterGrad.addColorStop(0.5, '#FFB300');
    bolsterGrad.addColorStop(1, '#E65100');
    ctx.fillStyle = bolsterGrad;
    ctx.beginPath();
    ctx.roundRect(126, -24, 18, 46, 5);
    ctx.fill();
    ctx.strokeStyle = '#4E342E';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Ergonomic riveted mahogany wood handle
    const handleGrad = ctx.createLinearGradient(144, -22, 144, 24);
    handleGrad.addColorStop(0, '#8D3B1A');
    handleGrad.addColorStop(0.45, '#5D1F0A');
    handleGrad.addColorStop(1, '#2D0B02');
    ctx.fillStyle = handleGrad;
    ctx.beginPath();
    ctx.moveTo(144, -19);
    ctx.bezierCurveTo(188, -24, 238, -22, 268, -12);
    ctx.bezierCurveTo(280, -4, 280, 16, 266, 22);
    ctx.bezierCurveTo(232, 28, 188, 14, 144, 19);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1B0500';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Three brass rivets along the handle
    ctx.fillStyle = '#FFD54F';
    [168, 204, 240].forEach(rx => {
      ctx.beginPath();
      ctx.arc(rx, 0, 4.5, 0, Math.PI * 2);
      ctx.fill();
    });

    // Bright glint at the blade spine
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.lineTo(122, -15);
    ctx.stroke();

    ctx.restore();
  }

  function updateAndDrawParticles(dt, time, glowIntensity) {
    // Spawn rising golden embers when the jack-o'-lantern is glowing
    if (glowIntensity > 0.2 && Math.random() < 0.45) {
      const sourceShape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      particles.push({
        type: 'ember',
        x: sourceShape.cx + (Math.random() - 0.5) * 90,
        y: sourceShape.cy + (Math.random() - 0.5) * 40,
        vx: (Math.random() - 0.5) * 45,
        vy: -75 - Math.random() * 110,
        size: 2.5 + Math.random() * 4.5,
        color: Math.random() > 0.35 ? '#FFEE58' : '#FF6D00',
        life: 0,
        maxLife: 1.2 + Math.random() * 1.1,
        gravity: -25
      });
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.maxLife) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.gravity * dt;
      if (p.rot !== undefined) p.rot += p.vrot * dt;

      const alpha = 1 - p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x, p.y);
      if (p.rot !== undefined) ctx.rotate(p.rot);

      if (p.type === 'seed') {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 1.2, p.size * 0.65, 0, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'ember') {
        ctx.fillStyle = p.color;
        ctx.shadowColor = '#FF9100';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(0, 0, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Ambient floating fireflies in the night air
    fireflies.forEach(f => {
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.y < -40) f.y = 920;
      if (f.x < -80) f.x = 1160;
      if (f.x > 1160) f.x = -80;

      const pulse = 0.4 + 0.6 * Math.sin(time * 3.2 + f.phase);
      ctx.save();
      ctx.fillStyle = `hsla(${f.hue}, 100%, 65%, ${pulse * 0.85})`;
      ctx.shadowColor = `hsla(${f.hue}, 100%, 55%, 1)`;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  // ============================================================================
  // MAIN ANIMATION LOOP
  // ============================================================================
  function frame(now) {
    const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
    lastTimestamp = now;
    cycleTime += dt;

    if (cycleTime >= CYCLE_DURATION) {
      resetCycle();
    }

    const totalSec = now / 1000;

    // 1. Entrance bounce (0.0s - 0.9s) and Reset transition (20.7s - 21.5s)
    let squashX = 1;
    let squashY = 1;
    let pumpkinOffsetY = 0;

    if (cycleTime < 0.75) {
      const t = cycleTime / 0.75;
      if (t < 0.45) {
        const dropT = t / 0.45;
        pumpkinOffsetY = -280 * (1 - dropT * dropT);
      } else {
        if (!dropPlayed) {
          sound.playPumpkinDrop();
          dropPlayed = true;
        }
        const bounceT = (t - 0.45) / 0.55;
        const damp = Math.exp(-5.5 * bounceT) * Math.sin(bounceT * Math.PI * 2.5);
        squashX = 1 + damp * 0.12;
        squashY = 1 - damp * 0.12;
      }
    }

    // 2. Determine active carving state (1.1s - 13.8s)
    let activeShape = null;
    let knifeX = 860;
    let knifeY = 240;
    let knifeAngle = 0;
    let isSawing = false;
    let knifeVisibility = 0;

    for (let i = 0; i < SHAPES.length; i++) {
      const s = SHAPES[i];
      if (cycleTime >= s.startTime && !s.plunged) {
        s.plunged = true;
        sound.playKnifePlunge();
      }
      if (cycleTime >= s.endTime && !s.popped) {
        s.popped = true;
        sound.playPopOut(s.pitch);
        spawnPoppedPiece(s);
        spawnPopBurst(s.cx, s.cy);
        // Subtle recoil on the pumpkin when a piece pops out
        squashX = 1.025;
        squashY = 0.975;
      }
      if (cycleTime >= s.startTime && cycleTime < s.endTime) {
        activeShape = s;
      }
    }

    if (activeShape) {
      const progress = (cycleTime - activeShape.startTime) / (activeShape.endTime - activeShape.startTime);
      const sample = samplePointAlongShape(activeShape, progress);
      knifeX = sample.x;
      knifeY = sample.y;
      knifeAngle = sample.angle;
      isSawing = true;
      knifeVisibility = 1;
      spawnCarvingParticles(knifeX, knifeY, knifeAngle);
    } else if (cycleTime >= 0.7 && cycleTime < 14.3) {
      // Smoothly move the knife from the previous shape's start/end to the next shape's start
      let prevShape = null;
      let nextShape = null;
      for (let i = 0; i < SHAPES.length; i++) {
        if (SHAPES[i].endTime <= cycleTime) prevShape = SHAPES[i];
        if (SHAPES[i].startTime > cycleTime && !nextShape) nextShape = SHAPES[i];
      }

      if (!prevShape && nextShape) {
        // Approaching first cut
        const t = Math.max(0, Math.min(1, (cycleTime - 0.7) / (nextShape.startTime - 0.7)));
        const ease = t * t * (3 - 2 * t);
        knifeX = 940 + (nextShape.points[0][0] - 940) * ease;
        knifeY = 220 + (nextShape.points[0][1] - 220) * ease;
        knifeVisibility = ease;
      } else if (prevShape && nextShape) {
        // Gliding between shapes
        const t = Math.max(0, Math.min(1, (cycleTime - prevShape.endTime) / (nextShape.startTime - prevShape.endTime)));
        const ease = t * t * (3 - 2 * t);
        const startPt = prevShape.points[0];
        const endPt = nextShape.points[0];
        knifeX = startPt[0] + (endPt[0] - startPt[0]) * ease;
        knifeY = startPt[1] + (endPt[1] - startPt[1]) * ease - Math.sin(t * Math.PI) * 38;
        knifeVisibility = 1;
      } else if (prevShape && !nextShape) {
        // Retracting knife after the final grin cutout pops
        const t = Math.max(0, Math.min(1, (cycleTime - prevShape.endTime) / 0.5));
        const startPt = prevShape.points[0];
        knifeX = startPt[0] + t * 320;
        knifeY = startPt[1] - t * 220;
        knifeVisibility = 1 - t;
      }
    }

    // 3. Candle Drop & Internal Ignition (14.1s -> 20.8s)
    const candleDropProgress = Math.max(0, Math.min(1, (cycleTime - 14.0) / 0.65));
    let glowIntensity = 0;
    let darknessFactor = 0;

    if (cycleTime >= 14.55 && cycleTime < 20.8) {
      if (!candleIgnited) {
        candleIgnited = true;
        sound.playCandleIgnite();
      }
      const igniteRamp = Math.min(1, (cycleTime - 14.55) / 0.55);
      const fadeOut = cycleTime > 20.2 ? Math.max(0, 1 - (cycleTime - 20.2) / 0.6) : 1;
      const flicker = 0.90 + 0.10 * (Math.sin(totalSec * 18) * 0.6 + Math.cos(totalSec * 31) * 0.4);
      glowIntensity = igniteRamp * fadeOut * flicker;
      darknessFactor = igniteRamp * fadeOut;
    } else if (cycleTime >= 13.8 && cycleTime < 14.55) {
      // Pre-ignition dramatic dimming
      darknessFactor = ((cycleTime - 13.8) / 0.75) * 0.45;
    }

    // Update continuous Web Audio synthesizer nodes
    sound.updateContinuous(isSawing, totalSec * 42, glowIntensity);

    // 4. Render Scene in 1080x1080 coordinate space
    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate(offsetX, offsetY);

    // Background sky, moon, stars, hills & wooden table
    drawBackground(totalSec, glowIntensity, darknessFactor);

    // Transform for pumpkin bounce/squash
    ctx.save();
    ctx.translate(PUMPKIN_CX, PUMPKIN_CY + 265 + pumpkinOffsetY);
    ctx.scale(squashX, squashY);
    ctx.translate(-PUMPKIN_CX, -(PUMPKIN_CY + 265));

    // Twisted green pumpkin stem
    drawStem(PUMPKIN_CX, PUMPKIN_CY - 285, glowIntensity);

    // Main plump ribbed pumpkin body
    drawPumpkinExterior(PUMPKIN_CX, PUMPKIN_CY, 378, 305, glowIntensity, darknessFactor);

    // Popped cutout cavities, 3D inner rind walls, candle, and blazing interior fire
    drawCutoutHolesAndInterior(totalSec, glowIntensity, candleDropProgress);

    // Active knife kerf grooves currently being cut
    drawActiveCutGrooves();

    // Volumetric light rays & intense bloom when candle is lit
    drawVolumetricGlow(totalSec, glowIntensity);

    ctx.restore();

    // Flying & bouncing 3D carved pumpkin pieces
    updateAndDrawPoppedPieces(dt);

    // Flying pulp particles, seeds, and rising fire embers
    updateAndDrawParticles(dt, totalSec, glowIntensity);

    // Gleaming serrated carving knife
    drawCarvingKnife(totalSec, knifeX, knifeY, knifeAngle, isSawing, knifeVisibility);

    // Seamless dusk-curtain transition at the very end of the 21.5s loop
    if (cycleTime > 20.6) {
      const wipeAlpha = Math.sin(((cycleTime - 20.6) / 0.9) * Math.PI);
      ctx.fillStyle = `rgba(7, 3, 18, ${ Math.max(0, Math.min(1, wipeAlpha)) })`;
      ctx.fillRect(-offsetX - 50, -offsetY - 50, vw + 100, vh + 100);
    }

    ctx.restore();
    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
