<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jack-o'-lantern</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09051a}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="scene" aria-label="An animated jack-o'-lantern being carved and lit"></canvas>
<script>
(() => {
'use strict';
const canvas=document.getElementById('scene'), ctx=canvas.getContext('2d');
let W,H,S,ox,oy;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);S=Math.min(W,H)/1080;ox=(W-1080*S)/2;oy=(H-1080*S)/2}
addEventListener('resize',resize);resize();
const shapes=[
 {pts:[[318,433],[402,363],[457,462],[365,478]],start:1.2,end:4.1,pop:4.25},
 {pts:[[622,462],[677,363],[761,433],[714,478]],start:4.7,end:7.6,pop:7.75},
 {pts:[[505,535],[540,483],[575,535],[555,550],[525,550]],start:8.2,end:10.2,pop:10.35},
 {pts:[[300,601],[345,618],[365,580],[407,613],[450,620],[466,652],[507,624],[552,625],[576,654],[615,620],[657,611],[687,580],[714,616],[780,595],[758,651],[724,689],[680,720],[624,741],[541,750],[456,741],[400,720],[355,690],[322,651]],start:10.8,end:16.4,pop:16.55}
];
function path(pts,close=true){ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<pts.length;i++)ctx.lineTo(...pts[i]);if(close)ctx.closePath()}
function trace(pts,p){let lengths=[],total=0;for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length],l=Math.hypot(b[0]-a[0],b[1]-a[1]);lengths.push(l);total+=l}let left=total*Math.max(0,Math.min(1,p));ctx.beginPath();ctx.moveTo(...pts[0]);let pos=pts[0],angle=0;for(let i=0;i<pts.length;i++){let a=pts[i],b=pts[(i+1)%pts.length],l=lengths[i],f=Math.min(1,left/l);pos=[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];angle=Math.atan2(b[1]-a[1],b[0]-a[0]);ctx.lineTo(...pos);left-=l;if(left<=0)break}return {pos,angle}}
function pumpkinPath(){ctx.beginPath();ctx.moveTo(540,230);ctx.bezierCurveTo(430,184,333,232,273,315);ctx.bezierCurveTo(200,410,215,592,276,688);ctx.bezierCurveTo(337,790,432,802,540,778);ctx.bezierCurveTo(648,802,743,790,804,688);ctx.bezierCurveTo(865,592,880,410,807,315);ctx.bezierCurveTo(747,232,650,184,540,230);ctx.closePath()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function background(t,light){let g=ctx.createRadialGradient(540,490,50,540,500,760);g.addColorStop(0,light?'#362045':'#30204a');g.addColorStop(.55,'#17112f');g.addColorStop(1,'#070719');ctx.fillStyle=g;ctx.fillRect(-1000,-1000,3080,3080);for(let i=0;i<32;i++){let x=(i*193+71)%1080,y=(i*137+45)%650,r=1.4+(i%3);ctx.globalAlpha=.25+.2*Math.sin(t*1.2+i);ellipse(x,y,r,r,'#f8c8ff')}ctx.globalAlpha=1;ellipse(540,840,390,45,'#080719');ellipse(540,829,315,26,'#22102d')}
function stem(){ctx.save();ctx.translate(540,240);ctx.rotate(-.1);let g=ctx.createLinearGradient(-42,0,54,0);g.addColorStop(0,'#315b28');g.addColorStop(.45,'#8c9c38');g.addColorStop(1,'#294d24');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-46,7);ctx.bezierCurveTo(-23,-23,-28,-72,-8,-100);ctx.quadraticCurveTo(18,-116,43,-98);ctx.bezierCurveTo(13,-65,20,-22,48,7);ctx.quadraticCurveTo(0,26,-46,7);ctx.fill();ctx.strokeStyle='#b1ad4d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-8,-89);ctx.quadraticCurveTo(-13,-38,-18,-12);ctx.stroke();ctx.restore()}
function pumpkin(){stem();ctx.save();pumpkinPath();let g=ctx.createLinearGradient(220,270,850,700);g.addColorStop(0,'#ffb126');g.addColorStop(.25,'#ff8611');g.addColorStop(.55,'#f06508');g.addColorStop(.85,'#e34a0b');g.addColorStop(1,'#9c280d');ctx.fillStyle=g;ctx.fill();ctx.clip();let glow=ctx.createRadialGradient(430,350,15,470,450,420);glow.addColorStop(0,'rgba(255,204,67,.55)');glow.addColorStop(1,'rgba(255,130,0,0)');ctx.fillStyle=glow;ctx.fillRect(180,180,720,660);for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(540+i*48,230);ctx.bezierCurveTo(540+i*157,300,540+i*165,682,540+i*42,783);ctx.strokeStyle=i<0?'rgba(255,190,54,.22)':'rgba(119,38,3,.24)';ctx.lineWidth=12;ctx.stroke();ctx.strokeStyle='rgba(255,191,54,.15)';ctx.lineWidth=3;ctx.stroke()}ctx.restore();pumpkinPath();ctx.strokeStyle='#8f310e';ctx.lineWidth=8;ctx.stroke();}
function cutHole(s,light,t){ctx.save();ctx.translate(0,6);path(s.pts);ctx.fillStyle='#9c320a';ctx.fill();ctx.restore();path(s.pts);let g=ctx.createLinearGradient(0,360,0,750);if(light){let f=.88+.12*Math.sin(t*9)+.05*Math.sin(t*17);g.addColorStop(0,`rgba(255,${Math.round(211*f)},45,1)`);g.addColorStop(.5,'#ffad13');g.addColorStop(1,'#f26305')}else{g.addColorStop(0,'#401124');g.addColorStop(1,'#160a1a')}ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=light?'#ffbf39':'#8a2e0e';ctx.lineWidth=5;ctx.stroke();if(light){ctx.save();path(s.pts);ctx.clip();ctx.globalAlpha=.5;ellipse(540,630,250,160,'#ffe15b');ctx.restore()}}
function piece(s,dt){let p=Math.min(1,dt/1.25),e=1-Math.pow(1-p,3);let cx=s.pts.reduce((a,b)=>a+b[0],0)/s.pts.length,cy=s.pts.reduce((a,b)=>a+b[1],0)/s.pts.length;ctx.save();ctx.translate(cx+(cx-540)*.15*e,cy-50*e+250*p*p);ctx.rotate((cx<540?-1:1)*p*.7);ctx.scale(1-p*.18,1-p*.18);ctx.translate(-cx,-cy);ctx.globalAlpha=Math.max(0,1-Math.max(0,p-.6)/.4);path(s.pts);ctx.fillStyle='#f8750b';ctx.fill();ctx.strokeStyle='#ffbd39';ctx.lineWidth=7;ctx.stroke();ctx.restore()}
function knife(pos,angle,t){ctx.save();ctx.translate(pos[0],pos[1]);ctx.rotate(angle+.45);ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=12;ctx.shadowOffsetY=8;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-12,-74);ctx.quadraticCurveTo(-14,-95,0,-120);ctx.lineTo(14,-74);ctx.closePath();let g=ctx.createLinearGradient(-14,0,14,0);g.addColorStop(0,'#7e94a5');g.addColorStop(.5,'#f5ffff');g.addColorStop(1,'#a0b2be');ctx.fillStyle=g;ctx.fill();ctx.fillStyle='#42243c';ctx.beginPath();ctx.roundRect(-13,-177,26,62,8);ctx.fill();ctx.fillStyle='#ffbd4a';ellipse(0,-148,3,3,'#ffbd4a');ctx.restore();for(let i=0;i<4;i++){let a=t*8+i*1.6;ellipse(pos[0]+Math.cos(a)*12,pos[1]+Math.sin(a)*10,2,2,'#ffc04b')}}
function flame(t){let flick=Math.sin(t*13)*3+Math.sin(t*21)*2;ctx.save();ctx.translate(540,725);let g=ctx.createRadialGradient(0,-25,3,0,-25,105);g.addColorStop(0,'rgba(255,225,79,.65)');g.addColorStop(1,'rgba(255,126,0,0)');ctx.fillStyle=g;ctx.fillRect(-110,-135,220,220);ctx.fillStyle='#ff9d18';ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(-22,-5,-18,-32,flick,-64);ctx.bezierCurveTo(18,-38,22,-10,0,0);ctx.fill();ctx.fillStyle='#fff3a0';ctx.beginPath();ctx.moveTo(0,-2);ctx.quadraticCurveTo(-10,-11,1,-33);ctx.quadraticCurveTo(11,-12,0,-2);ctx.fill();ctx.restore()}
const duration=23.5, start=performance.now();
function frame(now){let t=((now-start)/1000)%duration;ctx.save();ctx.translate(ox,oy);ctx.scale(S,S);let light=t>=18.1; background(t,light);if(light){let halo=ctx.createRadialGradient(540,560,180,540,560,560);halo.addColorStop(0,'rgba(255,124,0,.27)');halo.addColorStop(1,'rgba(255,72,0,0)');ctx.fillStyle=halo;ctx.fillRect(-100,-100,1280,1280)}pumpkin();for(const s of shapes){if(t>=s.pop)cutHole(s,light,t)}if(light)flame(t);for(const s of shapes){if(t>=s.start&&t<s.pop){let p=Math.min(1,(t-s.start)/(s.end-s.start));ctx.save();trace(s.pts,p);ctx.strokeStyle='#7c270d';ctx.lineWidth=8;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();ctx.restore()}if(t>=s.pop&&t<s.pop+1.25)piece(s,t-s.pop)}let active=shapes.find(s=>t>=s.start&&t<s.end);if(active){let info=trace(active.pts,(t-active.start)/(active.end-active.start));knife(info.pos,info.angle,t)}ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
let audio,master,noise;let audioStarted=false;
function initAudio(){if(audioStarted){if(audio&&audio.state==='suspended')audio.resume();return}try{audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.18;master.connect(audio.destination);let buffer=audio.createBuffer(1,audio.sampleRate*2,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noise=buffer;audioStarted=true;audio.resume();schedule();setInterval(schedule,1000)}catch(e){}}
let scheduledUntil=0;
function sound(at,type,dur){let time=audio.currentTime+Math.max(0,at-(performance.now()-start)/1000);let gain=audio.createGain();gain.connect(master);if(type==='scratch'){let src=audio.createBufferSource();src.buffer=noise;src.loop=true;let filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.value=1100;filter.Q.value=.7;src.connect(filter);filter.connect(gain);gain.gain.setValueAtTime(.0001,time);gain.gain.linearRampToValueAtTime(.09,time+.04);gain.gain.setValueAtTime(.09,time+dur-.08);gain.gain.linearRampToValueAtTime(.0001,time+dur);src.start(time);src.stop(time+dur)}else{let o=audio.createOscillator();o.type=type==='pop'?'sine':'triangle';o.frequency.setValueAtTime(type==='pop'?260:520,time);o.frequency.exponentialRampToValueAtTime(type==='pop'?95:900,time+dur);o.connect(gain);gain.gain.setValueAtTime(.0001,time);gain.gain.linearRampToValueAtTime(type==='pop'?.35:.12,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+dur);o.start(time);o.stop(time+dur)}}
function schedule(){if(!audio||audio.state!=='running')return;let now=(performance.now()-start)/1000,from=Math.max(now,scheduledUntil),to=now+1.5;for(let cycle=Math.floor(from/duration);cycle<=Math.floor(to/duration);cycle++){let base=cycle*duration;for(let s of shapes){for(let x=s.start;x<s.end;x+=.34){let when=base+x;if(when>=from&&when<to)sound(when,'scratch',.16)}let when=base+s.pop;if(when>=from&&when<to)sound(when,'pop',.24)}let when=base+18.1;if(when>=from&&when<to)sound(when,'light',.45)}scheduledUntil=to}
initAudio();addEventListener('pointerdown',initAudio,{passive:true});addEventListener('keydown',initAudio);
})();
</script>
</body>
</html>
