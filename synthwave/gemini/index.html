<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Synthwave Drive</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070014;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Offscreen bloom buffer for intense neon glow
  const bloomCanvas = document.createElement('canvas');
  const bloomCtx = bloomCanvas.getContext('2d');

  let width = 1080;
  let height = 1080;
  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth || 1080;
    height = window.innerHeight || 1080;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    bloomCanvas.width = Math.max(1, Math.round(width * 0.25));
    bloomCanvas.height = Math.max(1, Math.round(height * 0.25));
  }

  window.addEventListener('resize', resize);
  resize();

  // Deterministic pseudo-random generator for stars & mountain heights
  let seed = 1984;
  function rand() {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  }

  // Generate starfield
  const NUM_STARS = 180;
  const stars = [];
  for (let i = 0; i < NUM_STARS; i++) {
    stars.push({
      x: rand(),
      y: rand() * 0.52,
      r: 0.7 + rand() * 1.9,
      phase: rand() * Math.PI * 2,
      speed: 1.2 + rand() * 3.0,
      hue: rand() > 0.5 ? '#00f7ff' : (rand() > 0.4 ? '#ff73fa' : '#ffffff')
    });
  }

  // Shooting stars
  const meteors = [
    { x: 0.18, y: 0.12, vx: 0.35, vy: 0.14, len: 0.09, progress: 0.2, period: 5.5 },
    { x: 0.82, y: 0.08, vx: -0.38, vy: 0.15, len: 0.11, progress: 3.1, period: 6.5 }
  ];

  // Procedural 3D mountain grid parameters
  const Z_ROWS = 34;
  const X_COLS = 18; // per side (left and right of road/valley)
  const Z_NEAR = 1.0;
  const Z_FAR = 35.0;
  const Z_STEP = (Z_FAR - Z_NEAR) / Z_ROWS;

  // Height function for seamless scrolling mountains along worldZ
  function getMountainHeight(colIndex, worldRow) {
    // colIndex: 0 is road edge, 1..X_COLS goes outward
    if (colIndex <= 1) return 0; // flat grid zone beside road

    const distFactor = Math.pow((colIndex - 1) / (X_COLS - 1), 1.28);
    const w1 = Math.sin(worldRow * 0.38 + colIndex * 0.65);
    const w2 = Math.cos(worldRow * 0.19 - colIndex * 0.92);
    const w3 = Math.sin(worldRow * 0.77 + colIndex * 1.45) * 0.45;
    const ridge = Math.abs(w1 * 0.55 + w2 * 0.45 + w3);

    // Extra dramatic twin peaks in mid-outer columns
    const peakBoost = Math.sin(Math.min(1, (colIndex - 1) / 8) * Math.PI) * 0.55;
    return (ridge * 1.35 + peakBoost) * distFactor * 165;
  }

  // Distant static silhouette mountain ridge across the horizon
  const bgPeaks = [];
  const BG_PEAK_COUNT = 64;
  for (let i = 0; i <= BG_PEAK_COUNT; i++) {
    const u = i / BG_PEAK_COUNT; // 0..1 across width
    const centerClearing = Math.pow(Math.min(1, Math.abs(u - 0.5) / 0.26), 1.6);
    const h = (
      Math.abs(Math.sin(u * 19.0 + 0.4)) * 0.55 +
      Math.abs(Math.cos(u * 37.0 - 1.2)) * 0.3 +
      Math.abs(Math.sin(u * 9.0 + 2.1)) * 0.45
    ) * centerClearing;
    bgPeaks.push({ u, h });
  }

  function drawSky(t, horizonY, sunX, sunY, sunRadius) {
    // Deep saturated synthwave sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0.00, '#050012');
    skyGrad.addColorStop(0.25, '#12002c');
    skyGrad.addColorStop(0.52, '#2c0057');
    skyGrad.addColorStop(0.76, '#6d006c');
    skyGrad.addColorStop(0.91, '#c80064');
    skyGrad.addColorStop(1.00, '#ff2a6d');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, horizonY + 2);

    // Subtle atmospheric nebula glow bands
    const nebulaGrad = ctx.createRadialGradient(
      sunX, sunY, sunRadius * 0.1,
      sunX, horizonY * 0.75, Math.max(width, height) * 0.72
    );
    nebulaGrad.addColorStop(0.0, 'rgba(255, 190, 60, 0.45)');
    nebulaGrad.addColorStop(0.28, 'rgba(255, 20, 120, 0.35)');
    nebulaGrad.addColorStop(0.58, 'rgba(140, 0, 255, 0.18)');
    nebulaGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = nebulaGrad;
    ctx.fillRect(0, 0, width, horizonY + 2);

    // Twinkling stars
    ctx.save();
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const sy = s.y * horizonY * 0.92;
      const sx = s.x * width;
      // Fade stars near sun & horizon
      const distToSun = Math.hypot(sx - sunX, sy - sunY);
      if (distToSun < sunRadius * 1.18) continue;

      const twinkle = 0.45 + 0.55 * Math.sin(t * s.speed + s.phase);
      const horizonFade = Math.max(0, 1 - Math.pow(s.y / 0.52, 2.2));
      const alpha = twinkle * horizonFade;
      if (alpha <= 0.03) continue;

      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.hue;
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();

      // Cross sparkle on brightest stars
      if (s.r > 2.0 && twinkle > 0.75) {
        ctx.strokeStyle = s.hue;
        ctx.lineWidth = 1;
        const arm = s.r * 2.8;
        ctx.beginPath();
        ctx.moveTo(sx - arm, sy);
        ctx.lineTo(sx + arm, sy);
        ctx.moveTo(sx, sy - arm);
        ctx.lineTo(sx, sy + arm);
        ctx.stroke();
      }
    }
    ctx.restore();

    // Shooting stars
    ctx.save();
    for (let i = 0; i < meteors.length; i++) {
      const m = meteors[i];
      const cycle = (t + m.progress) % m.period;
      if (cycle < 1.1) {
        const p = cycle / 1.1;
        const mx = (m.x + m.vx * p) * width;
        const my = (m.y + m.vy * p) * horizonY;
        const tailX = mx - m.vx * m.len * width;
        const tailY = my - m.vy * m.len * horizonY;
        const grad = ctx.createLinearGradient(mx, my, tailX, tailY);
        const fade = Math.sin(p * Math.PI);
        grad.addColorStop(0, `rgba(255, 255, 255, ${0.95 * fade})`);
        grad.addColorStop(0.3, `rgba(0, 247, 255, ${0.7 * fade})`);
        grad.addColorStop(1, 'rgba(255, 0, 160, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawSun(t, horizonY, sunX, sunY, sunRadius) {
    // Outer sun halo bloom
    const outerGlow = ctx.createRadialGradient(
      sunX, sunY, sunRadius * 0.4,
      sunX, sunY, sunRadius * 2.1
    );
    outerGlow.addColorStop(0.0, 'rgba(255, 120, 40, 0.55)');
    outerGlow.addColorStop(0.35, 'rgba(255, 0, 110, 0.32)');
    outerGlow.addColorStop(0.7, 'rgba(180, 0, 255, 0.12)');
    outerGlow.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunRadius * 2.1, 0, Math.PI * 2);
    ctx.fill();

    // Clip to upper sky (above horizon) and draw segmented synthwave sun
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, width, horizonY);
    ctx.clip();

    // Build path with horizontal scan-slice cutouts in the lower 62% of the sun
    ctx.save();
    ctx.beginPath();
    ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
    ctx.clip();

    const sunTop = sunY - sunRadius;
    const sunBottom = sunY + sunRadius;
    const sunGrad = ctx.createLinearGradient(0, sunTop, 0, sunBottom);
    sunGrad.addColorStop(0.00, '#fffb96');
    sunGrad.addColorStop(0.20, '#ffdd33');
    sunGrad.addColorStop(0.45, '#ff7b00');
    sunGrad.addColorStop(0.72, '#ff1867');
    sunGrad.addColorStop(1.00, '#b80088');

    // Draw horizontal sun slices with animated scrolling gaps
    const numSlices = 11;
    const sliceZoneStart = sunY - sunRadius * 0.18;
    const sliceZoneHeight = sunBottom - sliceZoneStart;

    // Solid upper cap of sun
    ctx.fillStyle = sunGrad;
    ctx.fillRect(sunX - sunRadius, sunTop, sunRadius * 2, sliceZoneStart - sunTop + 1);

    // Lower sliced region: we draw the full sun gradient first, then punch out dark sky-colored bars
    ctx.fillRect(sunX - sunRadius, sliceZoneStart, sunRadius * 2, sliceZoneHeight);

    // Animated gap cutouts drifting downward slowly
    const scrollPhase = (t * 0.45) % 1;
    for (let i = -1; i < numSlices; i++) {
      const norm = (i + scrollPhase) / numSlices;
      if (norm <= 0 || norm >= 1.05) continue;
      // Exponentially distribute slices toward bottom
      const yRel = Math.pow(norm, 1.15);
      const cutY = sliceZoneStart + yRel * sliceZoneHeight;
      const gapThickness = (1.5 + Math.pow(norm, 1.65) * 18.5) * (sunRadius / 220);

      // Sample sky color at cutY for clean cutout
      const skyMix = Math.min(1, Math.max(0, (cutY - (horizonY - sunRadius * 1.4)) / (sunRadius * 1.4)));
      ctx.fillStyle = `rgb(${Math.round(55 + skyMix * 165)}, ${Math.round(0 + skyMix * 12)}, ${Math.round(88 + skyMix * 18)})`;
      ctx.fillRect(sunX - sunRadius - 2, cutY - gapThickness * 0.5, sunRadius * 2 + 4, gapThickness);
    }

    ctx.restore();
    ctx.restore();
  }

  function drawDistantHorizonPeaks(horizonY, sunX, minDim) {
    const maxPeakH = minDim * 0.095;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, horizonY + 1);
    for (let i = 0; i < bgPeaks.length; i++) {
      const px = bgPeaks[i].u * width;
      const py = horizonY - bgPeaks[i].h * maxPeakH;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(width, horizonY + 1);
    ctx.closePath();

    const silhouetteGrad = ctx.createLinearGradient(0, horizonY - maxPeakH, 0, horizonY);
    silhouetteGrad.addColorStop(0, '#190036');
    silhouetteGrad.addColorStop(1, '#090018');
    ctx.fillStyle = silhouetteGrad;
    ctx.fill();

    // Glowing magenta/cyan rim on distant peaks
    ctx.strokeStyle = '#ff299c';
    ctx.lineWidth = 1.8;
    ctx.shadowColor = '#ff007f';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.restore();
  }

  function drawMountainsAndFloor(t, horizonY, vanishX, minDim, roadCurve) {
    const floorHeight = height - horizonY;

    // Rich dark synthwave ground base gradient
    const groundGrad = ctx.createLinearGradient(0, horizonY, 0, height);
    groundGrad.addColorStop(0.00, '#2a004f');
    groundGrad.addColorStop(0.12, '#160033');
    groundGrad.addColorStop(0.45, '#0b001e');
    groundGrad.addColorStop(1.00, '#04000d');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0, horizonY, width, floorHeight);

    // Camera & projection parameters
    const fovScale = minDim * 0.92;
    const camHeight = 115;
    const speed = 7.2; // World rows per second
    const totalScroll = t * speed;
    const baseRow = Math.floor(totalScroll);
    const fracRow = totalScroll - baseRow;

    // Project a 3D world point (wx, wy, wz) to screen (sx, sy)
    // wx: lateral offset from center, wy: elevation above ground (0 = flat floor), wz: depth [Z_NEAR..Z_FAR]
    function project(wx, wy, wz) {
      const invZ = 1.0 / wz;
      const curveShift = roadCurve * Math.pow((wz - Z_NEAR) / (Z_FAR - Z_NEAR), 1.6) * 140;
      const sx = vanishX + (wx + curveShift) * invZ * fovScale;
      const sy = horizonY + (camHeight - wy) * invZ * (fovScale * 0.48);
      return { sx, sy, invZ };
    }

    const roadHalfWidth = 135;
    const colSpacing = 105;

    // 1. Draw glowing perspective grid on the flat terrain floor (between road and mountains, and under mountains)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, horizonY, width, floorHeight);
    ctx.clip();

    // Longitudinal grid lines (fanning out from vanishing point)
    const numGridCols = 24;
    for (let side = -1; side <= 1; side += 2) {
      for (let c = 1; c <= numGridCols; c++) {
        const wx = side * (roadHalfWidth + c * colSpacing);
        const pFar = project(wx, 0, Z_FAR);
        const pNear = project(wx, 0, Z_NEAR * 0.65);

        const lineGrad = ctx.createLinearGradient(pFar.sx, pFar.sy, pNear.sx, pNear.sy);
        lineGrad.addColorStop(0.0, 'rgba(255, 0, 140, 0.15)');
        lineGrad.addColorStop(0.35, 'rgba(217, 0, 255, 0.65)');
        lineGrad.addColorStop(1.0, 'rgba(0, 247, 255, 0.95)');

        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(pFar.sx, pFar.sy);
        ctx.lineTo(pNear.sx, pNear.sy);
        ctx.stroke();
      }
    }

    // Transverse horizontal grid lines scrolling toward viewer
    for (let r = Z_ROWS; r >= 0; r--) {
      const wz = Z_NEAR + (r - fracRow) * Z_STEP;
      if (wz <= 0.45) continue;
      const pLeft = project(-3200, 0, wz);
      const pRight = project(3200, 0, wz);
      const depthNorm = Math.max(0, Math.min(1, 1 - (wz - Z_NEAR) / (Z_FAR - Z_NEAR)));
      const alpha = Math.pow(depthNorm, 1.35) * 0.85;

      ctx.strokeStyle = depthNorm > 0.55
        ? `rgba(0, 247, 255, ${alpha})`
        : `rgba(255, 0, 160, ${alpha * 1.15})`;
      ctx.lineWidth = 1.1 + depthNorm * 1.8;
      ctx.beginPath();
      ctx.moveTo(0, pLeft.sy);
      ctx.lineTo(width, pRight.sy);
      ctx.stroke();
    }
    ctx.restore();

    // 2. Draw Central Endless Synthwave Highway
    ctx.save();
    const roadFarLeft = project(-roadHalfWidth, 0, Z_FAR);
    const roadFarRight = project(roadHalfWidth, 0, Z_FAR);
    const roadNearLeft = project(-roadHalfWidth, 0, 0.42);
    const roadNearRight = project(roadHalfWidth, 0, 0.42);

    // Asphalt surface polygon
    ctx.beginPath();
    ctx.moveTo(roadFarLeft.sx, horizonY);
    ctx.lineTo(roadFarRight.sx, horizonY);
    ctx.lineTo(roadNearRight.sx, roadNearRight.sy);
    ctx.lineTo(roadNearLeft.sx, roadNearLeft.sy);
    ctx.closePath();

    const asphaltGrad = ctx.createLinearGradient(0, horizonY, 0, height);
    asphaltGrad.addColorStop(0.0, '#290642');
    asphaltGrad.addColorStop(0.25, '#120324');
    asphaltGrad.addColorStop(0.7, '#090216');
    asphaltGrad.addColorStop(1.0, '#05010e');
    ctx.fillStyle = asphaltGrad;
    ctx.fill();

    // Sun reflection shimmer strip down the center of the wet neon asphalt
    ctx.save();
    ctx.clip();
    const reflGrad = ctx.createLinearGradient(0, horizonY, 0, height);
    reflGrad.addColorStop(0.0, 'rgba(255, 190, 70, 0.55)');
    reflGrad.addColorStop(0.25, 'rgba(255, 0, 128, 0.32)');
    reflGrad.addColorStop(0.7, 'rgba(180, 0, 255, 0.14)');
    reflGrad.addColorStop(1.0, 'rgba(0, 247, 255, 0.08)');
    ctx.fillStyle = reflGrad;

    const reflFarL = project(-roadHalfWidth * 0.45, 0, Z_FAR);
    const reflFarR = project(roadHalfWidth * 0.45, 0, Z_FAR);
    const reflNearL = project(-roadHalfWidth * 0.35, 0, 0.42);
    const reflNearR = project(roadHalfWidth * 0.35, 0, 0.42);
    ctx.beginPath();
    ctx.moveTo(reflFarL.sx, horizonY);
    ctx.lineTo(reflFarR.sx, horizonY);
    ctx.lineTo(reflNearR.sx, reflNearR.sy);
    ctx.lineTo(reflNearL.sx, reflNearL.sy);
    ctx.closePath();
    ctx.fill();

    // Subtle speed-ripple bands inside the road reflection
    for (let r = Z_ROWS; r >= 0; r--) {
      const wz = Z_NEAR + (r - fracRow) * Z_STEP;
      if (wz <= 0.45) continue;
      const pL = project(-roadHalfWidth * 0.92, 0, wz);
      const pR = project(roadHalfWidth * 0.92, 0, wz);
      const depthNorm = Math.max(0, Math.min(1, 1 - (wz - Z_NEAR) / (Z_FAR - Z_NEAR)));
      ctx.strokeStyle = `rgba(255, 42, 145, ${0.14 * depthNorm})`;
      ctx.lineWidth = 1.0 + depthNorm * 1.2;
      ctx.beginPath();
      ctx.moveTo(pL.sx, pL.sy);
      ctx.lineTo(pR.sx, pR.sy);
      ctx.stroke();
    }
    ctx.restore();

    // Glowing Outer Road Rails (Double Neon Borders: Electric Cyan + Hot Magenta)
    for (let side = -1; side <= 1; side += 2) {
      // Outer magenta glow rail
      const pFarOuter = project(side * (roadHalfWidth + 6), 0, Z_FAR);
      const pNearOuter = project(side * (roadHalfWidth + 6), 0, 0.42);
      ctx.strokeStyle = '#ff0090';
      ctx.lineWidth = 4.5;
      ctx.shadowColor = '#ff0090';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(pFarOuter.sx, horizonY);
      ctx.lineTo(pNearOuter.sx, pNearOuter.sy);
      ctx.stroke();

      // Inner bright cyan rail
      const pFarInner = project(side * roadHalfWidth, 0, Z_FAR);
      const pNearInner = project(side * roadHalfWidth, 0, 0.42);
      ctx.strokeStyle = '#00f9ff';
      ctx.lineWidth = 3.0;
      ctx.shadowColor = '#00f9ff';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(pFarInner.sx, horizonY);
      ctx.lineTo(pNearInner.sx, pNearInner.sy);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;

    // Secondary lane divider lines (subtle glowing violet/cyan)
    for (let side = -1; side <= 1; side += 2) {
      const laneX = side * (roadHalfWidth * 0.36);
      for (let r = Z_ROWS; r >= 0; r--) {
        const worldIdx = baseRow + r;
        if (worldIdx % 2 !== 0) continue;
        const wz1 = Math.max(0.42, Z_NEAR + (r - fracRow) * Z_STEP);
        const wz2 = Math.max(0.42, wz1 + Z_STEP * 0.55);
        if (wz2 <= 0.45 || wz1 >= Z_FAR) continue;

        const l1 = project(laneX - 1.5, 0, wz1);
        const r1 = project(laneX + 1.5, 0, wz1);
        const r2 = project(laneX + 1.5, 0, wz2);
        const l2 = project(laneX - 1.5, 0, wz2);

        const depthNorm = Math.max(0, Math.min(1, 1 - (wz1 - Z_NEAR) / (Z_FAR - Z_NEAR)));
        ctx.fillStyle = `rgba(0, 247, 255, ${0.25 + depthNorm * 0.65})`;
        ctx.beginPath();
        ctx.moveTo(l1.sx, l1.sy);
        ctx.lineTo(r1.sx, r1.sy);
        ctx.lineTo(r2.sx, r2.sy);
        ctx.lineTo(l2.sx, l2.sy);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Center blazing neon yellow-orange dashed highway line
    ctx.save();
    ctx.shadowColor = '#ffbe0b';
    ctx.shadowBlur = 14;
    for (let r = Z_ROWS; r >= -1; r--) {
      const worldIdx = baseRow + r;
      if (worldIdx % 2 !== 0) continue;

      const wz1 = Math.max(0.40, Z_NEAR + (r - fracRow) * Z_STEP);
      const wz2 = Math.max(0.40, wz1 + Z_STEP * 0.62);
      if (wz2 <= 0.42 || wz1 >= Z_FAR) continue;

      const halfDashW = 3.8;
      const p1L = project(-halfDashW, 0, wz1);
      const p1R = project(halfDashW, 0, wz1);
      const p2R = project(halfDashW, 0, wz2);
      const p2L = project(-halfDashW, 0, wz2);

      const depthNorm = Math.max(0, Math.min(1, 1 - (wz1 - Z_NEAR) / (Z_FAR - Z_NEAR)));
      ctx.fillStyle = depthNorm > 0.4 ? '#fff36b' : '#ff8c24';
      ctx.beginPath();
      ctx.moveTo(p1L.sx, p1L.sy);
      ctx.lineTo(p1R.sx, p1R.sy);
      ctx.lineTo(p2R.sx, p2R.sy);
      ctx.lineTo(p2L.sx, p2L.sy);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.restore();

    // 3. Draw 3D Wireframe Low-Poly Mountains on Left & Right (Painter's algorithm: back to front)
    ctx.save();
    for (let r = Z_ROWS - 1; r >= 0; r--) {
      const wzNear = Z_NEAR + (r - fracRow) * Z_STEP;
      const wzFar = wzNear + Z_STEP;
      if (wzNear <= 0.55) continue;

      const worldRowNear = baseRow + r;
      const worldRowFar = worldRowNear + 1;
      const depthNorm = Math.max(0, Math.min(1, 1 - (wzNear - Z_NEAR) / (Z_FAR - Z_NEAR)));

      // Draw outer columns inward toward the road so closer peaks overlap cleanly
      for (let side = -1; side <= 1; side += 2) {
        for (let c = X_COLS - 1; c >= 1; c--) {
          const wxInner = side * (roadHalfWidth + c * colSpacing);
          const wxOuter = side * (roadHalfWidth + (c + 1) * colSpacing);

          // Mirror column index slightly asymmetrically between left and right for natural variety
          const seedOffset = side === -1 ? 0 : 17;
          const hNearInner = getMountainHeight(c, worldRowNear + seedOffset);
          const hNearOuter = getMountainHeight(c + 1, worldRowNear + seedOffset);
          const hFarInner = getMountainHeight(c, worldRowFar + seedOffset);
          const hFarOuter = getMountainHeight(c + 1, worldRowFar + seedOffset);

          if (hNearInner === 0 && hNearOuter === 0 && hFarInner === 0 && hFarOuter === 0) continue;

          const pNI = project(wxInner, hNearInner, wzNear);
          const pNO = project(wxOuter, hNearOuter, wzNear);
          const pFO = project(wxOuter, hFarOuter, wzFar);
          const pFI = project(wxInner, hFarInner, wzFar);

          // Skip offscreen quads for performance
          const minX = Math.min(pNI.sx, pNO.sx, pFO.sx, pFI.sx);
          const maxX = Math.max(pNI.sx, pNO.sx, pFO.sx, pFI.sx);
          if (maxX < -60 || minX > width + 60) continue;

          const avgH = (hNearInner + hNearOuter + hFarInner + hFarOuter) * 0.25;
          const heightRatio = Math.min(1, avgH / 180);

          // Facet fill: deep dark synthwave indigo/magenta shaded by sun side (inner faces brighter)
          const rCol = Math.round(14 + heightRatio * 55 * depthNorm);
          const gCol = Math.round(2 + heightRatio * 12 * depthNorm);
          const bCol = Math.round(36 + heightRatio * 85 * depthNorm);

          ctx.fillStyle = `rgb(${rCol}, ${gCol}, ${bCol})`;
          ctx.beginPath();
          ctx.moveTo(pNI.sx, pNI.sy);
          ctx.lineTo(pNO.sx, pNO.sy);
          ctx.lineTo(pFO.sx, pFO.sy);
          ctx.lineTo(pFI.sx, pFI.sy);
          ctx.closePath();
          ctx.fill();

          // Diagonal triangulation line + wireframe edges in vivid neon cyan & hot pink
          const edgeAlpha = Math.min(1, 0.22 + depthNorm * 0.78);
          const isPeak = heightRatio > 0.38;
          ctx.strokeStyle = isPeak
            ? `rgba(0, 249, 255, ${edgeAlpha})`
            : `rgba(255, 0, 155, ${edgeAlpha * 0.9})`;
          ctx.lineWidth = isPeak ? (1.2 + depthNorm * 1.3) : (0.9 + depthNorm * 0.9);
          ctx.stroke();

          // Diagonal triangle split for authentic low-poly synthwave aesthetic
          ctx.beginPath();
          ctx.moveTo(pNI.sx, pNI.sy);
          ctx.lineTo(pFO.sx, pFO.sy);
          ctx.strokeStyle = `rgba(255, 40, 180, ${edgeAlpha * 0.55})`;
          ctx.lineWidth = 0.8 + depthNorm * 0.6;
          ctx.stroke();
        }
      }

      // Roadside neon light pylons every 4 rows
      if (worldRowNear % 4 === 0 && wzNear > 0.9 && wzNear < Z_FAR * 0.85) {
        for (let side = -1; side <= 1; side += 2) {
          const pylonX = side * (roadHalfWidth + 28);
          const pBase = project(pylonX, 0, wzNear);
          const pTop = project(pylonX, 42, wzNear);
          const pTip = project(pylonX - side * 14, 46, wzNear);

          const a = Math.pow(depthNorm, 1.1);
          ctx.strokeStyle = `rgba(0, 249, 255, ${0.4 + a * 0.6})`;
          ctx.lineWidth = Math.max(1.2, 3.5 * pBase.invZ);
          ctx.beginPath();
          ctx.moveTo(pBase.sx, pBase.sy);
          ctx.lineTo(pTop.sx, pTop.sy);
          ctx.lineTo(pTip.sx, pTip.sy);
          ctx.stroke();

          // Glowing magenta orb at pylon tip
          ctx.fillStyle = `rgba(255, 30, 160, ${0.5 + a * 0.5})`;
          ctx.beginPath();
          ctx.arc(pTip.sx, pTip.sy, Math.max(1.5, 5.5 * pBase.invZ), 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
    ctx.restore();

    // 4. Intense Horizon Laser Glow Line
    ctx.save();
    const horizonGlow = ctx.createLinearGradient(0, horizonY - 18, 0, horizonY + 22);
    horizonGlow.addColorStop(0.0, 'rgba(255, 0, 128, 0)');
    horizonGlow.addColorStop(0.42, 'rgba(255, 60, 160, 0.65)');
    horizonGlow.addColorStop(0.50, 'rgba(255, 250, 220, 0.95)');
    horizonGlow.addColorStop(0.58, 'rgba(0, 247, 255, 0.75)');
    horizonGlow.addColorStop(1.0, 'rgba(0, 247, 255, 0)');
    ctx.fillStyle = horizonGlow;
    ctx.fillRect(0, horizonY - 18, width, 40);
    ctx.restore();
  }

  function drawPostFX(t) {
    // Downsample onto bloom canvas and composite with 'screen' / 'lighter' for vivid neon glow
    bloomCtx.clearRect(0, 0, bloomCanvas.width, bloomCanvas.height);
    bloomCtx.filter = 'blur(8px) saturate(180%)';
    bloomCtx.drawImage(canvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
    bloomCtx.filter = 'none';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.36;
    ctx.drawImage(bloomCanvas, 0, 0, width, height);
    ctx.restore();

    // Subtle CRT scanlines and corner vignette for authentic synthwave depth
    ctx.save();
    ctx.fillStyle = 'rgba(8, 0, 20, 0.14)';
    for (let y = 0; y < height; y += 4) {
      ctx.fillRect(0, y, width, 1.5);
    }

    const rad = Math.max(width, height) * 0.75;
    const vig = ctx.createRadialGradient(
      width * 0.5, height * 0.5, rad * 0.42,
      width * 0.5, height * 0.5, rad
    );
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(2, 0, 10, 0.52)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, width, height);
    ctx.restore();
  }

  let startTime = null;
  function frame(timestamp) {
    if (startTime === null) startTime = timestamp;
    const t = (timestamp - startTime) * 0.001;

    const minDim = Math.min(width, height);
    const horizonY = Math.round(height * 0.53);
    const roadCurve = Math.sin(t * 0.55) * 0.32;
    const sunX = width * 0.5 + roadCurve * minDim * 0.03;
    const sunRadius = minDim * 0.245;
    const sunY = horizonY - sunRadius * 0.18;

    drawSky(t, horizonY, sunX, sunY, sunRadius);
    drawSun(t, horizonY, sunX, sunY, sunRadius);
    drawDistantHorizonPeaks(horizonY, sunX, minDim);
    drawMountainsAndFloor(t, horizonY, sunX, minDim, roadCurve);
    drawPostFX(t);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
