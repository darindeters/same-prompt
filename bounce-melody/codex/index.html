<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080516">
  <title>Für Elise · Color in Motion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080516; }
    body { overscroll-behavior: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  </style>
</head>
<body>
<canvas aria-label="Colorful balls bouncing inside a rotating luminous circle, playing Für Elise"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;
  const colors = ['#ff286f', '#ff7333', '#ffcf24', '#91ff36', '#20ffc2', '#24d5ff', '#5475ff', '#b650ff', '#ff39d3'];
  const balls = [], sparks = [], ripples = [];
  let width = 0, height = 0, radius = 1, dpr = 1, rotation = 0, elapsed = 0;
  let lastTime = 0, accumulator = 0;
  const step = 1 / 120;
  const random = (a, b) => a + Math.random() * (b - a);

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    radius = Math.min(width, height) * 0.425;
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // Positions and speeds use the enclosure radius, so resizing preserves motion.
  for (let i = 0; i < 42; i++) {
    const angle = i * 2.3999632297;
    const distance = Math.sqrt((i + 0.5) / 42) * 0.87;
    const heading = angle + random(0.7, 2.5);
    const speed = random(0.22, 0.39);
    balls.push({
      x: Math.cos(angle) * distance, y: Math.sin(angle) * distance,
      vx: Math.cos(heading) * speed, vy: Math.sin(heading) * speed,
      r: random(0.027, 0.044), color: colors[i % colors.length],
      trail: [], glow: 0, cooldown: 0
    });
  }

  // The recurring A theme. Every wall impact advances exactly one note.
  const melody = (`
    E5 D#5 E5 D#5 E5 B4 D5 C5 A4
    C4 E4 A4 B4 E4 G#4 B4 C5
    E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4
    C4 E4 A4 B4 E4 C5 B4 A4
    E5 D#5 E5 D#5 E5 B4 D5 C5 A4
    C4 E4 A4 B4 E4 G#4 B4 C5
    E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4
    C4 E4 A4 B4 E4 C5 B4 A4
    B4 C5 D5 E5 G4 F5 E5 D5 F4 E5 D5 C5
    E4 D5 C5 B4 E4 E5 E6 D#5 E5 D#5 E5 D#5 E5
    B4 D5 C5 A4 C4 E4 A4 B4 E4 G#4 B4 C5
    E4 E5 D#5 E5 D#5 E5 B4 D5 C5 A4
    C4 E4 A4 B4 E4 C5 B4 A4
  `).trim().split(/\s+/).map(name => {
    const match = /^([A-G])(#?)(\d)$/.exec(name);
    const semitone = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[match[1]];
    return 440 * Math.pow(2, (12 * (Number(match[3]) + 1) + semitone + (match[2] ? 1 : 0) - 69) / 12);
  });
  let noteIndex = 0, audio = null, master = null, reverb = null;
  const voices = new Set();

  function startAudio() {
    try {
      if (!audio) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        audio = new AudioContext();
        const compressor = audio.createDynamicsCompressor();
        compressor.threshold.value = -19;
        compressor.knee.value = 20;
        compressor.ratio.value = 5;
        compressor.connect(audio.destination);
        master = audio.createGain();
        master.gain.value = 0.28;
        master.connect(compressor);
        reverb = audio.createConvolver();
        const impulse = audio.createBuffer(2, Math.floor(audio.sampleRate * 1.4), audio.sampleRate);
        for (let channel = 0; channel < 2; channel++) {
          const data = impulse.getChannelData(channel);
          for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3) * 0.35;
        }
        reverb.buffer = impulse;
        const wet = audio.createGain();
        wet.gain.value = 0.19;
        reverb.connect(wet).connect(master);
      }
      if (audio.state === 'suspended') audio.resume().catch(() => {});
    } catch (_) { /* Animation stays active when audio is unavailable. */ }
  }
  window.addEventListener('pointerdown', startAudio, { passive: true });
  window.addEventListener('keydown', startAudio);
  startAudio();

  function playNote(frequency, x, intensity) {
    if (!audio || audio.state !== 'running') return;
    const now = audio.currentTime;
    const envelope = audio.createGain();
    const pan = audio.createStereoPanner ? audio.createStereoPanner() : audio.createGain();
    if (pan.pan) pan.pan.value = x * 0.65;
    envelope.connect(pan);
    pan.connect(master);
    pan.connect(reverb);
    const level = 0.18 + intensity * 0.10;
    envelope.gain.setValueAtTime(0, now);
    envelope.gain.linearRampToValueAtTime(level, now + 0.004);
    envelope.gain.exponentialRampToValueAtTime(level * 0.36, now + 0.16);
    envelope.gain.exponentialRampToValueAtTime(0.0001, now + 1.35);
    const oscillators = [];
    // Slightly inharmonic, independently decaying partials give a struck-key tone.
    [1, 2.001, 3.004, 4.009].forEach((partial, i) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = 'sine';
      osc.frequency.value = frequency * partial;
      gain.gain.setValueAtTime([1, 0.28, 0.105, 0.04][i], now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + [1.3, 0.7, 0.4, 0.22][i]);
      osc.connect(gain).connect(envelope);
      osc.start(now);
      osc.stop(now + 1.4);
      oscillators.push(osc);
      osc.onended = () => { osc.disconnect(); gain.disconnect(); };
    });
    const voice = { envelope, oscillators };
    voices.add(voice);
    oscillators[0].onended = () => {
      oscillators[0].disconnect();
      envelope.disconnect(); pan.disconnect(); voices.delete(voice);
    };
    if (voices.size > 32) {
      const oldest = voices.values().next().value;
      oldest.envelope.gain.cancelScheduledValues(now);
      oldest.envelope.gain.setTargetAtTime(0.0001, now, 0.01);
      voices.delete(oldest);
    }
  }

  function impact(ball, nx, ny, speed) {
    const pitch = melody[noteIndex++ % melody.length];
    playNote(pitch, ball.x, Math.min(speed, 1));
    ball.glow = 1;
    const angle = Math.atan2(ny, nx);
    ripples.push({ angle, life: 1, color: ball.color });
    for (let i = 0; i < 9; i++) {
      const a = angle + Math.PI + random(-1.2, 1.2);
      const v = random(0.08, 0.37);
      sparks.push({ x: nx, y: ny, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, size: random(0.002, 0.005), color: ball.color });
    }
  }

  function update(dt) {
    elapsed += dt;
    rotation += dt * 0.075;
    for (const b of balls) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.glow = Math.max(0, b.glow - dt * 2.8);
      const distance = Math.hypot(b.x, b.y);
      if (distance > 1 - b.r) {
        const nx = b.x / distance, ny = b.y / distance;
        b.x = nx * (1 - b.r); b.y = ny * (1 - b.r);
        const outward = b.vx * nx + b.vy * ny;
        if (outward > 0) {
          b.vx -= 2 * outward * nx; b.vy -= 2 * outward * ny;
          impact(b, nx, ny, outward);
        }
      }
    }
    // Balls pass in layered orbits; the circular wall is their striking surface.
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.7;
      if (p.life <= 0) sparks.splice(i, 1);
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      ripples[i].life -= dt * 2;
      if (ripples[i].life <= 0) ripples.splice(i, 1);
    }
  }

  function circle(x, y, r, fill) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill();
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#080516'; ctx.fillRect(0, 0, width, height);
    ctx.translate(width / 2, height / 2);
    ctx.scale(radius, radius);
    const backdrop = ctx.createRadialGradient(-0.25, -0.3, 0.05, 0, 0, 1.25);
    backdrop.addColorStop(0, '#181237'); backdrop.addColorStop(0.72, '#0e0b24'); backdrop.addColorStop(1, '#080516');
    circle(0, 0, 1.25, backdrop);

    // Faint concentric traces frame the brighter rotating segmented halo.
    ctx.lineWidth = 0.0015;
    ctx.strokeStyle = '#8c72ff18';
    for (const r of [1.065, 1.105]) {
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
    }
    ctx.save();
    ctx.rotate(rotation);
    ctx.lineCap = 'round';
    ctx.shadowBlur = 18; ctx.shadowColor = '#934eff';
    for (let i = 0; i < 72; i++) {
      const a = i * TAU / 72;
      ctx.strokeStyle = colors[Math.floor(i / 8) % colors.length];
      ctx.lineWidth = i % 8 === 0 ? 0.010 : 0.004;
      ctx.globalAlpha = i % 8 === 0 ? 0.95 : 0.45;
      ctx.beginPath(); ctx.arc(0, 0, 1.036, a, a + TAU / 72 * 0.55); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    const rim = ctx.createLinearGradient(-1, -1, 1, 1);
    rim.addColorStop(0, '#27e7ff'); rim.addColorStop(0.34, '#7274ff');
    rim.addColorStop(0.67, '#f543d5'); rim.addColorStop(1, '#ff9653');
    ctx.strokeStyle = rim; ctx.lineWidth = 0.006;
    ctx.beginPath(); ctx.arc(0, 0, 1.003, 0, TAU); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = ['#72f4ff', '#e58bff', '#ff9dcd'][i];
      ctx.lineWidth = 0.009;
      ctx.beginPath(); ctx.arc(0, 0, 1.015, i * TAU / 3, i * TAU / 3 + 0.21); ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, 0.998, 0, TAU); ctx.clip();
    for (const b of balls) {
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 14) b.trail.shift();
      ctx.lineCap = 'round';
      for (let i = 1; i < b.trail.length; i++) {
        ctx.globalAlpha = (i / b.trail.length) * 0.20;
        ctx.strokeStyle = b.color;
        ctx.lineWidth = b.r * 1.5 * i / b.trail.length;
        ctx.beginPath(); ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y);
        ctx.lineTo(b.trail[i].x, b.trail[i].y); ctx.stroke();
      }
      ctx.globalAlpha = 0.13 + b.glow * 0.22;
      const halo = ctx.createRadialGradient(b.x, b.y, b.r * 0.6, b.x, b.y, b.r * 3.1);
      halo.addColorStop(0, b.color); halo.addColorStop(1, 'transparent');
      circle(b.x, b.y, b.r * 3.1, halo);
      ctx.globalAlpha = 1;
      const fill = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, 0, b.x, b.y, b.r * 1.1);
      fill.addColorStop(0, '#fff7ff'); fill.addColorStop(0.19, b.color);
      fill.addColorStop(0.72, b.color); fill.addColorStop(1, '#211143');
      circle(b.x, b.y, b.r, fill);
      ctx.globalAlpha = 0.65;
      circle(b.x - b.r * 0.30, b.y - b.r * 0.36, b.r * 0.17, '#ffffff');
    }
    for (const p of sparks) {
      ctx.globalAlpha = p.life * 0.85;
      circle(p.x, p.y, p.size * p.life, p.color);
    }
    ctx.restore();
    ctx.lineCap = 'round';
    for (const p of ripples) {
      const spread = 0.025 + (1 - p.life) * 0.15;
      ctx.globalAlpha = p.life;
      ctx.strokeStyle = p.color; ctx.lineWidth = 0.012 * p.life;
      ctx.shadowColor = p.color; ctx.shadowBlur = 20 * p.life;
      ctx.beginPath(); ctx.arc(0, 0, 1.002, p.angle - spread, p.angle + spread); ctx.stroke();
      ctx.globalAlpha = p.life * p.life * 0.5;
      ctx.lineWidth = 0.003;
      ctx.beginPath(); ctx.arc(Math.cos(p.angle), Math.sin(p.angle), (1 - p.life) * 0.12 + 0.01, 0, TAU); ctx.stroke();
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  function frame(time) {
    const delta = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : step;
    lastTime = time;
    accumulator += delta;
    while (accumulator >= step) { update(step); accumulator -= step; }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
