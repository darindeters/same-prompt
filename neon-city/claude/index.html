<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon City</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#07031a;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');

let W=0,H=0,DPR=1,U=1,AMP=0,LW=0,groundY=0;
const PAR=[0.12,0.3,0.6,1];
const LAYER_COL=['#2c1b63','#1e1149','#130a32','#070416'];
const NEON=['#ff2bd6','#19f5ff','#ffe53b','#39ff88','#ff7a1a','#b35cff','#4d8cff','#ff3d6e'];
const WIN=['#ffd27a','#8af7ff','#ff8fe0','#d6ffe8','#fff6e0','#ffb15c'];

const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;

let layers=[],signs=[],boards=[],beacons=[],beams=[],cars=[],rainTiers=[],splashes=[],clouds=[];
let skyGrad=null;
let flash=0,flashSeq=0,nextFlash=5;

/* ---------------- scene construction ---------------- */
function setSize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,window.innerWidth);
  H=Math.max(1,window.innerHeight);
  cv.width=Math.round(W*DPR);
  cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  U=Math.min(2,Math.max(0.5,Math.min(W,H)/1080));
}

function build(){
  AMP=W*0.05;
  LW=W+2*AMP;
  groundY=H*0.87;
  layers=[];signs=[];boards=[];beacons=[];beams=[];

  const cfgs=[
    {wmin:16,wmax:46,tmin:.30,tmax:.62,gap:[0,3],cell:4,litP:.22,wa:.35},
    {wmin:28,wmax:80,tmin:.22,tmax:.56,gap:[0,8],cell:5,litP:.28,wa:.5},
    {wmin:50,wmax:120,tmin:.15,tmax:.52,gap:[2,26],cell:7,litP:.33,wa:.72},
    {wmin:80,wmax:190,tmin:.27,tmax:.72,gap:[22,95],cell:9,litP:.38,wa:.9}
  ];
  for(let d=0;d<4;d++){
    const c=document.createElement('canvas');
    c.width=Math.ceil(LW*DPR); c.height=Math.ceil(H*DPR);
    const g=c.getContext('2d'); g.scale(DPR,DPR);
    const cfg=cfgs[d];
    let x=-R(0,40*U);
    while(x<LW){
      const bw=R(cfg.wmin,cfg.wmax)*U;
      const top=H*R(cfg.tmin,cfg.tmax);
      drawBuilding(g,d,x,top,bw,cfg);
      x+=bw+R(cfg.gap[0],cfg.gap[1])*U;
    }
    if(d<3){
      g.globalCompositeOperation='source-atop';
      const hz=g.createLinearGradient(0,0,0,H);
      hz.addColorStop(0,'rgba(70,25,140,0)');
      hz.addColorStop(1,'rgba(110,40,170,'+[0.5,0.32,0.16][d]+')');
      g.fillStyle=hz; g.fillRect(0,0,LW,H);
    }
    layers.push(c);
  }

  skyGrad=ctx.createLinearGradient(0,0,0,groundY);
  skyGrad.addColorStop(0,'#04021a');
  skyGrad.addColorStop(0.4,'#160a46');
  skyGrad.addColorStop(0.72,'#3d0f6e');
  skyGrad.addColorStop(1,'#7d1a7a');

  clouds=[];
  for(let i=0;i<5;i++) clouds.push({x:R(0,W),y:H*R(0.05,0.5),rx:W*R(0.25,0.5),ry:H*R(0.04,0.1),sp:R(4,14)*U,a:R(0.08,0.18),hue:R(260,320)});

  cars=[];
  const n=Math.round(24*Math.min(1.6,W*H/1.2e6+0.5));
  for(let i=0;i<n;i++) cars.push(newCar(true));

  rainTiers=[];
  const area=W*H/1e6;
  const tiers=[{n:240*area,len:9,sp:620,a:0.16,w:1},{n:150*area,len:16,sp:920,a:0.3,w:1.2},{n:85*area,len:26,sp:1350,a:0.6,w:1.7}];
  for(const tr of tiers){
    const drops=[];
    for(let i=0;i<tr.n;i++) drops.push({x:R(-W*0.25,W),y:R(-H,H)});
    rainTiers.push({cfg:tr,drops});
  }
  splashes=[];
}

function drawBuilding(g,d,x,top,bw,cfg){
  const col=LAYER_COL[d];
  g.globalAlpha=1;
  g.fillStyle=col;
  let bodyTop=top;
  if(Math.random()<0.4){
    const tw=bw*R(.4,.7), th=R(20,80)*U;
    g.fillRect(x+(bw-tw)/2,top,tw,th);
    bodyTop=top+th;
    if(Math.random()<0.5){ const tw2=tw*R(.3,.6); g.fillRect(x+(bw-tw2)/2,top-R(8,25)*U,tw2,30*U); }
  }
  g.fillRect(x,bodyTop,bw,groundY-bodyTop);
  g.fillStyle='rgba(255,255,255,0.035)';
  g.fillRect(x,bodyTop,bw*0.08,groundY-bodyTop);
  g.fillStyle='rgba(0,0,0,0.25)';
  g.fillRect(x+bw*0.9,bodyTop,bw*0.1,groundY-bodyTop);

  if(Math.random()<0.4){
    const ax=x+bw*R(.3,.7), ah=R(15,70)*U;
    g.strokeStyle=col; g.lineWidth=1.6*U;
    g.beginPath(); g.moveTo(ax,top); g.lineTo(ax,top-ah); g.stroke();
    if(d>=2) beacons.push({d,x:ax,y:top-ah,ph:R(0,TAU),sp:R(1.5,3.2)});
  }

  const cell=cfg.cell*U, m=cell*0.5;
  const ww=Math.max(1,cell*0.45), wh=Math.max(1,cell*0.55);
  const ncols=Math.max(0,Math.floor((bw-m)/cell));
  const colDark=new Set();
  for(let i=0;i<ncols;i++) if(Math.random()<0.15) colDark.add(i);
  const base=pick(WIN);
  for(let wy=bodyTop+m; wy<groundY-cell; wy+=cell){
    if(Math.random()>0.92) continue;
    for(let i=0;i<ncols;i++){
      if(colDark.has(i)) continue;
      if(Math.random()<cfg.litP){
        g.fillStyle=Math.random()<0.75?base:pick(WIN);
        g.globalAlpha=cfg.wa*R(0.35,1);
        g.fillRect(x+m+i*cell,wy,ww,wh);
      }
    }
  }
  g.globalAlpha=1;

  if(d>=2&&Math.random()<0.4){
    const c=pick(NEON); const side=Math.random()<.5?x+1.5*U:x+bw-1.5*U;
    g.save(); g.shadowColor=c; g.shadowBlur=14*U; g.strokeStyle=c; g.lineWidth=2*U; g.globalAlpha=0.9;
    g.beginPath(); g.moveTo(side,bodyTop+R(0,30)*U); g.lineTo(side,groundY-R(0,40)*U); g.stroke(); g.restore();
  }
  if(d>=1&&Math.random()<0.3){
    const c=pick(NEON);
    g.save(); g.shadowColor=c; g.shadowBlur=8*U; g.strokeStyle=c; g.lineWidth=1.2*U; g.globalAlpha=0.8;
    const n=RI(1,4);
    for(let k=0;k<n;k++){ const yy=R(bodyTop+10*U,groundY-20*U); g.beginPath(); g.moveTo(x,yy); g.lineTo(x+bw,yy); g.stroke(); }
    g.restore();
  }
  if(d>=2&&Math.random()<0.5){
    const c=pick(NEON);
    g.save(); g.shadowColor=c; g.shadowBlur=10*U; g.strokeStyle=c; g.lineWidth=1.6*U; g.globalAlpha=0.9;
    g.beginPath(); g.moveTo(x,bodyTop); g.lineTo(x+bw,bodyTop); g.stroke(); g.restore();
  }

  if(d>=2){
    const n=d===3?RI(1,3):(Math.random()<0.6?1:0);
    for(let k=0;k<n;k++) makeSign(d,x,bodyTop,bw);
  }
  if(d>=2&&bw>90*U&&Math.random()<0.5){
    const bwid=bw*R(.5,.8), bh=bwid*R(.35,.6);
    const y0=bodyTop+15*U, y1=groundY-bh-60*U;
    if(y1>y0) boards.push({d,x:x+(bw-bwid)/2,y:R(y0,y1),w:bwid,h:bh,hue:R(0,360),sp:R(10,40),ph:R(0,TAU),mode:RI(0,2)});
  }
  if(d===3&&top<H*0.45&&beams.length<2&&Math.random()<0.5){
    beams.push({x:x+bw*R(.3,.7),y:top,base:R(-0.5,0.5),range:R(0.3,0.6),sp:R(0.15,0.35),ph:R(0,TAU),col:pick(['rgba(80,240,255,','rgba(255,80,220,','rgba(255,230,120,'])});
  }
}

function makeSign(d,x,top,bw){
  const sw=Math.min(bw*0.8,R(20,70)*U);
  const y1=groundY-80*U, y0=top+10*U;
  if(y1<=y0) return;
  const sx=x+R(bw*0.1,bw*0.9-sw), sy=R(y0,y1);
  const p=new Path2D();
  const type=RI(0,6);
  switch(type){
    case 0:{ const n=RI(2,3); for(let i=0;i<n;i++){ p.moveTo(sx,sy+i*8*U); p.lineTo(sx+sw*(i===n-1?0.6:1),sy+i*8*U); } break; }
    case 1:{ const h=R(40,120)*U, vx=sx+sw/2; p.moveTo(vx,sy); p.lineTo(vx,Math.min(sy+h,groundY-10*U)); p.moveTo(vx-5*U,sy); p.lineTo(vx+5*U,sy); break; }
    case 2:{ const r=Math.min(sw/2,R(8,20)*U), cx=sx+sw/2, cy=sy+r; p.arc(cx,cy,r,0,TAU); if(Math.random()<.5){ p.moveTo(cx+r*0.55,cy); p.arc(cx,cy,r*0.55,0,TAU);} break; }
    case 3:{ const h=R(10,24)*U; p.rect(sx,sy,sw,h); p.moveTo(sx,sy+h); p.lineTo(sx+sw*0.35,sy); break; }
    case 4:{ const n=RI(4,8), a=R(4,8)*U; p.moveTo(sx,sy); for(let i=1;i<=n;i++) p.lineTo(sx+sw*i/n,sy+(i%2?-a:a)); break; }
    case 5:{ const h=R(14,30)*U; p.rect(sx,sy,sw,h); const cols=RI(3,7);
      for(let i=0;i<cols;i++){ const gx=sx+sw*(i+0.5)/cols, seg=RI(1,3);
        for(let k=0;k<seg;k++){ const yy=sy+h*R(.15,.85);
          if(Math.random()<.5){ p.moveTo(gx-sw/cols*0.3,yy); p.lineTo(gx+sw/cols*0.3,yy); }
          else { p.moveTo(gx,yy); p.lineTo(gx,Math.min(sy+h*0.85,yy+h*R(.2,.5))); } } }
      break; }
    default:{ const n=RI(2,4), ch=R(6,10)*U; for(let i=0;i<n;i++){ const cy=sy+i*ch*1.4; p.moveTo(sx,cy); p.lineTo(sx+sw/2,cy+ch); p.lineTo(sx+sw,cy); } }
  }
  signs.push({d,p,col:pick(NEON),lw:(d===3?2.2:1.5)*U,ph:R(0,TAU),fr:R(2,6),fl:Math.random()<0.4});
}

function newCar(anywhere){
  const depth=R(0.3,3.8);
  const sc=0.3+depth*0.28;
  const dir=Math.random()<.5?1:-1;
  const sp=R(70,210)*sc*U;
  const len=R(20,32)*sc*U;
  return {depth,sc,dir,sp,len,y0:R(H*0.06,H*0.74),amp:R(10,55)*sc*U,fr:R(0.004,0.012)/(sc*U),ph:R(0,TAU),
    x:anywhere?R(-100,W+100):(dir>0?-150*sc*U:W+150*sc*U),col:pick(NEON),hl:Math.random()<0.3?'#ffe9b0':'#dffcff'};
}

/* ---------------- update ---------------- */
function update(dt,t){
  for(let i=0;i<cars.length;i++){
    const c=cars[i]; c.x+=c.dir*c.sp*dt;
    if(c.x<-250*U||c.x>W+250*U) cars[i]=newCar(false);
  }
  const wind=0.18;
  for(const tr of rainTiers){
    const sp=tr.cfg.sp*U*dt, len=tr.cfg.len*U;
    for(const r of tr.drops){
      r.y+=sp; r.x+=sp*wind;
      if(r.y>H){ r.y=-len-R(0,60); r.x=R(-W*0.3,W); }
    }
  }
  const want=Math.round(dt*160*(W/1080));
  for(let i=0;i<want&&splashes.length<80;i++) splashes.push({x:R(0,W),y:R(groundY+2,H),life:0,sp:R(1.6,3.2)});
  for(let i=splashes.length-1;i>=0;i--){ const s=splashes[i]; s.life+=dt*s.sp; if(s.life>=1) splashes.splice(i,1); }
  for(const c of clouds){ c.x+=c.sp*dt; if(c.x-c.rx>W) c.x=-c.rx; }

  nextFlash-=dt;
  if(nextFlash<0){ flash=1; flashSeq=RI(1,3); nextFlash=R(7,18); }
  if(flash>0){ flash=Math.max(0,flash-dt*5); if(flash<0.45&&flashSeq>0&&Math.random()<dt*10){ flash=R(0.6,1); flashSeq--; } }
}

/* ---------------- render helpers ---------------- */
function carY(c){ return c.y0+Math.sin(c.x*c.fr+c.ph)*c.amp; }

function drawCar(c,t){
  const y=carY(c)+Math.sin(t*2.2+c.ph)*1.5*c.sc;
  const L=c.len, h=L*0.3;
  const slope=Math.cos(c.x*c.fr+c.ph)*c.amp*c.fr;
  ctx.save();
  ctx.translate(c.x,y);
  if(c.dir<0) ctx.scale(-1,1);
  ctx.rotate(c.dir*Math.atan(slope)*0.8);
  ctx.globalCompositeOperation='lighter';
  const tl=Math.max(L*1.5,c.sp*0.45);
  const tg=ctx.createLinearGradient(-L/2,0,-L/2-tl,0);
  tg.addColorStop(0,'rgba(255,40,80,0.75)');
  tg.addColorStop(0.3,'rgba(255,40,120,0.3)');
  tg.addColorStop(1,'rgba(255,40,120,0)');
  ctx.strokeStyle=tg; ctx.lineWidth=h*0.55; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-L/2,0); ctx.lineTo(-L/2-tl,0); ctx.stroke();
  const hg=ctx.createRadialGradient(L/2,0,0,L/2,0,L*0.9);
  hg.addColorStop(0,'rgba(255,255,255,0.7)');
  hg.addColorStop(0.25,'rgba(190,245,255,0.35)');
  hg.addColorStop(1,'rgba(190,245,255,0)');
  ctx.fillStyle=hg; ctx.fillRect(L/2-L*0.9,-L*0.9,L*1.8,L*1.8);
  const ug=ctx.createRadialGradient(0,h*0.6,0,0,h*0.6,L*0.7);
  ug.addColorStop(0,c.col); ug.addColorStop(1,'rgba(0,0,0,0)');
  ctx.globalAlpha=0.45; ctx.fillStyle=ug; ctx.fillRect(-L*0.7,-L*0.2,L*1.4,L*1.0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#0a0618';
  ctx.beginPath();
  const r=h/2;
  ctx.moveTo(-L/2+r,-h/2); ctx.lineTo(L/2-r*0.6,-h/2); ctx.quadraticCurveTo(L/2+r*0.3,-h/2,L/2,0);
  ctx.quadraticCurveTo(L/2+r*0.3,h/2,L/2-r*0.6,h/2); ctx.lineTo(-L/2+r,h/2);
  ctx.arc(-L/2+r,0,r,Math.PI/2,Math.PI*1.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(130,225,255,0.45)';
  ctx.beginPath(); ctx.ellipse(L*0.08,-h*0.35,L*0.26,h*0.32,0,0,TAU); ctx.fill();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=c.hl; ctx.beginPath(); ctx.arc(L/2-h*0.1,-h*0.15,h*0.22,0,TAU); ctx.arc(L/2-h*0.1,h*0.15,h*0.22,0,TAU); ctx.fill();
  ctx.fillStyle='#ff2a4a'; ctx.beginPath(); ctx.arc(-L/2+h*0.15,-h*0.28,h*0.2,0,TAU); ctx.arc(-L/2+h*0.15,h*0.28,h*0.2,0,TAU); ctx.fill();
  ctx.strokeStyle=c.col; ctx.lineWidth=Math.max(1,h*0.18); ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.moveTo(-L*0.4,h*0.5); ctx.lineTo(L*0.35,h*0.5); ctx.stroke();
  ctx.restore();
}

function drawCars(min,max,t){
  for(const c of cars) if(c.depth>=min&&c.depth<max) drawCar(c,t);
}

function drawSigns(d,ox,t){
  ctx.save(); ctx.translate(ox,0);
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of signs){
    if(s.d!==d) continue;
    let it=0.82+0.18*Math.sin(t*s.fr+s.ph);
    if(s.fl){ const f=Math.sin(t*7.3+s.ph)*Math.sin(t*11.7+s.ph*1.7); if(f>0.88) it*=0.12; }
    ctx.strokeStyle=s.col;
    ctx.globalAlpha=0.07*it; ctx.lineWidth=s.lw*8; ctx.stroke(s.p);
    ctx.globalAlpha=0.18*it; ctx.lineWidth=s.lw*3.2; ctx.stroke(s.p);
    ctx.globalAlpha=0.95*it; ctx.lineWidth=s.lw*1.25; ctx.stroke(s.p);
    ctx.strokeStyle='#ffffff'; ctx.globalAlpha=0.75*it; ctx.lineWidth=s.lw*0.4; ctx.stroke(s.p);
  }
  ctx.restore();
}

function drawBoards(d,ox,t){
  for(const b of boards){
    if(b.d!==d) continue;
    const hue=(b.hue+t*b.sp)%360;
    ctx.save(); ctx.translate(ox,0);
    ctx.fillStyle='#050310'; ctx.fillRect(b.x-3*U,b.y-3*U,b.w+6*U,b.h+6*U);
    let g;
    const cx=b.x+b.w/2, cy=b.y+b.h/2;
    if(b.mode===0){
      g=ctx.createLinearGradient(b.x,b.y,b.x+b.w,b.y+b.h);
      g.addColorStop(0,'hsl('+hue+',100%,60%)');
      g.addColorStop(0.5,'hsl('+((hue+60)%360)+',100%,55%)');
      g.addColorStop(1,'hsl('+((hue+140)%360)+',100%,50%)');
    } else if(b.mode===1){
      g=ctx.createLinearGradient(b.x,0,b.x+b.w,0);
      const n=6;
      for(let i=0;i<=n;i++){ const l=50+28*Math.sin(t*2.5+i*1.3+b.ph); g.addColorStop(i/n,'hsl('+((hue+i*35)%360)+',100%,'+l+'%)'); }
    } else {
      const rr=b.w*0.75*(0.8+0.2*Math.sin(t*2+b.ph));
      g=ctx.createRadialGradient(cx,cy,0,cx,cy,rr);
      g.addColorStop(0,'hsl('+hue+',100%,78%)');
      g.addColorStop(0.5,'hsl('+((hue+40)%360)+',100%,52%)');
      g.addColorStop(1,'hsl('+((hue+200)%360)+',100%,32%)');
    }
    ctx.fillStyle=g; ctx.globalAlpha=0.9; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.beginPath(); ctx.rect(b.x,b.y,b.w,b.h); ctx.clip();
    ctx.globalAlpha=0.35; ctx.fillStyle='#000';
    const step=4*U;
    for(let y=b.y+((t*30*U)%step); y<b.y+b.h; y+=step) ctx.fillRect(b.x,y,b.w,step*0.3);
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.55;
    const bx=b.x+((t*b.sp*2.5*U)%(b.w+60*U))-30*U;
    const sg=ctx.createLinearGradient(bx-25*U,0,bx+25*U,0);
    sg.addColorStop(0,'rgba(255,255,255,0)'); sg.addColorStop(0.5,'rgba(255,255,255,0.7)'); sg.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=sg; ctx.fillRect(bx-25*U,b.y,50*U,b.h);
    ctx.restore();
    ctx.save(); ctx.translate(ox,0); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.35;
    const gl=ctx.createRadialGradient(cx,cy,b.w*0.3,cx,cy,b.w*0.95);
    gl.addColorStop(0,'hsla('+hue+',100%,60%,0.55)'); gl.addColorStop(1,'hsla('+hue+',100%,60%,0)');
    ctx.fillStyle=gl; ctx.fillRect(cx-b.w,cy-b.w,b.w*2,b.w*2);
    ctx.restore();
  }
}

function drawBeacons(d,ox,t){
  ctx.save(); ctx.translate(ox,0); ctx.globalCompositeOperation='lighter';
  for(const b of beacons){
    if(b.d!==d) continue;
    const on=Math.sin(t*b.sp+b.ph); if(on<0.2) continue;
    const a=(on-0.2)/0.8, r=7*U;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r*2);
    g.addColorStop(0,'rgba(255,90,90,'+a+')'); g.addColorStop(0.25,'rgba(255,40,40,'+(a*0.5)+')'); g.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(b.x-r*2,b.y-r*2,r*4,r*4);
  }
  ctx.restore();
}

function drawBeams(ox,t){
  for(const b of beams){
    const ang=-Math.PI/2+b.base+Math.sin(t*b.sp+b.ph)*b.range;
    const len=H*1.4, spread=0.055;
    ctx.save(); ctx.translate(ox+b.x,b.y); ctx.rotate(ang); ctx.globalCompositeOperation='lighter';
    const g=ctx.createLinearGradient(0,0,len,0);
    g.addColorStop(0,b.col+'0.32)'); g.addColorStop(0.4,b.col+'0.12)'); g.addColorStop(1,b.col+'0)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(len,-len*spread); ctx.lineTo(len,len*spread); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawFog(y,alpha,phase,t){
  ctx.save();
  ctx.translate(W/2+Math.sin(t*0.07+phase)*W*0.18,y);
  ctx.scale(1,0.2);
  const g=ctx.createRadialGradient(0,0,0,0,0,W*0.8);
  g.addColorStop(0,'rgba(170,90,240,'+alpha+')'); g.addColorStop(0.6,'rgba(120,50,200,'+(alpha*0.4)+')'); g.addColorStop(1,'rgba(100,40,180,0)');
  ctx.fillStyle=g; ctx.fillRect(-W*0.8,-W*0.8,W*1.6,W*1.6);
  ctx.restore();
}

function drawGround(t){
  ctx.fillStyle='#050211'; ctx.fillRect(0,groundY,W,H-groundY);
  const gh=H-groundY, n=14, sh=gh/n, st=1.15;
  ctx.save(); ctx.translate(0,groundY); ctx.scale(1,-1);
  for(let i=0;i<n;i++){
    const dx=Math.sin(t*2.4+i*0.9)*2.2*U*(1+i/n*2);
    ctx.globalAlpha=0.5*(1-i/n*0.75);
    const sy=groundY-(i+1)*sh*st;
    if(sy<0) break;
    ctx.drawImage(cv,0,sy*DPR,cv.width,sh*st*DPR,dx,-(i+1)*sh,W,sh+0.5);
  }
  ctx.restore();
  ctx.globalAlpha=1;
  const dg=ctx.createLinearGradient(0,groundY,0,H);
  dg.addColorStop(0,'rgba(5,2,15,0.05)'); dg.addColorStop(1,'rgba(5,2,15,0.8)');
  ctx.fillStyle=dg; ctx.fillRect(0,groundY,W,gh);
  ctx.globalCompositeOperation='lighter';
  const cg=ctx.createLinearGradient(0,groundY-4*U,0,groundY+6*U);
  cg.addColorStop(0,'rgba(25,245,255,0)'); cg.addColorStop(0.45,'rgba(25,245,255,0.9)'); cg.addColorStop(0.55,'rgba(255,43,214,0.9)'); cg.addColorStop(1,'rgba(255,43,214,0)');
  ctx.fillStyle=cg; ctx.fillRect(0,groundY-4*U,W,10*U);
  ctx.strokeStyle='rgba(200,235,255,1)'; ctx.lineWidth=1*U;
  for(const s of splashes){
    const a=(1-s.life)*0.55, r=(2+s.life*16)*U;
    ctx.globalAlpha=a; ctx.beginPath(); ctx.ellipse(s.x,s.y,r,r*0.3,0,0,TAU); ctx.stroke();
    if(s.life<0.4){ ctx.globalAlpha=a*0.8; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x,s.y-(1-s.life)*8*U); ctx.stroke(); }
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
}

function drawRain(){
  const wind=0.18, inv=1/Math.sqrt(1+wind*wind);
  ctx.lineCap='round';
  for(const tr of rainTiers){
    const len=tr.cfg.len*U, dx=len*wind*inv, dy=len*inv;
    ctx.strokeStyle='rgba(175,215,255,'+tr.cfg.a+')'; ctx.lineWidth=tr.cfg.w*U;
    ctx.beginPath();
    for(const r of tr.drops){ ctx.moveTo(r.x,r.y); ctx.lineTo(r.x-dx,r.y-dy); }
    ctx.stroke();
  }
}

/* ---------------- main render ---------------- */
function render(t){
  const camX=Math.sin(t*0.06)*AMP;
  const ox=d=>-AMP+camX*PAR[d];

  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.fillStyle=skyGrad; ctx.fillRect(0,0,W,groundY+1);
  const hz=ctx.createRadialGradient(W*0.5,groundY,0,W*0.5,groundY,W*0.75);
  hz.addColorStop(0,'rgba(255,60,200,0.55)'); hz.addColorStop(0.5,'rgba(200,40,180,0.2)'); hz.addColorStop(1,'rgba(120,20,160,0)');
  ctx.fillStyle=hz; ctx.fillRect(0,0,W,groundY+1);
  for(const c of clouds){
    ctx.save(); ctx.translate(c.x,c.y); ctx.scale(1,c.ry/c.rx);
    const g=ctx.createRadialGradient(0,0,0,0,0,c.rx);
    g.addColorStop(0,'hsla('+c.hue+',80%,55%,'+c.a+')'); g.addColorStop(1,'hsla('+c.hue+',80%,55%,0)');
    ctx.fillStyle=g; ctx.fillRect(-c.rx,-c.rx,c.rx*2,c.rx*2); ctx.restore();
  }
  if(flash>0){ ctx.fillStyle='rgba(205,215,255,'+(flash*0.55)+')'; ctx.fillRect(0,0,W,groundY+1); }

  ctx.drawImage(layers[0],ox(0),0,LW,H);
  drawCars(0,1,t);
  ctx.drawImage(layers[1],ox(1),0,LW,H);
  drawFog(H*0.75,0.3,0,t);
  drawCars(1,2,t);
  ctx.drawImage(layers[2],ox(2),0,LW,H);
  drawBoards(2,ox(2),t); drawSigns(2,ox(2),t); drawBeacons(2,ox(2),t);
  drawFog(H*0.84,0.22,2.5,t);
  drawCars(2,3,t);
  ctx.drawImage(layers[3],ox(3),0,LW,H);
  drawBoards(3,ox(3),t); drawSigns(3,ox(3),t); drawBeacons(3,ox(3),t);
  drawBeams(ox(3),t);
  drawCars(3,9,t);

  if(flash>0){ ctx.fillStyle='rgba(200,210,255,'+(flash*0.14)+')'; ctx.fillRect(0,0,W,H); }

  drawGround(t);
  drawRain();

  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,10,0.55)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
}

/* ---------------- loop ---------------- */
let last=performance.now(), t=0;
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000)); last=now; t+=dt;
  update(dt,t); render(t);
  requestAnimationFrame(frame);
}

let resizeTimer=null;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{ setSize(); build(); },120);
}
window.addEventListener('resize',onResize);
setSize(); build();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
