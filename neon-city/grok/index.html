<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Neon City</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070114;
    overflow: hidden;
    touch-action: none;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const COLORS = [
    "#00f3ff",
    "#ff2bd6",
    "#ffe500",
    "#39ff6a",
    "#ff5a1f",
    "#b44dff",
    "#3d7dff",
    "#ff3b6a"
  ];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  let W = 1;
  let H = 1;
  let S = 1;
  let vpX = 0;
  let vpY = 0;

  const rgbCache = Object.create(null);
  function rgb(hex) {
    let c = rgbCache[hex];
    if (!c) {
      const n = parseInt(hex.slice(1), 16);
      c = rgbCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    return c;
  }
  function rgba(hex, a) {
    const c = rgb(hex);
    return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
  }
  function hash(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    S = Math.min(W, H) / 1080;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    vpX = W * 0.5;
    vpY = H * 0.34;
  }

  function project(z) {
    const p = Math.pow(Math.max(z, 0), 0.78);
    return {
      p: p,
      yBase: vpY + (H * 0.985 - vpY) * p,
      halfRoad: W * (0.02 + 0.2 * p)
    };
  }

  function softBlob(x, y, r, color, alpha) {
    if (r <= 0.5) return;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, rgba(color, alpha));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCone(x, y, ang, len, spread, color) {
    const x1 = x + Math.cos(ang - spread) * len;
    const y1 = y + Math.sin(ang - spread) * len;
    const x2 = x + Math.cos(ang + spread) * len;
    const y2 = y + Math.sin(ang + spread) * len;
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const g = ctx.createLinearGradient(x, y, mx, my);
    g.addColorStop(0, rgba(color, 0.16));
    g.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.fill();
  }

  function buildSkyline(rng) {
    const arr = [];
    let x = 0;
    while (x < 1) {
      const w = 0.008 + rng() * 0.026;
      arr.push({
        x: x,
        w: w,
        h: 0.03 + rng() * 0.15,
        lit: rng() > 0.32,
        color: COLORS[(rng() * COLORS.length) | 0],
        win: rng()
      });
      x += w;
    }
    return arr;
  }

  function buildStars(rng) {
    const arr = [];
    for (let i = 0; i < 110; i++) {
      const roll = rng();
      arr.push({
        x: rng(),
        y: rng() * 0.32,
        r: roll > 0.94 ? 0.0032 : roll > 0.8 ? 0.002 : 0.0011,
        a: 0.35 + rng() * 0.65,
        phase: rng() * Math.PI * 2,
        spd: 0.6 + rng() * 2.4,
        color: roll > 0.86 ? "#ff7ad4" : roll > 0.73 ? "#ffe500" : "#e7f7ff"
      });
    }
    return arr;
  }

  function tower(side, z, width, height, color, color2, extra) {
    return Object.assign({
      side: side,
      z: z,
      width: width,
      height: height,
      color: color,
      color2: color2,
      cols: width < 0.28 ? 3 : 4,
      rows: height > 1 ? 14 : 10,
      density: 0.58,
      sign: true,
      signKind: 0,
      antenna: false,
      search: false,
      step: true,
      seed: side * 80 + Math.round(z * 1000) + height * 10,
      special: null
    }, extra || {});
  }

  const buildings = [
    tower(0, 0.09, 0.2, 1, "#00f3ff", "#ff2bd6", {
      special: "core", sign: true, signKind: 1, antenna: true, search: true,
      step: false, cols: 3, rows: 15, density: 0.82, seed: 3
    }),
    tower(-1, 0.14, 0.3, 0.7, "#00f3ff", "#ffe500", { signKind: 0, density: 0.7, seed: 11 }),
    tower(-1, 0.23, 0.26, 1.12, "#ff2bd6", "#00f3ff", {
      signKind: 4, antenna: true, search: true, step: false, density: 0.5, seed: 12
    }),
    tower(-1, 0.33, 0.36, 0.56, "#ffe500", "#ff5a1f", { signKind: 2, density: 0.76, seed: 13 }),
    tower(-1, 0.44, 0.28, 0.9, "#39ff6a", "#00f3ff", { signKind: 1, antenna: true, seed: 14 }),
    tower(-1, 0.56, 0.34, 0.64, "#ff5a1f", "#ffe500", { signKind: 3, density: 0.48, seed: 15 }),
    tower(-1, 0.68, 0.24, 1.16, "#b44dff", "#ff2bd6", {
      signKind: 4, antenna: true, search: true, step: false, seed: 16
    }),
    tower(-1, 0.81, 0.33, 0.52, "#3d7dff", "#00f3ff", { signKind: 0, density: 0.66, seed: 17 }),
    tower(-1, 0.96, 0.42, 0.88, "#ff3b6a", "#ffe500", { signKind: 1, antenna: true, density: 0.72, seed: 18 }),
    tower(1, 0.18, 0.28, 0.96, "#ff2bd6", "#ffe500", { signKind: 3, antenna: true, seed: 21 }),
    tower(1, 0.28, 0.34, 0.6, "#00f3ff", "#39ff6a", { signKind: 0, density: 0.8, seed: 22 }),
    tower(1, 0.39, 0.26, 1.1, "#ffe500", "#ff2bd6", {
      signKind: 4, antenna: true, search: true, step: false, seed: 23
    }),
    tower(1, 0.5, 0.36, 0.72, "#b44dff", "#00f3ff", { signKind: 2, seed: 24 }),
    tower(1, 0.62, 0.3, 0.84, "#ff5a1f", "#ffe500", { signKind: 1, antenna: true, density: 0.55, seed: 25 }),
    tower(1, 0.74, 0.25, 1.05, "#39ff6a", "#00f3ff", { signKind: 4, antenna: true, step: false, seed: 26 }),
    tower(1, 0.88, 0.38, 0.55, "#ff3b6a", "#b44dff", { signKind: 0, density: 0.74, seed: 27 }),
    tower(1, 1.03, 0.44, 0.94, "#00f3ff", "#ff2bd6", { signKind: 1, antenna: true, density: 0.68, seed: 28 })
  ];

  const vehicles = [
    { kind: "depth", z: 0.18, speed: 0.085, lane: -0.32, weaveAmp: 0.26, weaveFreq: 0.7, alt: 0.32, phase: 0.4, scale: 1, color: "#00f3ff", accent: "#ffe500", trail: [], trailMax: 30 },
    { kind: "depth", z: 0.42, speed: -0.07, lane: 0.28, weaveAmp: 0.32, weaveFreq: 0.55, alt: 0.66, phase: 2.1, scale: 1.12, color: "#ff2bd6", accent: "#00f3ff", trail: [], trailMax: 30 },
    { kind: "depth", z: 0.74, speed: 0.12, lane: -0.08, weaveAmp: 0.22, weaveFreq: 0.95, alt: 0.46, phase: 1.1, scale: 1.28, color: "#ffe500", accent: "#ff2bd6", trail: [], trailMax: 34 },
    { kind: "depth", z: 0.3, speed: 0.15, lane: 0.5, weaveAmp: 0.16, weaveFreq: 1.15, alt: 0.82, phase: 3.4, scale: 0.82, color: "#39ff6a", accent: "#00f3ff", trail: [], trailMax: 26 },
    { kind: "depth", z: 0.6, speed: -0.11, lane: -0.5, weaveAmp: 0.24, weaveFreq: 0.62, alt: 0.2, phase: 4.2, scale: 1.05, color: "#ff5a1f", accent: "#ffe500", trail: [], trailMax: 30 },
    { kind: "depth", z: 0.1, speed: 0.055, lane: 0.06, weaveAmp: 0.36, weaveFreq: 0.42, alt: 0.9, phase: 5.1, scale: 0.72, color: "#b44dff", accent: "#ff2bd6", trail: [], trailMax: 24 },
    { kind: "depth", z: 0.9, speed: -0.13, lane: 0.12, weaveAmp: 0.28, weaveFreq: 0.84, alt: 0.54, phase: 2.5, scale: 1.36, color: "#3d7dff", accent: "#00f3ff", trail: [], trailMax: 34 },
    { kind: "cross", z: 0.25, u: 0.15, dir: 1, speed: 0.09, alt: 0.76, weaveFreq: 0.8, phase: 0.3, scale: 0.92, color: "#00f3ff", accent: "#ffe500", trail: [], trailMax: 28 },
    { kind: "cross", z: 0.41, u: 0.72, dir: -1, speed: 0.15, alt: 0.38, weaveFreq: 1.35, phase: 1.6, scale: 1.08, color: "#ff2bd6", accent: "#ffe500", trail: [], trailMax: 30 },
    { kind: "cross", z: 0.64, u: 0.38, dir: 1, speed: 0.11, alt: 0.58, weaveFreq: 0.95, phase: 2.7, scale: 1.18, color: "#ffe500", accent: "#ff5a1f", trail: [], trailMax: 30 },
    { kind: "cross", z: 0.8, u: 0.08, dir: -1, speed: 0.17, alt: 0.26, weaveFreq: 1.55, phase: 0.9, scale: 1.12, color: "#39ff6a", accent: "#00f3ff", trail: [], trailMax: 26 },
    { kind: "cruiser", z: 0.52, u: 0.48, dir: 1, speed: 0.042, alt: 0.7, weaveFreq: 0.34, phase: 1.3, scale: 1.5, color: "#b44dff", accent: "#00f3ff", trail: [], trailMax: 40 },
    { kind: "cruiser", z: 0.32, u: 0.2, dir: -1, speed: 0.032, alt: 0.88, weaveFreq: 0.26, phase: 2.2, scale: 1.18, color: "#ff5a1f", accent: "#ffe500", trail: [], trailMax: 36 }
  ];

  const portals = [
    { z: 0.36, alt: 0.6, lane: 0, scale: 1.12, spin: 0.32, color: "#00f3ff", color2: "#ff2bd6" },
    { z: 0.71, alt: 0.4, lane: -0.1, scale: 1, spin: -0.5, color: "#ff2bd6", color2: "#ffe500" }
  ];

  const puddles = [
    { z: 0.6, lane: -0.28, rx: 0.055, ry: 0.012, color: "#00f3ff" },
    { z: 0.76, lane: 0.32, rx: 0.07, ry: 0.015, color: "#ff2bd6" },
    { z: 0.9, lane: -0.02, rx: 0.1, ry: 0.02, color: "#ffe500" },
    { z: 1.08, lane: 0.2, rx: 0.08, ry: 0.018, color: "#b44dff" }
  ];

  function buildRain(rng) {
    const drops = [];
    for (let i = 0; i < 190; i++) {
      const z = rng();
      const tintRoll = rng();
      drops.push({
        x: rng(),
        y: rng(),
        z: z,
        spd: 0.75 + rng() * 0.55,
        len: 0.018 + rng() * 0.04 + z * 0.012,
        sheet: rng() > 0.9,
        ground: 0.58 + rng() * 0.42,
        tint: tintRoll < 0.12 ? "#ff7ad4" : tintRoll < 0.22 ? "#7af6ff" : "#e7f7ff"
      });
    }
    return drops;
  }

  const rngSky = mulberry32(11);
  const skyline = buildSkyline(rngSky);
  const stars = buildStars(mulberry32(19));
  const rain = buildRain(mulberry32(33));
  let splashes = [];

  let flashStart = -20;
  let nextFlash = 4.5;
  let bolts = [];

  function buildingGeom(b) {
    const pr = project(b.z);
    const p = pr.p;
    let bh = H * b.height * (0.2 + 0.7 * Math.pow(Math.min(p, 1), 0.78));
    let bw = W * b.width * (0.25 + 0.75 * Math.min(p, 1));
    if (b.special === "core") {
      bw = W * 0.095;
      bh = H * 0.46;
    }
    let left;
    let streetX;
    if (b.side === 0) {
      left = vpX - bw / 2;
      streetX = vpX;
    } else {
      streetX = vpX + b.side * pr.halfRoad;
      left = b.side === 1 ? streetX : streetX - bw;
    }
    const base = pr.yBase;
    return {
      pr: pr,
      p: p,
      bh: bh,
      bw: bw,
      left: left,
      top: base - bh,
      base: base,
      streetX: streetX,
      right: left + bw
    };
  }

  function traceSilhouette(g, b) {
    const left = g.left;
    const top = g.top;
    const bw = g.bw;
    const bh = g.bh;
    ctx.beginPath();
    if (!b.step) {
      ctx.rect(left, top, bw, bh);
      return;
    }
    const inset = bw * 0.16;
    const mid = top + bh * 0.38;
    ctx.moveTo(left + inset, top);
    ctx.lineTo(left + bw - inset, top);
    ctx.lineTo(left + bw - inset, mid);
    ctx.lineTo(left + bw, mid);
    ctx.lineTo(left + bw, top + bh);
    ctx.lineTo(left, top + bh);
    ctx.lineTo(left, mid);
    ctx.lineTo(left + inset, mid);
    ctx.closePath();
  }

  function roofBox(g, b) {
    if (!b.step) return { x: g.left, y: g.top, w: g.bw, h: g.bh * 0.42 };
    const inset = g.bw * 0.16;
    return { x: g.left + inset, y: g.top, w: g.bw - inset * 2, h: g.bh * 0.38 };
  }

  function drawSign(kind, x, y, w, h, color, accent, t, seed) {
    if (w < 8 || h < 8) return;
    const pulse = 0.65 + 0.35 * Math.sin(t * 2.2 + seed);
    ctx.fillStyle = rgba(color, 0.24 * pulse);
    ctx.fillRect(x - w * 0.08, y - h * 0.14, w * 1.16, h * 1.28);
    ctx.fillStyle = "#140812";
    ctx.fillRect(x, y, w, h);
    ctx.lineWidth = Math.max(2 * S, Math.min(w, h) * 0.06);
    ctx.strokeStyle = color;
    ctx.strokeRect(x, y, w, h);

    ctx.save();
    ctx.beginPath();
    ctx.rect(x + 1, y + 1, w - 2, h - 2);
    ctx.clip();

    if (kind === 0) {
      for (let i = 0; i < 4; i++) {
        const by = y + h * (0.14 + i * 0.21);
        const phase = 0.5 + 0.5 * Math.sin(t * 3.1 + i * 0.9 + seed);
        ctx.fillStyle = rgba(i % 2 ? accent : color, 0.3 + 0.7 * phase);
        ctx.fillRect(x + w * 0.12, by, w * 0.76, h * 0.11);
      }
    } else if (kind === 1) {
      const cx = x + w / 2;
      const cy = y + h / 2;
      const r = Math.min(w, h) * 0.3;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(2.5 * S, r * 0.2);
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = accent;
      ctx.lineWidth = Math.max(2 * S, r * 0.12);
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.58, t * 1.8 + seed, t * 1.8 + seed + 4.2);
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(cx, cy, Math.max(2, r * 0.12), 0, Math.PI * 2);
      ctx.fill();
    } else if (kind === 2) {
      ctx.lineWidth = Math.max(3 * S, h * 0.09);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      for (let i = 0; i < 3; i++) {
        const ox = x + w * (0.22 + i * 0.22);
        const shift = Math.sin(t * 2.4 + seed + i) * w * 0.03;
        ctx.strokeStyle = i === 1 ? accent : color;
        ctx.globalAlpha = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 4 + i + seed));
        ctx.beginPath();
        ctx.moveTo(ox + shift, y + h * 0.22);
        ctx.lineTo(ox + w * 0.14 + shift, y + h * 0.5);
        ctx.lineTo(ox + shift, y + h * 0.78);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (kind === 3) {
      const cx = x + w / 2;
      const cy = y + h / 2;
      ctx.beginPath();
      ctx.moveTo(cx, y + h * 0.14);
      ctx.lineTo(x + w * 0.84, cy);
      ctx.lineTo(cx, y + h * 0.86);
      ctx.lineTo(x + w * 0.16, cy);
      ctx.closePath();
      ctx.fillStyle = rgba(color, 0.3 + 0.45 * pulse);
      ctx.fill();
      ctx.lineWidth = Math.max(2 * S, 2);
      ctx.strokeStyle = accent;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx, y + h * 0.32);
      ctx.lineTo(x + w * 0.66, cy);
      ctx.lineTo(cx, y + h * 0.68);
      ctx.lineTo(x + w * 0.34, cy);
      ctx.closePath();
      ctx.strokeStyle = "#ffffff";
      ctx.globalAlpha = 0.85;
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else {
      for (let i = 0; i < 5; i++) {
        const mag = 0.28 + 0.68 * (0.5 + 0.5 * Math.sin(t * 3.4 + i * 0.85 + seed));
        const bw = w * 0.1;
        const bx = x + w * (0.14 + i * 0.15);
        const bh2 = h * 0.7 * mag;
        ctx.fillStyle = i % 2 ? accent : color;
        ctx.fillRect(bx, y + h * 0.86 - bh2, bw, bh2);
      }
    }
    ctx.restore();

    if ((seed % 5) === 0 && hash(seed + Math.floor(t * 13)) > 0.84) {
      ctx.fillStyle = "rgba(6, 0, 12, 0.78)";
      ctx.fillRect(x, y, w, h);
    }
  }

  function drawBuilding(b, t) {
    const g = buildingGeom(b);
    if (g.bh < 4 || g.bw < 3) return;

    traceSilhouette(g, b);
    const facade = ctx.createLinearGradient(g.left, g.top, g.left, g.base);
    facade.addColorStop(0, "#261238");
    facade.addColorStop(0.45, "#140a1e");
    facade.addColorStop(1, "#09060f");
    ctx.fillStyle = facade;
    ctx.fill();
    ctx.strokeStyle = rgba(b.color, 0.28);
    ctx.lineWidth = Math.max(7 * S, g.bw * 0.045);
    ctx.stroke();
    ctx.strokeStyle = b.color;
    ctx.lineWidth = Math.max(2 * S, g.bw * 0.014);
    ctx.stroke();

    ctx.save();
    traceSilhouette(g, b);
    ctx.clip();

    const wash = ctx.createLinearGradient(g.left, g.top, g.left, g.base);
    wash.addColorStop(0, rgba(b.color, 0.34));
    wash.addColorStop(0.35, rgba(b.color, 0.08));
    wash.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(g.left, g.top, g.bw, g.bh);

    if (b.side === -1) {
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(g.left, g.top, g.bw * 0.32, g.bh);
    } else if (b.side === 1) {
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(g.left + g.bw * 0.68, g.top, g.bw * 0.32, g.bh);
    }

    ctx.fillStyle = rgba(b.color2, 0.8);
    const belt = Math.max(1.5 * S, g.bh * 0.008);
    ctx.fillRect(g.left, g.top + g.bh * 0.42, g.bw, belt);
    ctx.fillRect(g.left, g.top + g.bh * 0.68, g.bw, belt);

    const padX = g.bw * 0.1;
    const padY = g.bh * 0.07;
    const cw = (g.bw - padX * 2) / b.cols;
    const rh = (g.bh - padY * 2) / b.rows;
    for (let r = 0; r < b.rows; r++) {
      for (let c = 0; c < b.cols; c++) {
        const n = hash(b.seed * 1.7 + c * 9.2 + r * 5.1);
        let lit = n < b.density;
        if (lit && n > b.density - 0.1) {
          if (hash(b.seed + c * 4 + r * 7 + Math.floor(t * 7)) > 0.5) lit = false;
        }
        const wx = g.left + padX + c * cw + cw * 0.2;
        const wy = g.top + padY + r * rh + rh * 0.22;
        const ww = cw * 0.6;
        const wh = rh * 0.55;
        if (ww < 0.6 || wh < 0.6) continue;
        if (!lit) {
          ctx.fillStyle = "rgba(6, 10, 24, 0.9)";
          ctx.fillRect(wx, wy, ww, wh);
        } else {
          const col = n > 0.9 ? "#f4fbff" : n > 0.62 ? b.color : n > 0.4 ? b.color2 : "#ffe500";
          if (g.p > 0.45) {
            ctx.fillStyle = rgba(col, 0.28);
            ctx.fillRect(wx - ww * 0.35, wy - wh * 0.35, ww * 1.7, wh * 1.7);
          }
          ctx.fillStyle = col;
          ctx.fillRect(wx, wy, ww, wh);
        }
      }
    }

    const cabinH = Math.max(4 * S, g.bh * 0.035);
    const travel = (t * (0.12 + (b.seed % 4) * 0.025) + (b.seed % 10) * 0.1) % 1;
    const ey = g.top + travel * (g.bh - cabinH);
    ctx.fillStyle = b.color2;
    ctx.fillRect(g.left + g.bw * (b.side === 1 ? 0.18 : 0.72), ey, Math.max(2, g.bw * 0.1), cabinH);

    if (b.sign) {
      const roof = roofBox(g, b);
      const sw = roof.w * 0.74;
      const sh = Math.min(roof.h * 0.72, g.bh * 0.16, sw * 0.62);
      const sx = roof.x + (roof.w - sw) / 2;
      const sy = roof.y + roof.h * 0.16;
      drawSign(b.signKind % 5, sx, sy, sw, sh, b.color, b.color2, t, b.seed);
    }

    ctx.restore();

    const pipeW = Math.max(3 * S, g.bw * 0.035);
    ctx.fillStyle = rgba(b.color, 0.3);
    if (b.side === 0) {
      ctx.fillRect(g.left - pipeW, g.top, pipeW * 2.2, g.bh);
      ctx.fillRect(g.right - pipeW * 1.2, g.top, pipeW * 2.2, g.bh);
      ctx.fillStyle = b.color;
      ctx.fillRect(g.left - pipeW * 0.2, g.top, pipeW * 0.55, g.bh);
      ctx.fillRect(g.right - pipeW * 0.35, g.top, pipeW * 0.55, g.bh);
    } else {
      const px = b.side === 1 ? g.left - pipeW * 0.3 : g.right - pipeW * 0.7;
      ctx.fillRect(px - pipeW * 0.6, g.top, pipeW * 2.2, g.bh);
      ctx.fillStyle = b.color;
      ctx.fillRect(px, g.top, pipeW * 0.55, g.bh);
      const pulses = 3;
      for (let i = 0; i < pulses; i++) {
        const u = (t * 0.28 + i / pulses + b.seed * 0.01) % 1;
        ctx.fillStyle = i % 2 ? "#ffffff" : b.color2;
        ctx.fillRect(px, g.top + u * g.bh, pipeW * 0.55, Math.max(6 * S, g.bh * 0.045));
      }
    }

    ctx.fillStyle = b.color2;
    ctx.fillRect(g.left, g.top, g.bw, Math.max(2 * S, 2.5 * S));
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.95;
    ctx.fillRect(g.left, g.base - Math.max(2 * S, 3 * S), g.bw, Math.max(2 * S, 3 * S));
    ctx.globalAlpha = 1;

    if (b.special === "core") {
      const cx = g.left + g.bw / 2;
      ctx.fillStyle = b.color;
      ctx.fillRect(cx - 2 * S, g.top, 4 * S, g.bh);
      const py = g.top + ((t * 0.4) % 1) * g.bh;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(cx - 2.5 * S, py, 5 * S, g.bh * 0.07);
      for (let i = 0; i < 5; i++) {
        const yy = g.top + g.bh * (0.14 + i * 0.11);
        const rw = g.bw * (0.85 + 0.45 * (0.5 + 0.5 * Math.sin(t * 0.9 + i)));
        ctx.strokeStyle = i % 2 ? b.color2 : b.color;
        ctx.globalAlpha = 0.85;
        ctx.lineWidth = Math.max(2 * S, 2);
        ctx.beginPath();
        ctx.ellipse(cx, yy, rw, Math.max(3 * S, g.bh * 0.02), 0, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    if (b.antenna) {
      const ax = b.side === 0 ? g.left + g.bw / 2 : g.left + g.bw * (b.side === 1 ? 0.72 : 0.28);
      const ah = H * 0.035 * (0.45 + Math.min(g.p, 1));
      ctx.strokeStyle = rgba(b.color, 0.9);
      ctx.lineWidth = Math.max(1.25 * S, 1.25);
      ctx.beginPath();
      ctx.moveTo(ax, g.top);
      ctx.lineTo(ax, g.top - ah);
      ctx.stroke();
      const blink = 0.35 + 0.65 * Math.max(0, Math.sin(t * 5.2 + b.seed));
      softBlob(ax, g.top - ah, 8 * S + 6 * Math.min(g.p, 1), "#ffe500", 0.8 * blink);
      ctx.fillStyle = rgba("#fff6d0", blink);
      ctx.beginPath();
      ctx.arc(ax, g.top - ah, Math.max(1.6 * S, 2 * S), 0, Math.PI * 2);
      ctx.fill();
    }

    if (b.search) {
      const ax = g.left + g.bw * 0.5;
      const ang = -Math.PI / 2 + Math.sin(t * 0.42 + b.seed) * 0.6;
      drawCone(ax, g.top, ang, Math.min(W, H) * 0.48, 0.16, b.color);
    }
  }

  function vehiclePose(c, t) {
    const pr = project(c.z);
    const p = Math.min(pr.p, 1.25);
    const bob = Math.sin(t * c.weaveFreq + c.phase);
    const bank = Math.cos(t * c.weaveFreq + c.phase);
    if (c.kind === "depth") {
      const lane = Math.max(-0.78, Math.min(0.78, c.lane + bob * c.weaveAmp));
      const x = vpX + lane * pr.halfRoad;
      const rise = H * (0.06 + c.alt * 0.62) * (0.22 + 0.78 * Math.min(p, 1));
      const s = Math.min(W, H) * (0.016 + 0.072 * Math.min(p, 1)) * c.scale;
      return {
        x: x,
        y: pr.yBase - rise,
        tilt: bank * 0.38,
        len: s * 1.2,
        hgt: s * 0.74,
        dir: 1,
        mode: "depth",
        approaching: c.speed > 0,
        pr: pr
      };
    }
    const reach = pr.halfRoad + W * (0.26 + 0.7 * Math.min(p, 1));
    const x = vpX + (c.u * 2 - 1) * reach;
    const rise = H * (0.08 + c.alt * 0.68) * (0.25 + 0.75 * Math.min(p, 1));
    const s = Math.min(W, H) * (0.017 + 0.058 * Math.min(p, 1)) * c.scale;
    const cruiser = c.kind === "cruiser";
    return {
      x: x,
      y: pr.yBase - rise + bob * H * 0.012 * Math.min(p, 1),
      tilt: bank * 0.12 * c.dir,
      len: s * (cruiser ? 3.5 : 2.35),
      hgt: s * (cruiser ? 0.82 : 0.6),
      dir: c.dir,
      mode: c.kind,
      approaching: true,
      pr: pr
    };
  }

  function rememberTrail(c, x, y) {
    const last = c.trail[c.trail.length - 1];
    if (last) {
      const dx = x - last.x;
      const dy = y - last.y;
      const limit = Math.min(W, H) * 0.22;
      if (dx * dx + dy * dy > limit * limit) c.trail.length = 0;
    }
    c.trail.push({ x: x, y: y });
    if (c.trail.length > c.trailMax) c.trail.shift();
  }

  function drawTrail(trail, color, width) {
    if (trail.length < 2) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineCap = "round";
    for (let i = 1; i < trail.length; i++) {
      const a = Math.pow(i / trail.length, 1.35);
      ctx.strokeStyle = rgba(color, 0.04 + a * 0.5);
      ctx.lineWidth = Math.max(1, width * (0.25 + a));
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.stroke();
      if (a > 0.62) {
        ctx.strokeStyle = rgba("#ffffff", (a - 0.62) * 0.9);
        ctx.lineWidth = Math.max(1, width * 0.28);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawDepthCar(x, y, w, h, tilt, color, accent, approaching) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    softBlob(0, h * 0.15, w * 0.95, color, 0.4);
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, h * 0.3);
    ctx.lineTo(-w * 0.4, -h * 0.02);
    ctx.lineTo(-w * 0.26, -h * 0.42);
    ctx.lineTo(w * 0.26, -h * 0.42);
    ctx.lineTo(w * 0.4, -h * 0.02);
    ctx.lineTo(w * 0.5, h * 0.3);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -h, 0, h);
    g.addColorStop(0, "#321848");
    g.addColorStop(0.5, "#140a1c");
    g.addColorStop(1, "#07040e");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1.6 * S, w * 0.04);
    ctx.strokeStyle = color;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(-w * 0.18, -h * 0.05);
    ctx.lineTo(-w * 0.1, -h * 0.32);
    ctx.lineTo(w * 0.1, -h * 0.32);
    ctx.lineTo(w * 0.18, -h * 0.05);
    ctx.closePath();
    ctx.fillStyle = rgba(accent, 0.95);
    ctx.fill();

    const light = approaching ? "#fff4d2" : "#ff3b6a";
    for (let s = -1; s <= 1; s += 2) {
      const hx = s * w * 0.28;
      const hy = h * 0.16;
      softBlob(hx, hy, w * 0.22, light, 0.95);
      ctx.fillStyle = approaching ? "#fffaf0" : "#ffd0e6";
      ctx.beginPath();
      ctx.ellipse(hx, hy, Math.max(1.5, w * 0.075), Math.max(1.2, h * 0.07), 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSideCar(x, y, len, h, dir, tilt, color, accent, cruiser) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(tilt);
    ctx.scale(dir, 1);
    softBlob(-len * 0.42, 0, h * 0.7, color, 0.55);
    const ug = ctx.createLinearGradient(0, -h * 0.1, 0, h * 0.9);
    ug.addColorStop(0, rgba(color, 0.08));
    ug.addColorStop(0.35, rgba(color, 0.45));
    ug.addColorStop(1, rgba(color, 0));
    ctx.fillStyle = ug;
    ctx.beginPath();
    ctx.ellipse(0, h * 0.2, len * 0.4, h * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    if (cruiser) {
      ctx.moveTo(-len * 0.48, -h * 0.12);
      ctx.lineTo(-len * 0.4, -h * 0.4);
      ctx.lineTo(len * 0.28, -h * 0.4);
      ctx.lineTo(len * 0.48, -h * 0.1);
      ctx.lineTo(len * 0.48, h * 0.18);
      ctx.lineTo(-len * 0.48, h * 0.2);
    } else {
      ctx.moveTo(-len * 0.46, h * 0.02);
      ctx.lineTo(-len * 0.32, -h * 0.2);
      ctx.lineTo(-len * 0.06, -h * 0.38);
      ctx.lineTo(len * 0.16, -h * 0.34);
      ctx.lineTo(len * 0.46, -h * 0.06);
      ctx.lineTo(len * 0.48, h * 0.16);
      ctx.lineTo(len * 0.08, h * 0.28);
      ctx.lineTo(-len * 0.4, h * 0.24);
    }
    ctx.closePath();
    const g = ctx.createLinearGradient(0, -h, 0, h);
    g.addColorStop(0, "#341c4c");
    g.addColorStop(0.55, "#140a1e");
    g.addColorStop(1, "#08040f");
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1.7 * S, h * 0.07);
    ctx.strokeStyle = color;
    ctx.stroke();

    if (cruiser) {
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = rgba(accent, 0.9);
        ctx.fillRect(-len * 0.28 + i * len * 0.12, -h * 0.28, len * 0.07, h * 0.22);
      }
    } else {
      ctx.beginPath();
      ctx.moveTo(-len * 0.1, -h * 0.2);
      ctx.lineTo(0, -h * 0.48);
      ctx.quadraticCurveTo(len * 0.16, -h * 0.52, len * 0.22, -h * 0.2);
      ctx.closePath();
      ctx.fillStyle = rgba(accent, 0.95);
      ctx.fill();
    }

    ctx.strokeStyle = accent;
    ctx.lineWidth = Math.max(1.4 * S, h * 0.08);
    ctx.beginPath();
    ctx.moveTo(-len * 0.34, h * 0.02);
    ctx.lineTo(len * 0.3, h * 0.02);
    ctx.stroke();

    softBlob(len * 0.46, -h * 0.02, h * 0.42, "#fff4d2", 0.9);
    ctx.fillStyle = "#fffaf0";
    ctx.beginPath();
    ctx.ellipse(len * 0.46, -h * 0.02, Math.max(1.5, h * 0.1), Math.max(1.2, h * 0.07), 0, 0, Math.PI * 2);
    ctx.fill();

    const beam = ctx.createLinearGradient(len * 0.5, 0, len * 0.5 + len * 0.6, 0);
    beam.addColorStop(0, "rgba(255,246,220,0.38)");
    beam.addColorStop(1, "rgba(255,246,220,0)");
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(len * 0.5, -h * 0.18);
    ctx.lineTo(len * 1.12, -h * 0.46);
    ctx.lineTo(len * 1.12, h * 0.32);
    ctx.lineTo(len * 0.5, h * 0.14);
    ctx.closePath();
    ctx.fill();

    const engines = cruiser ? 3 : 1;
    for (let i = 0; i < engines; i++) {
      const ey = (i - (engines - 1) / 2) * h * 0.24;
      softBlob(-len * 0.5, ey, h * 0.32, color, 0.95);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(-len * 0.48, ey, Math.max(1.4 * S, h * 0.07), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawVehicle(c, t) {
    const pose = vehiclePose(c, t);
    rememberTrail(c, pose.x, pose.y);
    if (c.kind === "depth" && c.alt < 0.55) {
      softBlob(pose.x, pose.pr.yBase, pose.len * 0.85, c.color, 0.2 * (0.55 - c.alt) * 2);
    }
    drawTrail(c.trail, c.color, Math.max(3 * S, pose.hgt * 0.28));
    if (pose.mode === "depth") {
      drawDepthCar(pose.x, pose.y, pose.len, pose.hgt, pose.tilt, c.color, c.accent, pose.approaching);
    } else {
      drawSideCar(pose.x, pose.y, pose.len, pose.hgt, pose.dir, pose.tilt, c.color, c.accent, pose.mode === "cruiser");
    }
  }

  function traceHex(r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + i * (Math.PI / 3);
      const x = Math.cos(a) * r;
      const y = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function drawPortal(p, t) {
    const pr = project(p.z);
    const pc = Math.min(pr.p, 1.15);
    const rise = H * (0.16 + p.alt * 0.58) * (0.28 + 0.72 * Math.min(pc, 1));
    const x = vpX + p.lane * pr.halfRoad;
    const y = pr.yBase - rise;
    const s = Math.min(W, H) * (0.045 + 0.12 * Math.min(pc, 1)) * p.scale;
    ctx.save();
    ctx.translate(x, y);
    softBlob(0, 0, s * 1.15, p.color, 0.28);
    ctx.rotate(t * p.spin);
    ctx.globalCompositeOperation = "lighter";
    traceHex(s);
    ctx.strokeStyle = rgba(p.color, 0.35);
    ctx.lineWidth = Math.max(8 * S, s * 0.12);
    ctx.stroke();
    ctx.strokeStyle = p.color;
    ctx.lineWidth = Math.max(2.2 * S, s * 0.035);
    ctx.stroke();
    traceHex(s * 0.62);
    ctx.strokeStyle = p.color2;
    ctx.lineWidth = Math.max(2 * S, s * 0.028);
    ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const a = t * 1.6 + i * 2.1;
      ctx.fillStyle = i % 2 ? p.color2 : "#ffffff";
      ctx.beginPath();
      ctx.arc(Math.cos(a) * s * 0.82, Math.sin(a) * s * 0.82, Math.max(2 * S, s * 0.055), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function traceRoad() {
    const far = project(0.04);
    const near = project(1.5);
    ctx.beginPath();
    ctx.moveTo(vpX - far.halfRoad, far.yBase);
    ctx.lineTo(vpX + far.halfRoad, far.yBase);
    ctx.lineTo(vpX + near.halfRoad, near.yBase);
    ctx.lineTo(vpX - near.halfRoad, near.yBase);
    ctx.closePath();
  }

  function strokePoly(pts, style, width) {
    ctx.strokeStyle = style;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.stroke();
  }

  function drawGround(t) {
    const ground = ctx.createLinearGradient(0, vpY, 0, H);
    ground.addColorStop(0, "#ff3a90");
    ground.addColorStop(0.07, "#6a1458");
    ground.addColorStop(0.26, "#1a0824");
    ground.addColorStop(1, "#070212");
    ctx.fillStyle = ground;
    ctx.fillRect(0, vpY - 1, W, H - vpY + 1);

    traceRoad();
    const far = project(0.04);
    const road = ctx.createLinearGradient(vpX, far.yBase, vpX, H);
    road.addColorStop(0, "#ff4d9a");
    road.addColorStop(0.16, "#8a1868");
    road.addColorStop(0.42, "#1c0830");
    road.addColorStop(1, "#12061c");
    ctx.fillStyle = road;
    ctx.fill();

    ctx.save();
    traceRoad();
    ctx.clip();

    softBlob(vpX, vpY + H * 0.06, W * 0.3, "#ff2bd6", 0.28);
    softBlob(vpX, H * 0.78, W * 0.26, "#00f3ff", 0.12);
    softBlob(vpX, H * 0.9, W * 0.36, "#ff2bd6", 0.12);

    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i];
      const g = buildingGeom(b);
      const shim = 0.45 + 0.55 * Math.sin(t * 2.1 + b.seed);
      const rh = Math.min(H * 0.22, g.bh * 0.28) * (0.35 + Math.min(g.p, 1));
      const grad = ctx.createLinearGradient(g.streetX, g.base, g.streetX, g.base + rh);
      grad.addColorStop(0, rgba(b.color, 0.32 * shim));
      grad.addColorStop(0.45, rgba(b.color2, 0.12 * shim));
      grad.addColorStop(1, rgba(b.color, 0));
      ctx.fillStyle = grad;
      const rw = Math.max(8, g.bw * 0.34);
      ctx.fillRect(g.streetX - rw / 2, g.base, rw, rh);
    }

    for (let i = 0; i < vehicles.length; i++) {
      const c = vehicles[i];
      if (c.kind !== "depth") continue;
      const pose = vehiclePose(c, t);
      const strength = Math.max(0, 0.55 - c.alt);
      const rh = H * 0.08 * (0.4 + pose.pr.p);
      const grad = ctx.createLinearGradient(pose.x, pose.pr.yBase, pose.x, pose.pr.yBase + rh);
      grad.addColorStop(0, rgba(c.color, 0.45 * strength));
      grad.addColorStop(1, rgba(c.color, 0));
      ctx.fillStyle = grad;
      ctx.fillRect(pose.x - pose.len * 0.45, pose.pr.yBase, pose.len * 0.9, rh);
    }

    for (let i = 0; i < portals.length; i++) {
      const p = portals[i];
      const pr = project(p.z);
      const x = vpX + p.lane * pr.halfRoad;
      const pulse = 0.45 + 0.55 * Math.sin(t * 2 + i);
      ctx.fillStyle = rgba(p.color, 0.18 * pulse);
      ctx.beginPath();
      ctx.ellipse(x, pr.yBase + H * 0.02, pr.halfRoad * 0.35, H * 0.018 * (0.6 + pr.p), 0, 0, Math.PI * 2);
      ctx.fill();
    }

    for (let i = 0; i < puddles.length; i++) {
      const d = puddles[i];
      const pr = project(d.z);
      const x = vpX + d.lane * pr.halfRoad;
      const y = pr.yBase;
      const rx = d.rx * W * (0.45 + pr.p);
      const ry = d.ry * H * (0.5 + pr.p);
      const shimmer = 0.45 + 0.55 * Math.sin(t * 1.7 + i * 1.3);
      const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(rx, ry));
      g.addColorStop(0, rgba(d.color, 0.42 * shimmer));
      g.addColorStop(0.55, rgba(d.color, 0.12 * shimmer));
      g.addColorStop(1, rgba(d.color, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = rgba("#ffffff", 0.25 * shimmer);
      ctx.lineWidth = 1.25 * S;
      ctx.stroke();
    }

    const offset = (t * 0.38) % 1;
    for (let i = 0; i < 16; i++) {
      const u = (i / 16 + offset) % 1;
      const z1 = 0.1 + u * 1.25;
      const z2 = z1 + 0.04;
      const a = project(z1);
      const b = project(z2);
      const alpha = 0.2 + 0.75 * Math.min(a.p, 1);
      const lanes = [-0.48, 0, 0.48];
      for (let L = 0; L < lanes.length; L++) {
        const lane = lanes[L];
        ctx.strokeStyle = lane === 0 ? rgba("#ffe500", alpha) : rgba("#ff4d9a", alpha * 0.65);
        ctx.lineWidth = (lane === 0 ? 1.4 : 1) * (1.2 + 4.5 * Math.min(a.p, 1)) * S;
        ctx.beginPath();
        ctx.moveTo(vpX + lane * a.halfRoad, a.yBase);
        ctx.lineTo(vpX + lane * b.halfRoad, b.yBase);
        ctx.stroke();
      }
    }

    const walk = 0.9;
    for (let i = 0; i < 6; i++) {
      const pr = project(walk + i * 0.012);
      ctx.strokeStyle = rgba("#f2fbff", 0.22 + 0.25 * (0.5 + 0.5 * Math.sin(t * 2.2 + i)));
      ctx.lineWidth = (2 + pr.p * 3) * S;
      ctx.beginPath();
      ctx.moveTo(vpX - pr.halfRoad * 0.8, pr.yBase);
      ctx.lineTo(vpX + pr.halfRoad * 0.8, pr.yBase);
      ctx.stroke();
    }

    ctx.fillStyle = "rgba(3, 0, 10, 0.32)";
    for (let y = vpY; y < H + 8; y += 7) {
      const wiggle = Math.sin(y * 0.05 + t * 3.2) * 3;
      ctx.fillRect(0, y + wiggle, W, 2);
    }

    ctx.restore();

    for (let side = -1; side <= 1; side += 2) {
      const color = side === -1 ? "#00f3ff" : "#ff2bd6";
      const pts = [];
      for (let i = 0; i <= 28; i++) {
        const z = 0.05 + (i / 28) * 1.4;
        const pr = project(z);
        pts.push([vpX + side * pr.halfRoad, pr.yBase]);
      }
      strokePoly(pts, rgba(color, 0.22), Math.max(7 * S, 7));
      strokePoly(pts, color, Math.max(2 * S, 2));
      for (let k = 0; k < 2; k++) {
        const u = (t * (0.22 + k * 0.09) + k * 0.45) % 1;
        const pr = project(0.05 + u * 1.4);
        softBlob(vpX + side * pr.halfRoad, pr.yBase, (8 + 16 * Math.min(pr.p, 1)) * S + 4, color, 0.9);
      }
    }
  }

  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#12022c");
    g.addColorStop(0.16, "#3c0d86");
    g.addColorStop(0.28, "#c41880");
    g.addColorStop(0.34, "#ff3d92");
    g.addColorStop(0.46, "#4a1038");
    g.addColorStop(1, "#07010e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    softBlob(W * 0.78, H * 0.12, Math.min(W, H) * 0.34, "#ff2bd6", 0.42);
    softBlob(W * 0.18, H * 0.08, Math.min(W, H) * 0.28, "#3d5bff", 0.32);
    softBlob(vpX, vpY, W * 0.46, "#ff4d9a", 0.38);
    softBlob(W * 0.62, H * 0.16, Math.min(W, H) * 0.2, "#00eaff", 0.16);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.spd + s.phase));
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = s.color;
      const rad = s.r * Math.min(W, H);
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, Math.max(0.6, rad), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const px = W * 0.8;
    const py = H * 0.075;
    const pr = Math.min(W, H) * 0.05;
    softBlob(px, py, pr * 3.3, "#ff4db8", 0.4);
    const pg = ctx.createRadialGradient(px - pr * 0.35, py - pr * 0.35, pr * 0.1, px, py, pr);
    pg.addColorStop(0, "#ffe8ff");
    pg.addColorStop(0.4, "#ff4db5");
    pg.addColorStop(1, "#6d157c");
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = "rgba(8, 0, 20, 0.55)";
    ctx.beginPath();
    ctx.arc(px + pr * 0.55, py - pr * 0.05, pr * 0.95, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(-0.45);
    ctx.strokeStyle = rgba("#ffe500", 0.9);
    ctx.lineWidth = Math.max(2 * S, pr * 0.09);
    ctx.beginPath();
    ctx.ellipse(0, 0, pr * 1.9, pr * 0.42, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = rgba("#00f3ff", 0.75);
    ctx.lineWidth = Math.max(1.2 * S, pr * 0.04);
    ctx.beginPath();
    ctx.ellipse(0, 0, pr * 2.2, pr * 0.52, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    for (let i = 0; i < 4; i++) {
      const y = H * (0.045 + i * 0.028);
      const u = (t * (0.035 + i * 0.012) + i * 0.23) % 1;
      const x = -W * 0.15 + u * W * 1.3;
      const col = COLORS[i % COLORS.length];
      ctx.strokeStyle = rgba(col, 0.45);
      ctx.lineWidth = Math.max(1.5 * S, 1.5);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + W * 0.1, y);
      ctx.stroke();
      softBlob(x + W * 0.1, y, 7 * S + 3, col, 0.7);
    }

    const base = vpY;
    for (let i = 0; i < skyline.length; i++) {
      const s = skyline[i];
      const bh = s.h * H;
      const x = s.x * W;
      const w = s.w * W;
      ctx.fillStyle = "#1a0a2a";
      ctx.fillRect(x, base - bh, Math.max(1, w - 1), bh);
      if (s.lit) {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = 0.8;
        ctx.fillRect(
          x + w * 0.28,
          base - bh * (0.25 + s.win * 0.5),
          Math.max(1, w * 0.24),
          Math.max(1, bh * 0.09)
        );
        ctx.globalAlpha = 1;
      }
    }
  }

  function drawHaze() {
    const hg = ctx.createLinearGradient(0, vpY - H * 0.1, 0, vpY + H * 0.08);
    hg.addColorStop(0, "rgba(255, 40, 140, 0)");
    hg.addColorStop(0.55, "rgba(255, 50, 160, 0.28)");
    hg.addColorStop(1, "rgba(80, 0, 90, 0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, vpY - H * 0.1, W, H * 0.2);
  }

  function drawRays(t) {
    for (let i = 0; i < 8; i++) {
      const ang = -Math.PI / 2 + (i - 3.5) * 0.1 + Math.sin(t * 0.22 + i) * 0.02;
      drawCone(vpX, vpY + H * 0.01, ang, H * 0.5, 0.055, i % 2 ? "#ff2bd6" : "#7af0ff");
    }
  }

  function updateVehicle(c, dt) {
    if (c.kind === "depth") {
      c.z += c.speed * dt;
      if (c.z > 1.28) c.z = 0.06;
      if (c.z < 0.045) c.z = 1.22;
    } else {
      const before = c.u;
      c.u += c.dir * c.speed * dt;
      if (c.u > 1 || c.u < 0) {
        c.u = ((c.u % 1) + 1) % 1;
        if (Math.abs(c.u - before) > 0.5) c.trail.length = 0;
      }
    }
  }

  function updateRain(dt, t) {
    for (let i = 0; i < rain.length; i++) {
      const d = rain[i];
      d.y += dt * d.spd * (0.42 + d.z * 0.7);
      d.x += dt * 0.055 * (0.35 + d.z);
      if (d.x > 1.2) d.x = -0.15;
      if (d.y > d.ground) {
        if (splashes.length < 50 && d.z > 0.32) {
          splashes.push({
            x: ((d.x % 1) + 1) % 1 * W,
            y: Math.min(H - 2, d.ground * H),
            r: 2 * S,
            a: 0.55,
            color: d.tint
          });
        }
        d.y = -Math.random() * 0.25;
        d.x = Math.random();
        d.ground = 0.58 + Math.random() * 0.42;
      }
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const s = splashes[i];
      s.r += dt * 90;
      s.a -= dt * 1.5;
      if (s.a <= 0) splashes.splice(i, 1);
    }
    if (t > nextFlash) {
      flashStart = t;
      nextFlash = t + 8 + Math.random() * 8;
      bolts = [];
      const count = Math.random() > 0.55 ? 2 : 1;
      for (let n = 0; n < count; n++) {
        const pts = [];
        let x = W * (0.28 + Math.random() * 0.44);
        let y = H * 0.01;
        pts.push({ x: x, y: y });
        for (let k = 0; k < 7; k++) {
          x += (Math.random() - 0.5) * W * 0.07;
          y += H * 0.032 + Math.random() * H * 0.01;
          pts.push({ x: x, y: y });
        }
        bolts.push(pts);
      }
    }
  }

  function drawRain(z0, z1) {
    ctx.lineCap = "round";
    for (let i = 0; i < rain.length; i++) {
      const d = rain[i];
      if (d.z < z0 || d.z >= z1) continue;
      const len = d.len * H * (d.sheet ? 1.35 : 1);
      const x = d.x * W;
      const y = d.y * H;
      const near = d.z > 0.5;
      const alpha = (near ? 0.34 : 0.14) * (0.65 + d.z) * (d.sheet ? 0.7 : 1);
      ctx.strokeStyle = rgba(d.tint, Math.min(0.75, alpha));
      ctx.lineWidth = (d.sheet ? 2.6 : near ? 1.55 : 1) * Math.max(0.75, S);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + len * 0.2, y + len);
      ctx.stroke();
    }
  }

  function drawSplashes() {
    for (let i = 0; i < splashes.length; i++) {
      const s = splashes[i];
      ctx.strokeStyle = rgba(s.color, Math.max(0, s.a));
      ctx.lineWidth = 1.4 * Math.max(0.8, S);
      if (s.r < 0.6) continue;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, s.r, Math.max(0.6, s.r * 0.34), 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function flashIntensity(t) {
    const age = t - flashStart;
    if (age < 0 || age > 0.55) return 0;
    if (age < 0.07) return 1;
    if (age < 0.13) return 0.15;
    if (age < 0.2) return 0.85;
    return (0.55 - age) / 0.35 * 0.45;
  }

  function drawLightning(t) {
    const intensity = flashIntensity(t);
    if (intensity <= 0) return;
    ctx.fillStyle = "rgba(188, 220, 255, " + (intensity * 0.16) + ")";
    ctx.fillRect(0, 0, W, H * 0.62);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (let i = 0; i < bolts.length; i++) {
      const pts = bolts[i];
      ctx.strokeStyle = "rgba(180, 220, 255, " + (intensity * 0.35) + ")";
      ctx.lineWidth = 7 * S;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let k = 1; k < pts.length; k++) ctx.lineTo(pts[k].x, pts[k].y);
      ctx.stroke();
      ctx.strokeStyle = "rgba(245, 250, 255, " + intensity + ")";
      ctx.lineWidth = 2 * S;
      ctx.stroke();
    }
  }

  function drawVignette() {
    const rad = Math.max(W, H) * 0.75;
    const inner = Math.min(W, H) * 0.28;
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.46, inner, W * 0.5, H * 0.5, rad);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(0.72, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,0.42)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    const t = now / 1000;

    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    for (let i = 0; i < vehicles.length; i++) updateVehicle(vehicles[i], dt);
    updateRain(dt, t);

    drawSky(t);
    drawRays(t);
    drawGround(t);
    drawHaze();

    const queue = [];
    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i];
      queue.push({ z: b.z, ord: 0, draw: drawBuilding.bind(null, b, t) });
    }
    for (let i = 0; i < vehicles.length; i++) {
      const c = vehicles[i];
      queue.push({ z: c.z, ord: 1, draw: drawVehicle.bind(null, c, t) });
    }
    for (let i = 0; i < portals.length; i++) {
      const p = portals[i];
      queue.push({ z: p.z, ord: 0, draw: drawPortal.bind(null, p, t) });
    }
    queue.sort(function (a, b) {
      return a.z - b.z || a.ord - b.ord;
    });

    let drewFarRain = false;
    for (let i = 0; i < queue.length; i++) {
      if (!drewFarRain && queue[i].z > 0.5) {
        drawRain(0, 0.48);
        drewFarRain = true;
      }
      queue[i].draw();
    }
    if (!drewFarRain) drawRain(0, 0.48);
    drawRain(0.48, 1.01);
    drawSplashes();
    drawLightning(t);
    drawVignette();

    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
