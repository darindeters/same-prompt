<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07000c">
<title>Lava Lamp</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #07000c;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #07000c;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="lamp"></canvas>
<script>
'use strict';

const GEO = { aY: -0.175, bY: 0.22, r: 0.205, wall: 0.015 };
const MAX_FREE = 10;
const MAX_SLOTS = 12;

let blobs = [];
let emitTimer = 3.2;

function clamp(v, a, b) {
  return Math.max(a, Math.min(b, v));
}

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

function mix3(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

function waxRGB(heat, phase) {
  const h = clamp(heat + 0.08 * Math.sin(phase), 0, 1);
  const c0 = [1.0, 0.04, 0.22];
  const c1 = [1.0, 0.20, 0.0];
  const c2 = [1.0, 0.55, 0.0];
  const c3 = [1.0, 0.93, 0.18];
  let c = mix3(c0, c1, smoothstep(0.0, 0.34, h));
  c = mix3(c, c2, smoothstep(0.24, 0.62, h));
  c = mix3(c, c3, smoothstep(0.55, 1.0, h));
  return c;
}

function poolState(time) {
  const innerR = GEO.r - GEO.wall;
  const innerBot = GEO.aY - innerR;
  const innerTop = GEO.bY + innerR;
  const bRy = innerR * (0.30 + 0.04 * Math.sin(time * 0.85));
  const bRx = innerR * (0.50 + 0.045 * Math.sin(time * 0.62));
  const bCy = innerBot + bRy * 0.78 + 0.01;
  const fill = innerTop - 0.032 + 0.004 * Math.sin(time * 0.55);
  const tRy = innerR * (0.18 + 0.03 * Math.sin(time * 0.74 + 1.2));
  const tRx = innerR * (0.38 + 0.04 * Math.sin(time * 0.51 + 2.0));
  const tCy = fill - tRy - 0.012;
  return {
    bx: 0.012 * Math.sin(time * 0.41),
    by: bCy,
    bRx: bRx,
    bRy: bRy,
    tx: 0.014 * Math.sin(time * 0.36 + 1.4),
    ty: tCy,
    tRx: tRx,
    tRy: tRy,
    fill: fill
  };
}

function makeBlob(x, y, r, heat, vy, phase, mergeCooldown, splitCooldown) {
  const b = {
    x: x,
    y: y,
    vx: 0,
    vy: vy,
    r: r,
    heat: heat,
    phase: phase,
    mergeCooldown: mergeCooldown,
    splitCooldown: splitCooldown,
    squeeze: 0,
    stretch: 1,
    growTo: 0
  };
  b.stretch = targetStretch(b);
  return b;
}

function targetStretch(b) {
  const k = clamp(Math.abs(b.vy) / 0.052, 0, 1);
  const s = k * k * (3 - 2 * k);
  return 1 + 3.6 * s;
}

function initBlobs() {
  blobs = [
    makeBlob(0.02, -0.03, 0.07, 0.94, 0.05, 0.4, 2.4, 1.15),
    makeBlob(-0.025, 0.07, 0.046, 0.86, 0.042, 1.7, 2.2, 2.4),
    makeBlob(-0.03, 0.25, 0.052, 0.42, 0.004, 2.2, 0.85, 2.8),
    makeBlob(0.038, 0.235, 0.046, 0.36, 0.0, 3.4, 0.85, 2.8),
    makeBlob(-0.04, 0.02, 0.04, 0.24, -0.046, 4.3, 2.0, 2.5),
    makeBlob(0.0, 0.15, 0.032, 0.28, -0.028, 5.1, 2.2, 2.6),
    makeBlob(0.01, -0.3, 0.028, 1.0, 0.02, 0.8, 3.0, 3.2)
  ];
  blobs[6].growTo = 0.046;
  for (let i = 0; i < blobs.length; i++) constrainBlob(blobs[i], 0.016);
}

function constrainBlob(b, dt) {
  const innerR = GEO.r - GEO.wall;
  const limit = innerR - b.r;
  if (limit < 0.025) {
    b.r = innerR - 0.025;
  }
  const R = GEO.r - GEO.wall - b.r;
  const ay = GEO.aY;
  const by = GEO.bY;
  const cy = clamp(b.y, ay, by);
  const dx = b.x;
  const dy = b.y - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > R && dist > 1e-6) {
    const nx = dx / dist;
    const ny = dy / dist;
    b.x = nx * R;
    b.y = cy + ny * R;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) {
      b.vx -= vn * nx;
      b.vy -= vn * ny;
    }
  }
  if (dt > 0) {
    const pressTop = smoothstep(0.2, 0.33, b.y) * smoothstep(0.5, 0.78, b.heat);
    const pressBot = smoothstep(-0.2, -0.32, b.y) * smoothstep(0.55, 0.22, b.heat);
    const press = Math.max(pressTop, pressBot);
    b.squeeze += (press - b.squeeze) * (1 - Math.exp(-3.2 * dt));
  }
}

function mergeInto(dst, src) {
  const ad = dst.r * dst.r;
  const asrc = src.r * src.r;
  const a = ad + asrc;
  dst.x = (dst.x * ad + src.x * asrc) / a;
  dst.y = (dst.y * ad + src.y * asrc) / a;
  dst.vx = (dst.vx * ad + src.vx * asrc) / a;
  dst.vy = (dst.vy * ad + src.vy * asrc) / a;
  dst.heat = (dst.heat * ad + src.heat * asrc) / a;
  dst.r = Math.sqrt(a);
  dst.squeeze = Math.max(dst.squeeze, src.squeeze);
  dst.mergeCooldown = 0.7;
  dst.splitCooldown = Math.max(dst.splitCooldown, 0.85);
  if (dst.r > 0.1) dst.r = 0.1;
}

function spawnChild(parent, dir, heat, vyScale) {
  const area = parent.r * parent.r;
  const frac = 0.34 + 0.08 * Math.sin(parent.phase + parent.y * 8);
  const childArea = area * frac;
  const parentArea = area - childArea;
  if (childArea < 0.024 * 0.024 || parentArea < 0.026 * 0.026) return false;
  parent.r = Math.sqrt(parentArea);
  const cr = Math.sqrt(childArea);
  const child = {
    x: parent.x + Math.sin(parent.phase) * 0.01,
    y: parent.y - dir * (parent.r + cr) * 0.92,
    vx: parent.vx * 0.35,
    vy: parent.vy * vyScale,
    r: cr,
    heat: heat,
    phase: parent.phase + 2.3,
    mergeCooldown: 2.6,
    splitCooldown: 3.4,
    squeeze: 0,
    stretch: 1,
    growTo: 0
  };
  parent.mergeCooldown = 2.6;
  parent.splitCooldown = 4.2;
  parent.vy *= 0.9;
  child.stretch = targetStretch(child);
  blobs.push(child);
  constrainBlob(child, 0.016);
  constrainBlob(parent, 0.016);
  return true;
}

function advance(dt, time) {
  const pool = poolState(time);

  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    b.mergeCooldown = Math.max(0, b.mergeCooldown - dt);
    b.splitCooldown = Math.max(0, b.splitCooldown - dt);
    if (b.growTo) {
      b.r = Math.min(b.growTo, b.r + dt * 0.03);
      if (b.r >= b.growTo - 1e-5) b.growTo = 0;
    }

    const zb = smoothstep(-0.28, -0.37, b.y);
    const zt = smoothstep(0.18, 0.33, b.y);
    let dh = zb * 0.55 - zt * 0.16;
    if (zb < 0.15 && zt < 0.15 && b.heat > 0.72) dh -= (b.heat - 0.86) * 0.06;
    b.heat = clamp(b.heat + dh * dt, 0, 1);

    const targetVy = (b.heat - 0.46) * 0.125;
    b.vy += (targetVy - b.vy) * (1 - Math.exp(-0.7 * dt));
    const targetX = 0.05 * Math.sin(time * 0.29 + b.phase);
    const targetVx = (targetX - b.x) * 0.32 + Math.cos(time * 0.21 + b.phase * 1.3) * 0.01;
    b.vx += (targetVx - b.vx) * (1 - Math.exp(-1.15 * dt));
    b.vy = clamp(b.vy, -0.085, 0.085);
    b.vx = clamp(b.vx, -0.045, 0.045);
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    constrainBlob(b, dt);

    const want = targetStretch(b);
    const shaped = 1 + (want - 1) * (1 - b.squeeze);
    b.stretch += (shaped - b.stretch) * (1 - Math.exp(-2.8 * dt));
  }

  for (let i = 0; i < blobs.length; i++) {
    for (let j = i + 1; j < blobs.length; ) {
      const a = blobs[i];
      const c = blobs[j];
      let dx = c.x - a.x;
      let dy = c.y - a.y;
      let d = Math.hypot(dx, dy);
      if (d < 1e-5) {
        dx = 1e-4;
        dy = 0;
        d = 1e-4;
      }
      const sumR = a.r + c.r;
      const relV = Math.hypot(a.vx - c.vx, a.vy - c.vy);
      const canMerge = a.mergeCooldown <= 0 && c.mergeCooldown <= 0 && relV < 0.045;
      if (canMerge && d < sumR * 0.82) {
        if (c.r > a.r) mergeInto(c, a);
        else mergeInto(a, c);
        if (c.r > a.r) {
          blobs[i] = c;
          blobs.splice(j, 1);
        } else {
          blobs.splice(j, 1);
        }
        continue;
      }
      const minD = sumR * 0.48;
      if (d < minD) {
        const push = (minD - d) * Math.min(1, dt * 6);
        const nx = dx / d;
        const ny = dy / d;
        const wa = c.r * c.r;
        const wb = a.r * a.r;
        const ws = wa + wb;
        a.x -= nx * push * (wa / ws);
        a.y -= ny * push * (wa / ws) * 0.45;
        c.x += nx * push * (wb / ws);
        c.y += ny * push * (wb / ws) * 0.45;
      }
      j++;
    }
  }

  const before = blobs.length;
  for (let i = 0; i < before; i++) {
    if (blobs.length >= MAX_FREE) break;
    const b = blobs[i];
    if (b.splitCooldown > 0) continue;
    if (b.r > 0.064 && Math.abs(b.vy) > 0.03) {
      const dir = b.vy >= 0 ? 1 : -1;
      const childHeat = dir > 0 ? clamp(b.heat - 0.3, 0, 1) : clamp(b.heat + 0.18, 0, 1);
      spawnChild(b, dir, childHeat, 0.42);
      continue;
    }
    if (b.r > 0.06 && b.y > 0.18 && b.heat < 0.48 && Math.abs(b.vy) < 0.02) {
      const area = b.r * b.r;
      const childArea = area * 0.4;
      const parentArea = area - childArea;
      if (childArea > 0.024 * 0.024 && parentArea > 0.028 * 0.028 && blobs.length < MAX_FREE) {
        b.r = Math.sqrt(parentArea);
        const cr = Math.sqrt(childArea);
        const child = {
          x: b.x + 0.01 * Math.sin(b.phase + time),
          y: b.y - (b.r + cr) * 0.95,
          vx: b.vx * 0.2,
          vy: -0.038,
          r: cr,
          heat: 0.2,
          phase: b.phase + 1.9,
          mergeCooldown: 2.8,
          splitCooldown: 3.5,
          squeeze: 0.2,
          stretch: 2.2,
          growTo: 0
        };
        b.heat = Math.max(b.heat, 0.62);
        b.vy = 0.004;
        b.mergeCooldown = 2.4;
        b.splitCooldown = 5;
        blobs.push(child);
        constrainBlob(child, 0.016);
      }
    }
  }

  for (let i = blobs.length - 1; i >= 0; i--) {
    const b = blobs[i];
    if (b.mergeCooldown > 0 || b.vy >= -0.002) continue;
    const dx = (b.x - pool.bx) / pool.bRx;
    const dy = (b.y - pool.by) / pool.bRy;
    const q = dx * dx + dy * dy;
    if (q < 1.15) b.heat = Math.min(1, b.heat + dt * 0.35);
    if (q < 0.55) blobs.splice(i, 1);
  }

  emitTimer -= dt;
  if (blobs.length < 4) emitTimer = Math.min(emitTimer, 0.15);
  if (emitTimer <= 0 && blobs.length < 8) {
    const growTo = 0.034 + Math.random() * 0.02;
    const born = {
      x: pool.bx + (Math.random() - 0.5) * pool.bRx * 0.45,
      y: pool.by + pool.bRy * 0.15,
      vx: (Math.random() - 0.5) * 0.012,
      vy: 0.016 + Math.random() * 0.01,
      r: 0.02,
      heat: 0.96 + Math.random() * 0.04,
      phase: Math.random() * Math.PI * 2,
      mergeCooldown: 3.1,
      splitCooldown: 3.6,
      squeeze: 0.35,
      stretch: 1,
      growTo: growTo
    };
    blobs.push(born);
    constrainBlob(born, 0.016);
    emitTimer = 3.4 + Math.random() * 2.6;
  } else if (blobs.length >= 8) {
    emitTimer = Math.max(emitTimer, 1.2);
  }
}

function visualRadii(b, time) {
  const breathe = 1 + 0.032 * Math.sin(time * 1.45 + b.phase);
  const stretch = Math.max(0.65, b.stretch);
  let rx = b.r / Math.sqrt(stretch);
  let ry = b.r * Math.sqrt(stretch);
  const sq = clamp(b.squeeze, 0, 1);
  rx *= 1 + sq * 1.15;
  ry *= Math.max(0.38, 1 - sq * 0.52);
  rx *= breathe;
  ry *= breathe;
  return [Math.max(rx, 0.012), Math.max(ry, 0.012)];
}

const VERT = `#version 300 es
layout(location = 0) in vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

const FRAG = `#version 300 es
precision highp float;

uniform vec2 uRes;
uniform float uTime;
uniform vec4 uLamp;
uniform float uFill;
uniform vec4 uBlob[12];
uniform vec4 uColor[12];

out vec4 fragColor;

float sdCapsule(vec2 p, vec2 a, vec2 b, float r) {
  vec2 pa = p - a;
  vec2 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h) - r;
}

vec2 nCapsule(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a;
  vec2 ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  vec2 d = pa - ba * h;
  float len = length(d);
  return len > 1e-5 ? d / len : vec2(1.0, 0.0);
}

float sdRoundBox(vec2 p, vec2 c, vec2 h, float rad) {
  vec2 q = abs(p - c) - h + rad;
  return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - rad;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  float px = 1.0 / min(uRes.x, uRes.y);

  vec2 gA = vec2(0.0, uLamp.x);
  vec2 gB = vec2(0.0, uLamp.y);
  float gR = uLamp.z;
  float wall = uLamp.w;
  float sdO = sdCapsule(uv, gA, gB, gR);
  float sdI = sdCapsule(uv, gA, gB, gR - wall);
  vec2 n = nCapsule(uv, gA, gB);

  float inGlass = smoothstep(px * 2.0, -px * 2.0, sdO);
  vec2 p = uv;
  p.x += inGlass * 0.0032 * sin(uv.y * 34.0 + uTime * 1.15);
  p.y += inGlass * 0.0016 * sin(uv.x * 26.0 - uTime * 0.75);

  float field = 0.0;
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 12; i++) {
    vec4 b = uBlob[i];
    vec4 tint = uColor[i];
    vec2 br = max(b.zw, vec2(0.012));
    vec2 d = (p - b.xy) / br;
    float s1 = sin(uTime * 1.33 + float(i) * 2.17);
    float s2 = sin(uTime * 1.87 + float(i) * 1.41);
    d.x += 0.055 * s1 * d.y;
    d.y += 0.042 * s2 * d.x;
    float q = dot(d, d);
    float inf = tint.a / (q + 0.32);
    field += inf;
    acc += tint.rgb * inf;
  }

  vec3 waxHue = acc / max(field, 1e-4);
  float iso = 0.78;
  float fw = max(fwidth(field) * 1.25, px * 6.0);
  float body = smoothstep(iso - fw * 1.5, iso + fw * 0.25, field);
  float edge = smoothstep(iso - fw * 7.0, iso - fw, field) * (1.0 - smoothstep(iso + fw, iso + fw * 5.5, field));
  float core = smoothstep(iso + 0.05, iso + 1.2, field);
  float glowOnly = pow(clamp(field / iso, 0.0, 1.0), 1.6) * (1.0 - body);

  vec2 grad = vec2(dFdx(field), dFdy(field));
  float gradLen = length(grad);
  vec2 outward = gradLen > 1e-5 ? -grad / gradLen : vec2(0.0, 1.0);
  float ndl = clamp(dot(outward, normalize(vec2(-0.4, 0.78))), 0.0, 1.0);

  vec3 bodyCol = mix(waxHue, waxHue * vec3(0.55, 0.22, 0.08), core);
  bodyCol = mix(vec3(1.0, 0.95, 0.62), bodyCol, smoothstep(iso - fw, iso + 0.3, field));
  bodyCol *= 0.82 + 0.42 * ndl;
  bodyCol += vec3(1.0, 0.97, 0.86) * pow(ndl, 10.0) * body * 0.5;
  bodyCol += vec3(1.0, 0.88, 0.4) * edge * 0.8;

  float vig = length(uv * vec2(1.1, 1.02));
  vec3 room = mix(vec3(0.20, 0.0, 0.16), vec3(0.012, 0.0, 0.018), smoothstep(0.02, 0.78, vig));
  float outerBot = gA.y - gR;
  float outerTop = gB.y + gR;
  float shadow = exp(-pow(uv.x / 0.26, 2.0) - pow((uv.y - (outerBot - 0.06)) / 0.03, 2.0));
  room *= 1.0 - 0.48 * shadow;
  float floorGlow = exp(-pow((uv.y - (outerBot - 0.075)) / 0.018, 2.0)) * exp(-pow(uv.x / 0.2, 2.0));
  room += vec3(0.62, 0.16, 0.28) * shadow * 0.22;
  room += waxHue * floorGlow * 0.16;
  float halo = exp(-max(sdO, 0.0) * 9.0);
  room += mix(vec3(0.28, 0.08, 0.72), waxHue, 0.4) * halo * 0.26;

  vec3 col = room;

  float inside = smoothstep(px * 1.6, -px * 1.6, sdI);
  float aaY = max(fwidth(uv.y), px);
  float curve = (uv.x * uv.x) / (gR * gR) * 0.012;
  float meniscus = uFill - curve;
  float below = smoothstep(aaY * 1.3, -aaY, uv.y - meniscus);
  float liquidMask = inside * below;
  float air = inside * (1.0 - below);

  float bevel = pow(clamp(abs(uv.x) / gR, 0.0, 1.0), 1.45);
  vec3 deepL = vec3(0.06, 0.02, 0.50);
  vec3 brightL = vec3(0.22, 0.14, 0.98);
  vec3 liquid = mix(deepL, brightL, (1.0 - bevel) * 0.9);
  liquid += vec3(0.10, 0.02, 0.08) * smoothstep(outerBot, gB.y, uv.y);
  float shim = 0.5 + 0.5 * sin(uv.y * 24.0 - uTime * 0.5 + sin(uv.x * 15.0 + uTime * 0.7) * 1.4);
  liquid += vec3(0.07, 0.02, 0.12) * shim * (1.0 - bevel);
  liquid += waxHue * clamp(field * 0.22, 0.0, 0.42);
  liquid *= mix(1.0, 0.58, smoothstep(0.06, 0.0, -sdI));

  vec3 interior = mix(liquid, bodyCol, body);
  interior += waxHue * glowOnly * 1.05;
  col = mix(col, vec3(0.045, 0.02, 0.1), air);
  col = mix(col, interior, liquidMask);

  float outside = (1.0 - inside) * smoothstep(0.26, -0.005, sdO);
  col += waxHue * glowOnly * outside * 0.85;
  col += waxHue * body * outside * 0.1;

  float line = exp(-pow((uv.y - meniscus) / 0.004, 2.0)) * liquidMask;
  col += vec3(0.85, 0.9, 1.0) * line * 0.22;

  float baseTop = outerBot + 0.02;
  float sdBase = sdRoundBox(uv, vec2(0.0, baseTop - 0.052), vec2(gR + 0.095, 0.052), 0.044);
  float baseMask = smoothstep(px * 1.5, -px * 1.5, sdBase);
  float brush = 0.5 + 0.5 * sin(uv.y * 230.0);
  vec3 baseCol = mix(vec3(0.10, 0.025, 0.05), vec3(0.22, 0.06, 0.1), 0.35 + 0.4 * brush);
  baseCol = mix(baseCol, vec3(0.38, 0.10, 0.16), smoothstep(baseTop - 0.09, baseTop, uv.y));
  baseCol += vec3(0.75, 0.28, 0.05) * clamp(field * 0.2, 0.0, 0.5);
  baseCol += vec3(1.0, 0.72, 0.78) * smoothstep(0.014, 0.0, abs(sdBase)) * 0.65;
  float rimB = exp(-pow((uv.y - baseTop) / 0.007, 2.0)) * smoothstep(gR + 0.11, gR * 0.2, abs(uv.x));
  baseCol += vec3(1.0, 0.78, 0.5) * rimB * 0.85;
  col = mix(col, baseCol, baseMask);

  float sdCap = sdRoundBox(uv, vec2(0.0, outerTop + 0.012), vec2(gR * 0.36, 0.04), 0.034);
  float capMask = smoothstep(px * 1.5, -px * 1.5, sdCap);
  vec3 capCol = mix(vec3(0.12, 0.035, 0.065), vec3(0.36, 0.11, 0.18), smoothstep(outerTop - 0.02, outerTop + 0.05, uv.y));
  vec2 capH = uv - vec2(-0.018, outerTop + 0.028);
  capCol += vec3(1.0, 0.82, 0.9) * exp(-dot(capH / vec2(0.028, 0.02), capH / vec2(0.028, 0.02))) * 0.75;
  col = mix(col, capCol, capMask);

  float shell = smoothstep(px * 1.2, -px * 1.2, sdO) * smoothstep(-px * 1.2, px * 1.2, sdI);
  shell *= (1.0 - baseMask) * (1.0 - capMask);
  float rimR = pow(clamp(dot(n, normalize(vec2(0.96, 0.12))), 0.0, 1.0), 2.05);
  float rimL = pow(clamp(dot(n, normalize(vec2(-0.72, 0.38))), 0.0, 1.0), 1.3);
  float fres = pow(clamp(abs(n.x), 0.0, 1.0), 1.15);
  vec3 glassCol = vec3(0.72, 0.78, 1.0) + waxHue * 0.55;
  col = mix(col, glassCol, shell * 0.38);
  col += vec3(0.35, 0.95, 1.0) * rimR * shell;
  col += vec3(1.0, 0.86, 0.98) * rimL * shell * 0.85;
  col += vec3(0.7, 0.35, 1.0) * fres * shell * 0.32;

  float glide = sin(uTime * 0.3) * 0.18;
  float glint = exp(-pow((uv.y - glide) / 0.04, 2.0));
  col += vec3(1.0) * glint * shell * rimL * 0.9;

  float streak = exp(-pow((uv.x + gR * 0.4) / 0.018, 2.0));
  streak *= smoothstep(outerBot + 0.1, outerBot + 0.22, uv.y);
  streak *= smoothstep(outerTop - 0.06, outerTop - 0.2, uv.y);
  streak *= inside * (1.0 - capMask) * (1.0 - baseMask);
  col += vec3(0.9, 0.95, 1.0) * streak * 0.18;

  vec2 sp = (uv - vec2(-gR * 0.24, gB.y + gR * 0.18)) / vec2(0.026, 0.048);
  float spec = exp(-dot(sp, sp));
  col += vec3(1.0) * spec * inside * (1.0 - capMask) * 0.5;

  col = pow(clamp(col, 0.0, 1.0), vec3(0.9));
  float dither = fract(sin(dot(gl_FragCoord.xy + uTime * vec2(19.0, 7.0), vec2(12.9898, 78.233))) * 43758.5453);
  col += (dither - 0.5) / 255.0;
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
`;

function cssColor(rgb, alpha) {
  const r = Math.round(clamp(rgb[0], 0, 1) * 255);
  const g = Math.round(clamp(rgb[1], 0, 1) * 255);
  const b = Math.round(clamp(rgb[2], 0, 1) * 255);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

function boot() {
  const canvas = document.getElementById('lamp');
  initBlobs();

  const gl = canvas.getContext('webgl2', {
    alpha: false,
    antialias: false,
    depth: false,
    stencil: false,
    premultipliedAlpha: false,
    powerPreference: 'high-performance'
  });

  let draw;
  if (gl) {
    const renderer = createGL(gl, canvas);
    if (renderer) draw = renderer;
  }
  if (!draw) draw = create2D(canvas);

  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (dt > 0) advance(dt, now / 1000);
    draw(now / 1000);
    requestAnimationFrame(tick);
  }
  tick(last);
}

function createGL(gl, canvas) {
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      gl.deleteShader(shader);
      return null;
    }
    return shader;
  }

  const vs = compile(gl.VERTEX_SHADER, VERT);
  const fs = compile(gl.FRAGMENT_SHADER, FRAG);
  if (!vs || !fs) return null;
  const prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.bindAttribLocation(prog, 0, 'aPos');
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return null;
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);

  const locRes = gl.getUniformLocation(prog, 'uRes');
  const locTime = gl.getUniformLocation(prog, 'uTime');
  const locLamp = gl.getUniformLocation(prog, 'uLamp');
  const locFill = gl.getUniformLocation(prog, 'uFill');
  const locBlob = gl.getUniformLocation(prog, 'uBlob');
  const locColor = gl.getUniformLocation(prog, 'uColor');
  const blobArr = new Float32Array(MAX_SLOTS * 4);
  const colorArr = new Float32Array(MAX_SLOTS * 4);

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  function writeSlot(i, x, y, rx, ry, heat, phase, alive) {
    const o = i * 4;
    blobArr[o] = x;
    blobArr[o + 1] = y;
    blobArr[o + 2] = rx;
    blobArr[o + 3] = ry;
    const c = waxRGB(heat, phase);
    colorArr[o] = c[0];
    colorArr[o + 1] = c[1];
    colorArr[o + 2] = c[2];
    colorArr[o + 3] = alive;
  }

  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  addEventListener('resize', resize);
  resize();

  return function drawGL(time) {
    if (canvas.clientWidth < 1 || canvas.clientHeight < 1) return;
    resize();
    const pool = poolState(time);
    writeSlot(0, pool.bx, pool.by, pool.bRx, pool.bRy, 1.0, 0.2, 1);
    writeSlot(1, pool.tx, pool.ty, pool.tRx, pool.tRy, 0.2, 1.7, 1);
    const n = Math.min(blobs.length, MAX_SLOTS - 2);
    for (let i = 0; i < n; i++) {
      const b = blobs[i];
      const rad = visualRadii(b, time);
      writeSlot(i + 2, b.x, b.y, rad[0], rad[1], b.heat, b.phase, 1);
    }
    for (let i = n + 2; i < MAX_SLOTS; i++) writeSlot(i, 0, 0, 0.02, 0.02, 0, 0, 0);

    gl.useProgram(prog);
    gl.uniform2f(locRes, canvas.width, canvas.height);
    gl.uniform1f(locTime, time);
    gl.uniform4f(locLamp, GEO.aY, GEO.bY, GEO.r, GEO.wall);
    gl.uniform1f(locFill, pool.fill);
    gl.uniform4fv(locBlob, blobArr);
    gl.uniform4fv(locColor, colorArr);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  };
}

function create2D(canvas) {
  const ctx = canvas.getContext('2d');

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
    }
  }

  function mapX(x) {
    const m = Math.min(canvas.width, canvas.height);
    return canvas.width * 0.5 + x * m;
  }
  function mapY(y) {
    const m = Math.min(canvas.width, canvas.height);
    return canvas.height * 0.5 - y * m;
  }
  function scale() {
    return Math.min(canvas.width, canvas.height);
  }

  function capsulePath(x, yTop, yBot, r) {
    ctx.beginPath();
    ctx.arc(x, yTop, r, Math.PI, 0, true);
    ctx.arc(x, yBot, r, 0, Math.PI, false);
    ctx.closePath();
  }

  function blobPaint(x, y, rx, ry, heat, phase) {
    const m = scale();
    const cx = mapX(x);
    const cy = mapY(y);
    const sx = Math.max(2, rx * m);
    const sy = Math.max(2, ry * m);
    const col = waxRGB(heat, phase);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(sx, sy);
    const g = ctx.createRadialGradient(-0.22, -0.28, 0.02, 0, 0, 1);
    g.addColorStop(0, cssColor([1, 0.96, 0.7], 1));
    g.addColorStop(0.28, cssColor(col, 0.98));
    g.addColorStop(0.72, cssColor(col, 0.9));
    g.addColorStop(1, cssColor(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const ro = new ResizeObserver(resize);
  ro.observe(canvas);
  addEventListener('resize', resize);
  resize();

  return function draw2D(time) {
    if (!ctx || canvas.clientWidth < 1) return;
    resize();
    const w = canvas.width;
    const h = canvas.height;
    const m = scale();
    const pool = poolState(time);
    const gA = mapY(GEO.aY);
    const gB = mapY(GEO.bY);
    const gR = GEO.r * m;
    const x = mapX(0);
    const yTop = Math.min(gA, gB);
    const yBot = Math.max(gA, gB);

    const bg = ctx.createRadialGradient(w * 0.5, h * 0.46, m * 0.05, w * 0.5, h * 0.5, m * 0.72);
    bg.addColorStop(0, '#3a0830');
    bg.addColorStop(1, '#07000c');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    capsulePath(x, yTop, yBot, gR - GEO.wall * m);
    ctx.clip();
    const liquid = ctx.createLinearGradient(0, yTop, 0, yBot);
    liquid.addColorStop(0, '#3a18c8');
    liquid.addColorStop(0.5, '#1a0878');
    liquid.addColorStop(1, '#12045a');
    ctx.fillStyle = liquid;
    ctx.fillRect(0, 0, w, h);

    ctx.globalCompositeOperation = 'lighter';
    blobPaint(pool.bx, pool.by, pool.bRx, pool.bRy, 1, 0.2);
    blobPaint(pool.tx, pool.ty, pool.tRx, pool.tRy, 0.2, 1.7);
    for (let i = 0; i < blobs.length; i++) {
      const b = blobs[i];
      const rad = visualRadii(b, time);
      blobPaint(b.x, b.y, rad[0] * 1.15, rad[1] * 1.15, b.heat, b.phase);
    }
    ctx.restore();

    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    capsulePath(x, yTop, yBot, gR);
    ctx.strokeStyle = 'rgba(186, 230, 255, 0.85)';
    ctx.lineWidth = Math.max(2, m * 0.012);
    ctx.stroke();

    ctx.beginPath();
    capsulePath(x, yTop, yBot, gR - GEO.wall * m * 0.35);
    ctx.strokeStyle = 'rgba(255, 190, 255, 0.28)';
    ctx.lineWidth = Math.max(1, m * 0.006);
    ctx.stroke();

    const baseTop = mapY(GEO.aY - GEO.r + 0.02);
    const baseH = 0.104 * m;
    const baseW = (GEO.r + 0.095) * 2 * m;
    roundFill(ctx, x - baseW / 2, baseTop, baseW, baseH, 0.044 * m, '#3a1424');

    const capW = GEO.r * 0.72 * m;
    const capH = 0.08 * m;
    const capY = mapY(GEO.bY + GEO.r + 0.012) - capH * 0.5;
    roundFill(ctx, x - capW / 2, capY, capW, capH, 0.034 * m, '#4a2032');
  };
}

function roundFill(ctx, x, y, w, h, r, color) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

boot();
</script>
