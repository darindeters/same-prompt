<script>
'use strict';
/* RESTORATION HANDOFF
   One shared 36-second clock; every stage receives local seconds and progress.
   Each stage must derive its state from time (including time=0 on loop reset).
   0–6: abandoned hold; 6–12: clearing; 12–20: repairs; 20–28: landscaping;
   28–34: interior/lights; 34–36: completed hold. No dependencies or assets.
   The existing decayed roof/walls, yard and windows have named SVG groups.
   Add your stage in its marked function and SVG/CSS slot, keeping this clock.
*/
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function svg(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(parent)parent.appendChild(n);return n;}
let seed=27491;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
const mix=(a,b,t)=>a+(b-a)*t;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const pieces=[];
function register(node,x,y,type,order){pieces.push({node,x,y,type,start:6.2+order*5.0,duration:.64+random()*.23,spin:(random()-.5)*170,dx:(x<540?-1:1)*(85+random()*125),dy:-65-random()*105});}
// Each vine is a separate branch, with a curved stem and pointed paired leaves.
const vineRoots=[[263,741,21],[292,686,16],[388,748,21],[600,746,24],[851,746,24],[811,674,18],[622,591,16],[269,565,16],[383,590,12],[568,481,15],[837,518,13],[300,460,14],[473,458,11],[721,495,13]];
vineRoots.forEach(([x,y,count],index)=>{
 const g=svg('g',{},$('vines'));const pts=[];let px=x,py=y;
 for(let j=0;j<count;j++){pts.push([px,py]);px+=Math.sin(j*.66+index)*15+(index%2?2:-2);py-=10+random()*6;}
 svg('path',{d:pts.map((p,j)=>(j?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:'#234f45','stroke-width':8,'stroke-linecap':'round'},g);
 svg('path',{d:pts.map((p,j)=>(j?'L':'M')+(p[0]-1)+' '+p[1]).join(' '),fill:'none',stroke:'#6d9b49','stroke-width':2},g);
 pts.forEach(([a,b],j)=>{for(const side of [-1,1]){const len=15+random()*14;svg('path',{d:`M${a} ${b} Q${a+side*len*1.2} ${b+2} ${a+side*len} ${b-21} Q${a+side*3} ${b-20} ${a} ${b}`,fill:['#2a8054','#439b51','#64ae4f','#22664e'][(j+index)%4],stroke:'#215344','stroke-width':1.5},g);}if(j%5===0)svg('path',{d:`M${a} ${b}q26 -5 20 -23q-5 -9 -12 0`,fill:'none',stroke:'#83ab55','stroke-width':2},g);});
 register(g,x,y,'vine',.06+index/vineRoots.length*.67);
});
// Wild grasses in irregular clumps, with seed heads, thistles and broad leaves.
for(let i=0;i<43;i++){
 const x=110+random()*865;const y=770+random()*165;const g=svg('g',{},$('weeds'));const h=55+random()*105;
 for(let k=0;k<8;k++){const bx=x+(random()-.5)*32;const tip=bx+(random()-.5)*70;const top=y-h*(.45+random()*.55);svg('path',{d:`M${bx} ${y}Q${bx-7} ${y-h*.57} ${tip} ${top}Q${bx+10} ${y-h*.35} ${bx+6} ${y}Z`,fill:['#57a34b','#8ab746','#347d50','#b0c153'][k%4]},g);if(k%3===0){svg('path',{d:`M${bx} ${y}Q${bx} ${y-h*.5} ${tip} ${top-11}`,fill:'none',stroke:'#a4bd60','stroke-width':2},g);svg('ellipse',{cx:tip,cy:top-10,rx:3.5,ry:10,fill:i%4===0?'#e2aa9b':'#bdc576',transform:`rotate(-15 ${tip} ${top-10})`},g);}}
 if(i%5===0){svg('path',{d:`M${x} ${y}Q${x-25} ${y-27} ${x-42} ${y-21}Q${x-19} ${y-3} ${x} ${y}M${x} ${y}Q${x+22} ${y-40} ${x+43} ${y-34}Q${x+35} ${y-7} ${x} ${y}`,fill:'#2f965d',stroke:'#215b4b','stroke-width':2},g);}
 register(g,x,y,'grass',.18+(x-110)/865*.77);
}
// Individually removable broken boards, bricks, roof tiles and a discarded pot.
const rubble=[[354,801,0],[737,804,1],[801,832,0],[277,840,2],[656,840,2],[878,777,1],[338,891,1],[723,911,0],[206,790,2],[576,861,1],[923,868,2],[416,835,0]];
rubble.forEach(([x,y,type],i)=>{const g=svg('g',{},$('debris'));const sub=svg('g',{transform:`translate(${x} ${y}) rotate(${random()*38-19})`},g);
 if(type===0){svg('path',{d:'M-43 -10L35 -17L43 -7L34 2L-39 8L-46 1Z',fill:'#ad816a',stroke:'#4e5058','stroke-width':3},sub);svg('path',{d:'M-32 -1L29 -8M-20 4L-2 -1',stroke:'#785d5b','stroke-width':2},sub);svg('circle',{cx:24,cy:-7,r:2,fill:'#354351'},sub);}
 else if(type===1){svg('path',{d:'M-21 -15L15 -20L27 -7L21 10L-18 12L-26 1Z',fill:'#c17c72',stroke:'#66535d','stroke-width':3},sub);svg('path',{d:'M-21 -1L14 -6L24 -8M14 -6L14 10',fill:'none',stroke:'#9a6165','stroke-width':2},sub);}
 else{svg('path',{d:'M-23 -10Q0 -25 23 -10L16 14L-13 18Z',fill:'#596d7c',stroke:'#304957','stroke-width':3},sub);svg('path',{d:'M-13 -8L3 0L-4 11',fill:'none',stroke:'#8d9d9a','stroke-width':3},sub);}
 register(g,x,y,'debris',.1+i/rubble.length*.82);
});
// Small particles are pooled once; animation performs no DOM allocations.
const sparks=[];
for(let i=0;i<110;i++)sparks.push(svg('path',{d:i%3?'M-3 0H3M0 -3V3':'M-4 -2L3 -3L5 2L-2 4Z',fill:i%3?'none':'#add269',stroke:i%3?'#d9f6a0':'none','stroke-width':2,opacity:0},$('stage-1-effects')));
const sweep=svg('path',{d:'',fill:'none',stroke:'#b4ffe0','stroke-width':3,'stroke-linecap':'round',opacity:0},$('stage-1-effects'));
/* Code-generated audio. Attempt immediately; browser autoplay restrictions are
   recovered with the first pointer or key event, without visible controls. */
let audio=null;
let noise=null;
function enableAudio(){
 try{if(!audio){const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;audio=new Context();noise=audio.createBuffer(1,audio.sampleRate*.35,audio.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}
}
enableAudio();
window.addEventListener('pointerdown',enableAudio,{passive:true});window.addEventListener('keydown',enableAudio);
function removalSound(piece){
 if(!audio||audio.state!=='running')return;
 const t=audio.currentTime;const isDebris=piece.type==='debris';
 const source=audio.createBufferSource();source.buffer=noise;
 const filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.setValueAtTime(isDebris?420:1800,t);filter.frequency.exponentialRampToValueAtTime(isDebris?140:420,t+.18);filter.Q.value=.7;
 const gain=audio.createGain();gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(isDebris?.12:.07,t+.009);gain.gain.exponentialRampToValueAtTime(.0001,t+.21);source.connect(filter).connect(gain).connect(audio.destination);source.start(t);source.stop(t+.24);
 const osc=audio.createOscillator();const volume=audio.createGain();osc.type=isDebris?'triangle':'sine';osc.frequency.setValueAtTime(isDebris?220:660+(piece.x%200)*2,t);osc.frequency.exponentialRampToValueAtTime(isDebris?65:1300+(piece.x%300),t+.12);volume.gain.setValueAtTime(.0001,t);volume.gain.exponentialRampToValueAtTime(.045,t+.008);volume.gain.exponentialRampToValueAtTime(.0001,t+.17);osc.connect(volume).connect(audio.destination);osc.start(t);osc.stop(t+.19);
}
function stage1(time,previous){
 let particleIndex=0;
 for(const p of pieces){
  const u=clamp((time-p.start)/p.duration);const e=ease(u);
  if(previous<p.start&&time>=p.start&&time-p.start<.15)removalSound(p);
  if(u===0){p.node.setAttribute('transform',`rotate(${Math.sin(time*1.6+p.x)*.65} ${p.x} ${p.y})`);p.node.setAttribute('opacity',1);}
  else if(u>=1){p.node.setAttribute('opacity',0);}
  else{const lift=Math.sin(u*Math.PI)*p.dy;const scale=1-e*.75;p.node.setAttribute('transform',`translate(${p.dx*e} ${lift-e*30}) translate(${p.x} ${p.y}) rotate(${p.spin*e}) scale(${scale}) translate(${-p.x} ${-p.y})`);p.node.setAttribute('opacity',1-Math.pow(u,2));}
  if(u>0&&u<1){for(let k=0;k<4&&particleIndex<sparks.length;k++){const a=k*2.4+p.x;const r=(14+65*u)*(1+k*.17);sparks[particleIndex++].setAttribute('transform',`translate(${p.x+p.dx*e*.6+Math.cos(a)*r} ${p.y+p.dy*Math.sin(u*Math.PI)+Math.sin(a)*r}) rotate(${u*140}) scale(${1-u*.65})`);sparks[particleIndex-1].setAttribute('opacity',Math.sin(u*Math.PI)*.9);}}
 }
 for(;particleIndex<sparks.length;particleIndex++)sparks[particleIndex].setAttribute('opacity',0);
 const progress=clamp((time-6)/6);const x=mix(125,985,progress);sweep.setAttribute('d',`M${x-95} 916Q${x+25} 846 ${x-14} 746Q${x-38} 676 ${x+26} 614`);sweep.setAttribute('opacity',time>6&&time<12?Math.sin(progress*Math.PI)*.5:0);
}
// ============================================================================
// STAGE 2 — ROOF AND WALL REPAIRS — 12.000 to 20.000 seconds
// Empty by design. progress remains 1 after 20s; reset geometry at progress=0.
// ============================================================================
function stage2(localSeconds,progress){
 // Next builder: implement roof and wall restoration here.
}
// ============================================================================
// STAGE 3 — GARDEN AND YARD — 20.000 to 28.000 seconds
// Empty by design. Use #stage-3-garden; retain completed state through the hold.
// ============================================================================
function stage3(localSeconds,progress){
 // Next builder: implement landscaping here.
}
// ============================================================================
// STAGE 4 — INTERIOR AND LIGHTS — 28.000 to 34.000 seconds
// Empty by design. Use #stage-4-interior; retain completed state through the hold.
// ============================================================================
function stage4(localSeconds,progress){
 // Next builder: implement interior and lighting here.
}
const DURATION=36;
const origin=performance.now();let previous=0;let previousCycle=0;
function frame(now){
 const elapsed=(now-origin)/1000;const cycle=Math.floor(elapsed/DURATION);const time=elapsed%DURATION;
 if(cycle!==previousCycle)previous=0;
 stage1(time,previous);
 stage2(Math.max(0,time-12),clamp((time-12)/8));
 stage3(Math.max(0,time-20),clamp((time-20)/8));
 stage4(Math.max(0,time-28),clamp((time-28)/6));
 previous=time;previousCycle=cycle;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
