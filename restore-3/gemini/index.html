<script>
'use strict';
/* RESTORATION HANDOFF
   One shared 36-second clock; every stage receives local seconds and progress.
   Each stage must derive its state from time (including time=0 on loop reset).
   0–6: abandoned hold; 6–12: clearing; 12–20: repairs; 20–28: landscaping;
   28–34: interior/lights; 34–36: completed hold. No dependencies or assets.
   The existing decayed roof/walls, yard and windows have named SVG groups.
   Add your stage in its marked function and SVG/CSS slot, keeping this clock.
*/
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function svg(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(parent)parent.appendChild(n);return n;}
let seed=27491;
function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;}
const mix=(a,b,t)=>a+(b-a)*t;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const pieces=[];
function register(node,x,y,type,order){pieces.push({node,x,y,type,start:6.2+order*5.0,duration:.64+random()*.23,spin:(random()-.5)*170,dx:(x<540?-1:1)*(85+random()*125),dy:-65-random()*105});}
// Each vine is a separate branch, with a curved stem and pointed paired leaves.
const vineRoots=[[263,741,21],[292,686,16],[388,748,21],[600,746,24],[851,746,24],[811,674,18],[622,591,16],[269,565,16],[383,590,12],[568,481,15],[837,518,13],[300,460,14],[473,458,11],[721,495,13]];
vineRoots.forEach(([x,y,count],index)=>{
 const g=svg('g',{},$('vines'));const pts=[];let px=x,py=y;
 for(let j=0;j<count;j++){pts.push([px,py]);px+=Math.sin(j*.66+index)*15+(index%2?2:-2);py-=10+random()*6;}
 svg('path',{d:pts.map((p,j)=>(j?'L':'M')+p.join(' ')).join(' '),fill:'none',stroke:'#234f45','stroke-width':8,'stroke-linecap':'round'},g);
 svg('path',{d:pts.map((p,j)=>(j?'L':'M')+(p[0]-1)+' '+p[1]).join(' '),fill:'none',stroke:'#6d9b49','stroke-width':2},g);
 pts.forEach(([a,b],j)=>{for(const side of [-1,1]){const len=15+random()*14;svg('path',{d:`M${a} ${b} Q${a+side*len*1.2} ${b+2} ${a+side*len} ${b-21} Q${a+side*3} ${b-20} ${a} ${b}`,fill:['#2a8054','#439b51','#64ae4f','#22664e'][(j+index)%4],stroke:'#215344','stroke-width':1.5},g);}if(j%5===0)svg('path',{d:`M${a} ${b}q26 -5 20 -23q-5 -9 -12 0`,fill:'none',stroke:'#83ab55','stroke-width':2},g);});
 register(g,x,y,'vine',.06+index/vineRoots.length*.67);
});
// Wild grasses in irregular clumps, with seed heads, thistles and broad leaves.
for(let i=0;i<43;i++){
 const x=110+random()*865;const y=770+random()*165;const g=svg('g',{},$('weeds'));const h=55+random()*105;
 for(let k=0;k<8;k++){const bx=x+(random()-.5)*32;const tip=bx+(random()-.5)*70;const top=y-h*(.45+random()*.55);svg('path',{d:`M${bx} ${y}Q${bx-7} ${y-h*.57} ${tip} ${top}Q${bx+10} ${y-h*.35} ${bx+6} ${y}Z`,fill:['#57a34b','#8ab746','#347d50','#b0c153'][k%4]},g);if(k%3===0){svg('path',{d:`M${bx} ${y}Q${bx} ${y-h*.5} ${tip} ${top-11}`,fill:'none',stroke:'#a4bd60','stroke-width':2},g);svg('ellipse',{cx:tip,cy:top-10,rx:3.5,ry:10,fill:i%4===0?'#e2aa9b':'#bdc576',transform:`rotate(-15 ${tip} ${top-10})`},g);}}
 if(i%5===0){svg('path',{d:`M${x} ${y}Q${x-25} ${y-27} ${x-42} ${y-21}Q${x-19} ${y-3} ${x} ${y}M${x} ${y}Q${x+22} ${y-40} ${x+43} ${y-34}Q${x+35} ${y-7} ${x} ${y}`,fill:'#2f965d',stroke:'#215b4b','stroke-width':2},g);}
 register(g,x,y,'grass',.18+(x-110)/865*.77);
}
// Individually removable broken boards, bricks, roof tiles and a discarded pot.
const rubble=[[354,801,0],[737,804,1],[801,832,0],[277,840,2],[656,840,2],[878,777,1],[338,891,1],[723,911,0],[206,790,2],[576,861,1],[923,868,2],[416,835,0]];
rubble.forEach(([x,y,type],i)=>{const g=svg('g',{},$('debris'));const sub=svg('g',{transform:`translate(${x} ${y}) rotate(${random()*38-19})`},g);
 if(type===0){svg('path',{d:'M-43 -10L35 -17L43 -7L34 2L-39 8L-46 1Z',fill:'#ad816a',stroke:'#4e5058','stroke-width':3},sub);svg('path',{d:'M-32 -1L29 -8M-20 4L-2 -1',stroke:'#785d5b','stroke-width':2},sub);svg('circle',{cx:24,cy:-7,r:2,fill:'#354351'},sub);}
 else if(type===1){svg('path',{d:'M-21 -15L15 -20L27 -7L21 10L-18 12L-26 1Z',fill:'#c17c72',stroke:'#66535d','stroke-width':3},sub);svg('path',{d:'M-21 -1L14 -6L24 -8M14 -6L14 10',fill:'none',stroke:'#9a6165','stroke-width':2},sub);}
 else{svg('path',{d:'M-23 -10Q0 -25 23 -10L16 14L-13 18Z',fill:'#596d7c',stroke:'#304957','stroke-width':3},sub);svg('path',{d:'M-13 -8L3 0L-4 11',fill:'none',stroke:'#8d9d9a','stroke-width':3},sub);}
 register(g,x,y,'debris',.1+i/rubble.length*.82);
});
// Small particles are pooled once; animation performs no DOM allocations.
const sparks=[];
for(let i=0;i<110;i++)sparks.push(svg('path',{d:i%3?'M-3 0H3M0 -3V3':'M-4 -2L3 -3L5 2L-2 4Z',fill:i%3?'none':'#add269',stroke:i%3?'#d9f6a0':'none','stroke-width':2,opacity:0},$('stage-1-effects')));
const sweep=svg('path',{d:'',fill:'none',stroke:'#b4ffe0','stroke-width':3,'stroke-linecap':'round',opacity:0},$('stage-1-effects'));
/* Code-generated audio. Attempt immediately; browser autoplay restrictions are
   recovered with the first pointer or key event, without visible controls. */
let audio=null;
let noise=null;
function enableAudio(){
 try{if(!audio){const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;audio=new Context();noise=audio.createBuffer(1,audio.sampleRate*.35,audio.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}if(audio.state==='suspended')audio.resume().catch(()=>{});}catch(e){}
}
enableAudio();
window.addEventListener('pointerdown',enableAudio,{passive:true});window.addEventListener('keydown',enableAudio);
function removalSound(piece){
 if(!audio||audio.state!=='running')return;
 const t=audio.currentTime;const isDebris=piece.type==='debris';
 const source=audio.createBufferSource();source.buffer=noise;
 const filter=audio.createBiquadFilter();filter.type='bandpass';filter.frequency.setValueAtTime(isDebris?420:1800,t);filter.frequency.exponentialRampToValueAtTime(isDebris?140:420,t+.18);filter.Q.value=.7;
 const gain=audio.createGain();gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(isDebris?.12:.07,t+.009);gain.gain.exponentialRampToValueAtTime(.0001,t+.21);source.connect(filter).connect(gain).connect(audio.destination);source.start(t);source.stop(t+.24);
 const osc=audio.createOscillator();const volume=audio.createGain();osc.type=isDebris?'triangle':'sine';osc.frequency.setValueAtTime(isDebris?220:660+(piece.x%200)*2,t);osc.frequency.exponentialRampToValueAtTime(isDebris?65:1300+(piece.x%300),t+.12);volume.gain.setValueAtTime(.0001,t);volume.gain.exponentialRampToValueAtTime(.045,t+.008);volume.gain.exponentialRampToValueAtTime(.0001,t+.17);osc.connect(volume).connect(audio.destination);osc.start(t);osc.stop(t+.19);
}
function stage1(time,previous){
 let particleIndex=0;
 for(const p of pieces){
  const u=clamp((time-p.start)/p.duration);const e=ease(u);
  if(previous<p.start&&time>=p.start&&time-p.start<.15)removalSound(p);
  if(u===0){p.node.setAttribute('transform',`rotate(${Math.sin(time*1.6+p.x)*.65} ${p.x} ${p.y})`);p.node.setAttribute('opacity',1);}
  else if(u>=1){p.node.setAttribute('opacity',0);}
  else{const lift=Math.sin(u*Math.PI)*p.dy;const scale=1-e*.75;p.node.setAttribute('transform',`translate(${p.dx*e} ${lift-e*30}) translate(${p.x} ${p.y}) rotate(${p.spin*e}) scale(${scale}) translate(${-p.x} ${-p.y})`);p.node.setAttribute('opacity',1-Math.pow(u,2));}
  if(u>0&&u<1){for(let k=0;k<4&&particleIndex<sparks.length;k++){const a=k*2.4+p.x;const r=(14+65*u)*(1+k*.17);sparks[particleIndex++].setAttribute('transform',`translate(${p.x+p.dx*e*.6+Math.cos(a)*r} ${p.y+p.dy*Math.sin(u*Math.PI)+Math.sin(a)*r}) rotate(${u*140}) scale(${1-u*.65})`);sparks[particleIndex-1].setAttribute('opacity',Math.sin(u*Math.PI)*.9);}}
 }
 for(;particleIndex<sparks.length;particleIndex++)sparks[particleIndex].setAttribute('opacity',0);
 const progress=clamp((time-6)/6);const x=mix(125,985,progress);sweep.setAttribute('d',`M${x-95} 916Q${x+25} 846 ${x-14} 746Q${x-38} 676 ${x+26} 614`);sweep.setAttribute('opacity',time>6&&time<12?Math.sin(progress*Math.PI)*.5:0);
}
// ============================================================================
// STAGE 2 — ROOF AND WALL REPAIRS — 12.000 to 20.000 seconds
// Local 0–2.6s: broken shingles drop in, then new courses lay bottom to top.
// Local 3.1–5.2s: glass, shutters and the boarded side window.
// Local 5.25–7.5s: saturated siding washes upward. Holds through progress 1.
// Every value is derived from local time so the loop restart is the worn house.
// ============================================================================
const s2repairs=$('stage-2-repairs');
const s2defs=document.querySelector('defs');
function s2grad(id,stops,attrs){
 const g=svg('linearGradient',Object.assign({id:id,x1:'0',y1:'0',x2:'0',y2:'1'},attrs||{}),s2defs);
 stops.forEach(s=>svg('stop',s,g));
}
s2grad('s2-front',[{offset:'0','stop-color':'#fff06a'},{offset:'.48','stop-color':'#ffc400'},{offset:'1','stop-color':'#ff8c00'}]);
s2grad('s2-side',[{offset:'0','stop-color':'#ffd000'},{offset:'1','stop-color':'#ff6a00'}]);
s2grad('s2-glass',[{offset:'0','stop-color':'#ffffff'},{offset:'.38','stop-color':'#67e6ff'},{offset:'1','stop-color':'#3a5dff'}],{x2:'1',y2:'1'});
s2grad('s2-shutter',[{offset:'0','stop-color':'#5dffe8'},{offset:'1','stop-color':'#00b3a4'}],{x2:'1',y2:'0'});
const s2RiseClip=svg('clipPath',{id:'s2-rise'},s2defs);
const s2RiseRect=svg('rect',{x:160,y:830,width:800,height:0},s2RiseClip);
const s2WallClip=svg('clipPath',{id:'s2-wall-shape'},s2defs);
svg('path',{d:'M247 451L430 284L597 445V773H247Z'},s2WallClip);
svg('path',{d:'M597 461H875V767H597Z'},s2WallClip);
svg('path',{d:'M247 742H875V798H247Z'},s2WallClip);
const s2SideClip=svg('clipPath',{id:'s2-side-clip'},s2defs);
svg('path',{d:'M558 346H790L918 479H582Z'},s2SideClip);
const s2FrontClip=svg('clipPath',{id:'s2-front-clip'},s2defs);
svg('path',{d:'M214 461L429 251L638 459L612 479L429 297L237 484Z'},s2FrontClip);

// Stage 3 Web Audio API synthesized sound effects
function s3LawnSound(){
 if(!audio||audio.state!=='running'||!noise)return;
 const t=audio.currentTime;
 const src=audio.createBufferSource();src.buffer=noise;
 const filter=audio.createBiquadFilter();filter.type='bandpass';
 filter.frequency.setValueAtTime(320,t);filter.frequency.exponentialRampToValueAtTime(1950,t+.32);filter.Q.value=1.2;
 const ng=audio.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.055,t+.06);ng.gain.exponentialRampToValueAtTime(.0001,t+.34);
 src.connect(filter).connect(ng).connect(audio.destination);src.start(t);src.stop(t+.35);
 [392,493.88,587.33,783.99].forEach((f,i)=>{
  const o=audio.createOscillator(),g=audio.createGain();o.type='sine';
  o.frequency.setValueAtTime(f,t+i*.055);
  g.gain.setValueAtTime(.0001,t+i*.055);g.gain.exponentialRampToValueAtTime(.028,t+i*.055+.015);g.gain.exponentialRampToValueAtTime(.0001,t+i*.055+.26);
  o.connect(g).connect(audio.destination);o.start(t+i*.055);o.stop(t+i*.055+.28);
 });
}
function s3FenceSound(pitch){
 if(!audio||audio.state!=='running')return;
 [0,.055,.11].forEach((off,i)=>{
  const t=audio.currentTime+off;const o=audio.createOscillator(),g=audio.createGain();
  o.type='triangle';o.frequency.setValueAtTime(pitch+i*65,t);o.frequency.exponentialRampToValueAtTime(120,t+.065);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.075);
  o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.08);
 });
}
function s3StoneSound(freq){

 const o=audio.createOscillator(),g=audio.createGain();
 o.type='sine';o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(freq*.52,t+.09);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.11);
 o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.12);
 const src=audio.createBufferSource();src.buffer=noise;
 const f=audio.createBiquadFilter();f.type='bandpass';f.frequency.value=950;f.Q.value=1.4;
 const ng=audio.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.045,t+.003);ng.gain.exponentialRampToValueAtTime(.0001,t+.055);
 src.connect(f).connect(ng).connect(audio.destination);src.start(t);src.stop(t+.06);
}
function s3ShrubSound(freq){
 if(!audio||audio.state!=='running'||!noise)return;
 const t=audio.currentTime;
 const o=audio.createOscillator(),g=audio.createGain();
 o.type='triangle';o.frequency.setValueAtTime(freq*.65,t);o.frequency.exponentialRampToValueAtTime(freq*1.35,t+.09);o.frequency.exponentialRampToValueAtTime(freq*.9,t+.16);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.065,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.18);
 o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.19);
 const src=audio.createBufferSource();src.buffer=noise;
 const f=audio.createBiquadFilter();f.type='highpass';f.frequency.value=1600;
 const ng=audio.createGain();ng.gain.setValueAtTime(.0001,t);ng.gain.exponentialRampToValueAtTime(.035,t+.01);ng.gain.exponentialRampToValueAtTime(.0001,t+.12);
 src.connect(f).connect(ng).connect(audio.destination);src.start(t);src.stop(t+.13);
}
function s3TreeSound(baseFreq){
 if(!audio||audio.state!=='running')return;
 const t=audio.currentTime;
 [1,1.25,1.5,2].forEach((m,i)=>{
  const ts=t+i*.045;const o=audio.createOscillator(),g=audio.createGain();
  o.type=i===0?'triangle':'sine';o.frequency.setValueAtTime(baseFreq*m*.85,ts);o.frequency.exponentialRampToValueAtTime(baseFreq*m,ts+.18);
  g.gain.setValueAtTime(.0001,ts);g.gain.exponentialRampToValueAtTime(.045/(1+i*.3),ts+.02);g.gain.exponentialRampToValueAtTime(.0001,ts+.32);
  o.connect(g).connect(audio.destination);o.start(ts);o.stop(ts+.34);
 });
}

 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.19);

function s3elastic(x){
 if(x<=0)return 0;if(x>=1)return 1;
 return Math.pow(2,-9*x)*Math.sin((x*9-.75)*(2*Math.PI)/3)+1;
}
function s3grow(node,at,now,dur,cx,cy,sway){
 const u=clamp((now-at)/dur);
 if(u<=0){node.setAttribute('opacity',0);return;}
 const sc=u>=1?1:s3elastic(u);
 const tilt=sway?Math.sin(now*2.3+cx*.02)*sway:0;
 node.setAttribute('opacity',Math.min(1,u*3.5));
 node.setAttribute('transform',`translate(${cx} ${cy}) rotate(${tilt}) scale(${sc}) translate(${-cx} ${-cy})`);
}
function s3dropIn(node,at,now,cx,cy){
 const u=clamp((now-at)/.34);
 if(u<=0){node.setAttribute('opacity',0);return;}
 if(u>=1){node.setAttribute('opacity',1);node.removeAttribute('transform');return;}
 const b=s2bounce(u);
 node.setAttribute('opacity',Math.min(1,u*3));
 node.setAttribute('transform',`translate(${cx} ${cy}) translate(0 ${(1-b)*-34}) scale(${.82+.18*b}) translate(${-cx} ${-cy})`);
}

let s3Prev=0;
function stage3(now,progress){
 const looped=now+.25<s3Prev;const prev=looped?0:s3Prev;
 if(now<=0||progress<=0){s3garden.setAttribute('visibility','hidden');s3Prev=0;return;}
 s3garden.setAttribute('visibility','visible');

 // 1. Lawn unfurl & turf wave ring
 const lawnU=ease(clamp(now/1.55));
 const rad=lawnU*690;
 s3LawnRevealCircle.setAttribute('r',rad);
 s3LawnRing.setAttribute('r',rad);
 s3LawnRing.setAttribute('opacity',lawnU>0&&lawnU<.99?Math.sin(lawnU*Math.PI)*.85:0);
 s3Tufts.forEach(t=>s3grow(t.node,t.at,now,.42,t.x,t.y,2.2));
 s3Fences.forEach(f=>s3grow(f.node,f.at,now,.48,f.cx,f.cy,0));

 // 2. Stone path to the door
 const pathU=ease(clamp((now-1.6)/.45));
 s3PathBed.setAttribute('opacity',pathU);
 s3Stones.forEach(s=>s3dropIn(s.node,s.at,now,s.cx,s.cy));

 // 3. Mulched beds & sculpted shrubs
 s3Beds.forEach(b=>s2fade(b.node,b.at,now,.32));
 s3Shrubs.forEach(s=>s3grow(s.node,s.at,now,.52,s.cx,s.cy,1.1));

 // 4. Ornamental trees
 s3Trees.forEach(tr=>{
  const tu=clamp((now-tr.at)/.55);
  if(tu<=0){tr.root.setAttribute('opacity',0);return;}
  tr.root.setAttribute('opacity',1);
  const te=s2back(tu);
  const breeze=Math.sin(now*1.7+tr.bx*.01)*1.4;
  tr.trunkG.setAttribute('transform',`translate(${tr.bx} ${tr.by}) rotate(${breeze}) scale(${.3+.7*te} ${te}) translate(${-tr.bx} ${-tr.by})`);
  tr.puffs.forEach(p=>s3grow(p.node,p.at,now,.56,p.cx,p.cy,1.8));
 });

 // 5. Vivid flower beds & yard blooms
 s3Flowers.forEach(f=>s3grow(f.node,f.at,now,.46,f.cx,f.cy,3.2));

 // 6. Fluttering butterflies
 s3Butterflies.forEach((b,i)=>{
  const bu=clamp((now-b.at)/.5);
  if(bu<=0){b.node.setAttribute('opacity',0);return;}
  const bx=b.x+Math.cos(now*b.spd+i*2)*b.rx;
  const by=b.y+Math.sin(now*b.spd*1.6+i)*b.ry;
  const flap=.35+.65*Math.abs(Math.sin(now*18+i));
  b.node.setAttribute('opacity',bu);
  b.node.setAttribute('transform',`translate(${bx} ${by}) rotate(${Math.sin(now*b.spd+i)*14})`);
  b.wL.setAttribute('transform',`scale(${flap} 1)`);
  b.wR.setAttribute('transform',`scale(${flap} 1)`);
 });

 // Sparkle bursts on key landscaping beats
 let si=0;
 s3Bursts.forEach(burst=>{
  const u=clamp((now-burst.t)/.42);
  for(let k=0;k<3;k++){
   const node=s3Sparks[si++];
   if(u<=0||u>=1){node.setAttribute('opacity',0);continue;}
   const ang=k*2.09+u*1.8+burst.t;
   const r=(14+u*42)*(1+k*.18);
   node.setAttribute('cx',burst.x+Math.cos(ang)*r);
   node.setAttribute('cy',burst.y+Math.sin(ang)*r-u*18);
   node.setAttribute('opacity',Math.sin(u*Math.PI));
  }
 });

 if(!looped)for(const cue of s3Cues)s2cue(prev,now,cue[0],cue[1]);
 s3Prev=now;
}

const DURATION=36;
const origin=performance.now();let previous=0;let previousCycle=0;
function frame(now){
 const elapsed=(now-origin)/1000;const cycle=Math.floor(elapsed/DURATION);const time=elapsed%DURATION;
 if(cycle!==previousCycle)previous=0;
 stage1(time,previous);
 stage2(Math.max(0,time-12),clamp((time-12)/8));
 stage3(Math.max(0,time-20),clamp((time-20)/8));
 stage4(Math.max(0,time-28),clamp((time-28)/6));
 previous=time;previousCycle=cycle;requestAnimationFrame(frame);
}
