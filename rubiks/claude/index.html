<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070812; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- small vector / matrix helpers ----------
  const mulMV = (m, p) => [
    m[0] * p[0] + m[1] * p[1] + m[2] * p[2],
    m[3] * p[0] + m[4] * p[1] + m[5] * p[2],
    m[6] * p[0] + m[7] * p[1] + m[8] * p[2]
  ];
  const mulMM = (a, b) => {
    const r = new Array(9);
    for (let i = 0; i < 3; i++)
      for (let j = 0; j < 3; j++)
        r[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j];
    return r;
  };
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  // Right-handed rotation about axis a (0=x, 1=y, 2=z) by angle th.
  function rotMat(a, th) {
    const c = Math.cos(th), s = Math.sin(th);
    const u = (a + 1) % 3, v = (a + 2) % 3;
    const m = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    m[a * 3 + a] = 1;
    m[u * 3 + u] = c; m[u * 3 + v] = -s;
    m[v * 3 + u] = s; m[v * 3 + v] = c;
    return m;
  }

  // ---------- cube model ----------
  // Sticker colours for faces +x, -x, +y, -y, +z, -z
  const HEX = ['#ff2d2d', '#ff8c00', '#ffffff', '#ffe600', '#1f6fff', '#12d957'];
  const COLORS = HEX.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
  const BODY = [16, 17, 26];

  // Local face geometry, corners wound counter-clockwise seen from outside.
  const HALF = 0.47;
  const FACES = [];
  for (let f = 0; f < 6; f++) {
    const a = f >> 1, s = (f & 1) ? -1 : 1;
    let u = (a + 1) % 3, v = (a + 2) % 3;
    if (s < 0) { const t = u; u = v; v = t; }
    const corners = [];
    for (const [su, sv] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
      const c = [0, 0, 0];
      c[a] = s * HALF; c[u] = su * HALF; c[v] = sv * HALF;
      corners.push(c);
    }
    FACES.push(corners);
  }

  const cubies = [];
  for (let x = -1; x <= 1; x++)
    for (let y = -1; y <= 1; y++)
      for (let z = -1; z <= 1; z++)
        cubies.push({
          p: [x, y, z],
          m: [1, 0, 0, 0, 1, 0, 0, 0, 1],
          st: [x > 0 ? 0 : -1, x < 0 ? 1 : -1, y > 0 ? 2 : -1, y < 0 ? 3 : -1, z > 0 ? 4 : -1, z < 0 ? 5 : -1]
        });

  // ---------- move sequencing ----------
  const easeInOutQuad = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const easeInOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function genScramble() {
    const n = 20 + Math.floor(Math.random() * 6);
    const moves = [];
    let prevAxis = -1;
    for (let i = 0; i < n; i++) {
      let axis;
      do { axis = Math.floor(Math.random() * 3); } while (axis === prevAxis);
      prevAxis = axis;
      moves.push({ axis, layer: Math.floor(Math.random() * 3) - 1, dir: Math.random() < 0.5 ? 1 : -1 });
    }
    return moves;
  }

  let anim = null;
  let scramble = genScramble();
  let idx = 0;
  let mode = 'scramble';
  let pause = 1.2;

  function startMove(mv, dur, ease) {
    anim = { axis: mv.axis, layer: mv.layer, dir: mv.dir, t: 0, dur, ease };
  }

  function finishMove(a) {
    const R = rotMat(a.axis, a.dir * Math.PI / 2).map(v => Math.round(v));
    for (const c of cubies) {
      if (c.p[a.axis] === a.layer) {
        c.p = mulMV(R, c.p).map(v => Math.round(v));
        c.m = mulMM(R, c.m).map(v => Math.round(v));
      }
    }
  }

  function update(dt) {
    if (anim) {
      anim.t += dt / anim.dur;
      if (anim.t >= 1) { finishMove(anim); anim = null; }
      return;
    }
    if (pause > 0) { pause -= dt; return; }
    if (mode === 'scramble') {
      if (idx < scramble.length) {
        startMove(scramble[idx++], 0.21, easeInOutQuad);
      } else {
        mode = 'solve';
        idx = scramble.length - 1;
        pause = 1.5;
      }
    } else {
      if (idx >= 0) {
        const m = scramble[idx--];
        const progress = 1 - (idx + 1) / scramble.length;
        const dur = 0.5 - 0.18 * progress; // speeds up as it nears solved
        startMove({ axis: m.axis, layer: m.layer, dir: -m.dir }, dur, easeInOutCubic);
      } else {
        mode = 'scramble';
        scramble = genScramble();
        idx = 0;
        pause = 2.6;
      }
    }
  }

  // ---------- rendering ----------
  const LIGHT = norm([-0.5, 0.85, 1.0]);
  const HALFV = norm([LIGHT[0], LIGHT[1], LIGHT[2] + 1]);
  const D = 7.5; // camera distance

  function rgb(c) { return 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'; }
  function shade(base, n, isSticker) {
    const diff = Math.max(0, dot(n, LIGHT));
    const k = isSticker ? 0.58 + 0.42 * diff : 0.45 + 0.55 * diff;
    const spec = isSticker ? Math.pow(Math.max(0, dot(n, HALFV)), 36) * 70 : 0;
    return [Math.min(255, base[0] * k + spec), Math.min(255, base[1] * k + spec), Math.min(255, base[2] * k + spec)];
  }

  function render(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const md = Math.min(W, H), cx = W / 2, cy = H / 2;

    // background
    const g = ctx.createRadialGradient(cx, cy * 0.75, 0, cx, cy, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#1b2047');
    g.addColorStop(0.55, '#0b0e22');
    g.addColorStop(1, '#03040c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const bob = Math.sin(t * 1.1) * md * 0.012;

    // soft floor shadow
    ctx.save();
    ctx.translate(cx, cy + md * 0.43 + bob * 0.35);
    ctx.scale(1, 0.26);
    const sg = ctx.createRadialGradient(0, 0, 0, 0, 0, md * 0.4);
    sg.addColorStop(0, 'rgba(0,0,0,0.6)');
    sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(-md, -md, md * 2, md * 2);
    ctx.restore();

    // view matrix
    const yaw = t * 0.42;
    const tilt = 0.5 + 0.14 * Math.sin(t * 0.47);
    const roll = 0.07 * Math.sin(t * 0.31);
    const V = mulMM(rotMat(2, roll), mulMM(rotMat(0, tilt), rotMat(1, yaw)));
    const S = md * 0.165;

    const proj = (p) => {
      const k = S * D / (D - p[2]);
      return [cx + p[0] * k, cy - p[1] * k + bob];
    };

    const polys = [];
    let VR = null;
    if (anim) {
      const R = rotMat(anim.axis, anim.dir * Math.PI / 2 * anim.ease(Math.min(anim.t, 1)));
      VR = mulMM(V, R);
    }
    for (const c of cubies) {
      const turning = anim && c.p[anim.axis] === anim.layer;
      const T = mulMM(turning ? VR : V, c.m);
      const o = mulMV(turning ? VR : V, c.p);
      for (let f = 0; f < 6; f++) {
        const cs = FACES[f].map(q => add(mulMV(T, q), o));
        const n = cross(sub(cs[1], cs[0]), sub(cs[3], cs[0]));
        if (dot(n, [-cs[0][0], -cs[0][1], D - cs[0][2]]) <= 0) continue; // back face
        const cen = [(cs[0][0] + cs[2][0]) / 2, (cs[0][1] + cs[2][1]) / 2, (cs[0][2] + cs[2][2]) / 2];
        const depth = cen[0] * cen[0] + cen[1] * cen[1] + (D - cen[2]) * (D - cen[2]);
        polys.push({ cs, n: norm(n), cen, depth, st: c.st[f] });
      }
    }
    polys.sort((a, b) => b.depth - a.depth);

    ctx.lineJoin = 'round';
    for (const poly of polys) {
      const pts = poly.cs.map(proj);
      // cubie body
      const bc = rgb(shade(BODY, poly.n, false));
      ctx.fillStyle = bc;
      ctx.strokeStyle = bc;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < 4; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // sticker
      if (poly.st >= 0) {
        const ins = poly.cs.map(c => add(poly.cen, sub(c, poly.cen).map(v => v * 0.78))).map(proj);
        const size = Math.hypot(pts[1][0] - pts[0][0], pts[1][1] - pts[0][1]);
        const sc = rgb(shade(COLORS[poly.st], poly.n, true));
        ctx.fillStyle = sc;
        ctx.strokeStyle = sc;
        ctx.lineWidth = Math.max(1, size * 0.11);
        ctx.beginPath();
        ctx.moveTo(ins[0][0], ins[0][1]);
        for (let i = 1; i < 4; i++) ctx.lineTo(ins[i][0], ins[i][1]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }
  }

  // ---------- main loop ----------
  let last = performance.now();
  const t0 = last;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render((now - t0) / 1000);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
