<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#100b25">
  <title>Rubik's Cube</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #100b25;
      background-image:
        radial-gradient(ellipse at 25% 25%, #30215d 0, transparent 52%),
        radial-gradient(ellipse at 80% 75%, #071f38 0, transparent 52%),
        radial-gradient(ellipse at 50% 100%, #251032 0, transparent 65%);
    }
    .ambient { position: absolute; inset: 0; pointer-events: none; }
    .ambient::before, .ambient::after {
      content: ''; position: absolute; width: 55vmin; height: 55vmin;
      border-radius: 50%; filter: blur(65px); opacity: .16;
    }
    .ambient::before { background: #733aff; top: 7%; left: 1%; }
    .ambient::after { background: #00c9f7; bottom: 7%; right: 0; opacity: .09; }
    .stage {
      position: absolute; inset: 0;
      perspective: 1300px; perspective-origin: 50% 45%;
    }
    .rig {
      position: absolute; left: 50%; top: 47%;
      width: 0; height: 0; transform-style: preserve-3d;
      transform: scale(var(--scale, 1));
    }
    .cube {
      width: 0; height: 0; position: absolute;
      transform-style: preserve-3d;
      transform: rotateX(-26deg) rotateY(-35deg) rotateZ(-5deg);
    }
    .cubie {
      width: 94px; height: 94px; position: absolute;
      left: -47px; top: -47px; transform-style: preserve-3d;
      will-change: transform;
    }
    .face {
      position: absolute; width: 94px; height: 94px;
      border-radius: 9px; backface-visibility: hidden;
      background: linear-gradient(145deg, #252735, #090c14 65%);
      border: 1px solid #363343;
      box-shadow: inset 0 0 6px #000a;
    }
    .face::before {
      content: ''; position: absolute; inset: 5px;
      border-radius: 6px; background: var(--color, #10121c);
      box-shadow: inset 0 2px 1px #ffffff60, inset 0 -3px 3px #0003;
    }
    .face::after {
      content: ''; position: absolute; inset: 6px;
      border-radius: 5px;
      background: linear-gradient(140deg, #ffffff24, transparent 47%, #0000000d);
    }
    .front { transform: translateZ(47px); }
    .back { transform: rotateY(180deg) translateZ(47px); }
    .right { transform: rotateY(90deg) translateZ(47px); }
    .left { transform: rotateY(-90deg) translateZ(47px); }
    .top { transform: rotateX(90deg) translateZ(47px); }
    .bottom { transform: rotateX(-90deg) translateZ(47px); }
    .shadow {
      position: absolute; left: 50%; top: 76%;
      width: 43vmin; height: 7vmin; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #000a; filter: blur(19px);
      box-shadow: 0 0 65px 8px #7138cc18;
    }
    .halo {
      position: absolute; left: 50%; top: 76%;
      width: 58vmin; height: 16vmin;
      transform: translate(-50%, -50%); border-radius: 50%;
      background: radial-gradient(ellipse, #7560ff1a, transparent 65%);
      filter: blur(12px);
    }
  </style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>
  <div class="shadow" aria-hidden="true"></div>
  <main class="stage" role="img" aria-label="A three-dimensional Rubik's cube automatically scrambling and solving itself, one turn at a time.">
    <div class="rig"><div class="cube"></div></div>
  </main>
  <script>
    'use strict';
    (() => {
      const cube = document.querySelector('.cube');
      const rig = document.querySelector('.rig');
      const cubies = [];
      const identity = () => [1, 0, 0, 0, 1, 0, 0, 0, 1];
      const sides = [
        ['front', 2, 1, '#ff254a'],
        ['back', 2, -1, '#ff8617'],
        ['right', 0, 1, '#008aff'],
        ['left', 0, -1, '#00e692'],
        ['top', 1, -1, '#fff7e8'],
        ['bottom', 1, 1, '#ffe326']
      ];

      // Every piece retains its stickers and an exact integer orientation.
      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            const position = [x, y, z];
            const element = document.createElement('div');
            element.className = 'cubie';
            for (const [name, axis, layer, color] of sides) {
              const face = document.createElement('div');
              face.className = 'face ' + name;
              if (position[axis] === layer) face.style.setProperty('--color', color);
              element.appendChild(face);
            }
            cube.appendChild(element);
            cubies.push({ element, position, orientation: identity() });
          }
        }
      }

      function multiply(a, b) {
        const result = new Array(9).fill(0);
        for (let row = 0; row < 3; row++)
          for (let col = 0; col < 3; col++)
            for (let k = 0; k < 3; k++)
              result[row * 3 + col] += a[row * 3 + k] * b[k * 3 + col];
        return result;
      }

      function vector(matrix, v) {
        return [0, 1, 2].map(row =>
          matrix[row * 3] * v[0] + matrix[row * 3 + 1] * v[1] + matrix[row * 3 + 2] * v[2]);
      }

      function rotation(axis, angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        if (axis === 0) return [1, 0, 0, 0, c, -s, 0, s, c];
        if (axis === 1) return [c, 0, s, 0, 1, 0, -s, 0, c];
        return [c, -s, 0, s, c, 0, 0, 0, 1];
      }

      function render(piece, orientation = piece.orientation, position = piece.position) {
        const m = orientation;
        piece.element.style.transform = `matrix3d(${[
          m[0], m[3], m[6], 0,
          m[1], m[4], m[7], 0,
          m[2], m[5], m[8], 0,
          position[0] * 98, position[1] * 98, position[2] * 98, 1
        ].join(',')})`;
      }

      function resize() {
        const size = Math.min(window.innerWidth, window.innerHeight);
        rig.style.setProperty('--scale', size / 640);
        document.querySelector('.stage').style.perspective = `${size * 1.65}px`;
      }
      window.addEventListener('resize', resize);
      resize();
      cubies.forEach(piece => render(piece));

      const wait = duration => new Promise(resolve => setTimeout(resolve, duration));

      function turn(move, duration) {
        const pieces = cubies.filter(piece => piece.position[move.axis] === move.layer);
        return new Promise(resolve => {
          let start;
          function frame(now) {
            if (start === undefined) start = now;
            const t = Math.min(1, (now - start) / duration);
            const eased = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            const matrix = rotation(move.axis, move.direction * Math.PI / 2 * eased);
            for (const piece of pieces) {
              render(piece, multiply(matrix, piece.orientation), vector(matrix, piece.position));
            }
            if (t < 1) {
              requestAnimationFrame(frame);
            } else {
              // Snap to the integer lattice to prevent drift over endless cycles.
              const exact = rotation(move.axis, move.direction * Math.PI / 2).map(Math.round);
              for (const piece of pieces) {
                piece.position = vector(exact, piece.position).map(Math.round);
                piece.orientation = multiply(exact, piece.orientation).map(Math.round);
                render(piece);
              }
              resolve();
            }
          }
          requestAnimationFrame(frame);
        });
      }

      function scramble() {
        const moves = [];
        let lastAxis = -1;
        for (let i = 0; i < 22; i++) {
          let axis;
          do { axis = Math.floor(Math.random() * 3); } while (axis === lastAxis);
          moves.push({ axis, layer: Math.random() < .5 ? -1 : 1, direction: Math.random() < .5 ? -1 : 1 });
          lastAxis = axis;
        }
        return moves;
      }

      async function animate() {
        await wait(350);
        for (;;) {
          const moves = scramble();
          for (const move of moves) {
            await turn(move, 480);
            await wait(90);
          }
          await wait(1100);
          // Reversing the actual scramble is a guaranteed legal solution.
          for (const move of moves.slice().reverse()) {
            await turn({ ...move, direction: -move.direction }, 560);
            await wait(130);
          }
          await wait(2200);
        }
      }
      animate();
    })();
  </script>
</body>
</html>
