<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Reef Aquarium</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020b18;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="aquarium"></canvas>
<script>
(() => {
  const canvas = document.getElementById('aquarium');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Logical coordinate system designed around 1080x1080
  let width = 1080;
  let height = 1080;
  let dpr = 1;

  // Offscreen static & semi-static layer caching for lush reef complexity at 60fps
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  const fgRockCanvas = document.createElement('canvas');
  const fgRockCtx = fgRockCanvas.getContext('2d');

  // Seeded pseudo-random for deterministic reef composition across resizes
  let seed = 42197;
  function rand() {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  }
  function randRange(min, max) {
    return min + rand() * (max - min);
  }

  // Scene entities
  const sunRays = [];
  const marineSnow = [];
  const bubbles = [];
  const bubbleEmitters = [];
  const kelps = [];
  const anemones = [];
  const seaFans = [];
  const school = [];
  const reefFish = [];
  let prowler = null;

  // School state machine for dramatic cohesive choreography + scattering
  const schoolState = {
    mode: 'cruising', // 'cruising', 'turning', 'swirling', 'scattering', 'regrouping'
    timer: 0,
    leaderX: 540,
    leaderY: 420,
    leaderVx: 2.2,
    leaderVy: 0.4,
    targetX: 760,
    targetY: 360,
    scatterOriginX: 540,
    scatterOriginY: 420,
    scatterStrength: 0,
    swirlCenter: { x: 540, y: 400 },
    swirlDir: 1
  };

  // Interactive or autonomous disturbance
  const pointer = { x: -9999, y: -9999, active: false, pulse: 0 };
  window.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((e.clientX - rect.left) / rect.width) * width;
    pointer.y = ((e.clientY - rect.top) / rect.height) * height;
    pointer.active = true;
  });
  window.addEventListener('pointerleave', () => {
    pointer.active = false;
  });

  function initScene() {
    seed = 73819;
    sunRays.length = 0;
    marineSnow.length = 0;
    bubbles.length = 0;
    bubbleEmitters.length = 0;
    kelps.length = 0;
    anemones.length = 0;
    seaFans.length = 0;

    // 1. Volumetric Sun Rays
    const rayCount = 14;
    for (let i = 0; i < rayCount; i++) {
      sunRays.push({
        xTop: width * (-0.05 + (i / (rayCount - 1)) * 1.05) + randRange(-30, 30),
        angle: 0.16 + randRange(-0.06, 0.08),
        topWidth: randRange(35, 95),
        bottomWidth: randRange(120, 260),
        length: height * randRange(0.78, 1.05),
        phase: randRange(0, Math.PI * 2),
        speed: randRange(0.4, 0.9),
        alpha: randRange(0.035, 0.085),
        hue: randRange(178, 198)
      });
    }

    // 2. Marine Snow / Plankton
    for (let i = 0; i < 140; i++) {
      marineSnow.push({
        x: randRange(0, width),
        y: randRange(0, height),
        r: randRange(0.7, 2.3),
        vx: randRange(-0.18, 0.18),
        vy: randRange(-0.12, 0.25),
        phase: randRange(0, Math.PI * 2),
        alpha: randRange(0.15, 0.55),
        hue: rand() > 0.3 ? 185 : 52
      });
    }

    // 3. Bubble Emitters & Initial Bubbles
    bubbleEmitters.push(
      { x: width * 0.16, y: height * 0.87, rate: 0.08 },
      { x: width * 0.48, y: height * 0.91, rate: 0.05 },
      { x: width * 0.83, y: height * 0.84, rate: 0.09 }
    );
    for (let i = 0; i < 45; i++) {
      bubbles.push({
        x: randRange(width * 0.08, width * 0.92),
        y: randRange(height * 0.1, height * 0.95),
        r: randRange(1.5, 6.2),
        vy: randRange(0.8, 2.3),
        wobbleFreq: randRange(1.8, 3.8),
        wobbleAmp: randRange(0.4, 1.4),
        phase: randRange(0, Math.PI * 2)
      });
    }

    // 4. Swaying Kelp & Sea Grasses (Back, Mid, Front layers)
    const kelpClusters = [
      { x: width * 0.05, y: height * 0.93, count: 6, minH: 180, maxH: 340, layer: 'back', hue: 162 },
      { x: width * 0.27, y: height * 0.89, count: 4, minH: 120, maxH: 210, layer: 'mid', hue: 145 },
      { x: width * 0.72, y: height * 0.90, count: 5, minH: 130, maxH: 230, layer: 'mid', hue: 152 },
      { x: width * 0.94, y: height * 0.95, count: 7, minH: 200, maxH: 390, layer: 'front', hue: 138 }
    ];
    for (const cluster of kelpClusters) {
      for (let i = 0; i < cluster.count; i++) {
        kelps.push({
          x: cluster.x + randRange(-38, 38),
          y: cluster.y + randRange(-12, 15),
          height: randRange(cluster.minH, cluster.maxH),
          segments: 12,
          width: randRange(7, 13),
          hue: cluster.hue + randRange(-10, 10),
          light: cluster.layer === 'back' ? 24 : cluster.layer === 'mid' ? 34 : 40,
          phase: randRange(0, Math.PI * 2),
          speed: randRange(1.0, 1.6),
          layer: cluster.layer
        });
      }
    }

    // 5. Sea Fans (Gorgonian lacy corals that gently flex)
    seaFans.push(
      { x: width * 0.19, y: height * 0.78, size: 125, angle: 0.35, color: '#e84a7f', highlight: '#ff85ad', phase: 0.4, layer: 'mid' },
      { x: width * 0.82, y: height * 0.73, size: 140, angle: -0.42, color: '#ff6b35', highlight: '#ffab73', phase: 1.9, layer: 'mid' },
      { x: width * 0.36, y: height * 0.89, size: 95, angle: 0.15, color: '#9b5de5', highlight: '#cba3ff', phase: 3.1, layer: 'front' }
    );

    // 6. Sea Anemones with dynamic tentacles
    anemones.push(
      {
        x: width * 0.24,
        y: height * 0.83,
        baseRx: 38,
        baseRy: 18,
        tentacles: 34,
        length: 62,
        baseColor: '#7b2cbf',
        tentacleColor: '#ff4d8d',
        tipColor: '#ffe66d',
        layer: 'mid'
      },
      {
        x: width * 0.63,
        y: height * 0.85,
        baseRx: 44,
        baseRy: 20,
        tentacles: 40,
        length: 70,
        baseColor: '#d90429',
        tentacleColor: '#ff758f',
        tipColor: '#b8f2e6',
        layer: 'front'
      },
      {
        x: width * 0.86,
        y: height * 0.88,
        baseRx: 32,
        baseRy: 15,
        tentacles: 28,
        length: 52,
        baseColor: '#1b4332',
        tentacleColor: '#40916c',
        tipColor: '#95d5b2',
        layer: 'front'
      }
    );

    // 7. Build Main School of Fish (115 Anthias / Chromis schooling fish)
    if (school.length === 0) {
      const schoolCount = 115;
      for (let i = 0; i < schoolCount; i++) {
        const angle = randRange(0, Math.PI * 2);
        const dist = randRange(10, 180);
        // Subtle color variation within the vibrant tropical school (Cyan-Gold-Coral Damselfish/Anthias)
        const variant = rand();
        let primaryHue, secondaryHue;
        if (variant < 0.72) {
          // Electric Turquoise & Gold-tailed Chromis
          primaryHue = randRange(182, 198);
          secondaryHue = randRange(42, 54);
        } else {
          // Lyretail Anthias (Sunset Coral-Gold & Magenta)
          primaryHue = randRange(14, 34);
          secondaryHue = randRange(325, 348);
        }
        school.push({
          x: schoolState.leaderX + Math.cos(angle) * dist,
          y: schoolState.leaderY + Math.sin(angle) * dist * 0.65,
          vx: randRange(1.5, 3.0),
          vy: randRange(-0.5, 0.5),
          ax: 0,
          ay: 0,
          size: randRange(10.5, 15.5),
          maxSpeed: randRange(3.2, 4.1),
          panicSpeed: randRange(7.4, 9.8),
          maxForce: randRange(0.11, 0.16),
          tailPhase: randRange(0, Math.PI * 2),
          tailSpeed: randRange(0.28, 0.38),
          primaryHue,
          secondaryHue,
          depthScale: randRange(0.82, 1.15),
          offsetBiasX: randRange(-28, 28),
          offsetBiasY: randRange(-22, 22),
          panicTimer: 0
        });
      }

      // 8. Solo Reef Dwellers (Angelfish, Butterflyfish, Clownfish near anemones)
      reefFish.push(
        {
          type: 'c2', // Clownfish pair near left anemone
          homeX: width * 0.24,
          homeY: height * 0.80,
          x: width * 0.23,
          y: height * 0.79,
          vx: 0.6,
          vy: 0.1,
          size: 16,
          phase: 0.2
        },
        {
          type: 'c2',
          homeX: width * 0.24,
          homeY: height * 0.80,
          x: width * 0.26,
          y: height * 0.81,
          vx: -0.5,
          vy: -0.1,
          size: 13,
          phase: 2.1
        },
        {
          type: 'c2', // Clownfish near right anemone
          homeX: width * 0.63,
          homeY: height * 0.82,
          x: width * 0.63,
          y: height * 0.81,
          vx: 0.5,
          vy: 0.15,
          size: 15,
          phase: 1.4
        },
        {
          type: 'angelfish', // Regal / Emperor Angelfish gliding mid-reef
          homeX: width * 0.72,
          homeY: height * 0.64,
          x: width * 0.70,
          y: height * 0.65,
          vx: -0.8,
          vy: 0.1,
          size: 30,
          phase: 0.7
        },
        {
          type: 'tang', // Yellow Tang grazing near left coral arch
          homeX: width * 0.30,
          homeY: height * 0.68,
          x: width * 0.32,
          y: height * 0.68,
          vx: 0.9,
          vy: -0.1,
          size: 25,
          phase: 3.5
        }
      );

      // 9. Reef Prowler (Large graceful Blue Trevally / Reef Shark silhouette that periodically triggers natural scatters)
      prowler = {
        x: -220,
        y: height * 0.35,
        vx: 3.4,
        vy: 0.2,
        active: false,
        cooldown: 260, // frames until first pass
        size: 68,
        tailPhase: 0
      };
    }

    renderStaticLayers();
  }

  // Draw intricate static background & foreground coral reef onto offscreen canvases
  function renderStaticLayers() {
    bgCanvas.width = width * dpr;
    bgCanvas.height = height * dpr;
    bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    fgRockCanvas.width = width * dpr;
    fgRockCanvas.height = height * dpr;
    fgRockCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    let s = 918273;
    const lRand = () => {
      s = (s * 1664525 + 1013904223) % 4294967296;
      return s / 4294967296;
    };
    const lRange = (a, b) => a + lRand() * (b - a);

    // --- 1. Deep Tropical Ocean Water Gradient ---
    const waterGrad = bgCtx.createLinearGradient(0, 0, 0, height);
    waterGrad.addColorStop(0.0, '#1ad1e6');
    waterGrad.addColorStop(0.08, '#0ca4c6');
    waterGrad.addColorStop(0.28, '#056996');
    waterGrad.addColorStop(0.58, '#043c68');
    waterGrad.addColorStop(0.85, '#031f3e');
    waterGrad.addColorStop(1.0, '#021226');
    bgCtx.fillStyle = waterGrad;
    bgCtx.fillRect(0, 0, width, height);

    // Subtle radial surface glow (Snell's window above the reef)
    const sunGlow = bgCtx.createRadialGradient(width * 0.38, -height * 0.08, 20, width * 0.42, height * 0.15, width * 0.75);
    sunGlow.addColorStop(0, 'rgba(175, 255, 255, 0.52)');
    sunGlow.addColorStop(0.35, 'rgba(64, 224, 240, 0.22)');
    sunGlow.addColorStop(1, 'rgba(5, 80, 125, 0)');
    bgCtx.fillStyle = sunGlow;
    bgCtx.fillRect(0, 0, width, height);

    // --- 2. Distant Reef Silhouettes (Atmospheric Perspective) ---
    bgCtx.fillStyle = '#043258';
    bgCtx.beginPath();
    bgCtx.moveTo(0, height);
    bgCtx.lineTo(0, height * 0.62);
    bgCtx.bezierCurveTo(width * 0.12, height * 0.56, width * 0.22, height * 0.68, width * 0.35, height * 0.72);
    bgCtx.bezierCurveTo(width * 0.50, height * 0.76, width * 0.60, height * 0.63, width * 0.75, height * 0.66);
    bgCtx.bezierCurveTo(width * 0.88, height * 0.69, width * 0.94, height * 0.57, width, height * 0.59);
    bgCtx.lineTo(width, height);
    bgCtx.closePath();
    bgCtx.fill();

    // Distant staghorn silhouettes on far ridge
    drawDistantCoralSilhouette(bgCtx, width * 0.14, height * 0.61, 65, '#063b64', lRand);
    drawDistantCoralSilhouette(bgCtx, width * 0.78, height * 0.65, 75, '#063b64', lRand);
    drawDistantCoralSilhouette(bgCtx, width * 0.88, height * 0.61, 55, '#05355b', lRand);

    // Mid-distance reef arch and ledges
    const midRockGrad = bgCtx.createLinearGradient(0, height * 0.55, 0, height);
    midRockGrad.addColorStop(0, '#072a4a');
    midRockGrad.addColorStop(1, '#041529');
    bgCtx.fillStyle = midRockGrad;
    bgCtx.beginPath();
    bgCtx.moveTo(0, height);
    bgCtx.lineTo(0, height * 0.54);
    bgCtx.bezierCurveTo(width * 0.16, height * 0.52, width * 0.26, height * 0.66, width * 0.34, height * 0.77);
    bgCtx.bezierCurveTo(width * 0.44, height * 0.86, width * 0.58, height * 0.85, width * 0.68, height * 0.76);
    bgCtx.bezierCurveTo(width * 0.78, height * 0.66, width * 0.87, height * 0.50, width, height * 0.48);
    bgCtx.lineTo(width, height);
    bgCtx.closePath();
    bgCtx.fill();

    // --- 3. Bright Sandy Lagoon Floor ---
    const sandGrad = bgCtx.createLinearGradient(0, height * 0.78, 0, height);
    sandGrad.addColorStop(0, '#1e6b7b');
    sandGrad.addColorStop(0.35, '#154e63');
    sandGrad.addColorStop(1, '#082338');
    bgCtx.fillStyle = sandGrad;
    bgCtx.beginPath();
    bgCtx.moveTo(0, height);
    bgCtx.lineTo(0, height * 0.84);
    bgCtx.bezierCurveTo(width * 0.25, height * 0.79, width * 0.45, height * 0.77, width * 0.65, height * 0.81);
    bgCtx.bezierCurveTo(width * 0.82, height * 0.85, width * 0.92, height * 0.83, width, height * 0.86);
    bgCtx.lineTo(width, height);
    bgCtx.closePath();
    bgCtx.fill();

    // Sand ripples
    bgCtx.save();
    bgCtx.strokeStyle = 'rgba(102, 217, 232, 0.12)';
    bgCtx.lineWidth = 2.5;
    for (let i = 0; i < 14; i++) {
      const rx = lRange(width * 0.25, width * 0.75);
      const ry = lRange(height * 0.83, height * 0.97);
      const rw = lRange(45, 130);
      bgCtx.beginPath();
      bgCtx.moveTo(rx - rw, ry);
      bgCtx.quadraticCurveTo(rx, ry - 6, rx + rw, ry);
      bgCtx.stroke();
    }
    bgCtx.restore();

    // --- 4. Midground Coral Formations (drawn onto bgCanvas) ---
    // Left reef outcrop
    drawReefRock(bgCtx, width * 0.16, height * 0.84, 240, 145, '#0d2b45', '#1b4d6e', lRand);
    // Right reef outcrop
    drawReefRock(bgCtx, width * 0.84, height * 0.82, 260, 165, '#0b253c', '#184564', lRand);
    // Center-left low bommie
    drawReefRock(bgCtx, width * 0.43, height * 0.89, 150, 75, '#0e2c47', '#1c5274', lRand);

    // Plate Corals (Acropora table corals) on left and right ledges
    drawTableCoral(bgCtx, width * 0.14, height * 0.71, 115, 28, '#2b9348', '#80ed99', '#e9ff70');
    drawTableCoral(bgCtx, width * 0.08, height * 0.66, 90, 22, '#0077b6', '#48cae4', '#caf0f8');
    drawTableCoral(bgCtx, width * 0.87, height * 0.67, 125, 30, '#9d4edd', '#e0aaff', '#ffccd5');
    drawTableCoral(bgCtx, width * 0.75, height * 0.76, 95, 24, '#d90429', '#ff758f', '#ffe5ec');

    // Staghorn Corals (Branching)
    drawStaghornCoral(bgCtx, width * 0.28, height * 0.79, 85, -Math.PI / 2 + 0.18, 4, '#ff5400', '#ffbd00', '#fff3b0', lRand);
    drawStaghornCoral(bgCtx, width * 0.71, height * 0.79, 92, -Math.PI / 2 - 0.15, 4, '#f72585', '#ff70a6', '#ffd6ff', lRand);
    drawStaghornCoral(bgCtx, width * 0.11, height * 0.79, 75, -Math.PI / 2 + 0.3, 4, '#00b4d8', '#90e0ef', '#caf0f8', lRand);
    drawStaghornCoral(bgCtx, width * 0.91, height * 0.75, 80, -Math.PI / 2 - 0.25, 4, '#ff9e00', '#ffea00', '#ffffff', lRand);

    // Tubular Organ-Pipe & Sponge Corals
    drawTubeCoralCluster(bgCtx, width * 0.34, height * 0.85, 11, '#ff006e', '#ffbe0b', lRand);
    drawTubeCoralCluster(bgCtx, width * 0.67, height * 0.84, 13, '#fb5607', '#ffbe0b', lRand);
    drawTubeCoralCluster(bgCtx, width * 0.18, height * 0.86, 9, '#8338ec', '#ff99c8', lRand);

    // Brain Corals with intricate meandroid grooves
    drawBrainCoral(bgCtx, width * 0.42, height * 0.87, 54, 42, '#007f5f', '#55a630', '#accf46', lRand);
    drawBrainCoral(bgCtx, width * 0.56, height * 0.88, 48, 38, '#b5179e', '#f72585', '#ff99c8', lRand);
    drawBrainCoral(bgCtx, width * 0.78, height * 0.85, 62, 46, '#e85d04', '#f48c06', '#ffba08', lRand);

    // --- 5. Foreground Framing Reef Ledges (drawn onto fgRockCanvas for depth overlap) ---
    drawReefRock(fgRockCtx, width * 0.08, height * 0.97, 230, 115, '#07192b', '#123854', lRand);
    drawReefRock(fgRockCtx, width * 0.92, height * 0.98, 250, 120, '#07192b', '#123854', lRand);
    drawReefRock(fgRockCtx, width * 0.51, height * 0.99, 175, 65, '#091f35', '#15405e', lRand);

    // Foreground vibrant corals
    drawBrainCoral(fgRockCtx, width * 0.13, height * 0.93, 58, 44, '#3a0ca3', '#7209b7', '#f72585', lRand);
    drawTubeCoralCluster(fgRockCtx, width * 0.81, height * 0.94, 12, '#ff4d6d', '#ffb3c1', lRand);
    drawStaghornCoral(fgRockCtx, width * 0.49, height * 0.95, 64, -Math.PI / 2 + 0.06, 3, '#06d6a0', '#83e377', '#eff7f6', lRand);

    // Giant Maxima Clam in the foreground
    drawGiantClam(fgRockCtx, width * 0.57, height * 0.94, 48);

    // Starfish on foreground rock
    drawStarfish(fgRockCtx, width * 0.22, height * 0.94, 24, 0.4, '#ff595e', '#ffca3a');
    drawStarfish(fgRockCtx, width * 0.74, height * 0.95, 20, -0.3, '#ff924c', '#ffca3a');
  }

  function drawDistantCoralSilhouette(c, x, y, size, color, lRand) {
    c.save();
    c.strokeStyle = color;
    c.lineCap = 'round';
    function branch(bx, by, len, ang, depth) {
      if (depth <= 0) return;
      const ex = bx + Math.cos(ang) * len;
      const ey = by + Math.sin(ang) * len;
      c.lineWidth = depth * 2.2;
      c.beginPath();
      c.moveTo(bx, by);
      c.lineTo(ex, ey);
      c.stroke();
      branch(ex, ey, len * 0.74, ang - 0.32 - lRand() * 0.2, depth - 1);
      branch(ex, ey, len * 0.74, ang + 0.32 + lRand() * 0.2, depth - 1);
    }
    branch(x, y, size * 0.38, -Math.PI / 2, 4);
    c.restore();
  }

  function drawReefRock(c, cx, cy, rx, ry, darkColor, litColor, lRand) {
    c.save();
    const grad = c.createLinearGradient(cx, cy - ry, cx, cy + ry * 0.5);
    grad.addColorStop(0, litColor);
    grad.addColorStop(0.55, darkColor);
    grad.addColorStop(1, '#040e1a');
    c.fillStyle = grad;

    c.beginPath();
    const steps = 28;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * Math.PI * 2;
      const bump = 1 + Math.sin(t * 5) * 0.08 + (lRand() - 0.5) * 0.08;
      const px = cx + Math.cos(t) * rx * bump;
      const py = cy + Math.sin(t) * ry * (t > Math.PI ? bump * 1.05 : 0.6);
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();

    // Subtle rim light and coralline algae patches
    c.fillStyle = 'rgba(181, 23, 158, 0.16)';
    for (let i = 0; i < 8; i++) {
      const px = cx + (lRand() - 0.5) * rx * 1.2;
      const py = cy - lRand() * ry * 0.65;
      c.beginPath();
      c.ellipse(px, py, lRand() * 28 + 10, lRand() * 10 + 4, (lRand() - 0.5) * 0.5, 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }

  function drawTableCoral(c, cx, cy, rx, ry, baseCol, midCol, rimCol) {
    c.save();
    // Stalk
    c.fillStyle = baseCol;
    c.beginPath();
    c.moveTo(cx - rx * 0.25, cy + ry * 1.4);
    c.quadraticCurveTo(cx, cy, cx - rx * 0.5, cy);
    c.lineTo(cx + rx * 0.5, cy);
    c.quadraticCurveTo(cx, cy, cx + rx * 0.25, cy + ry * 1.4);
    c.closePath();
    c.fill();

    // Layered tiers
    for (let tier = 0; tier < 3; tier++) {
      const tx = cx + (tier - 1) * 14;
      const ty = cy - tier * 10;
      const trx = rx * (1 - tier * 0.18);
      const try_ = ry * (1 - tier * 0.15);

      const grad = c.createRadialGradient(tx, ty - try_ * 0.3, 4, tx, ty, trx);
      grad.addColorStop(0, baseCol);
      grad.addColorStop(0.75, midCol);
      grad.addColorStop(1, rimCol);

      c.fillStyle = grad;
      c.beginPath();
      const lobes = 24;
      for (let i = 0; i <= lobes; i++) {
        const a = (i / lobes) * Math.PI * 2;
        const rMod = 1 + Math.sin(a * 12) * 0.06;
        const px = tx + Math.cos(a) * trx * rMod;
        const py = ty + Math.sin(a) * try_ * rMod;
        if (i === 0) c.moveTo(px, py);
        else c.lineTo(px, py);
      }
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawStaghornCoral(c, x, y, size, angle, maxDepth, baseCol, midCol, tipCol, lRand) {
    c.save();
    c.lineCap = 'round';
    c.lineJoin = 'round';

    function branch(bx, by, len, ang, depth) {
      if (depth <= 0) return;
      const ex = bx + Math.cos(ang) * len;
      const ey = by + Math.sin(ang) * len;

      const grad = c.createLinearGradient(bx, by, ex, ey);
      grad.addColorStop(0, depth === maxDepth ? baseCol : midCol);
      grad.addColorStop(1, depth === 1 ? tipCol : midCol);

      c.strokeStyle = grad;
      c.lineWidth = Math.max(3, depth * 3.6);
      c.beginPath();
      c.moveTo(bx, by);
      c.quadraticCurveTo(
        (bx + ex) * 0.5 + (lRand() - 0.5) * 8,
        (by + ey) * 0.5,
        ex,
        ey
      );
      c.stroke();

      if (depth === 1) {
        c.fillStyle = tipCol;
        c.beginPath();
        c.arc(ex, ey, 3.2, 0, Math.PI * 2);
        c.fill();
      } else {
        const subCount = lRand() > 0.35 ? 2 : 3;
        for (let i = 0; i < subCount; i++) {
          const spread = (i - (subCount - 1) / 2) * (0.48 + lRand() * 0.22);
          branch(ex, ey, len * (0.68 + lRand() * 0.14), ang + spread, depth - 1);
        }
      }
    }

    branch(x, y, size * 0.42, angle, maxDepth);
    c.restore();
  }

  function drawTubeCoralCluster(c, cx, cy, count, bodyCol, rimCol, lRand) {
    c.save();
    for (let i = 0; i < count; i++) {
      const frac = (i / (count - 1)) - 0.5;
      const angle = -Math.PI / 2 + frac * 0.85 + (lRand() - 0.5) * 0.15;
      const len = 32 + (1 - Math.abs(frac)) * 38 + lRand() * 16;
      const w = 7 + lRand() * 4.5;
      const bx = cx + frac * 42;
      const by = cy + Math.abs(frac) * 10;
      const tx = bx + Math.cos(angle) * len;
      const ty = by + Math.sin(angle) * len;

      const grad = c.createLinearGradient(bx, by, tx, ty);
      grad.addColorStop(0, '#1a0b2e');
      grad.addColorStop(0.35, bodyCol);
      grad.addColorStop(1, rimCol);

      c.strokeStyle = grad;
      c.lineWidth = w;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(bx, by);
      c.lineTo(tx, ty);
      c.stroke();

      // Tube opening
      c.save();
      c.translate(tx, ty);
      c.rotate(angle + Math.PI / 2);
      c.fillStyle = rimCol;
      c.beginPath();
      c.ellipse(0, 0, w * 0.58, w * 0.28, 0, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#240046';
      c.beginPath();
      c.ellipse(0, 0, w * 0.34, w * 0.16, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }
    c.restore();
  }

  function drawBrainCoral(c, cx, cy, rx, ry, darkCol, midCol, ridgeCol, lRand) {
    c.save();
    const grad = c.createRadialGradient(cx - rx * 0.2, cy - ry * 0.35, 5, cx, cy, rx);
    grad.addColorStop(0, ridgeCol);
    grad.addColorStop(0.6, midCol);
    grad.addColorStop(1, darkCol);

    c.fillStyle = grad;
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, Math.PI, Math.PI * 2);
    c.bezierCurveTo(cx + rx, cy + ry * 0.35, cx - rx, cy + ry * 0.35, cx - rx, cy);
    c.closePath();
    c.fill();

    // Wavy cerebral labyrinth ridges
    c.strokeStyle = darkCol;
    c.lineWidth = 2.6;
    c.lineCap = 'round';
    for (let r = 0.22; r < 0.88; r += 0.18) {
      c.beginPath();
      const steps = 28;
      for (let i = 0; i <= steps; i++) {
        const a = Math.PI + (i / steps) * Math.PI;
        const wave = Math.sin(i * 1.9 + r * 20) * 4.5;
        const px = cx + Math.cos(a) * rx * r + wave * 0.5;
        const py = cy + Math.sin(a) * ry * r + wave;
        if (i === 0) c.moveTo(px, py);
        else c.lineTo(px, py);
      }
      c.stroke();
    }

    c.strokeStyle = ridgeCol;
    c.lineWidth = 1.4;
    for (let r = 0.30; r < 0.86; r += 0.18) {
      c.beginPath();
      const steps = 28;
      for (let i = 0; i <= steps; i++) {
        const a = Math.PI + (i / steps) * Math.PI;
        const wave = Math.sin(i * 1.9 + r * 20) * 4.5;
        const px = cx + Math.cos(a) * rx * r + wave * 0.5;
        const py = cy + Math.sin(a) * ry * r + wave - 1.5;
        if (i === 0) c.moveTo(px, py);
        else c.lineTo(px, py);
      }
      c.stroke();
    }
    c.restore();
  }

  function drawGiantClam(c, cx, cy, size) {
    c.save();
    // Fluted shell
    c.fillStyle = '#3d5a80';
    c.beginPath();
    c.ellipse(cx, cy, size, size * 0.52, -0.08, 0, Math.PI * 2);
    c.fill();

    // Iridescent turquoise/cobalt mantle
    const mantleGrad = c.createRadialGradient(cx, cy - 4, 4, cx, cy, size * 0.85);
    mantleGrad.addColorStop(0, '#03045e');
    mantleGrad.addColorStop(0.55, '#0077b6');
    mantleGrad.addColorStop(0.85, '#00f5d4');
    mantleGrad.addColorStop(1, '#7209b7');
    c.fillStyle = mantleGrad;

    c.beginPath();
    const waves = 16;
    for (let i = 0; i <= waves; i++) {
      const a = (i / waves) * Math.PI * 2;
      const rMod = 1 + Math.sin(a * 6) * 0.14;
      const px = cx + Math.cos(a) * size * 0.82 * rMod;
      const py = cy - 4 + Math.sin(a) * size * 0.34 * rMod;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();
    c.restore();
  }

  function drawStarfish(c, cx, cy, radius, rot, bodyCol, spotCol) {
    c.save();
    c.translate(cx, cy);
    c.rotate(rot);
    c.scale(1, 0.55); // Perspective foreshortening on seafloor
    c.fillStyle = bodyCol;
    c.beginPath();
    const arms = 5;
    for (let i = 0; i < arms * 2; i++) {
      const r = i % 2 === 0 ? radius : radius * 0.36;
      const a = (i / (arms * 2)) * Math.PI * 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) c.moveTo(px, py);
      else c.quadraticCurveTo(0, 0, px, py);
    }
    c.closePath();
    c.fill();

    c.fillStyle = spotCol;
    for (let i = 0; i < arms; i++) {
      const a = (i / arms) * Math.PI * 2;
      for (let d = 0.2; d <= 0.75; d += 0.25) {
        c.beginPath();
        c.arc(Math.cos(a) * radius * d, Math.sin(a) * radius * d, 1.8, 0, Math.PI * 2);
        c.fill();
      }
    }
    c.restore();
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initScene();
  }

  window.addEventListener('resize', resize);
  resize();

  // --- Dynamic Flora & Fauna Renderers ---

  function drawSunRays(time) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const ray of sunRays) {
      const pulse = 0.7 + 0.3 * Math.sin(time * ray.speed + ray.phase);
      const sway = Math.sin(time * 0.35 + ray.phase) * 28;
      const x1 = ray.xTop + sway * 0.25;
      const x2 = x1 + Math.sin(ray.angle) * ray.length + sway;
      const y2 = ray.length;

      const grad = ctx.createLinearGradient(x1, 0, x2, y2);
      const a = (ray.alpha * pulse).toFixed(3);
      grad.addColorStop(0, `hsla(${ray.hue}, 95%, 82%, ${a})`);
      grad.addColorStop(0.45, `hsla(${ray.hue + 6}, 90%, 65%, ${(ray.alpha * pulse * 0.55).toFixed(3)})`);
      grad.addColorStop(1, `hsla(${ray.hue + 12}, 85%, 50%, 0)`);

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x1 - ray.topWidth * 0.5, 0);
      ctx.lineTo(x1 + ray.topWidth * 0.5, 0);
      ctx.lineTo(x2 + ray.bottomWidth * 0.5, y2);
      ctx.lineTo(x2 - ray.bottomWidth * 0.5, y2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawKelpLayer(layerName, time) {
    ctx.save();
    for (const k of kelps) {
      if (k.layer !== layerName) continue;
      const segLen = k.height / k.segments;
      const spineX = [k.x];
      const spineY = [k.y];
      let curX = k.x;
      let curY = k.y;

      for (let i = 1; i <= k.segments; i++) {
        const frac = i / k.segments;
        const sway = Math.sin(time * k.speed - frac * 2.6 + k.phase) * (16 * frac * frac);
        curX += sway * 0.32;
        curY -= segLen;
        spineX.push(curX);
        spineY.push(curY);
      }

      // Draw central stem
      ctx.strokeStyle = `hsl(${k.hue}, 68%, ${k.light}%)`;
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(spineX[0], spineY[0]);
      for (let i = 1; i <= k.segments; i++) {
        ctx.lineTo(spineX[i], spineY[i]);
      }
      ctx.stroke();

      // Draw leafy blades along stem
      for (let i = 2; i < k.segments; i++) {
        const side = i % 2 === 0 ? 1 : -1;
        const frac = i / k.segments;
        const leafLen = k.width * (1.8 - frac * 0.7) * 2.1;
        const leafAng = -Math.PI / 2 + side * (0.65 + Math.sin(time * k.speed + i + k.phase) * 0.18);
        const lx = spineX[i] + Math.cos(leafAng) * leafLen;
        const ly = spineY[i] + Math.sin(leafAng) * leafLen;

        ctx.fillStyle = `hsla(${k.hue + (i % 3) * 4}, 74%, ${k.light + 7}%, 0.88)`;
        ctx.beginPath();
        ctx.moveTo(spineX[i], spineY[i]);
        ctx.quadraticCurveTo(
          (spineX[i] + lx) * 0.5 + side * 6,
          (spineY[i] + ly) * 0.5 - 5,
          lx,
          ly
        );
        ctx.quadraticCurveTo(
          (spineX[i] + lx) * 0.5 - side * 3,
          (spineY[i] + ly) * 0.5 + 4,
          spineX[i],
          spineY[i]
        );
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSeaFans(layerName, time) {
    ctx.save();
    for (const fan of seaFans) {
      if (fan.layer !== layerName) continue;
      const sway = Math.sin(time * 1.15 + fan.phase) * 0.07;
      ctx.save();
      ctx.translate(fan.x, fan.y);
      ctx.rotate(fan.angle + sway);

      // Draw delicate gorgonian fan mesh
      const rays = 9;
      for (let r = 0; r < rays; r++) {
        const frac = (r / (rays - 1)) - 0.5;
        const a = -Math.PI / 2 + frac * 1.35;
        const len = fan.size * (1 - Math.abs(frac) * 0.32);
        const ex = Math.cos(a) * len;
        const ey = Math.sin(a) * len;

        ctx.strokeStyle = fan.color;
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(ex * 0.5 + Math.sin(r) * 8, ey * 0.5, ex, ey);
        ctx.stroke();

        // Cross-fronds
        ctx.strokeStyle = fan.highlight;
        ctx.lineWidth = 1.4;
        for (let d = 0.25; d < 0.95; d += 0.16) {
          const bx = ex * d;
          const by = ey * d;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + Math.cos(a - 0.45) * 18 * (1 - d * 0.3), by + Math.sin(a - 0.45) * 18 * (1 - d * 0.3));
          ctx.moveTo(bx, by);
          ctx.lineTo(bx + Math.cos(a + 0.45) * 18 * (1 - d * 0.3), by + Math.sin(a + 0.45) * 18 * (1 - d * 0.3));
          ctx.stroke();
        }
      }
      ctx.restore();
    }
    ctx.restore();
  }

  function drawAnemones(layerName, time) {
    ctx.save();
    for (const anem of anemones) {
      if (anem.layer !== layerName) continue;

      // Fleshy base column
      const baseGrad = ctx.createLinearGradient(anem.x, anem.y - anem.baseRy, anem.x, anem.y + anem.baseRy);
      baseGrad.addColorStop(0, anem.tentacleColor);
      baseGrad.addColorStop(1, anem.baseColor);

      // Draw swaying tentacles
      for (let i = 0; i < anem.tentacles; i++) {
        const frac = (i / (anem.tentacles - 1)) - 0.5;
        const row = i % 2 === 0 ? -1 : 1;
        const bx = anem.x + frac * anem.baseRx * 1.65;
        const by = anem.y + row * 4 + Math.abs(frac) * 6;

        const baseAngle = -Math.PI / 2 + frac * 1.15;
        const wave1 = Math.sin(time * 2.1 + i * 0.55) * 14;
        const wave2 = Math.cos(time * 1.5 + i * 0.35) * 9;
        const len = anem.length * (0.78 + 0.22 * Math.sin(i * 1.7));

        const cpx = bx + Math.cos(baseAngle) * len * 0.55 + wave1;
        const cpy = by + Math.sin(baseAngle) * len * 0.55;
        const tx = bx + Math.cos(baseAngle) * len + wave1 + wave2;
        const ty = by + Math.sin(baseAngle) * len + Math.abs(wave1) * 0.2;

        ctx.strokeStyle = anem.tentacleColor;
        ctx.lineWidth = 5.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(cpx, cpy, tx, ty);
        ctx.stroke();

        // Glowing bulbous tip
        ctx.fillStyle = anem.tipColor;
        ctx.beginPath();
        ctx.arc(tx, ty, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Base foot overlay
      ctx.fillStyle = baseGrad;
      ctx.beginPath();
      ctx.ellipse(anem.x, anem.y + 8, anem.baseRx, anem.baseRy, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // --- School of Fish Choreography (Boids + Autonomous Choreography & Scatters) ---

  function triggerScatter(originX, originY, strength) {
    schoolState.mode = 'scattering';
    schoolState.timer = 78; // frames of rapid radial burst
    schoolState.scatterOriginX = originX;
    schoolState.scatterOriginY = originY;
    schoolState.scatterStrength = strength;

    for (const f of school) {
      const dx = f.x - originX;
      const dy = f.y - originY;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < 380) {
        const ang = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.45;
        const impulse = strength * (1 - dist / 420) * (7.5 + Math.random() * 3.0);
        f.vx = Math.cos(ang) * impulse;
        f.vy = Math.sin(ang) * impulse;
        f.panicTimer = 55 + Math.floor(Math.random() * 30);
      }
    }
  }

  function updateSchoolChoreography(time) {
    schoolState.timer--;

    // Update prowler fish (natural catalyst for realistic fish scattering)
    if (prowler) {
      if (!prowler.active) {
        prowler.cooldown--;
        if (prowler.cooldown <= 0) {
          prowler.active = true;
          const fromLeft = Math.random() > 0.5;
          prowler.x = fromLeft ? -160 : width + 160;
          prowler.y = Math.max(160, Math.min(height * 0.58, schoolState.leaderY + (Math.random() - 0.5) * 90));
          prowler.vx = (fromLeft ? 1 : -1) * (5.2 + Math.random() * 1.2);
          prowler.vy = (schoolState.leaderY - prowler.y) * 0.008;
        }
      } else {
        prowler.x += prowler.vx;
        prowler.y += prowler.vy + Math.sin(time * 2.5) * 0.35;
        prowler.tailPhase += 0.26;

        // Check proximity to school centroid to trigger dramatic flash-expansion scatter
        const dToSchool = Math.hypot(prowler.x - schoolState.leaderX, prowler.y - schoolState.leaderY);
        if (dToSchool < 150 && schoolState.mode !== 'scattering') {
          triggerScatter(prowler.x, prowler.y, 1.15);
        }

        if (prowler.x < -240 || prowler.x > width + 240) {
          prowler.active = false;
          prowler.cooldown = 360 + Math.floor(Math.random() * 180);
        }
      }
    }

    // State transitions for school leader
    if (schoolState.timer <= 0) {
      if (schoolState.mode === 'scattering') {
        schoolState.mode = 'regrouping';
        schoolState.timer = 130;
        schoolState.targetX = width * (0.28 + Math.random() * 0.44);
        schoolState.targetY = height * (0.24 + Math.random() * 0.34);
      } else {
        const roll = Math.random();
        if (roll < 0.42) {
          // Sweeping turn across the reef
          schoolState.mode = 'turning';
          schoolState.timer = 150 + Math.floor(Math.random() * 90);
          const nextSideX = schoolState.leaderX < width * 0.5
            ? width * (0.62 + Math.random() * 0.22)
            : width * (0.16 + Math.random() * 0.22);
          schoolState.targetX = nextSideX;
          schoolState.targetY = height * (0.20 + Math.random() * 0.42);
        } else if (roll < 0.78) {
          // Graceful figure-8 / bait-ball swirl
          schoolState.mode = 'swirling';
          schoolState.timer = 190 + Math.floor(Math.random() * 80);
          schoolState.swirlCenter.x = Math.max(width * 0.28, Math.min(width * 0.72, schoolState.leaderX));
          schoolState.swirlCenter.y = Math.max(height * 0.26, Math.min(height * 0.56, schoolState.leaderY));
          schoolState.swirlDir = Math.random() > 0.5 ? 1 : -1;
        } else {
          // Spontaneous startle scatter (like a sudden reef current or shadow overhead)
          triggerScatter(
            schoolState.leaderX + (Math.random() - 0.5) * 40,
            schoolState.leaderY + (Math.random() - 0.5) * 40,
            1.0
          );
        }
      }
    }

    // Move invisible school leader smoothly
    if (schoolState.mode === 'swirling') {
      const ang = time * 1.35 * schoolState.swirlDir;
      schoolState.targetX = schoolState.swirlCenter.x + Math.cos(ang) * (width * 0.22);
      schoolState.targetY = schoolState.swirlCenter.y + Math.sin(ang * 2) * (height * 0.11);
    }

    const dxL = schoolState.targetX - schoolState.leaderX;
    const dyL = schoolState.targetY - schoolState.leaderY;
    const distL = Math.hypot(dxL, dyL) || 1;
    const desiredSpeed = schoolState.mode === 'regrouping' ? 3.5 : 2.9;
    schoolState.leaderVx += ((dxL / distL) * desiredSpeed - schoolState.leaderVx) * 0.045;
    schoolState.leaderVy += ((dyL / distL) * desiredSpeed - schoolState.leaderVy) * 0.045;
    schoolState.leaderX += schoolState.leaderVx;
    schoolState.leaderY += schoolState.leaderVy;

    // Keep leader in upper/mid open water above the reef
    const marginX = width * 0.14;
    const minY = height * 0.14;
    const maxY = height * 0.66;
    if (schoolState.leaderX < marginX) schoolState.targetX = width * 0.72;
    if (schoolState.leaderX > width - marginX) schoolState.targetX = width * 0.28;
    if (schoolState.leaderY < minY) schoolState.targetY = height * 0.42;
    if (schoolState.leaderY > maxY) schoolState.targetY = height * 0.30;

    // --- Boids Update for All Schooling Fish ---
    const n = school.length;
    const perception = 82;
    const separationDist = 28;

    for (let i = 0; i < n; i++) {
      const f = school[i];
      f.ax = 0;
      f.ay = 0;

      if (f.panicTimer > 0) f.panicTimer--;

      let alignX = 0, alignY = 0;
      let cohX = 0, cohY = 0;
      let sepX = 0, sepY = 0;
      let neighbors = 0;

      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const other = school[j];
        const dx = other.x - f.x;
        const dy = other.y - f.y;
        const dSq = dx * dx + dy * dy;

        if (dSq < perception * perception && dSq > 0.0001) {
          const d = Math.sqrt(dSq);
          alignX += other.vx;
          alignY += other.vy;
          cohX += other.x;
          cohY += other.y;
          neighbors++;

          if (d < separationDist) {
            const push = (separationDist - d) / separationDist;
            sepX -= (dx / d) * push;
            sepY -= (dy / d) * push;
          }
        }
      }

      const isScattering = f.panicTimer > 0 || schoolState.mode === 'scattering';

      if (neighbors > 0) {
        // Alignment
        alignX /= neighbors;
        alignY /= neighbors;
        const alignMag = Math.hypot(alignX, alignY) || 1;
        alignX = (alignX / alignMag) * f.maxSpeed - f.vx;
        alignY = (alignY / alignMag) * f.maxSpeed - f.vy;

        // Cohesion
        cohX = cohX / neighbors - f.x;
        cohY = cohY / neighbors - f.y;
        const cohMag = Math.hypot(cohX, cohY) || 1;
        cohX = (cohX / cohMag) * f.maxSpeed - f.vx;
        cohY = (cohY / cohMag) * f.maxSpeed - f.vy;

        const alignWeight = isScattering ? 0.25 : 1.15;
        const cohWeight = isScattering ? -0.35 : (schoolState.mode === 'regrouping' ? 1.35 : 0.95);
        const sepWeight = isScattering ? 2.4 : 1.55;

        f.ax += (alignX * alignWeight + cohX * cohWeight) * 0.035 + sepX * sepWeight * 0.09;
        f.ay += (alignY * alignWeight + cohY * cohWeight) * 0.035 + sepY * sepWeight * 0.09;
      }

      // Attraction to moving school target / ribbon formation
      if (!isScattering) {
        const goalX = schoolState.leaderX + f.offsetBiasX;
        const goalY = schoolState.leaderY + f.offsetBiasY;
        const gx = goalX - f.x;
        const gy = goalY - f.y;
        const gDist = Math.hypot(gx, gy) || 1;
        const pull = schoolState.mode === 'regrouping' ? 0.085 : 0.052;
        f.ax += (gx / gDist) * pull * Math.min(gDist / 60, 2.2);
        f.ay += (gy / gDist) * pull * Math.min(gDist / 60, 2.2);
      }

      // Evade Prowler if nearby
      if (prowler && prowler.active) {
        const pdx = f.x - prowler.x;
        const pdy = f.y - prowler.y;
        const pDist = Math.hypot(pdx, pdy) || 1;
        if (pDist < 220) {
          const evade = ((220 - pDist) / 220) * 0.85;
          f.ax += (pdx / pDist) * evade;
          f.ay += (pdy / pDist) * evade;
          f.panicTimer = Math.max(f.panicTimer, 28);
        }
      }

      // Evade Pointer if user moves mouse over the tank
      if (pointer.active) {
        const mdx = f.x - pointer.x;
        const mdy = f.y - pointer.y;
        const mDist = Math.hypot(mdx, mdy) || 1;
        if (mDist < 180) {
          const evade = ((180 - mDist) / 180) * 0.95;
          f.ax += (mdx / mDist) * evade;
          f.ay += (mdy / mDist) * evade;
          f.panicTimer = Math.max(f.panicTimer, 24);
        }
      }

      // Soft aquarium & coral boundary avoidance
      const padX = width * 0.07;
      const topPad = height * 0.08;
      const bottomPad = height * 0.74;
      if (f.x < padX) f.ax += (padX - f.x) * 0.015;
      if (f.x > width - padX) f.ax -= (f.x - (width - padX)) * 0.015;
      if (f.y < topPad) f.ay += (topPad - f.y) * 0.018;
      if (f.y > bottomPad) f.ay -= (f.y - bottomPad) * 0.022;

      // Apply acceleration and speed limits
      f.vx += f.ax;
      f.vy += f.ay;

      const currentMax = f.panicTimer > 0 ? f.panicSpeed : f.maxSpeed;
      const speed = Math.hypot(f.vx, f.vy) || 1;
      if (speed > currentMax) {
        f.vx = (f.vx / speed) * currentMax;
        f.vy = (f.vy / speed) * currentMax;
      } else if (speed < 1.35) {
        f.vx = (f.vx / speed) * 1.35;
        f.vy = (f.vy / speed) * 1.35;
      }

      // Drag decay after scatter burst
      if (f.panicTimer > 0 && speed > f.maxSpeed) {
        f.vx *= 0.965;
        f.vy *= 0.965;
      }

      f.x += f.vx;
      f.y += f.vy;
      f.tailPhase += f.tailSpeed * (0.65 + speed * 0.22);
    }
  }

  function drawSchool(time) {
    ctx.save();
    for (let i = 0; i < school.length; i++) {
      const f = school[i];
      const s = f.size * f.depthScale;
      const angle = Math.atan2(f.vy, f.vx);
      const facingLeft = Math.abs(angle) > Math.PI * 0.5;
      const wag = Math.sin(f.tailPhase) * 0.34;
      const turnBank = Math.min(1, Math.hypot(f.ax, f.ay) * 4.5);

      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(angle);
      if (facingLeft) ctx.scale(1, -1);

      // Subtle iridescent flash when banking or scattering
      const flashLight = 54 + turnBank * 24;

      // Forked Swimmer Tail
      ctx.fillStyle = `hsl(${f.secondaryHue}, 95%, 62%)`;
      ctx.beginPath();
      ctx.moveTo(-s * 0.65, 0);
      ctx.lineTo(-s * 1.48, -s * 0.48 + wag * s * 0.55);
      ctx.lineTo(-s * 1.12, wag * s * 0.28);
      ctx.lineTo(-s * 1.48, s * 0.48 + wag * s * 0.55);
      ctx.closePath();
      ctx.fill();

      // Dorsal & Ventral fins
      ctx.fillStyle = `hsla(${f.secondaryHue}, 90%, 60%, 0.85)`;
      ctx.beginPath();
      ctx.moveTo(s * 0.1, -s * 0.32);
      ctx.quadraticCurveTo(-s * 0.35, -s * 0.72, -s * 0.65, -s * 0.18);
      ctx.closePath();
      ctx.fill();

      // Streamlined Fusiform Body
      const bodyGrad = ctx.createLinearGradient(s * 0.9, -s * 0.3, -s * 0.8, s * 0.3);
      bodyGrad.addColorStop(0, `hsl(${f.primaryHue}, 92%, ${flashLight}%)`);
      bodyGrad.addColorStop(0.65, `hsl(${f.primaryHue + 10}, 88%, ${flashLight - 8}%)`);
      bodyGrad.addColorStop(1, `hsl(${f.secondaryHue}, 95%, 58%)`);

      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(s * 0.95, 0);
      ctx.bezierCurveTo(s * 0.45, -s * 0.52, -s * 0.35, -s * 0.44, -s * 0.82, 0);
      ctx.bezierCurveTo(-s * 0.35, s * 0.44, s * 0.45, s * 0.52, s * 0.95, 0);
      ctx.closePath();
      ctx.fill();

      // Specular lateral line shimmer
      ctx.strokeStyle = `hsla(${f.primaryHue - 12}, 100%, 88%, ${0.42 + turnBank * 0.45})`;
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(s * 0.55, -s * 0.08);
      ctx.quadraticCurveTo(0, -s * 0.16, -s * 0.52, -s * 0.03);
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s * 0.52, -s * 0.08, s * 0.13, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#04101e';
      ctx.beginPath();
      ctx.arc(s * 0.55, -s * 0.08, s * 0.07, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }
    ctx.restore();
  }

  function updateAndDrawReefFish(time) {
    ctx.save();
    // Draw Prowler (Bluefin Trevally gliding in mid-background) if active
    if (prowler && prowler.active) {
      const p = prowler;
      const ang = Math.atan2(p.vy, p.vx);
      const left = Math.abs(ang) > Math.PI * 0.5;
      const wag = Math.sin(p.tailPhase) * 8;
      const s = p.size;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);
      if (left) ctx.scale(1, -1);

      // Crescent tail
      ctx.fillStyle = '#0e4c75';
      ctx.beginPath();
      ctx.moveTo(-s * 0.72, 0);
      ctx.lineTo(-s * 1.32, -s * 0.55 + wag * 0.5);
      ctx.quadraticCurveTo(-s * 1.0, wag * 0.2, -s * 1.32, s * 0.55 + wag * 0.5);
      ctx.closePath();
      ctx.fill();

      // Dorsal & Pectoral fins
      ctx.fillStyle = '#146194';
      ctx.beginPath();
      ctx.moveTo(s * 0.05, -s * 0.34);
      ctx.lineTo(-s * 0.45, -s * 0.68);
      ctx.lineTo(-s * 0.55, -s * 0.22);
      ctx.closePath();
      ctx.fill();

      // Sleek silvery-blue body
      const grad = ctx.createLinearGradient(0, -s * 0.4, 0, s * 0.4);
      grad.addColorStop(0, '#0a3b5c');
      grad.addColorStop(0.5, '#2b8cbe');
      grad.addColorStop(1, '#a6bddb');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(s * 0.92, 0);
      ctx.bezierCurveTo(s * 0.4, -s * 0.45, -s * 0.35, -s * 0.4, -s * 0.8, 0);
      ctx.bezierCurveTo(-s * 0.35, s * 0.4, s * 0.4, s * 0.45, s * 0.92, 0);
      ctx.closePath();
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(s * 0.58, -s * 0.08, s * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#020b18';
      ctx.beginPath();
      ctx.arc(s * 0.60, -s * 0.08, s * 0.045, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // Resident Coral Reef Fish (Clownfish, Angelfish, Yellow Tang)
    for (const rf of reefFish) {
      rf.phase += 0.045;
      const targetX = rf.homeX + Math.sin(time * 0.65 + rf.phase) * (rf.type === 'c2' ? 38 : 95);
      const targetY = rf.homeY + Math.cos(time * 0.9 + rf.phase) * (rf.type === 'c2' ? 18 : 28);

      rf.vx += (targetX - rf.x) * 0.003;
      rf.vy += (targetY - rf.y) * 0.003;
      rf.vx *= 0.96;
      rf.vy *= 0.96;
      rf.x += rf.vx;
      rf.y += rf.vy;

      const ang = Math.atan2(rf.vy, rf.vx * (Math.abs(rf.vx) < 0.15 ? 1 : 1));
      const facingLeft = rf.vx < 0;
      const s = rf.size;
      const wag = Math.sin(time * 8 + rf.phase * 4) * 0.25;

      ctx.save();
      ctx.translate(rf.x, rf.y);
      if (facingLeft) ctx.scale(-1, 1);
      ctx.rotate(rf.vy * 0.15);

      if (rf.type === 'c2') {
        // Clownfish (Orange with white bands & black trim)
        ctx.fillStyle = '#ff6d00';
        ctx.beginPath();
        ctx.moveTo(-s * 0.6, 0);
        ctx.lineTo(-s * 1.15, -s * 0.38 + wag * s);
        ctx.quadraticCurveTo(-s * 1.25, wag * s, -s * 1.15, s * 0.38 + wag * s);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.78, s * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();

        // White stripes
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = s * 0.22;
        ctx.beginPath();
        ctx.moveTo(s * 0.22, -s * 0.38);
        ctx.quadraticCurveTo(s * 0.12, 0, s * 0.22, s * 0.38);
        ctx.moveTo(-s * 0.22, -s * 0.36);
        ctx.quadraticCurveTo(-s * 0.32, 0, -s * 0.22, s * 0.36);
        ctx.stroke();

        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(s * 0.48, -s * 0.1, s * 0.09, 0, Math.PI * 2);
        ctx.fill();
      } else if (rf.type === 'tang') {
        // Brilliant Yellow Tang
        ctx.fillStyle = '#ffea00';
        ctx.beginPath();
        ctx.moveTo(-s * 0.55, 0);
        ctx.lineTo(-s * 1.0, -s * 0.35 + wag * s);
        ctx.lineTo(-s * 1.0, s * 0.35 + wag * s);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(s * 0.85, 0.05 * s);
        ctx.quadraticCurveTo(s * 0.1, -s * 0.85, -s * 0.65, 0);
        ctx.quadraticCurveTo(s * 0.1, s * 0.85, s * 0.85, 0.05 * s);
        ctx.fill();

        ctx.fillStyle = '#0c1821';
        ctx.beginPath();
        ctx.arc(s * 0.45, -s * 0.12, s * 0.08, 0, Math.PI * 2);
        ctx.fill();
      } else if (rf.type === 'angelfish') {
        // Regal Angelfish with trailing dorsal streamer
        ctx.fillStyle = '#ffbe0b';
        ctx.beginPath();
        ctx.moveTo(-s * 0.6, 0);
        ctx.lineTo(-s * 1.05, -s * 0.32 + wag * s);
        ctx.lineTo(-s * 1.05, s * 0.32 + wag * s);
        ctx.closePath();
        ctx.fill();

        // Trailing dorsal filament
        ctx.strokeStyle = '#00f5d4';
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-s * 0.1, -s * 0.55);
        ctx.quadraticCurveTo(-s * 0.7, -s * 0.9, -s * 1.35, -s * 0.65 + wag * s * 1.5);
        ctx.stroke();

        // Striped body
        const aGrad = ctx.createLinearGradient(-s * 0.6, -s * 0.6, s * 0.6, s * 0.6);
        aGrad.addColorStop(0, '#3a86ff');
        aGrad.addColorStop(0.5, '#ffbe0b');
        aGrad.addColorStop(1, '#8338ec');
        ctx.fillStyle = aGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.75, s * 0.58, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000814';
        ctx.beginPath();
        ctx.arc(s * 0.46, -s * 0.12, s * 0.08, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
    ctx.restore();
  }

  function updateAndDrawParticles(time) {
    // Emit new bubbles occasionally
    for (const em of bubbleEmitters) {
      if (Math.random() < em.rate) {
        bubbles.push({
          x: em.x + (Math.random() - 0.5) * 18,
          y: em.y,
          r: 1.5 + Math.random() * 4.5,
          vy: 0.9 + Math.random() * 1.8,
          wobbleFreq: 2.0 + Math.random() * 2.0,
          wobbleAmp: 0.5 + Math.random() * 1.1,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    // Update & Draw Bubbles
    ctx.save();
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y -= b.vy;
      b.x += Math.sin(time * b.wobbleFreq + b.phase) * b.wobbleAmp;

      if (b.y < -20) {
        bubbles.splice(i, 1);
        continue;
      }

      ctx.strokeStyle = 'rgba(190, 248, 255, 0.48)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.28, 0, Math.PI * 2);
      ctx.fill();
    }

    // Update & Draw Marine Snow / Drifting Plankton
    for (const p of marineSnow) {
      p.x += p.vx + Math.sin(time * 0.8 + p.phase) * 0.18;
      p.y += p.vy + Math.cos(time * 0.6 + p.phase) * 0.12;

      if (p.x < 0) p.x = width;
      if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height;
      if (p.y > height) p.y = 0;

      const twinkle = 0.6 + 0.4 * Math.sin(time * 2.4 + p.phase);
      ctx.fillStyle = `hsla(${p.hue}, 90%, 82%, ${(p.alpha * twinkle).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCausticsAndSurface(time) {
    // Shimmering water surface ripples at the very top
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 3; i++) {
      const yBase = 14 + i * 12;
      ctx.strokeStyle = `rgba(165, 250, 255, ${0.22 - i * 0.05})`;
      ctx.lineWidth = 3 - i * 0.6;
      ctx.beginPath();
      for (let x = 0; x <= width; x += 24) {
        const y = yBase + Math.sin(x * 0.018 + time * (1.8 + i * 0.4) + i) * 6;
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // Subtle dancing caustic highlights along the sandy seafloor
    for (let i = 0; i < 16; i++) {
      const cx = (width * ((i + 0.5) / 16)) + Math.sin(time * 1.4 + i) * 28;
      const cy = height * 0.88 + Math.cos(time * 1.1 + i * 1.7) * 35;
      const rx = 36 + Math.sin(time * 2.1 + i) * 14;
      const ry = 8 + Math.cos(time * 1.9 + i) * 3;

      const cGrad = ctx.createRadialGradient(cx, cy, 1, cx, cy, rx);
      cGrad.addColorStop(0, 'rgba(130, 245, 255, 0.11)');
      cGrad.addColorStop(1, 'rgba(130, 245, 255, 0)');
      ctx.fillStyle = cGrad;
      ctx.beginPath();
      ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Subtle aquarium edge vignette for lush depth
    const vig = ctx.createRadialGradient(
      width * 0.5,
      height * 0.48,
      Math.min(width, height) * 0.36,
      width * 0.5,
      height * 0.5,
      Math.max(width, height) * 0.74
    );
    vig.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vig.addColorStop(1, 'rgba(1, 8, 20, 0.42)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, width, height);
  }

  // Main 60fps Animation Loop
  let startTime = performance.now();
  function animate(now) {
    const time = (now - startTime) * 0.001;

    // 1. Static deep ocean & midground coral reef layer
    ctx.drawImage(bgCanvas, 0, 0, width, height);

    // 2. Background swaying kelp & volumetric god rays
    drawKelpLayer('back', time);
    drawSunRays(time);

    // 3. Midground swaying sea fans, kelp & anemones
    drawSeaFans('mid', time);
    drawKelpLayer('mid', time);
    drawAnemones('mid', time);

    // 4. Reef dwellers & cohesive schooling fish (turns, swirls, and scatters)
    updateSchoolChoreography(time);
    updateAndDrawReefFish(time);
    drawSchool(time);

    // 5. Foreground framing coral ledges, swaying anemones, kelp & bubbles
    ctx.drawImage(fgRockCanvas, 0, 0, width, height);
    drawSeaFans('front', time);
    drawAnemones('front', time);
    drawKelpLayer('front', time);

    // 6. Bubbles, marine snow & caustic light shimmer
    updateAndDrawParticles(time);
    drawCausticsAndSurface(time);

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
