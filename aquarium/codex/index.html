<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#023d66">
<title>Coral Reef</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#023d66}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas aria-label="An animated underwater coral reef with a school of colorful fish"></canvas>
<script>
'use strict';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const reef=document.createElement('canvas'),rc=reef.getContext('2d');
let W=1080,H=1080,S=1,dpr=1,last=0,time=0;
const TAU=Math.PI*2;
let seed=72318;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const mix=(a,b,t)=>a+(b-a)*t;
function ellipse(c,x,y,rx,ry,color,angle=0){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,angle,0,TAU);c.fill()}
function path(c,points,color,width){c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke()}
function branch(x,y,length,angle,width,depth,palette){
 const ex=x+Math.cos(angle)*length,ey=y+Math.sin(angle)*length;
 path(rc,[[x,y],[x+(ex-x)*.42+6,y+(ey-y)*.5],[ex,ey]],palette[0],width);
 path(rc,[[x-width*.18,y],[ex-width*.18,ey]],palette[1],Math.max(1,width*.23));
 if(depth>0){branch(ex,ey,length*(.64+rand()*.14),angle-.39-rand()*.29,width*.67,depth-1,palette);branch(ex,ey,length*(.65+rand()*.14),angle+.35+rand()*.3,width*.67,depth-1,palette)}
 else ellipse(rc,ex,ey,width*.67,width*.8,palette[2]);
}
function fan(x,y,size,color){
 rc.save();rc.translate(x,y);rc.strokeStyle=color;rc.lineCap='round';
 for(let i=0;i<19;i++){
  const a=-Math.PI+.17+i/18*(Math.PI-.34),len=size*(.72+.28*Math.sin(i/18*Math.PI));
  const ex=Math.cos(a)*len,ey=Math.sin(a)*len;
  path(rc,[[0,0],[ex*.22,ey*.5],[ex*.6,ey*.83],[ex,ey]],color,2.2);
 }
 for(let j=1;j<=7;j++){rc.beginPath();for(let i=0;i<=35;i++){let a=-Math.PI+.17+i/35*(Math.PI-.34),r=size*(.72+.28*Math.sin(i/35*Math.PI))*j/7;let x=Math.cos(a)*r,y=Math.sin(a)*r;i?rc.lineTo(x,y):rc.moveTo(x,y)}rc.globalAlpha=.65;rc.lineWidth=1.3;rc.stroke()}
 rc.restore();
}
function rock(x,y,rx,ry,c){
 const g=rc.createLinearGradient(x,y-ry,x,y+ry);g.addColorStop(0,c);g.addColorStop(1,'#062e4c');
 rc.fillStyle=g;rc.beginPath();rc.moveTo(x-rx,y+ry*.25);rc.bezierCurveTo(x-rx*1.15,y-ry*.5,x-rx*.4,y-ry*1.15,x+rx*.12,y-ry);rc.bezierCurveTo(x+rx*.8,y-ry*1.05,x+rx*1.1,y-ry*.2,x+rx,y+ry*.4);rc.closePath();rc.fill();
 for(let i=0;i<20;i++){const a=rand()*TAU,r=rand();ellipse(rc,x+Math.cos(a)*rx*r*.85,y+Math.sin(a)*ry*r*.65,2+rand()*4,1+rand()*2,'#31a59c35')}
}
function tube(x,y,h,r,color,inside){
 const bend=(rand()-.5)*h*.3,top=x+bend;
 const g=rc.createLinearGradient(x-r,0,x+r,0);g.addColorStop(0,color[0]);g.addColorStop(.45,color[1]);g.addColorStop(1,color[0]);rc.fillStyle=g;
 rc.beginPath();rc.moveTo(x-r,y);rc.bezierCurveTo(x-r,y-h*.45,top-r,y-h*.8,top-r,y-h);rc.lineTo(top+r,y-h);rc.bezierCurveTo(top+r,y-h*.65,x+r,y-h*.4,x+r,y);rc.closePath();rc.fill();
 ellipse(rc,top,y-h,r,r*.39,color[2]);ellipse(rc,top,y-h,r*.66,r*.24,inside);
 path(rc,[[x-r*.45,y-12],[top-r*.45,y-h+10]],color[2]+'66',2);
}
function brain(x,y,r){
 const g=rc.createRadialGradient(x-r*.3,y-r*.6,2,x,y,r);g.addColorStop(0,'#d6ff62');g.addColorStop(.6,'#79c938');g.addColorStop(1,'#24884b');ellipse(rc,x,y,r,r*.71,g);
 rc.save();rc.beginPath();rc.ellipse(x,y,r*.94,r*.66,0,0,TAU);rc.clip();
 for(let j=-5;j<6;j++){rc.beginPath();for(let i=-20;i<=20;i++){const xx=x+i*r/17, yy=y+j*r*.14+Math.sin(i*.8+j)*r*.075;i===-20?rc.moveTo(xx,yy):rc.lineTo(xx,yy)}rc.strokeStyle='#317b46';rc.lineWidth=5;rc.stroke();rc.strokeStyle='#d1f85a';rc.lineWidth=2;rc.stroke()}rc.restore();
}
function buildReef(){
 reef.width=Math.ceil(W*dpr*S);reef.height=Math.ceil(H*dpr*S);rc.setTransform(dpr*S,0,0,dpr*S,0,0);rc.clearRect(0,0,W,H);seed=72318;
 const floor=H*.87;
 // Distant reef silhouettes and sand terraces.
 for(let i=0;i<30;i++){let x=i*W/29;ellipse(rc,x,H*.86+rand()*70,55+rand()*90,40+rand()*100,'#056678')}
 const sand=rc.createLinearGradient(0,floor-20,0,H);sand.addColorStop(0,'#248d95');sand.addColorStop(.3,'#65bdaf');sand.addColorStop(1,'#c8e4b8');
 rc.fillStyle=sand;rc.beginPath();rc.moveTo(0,H*.91);rc.bezierCurveTo(W*.28,H*.8,W*.55,H*.97,W,H*.85);rc.lineTo(W,H);rc.lineTo(0,H);rc.fill();
 for(let i=0;i<550;i++){let x=rand()*W,y=floor+rand()*(H-floor);ellipse(rc,x,y,rand()*2+.3,rand()*.7+.3,rand()<.5?'#e0efc54d':'#166f7938')}
 fan(W*.16,H*.88,205,'#9860d4');fan(W*.89,H*.89,240,'#e75a9d');fan(W*.69,H*.94,130,'#ff8668');
 for(let i=0;i<13;i++)rock(rand()*W,H*.91+rand()*H*.06,45+rand()*80,30+rand()*45,'#146e7a');
 // Branching staghorn colonies frame the open swimming water.
 branch(W*.08,H*.96,122,-1.45,23,4,['#c02c88','#ff77bc','#ffb6d8']);
 branch(W*.23,H*.99,91,-1.72,18,4,['#e34858','#ff9770','#ffd38e']);
 branch(W*.94,H*.97,130,-1.69,24,4,['#7544c6','#b98aff','#e4b2ff']);
 branch(W*.78,H*1.02,87,-1.52,18,4,['#db378f','#ff7ebc','#ffb4d8']);
 for(let i=0;i<9;i++)tube(W*.09+(rand()-.5)*125,H*.98+rand()*30,65+rand()*125,12+rand()*10,['#7132b4','#b553e6','#e69bff'],'#351d72');
 brain(W*.32,H*.98,76);brain(W*.86,H*.99,61);
 for(let i=0;i<10;i++)tube(W*.88+(rand()-.5)*110,H*1.02,60+rand()*100,10+rand()*12,['#d4511e','#ff9d35','#ffe181'],'#864226');
 // Small blue plate corals, layered like shallow porcelain bowls.
 for(let i=0;i<16;i++){let x=W*.54+(rand()-.5)*155,y=H*.99+rand()*45-rand()*50,r=22+rand()*32;ellipse(rc,x,y+5,r,r*.25,'#00697f');ellipse(rc,x,y,r,r*.22,'#29d7d4');path(rc,[[x-r*.8,y-1],[x,y+3],[x+r*.8,y-1]],'#95fff0',1.5)}
 // Foreground anemones.
 for(let k=0;k<3;k++){let x=[W*.03,W*.43,W*.98][k],y=H+18;for(let i=0;i<32;i++){let dx=(rand()-.5)*110,h=25+rand()*75;path(rc,[[x+dx,y],[x+dx*.95+Math.sin(i)*12,y-h*.5],[x+dx*.8,y-h]],k===1?'#0db894':'#e5539c',4+rand()*3);ellipse(rc,x+dx*.8,y-h,3,4,k===1?'#a2f58e':'#ffc2e2')}}
}
const fish=Array.from({length:54},(_,i)=>({x:420+Math.random()*280,y:330+Math.random()*230,vx:70+Math.random()*50,vy:(Math.random()-.5)*45,size:12+Math.random()*10,phase:Math.random()*TAU,kind:i%9===0?1:0,depth:Math.random(),angle:0}));

const dust=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,speed:4+Math.random()*12,p:Math.random()*TAU}));
const bubbles=Array.from({length:19},()=>({x:Math.random(),y:Math.random(),r:2+Math.random()*5,speed:20+Math.random()*30}));
let burst=-1;
function resize(){
 const oldW=W,oldH=H;S=Math.min(innerWidth,innerHeight)/1080;W=innerWidth/S;H=innerHeight/S;dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(innerWidth*dpr);canvas.height=Math.round(innerHeight*dpr);
 for(const f of fish){f.x=f.x/oldW*W;f.y=f.y/oldH*H}
 buildReef();
}
function drawFish(f,t){
 const c=ctx;let a=f.angle,flip=Math.cos(a)<0;
 c.save();c.translate(f.x,f.y);c.rotate(a+(flip?Math.PI:0));c.scale(flip?-1:1,1);
 const z=f.size,beat=Math.sin(t*10+f.phase),tail=beat*.2;
 c.globalAlpha=.78+f.depth*.22;
 // Slim tails, luminous dorsal fins, and golden bodies.
 c.fillStyle=f.kind?'#06dce1':'#ffad23';c.beginPath();c.moveTo(-z*.72,0);c.lineTo(-z*1.6,(-.56+tail)*z);c.quadraticCurveTo(-z*1.4,0,-z*1.6,(.56+tail)*z);c.closePath();c.fill();
 c.fillStyle=f.kind?'#3cf9e5':'#ffd653';c.beginPath();c.moveTo(-z*.5,-z*.25);c.lineTo(-z*.25,-z*.78);c.lineTo(z*.36,-z*.38);c.closePath();c.fill();
 const g=c.createLinearGradient(0,-z*.5,0,z*.5);g.addColorStop(0,f.kind?'#67fff0':'#fff295');g.addColorStop(.4,f.kind?'#12c8d9':'#ffc52a');g.addColorStop(1,f.kind?'#067eae':'#f47d12');
 ellipse(c,0,0,z,z*.46,g);c.fillStyle=f.kind?'#02729d':'#e26a19';
 c.beginPath();c.moveTo(-z*.2,z*.08);c.quadraticCurveTo(-z*.25,z*.75,z*.18,z*.25);c.closePath();c.fill();
 path(c,[[z*.2,-z*.28],[z*.1,0],[z*.22,z*.28]],f.kind?'#0086ab88':'#db741b77',1.1);
 ellipse(c,z*.59,-z*.08,z*.155,z*.155,'#fff6cc');ellipse(c,z*.63,-z*.08,z*.092,z*.105,'#092c43');ellipse(c,z*.66,-z*.115,z*.025,z*.03,'white');
 path(c,[[-z*.6,-z*.12],[-z*.17,-z*.28],[z*.32,-z*.21]],f.kind?'#baffef99':'#fff9bb99',1.2);
 c.restore();
}
function updateFish(dt,t){
 const cycle=t%24,scatter=cycle>12&&cycle<15.2,regroup=cycle>=15.2&&cycle<19;
 if(scatter&&burst!==Math.floor(t/24)){burst=Math.floor(t/24);let cx=0,cy=0;fish.forEach(f=>{cx+=f.x;cy+=f.y});cx/=fish.length;cy/=fish.length;for(const f of fish){let a=Math.atan2(f.y-cy,f.x-cx)+Math.sin(f.phase)*.55;f.vx+=Math.cos(a)*185;f.vy+=Math.sin(a)*185}}
 const targetX=W*(.5+.255*Math.sin(t*.25)),targetY=H*(.43+.115*Math.sin(t*.37+.5));
 const next=fish.map(f=>{
  let ax=0,ay=0,cx=0,cy=0,vx=0,vy=0,n=0;
  for(const o of fish){if(o===f)continue;let dx=f.x-o.x,dy=f.y-o.y,d2=dx*dx+dy*dy;if(d2<145*145){cx+=o.x;cy+=o.y;vx+=o.vx;vy+=o.vy;n++;if(d2<45*45&&d2>0){ax+=dx/d2*850;ay+=dy/d2*850}}}
  if(n){ax+=(cx/n-f.x)*(scatter?.035:.38)+(vx/n-f.vx)*(scatter?.13:.8);ay+=(cy/n-f.y)*(scatter?.035:.38)+(vy/n-f.vy)*(scatter?.13:.8)}
  const pull=scatter?.045:regroup?.6:.34;
  ax+=(targetX-f.x)*pull;ay+=(targetY-f.y)*pull;
  ax+=Math.cos(t*.8+f.phase)*8;ay+=Math.sin(t+f.phase)*8;
  const margin=65,bottom=H*.76;
  if(f.x<margin)ax+=(margin-f.x)*2.5;if(f.x>W-margin)ax-=(f.x-W+margin)*2.5;
  if(f.y<100)ay+=(100-f.y)*2.5;if(f.y>bottom)ay-=(f.y-bottom)*2.5;
  let fx=f.vx+ax*dt,fy=f.vy+ay*dt,speed=Math.hypot(fx,fy),max=scatter?240:regroup?170:125,min=scatter?90:52;
  if(speed>max){fx*=max/speed;fy*=max/speed}else if(speed<min){fx*=min/(speed||1);fy*=min/(speed||1)}
  return [fx,fy];
 });
 fish.forEach((f,i)=>{[f.vx,f.vy]=next[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.x=Math.max(20,Math.min(W-20,f.x));f.y=Math.max(35,Math.min(H*.84,f.y));let a=Math.atan2(f.vy,f.vx),diff=Math.atan2(Math.sin(a-f.angle),Math.cos(a-f.angle));f.angle+=diff*Math.min(1,dt*7)});
}
function water(t){
 const g=ctx.createLinearGradient(0,0,W*.25,H);g.addColorStop(0,'#078ec2');g.addColorStop(.25,'#087eac');g.addColorStop(.64,'#035071');g.addColorStop(1,'#063d59');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Broad light shafts drift from the sunlit surface.
 ctx.save();ctx.globalCompositeOperation='screen';
 for(let i=0;i<7;i++){let x=W*(i/6-.12)+Math.sin(t*.13+i)*25;const g=ctx.createLinearGradient(x,0,x+W*.25,H*.88);g.addColorStop(0,'#6ee8ed25');g.addColorStop(1,'#60dad900');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+35+i*7,0);ctx.lineTo(x+W*.37,H*.9);ctx.lineTo(x+W*.13,H*.9);ctx.fill()}
 const glow=ctx.createRadialGradient(W*.46,-H*.08,0,W*.46,-H*.08,H*.63);glow.addColorStop(0,'#79ffe643');glow.addColorStop(1,'#59f8ec00');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
 // Fine ripples above, keeping the surface quiet and bright.
 for(let j=0;j<10;j++){ctx.beginPath();for(let i=0;i<=40;i++){let x=i*W/40,y=12+j*8+Math.sin(i*.48+t*.6+j)*3;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.strokeStyle=`rgba(133,255,238,${.08-j*.006})`;ctx.lineWidth=2;ctx.stroke()}
 ctx.restore();
}
function frame(now){
 const dt=Math.min((now-last)/1000||.016, .035);last=now;time+=dt;
 ctx.setTransform(dpr*S,0,0,dpr*S,0,0);water(time);
 // Distant blue silhouettes add depth behind the gold school.
 for(let i=0;i<11;i++){const x=((i*137+time*14)%(W+150))-75,y=H*(.2+.12*Math.sin(i*4.7))+Math.sin(time*.5+i)*13;ctx.save();ctx.translate(x,y);ctx.globalAlpha=.18;ellipse(ctx,0,0,13,4,'#61d4d7');ctx.fillStyle='#61d4d7';ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-21,-6);ctx.lineTo(-21,6);ctx.fill();ctx.restore()}
 ctx.drawImage(reef,0,0,reef.width,reef.height,0,0,W,H);
 // Soft moving caustic rings skim the sand.
 ctx.save();ctx.globalCompositeOperation='screen';ctx.lineWidth=1.5;
 for(let i=0;i<22;i++){let x=(i*173.7)%W,y=H*.9+((i*37)%Math.max(1,H*.1));ctx.strokeStyle='#9fffe91c';ctx.beginPath();ctx.ellipse(x+Math.sin(time*.4+i)*15,y,28+Math.sin(time+i)*8,6,Math.sin(i)*.3,0,TAU);ctx.stroke()}
 ctx.restore();
 updateFish(dt,time);fish.slice().sort((a,b)=>a.depth-b.depth).forEach(f=>drawFish(f,time));
 for(const p of dust){let x=(p.x*W+Math.sin(time*.18+p.p)*20+W)%W,y=((p.y*H-time*p.speed)%H+H)%H;ellipse(ctx,x,y,p.r,p.r,'#b7fff12b')}
 for(const b of bubbles){let y=H-((b.y*H+time*b.speed)%(H+30)),x=b.x*W+Math.sin(time*.9+b.y*30)*9;ctx.strokeStyle='#bdfff65c';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,b.r,0,TAU);ctx.stroke();ellipse(ctx,x-b.r*.32,y-b.r*.35,b.r*.18,b.r*.12,'#e2fffac4')}
 const vignette=ctx.createRadialGradient(W*.5,H*.45,Math.min(W,H)*.25,W*.5,H*.45,Math.max(W,H)*.78);vignette.addColorStop(0,'#001c3800');vignette.addColorStop(1,'#00172e70');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
 requestAnimationFrame(frame);
}
addEventListener('resize',resize,{passive:true});resize();requestAnimationFrame(frame);
</script>
</body>
</html>
