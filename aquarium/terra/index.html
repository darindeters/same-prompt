<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coral Reef</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #063f58; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="reef" aria-label="An animated coral reef aquarium"></canvas>
<script>
(() => {
  const canvas = document.getElementById('reef');
  const ctx = canvas.getContext('2d');
  const TAU = Math.PI * 2;
  let w, h, dpr, time = 0, last = 0;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const fish = Array.from({length: 27}, (_, i) => ({
    x: rand(.27, .73), y: rand(.29, .61), vx: rand(.035, .075), vy: rand(-.012, .012),
    size: rand(.012, .021), phase: rand(0, TAU), hue: i % 7 === 0 ? 32 : i % 5 === 0 ? 190 : 46,
    speed: rand(.85, 1.15), depth: rand(.75, 1.2)
  }));
  const particles = Array.from({length: 64}, () => ({x: Math.random(), y: Math.random(), r: rand(.5, 2), speed: rand(.002, .009), phase: rand(0, TAU)}));
  const bubbles = Array.from({length: 19}, () => ({x: rand(.02, .98), y: Math.random(), r: rand(.0015, .004), speed: rand(.018, .045), phase: rand(0, TAU)}));
  const coral = [];
  const seeded = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  for (let i = 0; i < 29; i++) {
    const x = i / 28;
    coral.push({x, y: .865 + seeded(i + 2) * .1, size: .055 + seeded(i + 8) * .085, type: i % 5, phase: seeded(i + 21) * TAU, color: ['#ff725d','#ff9c4a','#ff4e84','#b875e8','#f6b44f'][i % 5]});
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize); resize();
  function ellipse(x,y,rx,ry,color,rotation=0) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rotation,0,TAU); ctx.fill();
  }
  function background(t) {
    const g = ctx.createLinearGradient(0,0,0,h);
    g.addColorStop(0,'#087f9e'); g.addColorStop(.3,'#075e7d'); g.addColorStop(.72,'#06445e'); g.addColorStop(1,'#052f45');
    ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
    const glow = ctx.createRadialGradient(w*.52,-h*.12,0,w*.52,0,h*.9);
    glow.addColorStop(0,'rgba(107,238,221,.38)'); glow.addColorStop(1,'rgba(31,196,202,0)');
    ctx.fillStyle = glow; ctx.fillRect(0,0,w,h);
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for(let i=0;i<7;i++) {
      const x = w*(i*.19-.12) + Math.sin(t*.12+i)*w*.025;
      const grad = ctx.createLinearGradient(0,0,0,h*.85);
      grad.addColorStop(0,'rgba(112,245,229,.10)'); grad.addColorStop(1,'rgba(112,245,229,0)');
      ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+w*.075,0); ctx.lineTo(x+w*.28,h*.84); ctx.lineTo(x+w*.02,h*.84); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // Distant reef silhouettes give the open water depth.
    ctx.fillStyle = '#084c5c'; ctx.beginPath(); ctx.moveTo(0,h*.86);
    for(let i=0;i<=30;i++) { const x=i*w/30; ctx.lineTo(x,h*(.79 + .025*Math.sin(i*.8)+.018*Math.sin(i*1.9))); }
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();
    particles.forEach(p => { let y=(p.y-t*p.speed+10)%1; ellipse((p.x+Math.sin(t*.3+p.phase)*.008)*w,y*h,p.r,p.r,'rgba(174,244,226,.35)'); });
    bubbles.forEach(b => { const y=(b.y-t*b.speed+20)%1; const x=(b.x+Math.sin(t*.8+b.phase)*.008)*w; const r=Math.max(1,b.r*Math.min(w,h)); ctx.strokeStyle='rgba(178,249,240,.32)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(x,y*h,r,0,TAU); ctx.stroke(); });
  }
  function update(dt,t) {
    // The shared waypoint arcs around the tank; periodic bursts loosen the school.
    const cx = .5 + .22*Math.sin(t*.18), cy = .43 + .12*Math.sin(t*.23 + .8);
    const burst = Math.pow(Math.max(0, Math.sin(t*.27 - 1.3)), 12);
    for (const f of fish) {
      let ax=(cx-f.x)*.13, ay=(cy-f.y)*.13, avx=0, avy=0, count=0;
      for (const other of fish) {
        if (other === f) continue;
        const dx=other.x-f.x, dy=other.y-f.y, d2=dx*dx+dy*dy;
        if (d2 < .028) { avx+=other.vx; avy+=other.vy; count++; }
        if (d2 < .0025 && d2 > .000001) { const force=(.0025-d2)/.0025; ax-=dx*force*(1.5+burst*5); ay-=dy*force*(1.5+burst*5); }
      }
      if(count) { ax+=(avx/count-f.vx)*.8; ay+=(avy/count-f.vy)*.8; }
      ax += Math.cos(f.phase+t*.7)*burst*.11; ay += Math.sin(f.phase+t*.8)*burst*.11;
      if(f.x<.06) ax+=.07; if(f.x>.94) ax-=.07; if(f.y<.13) ay+=.07; if(f.y>.73) ay-=.07;
      f.vx+=ax*dt; f.vy+=ay*dt;
      const speed=Math.hypot(f.vx,f.vy) || 1, desired=(.055+burst*.05)*f.speed;
      f.vx += (f.vx/speed*desired-f.vx)*Math.min(1,dt*1.2);
      f.vy += (f.vy/speed*desired-f.vy)*Math.min(1,dt*1.2);
      f.x+=f.vx*dt; f.y+=f.vy*dt;
    }
  }
  function drawFish(f,t) {
    const s=Math.min(w,h)*f.size*f.depth, x=f.x*w, y=f.y*h;
    const angle=Math.atan2(f.vy*h,f.vx*w);
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    const tail=Math.sin(t*12+f.phase)*.22;
    ctx.fillStyle=f.hue===190?'#26e2dc':f.hue===32?'#ff8055':'#ffb638';
    ctx.beginPath(); ctx.moveTo(-s*.65,0); ctx.quadraticCurveTo(-s*1.2,-s*(.32+tail),-s*1.5,-s*.57); ctx.quadraticCurveTo(-s*1.32,0,-s*1.5,s*.57); ctx.quadraticCurveTo(-s*1.2,s*(.32-tail),-s*.65,0); ctx.fill();
    ctx.fillStyle=f.hue===190?'#18b9bf':f.hue===32?'#ef5b53':'#f28a2f';
    ctx.beginPath(); ctx.moveTo(-s*.45,-s*.2); ctx.quadraticCurveTo(-s*.2,-s*.9,s*.3,-s*.35); ctx.lineTo(s*.35,0); ctx.fill();
    const body=ctx.createLinearGradient(0,-s*.48,0,s*.48);
    if(f.hue===190) { body.addColorStop(0,'#b5fff0'); body.addColorStop(.45,'#35e1d3'); body.addColorStop(1,'#079bac'); }
    else if(f.hue===32) { body.addColorStop(0,'#ffe89c'); body.addColorStop(.45,'#ff8e5d'); body.addColorStop(1,'#e34c56'); }
    else { body.addColorStop(0,'#fff3a0'); body.addColorStop(.45,'#ffc348'); body.addColorStop(1,'#f48530'); }
    ctx.fillStyle=body; ctx.beginPath(); ctx.moveTo(s,0); ctx.quadraticCurveTo(s*.53,-s*.55,-s*.45,-s*.39); ctx.quadraticCurveTo(-s*.82,-s*.24,-s*.8,0); ctx.quadraticCurveTo(-s*.7,s*.4,-s*.25,s*.43); ctx.quadraticCurveTo(s*.55,s*.45,s,0); ctx.fill();
    ctx.fillStyle='rgba(255,255,220,.48)'; ctx.beginPath(); ctx.ellipse(-s*.02,s*.08,s*.22,s*.12,.45,0,TAU); ctx.fill();
    ellipse(s*.62,-s*.12,s*.085,s*.085,'#073e50'); ellipse(s*.645,-s*.15,s*.025,s*.025,'#fff');
    ctx.restore();
  }
  function branch(x,y,len,angle,width,color,depth,t,phase) {
    if(depth===0) return;
    const sway=Math.sin(t*.7+phase+depth)*.035;
    const nx=x+Math.sin(angle+sway)*len, ny=y-Math.cos(angle+sway)*len;
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+Math.sin(angle)*len*.3,y-len*.55,nx,ny); ctx.stroke();
    branch(nx,ny,len*.7,angle-.48,width*.68,color,depth-1,t,phase+.3);
    branch(nx,ny,len*.72,angle+.48,width*.68,color,depth-1,t,phase+.7);
    if(depth===1) ellipse(nx,ny,width*.65,width*.65,'#ffd1a0');
  }
  function drawReef(t) {
    const unit=Math.min(w,h);
    ctx.fillStyle='#07394a'; ctx.beginPath(); ctx.moveTo(0,h*.91); for(let i=0;i<=20;i++) ctx.lineTo(i*w/20,h*(.89+.018*Math.sin(i*1.7))); ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.fill();
    // Sea grass behind the coral.
    for(let i=0;i<45;i++) {
      const x=(i/44)*w, y=h*(.96+seeded(i+100)*.05), height=unit*(.07+seeded(i+40)*.12), bend=Math.sin(t*.65+i)*unit*.012;
      ctx.strokeStyle=i%3===0?'#22a78b':'#087b78'; ctx.lineWidth=unit*(.003+seeded(i)*.003); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+bend,y-height*.55,x+bend*2+(seeded(i+8)-.5)*unit*.035,y-height); ctx.stroke();
    }
    coral.forEach((c,i) => {
      const x=c.x*w, y=c.y*h, s=c.size*unit;
      if(c.type===0 || c.type===3) { branch(x,y,s*.38,0,s*.13,c.color,4,t,c.phase); }
      else if(c.type===1) {
        for(let j=0;j<5;j++) { const xx=x+(j-2)*s*.23, hh=s*(.45+seeded(i*9+j)*.6); ctx.strokeStyle=c.color; ctx.lineWidth=s*.13; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(xx,y-hh*.3,xx+Math.sin(t*.7+c.phase)*s*.05,y-hh); ctx.stroke(); ellipse(xx+Math.sin(t*.7+c.phase)*s*.05,y-hh,s*.075,s*.075,'#ffd181'); }
      } else if(c.type===2) {
        for(let j=0;j<7;j++) { const a=-1.2+j*.4; ellipse(x+Math.sin(a)*s*.38,y-Math.cos(a)*s*.35,s*.17,s*.45,c.color,-a); }
        ellipse(x,y-s*.16,s*.27,s*.19,'#f94f8a');
      } else {
        for(let j=0;j<4;j++) { const xx=x+(j-1.5)*s*.24, hh=s*(.35+seeded(i+j)*.35); ctx.fillStyle=j%2?'#f7a94b':'#ffcb64'; ctx.beginPath(); ctx.moveTo(xx-s*.1,y); ctx.lineTo(xx-s*.14,y-hh); ctx.quadraticCurveTo(xx,y-hh-s*.08,xx+s*.14,y-hh); ctx.lineTo(xx+s*.1,y); ctx.fill(); ellipse(xx,y-hh,s*.14,s*.055,'#d87945'); ellipse(xx,y-hh,s*.07,s*.025,'#714e48'); }
      }
    });
    // Foreground rocks and sand anchor the scene.
    ctx.fillStyle='#103e49'; ctx.beginPath(); ctx.moveTo(0,h); ctx.lineTo(0,h*.96); for(let i=0;i<=22;i++) ctx.lineTo(i*w/22,h*(.965+.018*Math.sin(i*1.5))); ctx.lineTo(w,h); ctx.fill();
    for(let i=0;i<26;i++) { const x=seeded(i+300)*w, y=h*(.965+seeded(i+400)*.04); ellipse(x,y,unit*(.008+seeded(i+500)*.02),unit*.006,i%2?'#2a6b6d':'#1b5660'); }
  }
  function frame(ms) {
    const dt=last ? Math.min((ms-last)/1000,.05) : 0; last=ms; time+=dt;
    background(time); update(dt,time); fish.slice().sort((a,b)=>a.depth-b.depth).forEach(f=>drawFish(f,time)); drawReef(time);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
