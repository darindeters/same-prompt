<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reef</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#041e52}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const c=document.getElementById('c');
const x=c.getContext('2d');
const TAU=Math.PI*2;
let W=1,H=1,S=1,DPR=1;

/* ---------- seeded random so the reef layout is stable ---------- */
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry(20240817);
const R=()=>Math.random();

/* ---------- scene state ---------- */
let staticLayer=null;   // offscreen canvas with rocks, sand, brain corals, staghorn, sponges
let live=[];            // swaying items: kelp, sea fans, anemones (drawn each frame)
let frontKelp=[];
let bubbles=[];
let snow=[];
let fish=[];
let loners=[];
const SCHOOL_N=78;

function floorY(px){return H*0.84+Math.sin(px*0.006)*H*0.018+Math.sin(px*0.017+1.3)*H*0.011;}

/* ---------- reef builders (static) ---------- */
function staghorn(ctx,px,py,ang,len,w,depth,hue,light){
  if(depth<=0||len<2)return;
  const ex=px+Math.cos(ang)*len,ey=py+Math.sin(ang)*len;
  ctx.strokeStyle=`hsl(${hue},100%,${light}%)`;
  ctx.lineWidth=w;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(ex,ey);ctx.stroke();
  if(depth===1){
    ctx.fillStyle=`hsl(${hue+20},100%,${light+22}%)`;
    ctx.beginPath();ctx.arc(ex,ey,w*0.8,0,TAU);ctx.fill();
  }
  const n=rnd()<0.3?3:2;
  for(let i=0;i<n;i++){
    const spread=(i-(n-1)/2)*0.55+(rnd()-0.5)*0.4;
    staghorn(ctx,ex,ey,ang+spread,len*(0.68+rnd()*0.12),w*0.72,depth-1,hue,light+4);
  }
}
function brainCoral(ctx,px,py,rw,rh,hue){
  const g=ctx.createRadialGradient(px-rw*0.3,py-rh*0.5,rw*0.1,px,py,rw*1.1);
  g.addColorStop(0,`hsl(${hue},100%,66%)`);
  g.addColorStop(0.7,`hsl(${hue},95%,46%)`);
  g.addColorStop(1,`hsl(${hue-15},85%,28%)`);
  ctx.fillStyle=g;
  ctx.beginPath();ctx.ellipse(px,py,rw,rh,0,Math.PI,0);ctx.lineTo(px+rw,py+rh*0.25);ctx.lineTo(px-rw,py+rh*0.25);ctx.closePath();ctx.fill();
  ctx.strokeStyle=`hsla(${hue-20},90%,20%,0.55)`;ctx.lineWidth=Math.max(1,rw*0.035);ctx.lineCap='round';
  for(let k=0;k<7;k++){
    const f=0.18+k*0.12;
    ctx.beginPath();
    for(let a=Math.PI;a<=TAU+0.01;a+=0.12){
      const wob=1+Math.sin(a*9+k*2.1)*0.06;
      const qx=px+Math.cos(a)*rw*f*wob,qy=py+Math.sin(a)*rh*f*wob;
      if(a===Math.PI)ctx.moveTo(qx,qy);else ctx.lineTo(qx,qy);
    }
    ctx.stroke();
  }
}
function sponges(ctx,px,py,h,hue){
  const n=3+Math.floor(rnd()*3);
  for(let i=0;i<n;i++){
    const th=h*(0.5+rnd()*0.7),tw=h*0.16*(0.7+rnd()*0.6),ox=(i-(n-1)/2)*tw*1.6;
    const g=ctx.createLinearGradient(px+ox-tw,0,px+ox+tw,0);
    g.addColorStop(0,`hsl(${hue},90%,38%)`);g.addColorStop(0.45,`hsl(${hue},100%,62%)`);g.addColorStop(1,`hsl(${hue},90%,32%)`);
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(px+ox-tw,py+h*0.1);ctx.lineTo(px+ox-tw*0.85,py-th);ctx.lineTo(px+ox+tw*0.85,py-th);ctx.lineTo(px+ox+tw,py+h*0.1);ctx.closePath();ctx.fill();
    ctx.fillStyle=`hsl(${hue},80%,14%)`;
    ctx.beginPath();ctx.ellipse(px+ox,py-th,tw*0.75,tw*0.3,0,0,TAU);ctx.fill();
  }
}
function rock(ctx,px,py,rw,rh){
  const g=ctx.createRadialGradient(px-rw*0.3,py-rh*0.6,rw*0.1,px,py,rw*1.2);
  g.addColorStop(0,'#2a4f8f');g.addColorStop(1,'#0a1f4e');
  ctx.fillStyle=g;
  ctx.beginPath();
  for(let a=0;a<=TAU+0.01;a+=0.25){
    const w=1+Math.sin(a*3.3+px)*0.12+Math.cos(a*5.1)*0.08;
    const qx=px+Math.cos(a)*rw*w,qy=py+Math.sin(a)*rh*w;
    if(a===0)ctx.moveTo(qx,qy);else ctx.lineTo(qx,qy);
  }
  ctx.closePath();ctx.fill();
}

function buildReef(){
  rnd.seed=0;
  staticLayer=document.createElement('canvas');
  staticLayer.width=Math.ceil(W*DPR);staticLayer.height=Math.ceil(H*DPR);
  const ctx=staticLayer.getContext('2d');
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const r2=mulberry(99);

  // rocks behind
  for(let i=0;i<9;i++){
    const px=W*(i/8)+(r2()-0.5)*W*0.1;
    rock(ctx,px,floorY(px)+S*0.02,S*(0.07+r2()*0.09),S*(0.05+r2()*0.06));
  }
  // sand
  const sg=ctx.createLinearGradient(0,H*0.8,0,H);
  sg.addColorStop(0,'#f2d58a');sg.addColorStop(0.5,'#d7a95c');sg.addColorStop(1,'#6b4b2c');
  ctx.fillStyle=sg;
  ctx.beginPath();ctx.moveTo(0,H);
  for(let px=0;px<=W+4;px+=4)ctx.lineTo(px,floorY(px));
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  // sand ripples
  ctx.strokeStyle='rgba(120,80,40,0.25)';ctx.lineWidth=S*0.003;
  for(let k=0;k<6;k++){
    ctx.beginPath();
    for(let px=0;px<=W;px+=6){
      const py=floorY(px)+H*0.02*(k+1)+Math.sin(px*0.03+k*1.7)*S*0.005;
      if(px===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  // coral placements along floor
  const slots=[];
  for(let i=0;i<10;i++)slots.push(W*(0.04+i*0.102)+(r2()-0.5)*W*0.05);
  slots.sort(()=>r2()-0.5);
  const types=['brain','stag','sponge','stag','brain','stag','sponge','stag','brain','stag'];
  slots.forEach((px,i)=>{
    const py=floorY(px)+S*0.012;
    const t=types[i];
    if(t==='brain'){brainCoral(ctx,px,py,S*(0.06+r2()*0.05),S*(0.045+r2()*0.035),[300,330,20,45][i%4]);}
    else if(t==='stag'){
      const hue=[330,20,290,350,40][i%5];
      const n=2+Math.floor(r2()*2);
      for(let k=0;k<n;k++){
        staghorn(ctx,px+(k-(n-1)/2)*S*0.02,py,-Math.PI/2+(k-(n-1)/2)*0.5+(r2()-0.5)*0.3,S*(0.045+r2()*0.03),S*0.012,5,hue,48);
      }
    } else {sponges(ctx,px,py,S*(0.07+r2()*0.05),[270,50,190][i%3]);}
  });

  // live (swaying) items
  live=[];frontKelp=[];
  for(let i=0;i<7;i++){
    const px=W*(0.03+i*0.155)+(r2()-0.5)*W*0.06;
    live.push({type:'kelp',x:px,y:floorY(px)+S*0.01,h:S*(0.16+r2()*0.16),w:S*(0.012+r2()*0.008),ph:r2()*TAU,hue:95+r2()*40,seg:9});
  }
  for(let i=0;i<4;i++){
    const px=W*(0.12+i*0.25)+(r2()-0.5)*W*0.12;
    live.push({type:'fan',x:px,y:floorY(px)+S*0.01,h:S*(0.1+r2()*0.06),ph:r2()*TAU,hue:[345,15,280,330][i]});
  }
  for(let i=0;i<4;i++){
    const px=W*(0.08+i*0.28)+(r2()-0.5)*W*0.1;
    live.push({type:'anem',x:px,y:floorY(px)+S*0.015,r:S*(0.035+r2()*0.02),ph:r2()*TAU,hue:[130,300,45,170][i],tip:[330,60,320,40][i],n:22+Math.floor(r2()*8)});
  }
  for(let i=0;i<4;i++){
    const px=W*(0.1+i*0.27)+(r2()-0.5)*W*0.1;
    frontKelp.push({type:'kelp',x:px,y:H*1.02,h:S*(0.22+r2()*0.14),w:S*(0.018+r2()*0.008),ph:r2()*TAU,hue:85+r2()*30,seg:10,front:true});
  }
}

/* ---------- live reef drawing ---------- */
function drawKelp(k,t,alpha){
  const pts=[];
  for(let j=0;j<=k.seg;j++){
    const f=j/k.seg;
    const sway=Math.sin(t*0.9+k.ph+f*2.6)*k.h*0.12*f*f+Math.sin(t*0.37+k.ph*2+f*1.5)*k.h*0.06*f;
    pts.push([k.x+sway,k.y-f*k.h]);
  }
  const g=x.createLinearGradient(0,k.y,0,k.y-k.h);
  g.addColorStop(0,`hsla(${k.hue-20},85%,22%,${alpha})`);g.addColorStop(1,`hsla(${k.hue+10},100%,55%,${alpha})`);
  x.strokeStyle=g;x.lineCap='round';x.lineJoin='round';
  for(let pass=0;pass<2;pass++){
    x.lineWidth=k.w*(pass?0.45:1);
    if(pass){x.strokeStyle=`hsla(${k.hue+25},100%,70%,${alpha*0.5})`;}
    x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
    for(let j=1;j<pts.length;j++){
      const wob=Math.sin(j*1.9+t*2+k.ph)*k.w*(pass?0.2:0.5);
      x.lineTo(pts[j][0]+wob,pts[j][1]);
    }
    x.stroke();
  }
}
function drawFan(f,t){
  const sk=Math.sin(t*0.7+f.ph)*0.12;
  x.save();x.translate(f.x,f.y);x.transform(1,0,sk,1,0,0);
  x.strokeStyle=`hsl(${f.hue},100%,52%)`;x.lineCap='round';x.lineWidth=S*0.0035;
  x.beginPath();x.moveTo(0,0);x.lineTo(0,-f.h*0.25);x.stroke();
  x.lineWidth=S*0.0022;
  const rays=13;
  for(let i=0;i<rays;i++){
    const a=-Math.PI/2+(i/(rays-1)-0.5)*2.2;
    x.beginPath();x.moveTo(0,-f.h*0.2);
    x.quadraticCurveTo(Math.cos(a)*f.h*0.5,-f.h*0.2+Math.sin(a)*f.h*0.5,Math.cos(a)*f.h,-f.h*0.2+Math.sin(a)*f.h);
    x.stroke();
  }
  x.strokeStyle=`hsla(${f.hue+15},100%,70%,0.8)`;x.lineWidth=S*0.0015;
  for(let r=0.35;r<=1;r+=0.16){
    x.beginPath();
    for(let i=0;i<rays;i++){
      const a=-Math.PI/2+(i/(rays-1)-0.5)*2.2;
      const px=Math.cos(a)*f.h*r,py=-f.h*0.2+Math.sin(a)*f.h*r+Math.sin(i*2.3+r*7)*f.h*0.02;
      if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.stroke();
  }
  x.restore();
}
function drawAnem(a,t){
  x.fillStyle=`hsl(${a.hue-10},80%,30%)`;
  x.beginPath();x.ellipse(a.x,a.y,a.r*0.8,a.r*0.3,0,0,TAU);x.fill();
  x.lineCap='round';
  for(let i=0;i<a.n;i++){
    const f=i/a.n;
    const bx=a.x+(f-0.5)*a.r*1.5,by=a.y-a.r*0.1*Math.sin(f*Math.PI);
    const len=a.r*(0.9+0.5*Math.sin(f*Math.PI+0.3));
    const ang=-Math.PI/2+(f-0.5)*1.3+Math.sin(t*1.6+i*0.9+a.ph)*0.28;
    const cx=bx+Math.cos(ang-0.3)*len*0.5,cy=by+Math.sin(ang-0.3)*len*0.5;
    const tx=bx+Math.cos(ang)*len,ty=by+Math.sin(ang)*len;
    x.strokeStyle=`hsl(${a.hue},100%,55%)`;x.lineWidth=a.r*0.13;
    x.beginPath();x.moveTo(bx,by);x.quadraticCurveTo(cx,cy,tx,ty);x.stroke();
    x.fillStyle=`hsl(${a.tip},100%,68%)`;
    x.beginPath();x.arc(tx,ty,a.r*0.09,0,TAU);x.fill();
  }
}

/* ---------- fish ---------- */
function mkFish(sz,hue,isLoner){
  const l=55;
  return {
    x:W*(0.3+R()*0.4),y:H*(0.25+R()*0.35),
    vx:(R()-0.5)*S*0.1,vy:(R()-0.5)*S*0.1,
    size:sz,ph:R()*TAU,
    col:`hsl(${hue},100%,${l}%)`,
    fin:`hsl(${hue+18},100%,${l+15}%)`,
    stripe:isLoner?`hsl(${(hue+180)%360},100%,60%)`:'rgba(255,255,255,0.92)',
    loner:isLoner,tx:W*0.5,ty:H*0.4,tt:0
  };
}
function initFish(){
  fish=[];loners=[];
  for(let i=0;i<SCHOOL_N;i++){
    const hue=22+R()*30;
    fish.push(mkFish(S*(0.018+R()*0.008),hue,false));
  }
  const lhues=[205,275,185];
  for(let i=0;i<3;i++){
    const f=mkFish(S*(0.04+R()*0.012),lhues[i],true);
    f.x=W*(0.15+R()*0.7);f.y=H*(0.2+R()*0.5);
    loners.push(f);
  }
}
function drawFish(f){
  const a=Math.atan2(f.vy,f.vx);
  x.save();x.translate(f.x,f.y);x.rotate(a);x.scale(f.size,f.size);
  const wag=Math.sin(f.ph)*0.32;
  x.fillStyle=f.fin;
  // tail
  x.beginPath();x.moveTo(-0.72,0);x.lineTo(-1.38,-0.52+wag);x.lineTo(-1.12,wag*0.45);x.lineTo(-1.38,0.52+wag);x.closePath();x.fill();
  // dorsal + anal fins
  x.beginPath();x.moveTo(0.3,-0.3);x.quadraticCurveTo(-0.05,-0.8,-0.55,-0.28);x.closePath();x.fill();
  x.beginPath();x.moveTo(0.05,0.32);x.quadraticCurveTo(-0.2,0.62,-0.5,0.28);x.closePath();x.fill();
  // body
  x.fillStyle=f.col;
  x.beginPath();x.moveTo(1,0);x.bezierCurveTo(0.75,-0.52,-0.25,-0.5,-0.85,-0.06);x.bezierCurveTo(-0.25,0.5,0.75,0.52,1,0);x.closePath();
  x.fill();
  x.save();x.clip();
  // stripes
  x.fillStyle=f.stripe;
  x.beginPath();x.moveTo(0.3,-0.6);x.quadraticCurveTo(0.14,0,0.3,0.6);x.lineTo(0.14,0.6);x.quadraticCurveTo(0.0,0,0.14,-0.6);x.closePath();x.fill();
  x.beginPath();x.moveTo(-0.35,-0.6);x.quadraticCurveTo(-0.45,0,-0.35,0.6);x.lineTo(-0.47,0.6);x.quadraticCurveTo(-0.57,0,-0.47,-0.6);x.closePath();x.fill();
  // belly highlight
  x.fillStyle='rgba(255,255,255,0.18)';
  x.beginPath();x.ellipse(0.1,0.18,0.6,0.22,0,0,TAU);x.fill();
  x.restore();
  // pectoral fin
  x.fillStyle=f.fin;
  x.beginPath();x.moveTo(0.22,0.08);x.lineTo(-0.12,0.36+wag*0.25);x.lineTo(-0.18,0.08);x.closePath();x.fill();
  // eye
  x.fillStyle='#fff';x.beginPath();x.arc(0.64,-0.1,0.12,0,TAU);x.fill();
  x.fillStyle='#0a0a1a';x.beginPath();x.arc(0.67,-0.1,0.065,0,TAU);x.fill();
  x.restore();
}

/* ---------- predator ---------- */
const pred={active:false,x:0,y:0,vx:0,dir:1,next:14};
function drawPred(t){
  if(!pred.active)return;
  x.save();x.translate(pred.x,pred.y);x.scale(pred.dir,1);
  const s=S*0.14;x.scale(s,s);
  const wag=Math.sin(t*5)*0.18;
  x.fillStyle='rgba(6,14,48,0.82)';
  x.beginPath();x.moveTo(1.2,0);x.bezierCurveTo(0.8,-0.42,-0.3,-0.42,-1,-0.1);x.lineTo(-1.5,-0.55+wag);x.lineTo(-1.25,wag*0.4);x.lineTo(-1.45,0.45+wag);x.lineTo(-1,0.1);x.bezierCurveTo(-0.3,0.4,0.8,0.4,1.2,0);x.closePath();x.fill();
  x.beginPath();x.moveTo(0.1,-0.3);x.lineTo(-0.2,-0.85);x.lineTo(-0.5,-0.25);x.closePath();x.fill();
  x.beginPath();x.moveTo(0.3,0.2);x.lineTo(-0.1,0.65);x.lineTo(-0.3,0.2);x.closePath();x.fill();
  x.fillStyle='rgba(255,230,120,0.9)';x.beginPath();x.arc(0.8,-0.1,0.06,0,TAU);x.fill();
  x.restore();
}

/* ---------- school brain ---------- */
const school={tx:0,ty:0,tt:0,scareX:0,scareY:0,scareT:0,nextScare:5,regroup:0};
function boxTarget(){
  school.tx=W*(0.15+R()*0.7);
  school.ty=H*(0.12+R()*0.5);
  school.tt=3.5+R()*4;
}
function limit(vx,vy,m){const d=Math.hypot(vx,vy);if(d>m){const k=m/d;return[vx*k,vy*k];}return[vx,vy];}

function updateSchool(dt,t){
  // targets, startle, predator
  school.tt-=dt;if(school.tt<=0)boxTarget();
  let cx=0,cy=0;for(const f of fish){cx+=f.x;cy+=f.y;}cx/=fish.length;cy/=fish.length;
  if(t>school.nextScare){
    school.scareX=cx+(R()-0.5)*S*0.25;school.scareY=cy+(R()-0.5)*S*0.25;
    school.scareT=1.1;school.regroup=4.5;school.nextScare=t+8+R()*8;
    boxTarget();
  }
  if(school.scareT>0)school.scareT-=dt;
  if(school.regroup>0)school.regroup-=dt;

  if(!pred.active&&t>pred.next){
    pred.active=true;pred.dir=R()<0.5?1:-1;
    pred.x=pred.dir>0?-S*0.3:W+S*0.3;pred.y=H*(0.15+R()*0.4);
    pred.vx=pred.dir*S*(0.13+R()*0.06);
  }
  if(pred.active){
    pred.x+=pred.vx*dt;pred.y+=Math.sin(t*0.8)*S*0.02*dt;
    if((pred.dir>0&&pred.x>W+S*0.3)||(pred.dir<0&&pred.x<-S*0.3)){pred.active=false;pred.next=t+18+R()*14;school.regroup=4;}
  }

  const base=S*0.21;
  const burst=school.scareT>0?1+school.scareT*1.2:1;
  const maxV=base*burst,minV=base*0.38,maxF=maxV*5;
  const Rn=S*0.085,Rn2=Rn*Rn,Rs=S*0.03,Rs2=Rs*Rs;
  const cohW=school.regroup>0?2.4:0.9;
  const n=fish.length;

  for(let i=0;i<n;i++){
    const f=fish[i];
    let sx=0,sy=0,ax=0,ay=0,gx=0,gy=0,cnt=0,scnt=0;
    for(let j=0;j<n;j++){
      if(i===j)continue;
      const o=fish[j];
      const dx=o.x-f.x,dy=o.y-f.y,d2=dx*dx+dy*dy;
      if(d2<Rn2){
        cnt++;ax+=o.vx;ay+=o.vy;gx+=o.x;gy+=o.y;
        if(d2<Rs2&&d2>0.01){const d=Math.sqrt(d2);const k=(Rs-d)/Rs/d;sx-=dx*k;sy-=dy*k;scnt++;}
      }
    }
    let fx=0,fy=0;
    const steer=(dx,dy,w)=>{
      const d=Math.hypot(dx,dy);if(d<1e-6)return;
      const [vx,vy]=limit(dx/d*maxV-f.vx,dy/d*maxV-f.vy,maxF);
      fx+=vx*w;fy+=vy*w;
    };
    if(scnt)steer(sx,sy,2.6);
    if(cnt){steer(ax,ay,1.0);steer(gx/cnt-f.x,gy/cnt-f.y,cohW);}
    steer(school.tx-f.x,school.ty-f.y,0.45);
    // soft boundaries
    const mx=W*0.07,my=H*0.07,bot=H*0.74;
    if(f.x<mx)steer(1,0,2.5);if(f.x>W-mx)steer(-1,0,2.5);
    if(f.y<my)steer(0,1,2.5);if(f.y>bot)steer(0,-1,2.5);
    // startle
    if(school.scareT>0){
      const dx=f.x-school.scareX,dy=f.y-school.scareY,d=Math.hypot(dx,dy),Rf=S*0.42;
      if(d<Rf)steer(dx+(R()-0.5)*S*0.1,dy+(R()-0.5)*S*0.1,6*(1-d/Rf)*school.scareT);
    }
    // predator
    if(pred.active){
      const dx=f.x-pred.x,dy=f.y-pred.y,d=Math.hypot(dx,dy),Rf=S*0.36;
      if(d<Rf)steer(dx,dy,7*(1-d/Rf));
    }
    f.vx+=fx*dt;f.vy+=fy*dt;
    let sp=Math.hypot(f.vx,f.vy);
    if(sp>maxV){f.vx*=maxV/sp;f.vy*=maxV/sp;sp=maxV;}
    if(sp<minV&&sp>1e-6){f.vx*=minV/sp;f.vy*=minV/sp;sp=minV;}
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    f.ph+=dt*(6+sp/S*40);
  }

  // loners wander slowly
  for(const f of loners){
    f.tt-=dt;
    if(f.tt<=0){f.tx=W*(0.1+R()*0.8);f.ty=H*(0.15+R()*0.55);f.tt=5+R()*6;}
    const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy)||1;
    const mv=S*0.07;
    let fx=(dx/d*mv-f.vx)*0.8,fy=(dy/d*mv-f.vy)*0.8;
    if(pred.active){const px=f.x-pred.x,py=f.y-pred.y,pd=Math.hypot(px,py);if(pd<S*0.3){fx+=px/pd*mv*4;fy+=py/pd*mv*4;}}
    f.vx+=fx*dt;f.vy+=fy*dt;
    const sp=Math.hypot(f.vx,f.vy);
    const cap=pred.active?mv*2.5:mv*1.2;
    if(sp>cap){f.vx*=cap/sp;f.vy*=cap/sp;}
    if(sp<mv*0.3&&sp>1e-6){f.vx*=mv*0.3/sp;f.vy*=mv*0.3/sp;}
    f.x+=f.vx*dt;f.y+=f.vy*dt;
    f.ph+=dt*(4+sp/S*30);
  }
}

/* ---------- water effects ---------- */
function drawWater(t){
  const g=x.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#19c8f0');g.addColorStop(0.35,'#0a7fd8');g.addColorStop(0.75,'#0a3aa6');g.addColorStop(1,'#071f63');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  // god rays
  x.save();x.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){
    const x0=W*(0.05+i*0.15)+Math.sin(t*0.13+i*1.9)*S*0.08;
    const w=S*(0.02+0.015*Math.sin(t*0.21+i));
    const drift=S*0.35;
    const rg=x.createLinearGradient(0,0,0,H*0.9);
    rg.addColorStop(0,'rgba(190,250,255,0.22)');rg.addColorStop(1,'rgba(190,250,255,0)');
    x.fillStyle=rg;
    x.beginPath();x.moveTo(x0-w,-10);x.lineTo(x0+w,-10);x.lineTo(x0+drift+w*5,H);x.lineTo(x0+drift-w*5,H);x.closePath();x.fill();
  }
  x.restore();
}
function drawCaustics(t){
  x.save();x.globalCompositeOperation='lighter';x.lineCap='round';
  x.lineWidth=S*0.004;
  for(let k=0;k<4;k++){
    x.strokeStyle=`rgba(255,255,220,${0.12-k*0.02})`;
    x.beginPath();
    for(let px=0;px<=W;px+=8){
      const py=floorY(px)+H*0.025*(k+0.8)+Math.sin(px*0.035+t*2.2+k*2)*S*0.012+Math.sin(px*0.011-t*1.3+k)*S*0.008;
      if(px===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.stroke();
  }
  x.restore();
}
function initParticles(){
  bubbles=[];snow=[];
  for(let i=0;i<40;i++)bubbles.push({x:R()*W,y:R()*H,r:S*(0.002+R()*0.005),v:S*(0.03+R()*0.05),ph:R()*TAU});
  for(let i=0;i<90;i++)snow.push({x:R()*W,y:R()*H,r:S*(0.0008+R()*0.0018),v:S*(0.004+R()*0.008),ph:R()*TAU});
}
function drawParticles(dt,t){
  x.fillStyle='rgba(220,245,255,0.45)';
  for(const p of snow){
    p.y+=p.v*dt;p.x+=Math.sin(t*0.5+p.ph)*S*0.01*dt;
    if(p.y>H)p.y=-5;
    x.beginPath();x.arc(p.x,p.y,p.r,0,TAU);x.fill();
  }
  x.lineWidth=S*0.0012;
  for(const b of bubbles){
    b.y-=b.v*dt;b.x+=Math.sin(t*2.5+b.ph)*S*0.02*dt;
    if(b.y<-10){b.y=floorY(b.x)+5;b.x=R()*W;}
    x.strokeStyle='rgba(230,250,255,0.75)';x.fillStyle='rgba(230,250,255,0.18)';
    x.beginPath();x.arc(b.x,b.y,b.r,0,TAU);x.fill();x.stroke();
    x.fillStyle='rgba(255,255,255,0.8)';x.beginPath();x.arc(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.25,0,TAU);x.fill();
  }
}
function drawVignette(){
  const g=x.createRadialGradient(W/2,H/2,S*0.35,W/2,H/2,S*0.85);
  g.addColorStop(0,'rgba(0,8,40,0)');g.addColorStop(1,'rgba(0,8,40,0.45)');
  x.fillStyle=g;x.fillRect(0,0,W,H);
}

/* ---------- main loop ---------- */
let last=0,time=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;
  if(!(dt>0)||dt>0.05)dt=0.016;
  time+=dt;
  const t=time;

  drawWater(t);
  updateSchool(dt,t);
  drawPred(t);
  x.drawImage(staticLayer,0,0,W,H);
  drawCaustics(t);
  for(const it of live){
    if(it.type==='kelp')drawKelp(it,t,1);
    else if(it.type==='fan')drawFan(it,t);
    else drawAnem(it,t);
  }
  drawParticles(dt,t);
  for(const f of loners)drawFish(f);
  for(const f of fish)drawFish(f);
  for(const k of frontKelp)drawKelp(k,t,0.85);
  drawVignette();
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;S=Math.min(W,H);
  c.width=Math.ceil(W*DPR);c.height=Math.ceil(H*DPR);
  c.style.width=W+'px';c.style.height=H+'px';
  x.setTransform(DPR,0,0,DPR,0,0);
  buildReef();
  if(!fish.length){initFish();initParticles();boxTarget();}
  else{
    for(const f of fish){f.x=Math.min(Math.max(f.x,0),W);f.y=Math.min(Math.max(f.y,0),H*0.7);}
    for(const f of loners){f.x=Math.min(Math.max(f.x,0),W);f.y=Math.min(Math.max(f.y,0),H*0.7);}
  }
}
window.addEventListener('resize',resize);
resize();
requestAnimationFrame(frame);
})();
</script>
