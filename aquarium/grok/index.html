<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reef</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0084e0;
    touch-action: none;
  }
  canvas {
    position: fixed;
    left: 0;
    top: 0;
    display: block;
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });

let w = 0;
let h = 0;
let unit = 1;
let time = 0;
let heading = 0.2;
let h0 = 0.2;
let h1 = 0.2;
let mode = 'cruise';
let modeT = 0;
let modeDur = 5;
let modeIndex = 0;
let lastStamp = 0;
let started = false;

const fish = [];
const bubbles = [];
const plankton = [];

const SCHOOL = [
  { body: '#FF6A00', deep: '#FF2D55', belly: '#FFE566', fin: '#FF006E', stripe: '#FFF4B8' },
  { body: '#FF8C00', deep: '#FF3D6E', belly: '#FFF1A8', fin: '#FF2E88', stripe: '#FFFFFF' },
  { body: '#FFB000', deep: '#FF5A00', belly: '#FFF6C8', fin: '#E01060', stripe: '#FFE08A' }
];

// Cruise together, arc as one school, burst apart, then pull back in.
const SCRIPT = [
  { name: 'cruise', dur: 5 },
  { name: 'turn', dur: 3.3 },
  { name: 'cruise', dur: 5.5 },
  { name: 'scatter', dur: 2.55 },
  { name: 'regroup', dur: 4.8 },
  { name: 'cruise', dur: 6 },
  { name: 'turn', dur: 3.4 },
  { name: 'cruise', dur: 5 },
  { name: 'scatter', dur: 2.55 },
  { name: 'regroup', dur: 5 }
];

const backReef = [
  { kind: 'rock', x: 0.15, r: 86 },
  { kind: 'rock', x: 0.47, r: 110 },
  { kind: 'rock', x: 0.76, r: 96 },
  { kind: 'fan', x: 0.07, len: 250, spread: 1.28, color: '#C026D3', phase: 0.3 },
  { kind: 'mound', x: 0.17, r: 58, color: '#FF4D00' },
  { kind: 'stag', x: 0.27, len: 108, depth: 3, width: 16, color: '#FF6A00', phase: 0.6 },
  { kind: 'brain', x: 0.42, rx: 92, ry: 56, color: '#FF3D7A' },
  { kind: 'tubes', x: 0.55, color: '#FF2A2A', phase: 1.1 },
  { kind: 'table', x: 0.68, r: 78, color: '#8B3DFF' },
  { kind: 'stag', x: 0.82, len: 116, depth: 3, width: 15, color: '#FF2E86', phase: 2.1 },
  { kind: 'fan', x: 0.94, len: 230, spread: 1.12, color: '#00F0C8', phase: 1.2 },
  { kind: 'anemone', x: 0.34, r: 36, phase: 0.4 }
];

const frontReef = [
  { kind: 'weed', x: 0.012, len: 320, color: '#D6FF00', blades: 5, phase: 0.4 },
  { kind: 'stag', x: -0.015, len: 140, depth: 3, width: 20, color: '#FF006E', phase: 1.5 },
  { kind: 'fingers', x: 0.13, color: '#FFB300', phase: 0.7 },
  { kind: 'mound', x: 0.985, r: 52, color: '#FF5A00' },
  { kind: 'weed', x: 0.995, len: 360, color: '#00F5A0', blades: 6, phase: 1.8 },
  { kind: 'anemone', x: 0.9, r: 70, phase: 1.6 }
];

const jellies = [
  {
    x: 0.22, y: 0.18, r: 84, amp: 40, sx: 0.21, sy: 0.17, phase: 0.4,
    hi: 'rgba(255, 236, 140, 0.96)', mid: 'rgba(255, 130, 20, 0.78)', edge: 'rgba(255, 40, 70, 0.28)',
    rim: 'rgba(255, 255, 190, 0.95)', tent: 'rgba(255, 196, 70, 0.7)', spot: 'rgba(255,255,255,0.85)'
  },
  {
    x: 0.76, y: 0.15, r: 68, amp: 32, sx: 0.17, sy: 0.14, phase: 2.2,
    hi: 'rgba(255, 190, 255, 0.96)', mid: 'rgba(230, 40, 180, 0.75)', edge: 'rgba(120, 0, 170, 0.25)',
    rim: 'rgba(255, 220, 255, 0.95)', tent: 'rgba(255, 120, 220, 0.68)', spot: 'rgba(255,255,255,0.8)'
  }
];

const pebbles = [];
const critters = [
  { kind: 'star', x: 0.23, k: 0.22, r: 24, rot: 0.4, color: '#FF3B6A' },
  { kind: 'star', x: 0.6, k: 0.38, r: 20, rot: 1.2, color: '#FFE14A' },
  { kind: 'star', x: 0.78, k: 0.18, r: 16, rot: 2.1, color: '#4DFFF0' },
  { kind: 'urchin', x: 0.48, k: 0.3, r: 18, color: '#B026FF' }
];

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function clamp(v, a, b) {
  return v < a ? a : v > b ? b : v;
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(((n >> 16) & 255) + amt, 0, 255) | 0;
  const g = clamp(((n >> 8) & 255) + amt, 0, 255) | 0;
  const b = clamp((n & 255) + amt, 0, 255) | 0;
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function sandY(x) {
  const nx = x / Math.max(w, 1);
  return h * (0.8 + Math.sin(nx * 6.2 + 0.4) * 0.02 + Math.sin(nx * 14.0) * 0.011);
}

function centroid() {
  let x = 0;
  let y = 0;
  const n = fish.length || 1;
  for (let i = 0; i < fish.length; i++) {
    x += fish[i].x;
    y += fish[i].y;
  }
  return { x: x / n, y: y / n };
}

function resize() {
  const prevW = w;
  const prevH = h;
  w = window.innerWidth;
  h = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  unit = Math.min(w, h) / 1080;
  if (!started) {
    started = true;
    buildScene();
    enterMode();
  } else if (prevW > 0 && prevH > 0) {
    const sx = w / prevW;
    const sy = h / prevH;
    for (let i = 0; i < fish.length; i++) {
      const f = fish[i];
      f.x *= sx;
      f.y *= sy;
      f.vx *= sx;
      f.vy *= sy;
    }
    for (let i = 0; i < bubbles.length; i++) {
      bubbles[i].x *= sx;
      bubbles[i].y *= sy;
    }
  }
}

function buildScene() {
  fish.length = 0;
  heading = 0.22;
  const cx = w * 0.36;
  const cy = h * 0.36;
  for (let i = 0; i < 38; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.random() * 78 * unit;
    fish.push({
      x: cx + Math.cos(ang) * rad,
      y: cy + Math.sin(ang) * rad * 0.62,
      vx: Math.cos(heading) * 100 * unit,
      vy: Math.sin(heading) * 100 * unit,
      phase: Math.random() * Math.PI * 2,
      z: 0.78 + Math.random() * 0.48,
      kind: i % 3,
      face: heading
    });
  }
  fish.sort(function (a, b) { return a.z - b.z; });

  bubbles.length = 0;
  for (let i = 0; i < 24; i++) bubbles.push(makeBubble(false));

  plankton.length = 0;
  for (let i = 0; i < 56; i++) {
    plankton.push({
      x: Math.random(),
      y: Math.random(),
      s: 0.015 + Math.random() * 0.045,
      p: Math.random() * 6.28,
      r: 1.1 + Math.random() * 1.8,
      a: 0.35 + Math.random() * 0.6
    });
  }

  const rng = mulberry32(11);
  pebbles.length = 0;
  const pebbleColors = ['#FF4D6D', '#FFD60A', '#3DFFF2', '#D06BFF', '#FF7A00', '#B6FF3C'];
  for (let i = 0; i < 34; i++) {
    pebbles.push({
      x: rng(),
      k: 0.08 + rng() * 0.7,
      r: 4 + rng() * 10,
      color: pebbleColors[i % pebbleColors.length]
    });
  }
}

function makeBubble(burst, x, y) {
  return {
    x: burst ? x : Math.random() * w,
    y: burst ? y : Math.random() * h,
    r: (burst ? 2.4 : 3.2) + Math.random() * (burst ? 5.5 : 8),
    sp: (burst ? 90 : 26) + Math.random() * (burst ? 80 : 34),
    phase: Math.random() * 6.28,
    a: 0.35 + Math.random() * 0.4,
    burst: !!burst,
    life: 0
  };
}

function spawnBurst(x, y) {
  for (let i = 0; i < 16; i++) {
    const b = makeBubble(true, x + (Math.random() - 0.5) * 50 * unit, y + (Math.random() - 0.5) * 36 * unit);
    b.sp *= 1.15;
    bubbles.push(b);
  }
}

function enterMode() {
  const step = SCRIPT[modeIndex];
  mode = step.name;
  modeT = 0;
  modeDur = step.dur;
  if (mode === 'cruise') modeDur *= 0.88 + Math.random() * 0.28;

  if (mode === 'turn') {
    const c = centroid();
    h0 = heading;
    const mag = 1.7 + Math.random() * 0.7;
    const score = function (end) {
      let s = 0;
      for (let k = 1; k <= 3; k++) {
        const ang = lerpAngle(h0, end, k / 3);
        const nx = c.x + Math.cos(ang) * w * 0.16 * k;
        const ny = c.y + Math.sin(ang) * h * 0.1 * k;
        if (nx > w * 0.1 && nx < w * 0.9) s += 2;
        else s -= 2;
        if (ny > h * 0.1 && ny < h * 0.52) s += 2;
        else s -= 3;
        s -= Math.abs(ny - h * 0.34) / h;
      }
      return s;
    };
    const left = h0 - mag;
    const right = h0 + mag;
    h1 = score(right) >= score(left) ? right : left;
  }

  if (mode === 'scatter') {
    const c = centroid();
    for (let i = 0; i < fish.length; i++) {
      const f = fish[i];
      let ang = Math.atan2(f.y - c.y, f.x - c.x);
      if (Math.hypot(f.x - c.x, f.y - c.y) < 14 * unit) ang = Math.random() * Math.PI * 2;
      ang += (Math.random() - 0.5) * 0.9;
      f.ex = Math.cos(ang);
      f.ey = Math.sin(ang);
      f.scareAt = time + Math.random() * 0.16;
      f.escaped = false;
    }
    spawnBurst(c.x, c.y);
  }
}

function updateHeading(dt) {
  const c = centroid();
  if (mode === 'turn') {
    const u = clamp(modeT / modeDur, 0, 1);
    const s = u * u * (3 - 2 * u);
    let desired = lerpAngle(h0, h1, s);
    if (c.x < w * 0.14 || c.x > w * 0.86 || c.y < h * 0.12 || c.y > h * 0.52) {
      const escape = Math.atan2(h * 0.34 - c.y, w * 0.5 - c.x);
      desired = lerpAngle(desired, escape, 0.7);
    }
    heading = desired;
    return;
  }
  if (mode === 'scatter') return;
  if (mode === 'cruise') {
    let tx = c.x + Math.cos(heading) * w * 0.3;
    let ty = c.y + Math.sin(heading) * h * 0.14;
    const minX = w * 0.22;
    const maxX = w * 0.78;
    const minY = h * 0.18;
    const maxY = h * 0.46;
    tx = clamp(tx, minX, maxX);
    ty = clamp(ty, minY, maxY);
    if (c.x < minX || c.x > maxX || c.y < minY || c.y > maxY) {
      tx = clamp(c.x, minX, maxX);
      ty = clamp(c.y, minY, maxY);
      if (Math.hypot(tx - c.x, ty - c.y) < 24 * unit) {
        tx = w * 0.5;
        ty = h * 0.32;
      }
    }
    let target = Math.atan2(ty - c.y, tx - c.x);
    const safe = c.x > w * 0.28 && c.x < w * 0.72 && c.y > h * 0.22 && c.y < h * 0.42;
    if (safe) target += Math.sin(time * 0.7) * 0.28;
    heading = lerpAngle(heading, target, 1 - Math.exp(-1.5 * dt));
  } else if (mode === 'regroup' && modeT > 2) {
    const target = Math.atan2(h * 0.34 - c.y, (c.x < w * 0.5 ? w * 0.68 : w * 0.32) - c.x);
    heading = lerpAngle(heading, target, 1 - Math.exp(-0.7 * dt));
  }
}

function steer(f, dx, dy, maxF) {
  let ax = dx - f.vx;
  let ay = dy - f.vy;
  const m = Math.hypot(ax, ay);
  if (m > maxF) {
    ax = (ax / m) * maxF;
    ay = (ay / m) * maxF;
  }
  return [ax, ay];
}

function updateFish(dt) {
  const c = centroid();
  const spCruise = 124 * unit;
  const spTurn = 158 * unit;
  const spScatter = 320 * unit;
  const spRegroup = 168 * unit;
  const maxF = 340 * unit;
  let modeSpeed = spCruise;
  if (mode === 'turn') modeSpeed = spTurn;
  else if (mode === 'scatter') modeSpeed = spScatter;
  else if (mode === 'regroup') modeSpeed = spRegroup;

  const perc = (mode === 'turn' ? 460 : 220) * unit;
  const perc2 = perc * perc;
  const sep = (mode === 'turn' ? 36 : mode === 'scatter' ? 52 : 44) * unit;
  const sep2 = sep * sep;
  const left = w * 0.07;
  const right = w * 0.93;
  const top = h * 0.09;
  const bot = h * 0.58;

  for (let i = 0; i < fish.length; i++) {
    const f = fish[i];
    let ax = 0;
    let ay = 0;
    let nvx = 0;
    let nvy = 0;
    let count = 0;
    let scx = 0;
    let scy = 0;
    let scount = 0;

    for (let j = 0; j < fish.length; j++) {
      if (i === j) continue;
      const o = fish[j];
      const dx = o.x - f.x;
      const dy = o.y - f.y;
      const d2 = dx * dx + dy * dy;
      if (mode !== 'scatter' && d2 < perc2) {
        nvx += o.vx;
        nvy += o.vy;
        count++;
      }
      if (d2 > 4 && d2 < sep2) {
        const d = Math.sqrt(d2);
        scx -= dx / d;
        scy -= dy / d;
        scount++;
      }
    }

    if (mode === 'scatter') {
      if (!f.escaped && time >= f.scareAt) {
        f.vx = f.ex * spScatter;
        f.vy = f.ey * spScatter;
        f.escaped = true;
      }
      if (modeT < 1.65) {
        const s = steer(f, f.ex * spScatter, f.ey * spScatter, maxF * 1.5);
        ax += s[0] * 1.15;
        ay += s[1] * 1.15;
      }
      if (scount) {
        const m = Math.hypot(scx, scy) || 1;
        const s = steer(f, (scx / m) * spScatter, (scy / m) * spScatter, maxF);
        ax += s[0] * 1.35;
        ay += s[1] * 1.35;
      }
    } else {
      const seekW = mode === 'turn' ? 2.15 : mode === 'regroup' ? 0.35 : 1.25;
      const aliW = mode === 'turn' ? 1.35 : mode === 'regroup' ? 0.75 : 0.8;
      const cohW = mode === 'turn' ? 1.05 : 0.9;
      const sepW = mode === 'turn' ? 0.9 : mode === 'regroup' ? 1.05 : 1.2;

      const hs = steer(f, Math.cos(heading) * modeSpeed, Math.sin(heading) * modeSpeed, maxF * (mode === 'turn' ? 1.4 : 1));
      ax += hs[0] * seekW;
      ay += hs[1] * seekW;

      const pdx = c.x - f.x;
      const pdy = c.y - f.y;
      const pd = Math.hypot(pdx, pdy) || 1;
      if (mode === 'regroup') {
        const arrive = clamp(pd / (80 * unit), 0.4, 1.6);
        const cs = steer(f, (pdx / pd) * spRegroup * arrive, (pdy / pd) * spRegroup * arrive, maxF * 1.3);
        ax += cs[0] * 2.15;
        ay += cs[1] * 2.15;
      } else {
        const pull = Math.min(pd * 0.85, 52 * unit);
        ax += (pdx / pd) * pull * cohW;
        ay += (pdy / pd) * pull * cohW;
      }

      if (count) {
        const avx = nvx / count;
        const avy = nvy / count;
        const am = Math.hypot(avx, avy) || 1;
        const as = steer(f, (avx / am) * modeSpeed, (avy / am) * modeSpeed, maxF);
        ax += as[0] * aliW;
        ay += as[1] * aliW;
      }
      if (scount) {
        const m = Math.hypot(scx, scy) || 1;
        const ss = steer(f, (scx / m) * modeSpeed, (scy / m) * modeSpeed, maxF);
        ax += ss[0] * sepW;
        ay += ss[1] * sepW;
      }
    }

    const wallK = 11;
    if (f.x < left) ax += (left - f.x) * wallK;
    else if (f.x > right) ax -= (f.x - right) * wallK;
    if (f.y < top) ay += (top - f.y) * wallK;
    else if (f.y > bot) ay -= (f.y - bot) * wallK;

    const accM = Math.hypot(ax, ay);
    const accCap = maxF * (mode === 'scatter' || mode === 'turn' ? 1.7 : 1.25);
    if (accM > accCap) {
      ax = (ax / accM) * accCap;
      ay = (ay / accM) * accCap;
    }

    f.vx += ax * dt;
    f.vy += ay * dt;

    if (f.x < left && f.vx < 0) f.vx = Math.abs(f.vx) * 0.4;
    if (f.x > right && f.vx > 0) f.vx = -Math.abs(f.vx) * 0.4;
    if (f.y < top && f.vy < 0) f.vy = Math.abs(f.vy) * 0.4;
    if (f.y > bot && f.vy > 0) f.vy = -Math.abs(f.vy) * 0.4;

    let v = Math.hypot(f.vx, f.vy);
    const maxSp = mode === 'scatter' ? spScatter * 1.08 : modeSpeed * 1.22;
    if (v > maxSp) {
      f.vx = (f.vx / v) * maxSp;
      f.vy = (f.vy / v) * maxSp;
      v = maxSp;
    }
    const boxed = f.x < left || f.x > right || f.y < top || f.y > bot;
    const minSp = 70 * unit;
    if (!boxed && mode !== 'scatter' && v < minSp) {
      f.vx = Math.cos(heading) * minSp;
      f.vy = Math.sin(heading) * minSp;
    }

    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.face = lerpAngle(f.face, Math.atan2(f.vy, f.vx), 1 - Math.exp(-10 * dt));
  }
}

function updateBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.life += dt;
    b.y -= b.sp * unit * dt;
    b.x += Math.sin(time * 1.6 + b.phase) * 18 * unit * dt;
    if (b.burst) {
      if (b.y < -30 || b.life > 3.2) bubbles.splice(i, 1);
      continue;
    }
    if (b.y < -24) {
      if (Math.random() < 0.4) {
        b.x = w * (Math.random() < 0.5 ? 0.34 : 0.9) + (Math.random() - 0.5) * 26 * unit;
        b.y = sandY(b.x) - 30 * unit;
      } else {
        b.x = Math.random() * w;
        b.y = h + 16;
      }
    }
  }
  for (let i = 0; i < plankton.length; i++) {
    const p = plankton[i];
    p.y -= p.s * dt;
    if (p.y < -0.02) p.y += 1.04;
    p.x += Math.sin(time * 0.7 + p.p) * 0.012 * dt;
    if (p.x < -0.02) p.x += 1;
    if (p.x > 1.02) p.x -= 1;
  }
}

function drawWater() {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#7AF6FF');
  g.addColorStop(0.16, '#00C8FF');
  g.addColorStop(0.42, '#0090F0');
  g.addColorStop(0.72, '#0068E0');
  g.addColorStop(1, '#0040B0');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  const glow = ctx.createLinearGradient(0, 0, 0, h * 0.2);
  glow.addColorStop(0, 'rgba(215, 255, 255, 0.72)');
  glow.addColorStop(1, 'rgba(215, 255, 255, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h * 0.2);

  ctx.strokeStyle = 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 3 * unit;
  ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    const base = (7 + i * 11) * unit;
    for (let x = 0; x <= w; x += 10) {
      const y = base + Math.sin(x * 0.018 + time * 1.25 + i * 1.4) * 4.5 * unit;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function drawRays() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 7; i++) {
    const x = (0.04 + i * 0.15) * w + Math.sin(time * 0.18 + i * 0.7) * 46 * unit;
    const spread = (70 + (i % 3) * 18) * unit;
    const sway = Math.sin(time * 0.27 + i) * 30 * unit;
    ctx.beginPath();
    ctx.moveTo(x, -30);
    ctx.lineTo(x + sway + spread * 1.6, h);
    ctx.lineTo(x + sway + spread * 2.5, h);
    ctx.lineTo(x + 36 * unit, -30);
    ctx.closePath();
    const a = 0.055 + 0.03 * Math.sin(time * 0.45 + i);
    ctx.fillStyle = 'rgba(230, 255, 255, ' + a + ')';
    ctx.fill();
  }
  ctx.restore();
}

function drawCaustics() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.lineCap = 'round';
  ctx.lineWidth = 16 * unit;
  ctx.strokeStyle = 'rgba(220, 255, 255, 0.07)';
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    const band = h * (0.08 + i * 0.1);
    for (let x = -10; x <= w + 10; x += 18) {
      const y = band
        + Math.sin(x * 0.01 + time * 0.85 + i) * 20 * unit
        + Math.sin(x * 0.028 - time * 1.35 + i * 1.7) * 9 * unit;
      if (x <= -10) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  for (let i = 0; i < 5; i++) {
    const x = (0.15 + i * 0.18) * w + Math.sin(time * 0.55 + i * 1.2) * 50 * unit;
    const y = (0.12 + (i % 3) * 0.16) * h + Math.cos(time * 0.42 + i) * 24 * unit;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 80 * unit);
    rg.addColorStop(0, 'rgba(255,255,255,0.16)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(x, y, 100 * unit, 30 * unit, Math.sin(time * 0.3 + i) * 0.6, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawDistant() {
  ctx.fillStyle = 'rgba(0, 70, 170, 0.28)';
  const mounds = [0.08, 0.26, 0.46, 0.66, 0.86];
  for (let i = 0; i < mounds.length; i++) {
    const mx = mounds[i] * w;
    const my = h * 0.76;
    ctx.beginPath();
    ctx.ellipse(mx, my, w * 0.13, h * 0.09, 0, Math.PI, Math.PI * 2);
    ctx.fill();
  }
}

function drawPlankton() {
  for (let i = 0; i < plankton.length; i++) {
    const p = plankton[i];
    ctx.fillStyle = 'rgba(225, 255, 255, ' + p.a + ')';
    ctx.beginPath();
    ctx.arc(p.x * w, p.y * h, p.r * unit, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawJelly(j) {
  const x = j.x * w + Math.sin(time * j.sx + j.phase) * j.amp * unit;
  const y = j.y * h + Math.cos(time * j.sy + j.phase) * j.amp * 0.55 * unit;
  const pulse = 1 + Math.sin(time * 1.7 + j.phase) * 0.09;
  const R = j.r * unit;
  ctx.save();
  ctx.translate(x, y);
  ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const bx = (i - 3) * R * 0.22;
    const len = R * (1.25 + (i % 3) * 0.38);
    ctx.strokeStyle = j.tent;
    ctx.lineWidth = 2.6 * unit;
    ctx.beginPath();
    ctx.moveTo(bx, R * 0.12);
    ctx.bezierCurveTo(
      bx + Math.sin(time * 2 + j.phase + i) * R * 0.32,
      R * 0.35 + len * 0.35,
      bx + Math.cos(time * 1.5 + i * 0.8) * R * 0.38,
      R * 0.25 + len * 0.72,
      bx + Math.sin(time * 2.2 + i * 1.2) * R * 0.22,
      R * 0.15 + len
    );
    ctx.stroke();
  }
  ctx.scale(pulse, 1 / pulse);
  const g = ctx.createRadialGradient(-R * 0.25, -R * 0.28, R * 0.08, 0, -R * 0.05, R);
  g.addColorStop(0, j.hi);
  g.addColorStop(0.55, j.mid);
  g.addColorStop(1, j.edge);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, R, Math.PI, 0);
  ctx.quadraticCurveTo(R * 0.55, R * 0.42, 0, R * 0.26);
  ctx.quadraticCurveTo(-R * 0.55, R * 0.42, -R, 0);
  ctx.fill();
  ctx.strokeStyle = j.rim;
  ctx.lineWidth = 4 * unit;
  ctx.beginPath();
  ctx.ellipse(0, R * 0.02, R * 0.9, R * 0.2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.fillStyle = j.spot;
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.ellipse(-R * 0.42 + i * R * 0.28, -R * 0.32, R * 0.09, R * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawRock(x, y, r) {
  ctx.fillStyle = '#083E78';
  ctx.beginPath();
  ctx.ellipse(x, y, r, r * 0.58, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0E6EAE';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.22, y - r * 0.12, r * 0.52, r * 0.3, -0.35, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FF4F88';
  ctx.beginPath();
  ctx.ellipse(x + r * 0.28, y - r * 0.02, r * 0.16, r * 0.1, 0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFD000';
  ctx.beginPath();
  ctx.arc(x - r * 0.05, y + r * 0.08, r * 0.08, 0, Math.PI * 2);
  ctx.fill();
}

function drawStag(x, y, angle, len, depth, width, color, phase) {
  const sway = Math.sin(time * 0.85 + phase + depth) * 0.09;
  const a = angle + sway;
  const ex = x + Math.cos(a) * len;
  const ey = y + Math.sin(a) * len;
  const mx = (x + ex) / 2 + Math.cos(a + 1.15) * len * 0.12;
  const my = (y + ey) / 2 + Math.sin(a + 1.15) * len * 0.08;
  ctx.lineCap = 'round';
  ctx.strokeStyle = shade(color, -55);
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x + 1.5 * unit, y + 2.5 * unit);
  ctx.quadraticCurveTo(mx + 1.5 * unit, my + 2.5 * unit, ex + 1.5 * unit, ey + 2.5 * unit);
  ctx.stroke();
  ctx.strokeStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(mx, my, ex, ey);
  ctx.stroke();
  ctx.strokeStyle = shade(color, 60);
  ctx.lineWidth = Math.max(1, width * 0.28);
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(mx, my, ex, ey);
  ctx.stroke();
  if (depth <= 0) {
    ctx.fillStyle = shade(color, 35);
    ctx.beginPath();
    ctx.arc(ex, ey, width * 0.55, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  drawStag(ex, ey, a - 0.55, len * 0.72, depth - 1, width * 0.72, color, phase + 1.7);
  drawStag(ex, ey, a + 0.5, len * 0.68, depth - 1, width * 0.7, color, phase + 3.2);
}

function drawBrain(x, y, rx, ry, color) {
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  const g = ctx.createLinearGradient(x, y - ry, x, y + ry);
  g.addColorStop(0, shade(color, 35));
  g.addColorStop(1, shade(color, -35));
  ctx.fillStyle = g;
  ctx.fill();
  ctx.clip();
  ctx.strokeStyle = shade(color, -50);
  ctx.lineWidth = 3 * unit;
  ctx.lineCap = 'round';
  for (let i = 0; i < 7; i++) {
    const yy = y - ry * 0.72 + (i / 6) * ry * 1.44;
    ctx.beginPath();
    for (let px = x - rx; px <= x + rx; px += 6 * unit) {
      const py = yy + Math.sin(px * 0.045 + i * 1.3 + time * 0.35) * 3.5 * unit;
      if (px <= x - rx + 0.1) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.strokeStyle = shade(color, 25);
  ctx.lineWidth = 4 * unit;
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.stroke();
}

function drawTube(x, y, length, rad, color, phase) {
  const sway = Math.sin(time * 0.8 + phase) * 8 * unit;
  const topX = x + sway;
  const topY = y - length;
  ctx.lineCap = 'round';
  ctx.strokeStyle = shade(color, -40);
  ctx.lineWidth = rad * 2;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.quadraticCurveTo(x + sway * 0.45, y - length * 0.5, topX, topY);
  ctx.stroke();
  ctx.strokeStyle = shade(color, 55);
  ctx.lineWidth = rad * 0.42;
  ctx.beginPath();
  ctx.moveTo(x - rad * 0.25, y);
  ctx.quadraticCurveTo(x + sway * 0.45 - rad * 0.25, y - length * 0.5, topX - rad * 0.2, topY);
  ctx.stroke();
  ctx.fillStyle = '#240810';
  ctx.beginPath();
  ctx.ellipse(topX, topY, rad * 0.75, rad * 0.36, sway * 0.01, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = shade(color, 70);
  ctx.lineWidth = 2.4 * unit;
  ctx.stroke();
}

function drawTubes(x, y, color, phase) {
  const specs = [
    [-26, 150, 15],
    [-6, 198, 18],
    [16, 132, 13],
    [36, 168, 15]
  ];
  for (let i = 0; i < specs.length; i++) {
    drawTube(
      x + specs[i][0] * unit,
      y,
      specs[i][1] * unit,
      specs[i][2] * unit,
      i % 2 ? '#FFD400' : color,
      phase + i * 0.8
    );
  }
}

function drawTable(x, ground, r, color) {
  const topY = ground - r * 1.05;
  ctx.fillStyle = shade(color, -45);
  const stemW = Math.max(9 * unit, r * 0.16);
  ctx.fillRect(x - stemW / 2, topY, stemW, ground - topY + 10 * unit);
  const plates = [
    { y: ground - r * 0.42, rx: r * 0.62, col: shade(color, -12) },
    { y: topY, rx: r, col: color }
  ];
  for (let p = 0; p < plates.length; p++) {
    const plate = plates[p];
    ctx.fillStyle = plate.col;
    ctx.beginPath();
    ctx.ellipse(x, plate.y, plate.rx, plate.rx * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = shade(color, 50);
    ctx.lineWidth = 3 * unit;
    ctx.stroke();
    ctx.strokeStyle = shade(color, -35);
    ctx.lineWidth = 1.6 * unit;
    for (let a = 0; a < 9; a++) {
      const ang = (a / 9) * Math.PI * 2 + 0.2;
      ctx.beginPath();
      ctx.moveTo(x, plate.y);
      ctx.lineTo(x + Math.cos(ang) * plate.rx * 0.88, plate.y + Math.sin(ang) * plate.rx * 0.25);
      ctx.stroke();
    }
  }
}

function drawFan(x, y, len, spread, color, phase) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(time * 0.55 + phase) * 0.07);
  ctx.lineCap = 'round';
  ctx.strokeStyle = shade(color, -40);
  ctx.lineWidth = 7 * unit;
  ctx.beginPath();
  ctx.moveTo(0, 12 * unit);
  ctx.lineTo(0, 0);
  ctx.stroke();
  const ribs = 13;
  const tips = [];
  ctx.lineWidth = 3.4 * unit;
  for (let i = 0; i < ribs; i++) {
    const a = -Math.PI / 2 - spread / 2 + (spread * i) / (ribs - 1);
    const ex = Math.cos(a) * len;
    const ey = Math.sin(a) * len;
    tips.push([ex, ey]);
    ctx.strokeStyle = i % 2 ? shade(color, 30) : color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  }
  ctx.strokeStyle = shade(color, 50);
  ctx.lineWidth = 1.8 * unit;
  const fracs = [0.48, 0.72, 0.92];
  for (let f = 0; f < fracs.length; f++) {
    ctx.beginPath();
    for (let i = 0; i < tips.length; i++) {
      const px = tips[i][0] * fracs[f];
      const py = tips[i][1] * fracs[f] + Math.sin(time * 1.3 + phase + i) * 1.6 * unit;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

function drawAnemone(x, y, r, phase) {
  ctx.fillStyle = '#FF3E88';
  ctx.beginPath();
  ctx.ellipse(x, y, r * 1.05, r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FF8AB8';
  ctx.beginPath();
  ctx.ellipse(x - r * 0.2, y - r * 0.08, r * 0.55, r * 0.22, -0.2, 0, Math.PI * 2);
  ctx.fill();
  const n = 16;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI + 0.32 + (i / (n - 1)) * (Math.PI - 0.64);
    const len = r * (1.55 + (i % 3) * 0.38);
    const sway = Math.sin(time * 1.7 + phase + i * 0.55) * 0.28;
    const rootX = x + Math.cos(a) * r * 0.25;
    const rootY = y + Math.sin(a) * r * 0.08;
    const tipX = x + Math.cos(a + sway) * len;
    const tipY = y + Math.sin(a + sway) * len * 0.92;
    const mx = x + Math.cos(a + sway * 0.4) * len * 0.48;
    const my = y + Math.sin(a) * len * 0.25 - r * 0.15;
    ctx.strokeStyle = i % 2 ? '#FF5CA2' : '#FF8CC0';
    ctx.lineWidth = (5.2 - (i % 3) * 0.6) * unit;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(rootX, rootY);
    ctx.quadraticCurveTo(mx, my, tipX, tipY);
    ctx.stroke();
    ctx.fillStyle = i % 4 === 0 ? '#D8FF3A' : '#FFE14A';
    ctx.beginPath();
    ctx.arc(tipX, tipY, (i % 4 === 0 ? 5.2 : 4.2) * unit, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#C2185B';
  ctx.beginPath();
  ctx.ellipse(x, y - r * 0.02, r * 0.26, r * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMound(x, ground, r, color) {
  ctx.fillStyle = shade(color, -30);
  ctx.beginPath();
  ctx.ellipse(x, ground - r * 0.02, r * 0.95, r * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();
  for (let i = 0; i < 7; i++) {
    const ang = Math.PI + (i / 6) * Math.PI;
    const br = r * (0.3 + (i % 2) * 0.08);
    const bx = x + Math.cos(ang) * r * 0.55;
    const by = ground - r * 0.12 + Math.sin(ang) * r * 0.42;
    ctx.fillStyle = i % 2 ? shade(color, 28) : color;
    ctx.beginPath();
    ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.beginPath();
    ctx.arc(bx - br * 0.15, by - br * 0.22, br * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFingers(x, ground, color, phase) {
  const cols = ['#FFB300', '#FF8A00', '#FFD000', '#FF6A00'];
  for (let i = 0; i < 6; i++) {
    const fx = x + (i - 2.5) * 18 * unit;
    const fh = (58 + ((i * 19) % 46)) * unit;
    const sway = Math.sin(time * 0.95 + phase + i) * 7 * unit;
    const rad = 12 * unit;
    const top = ground - fh;
    ctx.fillStyle = cols[i % cols.length];
    ctx.beginPath();
    ctx.moveTo(fx - rad, ground);
    ctx.lineTo(fx - rad + sway, top);
    ctx.arc(fx + sway, top, rad, Math.PI, 0);
    ctx.lineTo(fx + rad, ground);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.ellipse(fx + sway - rad * 0.25, top + fh * 0.35, rad * 0.28, fh * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawWeed(x, ground, length, color, blades, phase) {
  ctx.lineCap = 'round';
  for (let i = 0; i < blades; i++) {
    const bx = x + (i - (blades - 1) / 2) * 16 * unit;
    const ph = phase + i * 0.65;
    const h1 = length * (0.78 + (i % 3) * 0.1);
    const s1 = Math.sin(time * 1.05 + ph) * 22 * unit;
    const s2 = Math.sin(time * 1.25 + ph + 0.8) * 34 * unit;
    ctx.strokeStyle = i % 2 ? shade(color, 20) : color;
    ctx.lineWidth = (8.5 - i * 0.45) * unit;
    ctx.beginPath();
    ctx.moveTo(bx, ground);
    ctx.bezierCurveTo(bx + s1, ground - h1 * 0.38, bx + s2, ground - h1 * 0.72, bx + s2 * 0.55, ground - h1);
    ctx.stroke();
  }
}

function drawReef(list) {
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const x = p.x * w;
    const ground = sandY(Math.max(0, Math.min(w, x)));
    switch (p.kind) {
      case 'rock':
        drawRock(x, ground - p.r * unit * 0.02, p.r * unit);
        break;
      case 'fan':
        drawFan(x, ground + 6 * unit, p.len * unit, p.spread, p.color, p.phase);
        break;
      case 'stag':
        drawStag(x, ground + 10 * unit, -Math.PI / 2, p.len * unit, p.depth, p.width * unit, p.color, p.phase);
        break;
      case 'brain':
        drawBrain(x, ground - p.ry * unit * 0.42, p.rx * unit, p.ry * unit, p.color);
        break;
      case 'tubes':
        drawTubes(x, ground + 8 * unit, p.color, p.phase);
        break;
      case 'table':
        drawTable(x, ground + 6 * unit, p.r * unit, p.color);
        break;
      case 'anemone':
        drawAnemone(x, ground - p.r * unit * 0.08, p.r * unit, p.phase);
        break;
      case 'mound':
        drawMound(x, ground, p.r * unit, p.color);
        break;
      case 'weed':
        drawWeed(x, ground + 12 * unit, p.len * unit, p.color, p.blades, p.phase);
        break;
      case 'fingers':
        drawFingers(x, ground + 6 * unit, p.color, p.phase);
        break;
      default:
        break;
    }
  }
}

function drawSand() {
  ctx.beginPath();
  ctx.moveTo(0, sandY(0));
  for (let x = 0; x <= w; x += 12) ctx.lineTo(x, sandY(x));
  ctx.lineTo(w, h + 2);
  ctx.lineTo(0, h + 2);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, h * 0.76, 0, h);
  g.addColorStop(0, '#FFE58A');
  g.addColorStop(0.35, '#FFC107');
  g.addColorStop(1, '#FF8A00');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.strokeStyle = 'rgba(0, 90, 170, 0.28)';
  ctx.lineWidth = 8 * unit;
  ctx.beginPath();
  for (let x = 0; x <= w; x += 12) {
    if (x === 0) ctx.moveTo(x, sandY(x));
    else ctx.lineTo(x, sandY(x));
  }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255, 120, 0, 0.4)';
  ctx.lineWidth = 2 * unit;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath();
    const base = h * (0.86 + i * 0.026);
    for (let x = 0; x <= w; x += 14) {
      const y = base + Math.sin(x * 0.018 + time * 0.35 + i) * 3.2 * unit;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}

function sandPoint(nx, k, lift) {
  const x = nx * w;
  const top = sandY(x);
  const y = top + (lift || 18) * unit + k * Math.max(0, h - top - 24 * unit);
  return [x, y];
}

function drawPebbles() {
  for (let i = 0; i < pebbles.length; i++) {
    const p = pebbles[i];
    const pt = sandPoint(p.x, p.k, 14);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.ellipse(pt[0], pt[1], p.r * unit, p.r * unit * 0.72, p.x * 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(pt[0] - p.r * unit * 0.25, pt[1] - p.r * unit * 0.2, p.r * unit * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawStar(x, y, r, rot, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    const rr = i % 2 === 0 ? r : r * 0.42;
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(x, y, r * 0.16, 0, Math.PI * 2);
  ctx.fill();
}

function drawUrchin(x, y, r, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.2 * unit;
  ctx.lineCap = 'round';
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2 + time * 0.04;
    const len = r * (1.35 + (i % 3) * 0.18);
    ctx.beginPath();
    ctx.moveTo(x + Math.cos(a) * r * 0.35, y + Math.sin(a) * r * 0.25);
    ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.72);
    ctx.stroke();
  }
  ctx.fillStyle = shade(color, 20);
  ctx.beginPath();
  ctx.ellipse(x, y, r * 0.62, r * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawCritters() {
  for (let i = 0; i < critters.length; i++) {
    const c = critters[i];
    const pt = sandPoint(c.x, c.k, 8);
    if (c.kind === 'star') drawStar(pt[0], pt[1], c.r * unit, c.rot + Math.sin(time * 0.2 + i) * 0.08, c.color);
    else drawUrchin(pt[0], pt[1], c.r * unit, c.color);
  }
}

function drawSandLight() {
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (let i = 0; i < 6; i++) {
    const x = (0.08 + i * 0.16) * w + Math.sin(time * 0.65 + i) * 28 * unit;
    const y = sandY(x) + 26 * unit;
    ctx.fillStyle = 'rgba(255, 255, 230, 0.16)';
    ctx.beginPath();
    ctx.ellipse(x, y, 56 * unit, 14 * unit, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function traceBody() {
  ctx.beginPath();
  ctx.moveTo(1.22, 0);
  ctx.bezierCurveTo(0.88, -0.48, 0.06, -0.52, -0.6, -0.28);
  ctx.bezierCurveTo(-0.98, -0.15, -1.1, -0.04, -1.14, 0);
  ctx.bezierCurveTo(-1.08, 0.1, -0.92, 0.28, -0.48, 0.36);
  ctx.bezierCurveTo(0.16, 0.5, 0.88, 0.4, 1.22, 0);
  ctx.closePath();
}

function drawFish(f) {
  const s = 25 * unit * f.z;
  const sprint = mode === 'scatter' ? 16 : 9;
  const wag = Math.sin(time * sprint + f.phase) * (mode === 'scatter' ? 0.58 : 0.36);
  const pal = SCHOOL[f.kind];
  const spd = Math.hypot(f.vx, f.vy);
  const stretch = clamp(spd / (96 * unit), 0.88, 1.32);
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.face);
  ctx.scale(s * stretch, s / Math.sqrt(stretch));

  ctx.fillStyle = 'rgba(0, 30, 80, 0.16)';
  ctx.beginPath();
  ctx.ellipse(0.05, 0.46, 1.05, 0.26, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = pal.fin;
  ctx.beginPath();
  ctx.moveTo(-0.9, -0.08);
  ctx.quadraticCurveTo(-1.28, wag * 0.35, -1.78, -0.55 + wag);
  ctx.quadraticCurveTo(-1.3, -0.02 + wag * 0.55, -1.0, 0);
  ctx.quadraticCurveTo(-1.3, 0.02 + wag * 0.55, -1.78, 0.55 + wag);
  ctx.quadraticCurveTo(-1.28, wag * 0.35, -0.9, 0.1);
  ctx.closePath();
  ctx.fill();

  const grd = ctx.createLinearGradient(0, -0.55, 0, 0.5);
  grd.addColorStop(0, pal.deep);
  grd.addColorStop(0.4, pal.body);
  grd.addColorStop(1, pal.belly);
  ctx.fillStyle = grd;
  traceBody();
  ctx.fill();
  ctx.lineWidth = 0.055;
  ctx.strokeStyle = 'rgba(110, 0, 40, 0.4)';
  ctx.stroke();

  ctx.save();
  traceBody();
  ctx.clip();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = pal.stripe;
  const bands = [0.46, -0.02, -0.5];
  for (let i = 0; i < bands.length; i++) {
    ctx.beginPath();
    ctx.ellipse(bands[i], 0.02, 0.075, 0.34, 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  ctx.fillStyle = pal.fin;
  ctx.beginPath();
  ctx.moveTo(0.28, -0.36);
  ctx.quadraticCurveTo(0.05, -0.95 + wag * 0.12, -0.5, -0.22);
  ctx.quadraticCurveTo(-0.12, -0.4, 0.28, -0.36);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-0.12, 0.28);
  ctx.quadraticCurveTo(-0.32, 0.66, -0.72, 0.2);
  ctx.quadraticCurveTo(-0.38, 0.28, -0.12, 0.28);
  ctx.fill();

  const flap = Math.sin(time * 8 + f.phase);
  ctx.beginPath();
  ctx.ellipse(0.2, 0.18, 0.28, 0.1, 0.85 + flap * 0.45, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.42)';
  ctx.beginPath();
  ctx.ellipse(0.22, -0.18, 0.32, 0.1, -0.45, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255, 250, 220, 0.85)';
  ctx.lineWidth = 0.045;
  ctx.beginPath();
  ctx.moveTo(0.78, 0.02);
  ctx.quadraticCurveTo(0.05, 0.08, -0.82, 0.0);
  ctx.stroke();

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(0.74, -0.08, 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1A1024';
  ctx.beginPath();
  ctx.arc(0.785, -0.08, 0.078, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath();
  ctx.arc(0.81, -0.11, 0.03, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function drawBubbles() {
  ctx.lineWidth = 1.6 * unit;
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    const rad = b.r * unit;
    ctx.strokeStyle = 'rgba(230, 255, 255, ' + b.a + ')';
    ctx.beginPath();
    ctx.arc(b.x, b.y, rad, 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,' + (b.a * 0.85) + ')';
    ctx.beginPath();
    ctx.arc(b.x - rad * 0.32, b.y - rad * 0.32, Math.max(0.8, rad * 0.28), 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawVignette() {
  const g = ctx.createRadialGradient(w * 0.5, h * 0.4, Math.min(w, h) * 0.28, w * 0.5, h * 0.46, Math.max(w, h) * 0.72);
  g.addColorStop(0, 'rgba(0, 20, 60, 0)');
  g.addColorStop(1, 'rgba(0, 16, 55, 0.3)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  const sheenX = ((time * 36) % (w + 520)) - 260;
  const sg = ctx.createLinearGradient(sheenX, 0, sheenX + 200 * unit, h);
  sg.addColorStop(0, 'rgba(255,255,255,0)');
  sg.addColorStop(0.5, 'rgba(255,255,255,0.045)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();
}

function frame(now) {
  if (!lastStamp) lastStamp = now;
  let dt = (now - lastStamp) / 1000;
  lastStamp = now;
  if (dt < 0) dt = 0;
  if (dt > 0.033) dt = 0.033;

  time += dt;
  modeT += dt;
  if (modeT >= modeDur) {
    const next = SCRIPT[(modeIndex + 1) % SCRIPT.length];
    const c = centroid();
    const clear = c.x > w * 0.24 && c.x < w * 0.76 && c.y > h * 0.2 && c.y < h * 0.46;
    const holdTurn = next.name === 'turn' && !clear && modeT < modeDur + 3.5;
    if (!holdTurn) {
      modeIndex = (modeIndex + 1) % SCRIPT.length;
      enterMode();
    }
  }
  updateHeading(dt);
  updateFish(dt);
  updateBubbles(dt);

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  drawWater();
  drawRays();
  drawCaustics();
  drawDistant();
  drawPlankton();
  for (let i = 0; i < jellies.length; i++) drawJelly(jellies[i]);
  drawReef(backReef);
  drawSand();
  drawPebbles();
  drawCritters();
  drawSandLight();
  for (let i = 0; i < fish.length; i++) drawFish(fish[i]);
  drawReef(frontReef);
  drawBubbles();
  drawVignette();

  requestAnimationFrame(frame);
}

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
