<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reef</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #041c2c;
    position: fixed;
    inset: 0;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="reef"></canvas>
<script>
(() => {
  const canvas = document.getElementById("reef");
  const ctx = canvas.getContext("2d");

  let W = 0;
  let H = 0;
  let dpr = 1;
  let midC = null;
  let foreC = null;
  let scene = null;
  let school = [];
  let bubbles = [];
  let snow = [];
  let anchor = { x: 0, y: 0 };
  let heading = -0.1;
  let preferred = -0.1;
  let turnTarget = -0.1;
  let lastTurnDir = 1;
  let modeIdx = 0;
  let modeTime = 2.6;
  let time = 0;
  let centroid = { x: 0, y: 0 };

  const CYCLE = [
    { id: "group", dur: 4.4 },
    { id: "turn", dur: 2.85 },
    { id: "group", dur: 3.5 },
    { id: "turn", dur: 2.95 },
    { id: "group", dur: 2.7 },
    { id: "scatter", dur: 1.75 },
    { id: "reform", dur: 4.3 },
  ];

  const RINGS = [
    { n: 10, r: 76 },
    { n: 18, r: 128 },
    { n: 26, r: 186 },
  ];

  const PALETTES = [
    { dorsal: "#0c6c86", mid: "#2cb4c8", belly: "#f3fffb", shade: "#b5e3d6" },
    { dorsal: "#0d7468", mid: "#35c4ac", belly: "#f5fffb", shade: "#c4ebde" },
    { dorsal: "#155984", mid: "#4aa4d0", belly: "#eef8ff", shade: "#c2dbeb" },
    { dorsal: "#0e6878", mid: "#24a6b8", belly: "#e9fffb", shade: "#aadfd2" },
  ];

  function unit() {
    return Math.min(W, H) / 1080;
  }

  function clamp(v, a, b) {
    return v < a ? a : v > b ? b : v;
  }

  function angNorm(a) {
    const p = Math.PI * 2;
    while (a > Math.PI) a -= p;
    while (a < -Math.PI) a += p;
    return a;
  }

  function angDiff(a, b) {
    return angNorm(a - b);
  }

  function approachAng(cur, target, maxStep) {
    const d = angDiff(target, cur);
    if (Math.abs(d) <= maxStep) return angNorm(target);
    return angNorm(cur + Math.sign(d) * maxStep);
  }

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function rand() {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function sandY(x) {
    const u = unit();
    return H * 0.782
      + Math.sin(x * 0.0072) * 16 * u
      + Math.sin(x * 0.0205 + 1.4) * 7 * u
      + Math.sin(x * 0.0032 + 0.4) * 20 * u;
  }

  function limitVec(x, y, max) {
    const m = Math.hypot(x, y);
    if (m > max && m > 0) return [x / m * max, y / m * max];
    return [x, y];
  }

  function makeCanvas() {
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.floor(W * dpr));
    c.height = Math.max(1, Math.floor(H * dpr));
    const cctx = c.getContext("2d");
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return c;
  }

  function mode() {
    return CYCLE[modeIdx].id;
  }

  function formationPoint(slot, u) {
    let idx = slot;
    let ring = 0;
    for (let r = 0; r < RINGS.length; r++) {
      if (idx < RINGS[r].n) {
        ring = r;
        break;
      }
      idx -= RINGS[r].n;
    }
    const spec = RINGS[ring];
    const ang = (idx / spec.n) * Math.PI * 2 + time * 0.18 + ring * 0.65;
    let x = anchor.x + Math.cos(ang) * spec.r * u;
    let y = anchor.y + Math.sin(ang) * spec.r * 0.46 * u;
    const top = Math.max(36 * u, H * 0.08);
    const bottom = sandY(x) - 36 * u;
    x = clamp(x, 28, W - 28);
    y = clamp(y, top, Math.max(top + 10, bottom));
    return { x: x, y: y };
  }

  function traceSand(g) {
    g.beginPath();
    g.moveTo(0, H + 2);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, sandY(x));
    g.lineTo(W, H + 2);
    g.closePath();
  }

  function drawSand(g, rand) {
    const u = unit();
    traceSand(g);
    const grad = g.createLinearGradient(0, H * 0.74, 0, H);
    grad.addColorStop(0, "#f3d9a4");
    grad.addColorStop(0.22, "#e4c17c");
    grad.addColorStop(0.55, "#c79650");
    grad.addColorStop(1, "#7d562f");
    g.fillStyle = grad;
    g.fill();

    g.save();
    traceSand(g);
    g.clip();
    g.strokeStyle = "rgba(110, 72, 36, 0.18)";
    g.lineWidth = 1.4 * u;
    for (let i = 0; i < 9; i++) {
      const y0 = H * 0.84 + i * H * 0.016;
      g.beginPath();
      for (let x = 0; x <= W; x += 10) {
        const y = y0 + Math.sin(x * 0.028 + i * 1.3) * 2.4 * u;
        if (x === 0) g.moveTo(x, y);
        else g.lineTo(x, y);
      }
      g.stroke();
    }
    for (let i = 0; i < 520; i++) {
      const x = rand() * W;
      const y = sandY(x) + rand() * (H - sandY(x));
      const shade = rand();
      g.fillStyle = shade > 0.85 ? "rgba(255,248,230,0.55)" : shade > 0.5 ? "rgba(120,78,40,0.28)" : "rgba(255,255,255,0.16)";
      g.fillRect(x, y, (shade > 0.9 ? 2.2 : 1.3) * u, (shade > 0.9 ? 1.6 : 1.1) * u);
    }
    for (let i = 0; i < 16; i++) {
      const x = rand() * W;
      const y = sandY(x) + 18 * u + rand() * 70 * u;
      g.fillStyle = rand() > 0.5 ? "#b8894e" : "#8d6840";
      g.beginPath();
      g.ellipse(x, y, (4 + rand() * 7) * u, (3 + rand() * 4) * u, rand() * 2, 0, Math.PI * 2);
      g.fill();
    }
    g.restore();

    g.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const y = sandY(x);
      if (x === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    }
    g.strokeStyle = "rgba(255, 244, 214, 0.8)";
    g.lineWidth = 2 * u;
    g.stroke();
    g.save();
    g.translate(0, 3.5 * u);
    g.strokeStyle = "rgba(70, 44, 24, 0.28)";
    g.stroke();
    g.restore();

    drawShell(g, W * 0.15, sandY(W * 0.15) + 28 * u, 8 * u, -0.4);
    drawShell(g, W * 0.66, sandY(W * 0.66) + 34 * u, 11 * u, 0.6);
    drawStarfish(g, W * 0.455, sandY(W * 0.455) + 26 * u, 16 * u, 0.3, "#e36a32");
    drawStarfish(g, W * 0.72, sandY(W * 0.72) + 48 * u, 10 * u, 1.1, "#d84d4a");
    drawUrchin(g, W * 0.235, sandY(W * 0.235) + 8 * u, 14 * u);
  }

  function drawShell(g, x, y, s, rot) {
    g.save();
    g.translate(x, y);
    g.rotate(rot);
    g.fillStyle = "#f6f1e6";
    g.beginPath();
    g.ellipse(0, 0, s * 1.45, s, -0.2, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "rgba(168, 122, 90, 0.85)";
    g.lineWidth = Math.max(0.8, s * 0.12);
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.arc(-s * 0.15, 0, s * (0.32 + i * 0.28), Math.PI * 0.25, Math.PI * 1.55);
      g.stroke();
    }
    g.restore();
  }

  function drawStarfish(g, x, y, r, rot, color) {
    g.fillStyle = color;
    g.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + i * Math.PI * 2 / 5 - Math.PI / 2;
      const b = a + Math.PI / 5;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r * 0.72;
      const qx = x + Math.cos(b) * r * 0.4;
      const qy = y + Math.sin(b) * r * 0.3;
      if (i === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
      g.lineTo(qx, qy);
    }
    g.closePath();
    g.fill();
    g.fillStyle = "rgba(255,255,255,0.28)";
    g.beginPath();
    g.arc(x, y, r * 0.16, 0, Math.PI * 2);
    g.fill();
  }

  function drawUrchin(g, x, y, r) {
    g.strokeStyle = "#2c261e";
    g.lineWidth = Math.max(1, r * 0.09);
    g.lineCap = "round";
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * Math.PI * 2;
      const len = r * (1.25 + (i % 3) * 0.16);
      g.beginPath();
      g.moveTo(x + Math.cos(a) * r * 0.35, y + Math.sin(a) * r * 0.26);
      g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len * 0.8);
      g.stroke();
    }
    const ug = g.createRadialGradient(x - r * 0.2, y - r * 0.2, r * 0.1, x, y, r);
    ug.addColorStop(0, "#5a4c3c");
    ug.addColorStop(1, "#2a241c");
    g.fillStyle = ug;
    g.beginPath();
    g.ellipse(x, y, r * 0.58, r * 0.4, 0, 0, Math.PI * 2);
    g.fill();
  }

  function drawMound(g, x, y, rx, ry, highlight, shadow) {
    const grad = g.createRadialGradient(x - rx * 0.28, y - ry * 0.45, ry * 0.1, x, y + ry * 0.2, rx);
    grad.addColorStop(0, highlight);
    grad.addColorStop(1, shadow);
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
    g.fill();
  }

  function drawDistant(g) {
    const u = unit();
    g.save();
    g.globalAlpha = 0.9;
    drawMound(g, W * 0.12, H * 0.7, 90 * u, 48 * u, "#1c86a0", "#0a455c");
    drawMound(g, W * 0.28, H * 0.73, 120 * u, 40 * u, "#176f8c", "#08384c");
    drawMound(g, W * 0.5, H * 0.71, 150 * u, 46 * u, "#1a7e98", "#0a4056");
    drawMound(g, W * 0.72, H * 0.725, 130 * u, 42 * u, "#157894", "#083648");
    drawMound(g, W * 0.9, H * 0.7, 100 * u, 50 * u, "#1b82a4", "#093e54");
    g.restore();
  }

  function drawRock(g, x, y, rx, ry) {
    g.fillStyle = "rgba(0,0,0,0.18)";
    g.beginPath();
    g.ellipse(x, y + ry * 0.72, rx * 0.85, ry * 0.28, 0, 0, Math.PI * 2);
    g.fill();
    const grad = g.createRadialGradient(x - rx * 0.35, y - ry * 0.4, ry * 0.2, x, y, rx);
    grad.addColorStop(0, "#3e646c");
    grad.addColorStop(0.45, "#243e46");
    grad.addColorStop(1, "#14262c");
    g.fillStyle = grad;
    g.beginPath();
    g.ellipse(x, y, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "rgba(170, 210, 206, 0.13)";
    g.beginPath();
    g.ellipse(x - rx * 0.28, y - ry * 0.32, rx * 0.38, ry * 0.22, -0.5, 0, Math.PI * 2);
    g.fill();
  }

  function staghorn(g, x, y, len, width, rand) {
    const u = unit();
    function rec(px, py, a, L, w, depth) {
      if (depth === 0 || L < 7 * u) {
        g.fillStyle = "#ff7a36";
        g.beginPath();
        g.arc(px, py, Math.max(1.2, w * 0.48), 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "rgba(255,220,180,0.65)";
        g.beginPath();
        g.arc(px - w * 0.1, py - w * 0.1, Math.max(0.7, w * 0.18), 0, Math.PI * 2);
        g.fill();
        return;
      }
      const x2 = px + Math.cos(a) * L;
      const y2 = py + Math.sin(a) * L;
      const grad = g.createLinearGradient(px, py, x2, y2);
      grad.addColorStop(0, "#e4bfa0");
      grad.addColorStop(0.62, "#f2d2b4");
      grad.addColorStop(1, "#ff9158");
      g.strokeStyle = grad;
      g.lineWidth = Math.max(1, w);
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(px, py);
      g.lineTo(x2, y2);
      g.stroke();
      g.strokeStyle = "rgba(255,244,230,0.35)";
      g.lineWidth = Math.max(0.6, w * 0.28);
      g.beginPath();
      g.moveTo(px + Math.cos(a + 1.2) * w * 0.18, py + Math.sin(a + 1.2) * w * 0.18);
      g.lineTo(x2, y2);
      g.stroke();
      const n = depth > 2 ? 3 : 2;
      for (let i = 0; i < n; i++) {
        const spread = (i - (n - 1) / 2) * (0.46 + rand() * 0.16);
        rec(x2, y2, a + spread + (rand() - 0.5) * 0.12, L * (0.58 + rand() * 0.1), w * 0.66, depth - 1);
      }
    }
    rec(x, y, -Math.PI / 2 + (rand() - 0.5) * 0.25, len, width, 4);
  }

  function drawBrain(g, x, y, rx, ry, rand) {
    const u = unit();
    rx = Math.max(4, rx);
    ry = Math.max(4, ry);
    g.fillStyle = "rgba(0,0,0,0.16)";
    g.beginPath();
    g.ellipse(x, y + ry * 0.55, rx * 0.78, ry * 0.2, 0, 0, Math.PI * 2);
    g.fill();
    g.save();
    g.beginPath();
    g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    g.clip();
    const grad = g.createRadialGradient(x - rx * 0.35, y - ry * 0.45, ry * 0.15, x, y, rx);
    grad.addColorStop(0, "#f6c0d0");
    grad.addColorStop(0.55, "#d86b8e");
    grad.addColorStop(1, "#8a3454");
    g.fillStyle = grad;
    g.fillRect(x - rx - 2, y - ry - 2, rx * 2 + 4, ry * 2 + 4);
    const rows = Math.max(6, Math.round(ry / (7 * u)));
    for (let i = 0; i < rows; i++) {
      const yy = y - ry + ((i + 0.5) * (ry * 2)) / rows;
      g.beginPath();
      for (let px = -rx; px <= rx; px += 3) {
        const wave = Math.sin(px * 0.11 + i * 1.7) * ry * 0.07 + Math.sin(px * 0.035 + i) * 2.2 * u;
        const py = yy + wave;
        if (px === -rx) g.moveTo(x + px, py);
        else g.lineTo(x + px, py);
      }
      g.strokeStyle = "rgba(88, 24, 46, 0.55)";
      g.lineWidth = Math.max(1.1, 2.6 * u);
      g.stroke();
      g.save();
      g.translate(0, -1.6 * u);
      g.strokeStyle = "rgba(255, 228, 234, 0.32)";
      g.lineWidth = Math.max(0.6, 1.1 * u);
      g.stroke();
      g.restore();
    }
    g.restore();
    g.strokeStyle = "rgba(90, 30, 48, 0.45)";
    g.lineWidth = 1.5 * u;
    g.beginPath();
    g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    g.stroke();
    void rand;
  }

  function drawPlates(g, x, y, scale) {
    const u = unit();
    for (let i = 4; i >= 0; i--) {
      const rx = (58 - i * 7) * scale * u;
      const ry = (15 + i * 1.5) * scale * u;
      const yy = y - i * 13 * scale * u;
      const grad = g.createLinearGradient(x, yy - ry, x, yy + ry);
      grad.addColorStop(0, i % 2 ? "#f3d7c2" : "#f0c2b4");
      grad.addColorStop(0.7, "#e29a90");
      grad.addColorStop(1, "#b86a68");
      g.fillStyle = grad;
      g.beginPath();
      g.ellipse(x, yy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = "rgba(255, 232, 224, 0.55)";
      g.lineWidth = Math.max(0.8, 1.6 * u);
      g.beginPath();
      g.ellipse(x - rx * 0.05, yy - ry * 0.2, rx * 0.72, Math.max(1, ry * 0.42), -0.1, Math.PI * 1.1, Math.PI * 1.9);
      g.stroke();
      g.strokeStyle = "rgba(150, 60, 70, 0.35)";
      g.beginPath();
      g.ellipse(x, yy, rx, ry, 0, 0, Math.PI * 2);
      g.stroke();
    }
  }

  function drawSponge(g, x, y, h, w, body, rim) {
    const u = unit();
    w = Math.max(2, w);
    h = Math.max(4, h);
    const grad = g.createLinearGradient(x - w, y - h, x + w, y);
    grad.addColorStop(0, rim);
    grad.addColorStop(0.35, body);
    grad.addColorStop(1, "#6a2c14");
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(x - w, y);
    g.lineTo(x - w * 0.78, y - h);
    g.quadraticCurveTo(x, y - h - w * 0.45, x + w * 0.78, y - h);
    g.lineTo(x + w, y);
    g.closePath();
    g.fill();
    g.fillStyle = "#3a140c";
    g.beginPath();
    g.ellipse(x, y - h, w * 0.7, Math.max(1, w * 0.28), 0, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = rim;
    g.lineWidth = Math.max(1, 1.7 * u);
    g.stroke();
    g.fillStyle = "rgba(255,255,255,0.28)";
    g.beginPath();
    g.ellipse(x - w * 0.22, y - h * 0.55, w * 0.16, h * 0.18, 0, 0, Math.PI * 2);
    g.fill();
  }

  function drawFingers(g, x, y, rand) {
    const u = unit();
    const n = 8;
    for (let i = 0; i < n; i++) {
      const ox = (i - (n - 1) / 2) * 11 * u;
      const h = (34 + rand() * 58) * u;
      const lean = (rand() - 0.5) * 18 * u;
      g.strokeStyle = i % 2 ? "#e7b6e2" : "#c98bc8";
      g.lineWidth = (6 + rand() * 3.5) * u;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(x + ox * 0.25, y);
      g.quadraticCurveTo(x + ox + lean * 0.4, y - h * 0.55, x + ox * 0.7 + lean, y - h);
      g.stroke();
      g.fillStyle = "#f8e2f6";
      g.beginPath();
      g.arc(x + ox * 0.7 + lean, y - h, Math.max(1.2, g.lineWidth * 0.42), 0, Math.PI * 2);
      g.fill();
    }
  }

  function drawPolypPatch(g, x, y, rx, ry, rand) {
    const u = unit();
    g.fillStyle = "rgba(18, 70, 60, 0.35)";
    g.beginPath();
    g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    g.fill();
    for (let i = 0; i < 42; i++) {
      const a = rand() * Math.PI * 2;
      const rad = Math.sqrt(rand());
      const px = x + Math.cos(a) * rx * rad;
      const py = y + Math.sin(a) * ry * rad;
      g.fillStyle = "#7dcea0";
      g.beginPath();
      g.arc(px, py, 2.3 * u, 0, Math.PI * 2);
      g.fill();
      g.fillStyle = "#f4fff0";
      g.beginPath();
      g.arc(px, py, 0.8 * u, 0, Math.PI * 2);
      g.fill();
    }
  }

  function buildLayers() {
    const u = unit();
    const rand = mulberry32(0x51eef);
    midC = makeCanvas();
    foreC = makeCanvas();
    const m = midC.getContext("2d");
    m.setTransform(dpr, 0, 0, dpr, 0, 0);
    const f = foreC.getContext("2d");
    f.setTransform(dpr, 0, 0, dpr, 0, 0);

    drawSand(m, rand);
    drawDistant(m);

    drawRock(m, W * 0.08, sandY(W * 0.08) - 8 * u, 78 * u, 32 * u);
    drawRock(m, W * 0.18, sandY(W * 0.18) - 4 * u, 64 * u, 26 * u);
    drawRock(m, W * 0.33, sandY(W * 0.33) + 2 * u, 90 * u, 28 * u);
    drawRock(m, W * 0.52, sandY(W * 0.52) - 2 * u, 70 * u, 24 * u);
    drawRock(m, W * 0.7, sandY(W * 0.7) + 4 * u, 100 * u, 30 * u);
    drawRock(m, W * 0.88, sandY(W * 0.88) - 6 * u, 80 * u, 28 * u);

    drawPlates(m, W * 0.145, sandY(W * 0.145) - 6 * u, 1);
    drawBrain(m, W * 0.305, sandY(W * 0.305) - 18 * u, 86 * u, 50 * u, rand);
    staghorn(m, W * 0.075, sandY(W * 0.075) - 10 * u, 210 * u, 9 * u, rand);
    staghorn(m, W * 0.25, sandY(W * 0.25) - 8 * u, 150 * u, 7 * u, rand);
    staghorn(m, W * 0.63, sandY(W * 0.63) - 6 * u, 188 * u, 8 * u, rand);

    const spongeBase = sandY(W * 0.5) - 4 * u;
    drawSponge(m, W * 0.48, spongeBase, 78 * u, 11 * u, "#e36a28", "#ffb15a");
    drawSponge(m, W * 0.515, spongeBase + 4 * u, 112 * u, 13 * u, "#f0a030", "#ffe09a");
    drawSponge(m, W * 0.545, spongeBase + 2 * u, 64 * u, 9 * u, "#d85a22", "#ffc07a");

    scene = {
      weeds: [

        { nx: 0.965, lift: 0, len: 270, spread: 1.22, base: -Math.PI / 2 - 0.48, ribs: 13, front: true, color: "#a34374", membrane: "rgba(176, 70, 120, 0.16)", phase: 1.2 },
        { nx: 0.845, lift: 18, len: 168, spread: 0.98, base: -Math.PI / 2 - 0.25, ribs: 10, front: false, color: "#8a4684", membrane: "rgba(150, 80, 150, 0.15)", phase: 2.1 },

  function drawWeed(g, w, t) {
    const u = unit();
    const x = w.nx * W;
    const y = sandY(x);
    const sway = Math.sin(t * 0.85 + w.phase);
    const h = w.h * u;
    g.strokeStyle = w.c;
    g.lineCap = "round";
    g.lineWidth = w.thick * u;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + sway * w.amp * u, y - h * 0.55, x + sway * w.amp * 1.35 * u, y - h);
    g.stroke();
    g.strokeStyle = "rgba(190, 255, 200, 0.35)";
    g.lineWidth = Math.max(0.6, w.thick * u * 0.35);
    g.beginPath();
    g.moveTo(x + 1, y - 4 * u);
    g.quadraticCurveTo(x + sway * w.amp * u, y - h * 0.55, x + sway * w.amp * 1.2 * u, y - h + 2 * u);
    g.stroke();
    g.strokeStyle = "#14583a";
    g.globalAlpha = 0.9;
    g.lineWidth = (w.thick * 0.7) * u;
    g.beginPath();
    g.moveTo(x + 6 * u, y);
    g.quadraticCurveTo(x + 8 * u + sway * w.amp * 0.6 * u, y - h * 0.38, x + sway * w.amp * 0.9 * u, y - h * 0.62);
    g.stroke();
    g.globalAlpha = 1;
  }

  function drawAnemone(g, a, t, pass) {
    const u = unit();
    const x = a.nx * W;
    const y = sandY(x) - 4 * u;
    if (pass === "base") {
      const grad = g.createRadialGradient(x - 6 * u, y - 4 * u, 4, x, y, a.rx * u);
      grad.addColorStop(0, "#e9899c");
      grad.addColorStop(1, "#a14d64");
      g.fillStyle = grad;
      g.beginPath();
      g.ellipse(x, y, a.rx * u, a.ry * u, 0, 0, Math.PI * 2);
      g.fill();
      return;
    }
    const n = a.n;
    for (let i = 0; i < n; i++) {
      const front = i % 2 === 0;
      if ((pass === "back" && front) || (pass === "front" && !front)) continue;
      const u0 = n === 1 ? 0.5 : i / (n - 1);
      const ang = -Math.PI + 0.38 + u0 * (Math.PI - 0.76);
      const sway = Math.sin(t * 1.35 + i * 0.65 + a.phase) * 0.22;
      const len = a.len * u * (0.72 + (i % 3) * 0.12);
      const x1 = x + Math.cos(ang) * a.rx * u * 0.2;
      const y1 = y + Math.sin(ang) * a.ry * u * 0.15;
      const x2 = x + Math.cos(ang + sway) * len;
      const y2 = y + Math.sin(ang + sway) * len;
      const cx = x + Math.cos(ang + sway * 0.4) * len * 0.5;
      const cy = y + Math.sin(ang) * len * 0.42;
      g.strokeStyle = i % 3 === 0 ? "#ffe0ea" : "#ffb4c8";
      g.lineWidth = (front ? 2.4 : 2) * u;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(x1, y1);
      g.quadraticCurveTo(cx, cy, x2, y2);
      g.stroke();
      g.fillStyle = i % 2 ? "#ff8d62" : "#ffb08a";
      g.beginPath();
      g.arc(x2, y2, (front ? 2.8 : 2.3) * u, 0, Math.PI * 2);
      g.fill();
    }
  }

  function anemonePoint(a) {
    const u = unit();
    return { x: a.nx * W, y: sandY(a.nx * W) - 4 * u };
  }

  function drawClown(g, c, t) {
    const u = unit();
    const host = scene.anemones[c.host];
    const p = anemonePoint(host);
    const bobX = Math.sin(t * 0.85 + c.phase) * 8 * u;
    const bobY = Math.cos(t * 1.25 + c.phase) * 4.5 * u;
    const wag = Math.sin(t * 4 + c.phase) * 0.35;
    const L = c.len * u;
    const x = p.x + c.ox * u + bobX;
    const y = p.y + c.oy * u + bobY;
    g.save();
    g.translate(x, y);
    g.scale(c.dir, 1);
    g.rotate(wag);
    g.fillStyle = "#ff8a2a";
    g.beginPath();
    g.moveTo(-L * 0.72, 0);
    g.lineTo(-L * 1.28, -L * 0.36);
    g.lineTo(-L * 1.05, 0);
    g.lineTo(-L * 1.28, L * 0.36);
    g.closePath();
    g.fill();
    g.fillStyle = "#ff7418";
    g.beginPath();
    g.ellipse(0, 0, L, L * 0.46, 0, 0, Math.PI * 2);
    g.fill();
    g.save();
    g.beginPath();
    g.ellipse(0, 0, L, L * 0.46, 0, 0, Math.PI * 2);
    g.clip();
    g.fillStyle = "#fffef8";
    for (const bx of [-0.42, 0.12, 0.52]) {
      g.fillRect(bx * L - L * 0.09, -L * 0.5, L * 0.16, L);
    }
    g.restore();
    g.strokeStyle = "rgba(20,10,8,0.75)";
    g.lineWidth = Math.max(0.7, L * 0.07);
    g.beginPath();
    g.ellipse(0, 0, L, L * 0.46, 0, 0, Math.PI * 2);
    g.stroke();
    g.fillStyle = "#fff";
    g.beginPath();
    g.arc(L * 0.55, -L * 0.06, L * 0.13, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#1a120e";
    g.beginPath();
    g.arc(L * 0.58, -L * 0.06, L * 0.065, 0, Math.PI * 2);
    g.fill();
    g.restore();
  }

  function drawFan(g, fan, t) {
    const u = unit();
    const x = fan.nx * W;
    const y = sandY(x) - fan.lift * u;
    const sway = Math.sin(t * 0.65 + fan.phase) * 0.045;
    const n = fan.ribs;
    const ribs = [];
    for (let i = 0; i < n; i++) {
      const u0 = n === 1 ? 0.5 : i / (n - 1);
      const a = fan.base + (u0 - 0.5) * fan.spread + sway * (u0 - 0.5) * 4;
      const len = fan.len * u * (0.7 + Math.sin(u0 * Math.PI) * 0.3);
      const x2 = x + Math.cos(a) * len;
      const y2 = y + Math.sin(a) * len;
      const mx = (x + x2) / 2 + Math.cos(a + Math.PI / 2) * Math.sin(t * 0.85 + i + fan.phase) * 4 * u;
      const my = (y + y2) / 2;
      ribs.push({ x2, y2, mx, my });
    }
    g.beginPath();
    g.moveTo(x, y);
    for (const r of ribs) g.lineTo(r.x2, r.y2);
    g.closePath();
    g.fillStyle = fan.membrane;
    g.fill();
    g.strokeStyle = fan.color;
    g.lineCap = "round";
    g.lineJoin = "round";
    for (let i = 0; i < ribs.length; i++) {
      const r = ribs[i];
      g.lineWidth = (i === 0 || i === ribs.length - 1 ? 2.5 : 1.25) * u;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(r.mx, r.my, r.x2, r.y2);
      g.stroke();
    }
    g.lineWidth = Math.max(0.6, 0.8 * u);
    g.globalAlpha = 0.75;
    for (const frac of [0.42, 0.7]) {
      g.beginPath();
      for (let i = 0; i < ribs.length; i++) {
        const r = ribs[i];
        const px = x + (r.x2 - x) * frac;
        const py = y + (r.y2 - y) * frac;
        if (i === 0) g.moveTo(px, py);
        else g.lineTo(px, py);
      }
      g.stroke();
    }
    g.globalAlpha = 1;
  }

  function drawEel(g, t) {
    const u = unit();
    const x = W * 0.118;
    const y = sandY(x) - 16 * u;
    g.fillStyle = "#07141c";
    g.beginPath();
    g.ellipse(x, y, 16 * u, 11 * u, -0.35, 0, Math.PI * 2);
    g.fill();
    const sway = Math.sin(t * 0.8) * 9 * u;
    const sway2 = Math.sin(t * 1.35 + 1) * 4 * u;
    g.lineCap = "round";
    g.strokeStyle = "#74883a";
    g.lineWidth = 12 * u;
    g.beginPath();
    g.moveTo(x + 2 * u, y - 2 * u);
    g.bezierCurveTo(x + 20 * u, y - 30 * u, x - 8 * u + sway, y - 62 * u, x + 24 * u + sway, y - 96 * u);
    g.stroke();
    g.strokeStyle = "#d5e48a";
    g.lineWidth = 1.7 * u;
    g.beginPath();
    g.moveTo(x + 8 * u, y - 28 * u);
    g.lineTo(x + 14 * u, y - 33 * u);
    g.moveTo(x + 4 * u + sway * 0.3, y - 58 * u);
    g.lineTo(x + 10 * u + sway * 0.3, y - 64 * u);
    g.stroke();
    const hx = x + 30 * u + sway;
    const hy = y - 102 * u + sway2;
    g.fillStyle = "#8ea24a";
    g.beginPath();
    g.ellipse(hx, hy, 15 * u, 8 * u, -0.45, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = "#22300e";
    g.lineWidth = 1 * u;
    g.beginPath();
    g.moveTo(hx + 10 * u, hy);
    g.lineTo(hx + 16 * u, hy + 1.5 * u);
    g.stroke();
    g.fillStyle = "#f4f8d4";
    g.beginPath();
    g.arc(hx + 5 * u, hy - 2.4 * u, 2.2 * u, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#1c200e";
    g.beginPath();
    g.arc(hx + 5.8 * u, hy - 2.3 * u, 1.05 * u, 0, Math.PI * 2);
    g.fill();
  }

  function drawCrab(g, t) {
    const u = unit();
    const baseX = scene.crab.nx * W;
    const y = sandY(baseX) + 30 * u;
    const scuttle = Math.sin(t * 1.5 + scene.crab.phase) * 16 * u;
    const x = baseX + scuttle;
    const s = 7 * u;
    g.strokeStyle = "#e24b32";
    g.lineWidth = 1.25 * u;
    g.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const ly = (i - 1.5) * s * 0.42;
      const lift = Math.sin(t * 7 + i) * s * 0.45;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + 6 * u, y + ly, x + 11 * u + lift, y + ly * 1.1);
      g.moveTo(x, y);
      g.quadraticCurveTo(x - 6 * u, y + ly, x - 11 * u - lift, y + ly * 1.1);
      g.stroke();
    }
    g.strokeStyle = "#ffb199";
    g.lineWidth = 1.4 * u;
    g.beginPath();
    g.moveTo(x + s * 0.4, y - s * 0.1);
    g.quadraticCurveTo(x + s * 1.5, y - s * 1.1, x + s * 2.1, y - s * 0.2);
    g.moveTo(x - s * 0.4, y - s * 0.1);
    g.quadraticCurveTo(x - s * 1.5, y - s * 1.1, x - s * 2.1, y - s * 0.2);
    g.stroke();
    g.fillStyle = "#ef5a3c";
    g.beginPath();
    g.ellipse(x, y, s * 1.15, s * 0.72, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#ffd0c4";
    g.beginPath();
    g.ellipse(x, y - s * 0.15, s * 0.45, s * 0.22, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#ef5a3c";
    g.beginPath();
    g.arc(x - s * 0.45, y - s * 0.85, s * 0.2, 0, Math.PI * 2);
    g.arc(x + s * 0.45, y - s * 0.85, s * 0.2, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#2a0c08";
    g.beginPath();
    g.arc(x - s * 0.45, y - s * 0.85, s * 0.08, 0, Math.PI * 2);
    g.arc(x + s * 0.45, y - s * 0.85, s * 0.08, 0, Math.PI * 2);
    g.fill();
  }

  function drawSchoolFish(g, f, t) {
    const u = unit();
    const depth = clamp((f.y / H - 0.12) / 0.72, 0, 1);
    const L = f.lenK * f.sizeK * (0.84 + depth * 0.26) * u;
    const sp = Math.hypot(f.vx, f.vy) / Math.max(0.001, u);
    const scatter = mode() === "scatter";
    const wag = Math.sin(t * (6.5 + Math.min(sp, 280) * 0.025) + f.phase) * (scatter ? 1.35 : 1);
    const dir = f.dir;
    const pitch = Math.atan2(f.vy, Math.abs(f.vx));
    g.save();
    g.translate(f.x, f.y);
    g.scale(dir, 1);
    g.rotate(pitch);
    const squash = 1 - Math.min(0.16, Math.abs(f.angVel) * 0.035);
    g.scale(1, squash);
    g.globalAlpha = 0.8 + f.sizeK * 0.16;

    const tg = g.createLinearGradient(-L * 0.4, 0, -L * 1.25, wag * L * 0.2);
    tg.addColorStop(0, "#ffe58a");
    tg.addColorStop(1, "#ffb20a");
    g.fillStyle = tg;
    g.beginPath();
    const ty = wag * L * 0.36;
    g.moveTo(-L * 0.5, 0);
    g.quadraticCurveTo(-L * 0.98, ty * 0.25, -L * 1.28, -L * 0.38 + ty);
    g.quadraticCurveTo(-L * 0.8, ty * 0.12, -L * 0.58, 0);
    g.quadraticCurveTo(-L * 0.8, ty * 0.12, -L * 1.28, L * 0.38 + ty);
    g.quadraticCurveTo(-L * 0.98, ty * 0.2, -L * 0.5, 0);
    g.fill();

    g.beginPath();
    g.moveTo(L * 0.82, 0);
    g.bezierCurveTo(L * 0.58, -L * 0.18, L * 0.12, -L * 0.32, -L * 0.18, -L * 0.2);
    g.bezierCurveTo(-L * 0.46, -L * 0.12, -L * 0.58, -L * 0.04, -L * 0.66, 0);
    g.bezierCurveTo(-L * 0.58, L * 0.05, -L * 0.4, L * 0.16, -L * 0.12, L * 0.2);
    g.bezierCurveTo(L * 0.22, L * 0.3, L * 0.58, L * 0.16, L * 0.82, 0);
    g.closePath();
    const bg = g.createLinearGradient(0, -L * 0.32, 0, L * 0.3);
    bg.addColorStop(0, f.col.dorsal);
    bg.addColorStop(0.4, f.col.mid);
    bg.addColorStop(0.68, f.col.belly);
    bg.addColorStop(1, f.col.shade);
    g.fillStyle = bg;
    g.fill();
    g.strokeStyle = "rgba(6, 40, 52, 0.38)";
    g.lineWidth = Math.max(0.6, L * 0.035);
    g.stroke();

    g.strokeStyle = "rgba(255, 210, 60, 0.95)";
    g.lineWidth = Math.max(0.8, L * 0.055);
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(L * 0.46, L * 0.02);
    g.quadraticCurveTo(-L * 0.05, L * 0.09, -L * 0.55, 0);
    g.stroke();

    g.fillStyle = f.col.dorsal;
    g.beginPath();
    g.moveTo(L * 0.2, -L * 0.14);
    g.quadraticCurveTo(0, -L * 0.44 - wag * L * 0.05, -L * 0.32, -L * 0.12);
    g.quadraticCurveTo(-L * 0.05, -L * 0.18, L * 0.16, -L * 0.12);
    g.fill();

    g.beginPath();
    g.moveTo(-L * 0.02, L * 0.12);
    g.quadraticCurveTo(-L * 0.15, L * 0.34, -L * 0.36, L * 0.1);
    g.quadraticCurveTo(-L * 0.16, L * 0.14, -L * 0.02, L * 0.12);
    g.fill();

    const flap = Math.sin(t * 13 + f.phase);
    g.fillStyle = "rgba(186, 244, 232, 0.5)";
    g.beginPath();
    g.moveTo(L * 0.12, L * 0.03);
    g.quadraticCurveTo(-L * 0.02, L * 0.24 + flap * L * 0.05, -L * 0.24, L * 0.02);
    g.closePath();
    g.fill();

    const glint = 0.2 + Math.sin(t * 3.1 + f.phase) * 0.1;
    g.fillStyle = "rgba(255,255,255," + glint + ")";
    g.beginPath();
    g.ellipse(L * 0.16, -L * 0.08, L * 0.24, L * 0.055, -0.4, 0, Math.PI * 2);
    g.fill();

    g.strokeStyle = "rgba(10, 50, 60, 0.35)";
    g.lineWidth = Math.max(0.6, L * 0.04);
    g.beginPath();
    g.moveTo(L * 0.22, -L * 0.07);
    g.quadraticCurveTo(L * 0.16, 0, L * 0.24, L * 0.1);
    g.stroke();

    g.fillStyle = "#f7fffb";
    g.beginPath();
    g.arc(L * 0.5, -L * 0.02, Math.max(0.8, L * 0.075), 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#142228";
    g.beginPath();
    g.arc(L * 0.525, -L * 0.018, Math.max(0.5, L * 0.04), 0, Math.PI * 2);
    g.fill();
    g.fillStyle = "#ffffff";
    g.beginPath();
    g.arc(L * 0.505, -L * 0.034, Math.max(0.4, L * 0.016), 0, Math.PI * 2);
    g.fill();
    g.restore();

    if (scatter) {
      g.strokeStyle = "rgba(190, 240, 245, 0.16)";
      g.lineWidth = Math.max(1, 2 * u);
      g.beginPath();
      g.moveTo(f.x, f.y);
      g.lineTo(f.x - f.vx * 0.07, f.y - f.vy * 0.07);
      g.stroke();
    }
  }

  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#9edcea");
    g.addColorStop(0.07, "#2f93b0");
    g.addColorStop(0.26, "#0c628c");
    g.addColorStop(0.5, "#084e74");
    g.addColorStop(0.74, "#06344f");
    g.addColorStop(1, "#041c2e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const a = ctx.createRadialGradient(W * 0.32, H * 0.08, 10, W * 0.35, H * 0.2, W * 0.48);
    a.addColorStop(0, "rgba(190, 245, 255, 0.28)");
    a.addColorStop(1, "rgba(190, 245, 255, 0)");
    ctx.fillStyle = a;
    ctx.fillRect(0, 0, W, H);
    const b = ctx.createRadialGradient(W * 0.72, H * 0.02, 8, W * 0.7, H * 0.18, W * 0.36);
    b.addColorStop(0, "rgba(170, 230, 255, 0.16)");
    b.addColorStop(1, "rgba(170, 230, 255, 0)");
    ctx.fillStyle = b;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawRays(t) {
    const specs = [
      [0.12, 0.035],
      [0.27, 0.022],
      [0.43, 0.05],
      [0.58, 0.028],
      [0.74, 0.042],
      [0.9, 0.026],
    ];
    ctx.save();
    for (let i = 0; i < specs.length; i++) {
      const pulse = 0.028 + Math.sin(t * 0.55 + i * 1.3) * 0.01;
      const x = specs[i][0] * W + Math.sin(t * 0.18 + i) * 22;
      const topW = specs[i][1] * W;
      const reach = H * (0.58 + (i % 3) * 0.05);
      const shift = Math.sin(t * 0.13 + i * 0.7) * 46;
      ctx.fillStyle = "rgba(236, 255, 255, " + pulse + ")";
      ctx.beginPath();
      ctx.moveTo(x - topW * 0.4, 0);
      ctx.lineTo(x + topW, 0);
      ctx.lineTo(x + topW * 3.1 + shift, reach);
      ctx.lineTo(x - topW * 0.6 + shift, reach);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCaustics(t, alphaScale) {
    ctx.save();
    ctx.globalCompositeOperation = "screen";
    const step = Math.max(28, Math.min(W, H) / 28);
    for (let y = step; y < H * 0.86; y += step) {
      for (let x = step * 0.5; x < W; x += step) {
        const n1 = Math.sin(x * 0.031 + t * 1.05);
        const n2 = Math.sin(y * 0.038 - t * 0.86);
        const n3 = Math.sin((x + y) * 0.02 + t * 0.62);
        const v = n1 + n2 + n3;
        if (v < 1.05) continue;
        const a = Math.min(0.2, (v - 1.05) * 0.09) * alphaScale;
        ctx.fillStyle = "rgba(214, 255, 255, " + a + ")";
        ctx.beginPath();
        ctx.ellipse(x + n2 * 6, y + n1 * 4, 16 + n3 * 6, 6 + n1 * 2, n3 * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSurface(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.13);
    g.addColorStop(0, "rgba(214, 250, 255, 0.55)");
    g.addColorStop(0.4, "rgba(140, 220, 235, 0.14)");
    g.addColorStop(1, "rgba(140, 220, 235, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H * 0.13);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const y = 9 + Math.sin(x * 0.02 + t * 1.35) * 2.6 + Math.sin(x * 0.008 - t * 0.8) * 1.8;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.62)";
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = 16 + Math.sin(x * 0.015 + t * 0.9 + 1) * 2.2;
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  function drawVignette() {
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.45, Math.min(W, H) * 0.28, W * 0.5, H * 0.5, Math.min(W, H) * 0.72);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0, 12, 24, 0.28)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    const shift = Math.sin(time * 0.15) * W * 0.02;
    ctx.save();
    ctx.globalAlpha = 0.045;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(shift, 0);
    ctx.lineTo(W * 0.16 + shift, 0);
    ctx.lineTo(W * 0.05 + shift, H);
    ctx.lineTo(-W * 0.04, H);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function initSchool() {
    const u = unit();
    const rand = mulberry32(0xf15b);
    anchor.x = W * 0.4;
    anchor.y = H * 0.34;
    heading = -0.08;
    preferred = heading;
    school = [];
    const cruise = 150 * u;
    for (let i = 0; i < 54; i++) {
      const p = formationPoint(i, u);
      school.push({
        x: p.x,
        y: p.y,
        vx: Math.cos(heading) * cruise + (rand() - 0.5) * 8 * u,
        vy: Math.sin(heading) * cruise + (rand() - 0.5) * 8 * u,
        lenK: 26 + rand() * 12,
        sizeK: 0.84 + rand() * 0.32,
        phase: rand() * Math.PI * 2,
        slot: i,
        dir: 1,
        pitch: 0,
        angVel: 0,
        bx: 1,
        by: 0,
        col: PALETTES[i % PALETTES.length],
      });
    }
  }

  function spawnBubble(x, y, big) {
    const rand = Math.random();
    bubbles.push({
      x: x,
      y: y,
      rK: big ? 3.2 + rand * 4.2 : 1.1 + Math.random() * 2.4,
      grow: 0,
      speedK: 16 + Math.random() * 34,
      wob: Math.random() * Math.PI * 2,
      drift: 0.8 + Math.random() * 1.6,
      ampK: 6 + Math.random() * 12,
    });
    if (bubbles.length > 70) bubbles.splice(0, bubbles.length - 70);
  }

  function initParticles() {
    bubbles = [];
    snow = [];
    for (let i = 0; i < 24; i++) {
      spawnBubble(Math.random() * W, Math.random() * H * 0.85, Math.random() > 0.8);
    }
    for (let i = 0; i < 80; i++) {
      snow.push({
        x: Math.random() * W,
        y: Math.random() * H,
        sK: 0.6 + Math.random() * 1.6,
        vyK: 8 + Math.random() * 18,
        a: 0.12 + Math.random() * 0.35,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function resize() {
    const pw = W;
    const ph = H;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    if (W < 2 || H < 2) return;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildLayers();
    if (!school.length) {
      initSchool();
      initParticles();
    } else if (pw > 0 && ph > 0) {
      const sx = W / pw;
      const sy = H / ph;
      const sv = (sx + sy) * 0.5;
      for (const f of school) {
        f.x *= sx;
        f.y *= sy;
        f.vx *= sv;
        f.vy *= sv;
      }
      anchor.x *= sx;
      anchor.y *= sy;
      for (const b of bubbles) {
        b.x *= sx;
        b.y *= sy;
      }
      for (const s of snow) {
        s.x *= sx;
        s.y *= sy;
      }
    }
  }

  function enterMode(id) {
    const u = unit();
    if (id === "turn") {
      const fits = (h) => {
        const look = Math.min(W, H) * 0.2;
        const x = anchor.x + Math.cos(h) * look;
        const y = anchor.y + Math.sin(h) * look * 0.6;
        return x > W * 0.22 && x < W * 0.78 && y > H * 0.22 && y < H * 0.52;
      };
      const candidates = [];
      for (const amount of [1.05, 1.4, 1.75]) {
        for (const dir of [-1, 1]) {
          const h = angNorm(heading + dir * amount);
          candidates.push({ h: h, dir: dir, amount: amount, ok: fits(h) });
        }
      }
      const good = candidates.filter((c) => c.ok);
      let pick = null;
      if (good.length) {
        const prefer = good.filter((c) => c.dir === -lastTurnDir);
        const pool = prefer.length ? prefer : good;
        pool.sort((a, b) => b.amount - a.amount);
        pick = pool[0];
      } else {
        let bestScore = Infinity;
        for (const c of candidates) {
          const x = anchor.x + Math.cos(c.h) * Math.min(W, H) * 0.18;
          const y = anchor.y + Math.sin(c.h) * Math.min(W, H) * 0.12;
          let score = Math.hypot(x - W * 0.5, y - H * 0.32);
          if (Math.abs(angDiff(c.h, heading)) < 0.85) score += 5000;
          if (score < bestScore) {
            bestScore = score;
            pick = c;
          }
        }
      }
      turnTarget = pick.h;
      lastTurnDir = pick.dir;
    } else if (id === "scatter") {
      for (const f of school) {
        const a = Math.random() * Math.PI * 2;
        f.bx = Math.cos(a);
        f.by = Math.sin(a);
        f.vx = f.bx * 300 * u + (Math.random() - 0.5) * 40 * u;
        f.vy = f.by * 230 * u + (Math.random() - 0.5) * 40 * u;
      }
      for (let i = 0; i < 16; i++) {
        spawnBubble(centroid.x + (Math.random() - 0.5) * 40 * u, centroid.y + (Math.random() - 0.5) * 30 * u, true);
      }
    } else if (id === "reform") {
      for (const f of school) {
        f.vx *= 0.42;
        f.vy *= 0.42;
      }
    }
  }

  function updateMode(dt) {
    modeTime += dt;
    const dur = CYCLE[modeIdx].dur;
    if (modeTime >= dur) {
      modeTime = 0;
      modeIdx = (modeIdx + 1) % CYCLE.length;
      enterMode(CYCLE[modeIdx].id);
    }
  }

  function updateHeading(dt) {
    const id = mode();
    if (id === "group" || id === "reform") {
      const k = id === "reform" ? clamp((modeTime - 0.7) / 2.2, 0, 1) : 1;
      preferred = angNorm(preferred + Math.sin(time * 0.52) * 0.2 * dt * k);
    } else if (id === "turn") {
      preferred = turnTarget;
    }
    const minX = W * 0.24;
    const maxX = W * 0.76;
    const minY = H * 0.24;
    const maxY = H * 0.48;
    let px = 0;
    let py = 0;
    if (anchor.x < minX) px = (minX - anchor.x) / (W * 0.08);
    else if (anchor.x > maxX) px = -(anchor.x - maxX) / (W * 0.08);
    if (anchor.y < minY) py = (minY - anchor.y) / (H * 0.07);
    else if (anchor.y > maxY) py = -(anchor.y - maxY) / (H * 0.07);
    const pressure = clamp(Math.hypot(px, py), 0, 1);
    let target = preferred;
    let rate = id === "turn" ? 0.95 : id === "scatter" ? 0.15 : 0.5;
    if (pressure > 0.08 && id !== "scatter") {
      const tx = Math.cos(preferred) + px * 3.2;
      const ty = Math.sin(preferred) + py * 3.2;
      target = Math.atan2(ty, tx);
      rate = Math.max(rate, 1.1 + pressure * 2.4);
    }
    heading = approachAng(heading, target, rate * dt);
  }

  function updateAnchor(dt) {
    const u = unit();
    const id = mode();
    if (id !== "scatter") {
      let spd = 150;
      if (id === "turn") spd = 158;
      if (id === "reform") spd = 32 + 118 * clamp(modeTime / 2.4, 0, 1);
      anchor.x += Math.cos(heading) * spd * u * dt;
      anchor.y += Math.sin(heading) * spd * u * dt;
      anchor.y += Math.sin(time * 0.33) * 8 * u * dt;
    }
    if (id === "reform") {
      const pull = 1 - clamp(modeTime / 3.2, 0, 1);
      const gain = Math.min(1, dt * (2.5 * pull + 0.3));
      anchor.x += (centroid.x - anchor.x) * gain;
      anchor.y += (centroid.y - anchor.y) * gain;
    } else if (id === "scatter") {
      anchor.x += (centroid.x - anchor.x) * dt * 0.12;
      anchor.y += (centroid.y - anchor.y) * dt * 0.12;
    }
    anchor.x = clamp(anchor.x, W * 0.18, W * 0.82);
    anchor.y = clamp(anchor.y, H * 0.2, H * 0.56);
  }

  function updateFish(dt) {
    const u = unit();
    const id = mode();
    const n = school.length;
    let cx = 0;
    let cy = 0;
    for (const f of school) {
      cx += f.x;
      cy += f.y;
    }
    centroid.x = cx / n;
    centroid.y = cy / n;

    let cruise = 152 * u;
    if (id === "turn") cruise = 164 * u;
    else if (id === "scatter") cruise = 340 * u;
    else if (id === "reform") cruise = (188 - 30 * clamp(modeTime / 2.8, 0, 1)) * u;
    const sepR = (id === "scatter" ? 78 : 32) * u;
    const gain = id === "turn" ? 4.2 : id === "scatter" ? 1.6 : id === "reform" ? 3.8 : 3.1;

    for (const f of school) {
      let desX = 0;
      let desY = 0;
      if (id === "scatter") {
        const tx = f.x - centroid.x + f.bx * 90 * u;
        const ty = f.y - centroid.y + f.by * 70 * u;
        const d = Math.hypot(tx, ty) || 1;
        desX = (tx / d) * cruise;
        desY = (ty / d) * cruise;
      } else {
        const slot = formationPoint(f.slot, u);
        const tx = slot.x - f.x;
        const ty = slot.y - f.y;
        const d = Math.hypot(tx, ty) || 1;
        const corrCap = cruise * (id === "reform" ? 1.45 : 0.9);
        const corr = Math.min(corrCap, d * (id === "reform" ? 3.4 : 2.4));
        const head = id === "reform" ? 0.25 + 0.75 * clamp((modeTime - 0.4) / 2.2, 0, 1) : 1;
        desX = Math.cos(heading) * cruise * head + (tx / d) * corr;
        desY = Math.sin(heading) * cruise * head + (ty / d) * corr;
        desX += Math.sin(time * 1.5 + f.phase) * 12 * u;
        desY += Math.cos(time * 1.2 + f.phase * 1.4) * 9 * u;
      }

      let sx = 0;
      let sy = 0;
      for (let j = 0; j < n; j++) {
        const o = school[j];
        if (o === f) continue;
        const dx = f.x - o.x;
        const dy = f.y - o.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        if (d < sepR) {
          const push = (sepR - d) / sepR;
          sx += (dx / d) * push;
          sy += (dy / d) * push;
        }
      }
      const sm = Math.hypot(sx, sy);
      if (sm > 0) {
        const sepPush = cruise * (id === "scatter" ? 0.45 : 0.62);
        desX += (sx / sm) * sepPush;
        desY += (sy / sm) * sepPush;
      }

      const maxSp = id === "scatter" ? cruise : cruise * 1.55;
      const limited = limitVec(desX, desY, maxSp);
      desX = limited[0];
      desY = limited[1];
      const blend = Math.min(1, dt * gain);
      f.vx += (desX - f.vx) * blend;
      f.vy += (desY - f.vy) * blend;
      if (!Number.isFinite(f.vx) || !Number.isFinite(f.vy)) {
        f.vx = Math.cos(heading) * cruise;
        f.vy = Math.sin(heading) * cruise;
      }
      f.x += f.vx * dt;
      f.y += f.vy * dt;
    }

    const minSep = 18 * u;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        const a = school[i];
        const b = school[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d >= minSep) continue;
        if (d < 0.001) {
          dx = 1;
          dy = 0;
          d = 1;
        }
        const push = (minSep - d) * 0.5;
        const ux = (dx / d) * push;
        const uy = (dy / d) * push;
        a.x -= ux;
        a.y -= uy;
        b.x += ux;
        b.y += uy;
      }
    }

    const ceil = Math.max(28 * u, H * 0.06);
    for (const f of school) {
      const floor = sandY(f.x) - (id === "scatter" ? 18 : 28) * u;
      if (f.x < 10) {
        f.x = 10;
        f.vx = Math.abs(f.vx) * 0.5;
      } else if (f.x > W - 10) {
        f.x = W - 10;
        f.vx = -Math.abs(f.vx) * 0.5;
      }
      if (f.y < ceil) {
        f.y = ceil;
        f.vy = Math.abs(f.vy) * 0.45;
      } else if (f.y > floor) {
        f.y = floor;
        f.vy = -Math.abs(f.vy) * 0.4;
      }
      if (Math.abs(f.vx) > 12 * u) f.dir = f.vx < 0 ? -1 : 1;
      const pitch = Math.atan2(f.vy, Math.abs(f.vx));
      f.angVel = angDiff(pitch, f.pitch) / Math.max(dt, 0.001);
      f.pitch = pitch;
    }
  }

  function updateParticles(dt) {
    const u = unit();
    if (scene && Math.random() < dt * 1.6) {
      const v = scene.vents[Math.floor(Math.random() * scene.vents.length)];
      const x = v.nx * W + (Math.random() - 0.5) * 8 * u;
      spawnBubble(x, sandY(x) - v.lift * u, Math.random() > 0.7);
    }
    for (const b of bubbles) {
      b.wob += dt * b.drift;
      b.grow = Math.min(2.2, b.grow + dt * 0.18);
      b.y -= b.speedK * u * dt;
      b.x += Math.sin(b.wob) * b.ampK * u * dt;
      if (b.y < 10) {
        b.x = W * (0.06 + Math.random() * 0.88);
        b.y = sandY(b.x) - (8 + Math.random() * 30) * u;
        b.grow = 0;
      }
    }
    for (const s of snow) {
      s.y -= s.vyK * u * dt * 0.35;
      s.x += Math.sin(time * 0.25 + s.phase) * 8 * u * dt;
      if (s.y < -6) {
        s.y = H + 4;
        s.x = Math.random() * W;
      }
      if (s.x < -6) s.x = W + 4;
      if (s.x > W + 6) s.x = -4;
    }
  }

  function drawFrame() {
    drawWater();
    drawRays(time);
    drawCaustics(time, 1);
    if (midC) ctx.drawImage(midC, 0, 0, W, H);
    drawCaustics(time * 0.9 + 2, 0.45);

    ctx.save();
    for (const s of snow) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = "#e7fbff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.sK * unit(), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    if (scene) {
      for (const w of scene.weeds) drawWeed(ctx, w, time);
      for (const a of scene.anemones) {
        drawAnemone(ctx, a, time, "base");
        drawAnemone(ctx, a, time, "back");
      }
      for (const c of scene.clowns) drawClown(ctx, c, time);
      for (const a of scene.anemones) drawAnemone(ctx, a, time, "front");
      drawEel(ctx, time);
      for (const fan of scene.fans) {
        if (!fan.front) drawFan(ctx, fan, time);
      }
    }

    school.sort((a, b) => a.y - b.y);
    for (const f of school) drawSchoolFish(ctx, f, time);

    if (foreC) ctx.drawImage(foreC, 0, 0, W, H);
    if (scene) {
      for (const fan of scene.fans) {
        if (fan.front) drawFan(ctx, fan, time);
      }
      drawCrab(ctx, time);
    }

    const u = unit();
    for (const b of bubbles) {
      const r = Math.max(0.6, (b.rK + b.grow) * u);
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.48)";
      ctx.lineWidth = Math.max(0.6, r * 0.22);
      ctx.stroke();
      ctx.beginPath();
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.lineWidth = Math.max(0.6, r * 0.18);
      ctx.arc(b.x - r * 0.28, b.y - r * 0.28, Math.max(0.4, r * 0.32), Math.PI * 1.05, Math.PI * 1.75);
      ctx.stroke();
    }

    drawSurface(time);
    drawVignette();
  }

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    time += dt;
    if (W > 2 && H > 2 && school.length) {
      updateMode(dt);
      updateHeading(dt);
      updateAnchor(dt);
      updateFish(dt);
      updateParticles(dt);
      drawFrame();
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
