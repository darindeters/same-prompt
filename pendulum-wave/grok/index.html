<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendulum Wave</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #07081a;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  canvas {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #07081a;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

/* Fifteen pendulums released together. In one cycle the longest
   completes BASE swings and each neighbor completes one more, so
   they realign every CYCLE seconds. Lengths follow T = 2π√(L/g). */
const N = 15;
const CYCLE = 60;
const BASE = 51;
const SHORT_RATIO = (BASE / (BASE + N - 1)) ** 2;
const PREROLL = 0.06;

const HUES = [3, 20, 38, 54, 76, 98, 124, 150, 170, 190, 212, 234, 256, 280, 312];

const pendulums = Array.from({ length: N }, (_, i) => {
  const swings = BASE + i;
  return {
    omega: (Math.PI * 2 * swings) / CYCLE,
    lengthRatio: (BASE / swings) ** 2,
    hue: HUES[i],
    history: []
  };
});

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });

let cssW = 0;
let cssH = 0;
let geom = null;
let start = 0;
let lastNow = 0;

function computeGeom(W, H) {
  const bobR = Math.min(W, H) * 0.026;
  const pad = Math.max(3, Math.min(W, H) * 0.014);
  const railH = Math.max(9, Math.min(16, Math.min(W, H) * 0.015));
  const railY = Math.max(H * 0.072, railH + pad);
  const bottom = Math.max(H * 0.05, bobR * 1.6);
  const maxLen = Math.max(bobR * 4, H - railY - bottom - bobR);

  let amp = Math.min(W * 0.132, maxLen * 0.36);
  let thetaMax = 0.2;
  let spacing = W / N;
  let origin = pad;

  for (let guard = 0; guard < 10; guard++) {
    const sinT = Math.min(0.62, Math.max(0.05, amp / maxLen));
    thetaMax = Math.asin(sinT);
    const ampLong = maxLen * sinT;
    const insetL = bobR + ampLong + pad;
    const insetR = bobR + ampLong * SHORT_RATIO + pad;
    const usable = W - insetL - insetR;
    spacing = usable / (N - 1);
    origin = insetL;
    amp = ampLong;
    if (spacing < bobR * 1.55 && guard < 9) {
      amp *= 0.86;
      continue;
    }
    break;
  }

  const step = 1 - (BASE / (BASE + 1)) ** 2;
  const drawR = Math.max(4, Math.min(bobR, spacing * 0.5, maxLen * step * 0.68));

  return { W, H, bobR, drawR, pad, railH, railY, maxLen, amp, spacing, origin, thetaMax };
}

function resize() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;
  if (w < 2 || h < 2) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(w * dpr);
  const bh = Math.round(h * dpr);
  if (bw === canvas.width && bh === canvas.height && w === cssW && h === cssH) return;
  cssW = w;
  cssH = h;
  canvas.width = bw;
  canvas.height = bh;
  ctx.setTransform(bw / w, 0, 0, bh / h, 0, 0);
  geom = computeGeom(w, h);
  for (let i = 0; i < N; i++) pendulums[i].history.length = 0;
}

function hsla(h, s, l, a) {
  return "hsla(" + h + "," + s + "%," + l + "%," + a + ")";
}

function roundRect(x, y, w, h, r) {
  const radius = Math.max(0, Math.min(r, w * 0.5, h * 0.5));
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function drawBackground(g) {
  const sky = ctx.createLinearGradient(0, 0, 0, g.H);
  sky.addColorStop(0, "#090c18");
  sky.addColorStop(0.42, "#141a2e");
  sky.addColorStop(1, "#070812");
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, g.W, g.H);

  const spot = ctx.createRadialGradient(
    g.W * 0.5, g.H * 0.76, g.H * 0.02,
    g.W * 0.5, g.H * 0.72, g.H * 0.52
  );
  spot.addColorStop(0, "rgba(132, 160, 245, 0.22)");
  spot.addColorStop(0.5, "rgba(70, 92, 175, 0.08)");
  spot.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = spot;
  ctx.fillRect(0, 0, g.W, g.H);
}

function pose(p, i, t, g) {
  const len = g.maxLen * p.lengthRatio;
  const theta = g.thetaMax * Math.cos(p.omega * t);
  return {
    len: len,
    theta: theta,
    x: g.origin + g.spacing * i + len * Math.sin(theta),
    y: g.railY + len * Math.cos(theta),
    pivot: g.origin + g.spacing * i
  };
}

function drawTrail(p, r) {
  const hist = p.history;
  const count = hist.length;
  if (count < 2) return;
  for (let j = 1; j < count; j++) {
    const a = j / (count - 1);
    ctx.strokeStyle = hsla(p.hue, 100, 62, 0.04 + a * a * 0.38);
    ctx.lineWidth = Math.max(1, r * (0.12 + a * 0.95));
    ctx.beginPath();
    ctx.moveTo(hist[j - 1].x, hist[j - 1].y);
    ctx.lineTo(hist[j].x, hist[j].y);
    ctx.stroke();
  }
}

function drawString(pivot, x, y, railY, hue, r) {
  ctx.beginPath();
  ctx.moveTo(pivot, railY);
  ctx.lineTo(x, y);
  ctx.lineWidth = Math.max(3, r * 0.26);
  ctx.strokeStyle = hsla(hue, 100, 60, 0.3);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(pivot, railY);
  ctx.lineTo(x, y);
  ctx.lineWidth = Math.max(1.5, r * 0.09);
  ctx.strokeStyle = hsla(hue, 100, 80, 0.95);
  ctx.stroke();
}

function drawHalo(x, y, hue, r) {
  const halo = r * 2.4;
  const glow = ctx.createRadialGradient(x, y, r * 0.15, x, y, halo);
  glow.addColorStop(0, hsla(hue, 100, 62, 0.42));
  glow.addColorStop(0.4, hsla(hue, 100, 56, 0.13));
  glow.addColorStop(1, hsla(hue, 100, 50, 0));
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, halo, 0, Math.PI * 2);
  ctx.fill();
}

function drawBob(x, y, hue, r) {
  const body = ctx.createRadialGradient(
    x - r * 0.34, y - r * 0.4, r * 0.08,
    x, y, r
  );
  body.addColorStop(0, hsla(hue, 100, 88, 1));
  body.addColorStop(0.38, hsla(hue, 100, 62, 1));
  body.addColorStop(0.78, hsla(hue, 100, 48, 1));
  body.addColorStop(1, hsla(hue, 100, 30, 1));
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = body;
  ctx.fill();
  ctx.lineWidth = Math.max(1.25, r * 0.09);
  ctx.strokeStyle = hsla(hue, 100, 22, 1);
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = "rgba(255,255,255,0.78)";
  ctx.beginPath();
  ctx.ellipse(x - r * 0.28, y - r * 0.34, r * 0.3, r * 0.16, -0.55, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.16)";
  ctx.beginPath();
  ctx.ellipse(x + r * 0.2, y + r * 0.4, r * 0.2, r * 0.09, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawRail(g, points) {
  const overhang = Math.max(g.spacing * 0.46, g.drawR * 1.35);
  const x = g.origin - overhang;
  const w = g.spacing * (N - 1) + overhang * 2;
  const y = g.railY - g.railH;

  ctx.fillStyle = "rgba(0,0,0,0.4)";
  roundRect(x, g.railY - g.railH * 0.35, w, g.railH * 0.85, g.railH * 0.4);
  ctx.fill();

  const metal = ctx.createLinearGradient(0, y, 0, g.railY);
  metal.addColorStop(0, "#f7f8ff");
  metal.addColorStop(0.22, "#c5cce0");
  metal.addColorStop(0.5, "#6e768e");
  metal.addColorStop(0.78, "#242a3a");
  metal.addColorStop(1, "#10131c");
  roundRect(x, y, w, g.railH, g.railH * 0.46);
  ctx.fillStyle = metal;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x + g.railH * 0.4, y + g.railH * 0.28);
  ctx.lineTo(x + w - g.railH * 0.4, y + g.railH * 0.28);
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = Math.max(1, g.railH * 0.06);
  ctx.stroke();

  const collet = Math.max(3.2, g.railH * 0.34);
  for (let i = 0; i < N; i++) {
    const px = points[i].pivot;
    ctx.beginPath();
    ctx.arc(px, g.railY, collet, 0, Math.PI * 2);
    ctx.fillStyle = hsla(pendulums[i].hue, 100, 58, 1);
    ctx.fill();
    ctx.lineWidth = Math.max(1, collet * 0.18);
    ctx.strokeStyle = "rgba(255,255,255,0.7)";
    ctx.stroke();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!geom) resize();
  if (!geom) return;
  if (!start) start = now - PREROLL * 1000;
  if (lastNow && now - lastNow > 400) {
    for (let i = 0; i < N; i++) pendulums[i].history.length = 0;
  }
  lastNow = now;

  const t = (now - start) / 1000;
  const g = geom;
  const points = new Array(N);
  for (let i = 0; i < N; i++) {
    const p = pendulums[i];
    const at = pose(p, i, t, g);
    points[i] = at;
    p.history.push({ x: at.x, y: at.y, t: now });
    const cutoff = now - 480;
    while (p.history.length > 2 && p.history[0].t < cutoff) p.history.shift();
    if (p.history.length > 72) p.history.splice(0, p.history.length - 72);
  }

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  drawBackground(g);

  for (let i = N - 1; i >= 0; i--) drawTrail(pendulums[i], g.drawR);
  for (let i = N - 1; i >= 0; i--) drawHalo(points[i].x, points[i].y, pendulums[i].hue, g.drawR);
  for (let i = N - 1; i >= 0; i--) {
    drawString(points[i].pivot, points[i].x, points[i].y, g.railY, pendulums[i].hue, g.drawR);
  }
  drawRail(g, points);
  for (let i = N - 1; i >= 0; i--) drawBob(points[i].x, points[i].y, pendulums[i].hue, g.drawR);
}

resize();
requestAnimationFrame(frame);
window.addEventListener("resize", resize);
if (typeof ResizeObserver === "function") new ResizeObserver(resize).observe(canvas);
</script>
</body>
</html>
