<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pendulum Wave</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07041a;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var N = 15;              // number of pendulums
  var CYCLE = 60;          // seconds for the full pattern to repeat
  var BASE = 51;           // oscillations of the longest pendulum per cycle
  var AMPLITUDE = 0.55;    // max swing angle in radians (~31 degrees)

  var W = 0, H = 0, DPR = 1;

  // Each pendulum i completes BASE + i oscillations per CYCLE.
  var freq = [];
  for (var i = 0; i < N; i++) freq.push((BASE + i) / CYCLE);

  // Vivid saturated rainbow across the row.
  var colors = [];
  for (var k = 0; k < N; k++) {
    var hue = (k / N) * 330;
    colors.push({
      hue: hue,
      body: 'hsl(' + hue + ', 100%, 58%)',
      glow: 'hsla(' + hue + ', 100%, 60%, 0.55)',
      line: 'hsla(' + hue + ', 100%, 75%, 0.75)'
    });
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Pre-rendered background gradient
  function drawBackground() {
    var g = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.35, Math.max(W, H) * 0.8);
    g.addColorStop(0, '#1a0b3d');
    g.addColorStop(0.6, '#0b0626');
    g.addColorStop(1, '#040212');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  var start = performance.now();

  function frame(now) {
    var t = (now - start) / 1000;

    drawBackground();

    var pivotY = H * 0.08;
    var shortest = Math.min(W, H) * 0.42;
    var longest = Math.min(H * 0.86 - pivotY, Math.min(W, H) * 0.84);
    var margin = W * 0.22;
    var spacing = (W - 2 * margin) / (N - 1);
    var bobR = Math.max(7, Math.min(W, H) * 0.017);
    // Swing wide, but keep every bob inside the window.
    var amp = Math.min(AMPLITUDE, Math.asin((margin - bobR * 2) / longest));

    // Suspension bar
    ctx.save();
    ctx.shadowBlur = 18;
    ctx.shadowColor = 'rgba(190, 150, 255, 0.8)';
    ctx.strokeStyle = 'rgba(220, 200, 255, 0.9)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(margin - spacing * 0.5, pivotY);
    ctx.lineTo(W - margin + spacing * 0.5, pivotY);
    ctx.stroke();
    ctx.restore();

    // Compute bob positions
    var pts = [];
    for (var i = 0; i < N; i++) {
      // Longest pendulum is the slowest (index 0), lengths decrease with frequency.
      var len = longest * Math.pow(freq[0] / freq[i], 2);
      if (len < shortest) len = shortest;
      var px = margin + i * spacing;
      var theta = amp * Math.cos(2 * Math.PI * freq[i] * t);
      var bx = px + len * Math.sin(theta);
      var by = pivotY + len * Math.cos(theta);
      pts.push({ px: px, bx: bx, by: by, c: colors[i], theta: theta });
    }

    // Connecting ribbon through bobs (shows the wave shape)
    ctx.save();
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    for (var j = 0; j < N - 1; j++) {
      var a = pts[j], b = pts[j + 1];
      var grad = ctx.createLinearGradient(a.bx, a.by, b.bx, b.by);
      grad.addColorStop(0, a.c.line);
      grad.addColorStop(1, b.c.line);
      ctx.strokeStyle = grad;
      ctx.shadowBlur = 10;
      ctx.shadowColor = a.c.glow;
      ctx.beginPath();
      ctx.moveTo(a.bx, a.by);
      ctx.lineTo(b.bx, b.by);
      ctx.stroke();
    }
    ctx.restore();

    // Strings
    ctx.save();
    ctx.lineWidth = 1.5;
    for (var s = 0; s < N; s++) {
      var p = pts[s];
      ctx.strokeStyle = 'hsla(' + p.c.hue + ', 100%, 85%, 0.55)';
      ctx.beginPath();
      ctx.moveTo(p.px, pivotY);
      ctx.lineTo(p.bx, p.by);
      ctx.stroke();
    }
    ctx.restore();

    // Bobs with glow
    for (var q = 0; q < N; q++) {
      var o = pts[q];
      var speedBoost = 1 + 0.35 * Math.abs(Math.sin(2 * Math.PI * freq[q] * t));
      var r = bobR * speedBoost;

      ctx.save();
      ctx.shadowBlur = 28;
      ctx.shadowColor = o.c.glow;
      ctx.fillStyle = o.c.body;
      ctx.beginPath();
      ctx.arc(o.bx, o.by, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Specular highlight
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(o.bx - r * 0.3, o.by - r * 0.3, r * 0.32, 0, Math.PI * 2);
      ctx.fill();

      // Pivot dot
      ctx.fillStyle = 'hsl(' + o.c.hue + ', 100%, 80%)';
      ctx.beginPath();
      ctx.arc(o.px, pivotY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
