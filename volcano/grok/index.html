<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volcano</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070114;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const JETS = [
    { angle: -Math.PI / 2, spread: 0.055, speed: 1, rate: 86, size: 1.05, ox: 0, oy: 0, bomb: 0.04 },
    { angle: -Math.PI / 2 - 0.16, spread: 0.09, speed: 0.9, rate: 28, size: 0.8, ox: -0.12, oy: 0.05, bomb: 0.05 },
    { angle: -Math.PI / 2 + 0.14, spread: 0.09, speed: 0.88, rate: 26, size: 0.8, ox: 0.12, oy: 0.06, bomb: 0.05 },
    { angle: -Math.PI / 2 - 0.46, spread: 0.08, speed: 0.72, rate: 34, size: 0.9, ox: -0.34, oy: 0.12, bomb: 0.08 },
    { angle: -Math.PI / 2 + 0.4, spread: 0.09, speed: 0.68, rate: 32, size: 0.9, ox: 0.32, oy: 0.14, bomb: 0.08 },
    { angle: -Math.PI / 2 - 0.74, spread: 0.12, speed: 0.5, rate: 16, size: 1, ox: -0.58, oy: 0.28, bomb: 0.14 },
    { angle: -Math.PI / 2 + 0.68, spread: 0.12, speed: 0.48, rate: 15, size: 1, ox: 0.54, oy: 0.3, bomb: 0.14 },
    { angle: Math.PI + 0.22, spread: 0.16, speed: 0.4, rate: 11, size: 0.85, ox: -0.72, oy: 0.35, bomb: 0.1 },
    { angle: -0.22, spread: 0.16, speed: 0.4, rate: 11, size: 0.85, ox: 0.7, oy: 0.38, bomb: 0.1 }
  ];

  const CHANNELS = [
    { side: 0, t0: 0.08, t1: 1.14, freq: 5.2, phase: 0.4, spin: 0.42, amp: 0.15, w: 0.028, speed: 0.14 },
    { side: 1, t0: 0.03, t1: 1.1, inset0: 0.22, inset1: 0.58, freq: 8.4, phase: 1.1, spin: 0.5, amp: 0.011, w: 0.02, speed: 0.18 },
    { side: 1, t0: 0.2, t1: 1.02, inset0: 0.4, inset1: 0.74, freq: 11, phase: 2.2, spin: 0.62, amp: 0.009, w: 0.013, speed: 0.22 },
    { side: -1, t0: 0.04, t1: 1.1, inset0: 0.24, inset1: 0.56, freq: 7.6, phase: 0.3, spin: 0.46, amp: 0.011, w: 0.019, speed: 0.17 },
    { side: -1, t0: 0.28, t1: 0.92, inset0: 0.48, inset1: 0.76, freq: 12, phase: 1.8, spin: 0.7, amp: 0.008, w: 0.012, speed: 0.24 },
    { side: 1, t0: 0.42, t1: 1.06, inset0: 0.62, inset1: 0.8, freq: 14, phase: 0.7, spin: 0.8, amp: 0.006, w: 0.011, speed: 0.28 }
  ];

  const LOBES = [
    { x: 0.0, y: 0.4, rx: 0.05, ry: 0.036, a: 0.5, hot: 0.95, seed: 1 },
    { x: 0.012, y: 0.35, rx: 0.068, ry: 0.046, a: 0.72, hot: 0.8, seed: 2 },
    { x: 0.02, y: 0.3, rx: 0.086, ry: 0.054, a: 0.82, hot: 0.58, seed: 3 },
    { x: 0.03, y: 0.255, rx: 0.105, ry: 0.06, a: 0.88, hot: 0.36, seed: 4 },
    { x: 0.042, y: 0.21, rx: 0.125, ry: 0.066, a: 0.92, hot: 0.2, seed: 5 },
    { x: 0.055, y: 0.168, rx: 0.145, ry: 0.07, a: 0.94, hot: 0.1, seed: 6 },
    { x: -0.07, y: 0.15, rx: 0.11, ry: 0.052, a: 0.86, hot: 0.06, seed: 7 },
    { x: 0.05, y: 0.125, rx: 0.155, ry: 0.068, a: 0.96, hot: 0.08, seed: 8 },
    { x: 0.16, y: 0.14, rx: 0.13, ry: 0.058, a: 0.9, hot: 0.05, seed: 9 },
    { x: 0.25, y: 0.175, rx: 0.1, ry: 0.048, a: 0.72, hot: 0.03, seed: 10 },
    { x: -0.13, y: 0.178, rx: 0.09, ry: 0.044, a: 0.66, hot: 0.03, seed: 11 },
    { x: 0.1, y: 0.082, rx: 0.12, ry: 0.048, a: 0.84, hot: 0, seed: 12 },
    { x: -0.01, y: 0.068, rx: 0.1, ry: 0.04, a: 0.78, hot: 0, seed: 13 },
    { x: 0.2, y: 0.1, rx: 0.095, ry: 0.04, a: 0.7, hot: 0, seed: 14 },
    { x: 0.31, y: 0.155, rx: 0.07, ry: 0.034, a: 0.48, hot: 0, seed: 15 },
    { x: 0.08, y: 0.2, rx: 0.07, ry: 0.04, a: 0.4, hot: 0.15, seed: 16 }
  ];

  const WISPS = [
    { x: 0.02, y: 0.1, rx: 0.08, ry: 0.034, a: 0.42, seed: 20 },
    { x: 0.15, y: 0.112, rx: 0.09, ry: 0.038, a: 0.38, seed: 21 },
    { x: 0.24, y: 0.15, rx: 0.07, ry: 0.03, a: 0.32, seed: 22 },
    { x: -0.05, y: 0.132, rx: 0.062, ry: 0.028, a: 0.3, seed: 23 }
  ];

  let W = 1;
  let H = 1;
  let time = 0.28;
  const L = {};
  let stars = [];
  let lava = [];
  let ash = [];
  let cinders = [];
  let specks = [];
  let puffAsh = null;
  let puffHot = null;
  let puffSmoke = null;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeSprite(stops) {
    const s = 192;
    const c = document.createElement("canvas");
    c.width = c.height = s;
    const gtx = c.getContext("2d");
    const g = gtx.createRadialGradient(s * 0.48, s * 0.5, s * 0.02, s * 0.5, s * 0.52, s * 0.5);
    for (let i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    gtx.fillStyle = g;
    gtx.beginPath();
    gtx.arc(s / 2, s / 2, s / 2, 0, Math.PI * 2);
    gtx.fill();
    return c;
  }

  function makeSprites() {
    puffAsh = makeSprite([
      [0, "rgba(64, 24, 82, 0.97)"],
      [0.34, "rgba(48, 18, 64, 0.9)"],
      [0.6, "rgba(78, 26, 48, 0.55)"],
      [0.82, "rgba(170, 52, 22, 0.2)"],
      [1, "rgba(80, 20, 16, 0)"]
    ]);
    puffSmoke = makeSprite([
      [0, "rgba(26, 8, 36, 0.96)"],
      [0.48, "rgba(22, 8, 30, 0.62)"],
      [1, "rgba(8, 2, 14, 0)"]
    ]);
    puffHot = makeSprite([
      [0, "rgba(255, 244, 200, 0.98)"],
      [0.22, "rgba(255, 150, 20, 0.8)"],
      [0.52, "rgba(255, 48, 0, 0.32)"],
      [1, "rgba(255, 20, 0, 0)"]
    ]);
  }

  function eruption(t) {
    const cycle = t % 5;
    const burst = cycle < 0.78 ? Math.sin((cycle / 0.78) * Math.PI) : 0;
    const throb = 0.58 + 0.42 * (0.5 + 0.5 * Math.sin(t * 2.35));
    return throb + burst * 0.95;
  }

  function burstAmount(t) {
    const cycle = t % 5;
    return cycle < 0.78 ? Math.sin((cycle / 0.78) * Math.PI) : 0;
  }

  function layout() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(1, window.innerWidth);
    H = Math.max(1, window.innerHeight);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    L.dpr = dpr;
    L.u = Math.min(W, H);
    L.top = (H - L.u) / 2;
    L.cx = W * 0.5;
    L.rimRx = L.u * 0.07;
    L.rimRy = L.u * 0.04;
    L.rimCy = L.top + L.u * 0.382;
    L.baseY = L.top + L.u * 0.9;
    L.baseHalf = L.u * 0.6;
    L.g = L.u * 1.08;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
    fillLava();
    fillAsh();
    fillCinders();
    fillSpecks();
  }

  function halfWidth(t, side) {
    const tt = Math.max(0, t);
    const p = Math.pow(Math.min(1, tt), 0.7);
    const asym = 1 + (side > 0 ? 0.045 : -0.025) * p;
    const hw = (L.rimRx + (L.baseHalf - L.rimRx) * p) * asym;
    const ridge = Math.sin(tt * 15 + side * 1.7) * L.u * 0.0032 * p
      + Math.sin(tt * 6.2 + 1.4) * L.u * 0.007 * Math.sin(Math.min(1, tt) * Math.PI);
    return hw + ridge;
  }

  function surfaceY(x) {
    const dx = Math.abs(x - L.cx);
    const side = x < L.cx ? -1 : 1;
    if (dx >= halfWidth(1, side)) return L.baseY;
    if (dx <= L.rimRx * 0.9) return L.rimCy + L.rimRy * 0.35;
    let lo = 0;
    let hi = 1;
    for (let i = 0; i < 16; i++) {
      const mid = (lo + hi) * 0.5;
      if (halfWidth(mid, side) < dx) lo = mid;
      else hi = mid;
    }
    return L.rimCy + ((lo + hi) * 0.5) * (L.baseY - L.rimCy);
  }

  function sampleSlope(side) {
    const pts = [];
    const n = 72;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      pts.push({
        x: L.cx + side * halfWidth(t, side),
        y: L.rimCy + t * (L.baseY - L.rimCy)
      });
    }
    return pts;
  }

  function sampleFarRim() {
    const pts = [];
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI + Math.PI * (i / n);
      pts.push({
        x: L.cx + Math.cos(a) * L.rimRx,
        y: L.rimCy + Math.sin(a) * L.rimRy
      });
    }
    return pts;
  }

  function sampleNearRim() {
    const pts = [];
    const n = 28;
    for (let i = 0; i <= n; i++) {
      const a = Math.PI - Math.PI * (i / n);
      pts.push({
        x: L.cx + Math.cos(a) * L.rimRx,
        y: L.rimCy + Math.sin(a) * L.rimRy
      });
    }
    return pts;
  }

  function traceMountain() {
    const left = sampleSlope(-1);
    const right = sampleSlope(1);
    const rim = sampleFarRim();
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, left[left.length - 1].y);
    for (let i = left.length - 1; i >= 0; i--) ctx.lineTo(left[i].x, left[i].y);
    for (let i = 1; i < rim.length; i++) ctx.lineTo(rim[i].x, rim[i].y);
    for (let i = 1; i < right.length; i++) ctx.lineTo(right[i].x, right[i].y);
    ctx.lineTo(W, right[right.length - 1].y);
    ctx.lineTo(W, H);
    ctx.closePath();
  }

  function strokePts(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function buildStars() {
    const rnd = mulberry32(20260323);
    stars = [];
    for (let i = 0; i < 130; i++) {
      stars.push({
        x: rnd(),
        y: rnd() * 0.62,
        r: rnd() * 1.35 + 0.35,
        p: rnd() * Math.PI * 2,
        s: 0.6 + rnd() * 2.4,
        gold: rnd() > 0.72
      });
    }
  }

  function birthLava(jet, aged) {
    const power = Math.min(eruption(time), 1.25);
    const ang = jet.angle + (Math.random() - 0.5) * jet.spread * 2;
    const sp = L.u * 0.73 * jet.speed * (0.88 + Math.random() * 0.22) * (0.9 + 0.12 * power);
    const bomb = Math.random() < jet.bomb;
    const p = {
      x: L.cx + jet.ox * L.rimRx,
      y: L.rimCy - L.rimRy * 0.45 + jet.oy * L.rimRy,
      vx: Math.cos(ang) * sp * (bomb ? 0.84 : 1),
      vy: Math.sin(ang) * sp * (bomb ? 0.84 : 1),
      life: (bomb ? 1.5 : 1.28) + Math.random() * 0.22,
      size: L.u * 0.0046 * jet.size * (bomb ? 2.6 : 1) * (0.65 + Math.random() * 0.7),
      kind: bomb ? "bomb" : "lava"
    };
    p.max = p.life;
    if (aged) {
      const age = Math.random() * p.life * 0.94;
      p.x += p.vx * age;
      p.y += p.vy * age + 0.5 * L.g * age * age;
      p.vy += L.g * age;
      p.life -= age;
      if (p.life <= 0.06) return null;
      if (p.y > surfaceY(p.x) && p.vy > 0) return null;
      if (p.x < -50 || p.x > W + 50 || p.y > H + 10) return null;
    }
    return p;
  }

  function splash(x, y, vx) {
    for (let i = 0; i < 3; i++) {
      if (lava.length > 470) return;
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
      const sp = L.u * (0.04 + Math.random() * 0.1);
      const life = 0.22 + Math.random() * 0.28;
      lava.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp + vx * 0.08,
        vy: Math.sin(a) * sp,
        life: life,
        max: life,
        size: L.u * 0.002 * (0.6 + Math.random()),
        kind: "spark"
      });
    }
  }

  function fillLava() {
    lava = [];
    let guard = 0;
    while (lava.length < 380 && guard < 4000) {
      guard++;
      const p = birthLava(JETS[guard % JETS.length], true);
      if (p) lava.push(p);
    }
    for (let i = 0; i < JETS.length; i++) JETS[i].acc = Math.random();
  }

  function fillAsh() {
    ash = [];
    for (let i = 0; i < 30; i++) {
      ash.push({
        t: Math.random(),
        seed: Math.random() * 10,
        r: 0.028 + Math.random() * 0.05,
        front: Math.random() > 0.78
      });
    }
  }

  function fillCinders() {
    cinders = [];
    for (let i = 0; i < 70; i++) {
      cinders.push({
        t: Math.random(),
        seed: Math.random() * 20,
        s: 0.7 + Math.random() * 1.8,
        hot: Math.random()
      });
    }
  }

  function fillSpecks() {
    specks = [];
    for (let i = 0; i < 80; i++) {
      specks.push({
        x: Math.random(),
        y: Math.random(),
        v: 0.012 + Math.random() * 0.04,
        drift: (Math.random() - 0.35) * 0.02,
        s: 0.6 + Math.random() * 1.5,
        hot: Math.random() < 0.55
      });
    }
  }

  function update(dt) {
    const power = eruption(time);
    const sputter = 0.7 + 0.3 * Math.sin(time * 18.5) * Math.sin(time * 7.1);
    const spawnScale = power * Math.max(0.4, sputter);
    for (let j = 0; j < JETS.length; j++) {
      const jet = JETS[j];
      jet.acc += dt * jet.rate * spawnScale;
      while (jet.acc >= 1 && lava.length < 460) {
        jet.acc -= 1;
        const p = birthLava(jet, false);
        if (p) lava.push(p);
      }
      if (jet.acc > 6) jet.acc = 6;
    }

    let w = 0;
    for (let i = 0; i < lava.length; i++) {
      const p = lava[i];
      p.vy += L.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0 || p.y > H + 36 || p.x < -80 || p.x > W + 80) continue;
      if (p.kind !== "spark" && p.vy > 0 && p.y > surfaceY(p.x)) {
        if (p.kind === "bomb" || Math.random() < 0.22) splash(p.x, p.y, p.vx);
        continue;
      }
      lava[w++] = p;
    }
    lava.length = w;

    for (let i = 0; i < ash.length; i++) {
      const a = ash[i];
      a.t += dt * (0.045 + (a.seed % 1) * 0.03);
      if (a.t > 1) a.t -= 1;
    }
    for (let i = 0; i < cinders.length; i++) {
      const c = cinders[i];
      c.t += dt * (0.08 + (c.seed % 1) * 0.06);
      if (c.t > 1) c.t -= 1;
    }
    for (let i = 0; i < specks.length; i++) {
      const s = specks[i];
      s.y += s.v * dt;
      s.x += s.drift * dt;
      if (s.y > 1.05) {
        s.y = -0.02;
        s.x = Math.random();
      }
      if (s.x < -0.05) s.x = 1.02;
      if (s.x > 1.05) s.x = -0.02;
    }
  }

  function sqX(nx) {
    return L.cx + nx * L.u;
  }

  function sqY(ny) {
    return L.top + ny * L.u;
  }

  function blit(img, x, y, rx, ry, alpha) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, x - rx, y - ry, rx * 2, ry * 2);
  }

  function lobePos(lobe) {
    const jx = Math.sin(time * 0.62 + lobe.seed) * 0.012 + Math.sin(time * 1.15 + lobe.seed * 2) * 0.006;
    const jy = Math.cos(time * 0.5 + lobe.seed * 1.4) * 0.008;
    const breathe = 1 + 0.045 * Math.sin(time * 0.85 + lobe.seed);
    return {
      x: sqX(lobe.x + jx + 0.02),
      y: sqY(lobe.y + jy),
      rx: lobe.rx * breathe * L.u,
      ry: lobe.ry * breathe * L.u
    };
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070218");
    g.addColorStop(0.28, "#14082f");
    g.addColorStop(0.52, "#3a124c");
    g.addColorStop(0.7, "#8a1458");
    g.addColorStop(0.84, "#c41e3a");
    g.addColorStop(1, "#4a1020");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const glow = ctx.createRadialGradient(L.cx, L.rimCy, L.u * 0.02, L.cx, L.rimCy - L.u * 0.02, L.u * 0.68);
    const power = eruption(time);
    glow.addColorStop(0, "rgba(255, 236, 190, 0.95)");
    glow.addColorStop(0.07, "rgba(255, 150, 20, " + (0.75 + power * 0.08) + ")");
    glow.addColorStop(0.18, "rgba(255, 40, 0, 0.55)");
    glow.addColorStop(0.38, "rgba(200, 0, 80, 0.28)");
    glow.addColorStop(0.62, "rgba(90, 0, 120, 0.12)");
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars() {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const x = s.x * W;
      const y = s.y * H;
      const dx = x - L.cx;
      const dy = y - (L.rimCy - L.u * 0.08);
      const dist = Math.hypot(dx, dy);
      const fade = Math.max(0, Math.min(1, (dist - L.u * 0.08) / (L.u * 0.28)));
      if (fade <= 0.02) continue;
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * s.s + s.p));
      const alpha = tw * fade;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.gold ? "#ffd27a" : "#fff4d2";
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.r > 1.25) {
        ctx.globalAlpha = alpha * 0.7;
        ctx.strokeStyle = "#fff6dd";
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(x - s.r * 3.2, y);
        ctx.lineTo(x + s.r * 3.2, y);
        ctx.moveTo(x, y - s.r * 3.2);
        ctx.lineTo(x, y + s.r * 3.2);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawMoon() {
    const x = sqX(-0.36);
    const y = sqY(0.11);
    const r = L.u * 0.046;
    const halo = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 3.2);
    halo.addColorStop(0, "rgba(255, 214, 120, 0.35)");
    halo.addColorStop(1, "rgba(255, 180, 60, 0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(x, y, r * 3.2, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#ffe7a4";
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2, false);
    ctx.arc(x + r * 0.42, y - r * 0.1, r * 0.78, 0, Math.PI * 2, true);
    ctx.fill("evenodd");
  }

  function drawHills() {
    function band(ny, lift, color) {
      const y0 = sqY(ny);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, y0 + L.u * 0.03);
      ctx.quadraticCurveTo(sqX(-0.42), y0 - L.u * lift, sqX(-0.22), y0 + L.u * 0.02);
      ctx.quadraticCurveTo(sqX(-0.02), y0 - L.u * lift * 1.4, sqX(0.16), y0 + L.u * 0.015);
      ctx.quadraticCurveTo(sqX(0.38), y0 - L.u * lift * 0.8, W, y0 + L.u * 0.04);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
    band(0.63, 0.055, "#3a1438");
    band(0.69, 0.04, "#1a0a22");
  }

  function drawLobes(list, img, alphaScale, frontHot) {
    for (let i = 0; i < list.length; i++) {
      const lobe = list[i];
      const p = lobePos(lobe);
      const alpha = lobe.a * alphaScale * (0.9 + 0.1 * Math.sin(time * 1.1 + lobe.seed));
      blit(img, p.x, p.y, p.rx, p.ry, alpha);
      if (frontHot && lobe.hot > 0.08) {
        ctx.globalCompositeOperation = "lighter";
        blit(puffHot, p.x, p.y + p.ry * 0.28, p.rx * 0.72, p.ry * 0.55, lobe.hot * 0.55 * alphaScale);
        ctx.globalCompositeOperation = "source-over";
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawAshPuffs(front) {
    for (let i = 0; i < ash.length; i++) {
      const a = ash[i];
      if (front !== a.front) continue;
      if (front && a.t < 0.35) continue;
      const spread = 0.03 + Math.pow(a.t, 1.25) * 0.2;
      const nx = 0.02 + a.t * 0.08 + Math.sin(time * 0.7 + a.seed) * spread * 0.85;
      const ny = 0.4 - a.t * 0.33 + Math.cos(time * 0.55 + a.seed) * 0.01;
      const x = sqX(nx);
      const y = sqY(ny);
      const rx = a.r * L.u * (0.85 + a.t * 0.5);
      const img = a.t > 0.62 ? puffSmoke : puffAsh;
      blit(img, x, y, rx, rx * 0.72, 0.28 + (1 - a.t) * 0.25);
    }
    ctx.globalAlpha = 1;
  }

  function ribbon(pts, widthAt) {
    const n = pts.length;
    ctx.beginPath();
    let sx = 0;
    let sy = 0;
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[Math.min(n - 1, i + 1)];
      let dx = p1.x - p0.x;
      let dy = p1.y - p0.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;
      const w = widthAt(t);
      const x = pts[i].x - dy * w;
      const y = pts[i].y + dx * w;
      if (i === 0) {
        ctx.moveTo(x, y);
        sx = pts[i].x + dy * w;
        sy = pts[i].y - dx * w;
      } else {
        ctx.lineTo(x, y);
      }
    }
    for (let i = n - 1; i >= 0; i--) {
      const t = i / (n - 1);
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[Math.min(n - 1, i + 1)];
      let dx = p1.x - p0.x;
      let dy = p1.y - p0.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len;
      dy /= len;
      const w = widthAt(t);
      ctx.lineTo(pts[i].x + dy * w, pts[i].y - dx * w);
    }
    ctx.closePath();
    return { x: sx, y: sy };
  }

  function buildChannel(spec) {
    const pts = [];
    const n = 44;
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const tt = spec.t0 + (spec.t1 - spec.t0) * u;
      const y = L.rimCy + tt * (L.baseY - L.rimCy);
      const side = spec.side === 0 ? 1 : spec.side;
      const hw = halfWidth(Math.min(1, Math.max(0, tt)), side);
      let x;
      if (spec.side === 0) {
        x = L.cx + Math.sin(u * spec.freq + spec.phase + time * spec.spin) * hw * spec.amp;
      } else {
        const inset = spec.inset0 + (spec.inset1 - spec.inset0) * u;
        x = L.cx + spec.side * hw * inset + Math.sin(u * spec.freq + spec.phase + time * spec.spin) * L.u * spec.amp;
      }
      pts.push({ x: x, y: y });
    }
    return pts;
  }

  function pointAlong(pts, u) {
    const f = Math.max(0, Math.min(0.999, u)) * (pts.length - 1);
    const i = Math.floor(f);
    const t = f - i;
    const a = pts[i];
    const b = pts[i + 1];
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }

  function drawRiver(spec) {
    const pts = buildChannel(spec);
    const base = spec.w;
    function widthAt(t, scale) {
      const grow = 0.72 + t * 0.85;
      const pulse = 1 + 0.07 * Math.sin(t * 9 - time * 5 + spec.phase);
      return L.u * base * grow * pulse * scale;
    }
    ribbon(pts, function (t) { return widthAt(t, 2.5); });
    ctx.fillStyle = "rgba(255, 36, 0, 0.2)";
    ctx.fill();

    ribbon(pts, function (t) { return widthAt(t, 1); });
    const g = ctx.createLinearGradient(0, pts[0].y, 0, pts[pts.length - 1].y);
    g.addColorStop(0, "#fff1a8");
    g.addColorStop(0.12, "#ffc20a");
    g.addColorStop(0.4, "#ff5a00");
    g.addColorStop(0.75, "#ff2208");
    g.addColorStop(1, "#d01030");
    ctx.fillStyle = g;
    ctx.fill();

    ribbon(pts, function (t) { return widthAt(t, 0.34); });
    ctx.fillStyle = "rgba(255, 250, 220, 0.72)";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.setLineDash([L.u * base * 1.5, L.u * base * 1.7]);
    ctx.lineDashOffset = -time * spec.speed * L.u * 0.55;
    ctx.strokeStyle = "rgba(42, 4, 8, 0.4)";
    ctx.lineWidth = L.u * base * 0.85;
    ctx.lineCap = "butt";
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const pulses = base > 0.012 ? 5 : 3;
    for (let k = 0; k < pulses; k++) {
      const u = (time * spec.speed + k / pulses) % 1;
      const p = pointAlong(pts, u);
      const rad = widthAt(u, 1.15);
      ctx.globalAlpha = 0.32;
      ctx.fillStyle = "#ff5a00";
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "#fff4c0";
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    const end = pts[pts.length - 1];
    return end;
  }

  function drawPool(x, y, r) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    blit(puffHot, x, y, r * 2.3, r * 1.15, 0.62);
    ctx.restore();
    const g = ctx.createRadialGradient(x - r * 0.1, y - r * 0.05, r * 0.05, x, y, r);
    g.addColorStop(0, "#fff8d0");
    g.addColorStop(0.4, "#ffb000");
    g.addColorStop(0.75, "#ff3a00");
    g.addColorStop(1, "#c01028");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.46, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawFissures() {
    const cracks = [
      [0.0, 0.94, -0.12, 1.01, 0.16],
      [0.0, 0.95, 0.14, 1.02, 0.18],
      [0.16, 0.96, 0.28, 1.02, 0.1],
      [-0.14, 0.96, -0.26, 1.015, 0.09],
      [0.06, 0.97, 0.1, 1.03, 0.07]
    ];
    ctx.save();
    ctx.lineCap = "round";
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < cracks.length; i++) {
      const c = cracks[i];
      const x0 = sqX(c[0]);
      const y0 = sqY(c[1]);
      const x1 = sqX(c[2]);
      const y1 = sqY(c[3]);
      const wob = Math.sin(time * 2 + i) * L.u * 0.008;
      ctx.strokeStyle = "rgba(255, 50, 0, 0.35)";
      ctx.lineWidth = L.u * c[4] * 0.45;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.quadraticCurveTo((x0 + x1) / 2 + wob, (y0 + y1) / 2, x1, y1);
      ctx.stroke();
      ctx.setLineDash([L.u * 0.012, L.u * 0.016]);
      ctx.lineDashOffset = -time * 40 - i * 10;
      ctx.strokeStyle = "#ffe080";
      ctx.lineWidth = Math.max(1.2, L.u * 0.003);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawCone() {
    const rock = ctx.createLinearGradient(0, L.rimCy - L.rimRy, 0, H);
    rock.addColorStop(0, "#34122c");
    rock.addColorStop(0.18, "#24101f");
    rock.addColorStop(0.5, "#160a16");
    rock.addColorStop(1, "#0c0610");
    traceMountain();
    ctx.fillStyle = rock;
    ctx.fill();

    ctx.save();
    traceMountain();
    ctx.clip();

    const moon = ctx.createLinearGradient(sqX(-0.5), L.top, L.cx, L.baseY);
    moon.addColorStop(0, "rgba(150, 120, 210, 0.16)");
    moon.addColorStop(0.45, "rgba(80, 40, 90, 0.05)");
    moon.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = moon;
    ctx.fillRect(0, 0, W, H);

    const heat = ctx.createRadialGradient(L.cx, L.rimCy, L.u * 0.02, L.cx, L.rimCy, L.u * 0.55);
    heat.addColorStop(0, "rgba(255, 90, 10, 0.55)");
    heat.addColorStop(0.2, "rgba(200, 20, 30, 0.22)");
    heat.addColorStop(0.5, "rgba(120, 10, 40, 0.08)");
    heat.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = heat;
    ctx.fillRect(0, 0, W, H);

    drawFissures();
    const ends = [];
    for (let i = 0; i < CHANNELS.length; i++) ends.push(drawRiver(CHANNELS[i]));
    drawPool(ends[0].x, ends[0].y + L.u * 0.012, L.u * 0.055);
    drawPool(ends[1].x, ends[1].y + L.u * 0.008, L.u * 0.034);
    drawPool(ends[3].x, ends[3].y + L.u * 0.008, L.u * 0.03);
    ctx.restore();

    const far = sampleFarRim();
    ctx.lineCap = "round";
    ctx.strokeStyle = "#ff7a1e";
    ctx.lineWidth = Math.max(2, L.u * 0.008);
    strokePts(far);
    ctx.strokeStyle = "#ffe1a4";
    ctx.lineWidth = Math.max(1, L.u * 0.003);
    strokePts(far);

    const upper = [];
    const left = sampleSlope(-1);
    const right = sampleSlope(1);
    for (let i = 0; i < 18; i++) upper.push(left[i]);
    ctx.strokeStyle = "rgba(255, 110, 30, 0.35)";
    ctx.lineWidth = Math.max(1.5, L.u * 0.005);
    strokePts(upper);
    upper.length = 0;
    for (let i = 0; i < 18; i++) upper.push(right[i]);
    strokePts(upper);
  }

  function drawCrater() {
    const power = eruption(time);
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(L.cx, L.rimCy, L.rimRx * 0.98, L.rimRy * 0.98, 0, 0, Math.PI * 2);
    ctx.clip();

    const wall = ctx.createLinearGradient(0, L.rimCy - L.rimRy, 0, L.rimCy + L.rimRy);
    wall.addColorStop(0, "#4a160e");
    wall.addColorStop(0.45, "#2a0c0c");
    wall.addColorStop(1, "#1a080c");
    ctx.fillStyle = wall;
    ctx.fillRect(L.cx - L.rimRx, L.rimCy - L.rimRy, L.rimRx * 2, L.rimRy * 2);

    const ox = Math.sin(time * 3.1) * L.rimRx * 0.1;
    const oy = Math.cos(time * 2.6) * L.rimRy * 0.12;
    const lavaY = L.rimCy + L.rimRy * 0.05;
    const g = ctx.createRadialGradient(L.cx + ox, lavaY + oy, L.u * 0.004, L.cx, lavaY, L.rimRx * 0.75);
    g.addColorStop(0, "#fffce6");
    g.addColorStop(0.28, "#ffd24a");
    g.addColorStop(0.62, "#ff6a00");
    g.addColorStop(1, "#e41c10");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(L.cx, lavaY, L.rimRx * 0.74, L.rimRy * 0.58, 0, 0, Math.PI * 2);
    ctx.fill();

    const dome = 0.35 + Math.min(power, 1.6) * 0.18;
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = "#fff1b0";
    ctx.beginPath();
    ctx.ellipse(L.cx + ox * 0.4, lavaY - L.rimRy * 0.05, L.rimRx * 0.28 * dome, L.rimRy * 0.34 * dome, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    for (let i = 0; i < 6; i++) {
      const phase = (time * (1.2 + i * 0.17) + i * 1.7) % 1;
      const bx = L.cx + Math.sin(i * 2.4) * L.rimRx * 0.36 + ox * 0.3;
      const by = lavaY + Math.cos(i * 1.9) * L.rimRy * 0.22;
      const br = L.u * 0.003 + phase * L.u * 0.011;
      ctx.beginPath();
      ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(255, 250, 220, " + (0.15 * (1 - phase)) + ")";
      ctx.fill();
      ctx.lineWidth = 1.25;
      ctx.strokeStyle = "rgba(255, 220, 120, " + (0.75 * (1 - phase)) + ")";
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawNearRim() {
    const near = sampleNearRim();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#ff6a18";
    ctx.lineWidth = Math.max(2, L.u * 0.016);
    strokePts(near);
    ctx.strokeStyle = "#1a0a12";
    ctx.lineWidth = Math.max(2, L.u * 0.01);
    strokePts(near);
  }

  function drawFountain() {
    const power = eruption(time);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const r = L.u * (0.05 + Math.min(power, 1.5) * 0.018);
    blit(puffHot, L.cx, L.rimCy - L.rimRy * 0.2, r, r * 0.8, 0.55);
    const columnH = L.u * (0.15 + Math.min(power, 1.45) * 0.09);
    const columnX = L.cx + Math.sin(time * 9) * L.u * 0.004;
    const mouth = L.rimCy - L.rimRy * 0.15;
    const column = ctx.createLinearGradient(columnX, mouth, columnX, mouth - columnH);
    column.addColorStop(0, "rgba(255, 252, 230, 0.95)");
    column.addColorStop(0.35, "rgba(255, 170, 30, 0.55)");
    column.addColorStop(1, "rgba(255, 40, 0, 0)");
    ctx.fillStyle = column;
    ctx.beginPath();
    ctx.moveTo(columnX - L.u * 0.014, mouth);
    ctx.quadraticCurveTo(columnX - L.u * 0.026, mouth - columnH * 0.62, columnX, mouth - columnH);
    ctx.quadraticCurveTo(columnX + L.u * 0.022, mouth - columnH * 0.58, columnX + L.u * 0.013, mouth);
    ctx.fill();

    ctx.lineCap = "round";
    for (let i = 0; i < lava.length; i++) {
      const p = lava[i];
      const k = Math.max(0, p.life / p.max);
      const heat = k * k;
      const spd = Math.hypot(p.vx, p.vy) || 1;
      const len = Math.min(L.u * 0.03, spd * 0.022) * (p.kind === "spark" ? 0.55 : 1);
      ctx.globalAlpha = Math.min(1, 0.22 + heat);
      ctx.strokeStyle = heat > 0.4 ? "#ffd56a" : "#ff4a0e";
      ctx.lineWidth = Math.max(1, p.size * (0.65 + heat));
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - (p.vx / spd) * len, p.y - (p.vy / spd) * len);
      ctx.stroke();

      const head = p.size * (p.kind === "bomb" ? 1.3 : 1) * (0.6 + heat * 0.55);
      ctx.globalAlpha = Math.min(1, 0.3 + heat);
      ctx.fillStyle = heat > 0.55 ? "#fff6c2" : heat > 0.28 ? "#ffb018" : "#ff3200";
      ctx.beginPath();
      ctx.arc(p.x, p.y, head, 0, Math.PI * 2);
      ctx.fill();
      if (p.kind === "bomb" || heat > 0.62) {
        ctx.globalAlpha = Math.min(1, heat + 0.15);
        ctx.fillStyle = "#fffef2";
        ctx.beginPath();
        ctx.arc(p.x, p.y, head * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawCinders() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < cinders.length; i++) {
      const c = cinders[i];
      const spread = 0.025 + Math.pow(c.t, 1.2) * 0.18;
      const nx = 0.015 + c.t * 0.07 + Math.sin(time * 0.9 + c.seed) * spread;
      const ny = 0.39 - c.t * 0.32;
      const x = sqX(nx);
      const y = sqY(ny);
      const flicker = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(time * 6 + c.seed));
      ctx.globalAlpha = (1 - c.t * 0.65) * flicker;
      ctx.fillStyle = c.hot > 0.4 ? "#ffb020" : "#ff5a18";
      ctx.beginPath();
      ctx.arc(x, y, c.s, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSpecks() {
    for (let i = 0; i < specks.length; i++) {
      const s = specks[i];
      const x = s.x * W;
      const y = s.y * H;
      if (s.hot) {
        ctx.globalCompositeOperation = "lighter";
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = "#ff7a20";
      } else {
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 0.45;
        ctx.fillStyle = "#3a2048";
      }
      ctx.fillRect(x, y, s.s, s.s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  function drawVignette() {
    const v = ctx.createRadialGradient(L.cx, L.rimCy, L.u * 0.28, L.cx, L.top + L.u * 0.5, L.u * 0.82);
    v.addColorStop(0, "rgba(0, 0, 0, 0)");
    v.addColorStop(0.72, "rgba(0, 0, 0, 0)");
    v.addColorStop(1, "rgba(0, 0, 0, 0.42)");
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.setLineDash([]);
    ctx.fillStyle = "#070114";
    ctx.fillRect(0, 0, W, H);

    const burst = burstAmount(time);
    ctx.save();
    if (burst > 0.2) {
      ctx.translate((Math.random() - 0.5) * burst * 2.4, (Math.random() - 0.5) * burst * 1.8);
    }

    drawSky();
    drawStars();
    drawMoon();
    drawHills();
    drawLobes(LOBES, puffAsh, 1, true);
    drawLobes(LOBES.filter(function (lobe) { return lobe.y < 0.16; }), puffSmoke, 0.4, false);
    drawAshPuffs(false);
    drawCone();
    drawCrater();
    drawFountain();
    drawNearRim();
    drawLobes(WISPS, puffSmoke, 1, false);
    drawAshPuffs(true);
    drawCinders();
    drawSpecks();
    drawVignette();
    ctx.restore();
  }

  makeSprites();
  layout();
  window.addEventListener("resize", layout);
  draw();

  let last = 0;
  requestAnimationFrame(function loop(now) {
    if (!last) last = now;
    const dt = Math.min(0.034, (now - last) / 1000);
    last = now;
    time += dt;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
