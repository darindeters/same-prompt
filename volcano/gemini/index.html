<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Volcano Eruption</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05020a;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Virtual coordinate space optimized for 1080x1080 while filling any aspect ratio
  let width = 1080;
  let height = 1080;
  let scale = 1;
  let offsetX = 0;
  let offsetY = 0;

  // Offscreen static/cached layers for crisp mountain & starfield
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  const mountainCanvas = document.createElement('canvas');
  const mountainCtx = mountainCanvas.getContext('2d');

  // Crater anchor in virtual 1080x1080 space
  const CRATER = {
    x: 540,
    y: 438,
    rimWidth: 126,
    innerWidth: 96
  };

  // Seeded pseudo-random for deterministic terrain geometry
  let seed = 42197;
  function sRand() {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  }

  // Stars
  const stars = [];
  for (let i = 0; i < 240; i++) {
    const yRatio = Math.pow(Math.random(), 1.5);
    stars.push({
      x: (Math.random() - 0.5) * 2200 + 540,
      y: yRatio * 680 - 200,
      r: Math.random() * 1.9 + 0.5,
      baseAlpha: Math.random() * 0.65 + 0.25,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 2.5 + 0.8,
      hue: Math.random() < 0.3 ? 210 : (Math.random() < 0.5 ? 35 : 280)
    });
  }

  // Define braided lava flow paths down the volcano slopes
  // Each channel is a cubic bezier or polyline with width and sub-branches
  const lavaChannels = [
    // Main central-left river
    {
      width: 24,
      speed: 1.05,
      points: [
        { x: 505, y: 442 },
        { x: 482, y: 495 },
        { x: 446, y: 560 },
        { x: 428, y: 635 },
        { x: 382, y: 720 },
        { x: 335, y: 815 },
        { x: 265, y: 920 },
        { x: 185, y: 1035 },
        { x: 120, y: 1120 }
      ]
    },
    // Left-flank secondary fork
    {
      width: 15,
      speed: 0.85,
      points: [
        { x: 446, y: 560 },
        { x: 398, y: 608 },
        { x: 340, y: 668 },
        { x: 268, y: 742 },
        { x: 190, y: 830 },
        { x: 95, y: 940 },
        { x: 20, y: 1050 }
      ]
    },
    // Center spine torrent
    {
      width: 28,
      speed: 1.25,
      points: [
        { x: 542, y: 446 },
        { x: 552, y: 508 },
        { x: 538, y: 582 },
        { x: 564, y: 660 },
        { x: 545, y: 748 },
        { x: 575, y: 842 },
        { x: 558, y: 945 },
        { x: 590, y: 1095 }
      ]
    },
    // Center-left crossover braid
    {
      width: 16,
      speed: 0.95,
      points: [
        { x: 538, y: 582 },
        { x: 502, y: 640 },
        { x: 472, y: 718 },
        { x: 448, y: 810 },
        { x: 405, y: 912 },
        { x: 375, y: 1050 }
      ]
    },
    // Main right-flank river
    {
      width: 22,
      speed: 1.1,
      points: [
        { x: 580, y: 440 },
        { x: 615, y: 500 },
        { x: 648, y: 572 },
        { x: 695, y: 652 },
        { x: 735, y: 745 },
        { x: 798, y: 840 },
        { x: 865, y: 955 },
        { x: 945, y: 1090 }
      ]
    },
    // Right inner branch
    {
      width: 14,
      speed: 0.9,
      points: [
        { x: 648, y: 572 },
        { x: 635, y: 642 },
        { x: 662, y: 722 },
        { x: 688, y: 815 },
        { x: 725, y: 928 },
        { x: 755, y: 1070 }
      ]
    },
    // Far right upper fissure overflow
    {
      width: 11,
      speed: 0.8,
      points: [
        { x: 595, y: 444 },
        { x: 645, y: 488 },
        { x: 710, y: 552 },
        { x: 775, y: 625 },
        { x: 845, y: 715 },
        { x: 930, y: 820 },
        { x: 1020, y: 935 }
      ]
    }
  ];

  // Pre-sample dense smooth curves for each lava channel
  function sampleSpline(pts, steps = 90) {
    const out = [];
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * (pts.length - 1);
      const idx = Math.min( Math.floor(t), pts.length - 2 );
      const frac = t - idx;
      const p0 = pts[Math.max(0, idx - 1)];
      const p1 = pts[idx];
      const p2 = pts[idx + 1];
      const p3 = pts[Math.min(pts.length - 1, idx + 2)];

      // Catmull-Rom interpolation
      const t2 = frac * frac;
      const t3 = t2 * frac;
      const x = 0.5 * (
        (2 * p1.x) +
        (-p0.x + p2.x) * frac +
        (2 * p0.x - 5 * p1.x + 4 * p2.x - p3.x) * t2 +
        (-p0.x + 3 * p1.x - 3 * p2.x + p3.x) * t3
      );
      const y = 0.5 * (
        (2 * p1.y) +
        (-p0.y + p2.y) * frac +
        (2 * p0.y - 5 * p1.y + 4 * p2.y - p3.y) * t2 +
        (-p0.y + 3 * p1.y - 3 * p2.y + p3.y) * t3
      );
      // Add subtle organic rock jitter
      const wave = Math.sin(i * 0.45 + idx) * 3.5;
      out.push({ x: x + wave, y, t: i / steps });
    }
    return out;
  }

  lavaChannels.forEach(ch => {
    ch.sampled = sampleSpline(ch.points, 100);
  });

  // Molten lava pulses / nodes traveling down the channels
  const flowPulses = [];
  lavaChannels.forEach((ch, cIdx) => {
    const count = 28;
    for (let i = 0; i < count; i++) {
      flowPulses.push({
        channelIdx: cIdx,
        progress: i / count + Math.random() * 0.03,
        speed: (0.045 + Math.random() * 0.025) * ch.speed,
        offset: (Math.random() - 0.5) * 0.65,
        size: (0.45 + Math.random() * 0.55) * ch.width,
        heat: 0.7 + Math.random() * 0.3,
        wobblePhase: Math.random() * Math.PI * 2
      });
    }
  });

  // Glowing surface cracks along the upper cone
  const coneCracks = [];
  seed = 91823;
  for (let i = 0; i < 22; i++) {
    const startX = CRATER.x + (sRand() - 0.5) * 160;
    const startY = CRATER.y + 15 + sRand() * 140;
    const dir = startX < CRATER.x ? -1 : 1;
    const segs = [];
    let cx = startX;
    let cy = startY;
    const numSegs = 4 + Math.floor(sRand() * 5);
    segs.push({ x: cx, y: cy });
    for (let j = 0; j < numSegs; j++) {
      cx += dir * (8 + sRand() * 22) + (sRand() - 0.5) * 14;
      cy += 12 + sRand() * 24;
      segs.push({ x: cx, y: cy });
    }
    coneCracks.push({
      segs,
      width: 1.5 + sRand() * 2.5,
      phase: sRand() * Math.PI * 2
    });
  }

  // Particle pools
  const ashClouds = [];
  const lavaJets = [];
  const lavaBombs = [];
  const risingEmbers = [];
  const lightningBolts = [];
  const shockwaves = [];

  // Pre-populate billowing ash plume so it is already dramatically erupting on frame 0
  function spawnAshPuff(prewarmAge = 0) {
    const spread = (Math.random() - 0.5);
    const x = CRATER.x + spread * 95;
    const y = CRATER.y - 8 + Math.random() * 16;
    // Wind drifts slightly right and expands into an anvil/plume at top
    const vy = -(48 + Math.random() * 52);
    const vx = spread * 38 + (Math.random() - 0.42) * 26;
    const maxLife = 6.5 + Math.random() * 4.5;
    const puff = {
      x,
      y,
      vx,
      vy,
      r: 34 + Math.random() * 28,
      growth: 22 + Math.random() * 18,
      age: prewarmAge,
      maxLife,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.45,
      density: 0.72 + Math.random() * 0.28,
      innerHeat: 0.8 + Math.random() * 0.4,
      lobeSeed: Math.random() * 100
    };
    // Simulate forward if prewarmed
    if (prewarmAge > 0) {
      const steps = Math.floor(prewarmAge * 20);
      const dt = prewarmAge / steps;
      for (let s = 0; s < steps; s++) {
        updateAshPuff(puff, dt);
      }
    }
    ashClouds.push(puff);
  }

  function updateAshPuff(p, dt) {
    p.age += dt;
    const lifeRatio = p.age / p.maxLife;
    // Plume rises fast near vent, then mushrooms out near top of canvas
    const altitudeFactor = Math.max(0, (CRATER.y - p.y) / 430);
    p.x += p.vx * dt + Math.sin(p.age * 1.4 + p.lobeSeed) * 14 * dt;
    p.y += p.vy * dt;
    // Buoyant deceleration and anvil spreading near top
    p.vy *= (1 - 0.12 * dt);
    if (p.y < 190) {
      p.vx += (p.x < CRATER.x ? -28 : 34) * dt;
      p.vy *= (1 - 0.35 * dt);
    }
    p.r += p.growth * (1 + altitudeFactor * 0.45) * dt;
    p.rot += p.vRot * dt;
  }

  // Spawn lava fountain blob (primary incandescent core jet)
  function spawnLavaJet(prewarmAge = 0, surgeBoost = 1) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.52;
    const speed = (220 + Math.random() * 340) * surgeBoost;
    const x = CRATER.x + (Math.random() - 0.5) * CRATER.innerWidth * 0.82;
    const y = CRATER.y + (Math.random() - 0.5) * 10;
    const maxLife = 1.3 + Math.random() * 1.1;
    const jet = {
      x,
      y,
      prevX: x,
      prevY: y,
      vx: Math.cos(angle) * speed * (0.45 + Math.random() * 0.55),
      vy: Math.sin(angle) * speed,
      r: 7 + Math.random() * 15,
      age: 0,
      maxLife,
      temp: 0.9 + Math.random() * 0.3
    };
    if (prewarmAge > 0 && prewarmAge < maxLife) {
      const steps = 12;
      const dt = prewarmAge / steps;
      for (let i = 0; i < steps; i++) {
        updateLavaJet(jet, dt);
      }
    }
    lavaJets.push(jet);
  }

  function updateLavaJet(j, dt) {
    j.prevX = j.x;
    j.prevY = j.y;
    j.age += dt;
    j.x += j.vx * dt;
    j.y += j.vy * dt;
    j.vy += 380 * dt; // Gravity
  }

  // Spawn high-velocity ballistic lava bombs that arc high and cascade onto slopes
  function spawnLavaBomb(prewarmAge = 0, surgeBoost = 1) {
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.15;
    const speed = (340 + Math.random() * 420) * surgeBoost;
    const x = CRATER.x + (Math.random() - 0.5) * 85;
    const y = CRATER.y;
    const maxLife = 1.8 + Math.random() * 1.6;
    const bomb = {
      x,
      y,
      trail: [{ x, y }],
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2.5 + Math.random() * 4.8,
      age: 0,
      maxLife,
      hueShift: Math.random()
    };
    if (prewarmAge > 0 && prewarmAge < maxLife) {
      const steps = 15;
      const dt = prewarmAge / steps;
      for (let i = 0; i < steps; i++) {
        updateLavaBomb(bomb, dt);
      }
    }
    lavaBombs.push(bomb);
  }

  function updateLavaBomb(b, dt) {
    b.age += dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 410 * dt; // Gravity
    b.vx *= (1 - 0.08 * dt);
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 9) b.trail.shift();
  }

  // Rising glowing sparks and embers drifting in thermal updrafts
  function spawnEmber(prewarmY = null) {
    const fromSlope = Math.random() < 0.35;
    let x, y;
    if (fromSlope) {
      const ch = lavaChannels[Math.floor(Math.random() * lavaChannels.length)];
      const pt = ch.sampled[Math.floor(Math.random() * ch.sampled.length)];
      x = pt.x + (Math.random() - 0.5) * 30;
      y = pt.y;
    } else {
      x = CRATER.x + (Math.random() - 0.5) * 260;
      y = prewarmY !== null ? prewarmY : (CRATER.y - Math.random() * 60);
    }
    risingEmbers.push({
      x,
      y,
      vx: (Math.random() - 0.45) * 55,
      vy: -(55 + Math.random() * 130),
      size: 1.2 + Math.random() * 3.0,
      age: Math.random() * 0.5,
      maxLife: 2.4 + Math.random() * 3.2,
      flickerSpeed: 6 + Math.random() * 10,
      phase: Math.random() * Math.PI * 2
    });
  }

  // Volcanic lightning inside the ash cloud
  function spawnLightning() {
    const startX = CRATER.x + (Math.random() - 0.5) * 160;
    const startY = CRATER.y - 50 - Math.random() * 240;
    const length = 110 + Math.random() * 190;
    const angle = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;

    function buildBranch(x0, y0, len, ang, depth) {
      const pts = [{ x: x0, y: y0 }];
      const steps = 8 + Math.floor(Math.random() * 7);
      let cx = x0;
      let cy = y0;
      const stepLen = len / steps;
      const subBranches = [];

      for (let i = 0; i < steps; i++) {
        ang += (Math.random() - 0.5) * 0.85;
        cx += Math.cos(ang) * stepLen;
        cy += Math.sin(ang) * stepLen;
        pts.push({ x: cx, y: cy });

        if (depth < 2 && Math.random() < 0.32 && i > 1 && i < steps - 1) {
          const branchAng = ang + (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.5);
          subBranches.push(buildBranch(cx, cy, len * 0.52, branchAng, depth + 1));
        }
      }
      return { pts, subBranches, depth };
    }

    lightningBolts.push({
      root: buildBranch(startX, startY, length, angle, 0),
      centerX: startX,
      centerY: startY - length * 0.3,
      age: 0,
      maxLife: 0.16 + Math.random() * 0.14,
      intensity: 0.8 + Math.random() * 0.5
    });
  }

  // Build static night sky and mountain layers
  function buildStaticLayers() {
    bgCanvas.width = 2200;
    bgCanvas.height = 1400;
    // Offset so (540, 540) in virtual space maps to (1100, 700) in bgCanvas
    const ox = 1100 - 540;
    const oy = 700 - 540;

    // Deep vivid nocturnal sky gradient
    const skyGrad = bgCtx.createLinearGradient(1100, -100, 1100, 1300);
    skyGrad.addColorStop(0.0, '#04020c');
    skyGrad.addColorStop(0.28, '#0b0521');
    skyGrad.addColorStop(0.52, '#1d083a');
    skyGrad.addColorStop(0.72, '#3d0c42');
    skyGrad.addColorStop(0.88, '#5c1132');
    skyGrad.addColorStop(1.0, '#240515');
    bgCtx.fillStyle = skyGrad;
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    // Ambient crimson/violet horizon glow behind distant mountain ranges
    const horizonGlow = bgCtx.createRadialGradient(
      CRATER.x + ox, CRATER.y + oy + 80, 40,
      CRATER.x + ox, CRATER.y + oy + 120, 920
    );
    horizonGlow.addColorStop(0.0, 'rgba(255, 70, 15, 0.52)');
    horizonGlow.addColorStop(0.35, 'rgba(215, 20, 65, 0.32)');
    horizonGlow.addColorStop(0.68, 'rgba(95, 10, 85, 0.16)');
    horizonGlow.addColorStop(1.0, 'rgba(10, 2, 20, 0)');
    bgCtx.fillStyle = horizonGlow;
    bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);

    // Distant jagged mountain silhouettes on left and right
    seed = 1337;
    bgCtx.fillStyle = '#0d041b';
    bgCtx.beginPath();
    bgCtx.moveTo(0, 1400);
    for (let x = 0; x <= 2200; x += 35) {
      const distFromCenter = Math.abs(x - (CRATER.x + ox));
      const baseH = 740 + oy - Math.sin(x * 0.003) * 65 - Math.cos(x * 0.011) * 35;
      const jag = (sRand() - 0.5) * 32;
      const y = baseH + jag + (distFromCenter < 450 ? 120 : 0);
      bgCtx.lineTo(x, y);
    }
    bgCtx.lineTo(2200, 1400);
    bgCtx.closePath();
    bgCtx.fill();

    // Build Main Volcano Body on mountainCanvas
    mountainCanvas.width = 2200;
    mountainCanvas.height = 1400;
    mountainCtx.clearRect(0, 0, 2200, 1400);

    const cx = CRATER.x + ox;
    const cy = CRATER.y + oy;

    // Left and right volcano slope profile points
    const leftSlope = [
      { x: cx - CRATER.rimWidth * 0.52, y: cy + 2 },
      { x: cx - 108, y: cy + 68 },
      { x: cx - 175, y: cy + 148 },
      { x: cx - 262, y: cy + 245 },
      { x: cx - 375, y: cy + 355 },
      { x: cx - 515, y: cy + 475 },
      { x: cx - 720, y: cy + 610 },
      { x: cx - 1050, y: cy + 740 }
    ];

    const rightSlope = [
      { x: cx + CRATER.rimWidth * 0.52, y: cy + 2 },
      { x: cx + 104, y: cy + 64 },
      { x: cx + 178, y: cy + 150 },
      { x: cx + 268, y: cy + 248 },
      { x: cx + 388, y: cy + 362 },
      { x: cx + 530, y: cy + 480 },
      { x: cx + 740, y: cy + 615 },
      { x: cx + 1050, y: cy + 740 }
    ];

    // Base dark volcanic rock silhouette
    mountainCtx.save();
    mountainCtx.beginPath();
    mountainCtx.moveTo(leftSlope[leftSlope.length - 1].x, 1400);
    for (let i = leftSlope.length - 1; i >= 0; i--) {
      mountainCtx.lineTo(leftSlope[i].x, leftSlope[i].y);
    }
    // Jagged dipped crater rim
    mountainCtx.lineTo(cx - 38, cy + 12);
    mountainCtx.lineTo(cx - 12, cy + 6);
    mountainCtx.lineTo(cx + 18, cy + 14);
    mountainCtx.lineTo(cx + 42, cy + 5);
    for (let i = 0; i < rightSlope.length; i++) {
      mountainCtx.lineTo(rightSlope[i].x, rightSlope[i].y);
    }
    mountainCtx.lineTo(rightSlope[rightSlope.length - 1].x, 1400);
    mountainCtx.closePath();

    const coneGrad = mountainCtx.createLinearGradient(cx, cy, cx, cy + 680);
    coneGrad.addColorStop(0.0, '#2a0918');
    coneGrad.addColorStop(0.22, '#1b0618');
    coneGrad.addColorStop(0.55, '#110414');
    coneGrad.addColorStop(1.0, '#07020c');
    mountainCtx.fillStyle = coneGrad;
    mountainCtx.fill();
    mountainCtx.clip();

    // Paint faceted rock ridges illuminated by overhead & slope lava
    seed = 55129;
    for (let r = 0; r < 65; r++) {
      const t = sRand();
      const spread = (sRand() - 0.5) * 2;
      const topY = cy + 15 + t * 550;
      const spanAtY = 75 + t * 680;
      const rx = cx + spread * spanAtY;
      const rw = 28 + sRand() * 95;
      const rh = 65 + sRand() * 180;
      const skew = spread * (35 + sRand() * 75);

      mountainCtx.beginPath();
      mountainCtx.moveTo(rx, topY);
      mountainCtx.lineTo(rx + skew - rw * 0.6, topY + rh);
      mountainCtx.lineTo(rx + skew + rw * 0.15, topY + rh * 1.08);
      mountainCtx.closePath();

      // Warm rim lighting near the crater, deep violet-crimson further down
      const distFactor = Math.max(0, 1 - t * 1.15);
      const red = Math.floor(55 + distFactor * 145);
      const green = Math.floor(10 + distFactor * 42);
      const blue = Math.floor(32 + (1 - distFactor) * 25);
      const alpha = 0.14 + distFactor * 0.25;
      mountainCtx.fillStyle = `rgba(${red}, ${green}, ${blue}, ${alpha})`;
      mountainCtx.fill();

      // Dark shadow facet on the opposite side of the ridge
      mountainCtx.beginPath();
      mountainCtx.moveTo(rx, topY);
      mountainCtx.lineTo(rx + skew + rw * 0.15, topY + rh * 1.08);
      mountainCtx.lineTo(rx + skew + rw * 0.75, topY + rh * 0.92);
      mountainCtx.closePath();
      mountainCtx.fillStyle = 'rgba(5, 1, 10, 0.48)';
      mountainCtx.fill();
    }

    mountainCtx.restore();
  }

  // Pre-seed particles so the eruption is in full glory immediately on load
  function prewarmSimulation() {
    for (let i = 0; i < 95; i++) {
      spawnAshPuff( (i / 95) * 7.5 );
    }
    for (let i = 0; i < 110; i++) {
      spawnLavaJet(Math.random() * 1.5, 1.0);
    }
    for (let i = 0; i < 55; i++) {
      spawnLavaBomb(Math.random() * 1.8, 1.0);
    }
    for (let i = 0; i < 120; i++) {
      spawnEmber(CRATER.y + 300 - Math.random() * 900);
    }
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);

    // Cover scaling: ensure 1080x1080 center composition looks best and fills any window
    const scaleX = canvas.width / 1080;
    const scaleY = canvas.height / 1080;
    scale = Math.max(scaleX, scaleY);
    // Slightly blend between contain & cover on extreme aspect ratios so neither crater nor peak is clipped
    if (canvas.height / canvas.width > 1.35) {
      scale = canvas.height / 1120;
    } else if (canvas.width / canvas.height > 1.35) {
      scale = canvas.height / 1040;
    }

    offsetX = (canvas.width - 1080 * scale) * 0.5;
    offsetY = (canvas.height - 1080 * scale) * 0.5;
  }

  window.addEventListener('resize', resize);
  buildStaticLayers();
  prewarmSimulation();
  resize();

  let lastTime = performance.now();
  let elapsed = 0;
  let ashAccumulator = 0;
  let jetAccumulator = 0;
  let bombAccumulator = 0;
  let emberAccumulator = 0;
  let nextLightningTimer = 0.6;
  let nextShockwaveTimer = 1.2;

  function render(now) {
    const rawDt = (now - lastTime) / 1000;
    lastTime = now;
    const dt = Math.min(rawDt, 0.05);
    elapsed += dt;

    // Eruption surge rhythm (pulsing volcanic pressure)
    const surge = 0.88 + 0.22 * Math.sin(elapsed * 2.1) + 0.14 * Math.sin(elapsed * 5.3 + 1.2);

    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

    // 1. Draw static night sky & distant horizon (offset so 540,540 aligns with 1100,700)
    const ox = 1100 - 540;
    const oy = 700 - 540;
    ctx.drawImage(bgCanvas, -ox, -oy);

    // 2. Twinkling stars in upper night sky
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = 0.55 + 0.45 * Math.sin(elapsed * s.speed + s.phase);
      const alpha = s.baseAlpha * twinkle;
      ctx.fillStyle = `hsla(${s.hue}, 85%, 90%, ${alpha})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 3. Dynamic pulsating sky glow behind the ash plume & crater
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const backGlowRadius = (460 + 55 * Math.sin(elapsed * 3.4)) * surge;
    const backGlow = ctx.createRadialGradient(
      CRATER.x, CRATER.y - 60, 20,
      CRATER.x, CRATER.y - 60, backGlowRadius
    );
    backGlow.addColorStop(0.0, 'rgba(255, 180, 60, 0.75)');
    backGlow.addColorStop(0.28, 'rgba(255, 65, 15, 0.52)');
    backGlow.addColorStop(0.62, 'rgba(190, 12, 65, 0.25)');
    backGlow.addColorStop(1.0, 'rgba(60, 0, 40, 0)');
    ctx.fillStyle = backGlow;
    ctx.beginPath();
    ctx.arc(CRATER.x, CRATER.y - 60, backGlowRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 4. Spawn and update Ash Clouds (Billowing Pyroclastic Plume)
    ashAccumulator += dt * 16;
    while (ashAccumulator >= 1) {
      ashAccumulator -= 1;
      spawnAshPuff(0);
    }

    // Sort ash puffs roughly back-to-front (older/higher first, younger/lower near vent on top)
    for (let i = ashClouds.length - 1; i >= 0; i--) {
      const p = ashClouds[i];
      updateAshPuff(p, dt);
      if (p.age >= p.maxLife) {
        ashClouds.splice(i, 1);
      }
    }

    // Compute active lightning flash illumination on nearby ash clouds
    let activeFlashIntensity = 0;
    let flashX = CRATER.x;
    let flashY = CRATER.y - 180;
    for (let i = 0; i < lightningBolts.length; i++) {
      const lb = lightningBolts[i];
      const f = (1 - lb.age / lb.maxLife) * lb.intensity;
      if (f > activeFlashIntensity) {
        activeFlashIntensity = f;
        flashX = lb.centerX;
        flashY = lb.centerY;
      }
    }

    // Render billowing ash clouds with dramatic under-lighting from the crater
    for (let i = 0; i < ashClouds.length; i++) {
      const p = ashClouds[i];
      const lifeRatio = p.age / p.maxLife;
      const fadeIn = Math.min(1, p.age * 2.8);
      const fadeOut = Math.pow(Math.max(0, 1 - lifeRatio), 1.45);
      const alpha = fadeIn * fadeOut * p.density;
      if (alpha <= 0.01) continue;

      const distToCrater = Math.hypot(p.x - CRATER.x, p.y - CRATER.y);
      const craterHeat = Math.max(0, 1 - distToCrater / 420) * p.innerHeat * surge;

      // Also check proximity to volcanic lightning
      let boltLit = 0;
      if (activeFlashIntensity > 0) {
        const dBolt = Math.hypot(p.x - flashX, p.y - flashY);
        boltLit = Math.max(0, 1 - dBolt / 260) * activeFlashIntensity;
      }

      // Draw dark smoky upper crown of the puff
      const grad = ctx.createRadialGradient(
        p.x, p.y + p.r * 0.38, p.r * 0.08,
        p.x, p.y - p.r * 0.12, p.r
      );

      if (craterHeat > 0.35) {
        // Intense incandescent orange-magenta underbelly transitioning to dark ash
        const r = Math.min(255, Math.floor(195 + craterHeat * 60 + boltLit * 60));
        const g = Math.min(255, Math.floor(38 + craterHeat * 115 + boltLit * 140));
        const b = Math.min(255, Math.floor(28 + craterHeat * 20 + boltLit * 195));
        grad.addColorStop(0.0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.95})`);
        grad.addColorStop(0.42, `rgba(${Math.floor(r * 0.55)}, ${Math.floor(g * 0.32)}, ${Math.floor(38 + boltLit * 90)}, ${alpha * 0.88})`);
        grad.addColorStop(0.76, `rgba(26, 12, 34, ${alpha * 0.72})`);
        grad.addColorStop(1.0, 'rgba(12, 6, 20, 0)');
      } else {
        // High altitude ash cloud with subtle crimson rim and lightning silver-violet glow
        const r = Math.min(255, Math.floor(52 + craterHeat * 140 + boltLit * 160));
        const g = Math.min(255, Math.floor(16 + craterHeat * 45 + boltLit * 150));
        const b = Math.min(255, Math.floor(38 + craterHeat * 25 + boltLit * 190));
        grad.addColorStop(0.0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.85})`);
        grad.addColorStop(0.55, `rgba(22, 10, 30, ${alpha * 0.75})`);
        grad.addColorStop(1.0, 'rgba(10, 4, 16, 0)');
      }

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 5. Volcanic Lightning inside the ash plume
    nextLightningTimer -= dt;
    if (nextLightningTimer <= 0) {
      spawnLightning();
      if (Math.random() < 0.38) spawnLightning(); // Occasional double fork
      nextLightningTimer = 0.35 + Math.random() * 1.15;
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = lightningBolts.length - 1; i >= 0; i--) {
      const bolt = lightningBolts[i];
      bolt.age += dt;
      if (bolt.age >= bolt.maxLife) {
        lightningBolts.splice(i, 1);
        continue;
      }
      const lifeLeft = 1 - bolt.age / bolt.maxLife;
      const flicker = Math.random() > 0.2 ? 1 : 0.35;
      const alpha = lifeLeft * bolt.intensity * flicker;

      function drawBranch(b) {
        ctx.beginPath();
        for (let k = 0; k < b.pts.length; k++) {
          if (k === 0) ctx.moveTo(b.pts[k].x, b.pts[k].y);
          else ctx.lineTo(b.pts[k].x, b.pts[k].y);
        }
        // Outer electric violet/magenta glow
        ctx.strokeStyle = `rgba(255, 95, 220, ${alpha * 0.65})`;
        ctx.lineWidth = (b.depth === 0 ? 8 : 4) * lifeLeft;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Inner white-gold core
        ctx.strokeStyle = `rgba(255, 245, 215, ${alpha})`;
        ctx.lineWidth = (b.depth === 0 ? 2.6 : 1.3) * lifeLeft;
        ctx.stroke();

        for (let s = 0; s < b.subBranches.length; s++) {
          drawBranch(b.subBranches[s]);
        }
      }
      drawBranch(bolt.root);
    }
    ctx.restore();

    // 6. Eruption Shockwaves expanding from crater
    nextShockwaveTimer -= dt;
    if (nextShockwaveTimer <= 0) {
      shockwaves.push({
        x: CRATER.x,
        y: CRATER.y - 12,
        r: 35,
        age: 0,
        maxLife: 1.35
      });
      nextShockwaveTimer = 1.6 + Math.random() * 1.8;
    }

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.age += dt;
      sw.r += 260 * dt;
      if (sw.age >= sw.maxLife) {
        shockwaves.splice(i, 1);
        continue;
      }
      const alpha = Math.pow(1 - sw.age / sw.maxLife, 1.8) * 0.32;
      ctx.strokeStyle = `rgba(255, 160, 75, ${alpha})`;
      ctx.lineWidth = 4 + (1 - sw.age / sw.maxLife) * 8;
      ctx.beginPath();
      ctx.ellipse(sw.x, sw.y, sw.r, sw.r * 0.55, 0, Math.PI * 1.05, Math.PI * 1.95);
      ctx.stroke();
    }
    ctx.restore();

    // 7. Lava Fountains (Primary Incandescent Core + Ballistic Lava Bombs)
    jetAccumulator += dt * 95 * surge;
    while (jetAccumulator >= 1) {
      jetAccumulator -= 1;
      spawnLavaJet(0, surge);
    }

    bombAccumulator += dt * 36 * surge;
    while (bombAccumulator >= 1) {
      bombAccumulator -= 1;
      spawnLavaBomb(0, surge);
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // Intense cauldron core glow at the crater throat
    const cauldronGlow = ctx.createRadialGradient(
      CRATER.x, CRATER.y - 5, 12,
      CRATER.x, CRATER.y - 25, 220 * surge
    );
    cauldronGlow.addColorStop(0.0, 'rgba(255, 255, 210, 0.95)');
    cauldronGlow.addColorStop(0.22, 'rgba(255, 175, 30, 0.82)');
    cauldronGlow.addColorStop(0.55, 'rgba(255, 45, 5, 0.45)');
    cauldronGlow.addColorStop(1.0, 'rgba(180, 0, 20, 0)');
    ctx.fillStyle = cauldronGlow;
    ctx.beginPath();
    ctx.arc(CRATER.x, CRATER.y - 15, 220 * surge, 0, Math.PI * 2);
    ctx.fill();

    // Update and draw primary lava fountain jets
    for (let i = lavaJets.length - 1; i >= 0; i--) {
      const j = lavaJets[i];
      updateLavaJet(j, dt);
      if (j.age >= j.maxLife || j.y > CRATER.y + 85) {
        lavaJets.splice(i, 1);
        continue;
      }
      const lifeRatio = j.age / j.maxLife;
      const heat = (1 - lifeRatio * 0.72) * j.temp;
      const radius = j.r * (1 - lifeRatio * 0.45);

      // Outer crimson/orange halo
      ctx.strokeStyle = `rgba(255, ${Math.floor(45 + heat * 120)}, 10, ${0.55 * (1 - lifeRatio)})`;
      ctx.lineWidth = radius * 2.1;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(j.prevX, j.prevY);
      ctx.lineTo(j.x, j.y);
      ctx.stroke();

      // Inner blinding yellow-white core
      if (heat > 0.55) {
        ctx.strokeStyle = `rgba(255, ${Math.floor(205 + heat * 50)}, ${Math.floor(110 + heat * 135)}, ${0.85 * (1 - lifeRatio)})`;
        ctx.lineWidth = radius * 0.85;
        ctx.beginPath();
        ctx.moveTo(j.prevX, j.prevY);
        ctx.lineTo(j.x, j.y);
        ctx.stroke();
      }
    }

    // Update and draw ballistic lava bombs with glowing parabolic trails
    for (let i = lavaBombs.length - 1; i >= 0; i--) {
      const b = lavaBombs[i];
      updateLavaBomb(b, dt);
      if (b.age >= b.maxLife || b.y > 1100) {
        lavaBombs.splice(i, 1);
        continue;
      }
      const lifeRatio = b.age / b.maxLife;
      const alpha = Math.min(1, (1 - lifeRatio) * 1.35);

      if (b.trail.length > 1) {
        ctx.beginPath();
        ctx.moveTo(b.trail[0].x, b.trail[0].y);
        for (let k = 1; k < b.trail.length; k++) {
          ctx.lineTo(b.trail[k].x, b.trail[k].y);
        }
        ctx.strokeStyle = `rgba(255, 85, 15, ${alpha * 0.65})`;
        ctx.lineWidth = b.size * 1.6;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.strokeStyle = `rgba(255, 235, 140, ${alpha * 0.9})`;
        ctx.lineWidth = b.size * 0.65;
        ctx.stroke();
      }

      // Glowing molten bomb head
      ctx.fillStyle = `rgba(255, 250, 195, ${alpha})`;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 8. Draw Volcano Cone Silhouette & Faceted Slopes over the lower fountain base
    ctx.drawImage(mountainCanvas, -ox, -oy);

    // 9. Glowing Fissures & Cracks on the Upper Cone
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < coneCracks.length; i++) {
      const c = coneCracks[i];
      const pulse = 0.65 + 0.35 * Math.sin(elapsed * 3.2 + c.phase);
      ctx.beginPath();
      for (let k = 0; k < c.segs.length; k++) {
        if (k === 0) ctx.moveTo(c.segs[k].x, c.segs[k].y);
        else ctx.lineTo(c.segs[k].x, c.segs[k].y);
      }
      ctx.strokeStyle = `rgba(255, 55, 10, ${0.48 * pulse})`;
      ctx.lineWidth = c.width * 2.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();

      ctx.strokeStyle = `rgba(255, 205, 85, ${0.82 * pulse})`;
      ctx.lineWidth = c.width * 0.8;
      ctx.stroke();
    }
    ctx.restore();

    // 10. Glowing Lava Rivers Flowing Down the Slopes
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Pass A: Wide deep crimson/orange thermal glow illuminating the rock banks
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < lavaChannels.length; i++) {
      const ch = lavaChannels[i];
      const pts = ch.sampled;
      ctx.beginPath();
      for (let k = 0; k < pts.length; k++) {
        if (k === 0) ctx.moveTo(pts[k].x, pts[k].y);
        else ctx.lineTo(pts[k].x, pts[k].y);
      }
      ctx.strokeStyle = 'rgba(215, 22, 8, 0.38)';
      ctx.lineWidth = ch.width * 2.8;
      ctx.stroke();
    }

    // Pass B: Molten orange river body
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < lavaChannels.length; i++) {
      const ch = lavaChannels[i];
      const pts = ch.sampled;
      ctx.beginPath();
      for (let k = 0; k < pts.length; k++) {
        const wobble = Math.sin(k * 0.25 - elapsed * 3.5 * ch.speed) * 2.2;
        const px = pts[k].x + wobble;
        const py = pts[k].y;
        if (k === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.strokeStyle = 'rgba(255, 78, 10, 0.78)';
      ctx.lineWidth = ch.width * 1.15;
      ctx.stroke();

      // Incandescent yellow-gold inner stream
      ctx.strokeStyle = 'rgba(255, 195, 45, 0.72)';
      ctx.lineWidth = ch.width * 0.48;
      ctx.stroke();
    }

    // Pass C: Animated flowing molten surges/pulses traveling down the channels
    for (let i = 0; i < flowPulses.length; i++) {
      const fp = flowPulses[i];
      fp.progress = (fp.progress + fp.speed * dt) % 1;

      const ch = lavaChannels[fp.channelIdx];
      const pts = ch.sampled;
      const idxFloat = fp.progress * (pts.length - 1);
      const idx = Math.floor(idxFloat);
      const nextIdx = Math.min(pts.length - 1, idx + 1);
      const frac = idxFloat - idx;

      const bx = pts[idx].x + (pts[nextIdx].x - pts[idx].x) * frac;
      const by = pts[idx].y + (pts[nextIdx].y - pts[idx].y) * frac;

      // Tangential direction for elongated lava blobs
      const dx = pts[nextIdx].x - pts[Math.max(0, idx - 1)].x;
      const dy = pts[nextIdx].y - pts[Math.max(0, idx - 1)].y;
      const ang = Math.atan2(dy, dx);

      const lateral = Math.sin(elapsed * 2.6 + fp.wobblePhase) * ch.width * 0.24 + fp.offset * ch.width * 0.3;
      const px = bx + Math.cos(ang + Math.PI / 2) * lateral;
      const py = by + Math.sin(ang + Math.PI / 2) * lateral;

      // Altitude cooling factor (white-hot near rim, bright orange-gold lower down)
      const rimHotness = Math.max(0.25, 1 - fp.progress * 0.55) * fp.heat;
      const rSize = fp.size * (0.75 + 0.35 * Math.sin(elapsed * 4 + fp.wobblePhase));

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang);

      // Hot glowing surge capsule
      ctx.fillStyle = `rgba(255, ${Math.floor(140 + rimHotness * 110)}, ${Math.floor(30 + rimHotness * 165)}, ${0.65 * rimHotness})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, rSize * 1.45, rSize * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();

      // White-yellow hot core
      if (rimHotness > 0.5) {
        ctx.fillStyle = `rgba(255, 250, 200, ${0.75 * rimHotness})`;
        ctx.beginPath();
        ctx.ellipse(0, 0, rSize * 0.7, rSize * 0.22, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // 11. Boiling Crater Rim Spillover & Bright Magma Lip
    const rimGlow = ctx.createRadialGradient(
      CRATER.x, CRATER.y + 4, 8,
      CRATER.x, CRATER.y + 8, CRATER.rimWidth * 0.85
    );
    rimGlow.addColorStop(0.0, 'rgba(255, 255, 220, 0.95)');
    rimGlow.addColorStop(0.45, 'rgba(255, 165, 35, 0.85)');
    rimGlow.addColorStop(0.78, 'rgba(255, 45, 5, 0.45)');
    rimGlow.addColorStop(1.0, 'rgba(200, 0, 10, 0)');
    ctx.fillStyle = rimGlow;
    ctx.beginPath();
    ctx.ellipse(CRATER.x, CRATER.y + 6, CRATER.rimWidth * 0.82, 26, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 12. Jagged dark foreground crater teeth / rock outcrops for depth
    ctx.fillStyle = '#12030b';
    const rimTeeth = [
      { x: CRATER.x - 58, y: CRATER.y + 6, w: 18, h: 12 },
      { x: CRATER.x - 24, y: CRATER.y + 11, w: 22, h: 14 },
      { x: CRATER.x + 14, y: CRATER.y + 9, w: 20, h: 13 },
      { x: CRATER.x + 46, y: CRATER.y + 5, w: 16, h: 11 }
    ];
    for (let i = 0; i < rimTeeth.length; i++) {
      const rt = rimTeeth[i];
      ctx.beginPath();
      ctx.moveTo(rt.x - rt.w * 0.5, rt.y + rt.h);
      ctx.lineTo(rt.x, rt.y - rt.h * 0.4);
      ctx.lineTo(rt.x + rt.w * 0.5, rt.y + rt.h);
      ctx.closePath();
      ctx.fill();
    }

    // 13. Rising Sparks & Glowing Embers across the whole canvas
    emberAccumulator += dt * 42 * surge;
    while (emberAccumulator >= 1) {
      emberAccumulator -= 1;
      spawnEmber();
    }

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = risingEmbers.length - 1; i >= 0; i--) {
      const e = risingEmbers[i];
      e.age += dt;
      if (e.age >= e.maxLife || e.y < -200) {
        risingEmbers.splice(i, 1);
        continue;
      }
      const lifeRatio = e.age / e.maxLife;
      e.x += (e.vx + Math.sin(elapsed * 2.5 + e.phase) * 28) * dt;
      e.y += e.vy * dt;

      const flicker = 0.55 + 0.45 * Math.sin(elapsed * e.flickerSpeed + e.phase);
      const alpha = (1 - lifeRatio) * flicker;
      const r = e.size * (1 - lifeRatio * 0.4);

      ctx.fillStyle = `rgba(255, ${Math.floor(135 + flicker * 115)}, ${Math.floor(35 + flicker * 120)}, ${alpha})`;
      ctx.beginPath();
      ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // 14. Base Foreground Silhouette Ridges & Molten Pool Reflections at bottom edge
    ctx.save();
    const baseGlow = ctx.createLinearGradient(540, 920, 540, 1120);
    baseGlow.addColorStop(0.0, 'rgba(255, 60, 10, 0)');
    baseGlow.addColorStop(0.65, 'rgba(255, 55, 10, 0.22)');
    baseGlow.addColorStop(1.0, 'rgba(255, 125, 25, 0.42)');
    ctx.fillStyle = baseGlow;
    ctx.fillRect(-500, 920, 2080, 260);

    // Foreground jagged basalt crags framing the bottom corners
    ctx.fillStyle = '#060109';
    ctx.beginPath();
    ctx.moveTo(-500, 1200);
    ctx.lineTo(-500, 985);
    ctx.lineTo(-120, 995);
    ctx.lineTo(45, 1030);
    ctx.lineTo(140, 1068);
    ctx.lineTo(265, 1055);
    ctx.lineTo(395, 1085);
    ctx.lineTo(685, 1082);
    ctx.lineTo(820, 1048);
    ctx.lineTo(960, 1062);
    ctx.lineTo(1140, 1015);
    ctx.lineTo(1580, 980);
    ctx.lineTo(1580, 1200);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
