<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volcano</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050210; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  // Scene is designed in a 1080x1080 reference space, scaled to cover the window.
  const REF = 1080;
  let S = 1, OX = 0, OY = 0;

  // Random helpers
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  // Scene geometry (reference coords)
  const VENT = { x: 540, y: 470 };      // crater center
  const BASE_Y = 900;                   // volcano base
  const SLOPE_L = 60, SLOPE_R = 1020;   // base extents

  // Pseudo-noise for ridge detail (deterministic)
  function ridge(t) {
    return Math.sin(t * 13.1) * 6 + Math.sin(t * 29.7 + 1.3) * 3 + Math.sin(t * 61.3 + 2.1) * 1.5;
  }

  // Volcano outline points (left base -> crater -> right base)
  const outline = [];
  (function buildOutline() {
    const craterHalf = 55;
    const N = 60;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = SLOPE_L + (VENT.x - craterHalf - SLOPE_L) * t;
      // concave-up slope profile
      const y = BASE_Y - (BASE_Y - (VENT.y + 10)) * Math.pow(t, 1.6) + ridge(t * 7) * (1 - t);
      outline.push({ x, y });
    }
    outline.push({ x: VENT.x - craterHalf, y: VENT.y + 8 });
    outline.push({ x: VENT.x - 30, y: VENT.y + 24 });
    outline.push({ x: VENT.x + 30, y: VENT.y + 24 });
    outline.push({ x: VENT.x + craterHalf, y: VENT.y + 6 });
    for (let i = N; i >= 0; i--) {
      const t = i / N;
      const x = SLOPE_R - (SLOPE_R - (VENT.x + craterHalf)) * t;
      const y = BASE_Y - (BASE_Y - (VENT.y + 8)) * Math.pow(t, 1.6) + ridge(t * 7 + 3) * (1 - t);
      outline.push({ x, y });
    }
  })();

  // Function: slope surface height at x (approximate via outline lookup)
  function surfaceY(x) {
    const craterHalf = 55;
    if (x < SLOPE_L || x > SLOPE_R) return BASE_Y;
    if (x <= VENT.x) {
      const t = (x - SLOPE_L) / (VENT.x - craterHalf - SLOPE_L);
      if (t >= 1) return VENT.y + 10 + (x - (VENT.x - craterHalf)) * 0.25;
      return BASE_Y - (BASE_Y - (VENT.y + 10)) * Math.pow(t, 1.6) + ridge(t * 7) * (1 - t);
    } else {
      const t = (SLOPE_R - x) / (SLOPE_R - (VENT.x + craterHalf));
      if (t >= 1) return VENT.y + 8 + ((VENT.x + craterHalf) - x) * 0.25;
      return BASE_Y - (BASE_Y - (VENT.y + 8)) * Math.pow(t, 1.6) + ridge(t * 7 + 3) * (1 - t);
    }
  }

  // Stars
  const stars = [];
  for (let i = 0; i < 260; i++) {
    stars.push({ x: rand(0, REF), y: rand(0, 620), r: rand(0.4, 1.8), p: rand(0, TAU), s: rand(0.5, 2.5) });
  }

  // Lava flow channels: each a polyline down a slope, with a pulsing glow
  const flows = [];
  function makeFlow(side, offset, width, speed) {
    const pts = [];
    let x = VENT.x + side * 30;
    let y = VENT.y + 20;
    pts.push({ x, y });
    let wander = offset;
    while (y < BASE_Y - 10 && x > SLOPE_L + 10 && x < SLOPE_R - 10) {
      x += side * rand(6, 14) + Math.sin(wander) * 4;
      wander += rand(0.2, 0.6);
      y = surfaceY(x) + rand(-2, 2);
      pts.push({ x, y });
    }
    return { pts, width, phase: rand(0, TAU), speed, side };
  }
  flows.push(makeFlow(-1, 0.0, 16, 1.0));
  flows.push(makeFlow(-1, 2.2, 9, 1.6));
  flows.push(makeFlow(1, 1.0, 18, 0.8));
  flows.push(makeFlow(1, 3.1, 8, 1.4));
  flows.push(makeFlow(1, 4.6, 6, 2.0));

  // Lava particles (fountain)
  const lava = [];
  const MAX_LAVA = 900;
  function spawnLava(n, power) {
    for (let i = 0; i < n && lava.length < MAX_LAVA; i++) {
      const ang = -Math.PI / 2 + rand(-0.42, 0.42);
      const sp = rand(5, 13) * power;
      lava.push({
        x: VENT.x + rand(-22, 22), y: VENT.y + 10,
        vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
        r: rand(1.5, 5.5), life: 1, decay: rand(0.006, 0.014),
        trail: []
      });
    }
  }

  // Embers / sparks (small, long-lived, drift with wind)
  const embers = [];
  function spawnEmber(x, y) {
    if (embers.length > 400) return;
    embers.push({ x, y, vx: rand(-1, 1), vy: rand(-3, -0.5), r: rand(0.6, 1.6), life: 1, decay: rand(0.004, 0.01) });
  }

  // Ash cloud puffs
  const ash = [];
  const MAX_ASH = 220;
  function spawnAsh(n) {
    for (let i = 0; i < n && ash.length < MAX_ASH; i++) {
      ash.push({
        x: VENT.x + rand(-30, 30), y: VENT.y - rand(0, 30),
        vx: rand(-0.6, 0.6), vy: rand(-2.4, -1.2),
        r: rand(18, 34), grow: rand(0.35, 0.7),
        life: 1, decay: rand(0.0022, 0.0038),
        rot: rand(0, TAU), rs: rand(-0.01, 0.01),
        seed: Math.random()
      });
    }
  }

  // Pre-render an ash puff sprite (soft blob with lumps)
  const puff = document.createElement('canvas');
  puff.width = puff.height = 128;
  (function drawPuff() {
    const p = puff.getContext('2d');
    const lumps = [[64, 64, 40], [44, 56, 30], [84, 58, 32], [60, 44, 28], [70, 80, 30], [48, 78, 24]];
    for (const [x, y, r] of lumps) {
      const g = p.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(255,255,255,0.55)');
      g.addColorStop(0.6, 'rgba(255,255,255,0.22)');
      g.addColorStop(1, 'rgba(255,255,255,0)');
      p.fillStyle = g;
      p.fillRect(0, 0, 128, 128);
    }
  })();

  // Glow sprite for lava blobs
  const glow = document.createElement('canvas');
  glow.width = glow.height = 64;
  (function drawGlow() {
    const g2 = glow.getContext('2d');
    const g = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,220,1)');
    g.addColorStop(0.25, 'rgba(255,200,60,0.9)');
    g.addColorStop(0.6, 'rgba(255,80,10,0.35)');
    g.addColorStop(1, 'rgba(255,40,0,0)');
    g2.fillStyle = g;
    g2.fillRect(0, 0, 64, 64);
  })();

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    // Cover-fit the 1080 reference into the window; anchor toward the bottom so the volcano stays grounded
    S = Math.max(W / REF, H / REF);
    OX = (W - REF * S) / 2;
    OY = (H - REF * S);
  }
  window.addEventListener('resize', resize);
  resize();

  // Eruption intensity: slow rhythm with random bursts
  let t0 = performance.now();
  let burst = 0, nextBurst = 2.5;
  let lastTime = t0;

  function lavaColor(life) {
    // 1 -> white-yellow, 0 -> dark red
    if (life > 0.75) return `rgba(255,${Math.floor(230 - (1 - life) * 400)},${Math.floor(120 - (1 - life) * 400)},1)`;
    if (life > 0.4) return `rgba(255,${Math.floor(40 + (life - 0.4) * 280)},0,1)`;
    return `rgba(${Math.floor(120 + life * 330)},${Math.floor(life * 60)},0,${0.4 + life * 1.5})`;
  }

  function frame(now) {
    const dt = Math.min((now - lastTime) / 16.667, 3); // in 60fps frames
    lastTime = now;
    const time = (now - t0) / 1000;

    // Intensity envelope
    nextBurst -= dt / 60;
    if (nextBurst <= 0) { burst = rand(0.8, 1.6); nextBurst = rand(2.5, 6); }
    burst = Math.max(0, burst - dt * 0.012);
    const intensity = 0.55 + 0.25 * Math.sin(time * 0.9) + burst;

    // Spawn
    spawnLava(Math.round((3 + intensity * 5) * dt), 0.9 + intensity * 0.45);
    if (Math.random() < 0.9 * dt) spawnAsh(Math.round(1 + intensity * 1.5));

    // Canvas setup
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    // ---- Sky ----
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#07031c');
    sky.addColorStop(0.45, '#160a3a');
    sky.addColorStop(0.8, '#3a0d2e');
    sky.addColorStop(1, '#5a1515');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Transform to reference space
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);

    // Stars
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(time * s.s + s.p);
      ctx.fillStyle = `rgba(255,245,230,${tw})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }

    // Moon (small, low left)
    (function moon() {
      const mx = 170, my = 150;
      const g = ctx.createRadialGradient(mx, my, 20, mx, my, 120);
      g.addColorStop(0, 'rgba(200,210,255,0.35)');
      g.addColorStop(1, 'rgba(200,210,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(mx, my, 120, 0, TAU); ctx.fill();
      ctx.fillStyle = '#e8ecff'; ctx.beginPath(); ctx.arc(mx, my, 26, 0, TAU); ctx.fill();
      ctx.fillStyle = '#c9cfee';
      ctx.beginPath(); ctx.arc(mx - 8, my - 6, 5, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + 9, my + 8, 4, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.arc(mx + 3, my - 12, 3, 0, TAU); ctx.fill();
    })();

    // Big crater glow lighting the sky and underside of ash
    ctx.globalCompositeOperation = 'lighter';
    (function craterSkyGlow() {
      const r = 420 + intensity * 120;
      const g = ctx.createRadialGradient(VENT.x, VENT.y, 10, VENT.x, VENT.y, r);
      g.addColorStop(0, `rgba(255,120,30,${0.45 + intensity * 0.15})`);
      g.addColorStop(0.3, `rgba(255,60,20,${0.22 + intensity * 0.08})`);
      g.addColorStop(1, 'rgba(255,30,30,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(VENT.x, VENT.y, r, 0, TAU); ctx.fill();
    })();
    ctx.globalCompositeOperation = 'source-over';

    // ---- Ash clouds (behind the fountain, above volcano) ----
    for (let i = ash.length - 1; i >= 0; i--) {
      const a = ash[i];
      a.life -= a.decay * dt;
      if (a.life <= 0) { ash.splice(i, 1); continue; }
      const age = 1 - a.life;
      // Rise fast then slow, drift right with wind, expand
      a.vy += 0.012 * dt;
      if (a.vy > -0.25) a.vy = -0.25;
      a.vx += (0.9 - a.vx) * 0.004 * dt + Math.sin(time * 0.7 + a.seed * 10) * 0.01;
      a.x += a.vx * dt; a.y += a.vy * dt;
      a.r += a.grow * dt;
      a.rot += a.rs * dt;

      // Color: lit red-orange from below when low/young, fading to dark purple-grey as it rises
      const heat = Math.max(0, 1 - (VENT.y - a.y) / 260) * (0.6 + intensity * 0.4);
      const alpha = Math.min(1, a.life * 2.2) * 0.85;
      const rC = Math.floor(70 + heat * 185), gC = Math.floor(40 + heat * 60), bC = Math.floor(70 - heat * 40);
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);
      ctx.globalAlpha = alpha;
      // Colored radial body, then a soft white sprite overlay for texture
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, a.r);
      g.addColorStop(0, `rgba(${rC},${gC},${bC},0.9)`);
      g.addColorStop(0.55, `rgba(${Math.floor(rC * 0.6)},${Math.floor(gC * 0.6)},${Math.floor(bC * 0.9)},0.6)`);
      g.addColorStop(1, `rgba(30,15,40,0)`);
      ctx.fillStyle = g;
      // Lumpy silhouette
      ctx.beginPath();
      const lumps = 7;
      for (let k = 0; k <= lumps; k++) {
        const ang = (k / lumps) * TAU;
        const rr = a.r * (0.8 + 0.25 * Math.sin(ang * 3 + a.seed * 20) + 0.12 * Math.sin(ang * 5 + a.seed * 7));
        const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;
        if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      // Soft sprite overlay for texture
      ctx.globalAlpha = alpha * 0.5;
      ctx.drawImage(puff, -a.r, -a.r, a.r * 2, a.r * 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // ---- Volcano body ----
    ctx.beginPath();
    ctx.moveTo(-200, BASE_Y + 200);
    ctx.lineTo(-200, BASE_Y);
    for (const p of outline) ctx.lineTo(p.x, p.y);
    ctx.lineTo(REF + 200, BASE_Y);
    ctx.lineTo(REF + 200, BASE_Y + 200);
    ctx.closePath();
    const body = ctx.createLinearGradient(0, VENT.y, 0, BASE_Y);
    body.addColorStop(0, '#2a0a12');
    body.addColorStop(0.5, '#180612');
    body.addColorStop(1, '#09030c');
    ctx.fillStyle = body;
    ctx.fill();

    // Crater rim glow lighting the upper slopes
    ctx.save();
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    const rimG = ctx.createRadialGradient(VENT.x, VENT.y + 20, 5, VENT.x, VENT.y + 20, 260);
    rimG.addColorStop(0, `rgba(255,110,20,${0.55 + intensity * 0.2})`);
    rimG.addColorStop(0.4, `rgba(200,40,10,${0.18 + intensity * 0.08})`);
    rimG.addColorStop(1, 'rgba(120,10,0,0)');
    ctx.fillStyle = rimG;
    ctx.fillRect(0, 0, REF, REF);

    // ---- Lava flows ----
    for (const f of flows) {
      const pulse = 0.7 + 0.3 * Math.sin(time * f.speed + f.phase);
      // outer glow
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.strokeStyle = `rgba(255,60,0,${0.22 * pulse})`;
      ctx.lineWidth = f.width * 3.2;
      strokePath(f.pts);
      ctx.strokeStyle = `rgba(255,110,10,${0.55 * pulse})`;
      ctx.lineWidth = f.width * 1.5;
      strokePath(f.pts);
      // core
      ctx.strokeStyle = `rgba(255,200,40,${0.9})`;
      ctx.lineWidth = f.width * 0.7;
      strokePath(f.pts);
      // moving bright segments (flowing)
      const L = f.pts.length;
      for (let k = 0; k < 4; k++) {
        const u = ((time * 0.12 * f.speed + k / 4 + f.phase / TAU) % 1);
        const idx = Math.floor(u * (L - 1));
        const p = f.pts[idx];
        const sz = f.width * 1.6;
        ctx.globalAlpha = 0.8;
        ctx.drawImage(glow, p.x - sz, p.y - sz, sz * 2, sz * 2);
        ctx.globalAlpha = 1;
      }
      // spawn embers off flows occasionally
      if (Math.random() < 0.08 * dt) {
        const p = f.pts[Math.floor(Math.random() * L)];
        spawnEmber(p.x, p.y);
      }
    }
    ctx.restore();

    // Crater opening (lava pool)
    ctx.globalCompositeOperation = 'lighter';
    (function pool() {
      const g = ctx.createRadialGradient(VENT.x, VENT.y + 16, 2, VENT.x, VENT.y + 16, 60);
      g.addColorStop(0, `rgba(255,255,200,${0.9})`);
      g.addColorStop(0.3, `rgba(255,190,40,${0.8})`);
      g.addColorStop(0.7, `rgba(255,70,0,${0.4})`);
      g.addColorStop(1, 'rgba(255,40,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(VENT.x, VENT.y + 16, 60, 26, 0, 0, TAU); ctx.fill();
    })();

    // ---- Lava fountain particles ----
    for (let i = lava.length - 1; i >= 0; i--) {
      const p = lava[i];
      p.trail.push(p.x, p.y);
      if (p.trail.length > 12) p.trail.splice(0, 2);
      p.vy += 0.22 * dt;
      p.vx += 0.01 * dt; // slight wind
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= p.decay * dt;
      // land on slope
      const sy = surfaceY(p.x);
      if (p.y > sy && p.vy > 0) {
        if (Math.random() < 0.4) spawnEmber(p.x, sy - 2);
        // splat: slide downslope briefly
        p.y = sy; p.vy = 0; p.vx *= 0.3; p.life -= 0.08;
        p.decay = 0.03;
      }
      if (p.life <= 0 || p.y > BASE_Y + 40) { lava.splice(i, 1); continue; }

      // Trail
      if (p.trail.length >= 4) {
        ctx.strokeStyle = `rgba(255,${Math.floor(90 + p.life * 120)},0,${0.35 * p.life})`;
        ctx.lineWidth = p.r * 0.9;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.trail[0], p.trail[1]);
        for (let k = 2; k < p.trail.length; k += 2) ctx.lineTo(p.trail[k], p.trail[k + 1]);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      }
      // Glow halo
      const gs = p.r * 4;
      ctx.globalAlpha = 0.55 * p.life;
      ctx.drawImage(glow, p.x - gs, p.y - gs, gs * 2, gs * 2);
      ctx.globalAlpha = 1;
      // Core
      ctx.fillStyle = lavaColor(p.life);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    }

    // ---- Embers ----
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      e.vy -= 0.01 * dt;
      e.vx += (0.6 - e.vx) * 0.01 * dt + (Math.random() - 0.5) * 0.15;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.life -= e.decay * dt;
      if (e.life <= 0 || e.y < -20) { embers.splice(i, 1); continue; }
      const fl = 0.6 + 0.4 * Math.sin(time * 20 + e.x);
      ctx.fillStyle = `rgba(255,${Math.floor(120 + e.life * 120)},${Math.floor(e.life * 60)},${e.life * fl})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, TAU); ctx.fill();
    }

    // Heat shimmer / fountain column glow
    (function column() {
      const g = ctx.createLinearGradient(0, VENT.y - 260 * intensity, 0, VENT.y + 20);
      g.addColorStop(0, 'rgba(255,120,30,0)');
      g.addColorStop(1, `rgba(255,120,30,${0.18 + intensity * 0.1})`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(VENT.x - 30, VENT.y + 20);
      ctx.lineTo(VENT.x - 110, VENT.y - 260 * intensity);
      ctx.lineTo(VENT.x + 110, VENT.y - 260 * intensity);
      ctx.lineTo(VENT.x + 30, VENT.y + 20);
      ctx.closePath(); ctx.fill();
    })();

    ctx.globalCompositeOperation = 'source-over';

    // ---- Foreground: ground haze lit by lava ----
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const haze = ctx.createLinearGradient(0, H * 0.78, 0, H);
    haze.addColorStop(0, 'rgba(90,20,10,0)');
    haze.addColorStop(1, 'rgba(120,30,10,0.55)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, H * 0.78, W, H * 0.22);

    // Vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }

  function strokePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  // Seed some ash so the sky isn't empty at start
  for (let i = 0; i < 40; i++) {
    spawnAsh(1);
    const a = ash[ash.length - 1];
    if (a) { const k = Math.random(); a.y -= k * 380; a.x += k * 220 * Math.random(); a.r += k * 60; a.life -= k * 0.6; }
  }
  spawnLava(120, 1.2);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
