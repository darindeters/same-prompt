<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100820">
<title>Volcano at Night</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100820}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas aria-label="An erupting volcano at night with fiery lava fountains, molten rivers and billowing ash clouds" role="img"></canvas>
<script>
'use strict';
(() => {
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d', {alpha:false});
  const W=1080,H=1080,TAU=Math.PI*2;
  let seed=57421;
  function rnd(a=0,b=1){seed=(seed*1664525+1013904223)>>>0;return a+(seed/4294967296)*(b-a)}
  function path(c,points,close=true){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(close)c.closePath()}
  function radial(c,x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);for(const [p,col] of stops)g.addColorStop(p,col);c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
  function layer(){const c=document.createElement('canvas');c.width=W;c.height=H;return c}
  const mountain=[[70,955],[155,866],[243,784],[295,704],[358,651],[408,578],[450,549],[470,512],[493,504],[523,516],[550,507],[581,514],[602,551],[636,585],[665,642],[710,681],[741,741],[799,789],[844,848],[940,914],[1080,986],[1080,1080],[0,1080]];
  const base=layer(),b=base.getContext('2d');
  let g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070b24');g.addColorStop(.34,'#251139');g.addColorStop(.66,'#6a1c42');g.addColorStop(1,'#260e25');b.fillStyle=g;b.fillRect(0,0,W,H);
  radial(b,530,535,510,[[0,'#a9324f66'],[.5,'#7b214430'],[1,'#280c3000']]);
  // Tiny stars disappear behind the dense eruption column.
  for(let i=0;i<170;i++){const x=rnd(0,W),y=rnd(0,590),r=rnd(.45,1.5);b.fillStyle=`rgba(188,203,255,${rnd(.15,.7)})`;b.beginPath();b.arc(x,y,r,0,TAU);b.fill()}
  radial(b,140,166,100,[[0,'#8e9dff16'],[1,'#8e9dff00']]);
  b.fillStyle='#b0b7e3';b.beginPath();b.arc(140,166,27,0,TAU);b.fill();
  b.fillStyle='#11112e';b.beginPath();b.arc(151,158,27,0,TAU);b.fill();
  // A quiet distant caldera, beneath the blazing main peak.
  path(b,[[0,711],[85,672],[159,690],[224,643],[293,688],[375,656],[444,718],[552,679],[647,703],[748,650],[847,686],[923,645],[1080,705],[1080,1080],[0,1080]]);b.fillStyle='#20172f';b.fill();
  path(b,[[0,783],[108,737],[176,754],[290,726],[394,785],[502,744],[648,778],[785,724],[915,760],[1014,717],[1080,740],[1080,1080],[0,1080]]);b.fillStyle='#29172d';b.fill();
  const terrain=layer(),m=terrain.getContext('2d');
  path(m,mountain);g=m.createLinearGradient(210,570,830,990);g.addColorStop(0,'#472336');g.addColorStop(.35,'#331a29');g.addColorStop(.65,'#211522');g.addColorStop(1,'#130f1e');m.fillStyle=g;m.fill();
  m.save();path(m,mountain);m.clip();
  // Angular ridges and fine basalt striations give the cone a tangible surface.
  for(let i=0;i<80;i++){
    const sx=rnd(459,594),sy=rnd(518,582),ex=rnd(-220,1350),ey=rnd(930,1240);
    path(m,[[sx,sy],[ex,ey],[ex+rnd(8,90),ey+30],[sx+rnd(1,17),sy]]);
    m.fillStyle=i%3===0?'#b44a3820':i%3===1?'#060c1d55':'#88515a16';m.fill();
  }
  for(let i=0;i<15000;i++){
    const x=rnd(0,1080),y=rnd(530,1080),s=rnd(.5,2.6);
    m.fillStyle=i%2?'#d07b6830':'#05091665';m.fillRect(x,y,s,rnd(.5,2));
  }
  m.restore();
  const rivers=[];
  function river(points,width){
    const out=[];
    for(let k=0;k<points.length-1;k++){
      const p0=points[Math.max(0,k-1)],p1=points[k],p2=points[k+1],p3=points[Math.min(points.length-1,k+2)];
      for(let j=0;j<18;j++){const t=j/18,t2=t*t,t3=t2*t;out.push({x:.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),y:.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)});}
    }
    out.push({x:points.at(-1)[0],y:points.at(-1)[1]});rivers.push({p:out,w:width,phase:rnd(0,100)});
  }
  river([[522,534],[516,571],[541,614],[520,663],[548,716],[527,767],[559,822],[545,861],[587,912],[567,960],[618,1029],[702,1080]],24);
  river([[504,539],[475,585],[458,630],[418,679],[412,719],[369,763],[344,820],[293,856],[267,906],[211,952],[161,1035]],11);
  river([[559,537],[584,580],[603,620],[625,659],[638,709],[686,750],[699,800],[746,844],[766,886],[827,933]],9);
  river([[531,665],[567,688],[588,739],[622,771],[615,815],[657,855],[688,895],[734,914]],7);
  river([[372,762],[389,807],[376,850],[404,892],[385,945],[413,985]],6);
  river([[549,861],[511,891],[475,929],[484,967],[442,1005],[415,1080]],13);
  river([[602,621],[639,647],[674,690],[704,708],[741,760]],4);
  const smoke=[];
  for(let i=0;i<105;i++)smoke.push({age:rnd(0,1),side:rnd(-1,1),size:rnd(.65,1.25),phase:rnd(0,TAU)});
  const sparks=[];
  for(let i=0;i<420;i++)sparks.push({phase:rnd(0,1),life:rnd(1.2,3.4),vx:rnd(-145,145),vy:rnd(-360,-130),size:rnd(1,4),offset:rnd(-29,29)});
  const ash=[];
  for(let i=0;i<115;i++)ash.push({x:rnd(0,W),y:rnd(0,H),speed:rnd(9,45),r:rnd(.5,2),p:rnd(0,TAU)});
  let viewWidth=0,viewHeight=0,dpr=1,scale=1,ox=0,oy=0;
  function resize(){viewWidth=innerWidth;viewHeight=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(viewWidth*dpr);canvas.height=Math.round(viewHeight*dpr);scale=Math.max(viewWidth/W,viewHeight/H);ox=(viewWidth-W*scale)/2;oy=(viewHeight-H*scale)/2;}
  addEventListener('resize',resize,{passive:true});resize();
  function strokeRiver(r,width,color){ctx.beginPath();r.p.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke()}
  function drawSmoke(t){
    // Old puffs first: a wind-bent umbrella of violet ash, lit red from below.
    const order=smoke.map(s=>({s,a:(s.age+t*.052)%1})).sort((a,b)=>b.a-a.a);
    for(const {s,a} of order){
      const spread=25+a*222,x=535+a*a*335+s.side*spread+Math.sin(a*10+s.phase+t*.15)*19,y=500-a*624;
      const r=(22+a*138)*s.size,opacity=Math.min(1,a*12)*(1-Math.pow(a,5));
      const red=Math.max(0,1-a*2.4);
      const grad=ctx.createRadialGradient(x-r*.23,y+r*.4,r*.05,x,y,r);
      grad.addColorStop(0,`rgba(${Math.round(62+red*95)},${Math.round(34+red*9)},${Math.round(64-red*18)},${opacity*.9})`);
      grad.addColorStop(.64,`rgba(${Math.round(39+red*68)},25,49,${opacity*.94})`);
      grad.addColorStop(1,'rgba(30,20,43,0)');
      ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    }
  }
  function draw(t){
    ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*ox,dpr*oy);
    ctx.drawImage(base,0,0);
    drawSmoke(t);
    radial(ctx,532,515,255,[[0,'#ff59113c'],[.32,'#ff38141b'],[1,'#ff240000']]);
    ctx.drawImage(terrain,0,0);
    ctx.lineCap='round';ctx.lineJoin='round';
    // Broad radiance on the rocks; dark, cooled banks surround liquid cores.
    ctx.globalCompositeOperation='screen';
    for(const r of rivers){strokeRiver(r,r.w*4,'#ed280012');strokeRiver(r,r.w*2.2,'#ff3b0025')}
    ctx.globalCompositeOperation='source-over';
    for(const r of rivers){
      strokeRiver(r,r.w+7,'#190c18');strokeRiver(r,r.w+2,'#8b201b');strokeRiver(r,r.w,'#ff420a');strokeRiver(r,r.w*.54,'#ff941a');strokeRiver(r,r.w*.18,'#ffe383');
      // Rough moving plates of crust split by incandescent seams.
      for(let i=0;i<r.p.length;i+=2){const p=r.p[i],next=r.p[Math.min(i+1,r.p.length-1)],flow=(i*.83-t*3.2+r.phase);const pulse=(Math.sin(flow)+Math.sin(flow*2.1))*.5;
        if(pulse>.15){ctx.strokeStyle='#742018';ctx.lineWidth=r.w*.48;ctx.beginPath();ctx.moveTo(p.x-r.w*.12,p.y);ctx.lineTo(next.x+r.w*.18,next.y+2);ctx.stroke()}
        if(Math.sin(flow*.75)>.7){ctx.fillStyle='#fff1a4';ctx.beginPath();ctx.ellipse(p.x,p.y,r.w*.1,r.w*.28,.4,0,TAU);ctx.fill()}
      }
    }
    // Molten crater, with a jagged foreground lip.
    radial(ctx,535,525,100,[[0,'#ffcc3675'],[.4,'#ff490023'],[1,'#ff290000']]);
    ctx.save();ctx.translate(534,525);ctx.scale(1,.27);
    radial(ctx,0,0,65,[[0,'#fffacb'],[.25,'#ffda56'],[.62,'#ff6909'],[.84,'#d92815'],[1,'#671e2700']]);ctx.restore();
    path(ctx,[[465,518],[479,526],[492,525],[509,540],[526,539],[544,543],[563,534],[579,531],[590,518],[585,540],[564,550],[543,548],[523,554],[502,546],[484,541]]);ctx.fillStyle='#411a28';ctx.fill();
    ctx.beginPath();ctx.moveTo(478,527);ctx.lineTo(492,529);ctx.lineTo(509,542);ctx.lineTo(526,541);ctx.lineTo(545,545);ctx.lineTo(564,537);ctx.lineTo(578,534);ctx.strokeStyle='#ff6d24';ctx.lineWidth=2;ctx.stroke();
    // Ballistic fountains rise and fall continuously from inside the vent.
    ctx.globalCompositeOperation='lighter';
    for(const s of sparks){
      const age=((t/s.life+s.phase)%1)*s.life;
      const x=534+s.offset+s.vx*age,y=521+s.vy*age+105*age*age;
      if(y>535+Math.abs(x-534)*1.15)continue;
      const a=Math.min(1,age*9)*Math.min(1,(s.life-age)*2),r=s.size*(1-age/s.life*.6);
      const px=x-s.vx*.034,py=y-(s.vy+210*age)*.034;
      ctx.globalAlpha=a*.3;ctx.strokeStyle='#ff3006';ctx.lineWidth=r*4;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();
      ctx.globalAlpha=a;ctx.strokeStyle=age<s.life*.5?'#ffb52f':'#ff6417';ctx.lineWidth=r;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();
      ctx.fillStyle='#fff1a1';ctx.beginPath();ctx.arc(x,y,r*.43,0,TAU);ctx.fill();
    }
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    // Low steam carries reflected fire across the foot of the mountain.
    for(let i=0;i<8;i++){const x=((i*183+t*13)%1400)-160,y=978+Math.sin(i*3+t*.17)*34;ctx.save();ctx.translate(x,y);ctx.scale(2.9,.45);radial(ctx,0,0,100,[[0,'#b4463b12'],[1,'#63203a00']]);ctx.restore()}
    // Foreground shards frame the bright, moving rivers.
    path(ctx,[[0,953],[45,939],[89,967],[122,956],[157,985],[178,1030],[226,1040],[247,1080],[0,1080]]);ctx.fillStyle='#100e1b';ctx.fill();
    path(ctx,[[806,1080],[844,1043],[895,1047],[916,1007],[946,988],[974,1003],[1008,969],[1051,966],[1080,948],[1080,1080]]);ctx.fillStyle='#100e1b';ctx.fill();
    ctx.strokeStyle='#86302d';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(0,953);ctx.lineTo(45,939);ctx.lineTo(89,967);ctx.moveTo(916,1007);ctx.lineTo(946,988);ctx.lineTo(974,1003);ctx.stroke();
    for(const p of ash){const x=(p.x+t*p.speed*.55+Math.sin(t*.4+p.p)*15)%1120-20,y=(p.y-t*p.speed*.8%1120+1120)%1120-20;ctx.fillStyle=p.r>1.5?'#ff8f4890':'#caa8b14a';ctx.beginPath();ctx.arc(x,y,p.r,0,TAU);ctx.fill()}
    // Subtle vignette concentrates the heat at the heart of the composition.
    const vignette=ctx.createRadialGradient(540,540,320,540,540,780);vignette.addColorStop(0,'#03051000');vignette.addColorStop(1,'#03051080');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
    requestAnimationFrame(frame);
  }
  const start=performance.now();
  function frame(now){draw((now-start)/1000+8)}
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
