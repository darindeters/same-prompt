<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dusk Tornado</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#160a3c}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function(){
'use strict';
const cv=document.getElementById('c'), g=cv.getContext('2d');
const TAU=Math.PI*2;
let W=1,H=1,S=1,DPR=1;

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.floor(W*DPR); cv.height=Math.floor(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
  S=Math.min(W,H)/1080;
}
window.addEventListener('resize',resize);
resize();

// deterministic random
let seed=20251023;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
function pick(a){return a[Math.floor(rnd()*a.length)];}

// layout
const HOR=()=>H*0.62;      // horizon
const CLOUD=()=>H*0.20;    // cloud base
const GROUND=()=>H*0.705;  // where funnel meets ground

// ---------- funnel geometry ----------
function baseX(t){return W*0.5+Math.sin(t*0.11)*W*0.07;}
function fx(yn,t){
  return baseX(t)+S*(
    Math.sin(t*0.9+yn*3.2)*48*yn+
    Math.sin(t*0.41+yn*5.3)*32*yn*yn+
    Math.sin(t*2.3+yn*9.0)*5*yn
  );
}
function fw(yn,t){
  let w=S*(235*Math.pow(1-yn,1.55)+28);
  w*=1+0.07*Math.sin(t*3.1+yn*14)+0.04*Math.sin(t*5.3-yn*21);
  return w;
}
const N=48;
function funnelPts(t){
  const top=CLOUD()+H*0.025, bot=GROUND();
  const pts=[];
  for(let i=0;i<=N;i++){
    const yn=i/N;
    pts.push({x:fx(yn,t),y:top+yn*(bot-top),w:fw(yn,t),yn:yn});
  }
  return pts;
}
function atYn(pts,yn){
  const f=Math.max(0,Math.min(N-0.001,yn*N));
  const i=Math.floor(f), k=f-i;
  const a=pts[i], b=pts[i+1];
  return {x:a.x+(b.x-a.x)*k, y:a.y+(b.y-a.y)*k, w:a.w+(b.w-a.w)*k};
}

// ---------- sky ----------
function drawSky(){
  const hy=HOR();
  const gr=g.createLinearGradient(0,0,0,hy);
  gr.addColorStop(0,'#14083a');
  gr.addColorStop(0.32,'#4a1470');
  gr.addColorStop(0.58,'#c0247a');
  gr.addColorStop(0.80,'#ff5a26');
  gr.addColorStop(1,'#ffc63a');
  g.fillStyle=gr; g.fillRect(0,0,W,hy);
  // sun
  const sx=W*0.78, sy=hy-H*0.028, sr=H*0.065;
  const sg=g.createRadialGradient(sx,sy,sr*0.3,sx,sy,sr*5);
  sg.addColorStop(0,'rgba(255,230,140,0.95)');
  sg.addColorStop(0.25,'rgba(255,150,50,0.55)');
  sg.addColorStop(1,'rgba(255,90,60,0)');
  g.fillStyle=sg; g.fillRect(0,0,W,hy);
  g.fillStyle='#fff3a8';
  g.beginPath(); g.arc(sx,sy,sr,0,TAU); g.fill();
}

// ---------- clouds ----------
const lumps=[];
for(let i=0;i<46;i++)lumps.push({x:rnd()*1.4-0.2,y:rnd()*0.95,r:0.07+rnd()*0.13,sp:6+rnd()*14,ph:rnd()*TAU});
function cloudBlob(x,y,r,c0,c1){
  const gr=g.createRadialGradient(x,y,r*0.1,x,y,r);
  gr.addColorStop(0,c0); gr.addColorStop(1,c1);
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
}
function drawClouds(t,topX){
  const cb=CLOUD();
  const gr=g.createLinearGradient(0,0,0,cb*1.6);
  gr.addColorStop(0,'#0f0626');
  gr.addColorStop(0.6,'#2a0f44');
  gr.addColorStop(1,'rgba(70,28,96,0)');
  g.fillStyle=gr; g.fillRect(0,0,W,cb*1.6);
  // drifting lumps
  for(const L of lumps){
    let x=((L.x*W+t*L.sp*S)%(W*1.4));
    if(x<0)x+=W*1.4; x-=W*0.2;
    const y=L.y*cb*1.1+Math.sin(t*0.4+L.ph)*4*S;
    const r=L.r*Math.max(W,H)*0.9;
    cloudBlob(x,y,r,'rgba(32,12,58,0.95)','rgba(32,12,58,0)');
  }
  // warm lit undersides toward sun
  for(let i=0;i<9;i++){
    const x=W*(0.45+i*0.07)+Math.sin(t*0.3+i)*10*S;
    const y=cb*(0.95+0.15*Math.sin(i*1.9));
    cloudBlob(x,y,S*(110+40*Math.sin(i*2.3)),'rgba(255,120,110,0.28)','rgba(255,120,110,0)');
  }
  // rotating mesocyclone / wall cloud around the funnel top
  for(let k=0;k<18;k++){
    const ang=k*TAU/18+t*0.22;
    const rx=W*0.24*(1+0.15*Math.sin(t*0.6+k*1.3));
    const ry=H*0.05;
    const x=topX+Math.cos(ang)*rx;
    const y=cb+H*0.015+Math.sin(ang)*ry;
    const r=S*(120+45*Math.sin(t*0.5+k*1.7));
    cloudBlob(x,y,r,'rgba(38,14,66,0.95)','rgba(38,14,66,0)');
  }
  for(let k=0;k<10;k++){
    const ang=k*TAU/10-t*0.35;
    const x=topX+Math.cos(ang)*W*0.10;
    const y=cb+H*0.035+Math.sin(ang)*H*0.02;
    cloudBlob(x,y,S*(130+30*Math.sin(t*0.8+k)),'rgba(22,8,40,0.95)','rgba(22,8,40,0)');
  }
}

// ---------- lightning ----------
let nextFlash=1.5, flashT=-10, bolt=null;
function makeBolt(topX){
  const pts=[]; let x=topX+(rnd()-0.5)*W*0.5, y=CLOUD()*0.25;
  const endY=CLOUD()+H*0.06;
  while(y<endY){pts.push([x,y]); y+=S*(14+rnd()*26); x+=(rnd()-0.5)*S*60;}
  return pts;
}
function drawBolt(f){
  if(!bolt||f<0.35)return;
  g.lineCap='round'; g.lineJoin='round';
  g.beginPath(); for(let i=0;i<bolt.length;i++){const p=bolt[i]; if(i)g.lineTo(p[0],p[1]); else g.moveTo(p[0],p[1]);}
  g.strokeStyle='rgba(200,160,255,'+(0.45*f)+')'; g.lineWidth=S*12; g.stroke();
  g.strokeStyle='rgba(255,255,255,'+f+')'; g.lineWidth=S*2.5; g.stroke();
}

// ---------- rain curtain ----------
function drawRain(t,topX){
  const cb=CLOUD(), hy=HOR();
  const x1=topX-S*260;
  if(x1<0)return;
  const gr=g.createLinearGradient(0,cb,0,hy);
  gr.addColorStop(0,'rgba(80,40,130,0.45)'); gr.addColorStop(1,'rgba(120,60,150,0.05)');
  g.fillStyle=gr; g.fillRect(0,cb,x1,hy-cb);
  g.strokeStyle='rgba(170,120,220,0.28)'; g.lineWidth=S*1.5;
  g.beginPath();
  const span=hy-cb;
  for(let i=0;i<60;i++){
    const x=(i/60)*x1+Math.sin(i*7.1)*20*S;
    const y=cb+((t*700*S+i*173)%span);
    g.moveTo(x,y); g.lineTo(x-18*S,y+70*S);
  }
  g.stroke();
}

// ---------- ground ----------
const trees=[];for(let i=0;i<34;i++)trees.push({x:rnd(),r:8+rnd()*16,h:0.6+rnd()*0.8});
function drawGround(t,base){
  const hy=HOR();
  const gr=g.createLinearGradient(0,hy,0,H);
  gr.addColorStop(0,'#d8aa2a'); gr.addColorStop(0.35,'#9a8a1e'); gr.addColorStop(1,'#2f5a14');
  g.fillStyle=gr; g.fillRect(0,hy,W,H-hy);
  // perspective fields
  const vpx=W*0.5, laneW=W*0.21;
  const pan=t*0.03, frac=pan%1, n=Math.floor(pan);
  const cols=['#f2b426','#4f9e1f','#8a4a1e','#e8c43a','#3f8a26'];
  for(let k=-9;k<=9;k++){
    const x0=W/2+(k-frac)*laneW, x1=x0+laneW;
    const ci=(((k+n)%5)+5)%5;
    g.fillStyle=cols[ci];
    g.beginPath(); g.moveTo(vpx,hy); g.lineTo(x1,H); g.lineTo(x0,H); g.closePath(); g.fill();
    // crop rows
    g.strokeStyle='rgba(0,0,0,0.16)'; g.lineWidth=1;
    g.beginPath();
    for(let r=1;r<6;r++){const xr=x0+laneW*r/6; g.moveTo(vpx,hy); g.lineTo(xr,H);}
    g.stroke();
  }
  // distance bands
  for(let i=0;i<7;i++){
    const d=Math.pow(i/7,2.2);
    const y=hy+(H-hy)*d;
    g.strokeStyle='rgba(60,30,10,'+(0.10+0.05*i)+')'; g.lineWidth=1+i*0.6;
    g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
  }
  // shadow under tornado
  const sg=g.createRadialGradient(base.x,base.y,0,base.x,base.y,S*420);
  sg.addColorStop(0,'rgba(50,10,40,0.6)'); sg.addColorStop(1,'rgba(50,10,40,0)');
  g.fillStyle=sg; g.fillRect(0,hy,W,H-hy);
  // horizon silhouettes: trees
  g.fillStyle='#1c3a14';
  for(const tr of trees){
    const x=tr.x*W, r=tr.r*S;
    g.beginPath(); g.ellipse(x,hy-r*tr.h*0.5,r,r*tr.h,0,0,TAU); g.fill();
  }
  // barn + silo
  const bx=W*0.17, s=S;
  g.fillStyle='#a01e1e'; g.fillRect(bx-36*s,hy-30*s,72*s,32*s);
  g.fillStyle='#5a0e0e';
  g.beginPath(); g.moveTo(bx-40*s,hy-30*s); g.lineTo(bx-22*s,hy-50*s); g.lineTo(bx+22*s,hy-50*s); g.lineTo(bx+40*s,hy-30*s); g.closePath(); g.fill();
  g.fillStyle='#b6bcc6'; g.fillRect(bx+48*s,hy-66*s,20*s,68*s);
  g.beginPath(); g.arc(bx+58*s,hy-66*s,10*s,Math.PI,0); g.fill();
  // farmhouse
  const hx=W*0.30;
  g.fillStyle='#3a2244'; g.fillRect(hx-20*s,hy-22*s,40*s,24*s);
  g.beginPath(); g.moveTo(hx-24*s,hy-22*s); g.lineTo(hx,hy-40*s); g.lineTo(hx+24*s,hy-22*s); g.closePath(); g.fill();
  // haze at horizon
  const fg=g.createLinearGradient(0,hy-H*0.02,0,hy+H*0.12);
  fg.addColorStop(0,'rgba(255,165,90,0.55)'); fg.addColorStop(1,'rgba(255,165,90,0)');
  g.fillStyle=fg; g.fillRect(0,hy-H*0.02,W,H*0.14);
}

// ---------- funnel ----------
function drawFunnel(pts,t){
  // soft condensation haze
  for(let i=0;i<N;i++){
    const a=pts[i], b=pts[i+1];
    g.fillStyle='rgba(90,45,100,0.22)';
    g.beginPath();
    g.moveTo(a.x-a.w*1.35,a.y-1); g.lineTo(a.x+a.w*1.35,a.y-1);
    g.lineTo(b.x+b.w*1.35,b.y+1); g.lineTo(b.x-b.w*1.35,b.y+1); g.fill();
  }
  // body
  for(let i=0;i<N;i++){
    const a=pts[i], b=pts[i+1];
    const gr=g.createLinearGradient(a.x-a.w,0,a.x+a.w,0);
    gr.addColorStop(0,'#24122f');
    gr.addColorStop(0.3,'#4a2a55');
    gr.addColorStop(0.65,'#7d5278');
    gr.addColorStop(0.9,'#c88a86');
    gr.addColorStop(1,'#ffb07a');
    g.fillStyle=gr;
    g.beginPath();
    g.moveTo(a.x-a.w,a.y-0.6); g.lineTo(a.x+a.w,a.y-0.6);
    g.lineTo(b.x+b.w,b.y+0.6); g.lineTo(b.x-b.w,b.y+0.6); g.fill();
  }
  // spiral streaks clipped to funnel
  g.save();
  g.beginPath();
  g.moveTo(pts[0].x-pts[0].w,pts[0].y);
  for(let i=1;i<=N;i++)g.lineTo(pts[i].x-pts[i].w,pts[i].y);
  for(let i=N;i>=0;i--)g.lineTo(pts[i].x+pts[i].w,pts[i].y);
  g.closePath(); g.clip();
  g.lineCap='round';
  const K=30;
  for(let k=0;k<K;k++){
    const ph=k*TAU/K;
    g.beginPath(); let on=false;
    for(let i=0;i<=N;i++){
      const p=pts[i];
      const ang=ph+t*2.6+p.yn*6.5;
      const sn=Math.sin(ang);
      if(sn>0.05){
        const x=p.x+Math.cos(ang)*p.w*0.98;
        if(on)g.lineTo(x,p.y); else {g.moveTo(x,p.y); on=true;}
      } else on=false;
    }
    g.strokeStyle = k%2 ? 'rgba(18,6,30,0.42)' : 'rgba(255,205,170,0.20)';
    g.lineWidth=S*(k%3===0?6:3);
    g.stroke();
  }
  g.restore();
}

// ---------- dust ----------
const puffs=[];
for(let i=0;i<22;i++)puffs.push({ang:rnd()*TAU,d:0.25+rnd()*1.1,r:0.4+rnd(),ph:rnd()*TAU,sp:0.25+rnd()*0.5,lift:rnd()});
function drawDust(base,t,front){
  if(!front){
    const gr=g.createRadialGradient(base.x,base.y,0,base.x,base.y,S*520);
    gr.addColorStop(0,'rgba(215,135,65,0.55)'); gr.addColorStop(1,'rgba(200,120,60,0)');
    g.fillStyle=gr;
    g.beginPath(); g.ellipse(base.x,base.y+S*10,S*560,S*95,0,0,TAU); g.fill();
  }
  for(const p of puffs){
    const ang=p.ang+t*p.sp;
    const sn=Math.sin(ang);
    if((sn>0)!==front)continue;
    const dx=Math.cos(ang)*p.d*S*190;
    const dy=sn*p.d*S*34-p.lift*S*70;
    const r=S*(75+70*p.r)*(1+0.14*Math.sin(t*2.2+p.ph));
    const x=base.x+dx, y=base.y+dy;
    const gr=g.createRadialGradient(x,y,r*0.1,x,y,r);
    gr.addColorStop(0,'rgba(222,140,70,0.78)');
    gr.addColorStop(0.6,'rgba(190,105,50,0.35)');
    gr.addColorStop(1,'rgba(160,85,40,0)');
    g.fillStyle=gr;
    g.beginPath(); g.ellipse(x,y,r,r*0.62,0,0,TAU); g.fill();
  }
}

// ---------- particles ----------
const pcols=['#e0a868','#b87a3f','#8a5a2a','#f0c878','#6f9a2a','#f6e0b0','#c9903c'];
const dcols=['#c22a22','#8a5a2a','#d6dde6','#5d9a22','#e2bb55','#a01e1e','#f0f0e0'];
const P=[], D=[];
function newP(init){
  return {a:rnd()*TAU,r:0.6+rnd()*1.2,h:init?rnd():rnd()*0.06,sp:2.6+rnd()*3.2,rise:0.05+rnd()*0.14,sz:1+rnd()*2.4,c:pick(pcols),ph:rnd()*TAU};
}
function newD(init){
  return {a:rnd()*TAU,r:0.9+rnd()*1.1,h:init?rnd()*0.8:rnd()*0.05,sp:1.8+rnd()*2.2,rise:0.04+rnd()*0.09,sz:8+rnd()*18,c:pick(dcols),rot:rnd()*TAU,spin:(rnd()-0.5)*14,ph:rnd()*TAU};
}
for(let i=0;i<650;i++)P.push(newP(true));
for(let i=0;i<34;i++)D.push(newD(true));

function stepParticle(p,dt,t){
  p.a+=dt*p.sp*(0.6+(1-p.h)*0.9);
  p.h+=dt*p.rise*(0.7+0.6*Math.sin(t*1.7+p.ph));
  p.r+=dt*0.45*Math.sin(t*1.3+p.ph+p.a*0.3);
  if(p.rot!==undefined)p.rot+=dt*p.spin;
  return (p.h>1||p.r<0.45||p.r>2.4);
}
function particlePos(p,pts){
  const yn=1-p.h*0.96;
  const q=atYn(pts,yn);
  const sn=Math.sin(p.a);
  return {x:q.x+Math.cos(p.a)*q.w*p.r, y:q.y+sn*q.w*p.r*0.24, sn:sn, w:q.w};
}
function drawParticles(pts,front){
  for(const p of P){
    const o=particlePos(p,pts);
    if((o.sn>0)!==front)continue;
    const alpha=front?0.9:0.55;
    g.globalAlpha=alpha*(1-p.h*0.5);
    g.fillStyle=p.c;
    const sz=p.sz*S*(front?1.1:0.8);
    g.fillRect(o.x-sz/2,o.y-sz/2,sz,sz);
  }
  g.globalAlpha=1;
  for(const d of D){
    const o=particlePos(d,pts);
    if((o.sn>0)!==front)continue;
    g.save();
    g.translate(o.x,o.y); g.rotate(d.rot);
    g.globalAlpha=front?1:0.6;
    const sz=d.sz*S*(front?1:0.8);
    g.fillStyle=d.c;
    g.fillRect(-sz/2,-sz*0.17,sz,sz*0.34);
    g.fillStyle='rgba(0,0,0,0.35)';
    g.fillRect(-sz/2,0,sz,sz*0.17);
    g.restore();
  }
  g.globalAlpha=1;
}

// ---------- main loop ----------
let last=performance.now()/1000, t=0;
function frame(){
  const now=performance.now()/1000;
  const dt=Math.min(0.05,now-last); last=now; t+=dt;

  const pts=funnelPts(t);
  const topX=pts[0].x;
  const base={x:pts[N].x,y:pts[N].y};

  // lightning schedule
  if(t>nextFlash){flashT=t; nextFlash=t+2.5+rnd()*5.5; bolt=makeBolt(topX);}
  let f=Math.max(0,1-(t-flashT)/0.4);
  f*=0.55+0.45*Math.abs(Math.sin(t*55));

  // update particles
  for(let i=0;i<P.length;i++) if(stepParticle(P[i],dt,t))P[i]=newP(false);
  for(let i=0;i<D.length;i++) if(stepParticle(D[i],dt,t))D[i]=newD(false);

  drawSky();
  drawClouds(t,topX);
  drawBolt(f);
  drawRain(t,topX);
  drawGround(t,base);
  drawDust(base,t,false);
  drawParticles(pts,false);
  drawFunnel(pts,t);
  drawDust(base,t,true);
  drawParticles(pts,true);

  if(f>0){
    g.fillStyle='rgba(225,200,255,'+(f*0.3)+')';
    g.fillRect(0,0,W,H);
  }
  // vignette
  const vg=g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.75);
  vg.addColorStop(0,'rgba(20,0,30,0)'); vg.addColorStop(1,'rgba(20,0,30,0.5)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
