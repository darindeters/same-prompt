<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Dusk on the plains</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #21152f; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let w, h, scale, ox, oy;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const clouds = Array.from({length: 90}, () => ({x: rand(-150, 1150), y: rand(20, 360), r: rand(35, 150), a: rand(.025, .12), speed: rand(2, 9)}));
  const dust = Array.from({length: 180}, () => ({x: rand(-1, 1), y: rand(0, 1), size: rand(1, 4), phase: rand(0, 7), speed: rand(.4, 1.3)}));
  const debris = Array.from({length: 85}, () => ({phase: rand(0, 7), height: rand(0, 1), speed: rand(.35, .9), size: rand(2, 7), kind: Math.random()}));
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    scale = Math.max(w / 1080, h / 1080);
    ox = (w - 1080 * scale) / 2; oy = (h - 1080 * scale) / 2;
  }
  addEventListener('resize', resize); resize();
  function ellipse(x,y,rx,ry,color,rotation=0) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rotation,0,Math.PI*2); ctx.fill();
  }
  function funnelCenter(y, t) { return 565 + 48 * Math.sin(y * .004 + t * .35) + (1-y/790)*(-45); }
  function funnelWidth(y) { return 28 + 250 * Math.pow(clamp((790-y)/790,0,1), 1.18); }
  function draw(t) {
    ctx.save(); ctx.translate(ox,oy); ctx.scale(scale,scale);
    let g = ctx.createLinearGradient(0,0,0,850);
    g.addColorStop(0,'#171b39'); g.addColorStop(.34,'#4e3151'); g.addColorStop(.65,'#b54e55'); g.addColorStop(.83,'#ff9460'); g.addColorStop(1,'#f7bc6b');
    ctx.fillStyle=g; ctx.fillRect(-500,-500,2080,1580);
    // The low, glowing sun is diffused by the storm and dust.
    g=ctx.createRadialGradient(800,565,5,800,565,310); g.addColorStop(0,'rgba(255,218,143,.82)'); g.addColorStop(.25,'rgba(255,143,91,.34)'); g.addColorStop(1,'rgba(255,111,86,0)'); ctx.fillStyle=g; ctx.fillRect(400,200,800,650);
    ellipse(801,570,57,57,'rgba(255,211,139,.72)');
    // Broad storm shelves, with softly drifting cloud texture.
    ctx.fillStyle='#28263d'; ctx.beginPath(); ctx.moveTo(-100,0); ctx.lineTo(1180,0); ctx.lineTo(1180,226); ctx.bezierCurveTo(1000,257,925,213,794,275); ctx.bezierCurveTo(672,325,576,266,462,307); ctx.bezierCurveTo(310,352,177,278,-100,337); ctx.closePath(); ctx.fill();
    clouds.forEach(c => { let x=((c.x+t*c.speed+200)%1400)-200; ellipse(x,c.y,c.r,c.r*.28,`rgba(137,91,112,${c.a})`,-.04); });
    ellipse(507,296,495,78,'rgba(35,28,45,.65)',-.04);
    ellipse(590,323,340,51,'rgba(59,39,54,.65)',.035);
    ellipse(544,355,250,26,'rgba(143,75,78,.25)',-.08);
    // Distant farmland and tree line.
    ctx.fillStyle='#403743'; ctx.beginPath(); ctx.moveTo(0,690); for(let x=0;x<=1080;x+=18) ctx.lineTo(x,684+Math.sin(x*.023)*5+Math.sin(x*.07)*3); ctx.lineTo(1080,760); ctx.lineTo(0,760); ctx.fill();
    for(let x=0;x<1080;x+=13) { const y=686+Math.sin(x*.023)*5; ellipse(x,y,8+(x%7),11+(x%13),'#38333b'); }
    g=ctx.createLinearGradient(0,685,0,1080); g.addColorStop(0,'#a16a46'); g.addColorStop(.25,'#94603b'); g.addColorStop(1,'#3f3228'); ctx.fillStyle=g; ctx.fillRect(0,700,1080,380);
    // Perspective furrows radiate toward the horizon.
    for(let i=-12;i<19;i++) { const end=i*130; ctx.strokeStyle=i%2?'rgba(246,157,74,.24)':'rgba(42,35,29,.45)'; ctx.lineWidth=i%2?6:13; ctx.beginPath(); ctx.moveTo(530+(end-530)*.035,703); ctx.lineTo(end,1085); ctx.stroke(); }
    for(let i=0;i<15;i++) { let y=730+i*i*1.8; ctx.strokeStyle=`rgba(255,184,96,${.08+i*.004})`; ctx.lineWidth=1+i*.18; ctx.beginPath(); ctx.moveTo(0,y); ctx.quadraticCurveTo(540,y-20-i*2,1080,y+8); ctx.stroke(); }
    // Funnel silhouette: wide at the cloud base and tightly wound at ground level.
    ctx.beginPath();
    for(let y=292;y<=790;y+=10) { const x=funnelCenter(y,t)-funnelWidth(y); y===292?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    for(let y=790;y>=292;y-=10) ctx.lineTo(funnelCenter(y,t)+funnelWidth(y),y);
    ctx.closePath();
    g=ctx.createLinearGradient(290,0,800,0); g.addColorStop(0,'#49333c'); g.addColorStop(.28,'#82605c'); g.addColorStop(.52,'#4c3b43'); g.addColorStop(.77,'#332e3a'); g.addColorStop(1,'#76505a'); ctx.fillStyle=g; ctx.fill();
    ctx.save(); ctx.clip();
    // Curving ribbons turn through the funnel, giving it volume and rotation.
    for(let i=0;i<46;i++) {
      let y=300+i*11; let width=funnelWidth(y), cx=funnelCenter(y,t); let shift=Math.sin(i*.55-t*2.1)*width*.48;
      ctx.strokeStyle=i%3===0?'rgba(235,156,120,.19)':'rgba(28,27,38,.22)'; ctx.lineWidth=7+(1-y/800)*13;
      ctx.beginPath(); ctx.moveTo(cx-width-35,y-20); ctx.bezierCurveTo(cx-width*.35+shift,y+12,cx+width*.35+shift,y+26,cx+width+35,y-7); ctx.stroke();
    }
    for(let i=0;i<18;i++) { let y=315+i*25, x=funnelCenter(y,t)+Math.sin(i*2.3+t)*funnelWidth(y)*.55; ellipse(x,y,80*(1-y/1000),8,'rgba(255,185,142,.045)',-.2); }
    ctx.restore();
    // Wide ground-hugging dust cloud.
    g=ctx.createRadialGradient(554,768,20,554,768,310); g.addColorStop(0,'rgba(220,155,104,.82)'); g.addColorStop(.45,'rgba(181,113,77,.46)'); g.addColorStop(1,'rgba(199,122,75,0)'); ctx.fillStyle=g; ctx.fillRect(190,650,730,260);
    for (const p of dust) { let phase=t*p.speed+p.phase; let x=560+p.x*310+Math.sin(phase)*35; let y=765+p.y*86+Math.sin(phase*1.4)*9; ellipse(x,y,p.size*5,p.size*1.5,`rgba(239,174,111,${.10+(1-p.y)*.13})`,Math.sin(phase)*.1); }
    // Fragments orbit and climb, growing smaller toward the clouds.
    for(const p of debris) {
      const z=(p.height+t*p.speed*.055)%1; const y=805-z*450; const radius=60+z*170; const angle=p.phase+t*(2.3-z*.8); const x=funnelCenter(y,t)+Math.sin(angle)*radius; const depth=.55+.45*Math.cos(angle); const size=p.size*depth*(1-z*.55);
      ctx.save(); ctx.translate(x,y); ctx.rotate(angle*2+p.phase); ctx.fillStyle=p.kind>.5?'#302a2c':'#d39a66'; ctx.globalAlpha=.4+depth*.5; ctx.fillRect(-size, -size*.22, size*2, Math.max(1,size*.45)); if(p.kind>.8) ctx.fillRect(-size*.2,-size*.8,size*.35,size*1.6); ctx.restore();
    }
    // Foreground stalks add scale and movement.
    for(let i=0;i<100;i++) { let x=i*12-10, base=1085, height=25+(i*37%75), sway=Math.sin(t*1.7+i*.7)*6; ctx.strokeStyle=i%3?'rgba(35,31,29,.76)':'rgba(211,139,72,.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,base); ctx.quadraticCurveTo(x+sway,base-height*.6,x+sway+8,base-height); ctx.stroke(); }
    g=ctx.createLinearGradient(0,900,0,1080); g.addColorStop(0,'rgba(25,23,30,0)'); g.addColorStop(1,'rgba(24,23,30,.42)'); ctx.fillStyle=g; ctx.fillRect(0,900,1080,180);
    ctx.restore(); requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
