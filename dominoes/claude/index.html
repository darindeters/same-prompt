<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spiral Dominoes</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#06041a}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  // Projection: screen x = X, screen y = Y*K - Z*HV  (camera above and in front)
  const K = 0.66, HV = 0.9;
  const VLEN = Math.hypot(HV, K);
  const L = norm3(-0.45, -0.35, 0.82);       // direction toward the light
  const TURNS = 6;
  const AMAX = 70 * Math.PI / 180;           // resting lean angle
  const DUR = 0.26;                          // seconds for one domino to fall
  const PT = 0.35;                           // progress at which the next domino is struck
  const DELAY = DUR * Math.pow(PT, 1 / 1.5); // time between successive falls
  const LEAD = 0.7, HOLD = 2.2, RDUR = 0.55, RSTEP = 0.012, TAIL = 0.8;

  let W, H, cx, cy, u, R;
  let doms = [], order = [], sparks = [];
  let trackWide, trackThin, bgGrad;
  let cycleLen = 1, cycleStart = performance.now() / 1000, lastT = cycleStart;

  function norm3(x, y, z) { const l = Math.hypot(x, y, z); return [x / l, y / l, z / l]; }
  function hsl(h, s, l) {
    const f = n => { const k = (n + h / 30) % 12; const a = s * Math.min(l, 1 - l);
      return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
    return [255 * f(0), 255 * f(8), 255 * f(4)];
  }

  function build() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    R = Math.min(W * 0.47, H * 0.47 / K);
    u = R / 500;
    cx = W / 2; cy = H / 2 + 8 * u;

    const r0 = 58 * u;
    const b = (R - r0) / (2 * Math.PI * TURNS);
    const w = 36 * u, hg = 60 * u, th = 8 * u, sp = 25 * u;

    doms = []; sparks = [];
    trackWide = new Path2D(); trackThin = new Path2D();
    let theta = 0, r = r0, acc = 0, step = 0, n = 0;
    while (r <= R) {
      const x = r * Math.cos(theta), y = r * Math.sin(theta);
      if (step % 6 === 0) {
        const sx = cx + x, sy = cy + y * K;
        if (step === 0) { trackWide.moveTo(sx, sy); trackThin.moveTo(sx, sy); }
        else { trackWide.lineTo(sx, sy); trackThin.lineTo(sx, sy); }
      }
      if (acc <= 0) {
        let tx = b * Math.cos(theta) - r * Math.sin(theta);
        let ty = b * Math.sin(theta) + r * Math.cos(theta);
        const tl = Math.hypot(tx, ty); tx /= tl; ty /= tl;
        doms.push({ i: n, x, y, fx: tx, fy: ty, sx: -ty, sy: tx, w, hg, th,
          rgb: hsl((n * 2.3) % 360, 1, 0.55), ang: 0, depth: 0, hit: false });
        n++; acc += sp;
      }
      const ds = 1;
      const dth = ds / Math.sqrt(b * b + r * r);
      acc -= ds; theta += dth; r = r0 + b * theta; step++;
    }
    order = doms.map(d => d.i);
    const N = doms.length;
    cycleLen = LEAD + (N - 1) * DELAY + DUR + HOLD + (N - 1) * RSTEP + RDUR + TAIL;

    bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.8);
    bgGrad.addColorStop(0, '#1b1048');
    bgGrad.addColorStop(0.6, '#0a0626');
    bgGrad.addColorStop(1, '#030210');
  }

  function angleAt(d, e) {
    const N = doms.length;
    const sf = LEAD + d.i * DELAY;
    const rs = LEAD + (N - 1) * DELAY + DUR + HOLD + d.i * RSTEP;
    if (e < sf) return 0;
    if (e < rs) { const p = Math.min(1, (e - sf) / DUR); return AMAX * Math.pow(p, 1.5); }
    const q = Math.min(1, (e - rs) / RDUR);
    const s = 1 - Math.pow(1 - q, 3);
    return AMAX * ((1 - s) - 0.07 * Math.sin(Math.PI * q) * q);
  }

  function emit(d) {
    const ca = Math.cos(d.ang), sa = Math.sin(d.ang);
    const up = d.hg * sa, zp = d.hg * ca;
    const X = d.x + d.fx * up, Y = d.y + d.fy * up;
    for (let k = 0; k < 6; k++) {
      const a = Math.random() * Math.PI * 2, sp = (20 + Math.random() * 70) * u;
      sparks.push({ x: X, y: Y, z: zp, vx: Math.cos(a) * sp + d.fx * 40 * u,
        vy: Math.sin(a) * sp + d.fy * 40 * u, vz: (40 + Math.random() * 110) * u,
        life: 0.45 + Math.random() * 0.3, age: 0, rgb: d.rgb });
    }
    if (sparks.length > 400) sparks.splice(0, sparks.length - 400);
  }

  // Face corner indices: idx = u*4 + v*2 + z
  const FACES = [
    { n: [1, 0, 0], c: [4, 6, 7, 5], pips: true },   // front (+u)
    { n: [-1, 0, 0], c: [0, 2, 3, 1], pips: true },  // back  (-u)
    { n: [0, 1, 0], c: [2, 3, 7, 6] },               // right (+v)
    { n: [0, -1, 0], c: [0, 1, 5, 4] },              // left  (-v)
    { n: [0, 0, 1], c: [1, 3, 7, 5] },               // top   (+z)
    { n: [0, 0, -1], c: [0, 2, 6, 4] }               // bottom(-z)
  ];
  const P = new Array(8);

  function drawShadow(d) {
    const ca = Math.cos(d.ang), sa = Math.sin(d.ang);
    const um = d.th / 2;
    const u0 = um * ca, z0 = -um * sa;
    const u1 = um * ca + d.hg * sa, z1 = d.hg * ca - um * sa;
    const pts = [];
    for (const [up, zp, vs] of [[u0, z0, -1], [u0, z0, 1], [u1, z1, 1], [u1, z1, -1]]) {
      const v = vs * d.w / 2;
      const X = d.x + d.fx * up + d.sx * v - zp * L[0] / L[2];
      const Y = d.y + d.fy * up + d.sy * v - zp * L[1] / L[2];
      pts.push(cx + X, cy + Y * K);
    }
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    for (let k = 2; k < 8; k += 2) ctx.lineTo(pts[k], pts[k + 1]);
    ctx.closePath();
    ctx.fill();
  }

  function drawBox(d) {
    const ca = Math.cos(d.ang), sa = Math.sin(d.ang);
    for (let iu = 0; iu < 2; iu++) for (let iv = 0; iv < 2; iv++) for (let iz = 0; iz < 2; iz++) {
      const uu = iu * d.th, v = (iv - 0.5) * d.w, z = iz * d.hg;
      const up = uu * ca + z * sa, zp = z * ca - uu * sa;
      const X = d.x + d.fx * up + d.sx * v, Y = d.y + d.fy * up + d.sy * v;
      P[iu * 4 + iv * 2 + iz] = [cx + X, cy + Y * K - zp * HV];
    }
    for (const f of FACES) {
      const [nu, nv, nz] = f.n;
      const nup = nu * ca + nz * sa, nzp = nz * ca - nu * sa;
      const nx = d.fx * nup + d.sx * nv, ny = d.fy * nup + d.sy * nv;
      const vis = ny * HV + nzp * K;
      if (vis <= 0) continue;
      const lam = Math.max(0, nx * L[0] + ny * L[1] + nzp * L[2]);
      const br = 0.42 + 0.68 * lam;
      const c = d.rgb;
      ctx.fillStyle = `rgb(${Math.min(255, c[0] * br) | 0},${Math.min(255, c[1] * br) | 0},${Math.min(255, c[2] * br) | 0})`;
      const a = P[f.c[0]], b = P[f.c[1]], cc = P[f.c[2]], dd = P[f.c[3]];
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(cc[0], cc[1]); ctx.lineTo(dd[0], dd[1]);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      if (f.pips) {
        const fac = vis / VLEN;
        if (fac > 0.3) {
          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          const rad = 3 * u * fac;
          for (const fz of [0.3, 0.7]) {
            const x0 = a[0] + (b[0] - a[0]) * 0.5, y0 = a[1] + (b[1] - a[1]) * 0.5;
            const x1 = dd[0] + (cc[0] - dd[0]) * 0.5, y1 = dd[1] + (cc[1] - dd[1]) * 0.5;
            const px = x0 + (x1 - x0) * fz, py = y0 + (y1 - y0) * fz;
            ctx.beginPath(); ctx.ellipse(px, py, rad * 1.1, rad, 0, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
    }
  }

  function frame(now) {
    const t = now / 1000;
    let dt = Math.min(0.05, t - lastT); lastT = t;
    let e = t - cycleStart;
    if (e >= cycleLen) { cycleStart += cycleLen * Math.floor(e / cycleLen); e = t - cycleStart; }
    const N = doms.length;

    // Background and track
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.055)'; ctx.lineWidth = 40 * u; ctx.stroke(trackWide);
    ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.lineWidth = 1.3 * u; ctx.stroke(trackThin);

    // Update dominoes
    for (const d of doms) {
      const sf = LEAD + d.i * DELAY;
      d.ang = angleAt(d, e);
      if (e < sf) d.hit = false;
      else if (!d.hit && (e - sf) / DUR >= PT) { d.hit = true; emit(d); }
      const s = Math.sin(d.ang), c = Math.cos(d.ang);
      d.depth = (d.y + d.fy * d.hg * 0.5 * s) * HV + d.hg * 0.5 * c * K;
    }

    // Travelling glow under the active domino
    const fallEnd = LEAD + (N - 1) * DELAY + DUR;
    const riseStart = fallEnd + HOLD;
    let gi = -1;
    if (e >= LEAD && e < fallEnd) gi = Math.min(N - 1, (e - LEAD) / DELAY);
    else if (e >= riseStart) gi = Math.min(N - 1, (e - riseStart) / RSTEP);
    if (gi >= 0) {
      const d = doms[gi | 0];
      const gx = cx + d.x, gy = cy + d.y * K;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 150 * u);
      g.addColorStop(0, `rgba(${d.rgb[0] | 0},${d.rgb[1] | 0},${d.rgb[2] | 0},0.38)`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(gx - 150 * u, gy - 150 * u, 300 * u, 300 * u);
    }

    // Shadows
    ctx.fillStyle = 'rgba(0,0,12,0.42)';
    for (const d of doms) drawShadow(d);

    // Boxes, far to near
    order.sort((a, b) => doms[a].depth - doms[b].depth);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
    ctx.lineWidth = 0.8;
    ctx.lineJoin = 'round';
    for (const i of order) drawBox(doms[i]);

    // Sparks
    for (let k = sparks.length - 1; k >= 0; k--) {
      const s = sparks[k];
      s.age += dt;
      if (s.age >= s.life) { sparks.splice(k, 1); continue; }
      s.vz -= 320 * u * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
      if (s.z < 0) { s.z = 0; s.vz *= -0.4; }
      const al = 1 - s.age / s.life;
      ctx.fillStyle = `rgba(${s.rgb[0] | 0},${s.rgb[1] | 0},${s.rgb[2] | 0},${al})`;
      ctx.beginPath();
      ctx.arc(cx + s.x, cy + s.y * K - s.z * HV, 2.2 * u * (0.5 + al), 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  addEventListener('resize', build);
  build();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
