<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chain</title>
<style>
  html, body, canvas {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050308;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const R0 = 78;
  const ARM = 64;
  const TURNS = 4.72;
  const THETA0 = 0.62;
  const THETA1 = THETA0 + TURNS * Math.PI * 2;
  const B = ARM / (Math.PI * 2);
  const SHAPE = 2.48;
  const SPACING = 20.2;
  const HEIGHT = 42;
  const HALFW = 8.05;
  const BAND = 12;

  const PALETTE = [
    [255, 49, 78],
    [0, 214, 255],
    [255, 176, 0],
    [86, 104, 255],
    [188, 255, 20],
    [255, 20, 168],
    [0, 232, 146],
    [255, 106, 0],
    [176, 72, 255],
    [255, 230, 32],
    [0, 168, 255],
    [255, 72, 120]
  ];

  const PIPS = [
    [0.5, 0],
    [0.32, -0.34, 0.7, 0.34],
    [0.24, -0.36, 0.52, 0, 0.78, 0.36],
    [0.3, -0.38, 0.3, 0.38, 0.72, -0.38, 0.72, 0.38],
    [0.24, -0.38, 0.24, 0.38, 0.52, 0, 0.78, -0.38, 0.78, 0.38],
    [0.28, -0.4, 0.52, -0.4, 0.76, -0.4, 0.28, 0.4, 0.52, 0.4, 0.76, 0.4]
  ];

  function clamp01(v) {
    return v < 0 ? 0 : v > 1 ? 1 : v;
  }

  function css(c, a) {
    const r = c[0] | 0;
    const g = c[1] | 0;
    const b = c[2] | 0;
    return a == null ? "rgb(" + r + "," + g + "," + b + ")" : "rgba(" + r + "," + g + "," + b + "," + a + ")";
  }

  function scaleRgb(c, k) {
    return [
      Math.max(0, Math.min(255, c[0] * k)),
      Math.max(0, Math.min(255, c[1] * k)),
      Math.max(0, Math.min(255, c[2] * k))
    ];
  }

  function radius(theta) {
    const u = (theta - THETA0) / (THETA1 - THETA0);
    const env = Math.sin(Math.PI * clamp01(u));
    return R0 + B * (theta - THETA0) + env * (3.1 * Math.sin(2.05 * theta) + 1.5 * Math.sin(4.7 * theta + 0.8));
  }

  function pos(theta) {
    const r = radius(theta);
    const c = Math.cos(theta);
    const s = Math.sin(theta);
    const ac = Math.abs(c);
    const as = Math.abs(s);
    const denom = Math.pow(Math.pow(ac, SHAPE) + Math.pow(as, SHAPE), 1 / SHAPE) || 1;
    return { x: c * (r / denom), y: s * (r / denom) };
  }

  function tangentAt(theta) {
    const e = 0.0025;
    const a = pos(Math.max(THETA0, theta - e));
    const b = pos(Math.min(THETA1, theta + e));
    let tx = b.x - a.x;
    let ty = b.y - a.y;
    const m = Math.hypot(tx, ty) || 1;
    tx /= m;
    ty /= m;
    return { x: tx, y: ty };
  }

  function buildScene() {
    const steps = 18000;
    let prev = pos(THETA0);
    let acc = 0;
    let nextAt = SPACING * 0.5;
    let lastTrack = 0;
    const track = [prev.x, prev.y];
    const raw = [];

    for (let i = 1; i <= steps; i++) {
      const theta = THETA0 + (THETA1 - THETA0) * (i / steps);
      const p = pos(theta);
      acc += Math.hypot(p.x - prev.x, p.y - prev.y);
      if (acc - lastTrack >= 5) {
        track.push(p.x, p.y);
        lastTrack = acc;
      }
      if (acc >= nextAt) {
        const tan = tangentAt(theta);
        let nx = -tan.y;
        let ny = tan.x;
        if (nx * p.x + ny * p.y < 0) {
          nx = -nx;
          ny = -ny;
        }
        raw.push({ x: p.x, y: p.y, tx: tan.x, ty: tan.y, nx: nx, ny: ny });
        nextAt += SPACING;
      }
      prev = p;
    }
    track.push(prev.x, prev.y);

    const dominoes = raw.map(function (d, i) {
      const jitter = 0.93 + ((i * 13) % 4) * 0.025;
      const light = d.nx * -0.25 + d.ny * -0.95;
      const k = jitter * (0.86 + 0.14 * (light * 0.5 + 0.5));
      const rgb = scaleRgb(PALETTE[Math.floor(i / BAND) % PALETTE.length], k);
      return {
        x: d.x,
        y: d.y,
        tx: d.tx,
        ty: d.ty,
        nx: d.nx,
        ny: d.ny,
        rgb: rgb,
        front: css(rgb),
        edge: css(scaleRgb(rgb, 0.42)),
        topPips: i % 6,
        botPips: (i * 5 + 2) % 6
      };
    });

    const bounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    let maxR = 0;
    function add(x, y) {
      if (x < bounds.minX) bounds.minX = x;
      if (y < bounds.minY) bounds.minY = y;
      if (x > bounds.maxX) bounds.maxX = x;
      if (y > bounds.maxY) bounds.maxY = y;
    }
    for (let i = 0; i < dominoes.length; i++) {
      const d = dominoes[i];
      maxR = Math.max(maxR, Math.hypot(d.x, d.y));
      add(d.x, d.y);
      add(d.x + d.nx * HEIGHT, d.y + d.ny * HEIGHT);
      add(d.x + d.tx * HEIGHT, d.y + d.ty * HEIGHT);
      add(d.x - d.nx * HALFW, d.y - d.ny * HALFW);
      add(d.x + d.nx * HALFW, d.y + d.ny * HALFW);
      add(d.x + d.tx * HALFW, d.y + d.ty * HALFW);
      add(d.x - d.tx * HALFW, d.y - d.ty * HALFW);
    }
    const margin = 14;
    bounds.minX -= margin;
    bounds.minY -= margin;
    bounds.maxX += margin;
    bounds.maxY += margin;
    return { dominoes: dominoes, track: track, bounds: bounds, maxR: maxR };
  }

  function fallAngle(t) {
    const x = clamp01(t);
    const s = 1 - Math.pow(1 - x, 2.4);
    let land = 0;
    if (x > 0.76) {
      const u = (x - 0.76) / 0.24;
      land = Math.sin(u * Math.PI) * 0.08 * (1 - u);
    }
    return clamp01(s - land) * Math.PI * 0.5;
  }

  function riseEase(t) {
    return 1 - Math.pow(1 - clamp01(t), 3);
  }

  const scene = buildScene();
  const dominoes = scene.dominoes;
  const N = dominoes.length;
  const order = new Array(N);
  for (let i = 0; i < N; i++) order[i] = N - 1 - i;

  const FALL_MS = 320;
  const FALL_GAP = 36;
  const REST_DOWN = 520;
  const RISE_MS = 260;
  const RISE_GAP = 12;
  const REST_UP = 320;
  const fallEnd = (N - 1) * FALL_GAP + FALL_MS;
  const riseAt = fallEnd + REST_DOWN;
  const riseEnd = riseAt + (N - 1) * RISE_GAP + RISE_MS;
  const LOOP = riseEnd + REST_UP;
  const angles = new Float64Array(N);

  function angleAt(i, t) {
    const fallT = i * FALL_GAP;
    if (t < fallT) return 0;
    if (t < fallT + FALL_MS) return fallAngle((t - fallT) / FALL_MS);
    const riseT = riseAt + i * RISE_GAP;
    if (t < riseT) return Math.PI * 0.5;
    if (t < riseT + RISE_MS) return (Math.PI * 0.5) * (1 - riseEase((t - riseT) / RISE_MS));
    return 0;
  }

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  const view = { w: 1, h: 1, dpr: 1, s: 1, ox: 0, oy: 0 };

  function resize() {
    view.w = Math.max(1, window.innerWidth);
    view.h = Math.max(1, window.innerHeight);
    view.dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(view.w * view.dpr);
    canvas.height = Math.round(view.h * view.dpr);
    const pad = Math.min(view.w, view.h) * 0.038;
    const bw = scene.bounds.maxX - scene.bounds.minX;
    const bh = scene.bounds.maxY - scene.bounds.minY;
    view.s = Math.min((view.w - pad * 2) / bw, (view.h - pad * 2) / bh);
    view.ox = (view.w - bw * view.s) * 0.5 - scene.bounds.minX * view.s;
    view.oy = (view.h - bh * view.s) * 0.5 - scene.bounds.minY * view.s;
  }

  window.addEventListener("resize", resize);
  resize();

  function quad(x0, y0, x1, y1, x2, y2, x3, y3) {
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineTo(x3, y3);
    ctx.closePath();
  }

  function pose(d, angle) {
    const ca = Math.cos(angle);
    const sa = Math.sin(angle);
    const ux = d.tx * sa + d.nx * ca;
    const uy = d.ty * sa + d.ny * ca;
    const wx = d.tx * ca - d.nx * sa;
    const wy = d.ty * ca - d.ny * sa;
    const topW = HALFW * (0.8 + 0.2 * sa);
    const botW = HALFW;
    return {
      ca: ca,
      sa: sa,
      ux: ux,
      uy: uy,
      tlx: d.x + ux * HEIGHT - wx * topW,
      tly: d.y + uy * HEIGHT - wy * topW,
      trx: d.x + ux * HEIGHT + wx * topW,
      tryY: d.y + uy * HEIGHT + wy * topW,
      blx: d.x - wx * botW,
      bly: d.y - wy * botW,
      brx: d.x + wx * botW,
      bry: d.y + wy * botW
    };
  }

  function pipHalf(t0, t1, layout, pr, p) {
    for (let k = 0; k < layout.length; k += 2) {
      const t = t0 + (t1 - t0) * layout[k];
      const u = (layout[k + 1] + 1) * 0.5;
      const topx = p.tlx + (p.trx - p.tlx) * u;
      const topy = p.tly + (p.tryY - p.tly) * u;
      const botx = p.blx + (p.brx - p.blx) * u;
      const boty = p.bly + (p.bry - p.bly) * u;
      const x = topx + (botx - topx) * t;
      const y = topy + (boty - topy) * t;
      ctx.moveTo(x + pr, y);
      ctx.arc(x, y, pr, 0, Math.PI * 2);
    }
  }

  function drawDomino(d, angle, flash) {
    const p = pose(d, angle);
    const ex = -3.1;
    const ey = -2.5;
    ctx.fillStyle = d.edge;
    quad(p.blx + ex, p.bly + ey, p.brx + ex, p.bry + ey, p.trx + ex, p.tryY + ey, p.tlx + ex, p.tly + ey);
    ctx.fill();

    ctx.fillStyle = d.front;
    quad(p.blx, p.bly, p.brx, p.bry, p.trx, p.tryY, p.tlx, p.tly);
    ctx.fill();
    ctx.lineWidth = 1.2 / view.s;
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.tlx, p.tly);
    ctx.lineTo(p.trx, p.tryY);
    ctx.lineWidth = 1.6 / view.s;
    ctx.strokeStyle = "rgba(255,255,255,0.55)";
    ctx.stroke();

    const hx = 0.28;
    quad(
      p.tlx, p.tly,
      p.trx, p.tryY,
      p.trx + (p.brx - p.trx) * hx, p.tryY + (p.bry - p.tryY) * hx,
      p.tlx + (p.blx - p.tlx) * hx, p.tly + (p.bly - p.tly) * hx
    );
    ctx.fillStyle = "rgba(255,255,255,0.18)";
    ctx.fill();

    if (view.s * HALFW > 4.8 && p.ca > 0.48) {
      ctx.beginPath();
      ctx.moveTo((p.tlx + p.blx) * 0.5, (p.tly + p.bly) * 0.5);
      ctx.lineTo((p.trx + p.brx) * 0.5, (p.tryY + p.bry) * 0.5);
      ctx.lineWidth = 1.25 / view.s;
      ctx.strokeStyle = "rgba(20,0,28,0.55)";
      ctx.stroke();
      ctx.beginPath();
      const pr = Math.min(HALFW * 0.27, HEIGHT * 0.062);
      pipHalf(0.08, 0.46, PIPS[d.topPips], pr, p);
      pipHalf(0.54, 0.9, PIPS[d.botPips], pr, p);
      ctx.fillStyle = "rgba(24,0,28,0.82)";
      ctx.fill();
    }

    if (flash > 0.015) {
      quad(p.blx, p.bly, p.brx, p.bry, p.trx, p.tryY, p.tlx, p.tly);
      ctx.fillStyle = "rgba(255,255,255," + flash.toFixed(3) + ")";
      ctx.fill();
    }
  }

  const startMs = performance.now() - FALL_GAP * 6;

  function frame(now) {
    const t = ((now - startMs) % LOOP + LOOP) % LOOP;
    let lead = -1;
    for (let i = 0; i < N; i++) {
      const a = angleAt(i, t);
      angles[i] = a;
      if (a > 0.05 && a < Math.PI * 0.5 - 0.05) lead = i;
    }

    const dpr = view.dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createRadialGradient(
      view.w * 0.5, view.h * 0.46, Math.min(view.w, view.h) * 0.06,
      view.w * 0.5, view.h * 0.52, Math.max(view.w, view.h) * 0.74
    );
    bg.addColorStop(0, "#321c58");
    bg.addColorStop(0.4, "#140d22");
    bg.addColorStop(1, "#050308");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, view.w, view.h);

    ctx.setTransform(dpr * view.s, 0, 0, dpr * view.s, dpr * view.ox, dpr * view.oy);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    const floor = ctx.createRadialGradient(0, 0, scene.maxR * 0.1, 0, 0, scene.maxR * 1.28);
    floor.addColorStop(0, "rgba(74, 40, 120, 0.35)");
    floor.addColorStop(0.62, "rgba(20, 12, 36, 0.28)");
    floor.addColorStop(1, "rgba(20, 12, 36, 0)");
    ctx.fillStyle = floor;
    ctx.beginPath();
    ctx.arc(0, 0, scene.maxR * 1.3, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(scene.track[0], scene.track[1]);
    for (let i = 2; i < scene.track.length; i += 2) ctx.lineTo(scene.track[i], scene.track[i + 1]);
    ctx.lineWidth = HALFW * 2.3;
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.stroke();

    if (lead >= 0) {
      const d = dominoes[lead];
      const gx = d.x + d.nx * 10;
      const gy = d.y + d.ny * 10;
      const glow = ctx.createRadialGradient(gx, gy, 2, gx, gy, 78);
      glow.addColorStop(0, css(d.rgb, 0.55));
      glow.addColorStop(0.4, css(d.rgb, 0.16));
      glow.addColorStop(1, css(d.rgb, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(gx, gy, 78, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const d = dominoes[i];
      const ca = Math.cos(angles[i]);
      const sa = Math.sin(angles[i]);
      const ux = d.tx * sa + d.nx * ca;
      const uy = d.ty * sa + d.ny * ca;
      ctx.ellipse(
        d.x + ux * HEIGHT * 0.42,
        d.y + uy * HEIGHT * 0.42 + 2.2,
        3.2 + HEIGHT * 0.34,
        HALFW * 0.92,
        Math.atan2(uy, ux),
        0,
        Math.PI * 2
      );
    }
    ctx.fill();

    for (let k = 0; k < N; k++) {
      const i = order[k];
      const age = t - i * FALL_GAP;
      let flash = 0;
      if (age >= 0 && age <= FALL_MS) flash = Math.sin((age / FALL_MS) * Math.PI) * 0.24;
      else if (age > FALL_MS && age < FALL_MS + 150 && t < riseAt) flash = (1 - (age - FALL_MS) / 150) * 0.12;
      drawDomino(dominoes[i], angles[i], flash);
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vig = ctx.createRadialGradient(
      view.w * 0.5, view.h * 0.5, Math.min(view.w, view.h) * 0.5,
      view.w * 0.5, view.h * 0.5, Math.max(view.w, view.h) * 0.72
    );
    vig.addColorStop(0, "rgba(0,0,0,0)");
    vig.addColorStop(1, "rgba(0,0,0,0.5)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, view.w, view.h);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
