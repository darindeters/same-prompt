let audioContext,master,started=false,scoreTimer;
function tone(freq,when,duration,type='sine',volume=.08,pan=0){
 const o=audioContext.createOscillator(),g=audioContext.createGain(),p=audioContext.createStereoPanner();o.type=type;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(volume,when+.04);g.gain.exponentialRampToValueAtTime(.0001,when+duration);p.pan.value=pan;o.connect(g).connect(p).connect(master);o.start(when);o.stop(when+duration+.1);
}
function beginSound(){
 if(started||!audioContext||audioContext.state!=='running')return;started=true;
 master=audioContext.createGain();master.gain.setValueAtTime(0,audioContext.currentTime);master.gain.linearRampToValueAtTime(.48,audioContext.currentTime+3);const compressor=audioContext.createDynamicsCompressor();master.connect(compressor).connect(audioContext.destination);
 for(const hz of [55,82.41,110.25]){const o=audioContext.createOscillator(),g=audioContext.createGain();o.type='sine';o.frequency.value=hz;g.gain.value=.06;o.connect(g).connect(master);o.start()}
 const buffer=audioContext.createBuffer(1,audioContext.sampleRate*4,audioContext.sampleRate),data=buffer.getChannelData(0);let brown=0;for(let i=0;i<data.length;i++){brown=(brown+(Math.random()*2-1)*.025)/1.025;data[i]=brown*3}
 const wind=audioContext.createBufferSource();wind.buffer=buffer;wind.loop=true;const filter=audioContext.createBiquadFilter();filter.type='bandpass';filter.frequency.value=500;filter.Q.value=.7;const wg=audioContext.createGain();wg.gain.value=.24;wind.connect(filter).connect(wg).connect(master);wind.start();
 const lfo=audioContext.createOscillator(),depth=audioContext.createGain();lfo.frequency.value=.11;depth.gain.value=350;lfo.connect(depth).connect(filter.frequency);lfo.start();
 let next=audioContext.currentTime+.2,beat=0;
 function schedule(){if(audioContext.state!=='running')return;if(next<audioContext.currentTime)next=audioContext.currentTime+.1;while(next<audioContext.currentTime+1){const notes=[440,659.25,523.25,830.61,659.25,392,523.25,329.63];const f=notes[beat%notes.length];tone(f,next,2.8,'sine',.085,Math.sin(beat*1.9)*.7);tone(f*2.003,next+.013,1.2,'sine',.016,-Math.sin(beat*1.9)*.6);
 if(beat%4===0){const o=audioContext.createOscillator(),g=audioContext.createGain(),p=audioContext.createStereoPanner();o.type='sine';o.frequency.setValueAtTime(150,next);o.frequency.exponentialRampToValueAtTime(590,next+1.7);g.gain.setValueAtTime(0,next);g.gain.linearRampToValueAtTime(.035,next+.7);g.gain.exponentialRampToValueAtTime(.0001,next+2.2);p.pan.setValueAtTime(-.7,next);p.pan.linearRampToValueAtTime(.7,next+2.2);o.connect(g).connect(p).connect(master);o.start(next);o.stop(next+2.3)}
 next+=.9;beat++}}
 schedule();scoreTimer=setInterval(schedule,250);
}
function unlockAudio(){try{if(!audioContext){const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)return;audioContext=new AudioCtor();audioContext.addEventListener('statechange',beginSound)}if(audioContext.state==='running')beginSound();else audioContext.resume().then(beginSound).catch(()=>{})}catch{}}
unlockAudio();addEventListener('pointerdown',unlockAudio,{passive:true});addEventListener('keydown',unlockAudio);addEventListener('click',unlockAudio,{passive:true});
</script>
