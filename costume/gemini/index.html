<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Halloween Portrait</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #070312;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script>
(() => {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // Virtual 1080x1080 coordinate space for crisp composition in a square window
  // while filling any aspect ratio seamlessly.
  let width = window.innerWidth;
  let height = window.innerHeight;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Deterministic PRNG for procedural scenery details
  let seed = 421031;
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // Stars in background
  const stars = Array.from({ length: 160 }, () => ({
    x: (rand() - 0.5) * 2000,
    y: -540 + rand() * 780,
    r: 1 + rand() * 2.8,
    phase: rand() * Math.PI * 2,
    speed: 1.5 + rand() * 3,
    hue: rand() > 0.5 ? 188 : (rand() > 0.4 ? 42 : 295)
  }));

  // Floating antigravity pebbles & rune shards
  const shards = Array.from({ length: 28 }, (_, i) => ({
    angle: (i / 28) * Math.PI * 2,
    radius: 260 + rand() * 250,
    baseY: -60 + (rand() - 0.5) * 650,
    size: 7 + rand() * 16,
    speed: 0.35 + rand() * 0.65,
    bobSpeed: 1.2 + rand() * 1.8,
    phase: rand() * Math.PI * 2,
    isCrystal: i % 2 === 0,
    hue: i % 3 === 0 ? 185 : (i % 3 === 1 ? 315 : 35)
  }));

  // Spooky bats
  const bats = Array.from({ length: 11 }, () => ({
    x: (rand() - 0.5) * 1400,
    y: -480 + rand() * 520,
    vx: (rand() > 0.5 ? 1 : -1) * (55 + rand() * 75),
    vy: (rand() - 0.5) * 18,
    scale: 0.55 + rand() * 0.75,
    flapPhase: rand() * Math.PI * 2,
    flapSpeed: 9 + rand() * 5
  }));

  // Rising magic embers / sparks
  const embers = Array.from({ length: 65 }, () => ({
    x: (rand() - 0.5) * 1200,
    y: -540 + rand() * 1100,
    vx: (rand() - 0.5) * 24,
    vy: -(35 + rand() * 65),
    r: 1.8 + rand() * 4.2,
    phase: rand() * Math.PI * 2,
    color: rand() > 0.45 ? '#00ffd5' : (rand() > 0.45 ? '#ff7b00' : '#ff2a85')
  }));

  // Background gothic hills & trees points
  const lightning = {
    alpha: 0,
    timer: 3.2,
    bolt: []
  };

  function triggerLightning(playThunder = true) {
    lightning.alpha = 0.95;
    lightning.bolt = [];
    let bx = (Math.random() > 0.5 ? -1 : 1) * (240 + Math.random() * 220);
    let by = -540;
    lightning.bolt.push({ x: bx, y: by });
    while (by < 180) {
      bx += (Math.random() - 0.5) * 90;
      by += 35 + Math.random() * 45;
      lightning.bolt.push({ x: bx, y: by });
    }
    if (playThunder) AudioEngine.playThunder();
  }

  // ============================================================================
  // WEB AUDIO API: Procedural Cyber-Occult & Antigravity Halloween Synth
  // ============================================================================
  const AudioEngine = (() => {
    let actx = null;
    let master = null;
    let started = false;
    let stepIndex = 0;
    let nextNoteTime = 0;

    // Haunted Dorian / Harmonic Minor scale frequencies (D minor / occult vibe)
    const arpFreqs = [
      293.66, 349.23, 440.00, 466.16, 554.37, 587.33,
      698.46, 554.37, 466.16, 440.00, 349.23, 329.63
    ];

    function init() {
      if (actx) {
        if (actx.state === 'suspended') {
          actx.resume().catch(() => {});
        }
        return;
      }
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      actx = new AudioCtx();
      master = actx.createGain();
      master.gain.value = 0.28;
      master.connect(actx.destination);

      // 1. Deep Cosmic Antigravity Sub-Drone
      const droneOsc1 = actx.createOscillator();
      const droneOsc2 = actx.createOscillator();
      const droneFilter = actx.createBiquadFilter();
      const droneGain = actx.createGain();

      droneOsc1.type = 'sawtooth';
      droneOsc2.type = 'triangle';
      droneOsc1.frequency.value = 73.42; // D2
      droneOsc2.frequency.value = 110.00; // A2
      droneOsc2.detune.value = 7;

      droneFilter.type = 'lowpass';
      droneFilter.frequency.value = 190;
      droneFilter.Q.value = 4;

      const droneLfo = actx.createOscillator();
      const droneLfoGain = actx.createGain();
      droneLfo.frequency.value = 0.18;
      droneLfoGain.gain.value = 75;
      droneLfo.connect(droneLfoGain);
      droneLfoGain.connect(droneFilter.frequency);

      droneGain.gain.value = 0.35;
      droneOsc1.connect(droneFilter);
      droneOsc2.connect(droneFilter);
      droneFilter.connect(droneGain);
      droneGain.connect(master);

      droneOsc1.start();
      droneOsc2.start();
      droneLfo.start();

      // 2. Spooky Haunted Wind (Filtered Pink/White Noise)
      const bufSize = actx.sampleRate * 3;
      const noiseBuf = actx.createBuffer(1, bufSize, actx.sampleRate);
      const output = noiseBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
        b6 = white * 0.115926;
      }

      const windSource = actx.createBufferSource();
      windSource.buffer = noiseBuf;
      windSource.loop = true;

      const windFilter = actx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 420;
      windFilter.Q.value = 6.5;

      const windLfo = actx.createOscillator();
      const windLfoGain = actx.createGain();
      windLfo.frequency.value = 0.13;
      windLfoGain.gain.value = 260;
      windLfo.connect(windLfoGain);
      windLfoGain.connect(windFilter.frequency);

      const windGain = actx.createGain();
      windGain.gain.value = 0.45;
      windSource.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(master);

      windSource.start();
      windLfo.start();

      // 3. Ghostly AI Theremin Lead (Smooth Vibrato Sine)
      const theremin = actx.createOscillator();
      const thereminGain = actx.createGain();
      const vibrato = actx.createOscillator();
      const vibratoGain = actx.createGain();

      theremin.type = 'sine';
      theremin.frequency.value = 587.33;
      vibrato.frequency.value = 6.2;
      vibratoGain.gain.value = 11;
      vibrato.connect(vibratoGain);
      vibratoGain.connect(theremin.frequency);

      thereminGain.gain.value = 0.055;
      theremin.connect(thereminGain);
      thereminGain.connect(master);
      theremin.start();
      vibrato.start();

      AudioEngine.theremin = theremin;
      AudioEngine.thereminGain = thereminGain;
      AudioEngine.noiseBuf = noiseBuf;
      nextNoteTime = actx.currentTime + 0.1;
      started = true;

      if (actx.state === 'suspended') {
        actx.resume().catch(() => {});
      }
    }

    // Play a crystalline neural-spell chime note
    function triggerChime(freq, time) {
      if (!actx || actx.state !== 'running') return;
      const osc = actx.createOscillator();
      const sub = actx.createOscillator();
      const gain = actx.createGain();

      osc.type = 'triangle';
      sub.type = 'sine';
      osc.frequency.setValueAtTime(freq, time);
      sub.frequency.setValueAtTime(freq * 2, time);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(0.11, time + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.65);

      osc.connect(gain);
      sub.connect(gain);
      gain.connect(master);

      osc.start(time);
      sub.start(time);
      osc.stop(time + 0.7);
      sub.stop(time + 0.7);
    }

    function playThunder() {
      if (!actx || actx.state !== 'running' || !AudioEngine.noiseBuf) return;
      const now = actx.currentTime;
      const src = actx.createBufferSource();
      src.buffer = AudioEngine.noiseBuf;
      src.loop = true;

      const filter = actx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(520, now);
      filter.frequency.exponentialRampToValueAtTime(65, now + 2.4);

      const gain = actx.createGain();
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.75, now + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      src.start(now);
      src.stop(now + 2.6);
    }

    function update() {
      if (!actx || !started || actx.state !== 'running') return;
      const now = actx.currentTime;
      if (nextNoteTime < now) nextNoteTime = now;

      while (nextNoteTime < now + 0.15) {
        const freq = arpFreqs[stepIndex % arpFreqs.length];
        const octave = (stepIndex % 4 === 0) ? 0.5 : ((stepIndex % 7 === 0) ? 2 : 1);
        triggerChime(freq * octave, nextNoteTime);

        // Glide theremin on every 3rd step for spooky melodic movement
        if (stepIndex % 3 === 0 && AudioEngine.theremin) {
          const target = arpFreqs[(stepIndex * 5) % arpFreqs.length] * 1.5;
          AudioEngine.theremin.frequency.exponentialRampToValueAtTime(target, nextNoteTime + 0.42);
          const swell = (stepIndex % 6 === 0) ? 0.08 : 0.03;
          AudioEngine.thereminGain.gain.linearRampToValueAtTime(swell, nextNoteTime + 0.35);
        }

        nextNoteTime += 0.28;
        stepIndex++;
      }
    }

    return { init, update, playThunder };
  })();

  // Start audio immediately on load and bind fallback on first interaction
  AudioEngine.init();
  const unlockAudio = () => {
    AudioEngine.init();
  };
  window.addEventListener('pointerdown', unlockAudio, { passive: true });
  window.addEventListener('click', unlockAudio, { passive: true });
  window.addEventListener('keydown', unlockAudio, { passive: true });
  window.addEventListener('touchstart', unlockAudio, { passive: true });

  // ============================================================================
  // DRAWING HELPERS
  // ============================================================================
  function drawStarPolygon(x, y, spikes, outerR, innerR, rot = 0) {
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = rot + (i * Math.PI) / spikes;
      const px = x + Math.cos(a) * r;
      const py = y + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawBat(x, y, scale, flap) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    const wingY = Math.sin(flap) * 18;
    ctx.fillStyle = '#090314';
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.quadraticCurveTo(-18, -16 + wingY, -38, -4 + wingY * 1.2);
    ctx.quadraticCurveTo(-26, 8 + wingY * 0.5, -18, 12);
    ctx.quadraticCurveTo(-8, 8, 0, 14);
    ctx.quadraticCurveTo(8, 8, 18, 12);
    ctx.quadraticCurveTo(26, 8 + wingY * 0.5, 38, -4 + wingY * 1.2);
    ctx.quadraticCurveTo(18, -16 + wingY, 0, 4);
    ctx.fill();

    // Little glowing eyes
    ctx.fillStyle = '#ff2a85';
    ctx.beginPath();
    ctx.arc(-3, 3, 1.5, 0, Math.PI * 2);
    ctx.arc(3, 3, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawTwistedTree(baseX, baseY, scaleX, scaleY, sway) {
    ctx.save();
    ctx.translate(baseX, baseY);
    ctx.scale(scaleX, scaleY);
    ctx.fillStyle = '#070210';
    ctx.beginPath();
    ctx.moveTo(-45, 0);
    ctx.quadraticCurveTo(-20, -180, -35 + sway * 0.4, -360);
    ctx.quadraticCurveTo(-110 + sway, -430, -175 + sway * 1.4, -495);
    ctx.quadraticCurveTo(-90 + sway, -455, -28 + sway * 0.5, -395);
    ctx.quadraticCurveTo(-10 + sway * 0.8, -510, 35 + sway * 1.3, -590);
    ctx.quadraticCurveTo(8 + sway * 0.7, -485, 4 + sway * 0.5, -380);
    ctx.quadraticCurveTo(85 + sway, -440, 145 + sway * 1.2, -475);
    ctx.quadraticCurveTo(75 + sway * 0.8, -405, 18 + sway * 0.4, -335);
    ctx.quadraticCurveTo(15, -170, 50, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawFamiliarOrb(x, y, radius, mainColor, glowColor, t, isSolar) {
    ctx.save();
    ctx.translate(x, y);

    // Outer aura
    const aura = ctx.createRadialGradient(0, 0, radius * 0.2, 0, 0, radius * 2.6);
    aura.addColorStop(0, mainColor);
    aura.addColorStop(0.45, glowColor);
    aura.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 2.6, 0, Math.PI * 2);
    ctx.fill();

    // Orbiting tech-magic ring around familiar
    ctx.save();
    ctx.rotate(t * (isSolar ? 1.8 : -1.8));
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 2.5;
    ctx.setLineDash([10, 8]);
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 1.45, radius * 0.55, 0.35, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Spectral pumpkin-core body
    const bodyGrad = ctx.createRadialGradient(-radius * 0.25, -radius * 0.25, radius * 0.1, 0, 0, radius);
    bodyGrad.addColorStop(0, '#ffffff');
    bodyGrad.addColorStop(0.35, mainColor);
    bodyGrad.addColorStop(1, '#16052b');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    // Cute/spooky carved face on the familiar spirit
    ctx.fillStyle = '#070210';
    // Left eye
    ctx.beginPath();
    ctx.moveTo(-radius * 0.48, -radius * 0.08);
    ctx.lineTo(-radius * 0.22, -radius * 0.35);
    ctx.lineTo(-radius * 0.12, -radius * 0.05);
    ctx.closePath();
    ctx.fill();
    // Right eye
    ctx.beginPath();
    ctx.moveTo(radius * 0.48, -radius * 0.08);
    ctx.lineTo(radius * 0.22, -radius * 0.35);
    ctx.lineTo(radius * 0.12, -radius * 0.05);
    ctx.closePath();
    ctx.fill();
    // Zigzag grin
    ctx.beginPath();
    ctx.moveTo(-radius * 0.52, radius * 0.2);
    ctx.lineTo(-radius * 0.25, radius * 0.42);
    ctx.lineTo(0, radius * 0.26);
    ctx.lineTo(radius * 0.25, radius * 0.42);
    ctx.lineTo(radius * 0.52, radius * 0.2);
    ctx.lineTo(radius * 0.28, radius * 0.56);
    ctx.lineTo(0, radius * 0.42);
    ctx.lineTo(-radius * 0.28, radius * 0.56);
    ctx.closePath();
    ctx.fill();

    // Little glowing stem/antenna
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -radius);
    ctx.quadraticCurveTo(8, -radius - 14, 14, -radius - 10);
    ctx.stroke();

    ctx.restore();
  }

  // ============================================================================
  // MAIN ANIMATION LOOP
  // ============================================================================
  let lastTime = performance.now();

  function render(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    const t = now * 0.001;

    AudioEngine.update();

    // Update lightning timer
    lightning.timer -= dt;
    if (lightning.timer <= 0) {
      triggerLightning(true);
      lightning.timer = 4.5 + Math.random() * 5.5;
    }
    if (lightning.alpha > 0) {
      lightning.alpha = Math.max(0, lightning.alpha - dt * 2.6);
    }

    ctx.save();
    ctx.scale(dpr, dpr);

    // Scale coordinate system so 1080x1080 is centered and always visible, while background covers 100%
    const scale = Math.max(width / 1080, height / 1080);
    const portraitScale = Math.min(width / 1080, height / 1080);

    // ------------------------------------------------------------------------
    // 1. VIVID HALLOWEEN NIGHT SKY (Full Bleed)
    // ------------------------------------------------------------------------
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, '#070214');
    skyGrad.addColorStop(0.38, '#1a0638');
    skyGrad.addColorStop(0.72, '#3d0b5e');
    skyGrad.addColorStop(0.92, '#8a1c64');
    skyGrad.addColorStop(1, '#ff5500');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // Center origin for background elements that scale to cover
    ctx.save();
    ctx.translate(width / 2, height / 2);
    ctx.scale(scale, scale);

    // Twinkling stars & Gemini constellations
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = 0.4 + 0.6 * Math.sin(t * s.speed + s.phase);
      ctx.fillStyle = `hsla(${s.hue}, 100%, 80%, ${twinkle})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * (0.7 + 0.5 * twinkle), 0, Math.PI * 2);
      ctx.fill();
    }

    // Lightning flash overlay & jagged sky bolt
    if (lightning.alpha > 0.01) {
      ctx.fillStyle = `rgba(180, 245, 255, ${lightning.alpha * 0.28})`;
      ctx.fillRect(-1200, -1200, 2400, 2400);

      ctx.save();
      ctx.strokeStyle = `rgba(220, 252, 255, ${lightning.alpha})`;
      ctx.shadowColor = '#00f7ff';
      ctx.shadowBlur = 28;
      ctx.lineWidth = 4.5;
      ctx.beginPath();
      for (let i = 0; i < lightning.bolt.length; i++) {
        const pt = lightning.bolt[i];
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();
      ctx.restore();
    }

    ctx.restore();

    // ------------------------------------------------------------------------
    // 2. SQUARE 1080x1080 PORTRAIT STAGE (Centered & Framed)
    // ------------------------------------------------------------------------
    ctx.save();
    ctx.translate(width / 2, height / 2);
    ctx.scale(portraitScale, portraitScale);

    // Giant Harvest Blood-Moon with Arcane Astrolabe Rings behind the AI Sorcerer
    const moonY = -140;
    const moonGrad = ctx.createRadialGradient(0, moonY, 40, 0, moonY, 370);
    moonGrad.addColorStop(0, '#fff7d6');
    moonGrad.addColorStop(0.35, '#ffbe2e');
    moonGrad.addColorStop(0.68, '#ff4d00');
    moonGrad.addColorStop(0.86, 'rgba(255, 0, 110, 0.42)');
    moonGrad.addColorStop(1, 'rgba(255, 0, 110, 0)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath();
    ctx.arc(0, moonY, 370, 0, Math.PI * 2);
    ctx.fill();

    // Crisp inner moon disc
    const innerMoon = ctx.createLinearGradient(0, moonY - 220, 0, moonY + 220);
    innerMoon.addColorStop(0, '#fff6cc');
    innerMoon.addColorStop(0.55, '#ff9e1b');
    innerMoon.addColorStop(1, '#ff2a55');
    ctx.fillStyle = innerMoon;
    ctx.beginPath();
    ctx.arc(0, moonY, 225, 0, Math.PI * 2);
    ctx.fill();

    // Rotating Celestial Gemini / Antigravity Astrolabe Halo behind head
    ctx.save();
    ctx.translate(0, moonY + 15);
    ctx.rotate(t * 0.22);
    ctx.strokeStyle = 'rgba(0, 255, 229, 0.72)';
    ctx.lineWidth = 3;
    ctx.setLineDash([18, 12, 4, 12]);
    ctx.beginPath();
    ctx.arc(0, 0, 265, 0, Math.PI * 2);
    ctx.stroke();

    ctx.rotate(-t * 0.48);
    ctx.strokeStyle = 'rgba(255, 196, 0, 0.65)';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([]);
    drawStarPolygon(0, 0, 8, 295, 235, 0);
    ctx.stroke();

    // Orbiting twin star nodes on the astrolabe
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4;
      const nx = Math.cos(a) * 295;
      const ny = Math.sin(a) * 295;
      ctx.fillStyle = i % 2 === 0 ? '#00ffe5' : '#ffaa00';
      ctx.beginPath();
      ctx.arc(nx, ny, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Flying Bats across the moon and sky
    for (let i = 0; i < bats.length; i++) {
      const b = bats[i];
      b.x += b.vx * dt;
      b.y += Math.sin(t * 2.5 + i) * 14 * dt + b.vy * dt;
      if (b.x > 680) b.x = -680;
      if (b.x < -680) b.x = 680;
      if (b.y < -520) b.y = -120;
      if (b.y > 120) b.y = -480;
      drawBat(b.x, b.y, b.scale, t * b.flapSpeed + b.flapPhase);
    }

    // Spooky Gothic Castle & Graveyard Hills in the distance
    ctx.fillStyle = '#120424';
    ctx.beginPath();
    ctx.moveTo(-750, 540);
    ctx.lineTo(-750, 260);
    ctx.quadraticCurveTo(-420, 150, -180, 280);
    ctx.quadraticCurveTo(180, 170, 750, 250);
    ctx.lineTo(750, 540);
    ctx.closePath();
    ctx.fill();

    // Haunted Manor Spire on left hill
    ctx.fillStyle = '#0b0218';
    ctx.beginPath();
    ctx.moveTo(-430, 240);
    ctx.lineTo(-420, 95);
    ctx.lineTo(-435, 95);
    ctx.lineTo(-400, 15);
    ctx.lineTo(-365, 95);
    ctx.lineTo(-380, 95);
    ctx.lineTo(-370, 240);
    ctx.closePath();
    ctx.fill();

    // Glowing haunted window in spire
    ctx.fillStyle = '#ff9900';
    ctx.beginPath();
    ctx.arc(-400, 130, 9, Math.PI, 0);

    ctx.lineTo(-18, 22);
    ctx.lineTo(-8, 14);
    ctx.lineTo(0, 24);
    ctx.lineTo(8, 14);
    ctx.lineTo(18, 22);
    ctx.lineTo(32, 10);
    ctx.lineTo(22, 30);
    ctx.lineTo(0, 34);
    ctx.lineTo(-22, 30);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Energy Arcs connecting Hands to the Conjured Pumpkin Core
    ctx.strokeStyle = '#00ffe5';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-110, 22);
    ctx.quadraticCurveTo(-55, -25 + Math.sin(t * 14) * 20, -48, 0);
    ctx.moveTo(110, 22);
    ctx.quadraticCurveTo(55, -25 + Math.cos(t * 14) * 20, 48, 0);
    ctx.stroke();

    ctx.restore(); // End Conjured Spell

    ctx.restore(); // End Character Transform

    // ------------------------------------------------------------------------
    // 6. TWIN FAMILIAR ORBS (Solar & Lunar Gemini Spirits Flanking the Portrait)
    // ------------------------------------------------------------------------
    const famLeftX = -310 + Math.cos(t * 1.7) * 26;
    const famLeftY = -45 + Math.sin(t * 2.3) * 32;
    drawFamiliarOrb(famLeftX, famLeftY, 44, '#00ffe5', 'rgba(0, 255, 229, 0.35)', t, false);

    const famRightX = 310 + Math.sin(t * 1.7) * 26;
    const famRightY = -45 + Math.cos(t * 2.3) * 32;
    drawFamiliarOrb(famRightX, famRightY, 44, '#ff9e00', 'rgba(255, 90, 0, 0.38)', t, true);

    // ------------------------------------------------------------------------
    // 7. FOREGROUND ANTIGRAVITY SHARDS, EMBERS & SPOOKY VIGNETTE FRAME
    // ------------------------------------------------------------------------
    for (let i = 0; i < shards.length; i++) {
      const sh = shards[i];
      const orbitA = sh.angle + t * sh.speed;
      const depth = Math.sin(orbitA);
      if (depth <= 0) continue; // Front half of orbit
      const sx = Math.cos(orbitA) * sh.radius;
      const sy = sh.baseY + Math.sin(t * sh.bobSpeed + sh.phase) * 26;
      drawShard(sx, sy, sh, t, 1.0);
    }

    // Rising Glowing Embers & Code Sparks
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.y += e.vy * dt;
      e.x += (e.vx + Math.sin(t * 2 + e.phase) * 18) * dt;
      if (e.y < -560) {
        e.y = 560;
        e.x = (Math.random() - 0.5) * 1080;
      }
      const alpha = 0.5 + 0.5 * Math.sin(t * 5 + e.phase);
      ctx.fillStyle = e.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Foreground Luminous Halloween Mist at Bottom
    const frontFogGrad = ctx.createLinearGradient(0, 340, 0, 560);
    frontFogGrad.addColorStop(0, 'rgba(18, 2, 38, 0)');
    frontFogGrad.addColorStop(0.55, 'rgba(90, 24, 154, 0.45)');
    frontFogGrad.addColorStop(1, '#090117');
    ctx.fillStyle = frontFogGrad;
    ctx.fillRect(-900, 340, 1800, 240);

    ctx.restore(); // End 1080x1080 Stage

    // Subtle Dark Vignette at Screen Edges for rich phone/desktop contrast
    const vignette = ctx.createRadialGradient(
      width / 2, height / 2, Math.min(width, height) * 0.36,
      width / 2, height / 2, Math.max(width, height) * 0.75
    );
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(4, 1, 10, 0.68)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, width, height);

    ctx.restore();
    requestAnimationFrame(render);
  }

  function drawShard(x, y, sh, t, opacity) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * sh.speed * 1.8 + sh.phase);
    ctx.globalAlpha = opacity;

    if (sh.isCrystal) {
      // Glowing multifaceted data-crystal
      ctx.fillStyle = `hsla(${sh.hue}, 100%, 62%, 0.88)`;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -sh.size * 1.4);
      ctx.lineTo(sh.size * 0.85, 0);
      ctx.lineTo(0, sh.size * 1.4);
      ctx.lineTo(-sh.size * 0.85, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else {
      // Levitating dark obsidian stone with glowing rune line
      ctx.fillStyle = '#1b0936';
      ctx.strokeStyle = `hsla(${sh.hue}, 100%, 60%, 0.9)`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-sh.size, -sh.size * 0.4);
      ctx.lineTo(0, -sh.size);
      ctx.lineTo(sh.size, -sh.size * 0.2);
      ctx.lineTo(sh.size * 0.6, sh.size * 0.9);
      ctx.lineTo(-sh.size * 0.7, sh.size * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
