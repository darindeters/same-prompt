<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #1a006e;
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });
  const CX = 540;
  const CY = 392;
  const TAU = Math.PI * 2;

  const stars = [];
  for (let i = 0; i < 180; i++) {
    stars.push({
      u: Math.random(),
      v: Math.random(),
      r: 0.6 + Math.random() * 2.1,
      p: Math.random() * TAU,
      tw: 1.2 + Math.random() * 3.2,
      c: ["#ffffff", "#ffe566", "#7af7ff", "#ff6ad5", "#ffd24a"][(Math.random() * 5) | 0]
    });
  }

  const bats = [
    { u: 0.05, v: 0.10, s: 1.15, sp: 0.055, flap: 8.5, ph: 0.2, front: false },
    { u: 0.42, v: 0.16, s: 0.85, sp: 0.07, flap: 10, ph: 1.4, front: false },
    { u: 0.78, v: 0.08, s: 1.3, sp: -0.05, flap: 7.5, ph: 2.2, front: false },
    { u: 0.22, v: 0.28, s: 0.7, sp: 0.04, flap: 11, ph: 0.6, front: false },
    { u: 0.60, v: 0.20, s: 1.0, sp: 0.062, flap: 9, ph: 3.1, front: false },
    { u: 0.15, v: 0.06, s: 0.95, sp: 0.08, flap: 12, ph: 1.1, front: true },
    { u: 0.88, v: 0.14, s: 1.2, sp: -0.046, flap: 8, ph: 2.6, front: true },
    { u: 0.50, v: 0.05, s: 0.75, sp: 0.09, flap: 13, ph: 0.4, front: true }
  ];

  const clouds = [
    { u: 0.08, v: 0.08, s: 1.35, sp: 0.008, c: "rgba(255, 70, 200, 0.28)" },
    { u: 0.46, v: 0.05, s: 1.7, sp: 0.005, c: "rgba(170, 80, 255, 0.24)" },
    { u: 0.78, v: 0.12, s: 1.15, sp: 0.01, c: "rgba(255, 130, 40, 0.20)" },
    { u: 0.28, v: 0.16, s: 1.25, sp: 0.0065, c: "rgba(90, 0, 200, 0.22)" },
    { u: 0.62, v: 0.18, s: 0.95, sp: 0.012, c: "rgba(255, 40, 140, 0.18)" }
  ];

  const leaves = [];
  for (let i = 0; i < 16; i++) {
    leaves.push({
      u: Math.random(),
      v: Math.random(),
      s: 7 + Math.random() * 8,
      sp: 0.035 + Math.random() * 0.05,
      drift: 0.4 + Math.random() * 0.8,
      rot: Math.random() * TAU,
      rs: -1.4 + Math.random() * 2.8,
      c: Math.random() < 0.5 ? "#ff6a00" : (Math.random() < 0.5 ? "#ff2f8a" : "#ffd24a")
    });
  }

  const wisps = [];
  for (let i = 0; i < 26; i++) {
    wisps.push({
      u: Math.random(),
      v: Math.random(),
      vy: 0.02 + Math.random() * 0.045,
      r: 2.2 + Math.random() * 3.6,
      p: Math.random() * TAU,
      c: Math.random() < 0.45 ? "#2dffe8" : (Math.random() < 0.5 ? "#ffb000" : "#d6ff00")
    });
  }

  const shots = [];
  const bolts = [];
  let nextLightning = 3.2;
  let nextShot = 1.4;
  let flashStart = -20;
  let dpr = 1;
  let lastNow = 0;

  function viewSize() {
    return {
      w: canvas.clientWidth || window.innerWidth,
      h: canvas.clientHeight || window.innerHeight
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const view = viewSize();
    canvas.width = Math.max(1, Math.floor(view.w * dpr));
    canvas.height = Math.max(1, Math.floor(view.h * dpr));
  }
  window.addEventListener("resize", resize);
  resize();

  function layout(w, h) {
    const scale = Math.min(w, h) / 1080;
    return {
      scale: scale,
      ox: (w - 1080 * scale) / 2,
      oy: (h - 1080 * scale) / 2
    };
  }

  function crestY(x, groundY) {
    return groundY + Math.sin(x * 0.007 + 1.2) * 18 + Math.sin(x * 0.018) * 8;
  }

  function drawSky(w, h, t) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#24008a");
    g.addColorStop(0.26, "#6a00e0");
    g.addColorStop(0.48, "#d1008c");
    g.addColorStop(0.64, "#ff3d1a");
    g.addColorStop(0.76, "#ff8a00");
    g.addColorStop(1, "#3a0668");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    const horizon = ctx.createLinearGradient(0, h * 0.55, 0, h * 0.82);
    horizon.addColorStop(0, "rgba(255, 60, 0, 0)");
    horizon.addColorStop(0.4, "rgba(255, 40, 90, 0.18)");
    horizon.addColorStop(1, "rgba(80, 0, 120, 0)");
    ctx.fillStyle = horizon;
    ctx.fillRect(0, 0, w, h);

    const pulse = 0.55 + Math.sin(t * 0.7) * 0.08;
    const wash = ctx.createRadialGradient(w * 0.5, h * 0.42, 20, w * 0.5, h * 0.5, Math.max(w, h) * 0.7);
    wash.addColorStop(0, "rgba(255, 170, 0, " + (0.16 * pulse) + ")");
    wash.addColorStop(0.45, "rgba(255, 0, 140, 0.08)");
    wash.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, w, h);
  }

  function drawStars(w, h, t) {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * s.tw + s.p));
      ctx.globalAlpha = tw;
      ctx.fillStyle = s.c;
      const x = s.u * w;
      const y = s.v * h * 0.72;
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, TAU);
      ctx.fill();
      if (s.r > 1.7 && tw > 0.7) {
        ctx.globalAlpha = (tw - 0.7) * 0.9;
        ctx.strokeStyle = s.c;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - s.r * 3, y);
        ctx.lineTo(x + s.r * 3, y);
        ctx.moveTo(x, y - s.r * 3);
        ctx.lineTo(x, y + s.r * 3);
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawMoon(x, y, r, t) {
    const breathe = 1 + Math.sin(t * 0.8) * 0.015;
    const rr = r * breathe;
    const glow = ctx.createRadialGradient(x, y, rr * 0.7, x, y, rr * 2.5);
    glow.addColorStop(0, "rgba(255, 170, 0, 0.62)");
    glow.addColorStop(0.35, "rgba(255, 40, 120, 0.20)");
    glow.addColorStop(1, "rgba(255, 40, 120, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, rr * 2.5, 0, TAU);
    ctx.fill();

    const body = ctx.createRadialGradient(x - rr * 0.32, y - rr * 0.34, rr * 0.1, x, y, rr);
    body.addColorStop(0, "#fff6cf");
    body.addColorStop(0.42, "#ffc400");
    body.addColorStop(0.78, "#ff7a00");
    body.addColorStop(1, "#ff4d00");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, rr, 0, TAU);
    ctx.fill();

    ctx.fillStyle = "rgba(190, 70, 0, 0.28)";
    const craters = [[-0.35, -0.2, 0.18], [0.28, 0.15, 0.12], [-0.1, 0.38, 0.1], [0.42, -0.36, 0.09], [-0.45, 0.32, 0.08]];
    for (let i = 0; i < craters.length; i++) {
      const c = craters[i];
      ctx.beginPath();
      ctx.arc(x + c[0] * rr, y + c[1] * rr, c[2] * rr, 0, TAU);
      ctx.fill();
    }
  }

  function drawCloud(x, y, s, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, 90 * s, 32 * s, 0, 0, TAU);
    ctx.ellipse(x + 62 * s, y + 10 * s, 64 * s, 26 * s, 0, 0, TAU);
    ctx.ellipse(x - 58 * s, y + 12 * s, 54 * s, 24 * s, 0, 0, TAU);
    ctx.ellipse(x + 16 * s, y - 16 * s, 48 * s, 22 * s, 0, 0, TAU);
    ctx.fill();
  }

  function drawClouds(w, h, t) {
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const x = ((c.u + t * c.sp) % 1.35) * w - w * 0.15;
      drawCloud(x, c.v * h, c.s * (Math.min(w, h) / 900), c.c);
    }
  }

  function drawShots(w, h, t, dt) {
    if (t > nextShot) {
      shots.push({
        u: Math.random() * 0.7,
        v: 0.02 + Math.random() * 0.28,
        vx: 0.18 + Math.random() * 0.16,
        vy: 0.05 + Math.random() * 0.06,
        life: 1
      });
      nextShot = t + 2.6 + Math.random() * 3.4;
    }
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      s.u += s.vx * dt;
      s.v += s.vy * dt;
      s.life -= dt * 0.55;
      if (s.life <= 0) {
        shots.splice(i, 1);
        continue;
      }
      const x = s.u * w;
      const y = s.v * h;
      ctx.strokeStyle = "rgba(255, 250, 220, " + Math.max(0, s.life) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - s.vx * w * 0.12, y - s.vy * h * 0.12);
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.globalAlpha = Math.max(0, s.life);
      ctx.beginPath();
      ctx.arc(x, y, 2.2, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawHill(w, groundY, h) {
    ctx.beginPath();
    ctx.moveTo(0, h);
    ctx.lineTo(0, crestY(0, groundY));
    for (let x = 0; x <= w; x += 18) {
      ctx.lineTo(x, crestY(x, groundY));
    }
    ctx.lineTo(w, h);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, groundY - 20, 0, h);
    g.addColorStop(0, "#5a12a8");
    g.addColorStop(0.25, "#2a0658");
    g.addColorStop(1, "#070010");
    ctx.fillStyle = g;
    ctx.fill();

    ctx.strokeStyle = "#7a2ec8";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = 0; x <= w; x += 18) {
      const y = crestY(x, groundY);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = "rgba(255, 80, 180, 0.35)";
    ctx.lineWidth = 2;
    for (let x = 8; x < w; x += 18) {
      const y = crestY(x, groundY);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.quadraticCurveTo(x + 4, y - 12, x + 1, y - 18 - (x % 7));
      ctx.stroke();
    }
  }

  function drawMist(w, h, groundY, t) {
    for (let i = 0; i < 4; i++) {
      const yb = groundY + 10 + i * (h - groundY) * 0.18;
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 16) {
        const y = yb + Math.sin(x * 0.01 + t * (0.35 + i * 0.12) + i * 1.7) * (14 + i * 7);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();
      ctx.fillStyle = i % 2 === 0
        ? "rgba(190, 0, 255, " + (0.07 + i * 0.015) + ")"
        : "rgba(0, 255, 210, " + (0.06 + i * 0.012) + ")";
      ctx.fill();
    }
  }

  function drawBat(x, y, sc, flap) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    const lift = Math.sin(flap);
    function wing(dir) {
      ctx.beginPath();
      ctx.moveTo(dir * 3, 0);
      ctx.quadraticCurveTo(dir * 24, -10 - lift * 16, dir * 48, -2 - lift * 24);
      ctx.lineTo(dir * 36, 4 - lift * 6);
      ctx.quadraticCurveTo(dir * 22, 8 - lift * 8, dir * 16, 3);
      ctx.quadraticCurveTo(dir * 30, 12, dir * 42, 12 + lift * 3);
      ctx.quadraticCurveTo(dir * 18, 12, dir * 4, 4);
      ctx.closePath();
      ctx.fillStyle = "#100014";
      ctx.fill();
      ctx.lineWidth = 1.4;
      ctx.strokeStyle = "rgba(230, 140, 255, 0.85)";
      ctx.stroke();
    }
    wing(-1);
    wing(1);
    ctx.fillStyle = "#140018";
    ctx.beginPath();
    ctx.ellipse(0, 1, 7, 5.5, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-3, -2);
    ctx.lineTo(-6, -11);
    ctx.lineTo(-1, -4);
    ctx.lineTo(1, -4);
    ctx.lineTo(6, -11);
    ctx.lineTo(3, -2);
    ctx.fill();
    ctx.fillStyle = "#ff3ad4";
    ctx.beginPath();
    ctx.arc(-2.2, -0.5, 1.15, 0, TAU);
    ctx.arc(2.2, -0.5, 1.15, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawBats(w, h, t, front) {
    const unit = Math.min(w, h) / 1080;
    for (let i = 0; i < bats.length; i++) {
      const b = bats[i];
      if (b.front !== front) continue;
      const x = b.u * (w + 160) - 80;
      const y = b.v * h + Math.sin(t * 1.4 + b.ph) * 10;
      drawBat(x, y, b.s * 1.15 * Math.max(0.55, unit), t * b.flap + b.ph);
    }
  }

  function updateBats(dt) {
    for (let i = 0; i < bats.length; i++) {
      const b = bats[i];
      b.u += b.sp * dt;
      if (b.u > 1.15) b.u = -0.15;
      if (b.u < -0.15) b.u = 1.15;
    }
  }

  function makeBolt(w, h) {
    const pts = [];
    let x = w * (0.18 + Math.random() * 0.64);
    let y = -8;
    pts.push({ x: x, y: y });
    while (y < h * 0.58) {
      y += 26 + Math.random() * 38;
      x += (Math.random() - 0.48) * 90;
      pts.push({ x: x, y: y });
    }
    const fork = [];
    const at = pts[Math.min(3, pts.length - 1)];
    let fx = at.x;
    let fy = at.y;
    fork.push({ x: fx, y: fy });
    const dir = Math.random() < 0.5 ? -1 : 1;
    for (let i = 0; i < 4; i++) {
      fy += 22 + Math.random() * 18;
      fx += dir * (24 + Math.random() * 36);
      fork.push({ x: fx, y: fy });
    }
    return { pts: pts, fork: fork };
  }

  function strokeChain(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  function drawBolts(t) {
    for (let i = bolts.length - 1; i >= 0; i--) {
      const b = bolts[i];
      const age = t - b.born;
      if (age > 0.42) {
        bolts.splice(i, 1);
        continue;
      }
      const alpha = 1 - age / 0.42;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(255, 50, 210, 0.7)";
      ctx.lineWidth = 10;
      strokeChain(b.pts);
      strokeChain(b.fork);
      ctx.strokeStyle = "#fff8dc";
      ctx.lineWidth = 3;
      strokeChain(b.pts);
      strokeChain(b.fork);
      ctx.restore();
    }
  }

  function drawTree(x, y, sc, t, flip) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(flip ? -sc : sc, sc);
    const sway = Math.sin(t * 0.85) * 8;
    ctx.fillStyle = "#160028";
    ctx.beginPath();
    ctx.moveTo(-14, 8);
    ctx.quadraticCurveTo(-26, -90, -6 + sway * 0.3, -230);
    ctx.lineTo(12 + sway * 0.3, -220);
    ctx.quadraticCurveTo(28, -80, 16, 8);
    ctx.fill();
    ctx.lineCap = "round";
    const limbs = [
      [-4, -200, -110, -280, 10],
      [2, -170, 90, -250, 8],
      [-2, -130, -70, -160, 7],
      [6, -100, 86, -130, 6],
      [-8, -210, -40, -300, 5]
    ];
    for (let i = 0; i < limbs.length; i++) {
      const b = limbs[i];
      const sw = Math.sin(t * 1.15 + i) * 12;
      ctx.strokeStyle = "#12001c";
      ctx.lineWidth = b[4];
      ctx.beginPath();
      ctx.moveTo(b[0], b[1]);
      ctx.quadraticCurveTo((b[0] + b[2]) / 2 + sw, (b[1] + b[3]) / 2, b[2] + sw, b[3]);
      ctx.stroke();
      ctx.strokeStyle = "rgba(150, 50, 255, 0.45)";
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawGrave(x, y, s, cross) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = "#3a0d6e";
    ctx.beginPath();
    if (cross) {
      ctx.fillRect(-6, -52, 12, 58);
      ctx.fillRect(-20, -40, 40, 10);
    } else {
      ctx.moveTo(-20, 8);
      ctx.lineTo(-20, -30);
      ctx.quadraticCurveTo(-20, -52, 0, -52);
      ctx.quadraticCurveTo(20, -52, 20, -30);
      ctx.lineTo(20, 8);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "rgba(255, 70, 170, 0.55)";
      ctx.fillRect(-10, -18, 20, 3);
      ctx.fillRect(-1.5, -26, 3, 18);
    }
    ctx.restore();
  }

  function drawWeb(x, y, r, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = "rgba(235, 200, 255, 0.7)";
    ctx.lineWidth = 1.15;
    const n = 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + 0.2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.stroke();
    }
    for (let k = 1; k <= 5; k++) {
      const rr = (r * k) / 5;
      ctx.beginPath();
      for (let i = 0; i <= n; i++) {
        const a = (i / n) * TAU + 0.2 + Math.sin(t * 0.8 + k) * 0.03;
        const px = Math.cos(a) * rr;
        const py = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    const hang = 36 + Math.sin(t * 1.35) * 8;
    const swing = Math.sin(t * 0.8) * 16;
    ctx.beginPath();
    ctx.moveTo(8, 6);
    ctx.lineTo(8 + swing, hang);
    ctx.stroke();
    drawSpider(8 + swing, hang, t);
    ctx.restore();
  }

  function drawSpider(x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    const wiggle = Math.sin(t * 7) * 0.35;
    ctx.strokeStyle = "#1a0016";
    ctx.lineWidth = 1.5;
    ctx.lineCap = "round";
    for (let i = 0; i < 4; i++) {
      const a = -1 + i * 0.48;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 8 + wiggle);
      ctx.lineTo(Math.cos(a) * 26, Math.sin(a) * 16 - 5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-Math.cos(a) * 14, Math.sin(a) * 8 - wiggle);
      ctx.lineTo(-Math.cos(a) * 26, Math.sin(a) * 16 - 5);
      ctx.stroke();
    }
    ctx.fillStyle = "#120010";
    ctx.beginPath();
    ctx.ellipse(0, 3, 7, 5.5, 0, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -3, 4, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#ff2430";
    ctx.beginPath();
    ctx.arc(-1.7, -4, 1, 0, TAU);
    ctx.arc(1.7, -4, 1, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  function drawPumpkin(x, y, sc, t, phase, simple) {
    ctx.save();
    ctx.translate(x, y + Math.sin(t * 1.2 + phase) * (simple ? 2 : 0));
    ctx.scale(sc, sc);
    const flick = 0.72 + Math.abs(Math.sin(t * 2.2 + phase)) * 0.28 * (0.82 + 0.18 * Math.sin(t * 23 + phase));
    const glow = ctx.createRadialGradient(0, 8, 8, 0, 8, 78);
    glow.addColorStop(0, "rgba(255, 150, 0, " + (0.55 * flick) + ")");
    glow.addColorStop(1, "rgba(255, 80, 0, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 8, 78, 0, TAU);
    ctx.fill();

    ctx.fillStyle = "#e23c00";
    ctx.beginPath();
    ctx.ellipse(-20, 6, 24, 34, 0, 0, TAU);
    ctx.ellipse(20, 6, 24, 34, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#ff5a00";
    ctx.beginPath();
    ctx.ellipse(0, 4, 26, 36, 0, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "#ff8a1e";
    ctx.beginPath();
    ctx.ellipse(-6, -2, 12, 28, -0.1, 0, TAU);
    ctx.fill();

    ctx.fillStyle = "#1e7a28";
    ctx.beginPath();

      if (c < 3.68) return (c - 3.52) / 0.16;

  function drawLeaves(w, h, t, dt) {
    for (let i = 0; i < leaves.length; i++) {
      const leaf = leaves[i];
      leaf.v += leaf.sp * dt;
      leaf.rot += leaf.rs * dt;
      if (leaf.v > 1.08) {
        leaf.v = -0.05;
        leaf.u = Math.random();
      }
      let lu = leaf.u + Math.sin(t * leaf.drift + i) * 0.05;
      lu = lu - Math.floor(lu);
      ctx.save();
      ctx.translate(lu * w, leaf.v * h);
      ctx.rotate(leaf.rot);
      ctx.fillStyle = leaf.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, leaf.s, leaf.s * 0.46, 0, 0, TAU);
      ctx.fill();
      ctx.strokeStyle = "rgba(90, 0, 20, 0.45)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-leaf.s, 0);
      ctx.lineTo(leaf.s, 0);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawWisps(w, h, dt, t) {
    for (let i = 0; i < wisps.length; i++) {
      const p = wisps[i];
      p.v -= p.vy * dt;
      p.u += Math.sin(t * 0.8 + p.p) * dt * 0.02;
      if (p.u < -0.08) p.u += 1;
      if (p.u > 1.08) p.u -= 1;
      if (p.v < -0.04) {
        p.v = 1.02;
        p.u = Math.random();
      }
      const x = p.u * w;
      const y = p.v * h;
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.r * 7);
      g.addColorStop(0, p.c);
      g.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.globalAlpha = 0.8;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, p.r * 7, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function frame(now) {
    if (!lastNow) lastNow = now;
    const dt = Math.min(0.033, (now - lastNow) / 1000);
    lastNow = now;
    const t = now / 1000;
    const view = viewSize();
    const w = view.w;
    const h = view.h;
    if (w < 2 || h < 2) {
      requestAnimationFrame(frame);
      return;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineJoin = "round";

    if (t > nextLightning) {
      flashStart = t;
      bolts.push(makeBolt(w, h));
      bolts[bolts.length - 1].born = t;
      if (Math.random() < 0.45) {
        const extra = makeBolt(w, h);
        extra.born = t;
        bolts.push(extra);
      }
      playThunder();
      nextLightning = t + 6.5 + Math.random() * 7.5;
    }

    updateBats(dt);
    const box = layout(w, h);
    const groundY = box.oy + 900 * box.scale;

    drawSky(w, h, t);
    drawStars(w, h, t);
    const moonX = box.ox + CX * box.scale;
    const moonY = box.oy + (CY - 6) * box.scale;
    const moonR = 210 * box.scale;
    drawMoon(moonX, moonY, moonR, t);
    drawClouds(w, h, t);
    drawShots(w, h, t, dt);
    drawHill(w, groundY, h);
    drawBats(w, h, t, false);
    drawBolts(t);

    ctx.save();
    ctx.translate(box.ox, box.oy);
    ctx.scale(box.scale, box.scale);

    drawTree(130, 930, 1.05, t, false);
    drawTree(960, 940, 1.15, t + 1.2, true);
    drawGrave(190, 900, 1.05, false);
    drawGrave(300, 928, 0.8, true);
    drawGrave(790, 918, 0.9, false);
    drawGrave(900, 888, 1.15, true);
    drawWeb(78, 36, 86, t);
    drawWeb(1010, 70, 64, t + 2);

    const shadow = ctx.createRadialGradient(CX, 1010, 10, CX, 1010, 220);
    shadow.addColorStop(0, "rgba(0, 0, 0, 0.38)");
    shadow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = shadow;
    ctx.beginPath();
    ctx.ellipse(CX, 1024, 220, 28, 0, 0, TAU);
    ctx.fill();

    drawCharacter(t);

    drawPumpkin(230, 990, 1.15, t, 0.2, false);
    drawPumpkin(345, 1020, 0.72, t, 1.4, false);
    drawPumpkin(760, 1012, 0.86, t, 2.2, false);
    drawPumpkin(900, 978, 1.25, t, 0.8, false);
    ctx.restore();

    if (w > h * 1.18) {
      const ts = h / 620;
      drawTree(70, groundY + 10, ts, t, false);
      drawTree(w - 70, groundY + 16, ts * 1.05, t + 0.8, true);
    }
    if (h > w * 1.12) {
      drawPumpkin(w * 0.22, (groundY + h) * 0.55, Math.min(w, h) / 700, t, 0.4, false);
      drawPumpkin(w * 0.78, (groundY + h) * 0.62, Math.min(w, h) / 640, t, 1.8, false);
    }

    drawMist(w, h, groundY - 10, t);
    drawLeaves(w, h, t, dt);
    drawWisps(w, h, dt, t);
    drawBats(w, h, t, true);

    const age = t - flashStart;
    let flashA = 0;
    if (age >= 0 && age < 0.09) flashA = 0.55 * (1 - age / 0.09);
    else if (age > 0.16 && age < 0.3) flashA = 0.38 * (1 - (age - 0.16) / 0.14);
    if (flashA > 0) {
      ctx.fillStyle = "rgba(255, 236, 255, " + flashA + ")";
      ctx.fillRect(0, 0, w, h);
    }

    const vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.32, w / 2, h / 2, Math.max(w, h) * 0.72);
    vig.addColorStop(0, "rgba(0, 0, 0, 0)");
    vig.addColorStop(1, "rgba(18, 0, 28, 0.42)");
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, w, h);

    requestAnimationFrame(frame);
  }

  let audioCtx = null;
  let booted = false;
  let playThunder = function () {};

  function bootAudio() {
    if (booted || !audioCtx || audioCtx.state !== "running") return;
    booted = true;
    buildGraph();
    window.removeEventListener("pointerdown", tryStartAudio);
    window.removeEventListener("keydown", tryStartAudio);
  }

  function tryStartAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      if (!audioCtx) audioCtx = new AC();
      const buf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate || 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start(0);
      const resumed = audioCtx.resume();
      if (resumed && typeof resumed.then === "function") resumed.then(bootAudio).catch(function () {});
      bootAudio();
    } catch (err) {}
  }

  function buildGraph() {
    const master = audioCtx.createGain();
    master.gain.value = 0.62;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -18;
    comp.knee.value = 16;
    comp.ratio.value = 3.5;
    comp.attack.value = 0.008;
    comp.release.value = 0.28;
    master.connect(comp);
    comp.connect(audioCtx.destination);

    const noiseLen = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
    const noiseData = noiseBuf.getChannelData(0);
    for (let i = 0; i < noiseLen; i++) noiseData[i] = Math.random() * 2 - 1;

    const wind = audioCtx.createBufferSource();
    wind.buffer = noiseBuf;
    wind.loop = true;
    const windFilter = audioCtx.createBiquadFilter();
    windFilter.type = "bandpass";
    windFilter.frequency.value = 420;
    windFilter.Q.value = 0.65;
    const windGain = audioCtx.createGain();
    windGain.gain.value = 0.11;
    wind.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(master);
    wind.start();

    const windLfo = audioCtx.createOscillator();
    windLfo.frequency.value = 0.07;
    const windLfoGain = audioCtx.createGain();
    windLfoGain.gain.value = 220;
    windLfo.connect(windLfoGain);
    windLfoGain.connect(windFilter.frequency);
    windLfo.start();

    const gust = audioCtx.createOscillator();
    gust.frequency.value = 0.045;
    const gustGain = audioCtx.createGain();
    gustGain.gain.value = 0.035;
    gust.connect(gustGain);
    gustGain.connect(windGain.gain);
    gust.start();

    function drone(freq, type, level, cutoff) {
      const o = audioCtx.createOscillator();
      o.type = type;
      o.frequency.value = freq;
      const f = audioCtx.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.value = cutoff;
      const g = audioCtx.createGain();
      g.gain.value = level;
      o.connect(f);
      f.connect(g);
      g.connect(master);
      o.start();
    }
    drone(55, "sawtooth", 0.03, 170);
    drone(82.4, "triangle", 0.04, 220);
    drone(110, "sine", 0.035, 400);

    [110, 130.81, 164.81, 220].forEach(function (freq, i) {
      const o = audioCtx.createOscillator();
      o.type = i === 0 ? "sine" : "triangle";
      o.frequency.value = freq * (1 + (i - 1.5) * 0.004);
      const g = audioCtx.createGain();
      g.gain.value = i === 3 ? 0.014 : 0.028;
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.04 + i * 0.013;
      const lg = audioCtx.createGain();
      lg.gain.value = 0.008;
      lfo.connect(lg);
      lg.connect(g.gain);
      o.connect(g);
      g.connect(master);
      o.start();
      lfo.start();
    });

    const ther = audioCtx.createOscillator();
    ther.type = "sine";
    ther.frequency.value = 392;
    const therFilter = audioCtx.createBiquadFilter();
    therFilter.type = "lowpass";
    therFilter.frequency.value = 2200;
    const therGain = audioCtx.createGain();
    therGain.gain.value = 0.0001;
    const vib = audioCtx.createOscillator();
    vib.frequency.value = 4.6;
    const vibGain = audioCtx.createGain();
    vibGain.gain.value = 7;
    vib.connect(vibGain);
    vibGain.connect(ther.frequency);
    let panner = master;
    if (typeof audioCtx.createStereoPanner === "function") {
      const pan = audioCtx.createStereoPanner();
      const panLfo = audioCtx.createOscillator();
      panLfo.frequency.value = 0.03;
      const panDepth = audioCtx.createGain();
      panDepth.gain.value = 0.55;
      panLfo.connect(panDepth);
      panDepth.connect(pan.pan);
      pan.connect(master);
      panLfo.start();
      panner = pan;
    }
    ther.connect(therFilter);
    therFilter.connect(therGain);
    therGain.connect(panner);
    ther.start();
    vib.start();

    const scale = [293.66, 311.13, 349.23, 392, 415.3, 466.16, 523.25, 587.33, 622.25, 698.46];
    function scheduleMelody() {
      const time = audioCtx.currentTime + 0.05;
      const freq = scale[(Math.random() * scale.length) | 0];
      ther.frequency.cancelScheduledValues(time);
      ther.frequency.setValueAtTime(Math.max(80, ther.frequency.value || 392), time);
      ther.frequency.linearRampToValueAtTime(freq, time + 0.5);
      therGain.gain.cancelScheduledValues(time);
      therGain.gain.setValueAtTime(Math.max(0.0001, therGain.gain.value || 0.0001), time);
      therGain.gain.linearRampToValueAtTime(0.05, time + 0.32);
      therGain.gain.linearRampToValueAtTime(0.012, time + 1.5);
      therGain.gain.linearRampToValueAtTime(0.0001, time + 2.4);
      setTimeout(scheduleMelody, 1900 + Math.random() * 1700);
    }
    scheduleMelody();

    function thump(time, freq, peak) {
      const o = audioCtx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(freq, time);
      o.frequency.exponentialRampToValueAtTime(32, time + 0.22);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(peak, time + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.26);
      o.connect(g);
      g.connect(master);
      o.start(time);
      o.stop(time + 0.28);
    }
    function scheduleHeart() {
      const time = audioCtx.currentTime + 0.02;
      thump(time, 64, 0.28);
      thump(time + 0.16, 48, 0.18);
      setTimeout(scheduleHeart, 1500 + Math.random() * 500);
    }
    scheduleHeart();

    function flutter(time) {
      const dur = 0.045;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass";
      bp.frequency.value = 1600 + Math.random() * 1800;
      bp.Q.value = 5;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.09, time + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      src.connect(bp);
      bp.connect(g);
      g.connect(master);
      src.start(time, Math.random());
      src.stop(time + dur + 0.02);
    }
    function scheduleBats() {
      const time = audioCtx.currentTime + 0.02;
      const count = 2 + ((Math.random() * 3) | 0);
      for (let i = 0; i < count; i++) flutter(time + i * 0.07);
      setTimeout(scheduleBats, 2200 + Math.random() * 3800);
    }
    scheduleBats();

    function hoot(time, freq) {
      const o = audioCtx.createOscillator();
      o.type = "sine";
      o.frequency.setValueAtTime(freq, time);
      o.frequency.exponentialRampToValueAtTime(freq * 0.86, time + 0.28);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.055, time + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.36);
      o.connect(g);
      g.connect(master);
      o.start(time);
      o.stop(time + 0.4);
    }
    function scheduleOwl() {
      const time = audioCtx.currentTime + 0.05;
      hoot(time, 640);
      hoot(time + 0.42, 510);
      setTimeout(scheduleOwl, 8000 + Math.random() * 7000);
    }
    setTimeout(scheduleOwl, 1800);

    function chimeAt(time) {
      const freqs = [880, 1174.66, 1318.51, 1567.98, 1760];
      const freq = freqs[(Math.random() * freqs.length) | 0];
      const o = audioCtx.createOscillator();
      o.type = "sine";
      o.frequency.value = freq;
      const o2 = audioCtx.createOscillator();
      o2.type = "triangle";
      o2.frequency.value = freq * 2.01;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.05, time + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 1.5);
      const g2 = audioCtx.createGain();
      g2.gain.value = 0.22;
      o.connect(g);
      o2.connect(g2);
      g2.connect(g);
      g.connect(master);
      o.start(time);
      o2.start(time);
      o.stop(time + 1.55);
      o2.stop(time + 1.55);
    }
    function scheduleChime() {
      chimeAt(audioCtx.currentTime + 0.02);
      setTimeout(scheduleChime, 2100 + Math.random() * 3200);
    }
    chimeAt(audioCtx.currentTime + 0.25);
    setTimeout(scheduleChime, 1600);

    function spark(time) {
      const dur = 0.03 + Math.random() * 0.05;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      const hp = audioCtx.createBiquadFilter();
      hp.type = "highpass";
      hp.frequency.value = 1800 + Math.random() * 3200;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.035, time + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      src.connect(hp);
      hp.connect(g);
      g.connect(master);
      src.start(time, Math.random());
      src.stop(time + dur + 0.02);
    }
    function scheduleCrackle() {
      const base = audioCtx.currentTime + 0.02;
      const n = 2 + ((Math.random() * 3) | 0);
      for (let i = 0; i < n; i++) spark(base + i * 0.05);
      setTimeout(scheduleCrackle, 420 + Math.random() * 900);
    }
    scheduleCrackle();

    playThunder = function () {
      if (!booted || !audioCtx) return;
      const time = audioCtx.currentTime + 0.01;
      const src = audioCtx.createBufferSource();
      src.buffer = noiseBuf;
      src.loop = true;
      const f = audioCtx.createBiquadFilter();
      f.type = "lowpass";
      f.frequency.setValueAtTime(900, time);
      f.frequency.exponentialRampToValueAtTime(45, time + 1.7);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.42, time + 0.04);
      g.gain.exponentialRampToValueAtTime(0.08, time + 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 2.1);
      src.connect(f);
      f.connect(g);
      g.connect(master);
      src.start(time);
      src.stop(time + 2.15);

      const rumble = audioCtx.createOscillator();
      rumble.type = "sine";
      rumble.frequency.setValueAtTime(70, time);
      rumble.frequency.exponentialRampToValueAtTime(28, time + 1.4);
      const rg = audioCtx.createGain();
      rg.gain.setValueAtTime(0.0001, time);
      rg.gain.exponentialRampToValueAtTime(0.2, time + 0.05);
      rg.gain.exponentialRampToValueAtTime(0.0001, time + 1.6);
      rumble.connect(rg);
      rg.connect(master);
      rumble.start(time);
      rumble.stop(time + 1.65);
    };
  }

  window.addEventListener("pointerdown", tryStartAudio);
  window.addEventListener("keydown", tryStartAudio);
  tryStartAudio();
  requestAnimationFrame(frame);
})();
</script>
