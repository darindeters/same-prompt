<script>
(() => {
 'use strict';
 const canvas=document.getElementById('atmosphere'),ctx=canvas.getContext('2d');
 let w=0,h=0,dpr=1;
 const stars=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.5,p:Math.random()*Math.PI*2,s:.2+Math.random()*.6}));
 function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
 addEventListener('resize',resize);resize();
 function draw(ms){const t=ms*.001;ctx.fillStyle='#140a38';ctx.fillRect(0,0,w,h);const scale=Math.max(w,h);let g=ctx.createRadialGradient(w*.2,h*.2,0,w*.2,h*.2,scale*.8);g.addColorStop(0,'#342081');g.addColorStop(1,'#140a38');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);g=ctx.createRadialGradient(w*.95,h*.75,0,w*.95,h*.75,scale*.65);g.addColorStop(0,'#5e154f');g.addColorStop(1,'#5e154f00');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const s of stars){const x=(s.x*w+Math.sin(t*.08+s.p)*12+w)%w,y=(s.y*h-t*s.s*4%h+h)%h;ctx.globalAlpha=.2+.5*(.5+.5*Math.sin(t*s.s+s.p));ctx.fillStyle=s.p>3?'#69ffdc':'#ba9aff';ctx.beginPath();ctx.arc(x,y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(draw)}
 requestAnimationFrame(draw);
 // A warm, curious six-note greeting: glass over a quiet human-like hum.
 let audio,master,started=false,timer;
 function tone(freq,time,duration,level,pan){const gain=audio.createGain(),osc=audio.createOscillator(),overtone=audio.createOscillator(),overGain=audio.createGain(),panner=audio.createStereoPanner();osc.type='sine';osc.frequency.value=freq;overtone.type='sine';overtone.frequency.value=freq*2.003;overGain.gain.value=.17;panner.pan.value=pan;gain.gain.setValueAtTime(0,time);gain.gain.linearRampToValueAtTime(level,time+.035);gain.gain.exponentialRampToValueAtTime(.0001,time+duration);osc.connect(gain);overtone.connect(overGain);overGain.connect(gain);gain.connect(panner);panner.connect(master);panner.connect(echo);osc.start(time);overtone.start(time);osc.stop(time+duration+.1);overtone.stop(time+duration+.1);osc.onended=()=>{osc.disconnect();overtone.disconnect();overGain.disconnect();gain.disconnect();panner.disconnect()}}
 let echo;
 function phrase(){if(audio.state!=='running')return;const now=audio.currentTime+.08;[261.6256,391.9954,523.2511,659.2551,587.3295,783.9909].forEach((f,i)=>tone(f,now+i*.26,2.8,i===5?.065:.085,(i-2.5)*.16));[130.8128,195.9977,329.6276].forEach((f,i)=>tone(f,now+i*.08,5,.028,0))}
 async function start(){try{if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=.52;const compressor=audio.createDynamicsCompressor();master.connect(compressor);compressor.connect(audio.destination);echo=audio.createDelay(1);echo.delayTime.value=.38;const feedback=audio.createGain(),wet=audio.createGain();feedback.gain.value=.28;wet.gain.value=.22;echo.connect(feedback);feedback.connect(echo);echo.connect(wet);wet.connect(master)}await audio.resume();if(audio.state==='running'&&!started){started=true;phrase();timer=setInterval(phrase,16000);removeEventListener('pointerdown',start);removeEventListener('keydown',start)}}catch(e){/* Browsers without audio still display the portrait. */}}
 addEventListener('pointerdown',start);addEventListener('keydown',start);start();
 addEventListener('pagehide',()=>{clearInterval(timer);if(audio)audio.close()});
})();
</script>
