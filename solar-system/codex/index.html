<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030411">
<title>Solar System</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030411; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas aria-label="An animated solar system with the Sun and all eight planets orbiting in a field of stars." role="img"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;
  let width, height, dpr, unit, sky;
  let seed = 8217;
  const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const stars = Array.from({length: 1000}, () => ({x: random(), y: random(), r: .25 + random() * 1.2, a: .2 + random() * .7, phase: random() * TAU}));
  const planets = [
    {name:'Mercury', orbit:88, size:4.5, speed:.36, phase:.5, color:'#b7a69d', type:0},
    {name:'Venus', orbit:122, size:8.5, speed:.265, phase:2.6, color:'#ffcb70', type:1},
    {name:'Earth', orbit:161, size:10, speed:.205, phase:4.1, color:'#339fff', type:2},
    {name:'Mars', orbit:202, size:7, speed:.166, phase:5.7, color:'#ff683b', type:3},
    {name:'Jupiter', orbit:264, size:25, speed:.094, phase:3.2, color:'#ffbd83', type:4},
    {name:'Saturn', orbit:333, size:21, speed:.069, phase:.7, color:'#ffe0a2', type:5},
    {name:'Uranus', orbit:401, size:14, speed:.048, phase:4.9, color:'#6af7eb', type:6},
    {name:'Neptune', orbit:466, size:14, speed:.038, phase:2, color:'#447bff', type:7}
  ];
  // Distances and sizes are composed for visibility rather than to physical scale.
  function noise(x,y,z=0) {
    return (Math.sin(x*2.7 + Math.sin(y*3.4+z)*1.8) + Math.sin(y*5.1-z*2+Math.cos(x*3.2))* .5 + Math.sin(x*11.3+y*7.1+z)*.22)/1.72;
  }
  function globe(p) {
    const s = 128, c = document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d'), data=g.createImageData(s,s);
    for (let y=0;y<s;y++) for(let x=0;x<s;x++) {
      const nx=(x+.5-s/2)/(s/2), ny=(y+.5-s/2)/(s/2), rr=nx*nx+ny*ny;
      if(rr>1) continue;
      const nz=Math.sqrt(1-rr), lon=Math.atan2(nx,nz), lat=Math.asin(ny);
      const n=noise(lon*2,lat*3,1.4), grain=noise(lon*19,lat*24,2);
      let rgb;
      if(p.type===0) { const v=137+n*43+grain*20; rgb=[v*1.08,v,v*.94]; }
      if(p.type===1) { const v=noise(lon*2+lat*4,lat*9); rgb=[246+v*9,180+v*36,82+v*39]; }
      if(p.type===2) {
        const land=noise(lon*2.1+.7,lat*2.8,3.1)+noise(lon*5,lat*6,1)*.22;
        rgb=land>.12 ? [37+land*50,133+land*55,73+land*18] : [12,83+n*24,193+n*40];
        const cloud=noise(lon*3+lat*3,lat*8,5);
        if(cloud>.43) {const a=(cloud-.43)*1.2; rgb=rgb.map(v=>v*(1-a)+255*a);}
        if(Math.abs(lat)>1.15+n*.1) rgb=[220,246,255];
      }
      if(p.type===3) rgb=[215+n*42+grain*9,79+n*31,39+n*20];
      if(p.type===4) {
        const band=Math.sin(lat*37+Math.sin(lon*5+lat*9)*.6)+Math.sin(lat*73)*.3;
        rgb=[222+band*21,161+band*36,110+band*35];
        const spot=Math.pow((lon-.37)/.34,2)+Math.pow((lat-.32)/.15,2);
        if(spot<1) rgb=[194+spot*25,77+spot*35,45+spot*25];
      }
      if(p.type===5) { const b=Math.sin(lat*43+Math.sin(lon*3)*.3); rgb=[230+b*14,194+b*17,131+b*24]; }
      if(p.type===6) {const b=Math.sin(lat*24)*3; rgb=[84+b,219+b,223+b];}
      if(p.type===7) {const b=Math.sin(lat*26+Math.sin(lon*4)*.3); rgb=[36+b*8,90+b*15,232+b*16];}
      const limb=.65+.35*nz, i=(y*s+x)*4;
      data.data[i]=rgb[0]*limb; data.data[i+1]=rgb[1]*limb; data.data[i+2]=rgb[2]*limb;
      data.data[i+3]=Math.min(1,(1-Math.sqrt(rr))*s)*255;
    }
    g.putImageData(data,0,0); return c;
  }
  planets.forEach(p=>p.texture=globe(p));
  const dust=Array.from({length:500},()=>({a:random()*TAU,r:222+random()*14,h:(random()-.5)*5,s:random()*.8+.25}));
  function resize() {
    width=innerWidth; height=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
    unit=Math.min(width,height)/1080;
    sky=document.createElement('canvas'); sky.width=canvas.width; sky.height=canvas.height;
    const g=sky.getContext('2d'); g.scale(dpr,dpr); g.fillStyle='#030411';g.fillRect(0,0,width,height);
    for(const neb of [[.2,.35,.5,'#181447'],[.78,.65,.42,'#072b3c'],[.55,.8,.3,'#171037']]) {
      const r=Math.max(width,height)*neb[2], grad=g.createRadialGradient(width*neb[0],height*neb[1],0,width*neb[0],height*neb[1],r);
      grad.addColorStop(0,neb[3]);grad.addColorStop(1,'#03041100');g.fillStyle=grad;g.fillRect(0,0,width,height);
    }
    for(const s of stars) {g.globalAlpha=s.a;g.fillStyle=s.phase>4?'#97caff':'#f4edff';g.beginPath();g.arc(s.x*width,s.y*height,s.r*Math.max(.65,unit),0,TAU);g.fill();}
    g.globalAlpha=1;
  }
  addEventListener('resize',resize);resize();
  let yaw, tilt;
  function project(x,y,z=0) {
    const xx=x*Math.cos(yaw)-y*Math.sin(yaw), yy=x*Math.sin(yaw)+y*Math.cos(yaw);
    return {x:xx, y:yy*Math.sin(tilt)-z*Math.cos(tilt), z:yy*Math.cos(tilt)+z*Math.sin(tilt)};
  }
  function orbit(p,t) {const a=p.phase+t*p.speed;return project(Math.cos(a)*p.orbit,Math.sin(a)*p.orbit,Math.sin(a*2+p.phase)*p.orbit*.015);}
  function ring(p,pos,front) {
    ctx.lineWidth=.65;
    for(let r=p.size*1.36;r<p.size*2.19;r+=.64) {
      const gap=r/p.size;
      if(gap>1.85 && gap<1.96)continue;
      const opacity=.38+.22*Math.sin(r*3.2);
      ctx.strokeStyle=`rgba(245,211,154,${opacity})`;
      ctx.beginPath();let pen=false;
      for(let i=0;i<=160;i++) {
        const a=i/160*TAU, v=project(Math.cos(a)*r,Math.sin(a)*r*.92,Math.sin(a)*r*.38);
        if((v.z>0)===front) {if(!pen)ctx.moveTo(pos.x+v.x,pos.y+v.y);else ctx.lineTo(pos.x+v.x,pos.y+v.y);pen=true;}else pen=false;
      }
      ctx.stroke();
    }
  }
  function planet(p,pos) {
    const r=p.size;
    if(p.type===5)ring(p,pos,false);
    ctx.save();ctx.translate(pos.x,pos.y);
    if(p.type===2 || p.type>5) {
      const halo=ctx.createRadialGradient(0,0,r*.85,0,0,r*1.24);
      halo.addColorStop(0,p.color+'70');halo.addColorStop(1,p.color+'00');
      ctx.fillStyle=halo;ctx.beginPath();ctx.arc(0,0,r*1.24,0,TAU);ctx.fill();
    }
    ctx.drawImage(p.texture,-r,-r,r*2,r*2);
    const angle=Math.atan2(-pos.y,-pos.x), lx=Math.cos(angle),ly=Math.sin(angle);
    ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.clip();
    const shade=ctx.createLinearGradient(lx*r,ly*r,-lx*r,-ly*r);
    shade.addColorStop(0,'rgba(255,238,186,.13)');shade.addColorStop(.4,'rgba(0,2,18,.03)');shade.addColorStop(.72,'rgba(0,2,18,.45)');shade.addColorStop(1,'rgba(0,2,18,.91)');
    ctx.fillStyle=shade;ctx.fillRect(-r,-r,r*2,r*2);ctx.restore();ctx.restore();
    if(p.type===5)ring(p,pos,true);
  }
  function sun(t) {
    const r=40;
    ctx.globalCompositeOperation='screen';
    const glow=ctx.createRadialGradient(0,0,r*.6,0,0,140);
    glow.addColorStop(0,'#ffcf69a0');glow.addColorStop(.25,'#ff871b50');glow.addColorStop(.55,'#ff4d1415');glow.addColorStop(1,'#ff440000');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,140,0,TAU);ctx.fill();
    for(let i=0;i<65;i++) {
      const a=i/65*TAU+t*.025, inner=r-3, outer=r+5+Math.sin(i*7.3+t*1.1)*3;
      ctx.strokeStyle='rgba(255,155,26,.22)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);ctx.quadraticCurveTo(Math.cos(a+.04)*(outer+5),Math.sin(a+.04)*(outer+5),Math.cos(a+.09)*inner,Math.sin(a+.09)*inner);ctx.stroke();
    }
    ctx.globalCompositeOperation='source-over';
    const body=ctx.createRadialGradient(-12,-14,1,0,0,r);
    body.addColorStop(0,'#ffffdf');body.addColorStop(.42,'#fff18a');body.addColorStop(.8,'#ffc12b');body.addColorStop(1,'#ff8e13');
    ctx.fillStyle=body;ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fill();
    ctx.save();ctx.beginPath();ctx.arc(0,0,r-1,0,TAU);ctx.clip();
    for(let i=0;i<95;i++) {
      const a=i*2.39996, rad=Math.sqrt(i/95)*r, x=Math.cos(a+t*.025)*rad,y=Math.sin(a+t*.025)*rad;
      ctx.fillStyle=`rgba(255,116,12,${.04+.04*Math.sin(i+t)})`;ctx.beginPath();ctx.ellipse(x,y,2.8,1.4,a,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  const start=performance.now();
  function frame(now) {
    const t=(now-start)/1000;
    yaw=.12+Math.sin(t*.035)*.13;tilt=.68+Math.sin(t*.028)*.075;
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.drawImage(sky,0,0,width,height);
    ctx.save();ctx.translate(width/2+Math.sin(t*.041)*5*unit,height/2+Math.cos(t*.033)*9*unit);ctx.scale(unit,unit);
    // The orbital plane turns gently under a drifting, inclined camera.
    for(const p of planets) {
      ctx.beginPath();for(let i=0;i<=180;i++) {const a=i/180*TAU,v=project(Math.cos(a)*p.orbit,Math.sin(a)*p.orbit);if(i===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);}
      ctx.strokeStyle=p.type>5?'rgba(91,142,213,.18)':'rgba(144,166,207,.19)';ctx.lineWidth=.85;ctx.stroke();
      const a=p.phase+t*p.speed;ctx.beginPath();
      for(let i=0;i<=50;i++) {const q=a-.42+i/50*.42,v=project(Math.cos(q)*p.orbit,Math.sin(q)*p.orbit);if(i===0)ctx.moveTo(v.x,v.y);else ctx.lineTo(v.x,v.y);}
      ctx.strokeStyle=p.color+'45';ctx.lineWidth=1.5;ctx.stroke();
    }
    for(const d of dust) {const a=d.a+t*.025,v=project(Math.cos(a)*d.r,Math.sin(a)*d.r,d.h);ctx.fillStyle='rgba(167,177,211,.3)';ctx.fillRect(v.x,v.y,d.s,d.s);}
    const bodies=planets.map(p=>({p,pos:orbit(p,t)}));
    bodies.push({p:null,pos:{x:0,y:0,z:0}});bodies.sort((a,b)=>a.pos.z-b.pos.z);
    for(const b of bodies) {if(b.p)planet(b.p,b.pos);else sun(t);}
    ctx.restore();requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
