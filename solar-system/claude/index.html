<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solar System</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04020c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  'use strict';

  var cv = document.getElementById('c');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1, minD = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    minD = Math.min(W, H);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- small vector helpers ---------- */
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function norm(a) { var l = Math.sqrt(dot(a, a)) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
  function rgba(c, a) { return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
  function scaleC(c, k) { return [Math.min(255, c[0] * k), Math.min(255, c[1] * k), Math.min(255, c[2] * k)]; }

  /* seeded random so the sky is stable between loads */
  var seed = 1337;
  function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
  function gauss() { return (rnd() + rnd() + rnd() - 1.5) * 1.6; }

  /* ---------- stars & nebulae (directions on a far sphere) ---------- */
  var stars = [];
  var mwN = norm([0.35, 0.78, 0.52]);               /* Milky Way plane normal */
  var mwU = norm(cross(mwN, [1, 0, 0])), mwV = cross(mwN, mwU);
  var tints = [[255, 255, 255], [200, 220, 255], [255, 230, 190], [255, 200, 200], [190, 255, 240]];
  var i, d;
  for (i = 0; i < 520; i++) {
    var z = rnd() * 2 - 1, ph = rnd() * Math.PI * 2, rr = Math.sqrt(1 - z * z);
    stars.push({ d: [rr * Math.cos(ph), z, rr * Math.sin(ph)], s: 0.6 + rnd() * 1.4, b: 0.35 + rnd() * 0.65, tw: 1 + rnd() * 3, p: rnd() * 7, c: tints[(rnd() * tints.length) | 0] });
  }
  for (i = 0; i < 1100; i++) {
    var ang = rnd() * Math.PI * 2, off = gauss() * 0.16;
    d = norm([mwU[0] * Math.cos(ang) + mwV[0] * Math.sin(ang) + mwN[0] * off,
              mwU[1] * Math.cos(ang) + mwV[1] * Math.sin(ang) + mwN[1] * off,
              mwU[2] * Math.cos(ang) + mwV[2] * Math.sin(ang) + mwN[2] * off]);
    stars.push({ d: d, s: 0.4 + rnd() * 0.9, b: 0.15 + rnd() * 0.45, tw: 1 + rnd() * 3, p: rnd() * 7, c: tints[(rnd() * tints.length) | 0] });
  }
  var nebulae = [
    { d: norm([mwU[0] * 0.9 + mwV[0] * 0.4, mwU[1] * 0.9 + mwV[1] * 0.4, mwU[2] * 0.9 + mwV[2] * 0.4]), c: [200, 60, 255], r: 0.45 },
    { d: norm([-mwU[0] * 0.5 + mwV[0] * 0.85, -mwU[1] * 0.5 + mwV[1] * 0.85, -mwU[2] * 0.5 + mwV[2] * 0.85]), c: [40, 200, 255], r: 0.38 },
    { d: norm([-mwU[0] * 0.8 - mwV[0] * 0.6, -mwU[1] * 0.8 - mwV[1] * 0.6, -mwU[2] * 0.8 - mwV[2] * 0.6]), c: [255, 90, 140], r: 0.4 },
    { d: norm([mwU[0] * 0.2 - mwV[0] * 0.95, mwU[1] * 0.2 - mwV[1] * 0.95, mwU[2] * 0.2 - mwV[2] * 0.95]), c: [80, 120, 255], r: 0.5 }
  ];

  /* ---------- the bodies ---------- */
  var SUN_R = 0.62;
  var planets = [
    { a: 1.15, r: 0.078, c: [205, 165, 140], hi: [255, 235, 210], inc: 0.07, ph: 0.3 },
    { a: 1.62, r: 0.13,  c: [255, 185, 60],  hi: [255, 248, 190], inc: 0.03, ph: 2.1 },
    { a: 2.15, r: 0.14,  c: [25, 110, 255],  hi: [150, 225, 255], inc: 0.0,  ph: 4.0, earth: true, moon: true },
    { a: 2.7,  r: 0.1,   c: [255, 85, 30],   hi: [255, 200, 130], inc: 0.04, ph: 1.2 },
    { a: 3.85, r: 0.37,  c: [245, 165, 95],  hi: [255, 240, 200], inc: 0.02, ph: 5.2,
      bands: [[-0.62, 0.05, [230, 120, 60], 0.55], [-0.3, 0.07, [200, 90, 40], 0.7], [-0.12, 0.03, [255, 245, 215], 0.6], [0.08, 0.06, [215, 100, 45], 0.75], [0.3, 0.04, [255, 240, 210], 0.55], [0.5, 0.06, [225, 115, 55], 0.6], [0.72, 0.04, [200, 95, 45], 0.45]],
      spot: true },
    { a: 4.95, r: 0.32,  c: [255, 215, 120], hi: [255, 250, 210], inc: 0.04, ph: 3.3, ring: true,
      bands: [[-0.5, 0.06, [235, 180, 90], 0.45], [-0.2, 0.05, [255, 240, 190], 0.5], [0.1, 0.07, [230, 175, 85], 0.5], [0.4, 0.05, [250, 230, 170], 0.45], [0.65, 0.05, [220, 165, 85], 0.4]] },
    { a: 5.95, r: 0.21,  c: [60, 235, 240],  hi: [210, 255, 255], inc: 0.02, ph: 0.9, bands: [[0.1, 0.1, [120, 250, 250], 0.35]] },
    { a: 6.85, r: 0.2,   c: [45, 85, 255],   hi: [160, 200, 255], inc: 0.03, ph: 2.7, bands: [[-0.25, 0.07, [20, 50, 200], 0.5], [0.3, 0.05, [140, 170, 255], 0.35]] }
  ];
  var EARTH_W = 2 * Math.PI / 11;                       /* Earth: one orbit per 11 s */
  for (i = 0; i < planets.length; i++) planets[i].w = EARTH_W * Math.pow(2.15 / planets[i].a, 1.5);

  var continents = [[0.3, 0.55, 0.22, 0.3], [0.9, 0.1, 0.22, 0.35], [1.3, -0.6, 0.14, 0.2], [2.6, 0.5, 0.35, 0.28], [3.4, -0.25, 0.3, 0.3], [4.4, 0.3, 0.42, 0.25], [5.2, -0.8, 0.2, 0.14], [-0.6, 1.3, 0.5, 0.1], [0, -1.35, 0.6, 0.1]];

  var ringTilt = 0.47;
  var ringU = [1, 0, 0], ringV = [0, Math.sin(ringTilt), Math.cos(ringTilt)];
  var ringBands = [[1.3, 1.52, [255, 235, 180], 0.5], [1.56, 1.98, [255, 215, 140], 0.85], [2.02, 2.16, [240, 200, 130], 0.55], [2.2, 2.32, [230, 190, 120], 0.35]];

  /* ---------- camera ---------- */
  function camera(t) {
    var az = t * 0.045;
    var el = 0.6 + 0.15 * Math.sin(t * 0.021 + 1.0);
    var D = 18 + 2 * Math.sin(t * 0.016);
    var pos = [D * Math.cos(el) * Math.sin(az), D * Math.sin(el), D * Math.cos(el) * Math.cos(az)];
    var tgt = [0.35 * Math.sin(t * 0.013), 0, 0.35 * Math.cos(t * 0.011)];
    var fw = norm(sub(tgt, pos));
    var rt = norm(cross(fw, [0, 1, 0]));
    var up = cross(rt, fw);
    return { pos: pos, fw: fw, rt: rt, up: up, f: minD * 1.0 };
  }
  function proj(C, p) {
    var d = sub(p, C.pos);
    var z = dot(d, C.fw);
    var s = C.f / Math.max(z, 0.05);
    return { x: W / 2 + dot(d, C.rt) * s, y: H / 2 - dot(d, C.up) * s, z: z, s: s };
  }

  /* ---------- drawing ---------- */
  function drawSky(C, t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#07031a'); g.addColorStop(0.5, '#040210'); g.addColorStop(1, '#09031c');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var k, n, nx, ny, nz;
    for (k = 0; k < nebulae.length; k++) {
      n = nebulae[k]; nz = dot(n.d, C.fw); if (nz < 0.2) continue;
      nx = W / 2 + dot(n.d, C.rt) / nz * C.f; ny = H / 2 - dot(n.d, C.up) / nz * C.f;
      var R = n.r * C.f / nz;
      var ng = ctx.createRadialGradient(nx, ny, 0, nx, ny, R);
      ng.addColorStop(0, rgba(n.c, 0.22)); ng.addColorStop(0.5, rgba(n.c, 0.08)); ng.addColorStop(1, rgba(n.c, 0));
      ctx.fillStyle = ng; ctx.fillRect(nx - R, ny - R, R * 2, R * 2);
    }
    for (k = 0; k < stars.length; k++) {
      var s = stars[k]; nz = dot(s.d, C.fw); if (nz < 0.12) continue;
      nx = W / 2 + dot(s.d, C.rt) / nz * C.f; ny = H / 2 - dot(s.d, C.up) / nz * C.f;
      if (nx < -2 || ny < -2 || nx > W + 2 || ny > H + 2) continue;
      var b = s.b * (0.75 + 0.25 * Math.sin(t * s.tw + s.p));
      ctx.fillStyle = rgba(s.c, b);
      var sz = s.s * (minD / 900 + 0.4);
      ctx.fillRect(nx - sz / 2, ny - sz / 2, sz, sz);
    }
  }

  function drawSun(q, t) {
    var r = SUN_R * q.s;
    var pulse = 1 + 0.03 * Math.sin(t * 1.7) + 0.02 * Math.sin(t * 2.9 + 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var halo = ctx.createRadialGradient(q.x, q.y, r * 0.6, q.x, q.y, r * 5 * pulse);
    halo.addColorStop(0, 'rgba(255,170,40,0.55)');
    halo.addColorStop(0.25, 'rgba(255,110,20,0.22)');
    halo.addColorStop(0.6, 'rgba(255,60,30,0.06)');
    halo.addColorStop(1, 'rgba(255,40,40,0)');
    ctx.fillStyle = halo; ctx.fillRect(q.x - r * 5.2, q.y - r * 5.2, r * 10.4, r * 10.4);
    /* soft rays */
    var k, nRays = 14;
    for (k = 0; k < nRays; k++) {
      var a = k / nRays * Math.PI * 2 + t * 0.08;
      var len = r * (2.2 + 0.9 * Math.sin(t * 0.9 + k * 1.7));
      var rg = ctx.createLinearGradient(q.x, q.y, q.x + Math.cos(a) * len, q.y + Math.sin(a) * len);
      rg.addColorStop(0, 'rgba(255,200,80,0.18)'); rg.addColorStop(1, 'rgba(255,120,30,0)');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.moveTo(q.x + Math.cos(a + 0.09) * r * 0.9, q.y + Math.sin(a + 0.09) * r * 0.9);
      ctx.lineTo(q.x + Math.cos(a) * len, q.y + Math.sin(a) * len);
      ctx.lineTo(q.x + Math.cos(a - 0.09) * r * 0.9, q.y + Math.sin(a - 0.09) * r * 0.9);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    var g = ctx.createRadialGradient(q.x - r * 0.15, q.y - r * 0.15, 0, q.x, q.y, r);
    g.addColorStop(0, '#fffde8'); g.addColorStop(0.3, '#ffe25a'); g.addColorStop(0.7, '#ff9a1a'); g.addColorStop(1, '#ff4d12');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
    /* granulation shimmer */
    ctx.save(); ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    for (k = 0; k < 7; k++) {
      var bx = q.x + Math.cos(t * 0.3 + k * 2.1) * r * 0.55, by = q.y + Math.sin(t * 0.23 + k * 1.3) * r * 0.55;
      var bg = ctx.createRadialGradient(bx, by, 0, bx, by, r * 0.45);
      bg.addColorStop(0, 'rgba(255,240,180,0.25)'); bg.addColorStop(1, 'rgba(255,200,100,0)');
      ctx.fillStyle = bg; ctx.fillRect(bx - r * 0.45, by - r * 0.45, r * 0.9, r * 0.9);
    }
    ctx.restore();
  }

  function ringPath(C, center, R1, R2, a0, a1) {
    var n = 40, k, a, p;
    ctx.beginPath();
    for (k = 0; k <= n; k++) {
      a = a0 + (a1 - a0) * k / n;
      p = proj(C, [center[0] + R2 * (Math.cos(a) * ringU[0] + Math.sin(a) * ringV[0]), center[1] + R2 * (Math.cos(a) * ringU[1] + Math.sin(a) * ringV[1]), center[2] + R2 * (Math.cos(a) * ringU[2] + Math.sin(a) * ringV[2])]);
      if (k === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    for (k = n; k >= 0; k--) {
      a = a0 + (a1 - a0) * k / n;
      p = proj(C, [center[0] + R1 * (Math.cos(a) * ringU[0] + Math.sin(a) * ringV[0]), center[1] + R1 * (Math.cos(a) * ringU[1] + Math.sin(a) * ringV[1]), center[2] + R1 * (Math.cos(a) * ringU[2] + Math.sin(a) * ringV[2])]);
      ctx.lineTo(p.x, p.y);
    }
    ctx.closePath();
  }
  function drawRings(C, pl, pos3, back) {
    var phi = Math.atan2(dot(ringV, C.fw), dot(ringU, C.fw));
    var a0 = back ? phi - Math.PI / 2 : phi + Math.PI / 2, a1 = a0 + Math.PI;
    var k, L = norm(sub([0, 0, 0], pos3));
    var lit = 0.6 + 0.4 * Math.abs(dot(L, [ -Math.sin(ringTilt) * 0, Math.cos(ringTilt), -Math.sin(ringTilt)]));
    for (k = 0; k < ringBands.length; k++) {
      var b = ringBands[k];
      ringPath(C, pos3, pl.r * b[0], pl.r * b[1], a0, a1);
      ctx.fillStyle = rgba(scaleC(b[2], lit), b[3] * (back ? 0.85 : 1));
      ctx.fill();
    }
  }

  function drawPlanet(C, pl, q, pos3, t) {
    var r = pl.r * q.s;
    if (r < 0.4) r = 0.4;
    var L = norm(sub([0, 0, 0], pos3));
    var lx = dot(L, C.rt), ly = dot(L, C.up), lz = dot(L, C.fw);
    var lit = (1 - lz) / 2;                                  /* 1 = fully lit face toward us */
    var ox = lx * r * 0.6, oy = -ly * r * 0.6;

    /* atmosphere glow for readability */
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    var ag = ctx.createRadialGradient(q.x, q.y, r * 0.8, q.x, q.y, r * 1.9);
    ag.addColorStop(0, rgba(pl.c, 0.35)); ag.addColorStop(0.4, rgba(pl.c, 0.12)); ag.addColorStop(1, rgba(pl.c, 0));
    ctx.fillStyle = ag; ctx.fillRect(q.x - r * 2, q.y - r * 2, r * 4, r * 4);
    ctx.restore();

    if (pl.ring) drawRings(C, pl, pos3, true);

    /* body */
    var g = ctx.createRadialGradient(q.x + ox, q.y + oy, 0, q.x, q.y, r * 1.12);
    g.addColorStop(0, rgba(pl.hi, 1));
    g.addColorStop(0.22 + 0.3 * lit, rgba(pl.c, 1));
    g.addColorStop(0.62 + 0.25 * lit, rgba(scaleC(pl.c, 0.55), 1));
    g.addColorStop(1, rgba(scaleC(pl.c, 0.18), 1));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();

    /* surface detail, oriented to the world pole */
    if ((pl.bands || pl.earth) && r > 3) {
      var px = dot([0, 1, 0], C.rt), py = -dot([0, 1, 0], C.up);
      var plen = Math.sqrt(px * px + py * py) || 0.0001;
      var ang = Math.atan2(py, px) + Math.PI / 2;
      ctx.save();
      ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.clip();
      ctx.translate(q.x, q.y); ctx.rotate(ang);
      var k;
      if (pl.bands) {
        for (k = 0; k < pl.bands.length; k++) {
          var b = pl.bands[k];
          var yc = -Math.sin(b[0]) * r * plen, hw = b[1] * r * 1.6 + 0.6;
          var cw = Math.cos(b[0]) * r;
          var bg = ctx.createLinearGradient(0, yc - hw, 0, yc + hw);
          bg.addColorStop(0, rgba(b[2], 0)); bg.addColorStop(0.5, rgba(b[2], b[3])); bg.addColorStop(1, rgba(b[2], 0));
          ctx.fillStyle = bg;
          ctx.fillRect(-cw - 1, yc - hw, cw * 2 + 2, hw * 2);
        }
        if (pl.spot) {
          var sl = t * 0.35 + 1.0, sc = Math.cos(sl);
          if (sc > 0) {
            ctx.fillStyle = 'rgba(220,70,40,' + (0.75 * sc) + ')';
            ctx.beginPath(); ctx.ellipse(Math.sin(sl) * r * 0.92, 0.3 * r * plen, r * 0.22 * sc, r * 0.12, 0, 0, Math.PI * 2); ctx.fill();
          }
        }
      }
      if (pl.earth) {
        var spin = t * 0.5;
        for (k = 0; k < continents.length; k++) {
          var cc = continents[k];
          var lon = cc[0] + spin, lat = cc[1];
          var cl = Math.cos(lon);
          if (cl <= 0.05) continue;
          var cx = Math.sin(lon) * Math.cos(lat) * r, cy = -Math.sin(lat) * r * (0.35 + 0.65 * plen);
          ctx.fillStyle = (Math.abs(lat) > 1.2) ? 'rgba(240,255,255,' + (0.9 * cl) + ')' : 'rgba(70,225,90,' + (0.95 * Math.min(1, cl * 1.4)) + ')';
          ctx.beginPath(); ctx.ellipse(cx, cy, cc[2] * r * cl + 0.3, cc[3] * r, 0, 0, Math.PI * 2); ctx.fill();
        }
        /* cloud wisps */
        for (k = 0; k < 5; k++) {
          var wl = k * 1.3 - spin * 1.1, wc = Math.cos(wl);
          if (wc <= 0.05) continue;
          ctx.fillStyle = 'rgba(255,255,255,' + (0.45 * wc) + ')';
          ctx.beginPath(); ctx.ellipse(Math.sin(wl) * r * 0.85, (k - 2) * r * 0.3, r * 0.3 * wc, r * 0.07, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
      /* re-apply terminator shading over the detail */
      var sg = ctx.createRadialGradient(q.x + ox, q.y + oy, r * (0.3 + 0.5 * lit), q.x, q.y, r * 1.12);
      sg.addColorStop(0, 'rgba(0,0,30,0)'); sg.addColorStop(1, 'rgba(0,0,30,0.8)');
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
    }

    /* rim highlight toward the sun */
    ctx.save(); ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    var rim = ctx.createRadialGradient(q.x + ox * 1.6, q.y + oy * 1.6, r * 0.5, q.x + ox * 1.6, q.y + oy * 1.6, r * 1.6);
    rim.addColorStop(0, rgba(pl.hi, 0.35)); rim.addColorStop(1, rgba(pl.hi, 0));
    ctx.fillStyle = rim; ctx.fillRect(q.x - r, q.y - r, r * 2, r * 2);
    ctx.restore();

    if (pl.ring) drawRings(C, pl, pos3, false);
  }

  function drawMoon(C, q, pos3) {
    var r = Math.max(0.045 * q.s, 0.8);
    var L = norm(sub([0, 0, 0], pos3));
    var ox = dot(L, C.rt) * r * 0.5, oy = -dot(L, C.up) * r * 0.5;
    var g = ctx.createRadialGradient(q.x + ox, q.y + oy, 0, q.x, q.y, r * 1.1);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#d8dbe6'); g.addColorStop(1, '#4a4c60');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, Math.PI * 2); ctx.fill();
  }

  function orbitPoint(pl, th) {
    return [pl.a * Math.cos(th), pl.a * Math.sin(th) * Math.sin(pl.inc), pl.a * Math.sin(th) * Math.cos(pl.inc)];
  }
  function drawOrbits(C, sunZ, front) {
    var k, j, n = 160;
    ctx.lineWidth = Math.max(1, minD / 900);
    for (k = 0; k < planets.length; k++) {
      var pl = planets[k];
      ctx.strokeStyle = rgba(pl.c, 0.28);
      ctx.beginPath();
      var pen = false;
      for (j = 0; j <= n; j++) {
        var q = proj(C, orbitPoint(pl, j / n * Math.PI * 2));
        var ok = front ? q.z < sunZ : q.z >= sunZ;
        if (ok) { if (pen) ctx.lineTo(q.x, q.y); else { ctx.moveTo(q.x, q.y); pen = true; } }
        else pen = false;
      }
      ctx.stroke();
    }
  }

  /* ---------- main loop ---------- */
  var t0 = performance.now();
  function frame(now) {
    var t = (now - t0) / 1000;
    var C = camera(t);

    drawSky(C, t);

    var sunQ = proj(C, [0, 0, 0]);
    var items = [];
    items.push({ z: sunQ.z + 0.001, fn: function () { drawOrbits(C, sunQ.z, false); } });
    items.push({ z: sunQ.z, fn: function () { drawSun(sunQ, t); } });
    items.push({ z: sunQ.z - 0.001, fn: function () { drawOrbits(C, sunQ.z, true); } });

    var k;
    for (k = 0; k < planets.length; k++) {
      (function (pl) {
        var th = pl.ph + t * pl.w;
        var p3 = orbitPoint(pl, th);
        var q = proj(C, p3);
        items.push({ z: q.z, fn: function () { drawPlanet(C, pl, q, p3, t); } });
        if (pl.moon) {
          var ma = t * 2.2;
          var m3 = [p3[0] + 0.34 * Math.cos(ma), p3[1] + 0.06 * Math.sin(ma), p3[2] + 0.34 * Math.sin(ma)];
          var mq = proj(C, m3);
          items.push({ z: mq.z, fn: function () { drawMoon(C, mq, m3); } });
        }
      })(planets[k]);
    }
    items.sort(function (a, b) { return b.z - a.z; });
    for (k = 0; k < items.length; k++) items[k].fn();

    /* gentle vignette so the centre pops on small screens */
    var vg = ctx.createRadialGradient(W / 2, H / 2, minD * 0.45, W / 2, H / 2, Math.max(W, H) * 0.78);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
