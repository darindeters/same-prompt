<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar System</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #070014;
    overflow: hidden;
  }
  body {
    position: fixed;
    inset: 0;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d", { alpha: false });

  const VIEW = {
    focalK: 1.08,
    dist: 7.05,
    distAmp: 0.05,
    elev: 0.98,
    elevAmp: 0.055,
    yawSpeed: 0.075,
    elevSpeed: 0.11,
    distSpeed: 0.035
  };

  const SUN_R = 0.25;

  const PLANETS = [
    {
      orbit: 0.50, radius: 0.062, period: 6.2, phase: 0.45, inc: 0.10, node: 0.5,
      tilt: 0.02, twist: 0.3, spin: 1.4,
      hi: "#ffe7cf", mid: "#f29a45", sh: "#8a3d12",
      orb: [242, 150, 70], atmo: null, atmoScale: 1
    },
    {
      orbit: 0.73, radius: 0.082, period: 10.5, phase: 2.35, inc: 0.042, node: 1.45,
      tilt: 0.09, twist: 1.1, spin: -0.45,
      hi: "#fff6c9", mid: "#ffc933", sh: "#d06a00",
      orb: [255, 196, 60], atmo: "rgba(255, 214, 90, 0.45)", atmoScale: 1.22
    },
    {
      orbit: 0.98, radius: 0.084, period: 16, phase: 4.05, inc: 0, node: 0.2,
      tilt: 0.41, twist: 0.65, spin: 1.35,
      hi: "#d7e8ff", mid: "#1d6bff", sh: "#071648",
      orb: [70, 150, 255], atmo: "rgba(110, 210, 255, 0.55)", atmoScale: 1.16,
      bands: null,
      features: [
        { lat: 0.28, lon: 0.15, rx: 0.40, ry: 0.24, color: "#3ee86a" },
        { lat: -0.38, lon: 1.55, rx: 0.30, ry: 0.20, color: "#b6ff3a" },
        { lat: 0.62, lon: 2.45, rx: 0.20, ry: 0.14, color: "#18c86a" },
        { lat: -0.12, lon: 3.35, rx: 0.36, ry: 0.16, color: "#4df08a" },
        { lat: 0.08, lon: 4.7, rx: 0.18, ry: 0.13, color: "#7dff55" },
        { lat: -0.55, lon: 5.3, rx: 0.16, ry: 0.12, color: "#e8fff2" }
      ]
    },
    {
      orbit: 1.22, radius: 0.068, period: 24, phase: 1.15, inc: 0.058, node: 2.25,
      tilt: 0.44, twist: 1.4, spin: 1.3,
      hi: "#ffd0c4", mid: "#ff4b32", sh: "#6a140e",
      orb: [255, 90, 60], atmo: "rgba(255, 120, 80, 0.28)", atmoScale: 1.08,
      features: [
        { lat: 0.15, lon: 0.8, rx: 0.34, ry: 0.16, color: "#9a2418" },
        { lat: -0.25, lon: 2.6, rx: 0.22, ry: 0.12, color: "#c43422" },
        { lat: 1.28, lon: 0.2, rx: 0.30, ry: 0.22, color: "#fff4ee" }
      ]
    },
    {
      orbit: 1.56, radius: 0.138, period: 40, phase: 2.75, inc: 0.016, node: 0.5,
      tilt: 0.055, twist: 0.25, spin: 2.6,
      hi: "#fff1cc", mid: "#ffb033", sh: "#a3520c",
      orb: [255, 176, 64], atmo: null, atmoScale: 1,
      bands: [
        [-1, -0.70, "#f6e2b0"],
        [-0.70, -0.46, "#f08a22"],
        [-0.46, -0.20, "#ffd27a"],
        [-0.20, 0.06, "#e45716"],
        [0.06, 0.30, "#fff0c4"],
        [0.30, 0.52, "#ff9a2c"],
        [0.52, 0.74, "#c13f0c"],
        [0.74, 1, "#ffd27a"]
      ],
      features: [
        { lat: -0.32, lon: 0.4, rx: 0.30, ry: 0.16, color: "#ff3a2a" },
        { lat: -0.32, lon: 0.4, rx: 0.16, ry: 0.09, color: "#ffb199" }
      ]
    },
    {
      orbit: 1.96, radius: 0.116, period: 58, phase: 5.2, inc: 0.03, node: 1.75,
      tilt: 0.49, twist: 0.9, spin: 2.3,
      hi: "#fff6d4", mid: "#ffd36a", sh: "#b07a28",
      orb: [232, 196, 120], atmo: null, atmoScale: 1,
      rings: [
        { inn: 1.22, out: 1.42, rgb: [214, 170, 110], strength: 0.34 },
        { inn: 1.50, out: 1.86, rgb: [255, 232, 176], strength: 0.82 },
        { inn: 1.96, out: 2.28, rgb: [255, 186, 72], strength: 0.62 }
      ]
    },
    {
      orbit: 2.36, radius: 0.086, period: 82, phase: 0.85, inc: 0.012, node: 2.85,
      tilt: 1.74, twist: 0.5, spin: 1.5,
      hi: "#e6fffc", mid: "#2ee0d4", sh: "#0c6e6a",
      orb: [80, 240, 220], atmo: "rgba(170, 255, 246, 0.35)", atmoScale: 1.12,
      bands: [
        [-1, -0.42, "#1ec4b8"],
        [-0.42, -0.06, "#7dfff4"],
        [-0.06, 0.34, "#14aaa4"],
        [0.34, 1, "#5dffe8"]
      ],
      rings: [
        { inn: 1.55, out: 1.68, rgb: [214, 255, 250], strength: 0.55 },
        { inn: 1.78, out: 1.92, rgb: [170, 245, 240], strength: 0.38 }
      ]
    },
    {
      orbit: 2.70, radius: 0.084, period: 112, phase: 3.55, inc: 0.024, node: 3.6,
      tilt: 0.51, twist: 2.05, spin: 1.45,
      hi: "#d5defe", mid: "#3d5bff", sh: "#10145e",
      orb: [100, 130, 255], atmo: "rgba(140, 170, 255, 0.38)", atmoScale: 1.14,
      bands: [
        [-1, -0.58, "#2a46e6"],
        [-0.58, -0.22, "#5a78ff"],
        [-0.22, 0.16, "#243dbf"],
        [0.16, 0.50, "#6d88ff"],
        [0.50, 1, "#1a2ea8"]
      ],
      features: [
        { lat: -0.22, lon: 1.2, rx: 0.26, ry: 0.14, color: "#140e5c" }
      ]
    }
  ];

  const RNG = mulberry32(20261023);
  const STARS = [];
  for (let i = 0; i < 620; i++) {
    const band = i < 280;
    let x, y, z;
    if (band) {
      const theta = RNG() * Math.PI * 2;
      const lat = (RNG() - 0.5) * 0.42;
      const cl = Math.cos(lat);
      x = cl * Math.cos(theta);
      y = Math.sin(lat);
      z = cl * Math.sin(theta);
      const tilt = 1.05;
      const y2 = y * Math.cos(tilt) - z * Math.sin(tilt);
      const z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
      y = y2;
      z = z2;
    } else {
      const theta = RNG() * Math.PI * 2;
      const u = RNG() * 2 - 1;
      const ring = Math.sqrt(1 - u * u);
      x = ring * Math.cos(theta);
      y = u;
      z = ring * Math.sin(theta);
    }
    const rad = 16 + RNG() * RNG() * 36;
    const roll = RNG();
    const color = roll > 0.92 ? "#9fd4ff" : roll > 0.84 ? "#ffe1a8" : roll > 0.78 ? "#ffd0ea" : "#f7f8ff";
    STARS.push({
      x: x * rad,
      y: y * rad,
      z: z * rad,
      size: (0.35 + RNG() ** 3 * 2.05) * (18 / Math.sqrt(rad)),
      phase: RNG() * Math.PI * 2,
      speed: 0.6 + RNG() * 1.8,
      color
    });
  }

  const ORBIT_STEPS = 96;
  const RING_STEPS = 108;

  const pool = [];
  let pooli = 0;
  const list = [];

  let width = 0;
  let height = 0;
  let dpr = 1;
  let focal = 1;

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function next() {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function cross(a, b) {
    return [
      a[1] * b[2] - a[2] * b[1],
      a[2] * b[0] - a[0] * b[2],
      a[0] * b[1] - a[1] * b[0]
    ];
  }

  function dot(a, b) {
    return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  }

  function norm(a) {
    const len = Math.hypot(a[0], a[1], a[2]) || 1;
    return [a[0] / len, a[1] / len, a[2] / len];
  }

  function add3(a, b, s) {
    return [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.max(1, Math.round(width * dpr));
    canvas.height = Math.max(1, Math.round(height * dpr));
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    focal = VIEW.focalK * Math.min(width, height);
  }

  function cameraAt(t) {
    const yaw = t * VIEW.yawSpeed;
    const elev = VIEW.elev + Math.sin(t * VIEW.elevSpeed) * VIEW.elevAmp;
    const dist = VIEW.dist + Math.sin(t * VIEW.distSpeed) * VIEW.distAmp;
    const ce = Math.cos(elev);
    const se = Math.sin(elev);
    const pos = [dist * ce * Math.sin(yaw), dist * se, dist * ce * Math.cos(yaw)];
    const forward = norm([-pos[0], -pos[1], -pos[2]]);
    const right = norm(cross(forward, [0, 1, 0]));
    const up = norm(cross(right, forward));
    return { pos, forward, right, up, dist };
  }

  function project(p, cam) {
    const dx = p[0] - cam.pos[0];
    const dy = p[1] - cam.pos[1];
    const dz = p[2] - cam.pos[2];
    const z = dx * cam.forward[0] + dy * cam.forward[1] + dz * cam.forward[2];
    if (z < 0.2) return null;
    const x = dx * cam.right[0] + dy * cam.right[1] + dz * cam.right[2];
    const y = dx * cam.up[0] + dy * cam.up[1] + dz * cam.up[2];
    return {
      x: width * 0.5 + (x / z) * focal,
      y: height * 0.5 - (y / z) * focal,
      z,
      s: focal / z
    };
  }

  function orbitPoint(radius, angle, inc, node) {
    const x = radius * Math.cos(angle);
    const z0 = radius * Math.sin(angle);
    const y = -z0 * Math.sin(inc);
    const z = z0 * Math.cos(inc);
    const cn = Math.cos(node);
    const sn = Math.sin(node);
    return [x * cn + z * sn, y, -x * sn + z * cn];
  }

  function axisOf(tilt, twist) {
    return norm([
      Math.sin(tilt) * Math.cos(twist),
      Math.cos(tilt),
      Math.sin(tilt) * Math.sin(twist)
    ]);
  }

  function spinBasis(axis, spin) {
    const tmp = Math.abs(axis[1]) < 0.82 ? [0, 1, 0] : [1, 0, 0];
    const e1 = norm(cross(tmp, axis));
    const e2 = cross(axis, e1);
    const c = Math.cos(spin);
    const s = Math.sin(spin);
    return [
      [e1[0] * c + e2[0] * s, e1[1] * c + e2[1] * s, e1[2] * c + e2[2] * s],
      [-e1[0] * s + e2[0] * c, -e1[1] * s + e2[1] * c, -e1[2] * s + e2[2] * c]
    ];
  }

  function emit(z) {
    let item = pool[pooli++];
    if (!item) {
      item = {};
      pool[pooli - 1] = item;
    }
    item.z = z;
    list.push(item);
    return item;
  }

  function drawNebula(t) {
    const span = Math.max(width, height);
    const g1 = ctx.createRadialGradient(
      width * (0.22 + 0.06 * Math.sin(t * 0.05)),
      height * (0.28 + 0.05 * Math.cos(t * 0.04)),
      0,
      width * 0.45,
      height * 0.4,
      span * 0.72
    );
    g1.addColorStop(0, "rgba(128, 0, 186, 0.42)");
    g1.addColorStop(0.38, "rgba(70, 0, 120, 0.16)");
    g1.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = g1;
    ctx.fillRect(0, 0, width, height);

    const g2 = ctx.createRadialGradient(
      width * (0.78 + 0.05 * Math.cos(t * 0.06)),
      height * (0.72 + 0.04 * Math.sin(t * 0.05)),
      0,
      width * 0.7,
      height * 0.68,
      span * 0.62
    );
    g2.addColorStop(0, "rgba(0, 150, 170, 0.32)");
    g2.addColorStop(0.45, "rgba(0, 70, 110, 0.10)");
    g2.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = g2;
    ctx.fillRect(0, 0, width, height);

    const g3 = ctx.createRadialGradient(
      width * 0.55,
      height * (0.08 + 0.03 * Math.sin(t * 0.07)),
      0,
      width * 0.5,
      height * 0.2,
      span * 0.48
    );
    g3.addColorStop(0, "rgba(180, 40, 0, 0.16)");
    g3.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = g3;
    ctx.fillRect(0, 0, width, height);
  }

  function drawStars(cam, t) {
    for (let i = 0; i < STARS.length; i++) {
      const star = STARS[i];
      const p = project([star.x, star.y, star.z], cam);
      if (!p) continue;
      const tw = 0.62 + 0.38 * Math.sin(t * star.speed + star.phase);
      const size = Math.max(0.4, star.size * tw);
      ctx.fillStyle = star.color;
      ctx.globalAlpha = 0.35 + tw * 0.65;
      if (size > 1.45) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, size * 3.2, 0, Math.PI * 2);
        ctx.globalAlpha = tw * 0.18;
        ctx.fill();
        ctx.globalAlpha = 0.55 + tw * 0.45;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawSunGlow(x, y, r, t) {
    const pulse = 1 + Math.sin(t * 1.35) * 0.035 + Math.sin(t * 2.7) * 0.015;
    const haloR = r * 6.4 * pulse;
    const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, haloR);
    g.addColorStop(0, "rgba(255, 244, 200, 0.55)");
    g.addColorStop(0.1, "rgba(255, 176, 40, 0.38)");
    g.addColorStop(0.28, "rgba(255, 90, 16, 0.16)");
    g.addColorStop(0.55, "rgba(170, 24, 70, 0.05)");
    g.addColorStop(1, "rgba(255, 80, 0, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, haloR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(t * 0.08);
    for (let i = 0; i < 10; i++) {
      ctx.rotate(Math.PI / 5);
      const ray = ctx.createLinearGradient(r * 0.8, 0, r * 5.2 * pulse, 0);
      ray.addColorStop(0, "rgba(255, 214, 110, 0.22)");
      ray.addColorStop(1, "rgba(255, 120, 0, 0)");
      ctx.fillStyle = ray;
      ctx.beginPath();
      ctx.moveTo(r * 0.9, -r * 0.08);
      ctx.lineTo(r * (4.6 + (i % 3) * 0.4) * pulse, 0);
      ctx.lineTo(r * 0.9, r * 0.08);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSunCore(x, y, r) {
    const g = ctx.createRadialGradient(x - r * 0.28, y - r * 0.32, r * 0.08, x, y, r);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.28, "#fff6cf");
    g.addColorStop(0.62, "#ffd23a");
    g.addColorStop(1, "#ff8c00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 244, 200, 0.95)";
    ctx.lineWidth = Math.max(1.5, r * 0.06);
    ctx.stroke();
  }

  function shadeSphere(x, y, r, lx, ly) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();

    const sx = x + lx * r * 0.2;
    const sy = y + ly * r * 0.2;
    let g = ctx.createRadialGradient(sx, sy, r * 0.15, x, y, r * 1.08);
    g.addColorStop(0, "rgba(0, 0, 0, 0)");
    g.addColorStop(0.55, "rgba(0, 0, 0, 0.04)");
    g.addColorStop(1, "rgba(0, 0, 0, 0.62)");
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);

    const hx = x - lx * r * 0.4;
    const hy = y - ly * r * 0.4;
    g = ctx.createRadialGradient(hx, hy, 0, hx, hy, r * 0.95);
    g.addColorStop(0, "rgba(255, 255, 255, 0.82)");
    g.addColorStop(0.22, "rgba(255, 255, 255, 0.18)");
    g.addColorStop(0.48, "rgba(255, 255, 255, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    ctx.restore();
  }

  function lightDir(sx, sy, sunX, sunY) {
    let lx = sunX - sx;
    let ly = sunY - sy;
    const len = Math.hypot(lx, ly);
    if (len < 0.001) return [0, -1];
    return [lx / len, ly / len];
  }

  function drawBands(x, y, r, axis, cam, bands) {
    const px = dot(axis, cam.right);
    const py = dot(axis, cam.up);
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.translate(x, y);
    ctx.rotate(-Math.PI / 2 - Math.atan2(-py, px));
    for (let i = 0; i < bands.length; i++) {
      const band = bands[i];
      ctx.fillStyle = band[2];
      const y0 = band[0] * r;
      const y1 = band[1] * r;
      ctx.fillRect(-r, y0, r * 2, y1 - y0);
    }
    ctx.restore();
  }

  function drawFeatures(x, y, r, pos, axis, basis, cam, features, spin) {
    const e1 = basis[0];
    const e2 = basis[1];
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    const vx = cam.pos[0] - pos[0];
    const vy = cam.pos[1] - pos[1];
    const vz = cam.pos[2] - pos[2];
    const vlen = Math.hypot(vx, vy, vz) || 1;
    for (let i = 0; i < features.length; i++) {
      const feat = features[i];
      const lat = feat.lat;
      const lon = feat.lon + spin;
      const cl = Math.cos(lat);
      const sl = Math.sin(lat);
      const co = Math.cos(lon);
      const so = Math.sin(lon);
      const lx = cl * so;
      const ly = sl;
      const lz = cl * co;
      const nx = lx * e1[0] + ly * axis[0] + lz * e2[0];
      const ny = lx * e1[1] + ly * axis[1] + lz * e2[1];
      const nz = lx * e1[2] + ly * axis[2] + lz * e2[2];
      const facing = (nx * vx + ny * vy + nz * vz) / vlen;
      if (facing <= 0.08) continue;
      const ox = (nx * cam.right[0] + ny * cam.right[1] + nz * cam.right[2]) * r;
      const oy = (nx * cam.up[0] + ny * cam.up[1] + nz * cam.up[2]) * r;
      ctx.fillStyle = feat.color;
      ctx.beginPath();
      ctx.ellipse(
        x + ox,
        y - oy,
        Math.max(0.5, feat.rx * r * facing),
        Math.max(0.5, feat.ry * r),
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPlanet(item, cam, sunX, sunY) {
    const x = item.x;
    const y = item.y;
    const r = item.r;
    const body = item.body;
    const rgb = body.orb;
    const aura = ctx.createRadialGradient(x, y, r * 0.65, x, y, r * 2.05);
    aura.addColorStop(0, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
    aura.addColorStop(0.5, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.30)");
    aura.addColorStop(1, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.05, 0, Math.PI * 2);
    ctx.fill();
    if (body.atmo) {
      const ar = r * body.atmoScale;
      const g = ctx.createRadialGradient(x, y, r * 0.92, x, y, ar);
      g.addColorStop(0, "rgba(0, 0, 0, 0)");
      g.addColorStop(0.55, body.atmo);
      g.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, ar, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = body.mid;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    if (body.bands) drawBands(x, y, r, item.axis, cam, body.bands);
    if (body.features) {
      drawFeatures(x, y, r, item.pos, item.axis, item.basis, cam, body.features, item.spin);
    }
    const light = lightDir(x, y, sunX, sunY);
    shadeSphere(x, y, r, light[0], light[1]);
  }

  function drawRing(item) {
    const pts = item.pts;
    ctx.beginPath();
    ctx.moveTo(pts[0], pts[1]);
    ctx.lineTo(pts[2], pts[3]);
    ctx.lineTo(pts[4], pts[5]);
    ctx.lineTo(pts[6], pts[7]);
    ctx.closePath();
    const rgb = item.rgb;
    ctx.fillStyle = "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + "," + item.alpha.toFixed(3) + ")";
    ctx.fill();
  }

  function drawOrbit(item) {
    ctx.beginPath();
    ctx.moveTo(item.x1, item.y1);
    ctx.lineTo(item.x2, item.y2);
    ctx.strokeStyle = "rgba(" + item.rgb[0] + "," + item.rgb[1] + "," + item.rgb[2] + "," + item.alpha.toFixed(3) + ")";
    ctx.lineWidth = item.width;
    ctx.stroke();
  }

  function buildScene(cam, t, sunScreen) {
    for (let i = 0; i < PLANETS.length; i++) {
      const body = PLANETS[i];
      const ang = body.phase + (t / body.period) * Math.PI * 2;
      let prev = null;
      for (let s = 0; s <= ORBIT_STEPS; s++) {
        const a = (s / ORBIT_STEPS) * Math.PI * 2;
        const world = orbitPoint(body.orbit, a, body.inc, body.node);
        const p = project(world, cam);
        if (prev && p) {
          const item = emit((prev.z + p.z) * 0.5);
          item.kind = "orbit";
          item.x1 = prev.x;
          item.y1 = prev.y;
          item.x2 = p.x;
          item.y2 = p.y;
          item.rgb = body.orb;
          const near = cam.dist - body.orbit;
          const far = cam.dist + body.orbit;
          const u = (item.z - near) / (far - near + 0.0001);
          item.alpha = 0.62 - Math.min(1, Math.max(0, u)) * 0.34;
          item.width = Math.max(1.15, 1.7 * Math.min(width, height) / 1080);
        }
        prev = p;
      }

      const pos = orbitPoint(body.orbit, ang, body.inc, body.node);
      const projected = project(pos, cam);
      if (!projected) continue;
      const axis = axisOf(body.tilt, body.twist);
      const basis = spinBasis(axis, t * body.spin);
      const pr = Math.max(2.6, body.radius * projected.s + 2.1 * Math.min(width, height) / 1080);

      if (body.rings) {
        const ringBasis = spinBasis(axis, body.twist);
        const e1 = ringBasis[0];
        const e2 = ringBasis[1];
        const sunX = -pos[0];
        const sunZ = -pos[1];
        const sunY = -pos[2];
        const l1 = sunX * e1[0] + sunZ * e1[1] + sunY * e1[2];
        const l2 = sunX * e2[0] + sunZ * e2[1] + sunY * e2[2];
        const lightAng = Math.atan2(l2, l1);
        for (let k = 0; k < body.rings.length; k++) {
          const ring = body.rings[k];
          const inner = body.radius * ring.inn;
          const outer = body.radius * ring.out;
          for (let s = 0; s < RING_STEPS; s++) {
            const a0 = (s / RING_STEPS) * Math.PI * 2;
            const a1 = ((s + 1) / RING_STEPS) * Math.PI * 2;
            const c0 = Math.cos(a0);
            const s0 = Math.sin(a0);
            const c1 = Math.cos(a1);
            const s1 = Math.sin(a1);
            const w0 = add3(add3(pos, e1, inner * c0), e2, inner * s0);
            const w1 = add3(add3(pos, e1, inner * c1), e2, inner * s1);
            const w2 = add3(add3(pos, e1, outer * c1), e2, outer * s1);
            const w3 = add3(add3(pos, e1, outer * c0), e2, outer * s0);
            const p0 = project(w0, cam);
            const p1 = project(w1, cam);
            const p2 = project(w2, cam);
            const p3 = project(w3, cam);
            if (!p0 || !p1 || !p2 || !p3) continue;
            const item = emit((p0.z + p1.z + p2.z + p3.z) * 0.25);
            item.kind = "ring";
            item.pts = [p0.x, p0.y, p1.x, p1.y, p2.x, p2.y, p3.x, p3.y];
            item.rgb = ring.rgb;
            const lit = 0.42 + 0.58 * Math.max(0, Math.cos((a0 + a1) * 0.5 - lightAng));
            item.alpha = ring.strength * lit;
          }
        }
      }

      const item = emit(projected.z);
      item.kind = "planet";
      item.x = projected.x;
      item.y = projected.y;
      item.r = pr;
      item.body = body;
      item.pos = pos;
      item.axis = axis;
      item.basis = basis;
      item.spin = t * body.spin;
    }

    const sunP = project([0, 0, 0], cam);
    if (sunP) {
      const item = emit(sunP.z);
      item.kind = "sun";
      item.x = sunP.x;
      item.y = sunP.y;
      item.r = Math.max(8, SUN_R * sunP.s);
      sunScreen.x = sunP.x;
      sunScreen.y = sunP.y;
    }
  }

  function drawVignette() {
    const span = Math.max(width, height);
    const g = ctx.createRadialGradient(
      width * 0.5,
      height * 0.5,
      span * 0.48,
      width * 0.5,
      height * 0.5,
      span * 0.78
    );
    g.addColorStop(0, "rgba(0, 0, 0, 0)");
    g.addColorStop(1, "rgba(0, 0, 0, 0.48)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, width, height);
  }

  const sunScreen = { x: 0, y: 0 };

  function frame(now) {
    const t = now * 0.001;
    const cam = cameraAt(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#070014";
    ctx.fillRect(0, 0, width, height);
    drawNebula(t);
    drawStars(cam, t);

    const sunP = project([0, 0, 0], cam);
    if (sunP) {
      sunScreen.x = sunP.x;
      sunScreen.y = sunP.y;
      drawSunGlow(sunP.x, sunP.y, Math.max(8, SUN_R * sunP.s), t);
    }

    pooli = 0;
    list.length = 0;
    ctx.lineCap = "round";
    buildScene(cam, t, sunScreen);
    list.sort((a, b) => b.z - a.z);
    for (let i = 0; i < list.length; i++) {
      const item = list[i];
      if (item.kind === "orbit") drawOrbit(item);
      else if (item.kind === "ring") drawRing(item);
      else if (item.kind === "planet") drawPlanet(item, cam, sunScreen.x, sunScreen.y);
      else drawSunCore(item.x, item.y, item.r);
    }
    drawVignette();
    requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
