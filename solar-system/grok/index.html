function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mul(v, s) { return { x: v.x * s, y: v.y * s, z: v.z * s }; }
function add(a, b) { return { x: a.x + b.x, y: a.y + b.y, z: a.z + b.z }; }
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function cross(a, b) {
  return {
    x: a.y * b.z - a.z * b.y,
    y: a.z * b.x - a.x * b.z,
    z: a.x * b.y - a.y * b.x
  };
}
function hypot3(v) { return Math.hypot(v.x, v.y, v.z); }
function norm(v) {
  var L = hypot3(v) || 1;
  return { x: v.x / L, y: v.y / L, z: v.z / L };
}
function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function rgba(c, a) {
  return 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
}

function orbitPosition(a, e, inc, node, arg, theta) {
  var r = a * (1 - e * e) / (1 + e * Math.cos(theta));
  var u = theta + arg;
  var xo = r * Math.cos(u);
  var zo = r * Math.sin(u);
  var ci = Math.cos(inc);
  var si = Math.sin(inc);
  var y1 = -zo * si;
  var z1 = zo * ci;
  var cn = Math.cos(node);
  var sn = Math.sin(node);
  return { x: xo * cn - z1 * sn, y: y1, z: xo * sn + z1 * cn };
}

function basisFromAxis(axis, spin) {
  var a = norm(axis);
  var tmp = Math.abs(a.x) < 0.8 ? { x: 1, y: 0, z: 0 } : { x: 0, y: 0, z: 1 };
  var ref0 = norm(cross(tmp, a));
  var east0 = norm(cross(a, ref0));
  var c = Math.cos(spin);
  var s = Math.sin(spin);
  var ref = norm(add(mul(ref0, c), mul(east0, s)));
  var east = norm(cross(a, ref));
  return { axis: a, ref: ref, east: east };
}

function spinAxis(tilt, node) {
  return {
    x: Math.sin(tilt) * Math.cos(node),
    y: Math.cos(tilt),
    z: Math.sin(tilt) * Math.sin(node)
  };
}

function spherePoint(center, radius, basis, lat, lon) {
  var cl = Math.cos(lat);
  var sl = Math.sin(lat);
  var co = Math.cos(lon);
  var so = Math.sin(lon);
  return {
    x: center.x + radius * (cl * co * basis.ref.x + cl * so * basis.east.x + sl * basis.axis.x),
    y: center.y + radius * (cl * co * basis.ref.y + cl * so * basis.east.y + sl * basis.axis.y),
    z: center.z + radius * (cl * co * basis.ref.z + cl * so * basis.east.z + sl * basis.axis.z)
  };
}

  var i, p, L, lat, lon;
  for (i = 0; i < planets.length; i++) {
    p = planets[i];

    p.axis = spinAxis(p.tilt, p.tnode);
    if (p.lands) {
      p.spots = [];
      for (L = 0; L < p.lands.length; L++) {
        lat = p.lands[L];
        p.spots.push({
          lat: lat[0] * DEG,

          rx: lat[2],
          ry: lat[3],
          color: lat[4],

var pool = [];
var nItems = 0;

function item(z, kind) {
  var it = pool[nItems];
  if (!it) it = pool[nItems] = {};
  it.kind = kind;
  it.z = z;
  nItems++;

}

function resize() {
  w = Math.max(1, window.innerWidth);
  h = Math.max(1, window.innerHeight);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

function project(p) {
  var vx = p.x - eye.x;
  var vy = p.y - eye.y;
  var vz = p.z - eye.z;
  var x = vx * right.x + vy * right.y + vz * right.z;
  var y = vx * up.x + vy * up.y + vz * up.z;
  var z = vx * forward.x + vy * forward.y + vz * forward.z;
  if (z < 12) return null;
  return {
    x: w * 0.5 + (x / z) * scale,
    y: h * 0.5 - (y / z) * scale,
    z: z
  };
}

function placeCamera(t) {
  var az = t * 0.032 + 0.75;
  var el = 0.5 + 0.14 * Math.sin(t * 0.041);
  var distFactor = 2.12 + 0.03 * Math.sin(t * 0.057);
  var half = Math.min(w, h) * 0.5;
  scale = half / Math.tan(FOV * 0.5);
  var dist = scale * distFactor;
  var ce = Math.cos(el);
  eye = {
    x: dist * ce * Math.sin(az),
    y: dist * Math.sin(el),
    z: dist * ce * Math.cos(az)
  };
  forward = norm({ x: -eye.x, y: -eye.y, z: -eye.z });
  var rt = cross(forward, { x: 0, y: 1, z: 0 });
  var rl = hypot3(rt);
  right = rl < 1e-5 ? { x: 1, y: 0, z: 0 } : mul(rt, 1 / rl);
  up = cross(right, forward);
}

function billboard(pos) {
  var zAxis = norm(sub(eye, pos));
  var d = dot(right, zAxis);
  var xAxis = {
    x: right.x - zAxis.x * d,
    y: right.y - zAxis.y * d,
    z: right.z - zAxis.z * d
  };
  var xl = hypot3(xAxis);
  xAxis = xl < 1e-5 ? { x: 1, y: 0, z: 0 } : mul(xAxis, 1 / xl);
  var yAxis = cross(zAxis, xAxis);
  if (dot(yAxis, up) < 0) {
    yAxis = mul(yAxis, -1);
    xAxis = mul(xAxis, -1);
  }
  return { xAxis: xAxis, yAxis: yAxis, zAxis: zAxis };
}

function shadowShade(point, planetPos, planetR) {
  var plen = hypot3(point);
  var pDist = hypot3(planetPos);
  if (plen < pDist * 0.985) return 1;
  var cx = point.y * planetPos.z - point.z * planetPos.y;
  var cy = point.z * planetPos.x - point.x * planetPos.z;
  var cz = point.x * planetPos.y - point.y * planetPos.x;
  var dist = Math.hypot(cx, cy, cz) / (plen || 1);
  var edge = (dist - planetR * 0.82) / (planetR * 0.28);
  if (edge >= 1) return 1;
  if (edge <= 0) return 0.06;
  return 0.06 + 0.94 * edge * edge * (3 - 2 * edge);
}

function addRings(planetPos, axis, planetR, spans) {
  var b = basisFromAxis(axis, 0);
  var toSun = norm({ x: -planetPos.x, y: -planetPos.y, z: -planetPos.z });
  var illum = 0.62 + 0.38 * Math.abs(dot(b.axis, toSun));
  var segs = 80;
  var s, i, r0, r1, a0, a1, c0, s0, c1, s1;
  var p0, p1, p2, p3, mid, q0, q1, q2, q3, z, shade, it;
  for (s = 0; s < spans.length; s++) {
    r0 = planetR * spans[s][0];
    r1 = planetR * spans[s][1];
    for (i = 0; i < segs; i++) {
      a0 = (i / segs) * TAU;
      a1 = ((i + 1) / segs) * TAU;
      c0 = Math.cos(a0);
      s0 = Math.sin(a0);
      c1 = Math.cos(a1);
      s1 = Math.sin(a1);
      p0 = add(planetPos, add(mul(b.ref, c0 * r0), mul(b.east, s0 * r0)));
      p1 = add(planetPos, add(mul(b.ref, c0 * r1), mul(b.east, s0 * r1)));
      p2 = add(planetPos, add(mul(b.ref, c1 * r1), mul(b.east, s1 * r1)));
      p3 = add(planetPos, add(mul(b.ref, c1 * r0), mul(b.east, s1 * r0)));
      q0 = project(p0);
      q1 = project(p1);
      q2 = project(p2);
      q3 = project(p3);
      if (!q0 || !q1 || !q2 || !q3) continue;
      var maxX = Math.max(q0.x, q1.x, q2.x, q3.x);
      var minX = Math.min(q0.x, q1.x, q2.x, q3.x);
      var maxY = Math.max(q0.y, q1.y, q2.y, q3.y);
      var minY = Math.min(q0.y, q1.y, q2.y, q3.y);
      if (maxX < -40 || minX > w + 40 || maxY < -40 || minY > h + 40) continue;
      mid = {
        x: (p0.x + p1.x + p2.x + p3.x) * 0.25,
        y: (p0.y + p1.y + p2.y + p3.y) * 0.25,
        z: (p0.z + p1.z + p2.z + p3.z) * 0.25
      };
      z = (q0.z + q1.z + q2.z + q3.z) * 0.25;
      shade = shadowShade(mid, planetPos, planetR);
      it = item(z, 'quad');
      it.x0 = q0.x; it.y0 = q0.y;
      it.x1 = q1.x; it.y1 = q1.y;
      it.x2 = q2.x; it.y2 = q2.y;
      it.x3 = q3.x; it.y3 = q3.y;
      it.col = spans[s][2];
      it.a = spans[s][3] * illum * shade;
    }
  }
}

function drawSpot(context, ox, oy, pr, pos, radius, basis, frame, spot, time) {
  var lon = spot.lon + (spot.rate || 0) * time;
  var point = spherePoint(pos, radius, basis, spot.lat, lon);
  var rel = sub(point, pos);
  var facing = dot(rel, frame.zAxis) / radius;
  if (facing <= 0.06) return;
  var x = ox + (dot(rel, frame.xAxis) / radius) * pr;
  var y = oy - (dot(rel, frame.yAxis) / radius) * pr;
  var eastAng = Math.atan2(-dot(basis.east, frame.yAxis), dot(basis.east, frame.xAxis));
  var f = Math.max(0.18, facing);
  context.fillStyle = rgba(spot.color, (spot.alpha == null ? 1 : spot.alpha) * Math.min(1, facing * 1.35));
  context.beginPath();
  context.ellipse(
    x, y,
    Math.max(0.35, spot.rx * pr * f),
    Math.max(0.35, spot.ry * pr * (0.4 + 0.6 * facing)),
    eastAng, 0, TAU
  );
  context.fill();
}

function drawBands(context, ox, oy, pr, pos, radius, basis, frame, bands) {
  var segs = pr > 28 ? 36 : 24;
  var b, i, lat0, lat1, lon0, lon1, pts, k, rel, facing, acc, proj, p;
  for (b = 0; b < bands.length; b++) {
    lat0 = bands[b][0] * DEG;
    lat1 = bands[b][1] * DEG;
    context.fillStyle = rgb(bands[b][2]);
    for (i = 0; i < segs; i++) {
      lon0 = (i / segs) * TAU;
      lon1 = ((i + 1) / segs) * TAU;
      pts = [
        spherePoint(pos, radius, basis, lat0, lon0),
        spherePoint(pos, radius, basis, lat1, lon0),
        spherePoint(pos, radius, basis, lat1, lon1),
        spherePoint(pos, radius, basis, lat0, lon1)
      ];
      acc = 0;
      proj = [];
      for (k = 0; k < 4; k++) {
        rel = sub(pts[k], pos);
        facing = dot(rel, frame.zAxis) / radius;
        acc += facing;
        proj.push({
          x: ox + (dot(rel, frame.xAxis) / radius) * pr,
          y: oy - (dot(rel, frame.yAxis) / radius) * pr
        });
      }
      if (acc * 0.25 <= 0) continue;
      context.beginPath();
      context.moveTo(proj[0].x, proj[0].y);
      for (p = 1; p < 4; p++) context.lineTo(proj[p].x, proj[p].y);
      context.closePath();
      context.fill();
    }
  }
}

function shadeDisk(pr, S, size, frame, pos, specK, soft, amb) {
  var toSun = norm({ x: -pos.x, y: -pos.y, z: -pos.z });
  var Lx = dot(toSun, frame.xAxis);
  var Ly = dot(toSun, frame.yAxis);
  var Lz = dot(toSun, frame.zAxis);
  var img = sctx.getImageData(0, 0, size, size);
  var data = img.data;
  var py, px, i, dx, dy, nx, ny, r2, nz, ndotl, light, hard, x, limb, illum, spec, hx, hy, hz, hl, ndh;
  for (py = 0; py < size; py++) {
    dy = (py + 0.5) / S - pr;
    for (px = 0; px < size; px++) {
      i = (py * size + px) * 4;
      if (data[i + 3] === 0) continue;
      dx = (px + 0.5) / S - pr;
      nx = dx / pr;
      ny = -dy / pr;
      r2 = nx * nx + ny * ny;
      if (r2 >= 1) {
        data[i + 3] = 0;
        continue;
      }
      nz = Math.sqrt(1 - r2);
      ndotl = nx * Lx + ny * Ly + nz * Lz;
      hard = ndotl > 0 ? ndotl : 0;
      if (soft > 0) {
        x = ndotl / (0.06 + soft * 0.5);
        if (x <= 0) light = 0;
        else if (x >= 1) light = 1;
        else light = x * x * (3 - 2 * x);
        light = hard * (1 - soft) + light * soft;
      } else {
        light = hard;
      }
      limb = 0.4 + 0.6 * nz;
      illum = (amb + (1 - amb) * light) * limb;
      spec = 0;
      if (specK > 0 && ndotl > 0) {
        hx = Lx;
        hy = Ly;
        hz = Lz + 1;
        hl = Math.hypot(hx, hy, hz) || 1;
        ndh = (nx * hx + ny * hy + nz * hz) / hl;
        if (ndh > 0) spec = Math.pow(ndh, 48) * specK * 255;
      }
      data[i] = Math.min(255, data[i] * illum + spec);
      data[i + 1] = Math.min(255, data[i + 1] * illum + spec);
      data[i + 2] = Math.min(255, data[i + 2] * illum + spec * 0.94);
    }
  }
  sctx.putImageData(img, 0, 0);
  return { Lx: Lx, Ly: Ly };
}

function renderBody(it, time) {
  var spr = it.spr;
  if (!(spr > 0.4)) return;
  var sx = it.sx;
  var sy = it.sy;
  var cfg = it.cfg;
  var pos = { x: it.wx, y: it.wy, z: it.wz };
  if (spr < 2.1) {
    ctx.fillStyle = rgb(cfg.color);
    ctx.beginPath();
    ctx.arc(sx, sy, spr, 0, TAU);
    ctx.fill();
    return;
  }
  var frame = billboard(pos);
  var axis = { x: it.ax, y: it.ay, z: it.az };
  var basis = basisFromAxis(axis, it.spinAng || 0);
  var S = dpr;
  var size = Math.max(2, Math.ceil(spr * 2 * S));
  sprite.width = size;
  sprite.height = size;
  sctx.setTransform(S, 0, 0, S, 0, 0);
  sctx.beginPath();
  sctx.arc(spr, spr, spr, 0, TAU);
  sctx.clip();
  sctx.fillStyle = rgb(cfg.color);
  sctx.fillRect(0, 0, spr * 2, spr * 2);
  if (cfg.bands && spr >= 9) drawBands(sctx, spr, spr, spr, pos, cfg.r, basis, frame, cfg.bands);
  if (cfg.caps && spr >= 8) drawBands(sctx, spr, spr, spr, pos, cfg.r, basis, frame, cfg.caps);
  var spots = cfg.spots;
  var n, spot;
  if (spots && spr >= 6) {
    for (n = 0; n < spots.length; n++) drawSpot(sctx, spr, spr, spr, pos, cfg.r, basis, frame, spots[n], time);
  }
  if (cfg.cloudSpots && spr >= 8) {
    var cb = basisFromAxis(axis, (it.spinAng || 0) * 1.15);
    for (n = 0; n < cfg.cloudSpots.length; n++) {
      drawSpot(sctx, spr, spr, spr, pos, cfg.r, cb, frame, cfg.cloudSpots[n], time);
    }
  }
  if (cfg.spot && spr >= 12) {
    spot = {
      lat: cfg.spot.lat * DEG,
      lon: it.spinAng || 0,
      rx: cfg.spot.rx,
      ry: cfg.spot.ry,
      color: cfg.spot.color,
      alpha: 1
    };
    drawSpot(sctx, spr, spr, spr, pos, cfg.r, basisFromAxis(axis, 0), frame, spot, 0);
    drawSpot(sctx, spr, spr, spr, pos, cfg.r, basisFromAxis(axis, 0), frame, {
      lat: spot.lat,
      lon: spot.lon,
      rx: cfg.spot.rx * 0.45,
      ry: cfg.spot.ry * 0.45,
      color: cfg.spot.hi,
      alpha: 0.85
    }, 0);
  }
  var light = shadeDisk(spr, S, size, frame, pos, cfg.spec || 0, cfg.soft || 0, cfg.amb == null ? 0.1 : cfg.amb);
  ctx.drawImage(sprite, sx - spr, sy - spr, spr * 2, spr * 2);
  if (cfg.atmo) {
    var reach = cfg.atmo[4];
    var ox = light.Lx * spr * 0.42;
    var oy = -light.Ly * spr * 0.42;
    var g = ctx.createRadialGradient(sx + ox, sy + oy, spr * 0.78, sx + ox, sy + oy, spr * reach);
    var ac = [cfg.atmo[0], cfg.atmo[1], cfg.atmo[2]];
    var strength = cfg.atmo[3];
    g.addColorStop(0, rgba(ac, 0));
    g.addColorStop(0.55, rgba(ac, strength * 0.12));
    g.addColorStop(0.8, rgba(ac, strength));
    g.addColorStop(1, rgba(ac, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, spr * reach, 0, TAU);
    ctx.fill();
  }
}

function drawStars(t) {
  var i, s, p, tw, alpha, col, len;
  for (i = 0; i < stars.length; i++) {
    s = stars[i];
    p = project(s);
    if (!p) continue;
    if (p.x < -10 || p.y < -10 || p.x > w + 10 || p.y > h + 10) continue;
    tw = 0.62 + 0.38 * Math.sin(t * s.tsw + s.tw);
    alpha = s.a * tw;
    col = s.col;
    ctx.fillStyle = rgba(col, alpha);
    if (s.s <= 1.15) {
      ctx.fillRect(p.x, p.y, s.s, s.s);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, s.s * 0.55, 0, TAU);
      ctx.fill();
    }
    if (s.spike) {
      len = 3 + s.s * 3.2;
      ctx.strokeStyle = rgba(col, alpha * 0.55);
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(p.x - len, p.y);
      ctx.lineTo(p.x + len, p.y);
      ctx.moveTo(p.x, p.y - len);
      ctx.lineTo(p.x, p.y + len);
      ctx.stroke();
    }
  }
}

function drawNebulae() {
  var i, n, p, rad, g;
  for (i = 0; i < nebulae.length; i++) {
    n = nebulae[i];
    p = project(n);
    if (!p) continue;
    rad = n.r * scale / p.z;
    if (!(rad > 20)) continue;
    if (rad > Math.max(w, h) * 1.4) rad = Math.max(w, h) * 1.4;
    g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad);
    g.addColorStop(0, rgba(n.col, n.a));
    g.addColorStop(1, rgba(n.col, 0));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rad, 0, TAU);
    ctx.fill();
  }
}

function drawOrbits() {
  ctx.lineWidth = 1.15;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  var i, p, k, pos, pr, started;
  for (i = 0; i < planets.length; i++) {
    p = planets[i];
    ctx.beginPath();
    started = false;
    for (k = 0; k <= 168; k++) {
      pos = orbitPosition(p.a, p.e, p.inc, p.node, p.arg, (k / 168) * TAU);
      pr = project(pos);
      if (!pr) {
        started = false;
        continue;
      }
      if (!started) {
        ctx.moveTo(pr.x, pr.y);
        started = true;
      } else ctx.lineTo(pr.x, pr.y);
    }
    ctx.strokeStyle = rgba(p.color, 0.2);
    ctx.stroke();
  }
}

function drawSunGlow(sx, sy, pr, t) {
  var pulse = 1 + 0.04 * Math.sin(t * 0.85);
  var R = pr * 5.1 * pulse;
  var g = ctx.createRadialGradient(sx, sy, pr * 0.2, sx, sy, R);
  g.addColorStop(0, 'rgba(255, 236, 190, 0.34)');
  g.addColorStop(0.12, 'rgba(255, 186, 70, 0.16)');
  g.addColorStop(0.32, 'rgba(255, 110, 30, 0.07)');
  g.addColorStop(0.6, 'rgba(180, 50, 10, 0.035)');
  g.addColorStop(1, 'rgba(120, 30, 0, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(sx, sy, R, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(sx, sy);
  ctx.globalCompositeOperation = 'lighter';
  var i, a, len, wid, flicker;
  for (i = 0; i < 16; i++) {
    flicker = 0.65 + 0.35 * Math.sin(t * 0.7 + i * 1.7);
    a = t * 0.035 + i * (TAU / 16);
    len = pr * (1.8 + (i % 5) * 0.38) * pulse * flicker;
    wid = 0.045 + (i % 3) * 0.018;
    ctx.fillStyle = 'rgba(255, ' + (150 + (i % 4) * 22) + ', 60, ' + (0.035 + (i % 3) * 0.012) + ')';
    ctx.beginPath();
    ctx.moveTo(Math.cos(a - wid) * pr * 0.95, Math.sin(a - wid) * pr * 0.95);
    ctx.lineTo(Math.cos(a) * (pr + len), Math.sin(a) * (pr + len));
    ctx.lineTo(Math.cos(a + wid) * pr * 0.95, Math.sin(a + wid) * pr * 0.95);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  var hot = ctx.createRadialGradient(sx, sy, pr * 0.3, sx, sy, pr * 2.15 * pulse);
  hot.addColorStop(0, 'rgba(255, 250, 230, 0.55)');
  hot.addColorStop(0.35, 'rgba(255, 200, 90, 0.2)');
  hot.addColorStop(1, 'rgba(255, 140, 40, 0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = hot;
  ctx.beginPath();
  ctx.arc(sx, sy, pr * 2.15 * pulse, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  var j, prn, ang, life, ww;
  ctx.lineCap = 'round';
  for (j = 0; j < prominences.length; j++) {
    prn = prominences[j];
    ang = prn.a + t * prn.speed;
    life = 0.4 + 0.6 * (0.5 + 0.5 * Math.sin(t * 0.33 + prn.seed));
    ww = prn.w;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(Math.cos(ww) * pr, Math.sin(ww) * pr);
    ctx.quadraticCurveTo(pr * (1 + prn.reach) * (0.92 + 0.08 * Math.sin(t * 0.6 + prn.seed)), 0, Math.cos(ww) * pr, -Math.sin(ww) * pr);
    ctx.strokeStyle = 'rgba(255, 120, 40, ' + (0.28 * life) + ')';
    ctx.lineWidth = prn.width;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 220, 170, ' + (0.45 * life) + ')';
    ctx.lineWidth = Math.max(0.8, prn.width * 0.35);
    ctx.stroke();
    ctx.restore();
  }
}

function drawPhotosphere(sx, sy, pr, t) {
  var g = ctx.createRadialGradient(sx - pr * 0.12, sy - pr * 0.14, pr * 0.08, sx, sy, pr);
  g.addColorStop(0, '#fffef8');
  g.addColorStop(0.28, '#ffe7a4');
  g.addColorStop(0.62, '#ffc24a');
  g.addColorStop(1, '#ff8c1e');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(sx, sy, pr, 0, TAU);
  ctx.fill();

  var frame = billboard({ x: 0, y: 0, z: 0 });
  var basis = basisFromAxis({ x: 0.04, y: 0.999, z: 0.02 }, 0);
  ctx.save();
  ctx.beginPath();
  ctx.arc(sx, sy, pr, 0, TAU);
  ctx.clip();
  var i;
  for (i = 0; i < sunGrains.length; i++) drawSpot(ctx, sx, sy, pr, { x: 0, y: 0, z: 0 }, SUN_R, basis, frame, sunGrains[i], t);
  for (i = 0; i < sunspots.length; i++) drawSpot(ctx, sx, sy, pr, { x: 0, y: 0, z: 0 }, SUN_R, basis, frame, sunspots[i], t);
  var limb = ctx.createRadialGradient(sx, sy, pr * 0.45, sx, sy, pr);
  limb.addColorStop(0, 'rgba(255, 220, 120, 0)');
  limb.addColorStop(0.72, 'rgba(255, 140, 30, 0.05)');
  limb.addColorStop(0.9, 'rgba(180, 50, 0, 0.28)');
  limb.addColorStop(1, 'rgba(90, 24, 0, 0.72)');
  ctx.fillStyle = limb;
  ctx.fillRect(sx - pr, sy - pr, pr * 2, pr * 2);
  ctx.restore();
}

function pushBody(cfg, pos, spinAng, axis) {
  var scr = project(pos);
  if (!scr) return;
  var spr = cfg.r * scale / scr.z;
  if (!(spr > 0.35)) return;
  var it = item(scr.z, 'body');
  it.sx = scr.x;
  it.sy = scr.y;
  it.spr = spr;
  it.wx = pos.x;
  it.wy = pos.y;
  it.wz = pos.z;
  it.cfg = cfg;
  it.spinAng = spinAng;
  it.ax = axis.x;
  it.ay = axis.y;
  it.az = axis.z;
}

function buildScene(t) {
  nItems = 0;
  var i, p, theta, pos, m, mt, mb, moonAxis, rock, rpos, rscr, rspr, phase, toCam, toSun, bri, it;
  var sunScr = project({ x: 0, y: 0, z: 0 });
  if (sunScr) {
    it = item(sunScr.z, 'sun');
    it.sx = sunScr.x;
    it.sy = sunScr.y;
    it.spr = SUN_R * scale / sunScr.z;
  }
  for (i = 0; i < planets.length; i++) {
    p = planets[i];
    theta = p.phase + (t / p.T) * TAU;
    pos = orbitPosition(p.a, p.e, p.inc, p.node, p.arg, theta);
    pushBody(p, pos, t * p.spin, p.axis);
    if (p.ring === 'saturn') addRings(pos, p.axis, p.r, SATURN_SPANS);
    else if (p.ring === 'uranus') addRings(pos, p.axis, p.r, URANUS_SPANS);
    if (p.moons) {
      for (m = 0; m < p.moons.length; m++) {
        mt = p.moons[m];
        mb = basisFromAxis(p.axis, 0);
        var ang = mt.phase + (t / mt.T) * TAU;
        var ci = Math.cos(mt.inc);
        var sii = Math.sin(mt.inc);
        var ct = Math.cos(ang);
        var st = Math.sin(ang);
        var mpos = add(pos, add(add(mul(mb.ref, mt.dist * ct), mul(mb.east, mt.dist * st * ci)), mul(mb.axis, mt.dist * st * sii)));
        moonAxis = p.axis;
        pushBody({
          r: mt.r,
          color: mt.color,
          soft: 0.08,
          spec: 0.12,
          amb: 0.12
        }, mpos, 0, moonAxis);
      }
    }
  }
  for (i = 0; i < rocks.length; i++) {
    rock = rocks[i];
    rpos = orbitPosition(rock.a, rock.e, rock.inc, rock.node, rock.arg, rock.phase + (t / rock.T) * TAU);
    rscr = project(rpos);
    if (!rscr) continue;
    rspr = Math.max(0.55, rock.r * scale / rscr.z);
    toSun = norm({ x: -rpos.x, y: -rpos.y, z: -rpos.z });
    toCam = norm(sub(eye, rpos));
    phase = dot(toSun, toCam);
    bri = 0.22 + 0.78 * Math.max(0, (phase + 0.2) / 1.2);
    it = item(rscr.z, 'rock');
    it.sx = rscr.x;
    it.sy = rscr.y;
    it.spr = rspr;
    it.col = rock.col;
    it.bri = bri;
  }
}

function drawItems(t) {
  var list = pool;
  var n = nItems;
  var i, it;
  var slice = list.slice(0, n);
  slice.sort(function (a, b) { return a.z - b.z; });
  for (i = 0; i < slice.length; i++) {
    it = slice[i];
    if (it.kind === 'quad') {
      ctx.fillStyle = rgba(it.col, it.a);
      ctx.beginPath();
      ctx.moveTo(it.x0, it.y0);
      ctx.lineTo(it.x1, it.y1);
      ctx.lineTo(it.x2, it.y2);
      ctx.lineTo(it.x3, it.y3);
      ctx.closePath();
      ctx.fill();
    } else if (it.kind === 'rock') {
      ctx.fillStyle = rgba(it.col, it.bri);
      ctx.beginPath();
      ctx.arc(it.sx, it.sy, it.spr, 0, TAU);
      ctx.fill();
    } else if (it.kind === 'sun') {
      drawPhotosphere(it.sx, it.sy, it.spr, t);
    } else if (it.kind === 'body') {
      renderBody(it, t);
    }
  }
}

function drawVignette() {
  var g = ctx.createRadialGradient(w * 0.5, h * 0.5, Math.min(w, h) * 0.52, w * 0.5, h * 0.5, Math.hypot(w, h) * 0.52);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.52)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

function render(t) {
  placeCamera(t);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  var bg = ctx.createRadialGradient(w * 0.5, h * 0.48, 0, w * 0.5, h * 0.5, Math.max(w, h) * 0.72);
  bg.addColorStop(0, '#10162a');
  bg.addColorStop(0.45, '#070912');
  bg.addColorStop(1, '#020204');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);
  drawNebulae();
  drawStars(t);
  drawOrbits();
  var sunScr = project({ x: 0, y: 0, z: 0 });
  if (sunScr) drawSunGlow(sunScr.x, sunScr.y, SUN_R * scale / sunScr.z, t);
  buildScene(t);
  drawItems(t);
  drawVignette();
}

resize();
window.addEventListener('resize', resize);
var started = 0;
render(0);
requestAnimationFrame(function frame(now) {
  if (!started) started = now;
  render((now - started) / 1000);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
