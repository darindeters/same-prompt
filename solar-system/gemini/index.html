<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Solar System</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02010a;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });

  let width = 0;
  let height = 0;
  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Deterministic PRNG for rich procedural stars, asteroid belt, and textures
  let seed = 421337;
  function rand() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  // Generate Pre-rendered Planet Textures (Equirectangular / Spherical Canvas Sprites)
  function createPlanetSprite(p) {
    const size = 256;
    const off = document.createElement('canvas');
    off.width = size;
    off.height = size;
    const c = off.getContext('2d');
    const r = size * 0.42;
    const cx = size * 0.5;
    const cy = size * 0.5;

    c.save();
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    c.clip();

    // Base sphere fill
    const baseGrad = c.createLinearGradient(cx, cy - r, cx, cy + r);
    for (let i = 0; i < p.bands.length; i++) {
      baseGrad.addColorStop(p.bands[i][0], p.bands[i][1]);
    }
    c.fillStyle = baseGrad;
    c.fillRect(cx - r, cy - r, r * 2, r * 2);

    // Procedural features per planet
    if (p.type === 'rocky_crater') {
      // Mercury
      for (let i = 0; i < 45; i++) {
        const a = i * 2.39996;
        const dist = Math.sqrt(i / 45) * r * 0.9;
        const x = cx + Math.cos(a) * dist;
        const y = cy + Math.sin(a) * dist;
        const cr = (3 + (i % 5) * 3.5);
        c.fillStyle = i % 2 === 0 ? 'rgba(45, 30, 75, 0.38)' : 'rgba(255, 225, 255, 0.25)';
        c.beginPath();
        c.arc(x, y, cr, 0, Math.PI * 2);
        c.fill();
      }
    } else if (p.type === 'swirl') {
      // Venus super-saturated golden clouds
      c.lineWidth = 7;
      for (let i = -8; i <= 8; i++) {
        c.strokeStyle = i % 2 === 0 ? 'rgba(255, 240, 120, 0.35)' : 'rgba(220, 70, 0, 0.32)';
        c.beginPath();
        const y0 = cy + i * 11;
        c.moveTo(cx - r, y0);
        c.bezierCurveTo(cx - r * 0.3, y0 - 16, cx + r * 0.3, y0 + 16, cx + r, y0 - 4);
        c.stroke();
      }
    } else if (p.type === 'earth') {
      // Vivid continents
      c.fillStyle = '#00f57a';
      const blobs = [
        [-0.35, -0.35, 0.32, 0.25, 0.4],
        [-0.18, 0.15, 0.22, 0.36, -0.2],
        [0.25, -0.25, 0.38, 0.28, 0.2],
        [0.35, 0.22, 0.25, 0.24, -0.4],
        [0.05, -0.55, 0.3, 0.14, 0.1]
      ];
      blobs.forEach(([bx, by, rx, ry, rot]) => {
        c.save();
        c.translate(cx + bx * r, cy + by * r);
        c.rotate(rot);
        c.beginPath();
        c.ellipse(0, 0, rx * r, ry * r, 0, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#80ff44';
        c.beginPath();
        c.ellipse(-rx * r * 0.2, -ry * r * 0.2, rx * r * 0.55, ry * r * 0.5, 0, 0, Math.PI * 2);
        c.fill();
        c.fillStyle = '#00f57a';
        c.restore();
      });
      // Ice caps
      c.fillStyle = '#e8ffff';
      c.beginPath();
      c.ellipse(cx, cy - r * 0.9, r * 0.55, r * 0.18, 0, 0, Math.PI * 2);
      c.ellipse(cx, cy + r * 0.9, r * 0.55, r * 0.18, 0, 0, Math.PI * 2);
      c.fill();
      // Swirling white clouds
      c.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      c.lineWidth = 6;
      c.lineCap = 'round';
      for (let i = -4; i <= 4; i += 2) {
        c.beginPath();
        const y0 = cy + i * 16;
        c.moveTo(cx - r * 0.7, y0);
        c.quadraticCurveTo(cx, y0 + 14, cx + r * 0.75, y0 - 6);
        c.stroke();
      }
    } else if (p.type === 'mars') {
      // Deep rust patches and polar caps
      c.fillStyle = 'rgba(130, 10, 0, 0.45)';
      c.beginPath();
      c.ellipse(cx - r * 0.2, cy + r * 0.1, r * 0.45, r * 0.22, -0.3, 0, Math.PI * 2);
      c.ellipse(cx + r * 0.35, cy - r * 0.25, r * 0.3, r * 0.18, 0.4, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#fff5ee';
      c.beginPath();
      c.ellipse(cx, cy - r * 0.92, r * 0.4, r * 0.14, 0, 0, Math.PI * 2);
      c.ellipse(cx, cy + r * 0.94, r * 0.35, r * 0.12, 0, 0, Math.PI * 2);
      c.fill();
    } else if (p.type === 'jupiter') {
      // Sharp turbulence & Great Red Spot
      for (let y = -r; y <= r; y += 9) {
        c.strokeStyle = (Math.abs(y) % 18 < 9) ? 'rgba(255, 240, 190, 0.28)' : 'rgba(180, 45, 0, 0.32)';
        c.lineWidth = 4;
        c.beginPath();
        c.moveTo(cx - r, cy + y);
        c.bezierCurveTo(cx - r * 0.3, cy + y + 6, cx + r * 0.3, cy + y - 6, cx + r, cy + y);
        c.stroke();
      }
      // Great Red Spot
      c.save();
      c.translate(cx + r * 0.22, cy + r * 0.28);
      c.rotate(-0.08);
      c.fillStyle = '#ff1e00';
      c.beginPath();
      c.ellipse(0, 0, r * 0.26, r * 0.16, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#ffaa44';
      c.lineWidth = 3;
      c.stroke();
      c.fillStyle = '#ff6622';
      c.beginPath();
      c.ellipse(0, 0, r * 0.14, r * 0.08, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();
    } else if (p.type === 'ice_giant') {
      // Bright atmospheric bands for Uranus / Neptune
      c.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      c.lineWidth = 5;
      for (let i = -3; i <= 3; i++) {
        c.beginPath();
        const y0 = cy + i * 20;
        c.moveTo(cx - r, y0);
        c.quadraticCurveTo(cx, y0 + 10, cx + r, y0);
        c.stroke();
      }
      if (p.spotColor) {
        c.fillStyle = p.spotColor;
        c.beginPath();
        c.ellipse(cx - r * 0.22, cy + r * 0.18, r * 0.2, r * 0.12, 0.1, 0, Math.PI * 2);
        c.fill();
      }
    }

    // Specular inner rim highlight
    const spec = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.05, cx, cy, r);
    spec.addColorStop(0, 'rgba(255, 255, 255, 0.38)');
    spec.addColorStop(0.45, 'rgba(255, 255, 255, 0.0)');
    spec.addColorStop(0.85, 'rgba(0, 0, 15, 0.0)');
    spec.addColorStop(1, 'rgba(0, 0, 20, 0.35)');
    c.fillStyle = spec;
    c.fillRect(cx - r, cy - r, r * 2, r * 2);

    c.restore();
    return off;
  }

  // 8 Planets with vivid saturated palettes, distinct sizes, speeds, moons, and rings
  const planets = [
    {
      name: 'Mercury',
      a: 92, e: 0.06, inc: 0.07, omega: 0.5,
      radius: 9.5, speed: 1.75, phase: 0.4,
      orbitColor: '#c77dff',
      glowColor: '#e0aaff',
      shadowTint: '#1a0633',
      type: 'rocky_crater',
      bands: [
        [0.0, '#f3d5ff'],
        [0.45, '#b565ff'],
        [0.8, '#7b2cbf'],
        [1.0, '#480ca8']
      ],
      moons: []
    },
    {
      name: 'Venus',
      a: 136, e: 0.01, inc: 0.04, omega: 1.8,
      radius: 15.0, speed: 1.25, phase: 2.3,
      orbitColor: '#ffb703',
      glowColor: '#ffdd00',
      shadowTint: '#331200',
      type: 'swirl',
      bands: [
        [0.0, '#fff3b0'],
        [0.35, '#ffbe0b'],
        [0.75, '#fb5607'],
        [1.0, '#9b2226']
      ],
      moons: []
    },
    {
      name: 'Earth',
      a: 188, e: 0.015, inc: 0.0, omega: 0.0,
      radius: 16.5, speed: 0.92, phase: 4.1,
      orbitColor: '#00f5d4',
      glowColor: '#00bbf9',
      shadowTint: '#001538',
      type: 'earth',
      bands: [
        [0.0, '#4cc9f0'],
        [0.3, '#0096c7'],
        [0.7, '#023e8a'],
        [1.0, '#03045e']
      ],
      moons: [
        { dist: 27, radius: 4.2, speed: 4.8, phase: 1.0, color: '#e2eafc', glow: '#a2d2ff' }
      ]
    },
    {
      name: 'Mars',
      a: 242, e: 0.05, inc: 0.035, omega: 3.1,
      radius: 12.5, speed: 0.68, phase: 5.5,
      orbitColor: '#ff2a55',
      glowColor: '#ff4d6d',
      shadowTint: '#2b0008',
      type: 'mars',
      bands: [
        [0.0, '#ff8fa3'],
        [0.35, '#ff4d6d'],
        [0.7, '#c9184a'],
        [1.0, '#590d22']
      ],
      moons: [
        { dist: 19, radius: 2.3, speed: 6.5, phase: 0.3, color: '#ffccd5', glow: '#ff758f' },
        { dist: 25, radius: 1.9, speed: 4.2, phase: 3.4, color: '#ffb3c1', glow: '#ff4d6d' }
      ]
    },
    {
      name: 'Jupiter',
      a: 332, e: 0.025, inc: 0.025, omega: 1.2,
      radius: 33.0, speed: 0.42, phase: 1.1,
      orbitColor: '#ff7b00',
      glowColor: '#ff9e00',
      shadowTint: '#260b00',
      type: 'jupiter',
      bands: [
        [0.0, '#ffbe0b'],
        [0.18, '#fb5607'],
        [0.34, '#ffec99'],
        [0.50, '#e85d04'],
        [0.66, '#ffd166'],
        [0.82, '#d00000'],
        [1.0, '#6a040f']
      ],
      moons: [
        { dist: 45, radius: 3.6, speed: 4.6, phase: 0.2, color: '#ffea00', glow: '#ffaa00' }, // Io
        { dist: 54, radius: 3.3, speed: 3.4, phase: 2.1, color: '#caf0f8', glow: '#00b4d8' }, // Europa
        { dist: 64, radius: 4.5, speed: 2.4, phase: 4.0, color: '#e0aaff', glow: '#9d4edd' }, // Ganymede
        { dist: 75, radius: 4.0, speed: 1.7, phase: 5.2, color: '#ffcad4', glow: '#f28482' }  // Callisto
      ]
    },
    {
      name: 'Saturn',
      a: 432, e: 0.03, inc: 0.045, omega: 2.5,
      radius: 27.0, speed: 0.29, phase: 3.7,
      orbitColor: '#ffe600',
      glowColor: '#ffea00',
      shadowTint: '#291700',
      type: 'swirl',
      bands: [
        [0.0, '#ffffb5'],
        [0.25, '#ffd166'],
        [0.5, '#f77f00'],
        [0.75, '#fcbf49'],
        [1.0, '#9c6644']
      ],
      rings: {
        inner: 1.38,
        outer: 2.48,
        tiltX: 0.36,
        tiltZ: -0.22,
        bands: [
          { rIn: 1.38, rOut: 1.56, color: 'rgba(255, 162, 0, 0.48)' },
          { rIn: 1.58, rOut: 1.94, color: 'rgba(255, 238, 120, 0.88)' },
          { rIn: 1.96, rOut: 2.04, color: 'rgba(255, 90, 0, 0.20)' }, // Cassini division glow
          { rIn: 2.06, rOut: 2.34, color: 'rgba(255, 200, 50, 0.72)' },
          { rIn: 2.36, rOut: 2.48, color: 'rgba(255, 110, 199, 0.45)' }
        ]
      },
      moons: [
        { dist: 74, radius: 4.6, speed: 2.2, phase: 1.5, color: '#ffb703', glow: '#fb8500' }, // Titan
        { dist: 56, radius: 2.8, speed: 3.5, phase: 4.4, color: '#ffffff', glow: '#90e0ef' }  // Enceladus
      ]
    },
    {
      name: 'Uranus',
      a: 522, e: 0.02, inc: 0.02, omega: 4.2,
      radius: 20.0, speed: 0.20, phase: 0.85,
      orbitColor: '#00f5ff',
      glowColor: '#00f5ff',
      shadowTint: '#002233',
      type: 'ice_giant',
      bands: [
        [0.0, '#caffbf'],
        [0.3, '#00f5d4'],
        [0.7, '#00bbf9'],
        [1.0, '#005f73']
      ],
      rings: {
        inner: 1.42,
        outer: 1.78,
        tiltX: 1.25,
        tiltZ: 0.4,
        bands: [
          { rIn: 1.42, rOut: 1.54, color: 'rgba(0, 245, 255, 0.55)' },
          { rIn: 1.62, rOut: 1.78, color: 'rgba(180, 255, 255, 0.42)' }
        ]
      },
      moons: [
        { dist: 42, radius: 2.8, speed: 3.1, phase: 2.7, color: '#a8dadc', glow: '#00f5d4' }
      ]
    },
    {
      name: 'Neptune',
      a: 604, e: 0.01, inc: 0.035, omega: 5.4,
      radius: 19.5, speed: 0.145, phase: 4.9,
      orbitColor: '#7209b7',
      glowColor: '#4361ee',
      shadowTint: '#08002b',
      type: 'ice_giant',
      spotColor: 'rgba(10, 10, 90, 0.55)',
      bands: [
        [0.0, '#4cc9f0'],
        [0.3, '#4361ee'],
        [0.65, '#3a0ca3'],
        [1.0, '#240046']
      ],
      moons: [
        { dist: 40, radius: 3.4, speed: -2.9, phase: 0.9, color: '#ff99c8', glow: '#f72585' } // Triton retrograde
      ]
    }
  ];

  planets.forEach(p => {
    p.sprite = createPlanetSprite(p);
    // Pre-sample orbit curve points in 3D
    p.orbitPoints = [];
    const steps = 140;
    for (let i = 0; i <= steps; i++) {
      const th = (i / steps) * Math.PI * 2;
      p.orbitPoints.push(getOrbitPos(p, th));
    }
  });

  function getOrbitPos(p, theta) {
    const r = (p.a * (1 - p.e * p.e)) / (1 + p.e * Math.cos(theta));
    const x0 = r * Math.cos(theta);
    const z0 = r * Math.sin(theta);
    // Rotate by argument of periapsis omega and orbital inclination
    const cosO = Math.cos(p.omega);
    const sinO = Math.sin(p.omega);
    const x1 = x0 * cosO - z0 * sinO;
    const z1 = x0 * sinO + z0 * cosO;
    const y1 = z1 * Math.sin(p.inc);
    const z2 = z1 * Math.cos(p.inc);
    return { x: x1, y: y1, z: z2 };
  }

  // Rich 3D celestial starfield surrounding the camera
  const stars = [];
  const starPalette = ['#ffffff', '#9bf6ff', '#ffadad', '#fdffb6', '#bdb2ff', '#ffc6ff', '#00f5d4', '#ff70a6'];
  for (let i = 0; i < 950; i++) {
    const u = rand() * 2 - 1;
    const phi = rand() * Math.PI * 2;
    const dist = 1600 + rand() * 1800;
    const sq = Math.sqrt(1 - u * u);
    stars.push({
      x: dist * sq * Math.cos(phi),
      y: dist * u,
      z: dist * sq * Math.sin(phi),
      size: 0.7 + Math.pow(rand(), 2.4) * 2.6,
      color: starPalette[Math.floor(rand() * starPalette.length)],
      twinkleSpeed: 1.2 + rand() * 3.5,
      twinklePhase: rand() * Math.PI * 2
    });
  }

  // Luminous Nebula Clouds in 3D space
  const nebulae = [
    { x: -1200, y: 350, z: -1500, r: 680, c1: 'rgba(131, 56, 236, 0.16)', c2: 'rgba(58, 12, 163, 0)' },
    { x: 1400, y: -280, z: -1300, r: 750, c1: 'rgba(255, 0, 110, 0.13)', c2: 'rgba(131, 56, 236, 0)' },
    { x: 300, y: 650, z: 1500, r: 720, c1: 'rgba(0, 180, 216, 0.14)', c2: 'rgba(3, 4, 94, 0)' },
    { x: -1400, y: -450, z: 1100, r: 650, c1: 'rgba(251, 86, 7, 0.12)', c2: 'rgba(155, 34, 38, 0)' },
    { x: 1100, y: 400, z: 1300, r: 640, c1: 'rgba(0, 245, 212, 0.12)', c2: 'rgba(114, 9, 183, 0)' }
  ];

  // Asteroid Belt between Mars (242) and Jupiter (332)
  const asteroids = [];
  const astColors = ['#ff9ebb', '#b8c0ff', '#ffd6a5', '#caffbf', '#fdffb6'];
  for (let i = 0; i < 380; i++) {
    const a = 272 + rand() * 34;
    const angle = rand() * Math.PI * 2;
    const y = (rand() - 0.5) * 18;
    asteroids.push({
      a,
      angle,
      y,
      speed: 0.52 + (rand() - 0.5) * 0.08,
      size: 1.0 + rand() * 1.9,
      color: astColors[i % astColors.length],
      alpha: 0.45 + rand() * 0.45
    });
  }

  // Camera state & 3D projection helpers
  const cam = {
    pos: { x: 0, y: 0, z: 0 },
    right: { x: 1, y: 0, z: 0 },
    up: { x: 0, y: 1, z: 0 },
    fwd: { x: 0, y: 0, z: 1 },
    fov: 1150,
    scale: 1
  };

  function normalize(v) {
    const l = Math.hypot(v.x, v.y, v.z) || 1;
    return { x: v.x / l, y: v.y / l, z: v.z / l };
  }

  function cross(a, b) {
    return {
      x: a.y * b.z - a.z * b.y,
      y: a.z * b.x - a.x * b.z,
      z: a.x * b.y - a.y * b.x
    };
  }

  function updateCamera(t) {
    // Slowly moving, cinematic 3D orbital camera that sweeps around and pitches smoothly
    const yaw = t * 0.11 + 0.65;
    const pitch = 0.54 + 0.25 * Math.sin(t * 0.065);
    const dist = 1260 - 115 * Math.cos(t * 0.05);
    const roll = 0.08 * Math.sin(t * 0.045);

    cam.pos.x = dist * Math.cos(pitch) * Math.sin(yaw);
    cam.pos.y = dist * Math.sin(pitch);
    cam.pos.z = dist * Math.cos(pitch) * Math.cos(yaw);

    // Subtle pan around the inner solar system
    const target = {
      x: 24 * Math.cos(t * 0.08),
      y: 12 * Math.sin(t * 0.06),
      z: 24 * Math.sin(t * 0.08)
    };

    cam.fwd = normalize({
      x: target.x - cam.pos.x,
      y: target.y - cam.pos.y,
      z: target.z - cam.pos.z
    });

    const worldUp = { x: Math.sin(roll), y: Math.cos(roll), z: 0 };
    cam.right = normalize(cross(cam.fwd, worldUp));
    cam.up = cross(cam.right, cam.fwd);

    const minDim = Math.min(width, height);
    cam.scale = minDim / 1080;
    cam.fov = 1140 * cam.scale;
  }

  function project(pt) {
    const dx = pt.x - cam.pos.x;
    const dy = pt.y - cam.pos.y;
    const dz = pt.z - cam.pos.z;

    const cx = dx * cam.right.x + dy * cam.right.y + dz * cam.right.z;
    const cy = dx * cam.up.x + dy * cam.up.y + dz * cam.up.z;
    const cz = dx * cam.fwd.x + dy * cam.fwd.y + dz * cam.fwd.z;

    if (cz <= 50) return null;
    const perspective = cam.fov / cz;
    return {
      x: width * 0.5 + cx * perspective,
      y: height * 0.5 - cy * perspective,
      z: cz,
      scale: perspective,
      cx,
      cy
    };
  }

  function drawBackground(t) {
    // Deep saturated cosmic background
    const bg = ctx.createRadialGradient(
      width * 0.5, height * 0.5, 20 * cam.scale,
      width * 0.5, height * 0.5, Math.max(width, height) * 0.85
    );
    bg.addColorStop(0, '#0d0428');
    bg.addColorStop(0.5, '#060216');
    bg.addColorStop(1, '#010008');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    // Nebulae
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < nebulae.length; i++) {
      const n = nebulae[i];
      const p = project({
        x: cam.pos.x + n.x,
        y: cam.pos.y + n.y,
        z: cam.pos.z + n.z
      });
      if (!p) continue;
      const nr = n.r * p.scale;
      if (p.x + nr < 0 || p.x - nr > width || p.y + nr < 0 || p.y - nr > height) continue;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, nr);
      g.addColorStop(0, n.c1);
      g.addColorStop(1, n.c2);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, nr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Stars (skybox anchored to camera orientation)
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const p = project({
        x: cam.pos.x + s.x,
        y: cam.pos.y + s.y,
        z: cam.pos.z + s.z
      });
      if (!p) continue;
      if (p.x < -10 || p.x > width + 10 || p.y < -10 || p.y > height + 10) continue;
      const twinkle = 0.55 + 0.45 * Math.sin(t * s.twinkleSpeed + s.twinklePhase);
      const sr = s.size * cam.scale * (0.8 + 0.4 * twinkle);
      ctx.globalAlpha = twinkle;
      ctx.fillStyle = s.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, sr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawOrbits(planetStates) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const pts = p.orbitPoints;
      const projPts = [];
      for (let j = 0; j < pts.length; j++) {
        const pr = project(pts[j]);
        if (pr) projPts.push(pr);
      }
      if (projPts.length < 2) continue;

      // Full base orbit ring
      ctx.strokeStyle = p.orbitColor;
      ctx.globalAlpha = 0.24;
      ctx.lineWidth = 1.6 * cam.scale;
      ctx.beginPath();
      ctx.moveTo(projPts[0].x, projPts[0].y);
      for (let j = 1; j < projPts.length; j++) {
        ctx.lineTo(projPts[j].x, projPts[j].y);
      }
      ctx.stroke();

      // Vivid glowing orbital trail behind each planet
      const currentTheta = planetStates[i].theta;
      const trailSteps = 38;
      const trailArc = 1.35; // radians behind the planet
      let prev = null;
      for (let s = 0; s <= trailSteps; s++) {
        const frac = s / trailSteps;
        const th = currentTheta - (1 - frac) * trailArc;
        const pos = getOrbitPos(p, th);
        const pr = project(pos);
        if (pr && prev) {
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(pr.x, pr.y);
          ctx.strokeStyle = p.orbitColor;
          ctx.globalAlpha = frac * frac * 0.92;
          ctx.lineWidth = (1.2 + frac * 3.8) * cam.scale;
          ctx.stroke();
        }
        prev = pr;
      }
    }
    ctx.restore();
  }

  function drawSun(sunProj, t) {
    const r = 50 * sunProj.scale;
    const x = sunProj.x;
    const y = sunProj.y;

    ctx.save();
    ctx.globalCompositeOperation = 'screen';

    // Wide solar corona glow
    const outerGlow = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 4.8);
    outerGlow.addColorStop(0.0, 'rgba(255, 250, 200, 1)');
    outerGlow.addColorStop(0.18, 'rgba(255, 195, 0, 0.92)');
    outerGlow.addColorStop(0.42, 'rgba(255, 85, 0, 0.52)');
    outerGlow.addColorStop(0.72, 'rgba(199, 0, 57, 0.18)');
    outerGlow.addColorStop(1.0, 'rgba(120, 0, 180, 0)');
    ctx.fillStyle = outerGlow;
    ctx.beginPath();
    ctx.arc(x, y, r * 4.8, 0, Math.PI * 2);
    ctx.fill();

    // Animated solar corona rays / prominences
    const numRays = 16;
    for (let i = 0; i < numRays; i++) {
      const angle = (i / numRays) * Math.PI * 2 + t * 0.12;
      const pulse = 0.78 + 0.22 * Math.sin(t * 2.4 + i * 1.7);
      const rayLen = r * (1.55 + 0.55 * pulse);
      const spread = r * 0.28;

      const grad = ctx.createLinearGradient(
        x, y,
        x + Math.cos(angle) * rayLen,
        y + Math.sin(angle) * rayLen
      );
      grad.addColorStop(0, 'rgba(255, 230, 100, 0.65)');
      grad.addColorStop(0.5, 'rgba(255, 100, 0, 0.35)');
      grad.addColorStop(1, 'rgba(255, 0, 80, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(
        x + Math.cos(angle - 0.22) * spread,
        y + Math.sin(angle - 0.22) * spread
      );
      ctx.lineTo(
        x + Math.cos(angle) * rayLen,
        y + Math.sin(angle) * rayLen
      );
      ctx.lineTo(
        x + Math.cos(angle + 0.22) * spread,
        y + Math.sin(angle + 0.22) * spread
      );
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();

    // Core sun sphere
    const coreGrad = ctx.createRadialGradient(
      x - r * 0.2, y - r * 0.2, r * 0.05,
      x, y, r
    );
    coreGrad.addColorStop(0.0, '#ffffff');
    coreGrad.addColorStop(0.35, '#fff75e');
    coreGrad.addColorStop(0.72, '#ff9e00');
    coreGrad.addColorStop(0.92, '#ff4800');
    coreGrad.addColorStop(1.0, '#d00000');

    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawRingHalf(state, isFront) {
    const p = state.planet;
    if (!p.rings) return;

    const ring = p.rings;
    const steps = 64;
    const startIdx = isFront ? 0 : steps / 2;
    const endIdx = isFront ? steps / 2 : steps;

    // Basis vectors for ring plane
    const cosX = Math.cos(ring.tiltX);
    const sinX = Math.sin(ring.tiltX);
    const cosZ = Math.cos(ring.tiltZ);
    const sinZ = Math.sin(ring.tiltZ);

    function ringPoint3D(radius, angle) {
      const lx = Math.cos(angle) * radius;
      const lz = Math.sin(angle) * radius;
      // Rotate ring plane
      const y1 = -lz * sinX;
      const z1 = lz * cosX;
      const x2 = lx * cosZ - y1 * sinZ;
      const y2 = lx * sinZ + y1 * cosZ;
      return {
        x: state.pos.x + x2,
        y: state.pos.y + y2,
        z: state.pos.z + z1
      };
    }

    // Determine which half of the ring is closer to the camera than the planet center
    const testPt0 = project(ringPoint3D(p.radius * ring.outer, Math.PI * 0.5));
    const frontSign = (testPt0 && testPt0.z < state.proj.z) ? 1 : -1;

    ctx.save();
    for (let b = 0; b < ring.bands.length; b++) {
      const band = ring.bands[b];
      const rMid = p.radius * ((band.rIn + band.rOut) * 0.5);
      const rThick = p.radius * (band.rOut - band.rIn) * state.proj.scale;

      ctx.beginPath();
      let started = false;
      for (let i = startIdx; i <= endIdx; i++) {
        const tFrac = (i / (steps / 2)) * Math.PI;
        const angle = frontSign > 0 ? tFrac : tFrac + Math.PI;
        const pt3 = ringPoint3D(rMid, angle);
        const pr = project(pt3);
        if (!pr) continue;
        if (!started) {
          ctx.moveTo(pr.x, pr.y);
          started = true;
        } else {
          ctx.lineTo(pr.x, pr.y);
        }
      }
      ctx.strokeStyle = band.color;
      ctx.lineWidth = Math.max(1.2, rThick);
      ctx.lineCap = 'butt';
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlanet(state, sunProj) {
    const p = state.planet;
    const pr = state.proj;
    const r = Math.max(2.5, p.radius * pr.scale);

    // Back half of rings
    if (p.rings) {
      drawRingHalf(state, false);
    }

    // Vivid outer atmosphere halo
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const halo = ctx.createRadialGradient(pr.x, pr.y, r * 0.65, pr.x, pr.y, r * 2.15);
    halo.addColorStop(0, p.glowColor + '99');
    halo.addColorStop(0.5, p.glowColor + '33');
    halo.addColorStop(1, p.glowColor + '00');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r * 2.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Direction toward the Sun on screen & in 3D for dynamic lighting
    const dxSun = sunProj.x - pr.x;
    const dySun = sunProj.y - pr.y;
    const sunAngle2D = Math.atan2(dySun, dxSun);

    // Draw pre-rendered high-saturation planet sprite
    ctx.save();
    ctx.translate(pr.x, pr.y);
    const spriteRadius = 256 * 0.42;
    const drawSize = (r / spriteRadius) * 256;
    ctx.drawImage(p.sprite, -drawSize * 0.5, -drawSize * 0.5, drawSize, drawSize);

    // 3D Spherical Lighting & Night-Side Shadow facing away from the Sun
    // Compute how much of the sunlit hemisphere faces the camera
    const toSun3D = normalize({
      x: -state.pos.x,
      y: -state.pos.y,
      z: -state.pos.z
    });
    const toCam3D = normalize({
      x: cam.pos.x - state.pos.x,
      y: cam.pos.y - state.pos.y,
      z: cam.pos.z - state.pos.z
    });
    const lightDot = toSun3D.x * toCam3D.x + toSun3D.y * toCam3D.y + toSun3D.z * toCam3D.z; // -1 (backlit) to +1 (fully lit)

    ctx.beginPath();
    ctx.arc(0, 0, r * 1.01, 0, Math.PI * 2);
    ctx.clip();

    ctx.rotate(sunAngle2D);
    const lightOffset = r * (0.48 + 0.35 * lightDot);
    const shadeGrad = ctx.createRadialGradient(
      lightOffset, 0, r * 0.12,
      -r * 0.25, 0, r * 1.35
    );
    shadeGrad.addColorStop(0.0, 'rgba(255, 255, 240, 0.22)');
    shadeGrad.addColorStop(0.45, 'rgba(0, 0, 0, 0.0)');
    shadeGrad.addColorStop(0.78, p.shadowTint + 'aa');
    shadeGrad.addColorStop(1.0, p.shadowTint + 'ee');

    ctx.fillStyle = shadeGrad;
    ctx.fillRect(-r * 1.2, -r * 1.2, r * 2.4, r * 2.4);

    // Bright sunlit rim crescent
    ctx.strokeStyle = p.glowColor;
    ctx.globalAlpha = 0.65;
    ctx.lineWidth = Math.max(1.2, r * 0.1);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.96, -Math.PI * 0.44, Math.PI * 0.44);
    ctx.stroke();

    ctx.restore();

    // Front half of rings
    if (p.rings) {
      drawRingHalf(state, true);
    }
  }

  function drawMoon(mState, sunProj) {
    const pr = mState.proj;
    const r = Math.max(1.6, mState.moon.radius * pr.scale);

    ctx.save();
    // Moon glow
    ctx.globalCompositeOperation = 'screen';
    const glow = ctx.createRadialGradient(pr.x, pr.y, r * 0.3, pr.x, pr.y, r * 2.4);
    glow.addColorStop(0, mState.moon.glow + 'aa');
    glow.addColorStop(1, mState.moon.glow + '00');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r * 2.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Lit moon body
    const dxSun = sunProj.x - pr.x;
    const dySun = sunProj.y - pr.y;
    const ang = Math.atan2(dySun, dxSun);

    const g = ctx.createRadialGradient(
      pr.x + Math.cos(ang) * r * 0.35,
      pr.y + Math.sin(ang) * r * 0.35,
      r * 0.1,
      pr.x,
      pr.y,
      r
    );
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, mState.moon.color);
    g.addColorStop(1, '#12082b');

    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  let startTime = null;

  function render(now) {
    if (startTime === null) startTime = now;
    const t = (now - startTime) * 0.001;

    updateCamera(t);
    drawBackground(t);

    // Compute 3D positions of all planets and moons
    const renderQueue = [];
    const planetStates = [];

    const sunProj = project({ x: 0, y: 0, z: 0 });
    if (sunProj) {
      renderQueue.push({
        type: 'sun',
        z: sunProj.z,
        proj: sunProj
      });
    }

    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const theta = p.phase + t * p.speed;
      const pos = getOrbitPos(p, theta);
      const proj = project(pos);
      const state = { planet: p, pos, proj, theta };
      planetStates.push(state);

      if (proj) {
        renderQueue.push({
          type: 'planet',
          z: proj.z,
          state
        });
      }

      // Moons orbiting the planet
      for (let m = 0; m < p.moons.length; m++) {
        const moon = p.moons[m];
        const mTheta = moon.phase + t * moon.speed;
        const mPos = {
          x: pos.x + Math.cos(mTheta) * moon.dist,
          y: pos.y + Math.sin(mTheta) * moon.dist * 0.22,
          z: pos.z + Math.sin(mTheta) * moon.dist
        };
        const mProj = project(mPos);
        if (mProj) {
          renderQueue.push({
            type: 'moon',
            z: mProj.z,
            state: { moon, pos: mPos, proj: mProj }
          });
        }
      }
    }

    // Draw orbital paths & glowing trails first
    drawOrbits(planetStates);

    // Add Asteroid Belt particles into depth-sorted queue
    for (let i = 0; i < asteroids.length; i++) {
      const ast = asteroids[i];
      const th = ast.angle + t * ast.speed;
      const pos = {
        x: Math.cos(th) * ast.a,
        y: ast.y,
        z: Math.sin(th) * ast.a
      };
      const pr = project(pos);
      if (pr) {
        renderQueue.push({
          type: 'asteroid',
          z: pr.z,
          ast,
          proj: pr
        });
      }
    }

    // Painter's algorithm: sort back-to-front by camera-space Z depth
    renderQueue.sort((a, b) => b.z - a.z);

    for (let i = 0; i < renderQueue.length; i++) {
      const item = renderQueue[i];
      if (item.type === 'sun') {
        drawSun(item.proj, t);
      } else if (item.type === 'planet' && sunProj) {
        drawPlanet(item.state, sunProj);
      } else if (item.type === 'moon' && sunProj) {
        drawMoon(item.state, sunProj);
      } else if (item.type === 'asteroid') {
        const r = Math.max(0.8, item.ast.size * item.proj.scale);
        ctx.fillStyle = item.ast.color;
        ctx.globalAlpha = item.ast.alpha;
        ctx.beginPath();
        ctx.arc(item.proj.x, item.proj.y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
