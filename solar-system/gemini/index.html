<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar System</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020308;
    user-select: none;
    cursor: default;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgl', {
    alpha: false,
    antialias: true,
    depth: true,
    powerPreference: 'high-performance'
  });

  if (!gl) return;

  // Enable standard derivatives if available for ultra-crisp procedural shading
  gl.getExtension('OES_standard_derivatives');
  const uintExt = gl.getExtension('OES_element_index_uint');

  // --- Linear Algebra Utilities ---
  const mat4 = {
    create() {
      const out = new Float32Array(16);
      out[0] = 1; out[5] = 1; out[10] = 1; out[15] = 1;
      return out;
    },
    perspective(out, fovy, aspect, near, far) {
      const f = 1.0 / Math.tan(fovy / 2);
      const nf = 1 / (near - far);
      out.fill(0);
      out[0] = f / aspect;
      out[5] = f;
      out[10] = (far + near) * nf;
      out[11] = -1;
      out[14] = (2 * far * near) * nf;
      return out;
    },
    lookAt(out, eye, center, up) {
      let x0, x1, x2, y0, y1, y2, z0, z1, z2, len;
      const eyex = eye[0], eyey = eye[1], eyez = eye[2];
      const upx = up[0], upy = up[1], upz = up[2];
      const centerx = center[0], centery = center[1], centerz = center[2];

      z0 = eyex - centerx;
      z1 = eyey - centery;
      z2 = eyez - centerz;
      len = 1 / (Math.hypot(z0, z1, z2) || 1);
      z0 *= len; z1 *= len; z2 *= len;

      x0 = upy * z2 - upz * z1;
      x1 = upz * z0 - upx * z2;
      x2 = upx * z1 - upy * z0;
      len = Math.hypot(x0, x1, x2);
      if (!len) {
        x0 = 0; x1 = 0; x2 = 0;
      } else {
        len = 1 / len;
        x0 *= len; x1 *= len; x2 *= len;
      }

      y0 = z1 * x2 - z2 * x1;
      y1 = z2 * x0 - z0 * x2;
      y2 = z0 * x1 - z1 * x0;
      len = Math.hypot(y0, y1, y2);
      if (!len) {
        y0 = 0; y1 = 0; y2 = 0;
      } else {
        len = 1 / len;
        y0 *= len; y1 *= len; y2 *= len;
      }

      out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
      out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
      out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
      out[12] = -(x0 * eyex + x1 * eyey + x2 * eyez);
      out[13] = -(y0 * eyex + y1 * eyey + y2 * eyez);
      out[14] = -(z0 * eyex + z1 * eyey + z2 * eyez);
      out[15] = 1;
      return out;
    },
    multiply(out, a, b) {
      const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
      const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
      const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
      const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];

      let b0 = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
      out[0] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[2] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;

      b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
      out[4] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[5] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[6] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[7] = b0*a03 + b1*a13 + b2*a23 + b3*a33;

      b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
      out[8] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[9] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[10] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[11] = b0*a03 + b1*a13 + b2*a23 + b3*a33;

      b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
      out[12] = b0*a00 + b1*a10 + b2*a20 + b3*a30;
      out[13] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
      out[14] = b0*a02 + b1*a12 + b2*a22 + b3*a32;
      out[15] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
      return out;
    },
    fromTranslationRotationScale(out, pos, tiltX, tiltZ, spinY, scale) {
      // Compose Translation * RotateZ(tiltZ) * RotateX(tiltX) * RotateY(spinY) * Scale
      const cz = Math.cos(tiltZ), sz = Math.sin(tiltZ);
      const cx = Math.cos(tiltX), sx = Math.sin(tiltX);
      const cy = Math.cos(spinY), sy = Math.sin(spinY);

      // Rz * Rx
      const r00 = cz, r01 = -sz * cx, r02 = sz * sx;
      const r10 = sz, r11 = cz * cx,  r12 = -cz * sx;
      const r20 = 0,  r21 = sx,       r22 = cx;

      // (Rz * Rx) * Ry
      const m00 = r00 * cy + r02 * sy;
      const m01 = r01;
      const m02 = -r00 * sy + r02 * cy;

      const m10 = r10 * cy + r12 * sy;
      const m11 = r11;
      const m12 = -r10 * sy + r12 * cy;

      const m20 = r20 * cy + r22 * sy;
      const m21 = r21;
      const m22 = -r20 * sy + r22 * cy;

      out[0] = m00 * scale;
      out[1] = m10 * scale;
      out[2] = m20 * scale;
      out[3] = 0;

      out[4] = m01 * scale;
      out[5] = m11 * scale;
      out[6] = m21 * scale;
      out[7] = 0;

      out[8] = m02 * scale;
      out[9] = m12 * scale;
      out[10] = m22 * scale;
      out[11] = 0;

      out[12] = pos[0];
      out[13] = pos[1];
      out[14] = pos[2];
      out[15] = 1;
      return out;
    }
  };

  // --- Shader Compilation Helper ---
  function createProgram(vsSource, fsSource) {
    const vs = gl.createShader(gl.VERTEX_SHADER);
    gl.shaderSource(vs, vsSource);
    gl.compileShader(vs);
    if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
      console.error('VS Error:', gl.getShaderInfoLog(vs));
    }

    const fs = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(fs, fsSource);
    gl.compileShader(fs);
    if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
      console.error('FS Error:', gl.getShaderInfoLog(fs));
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      console.error('Link Error:', gl.getProgramInfoLog(prog));
    }
    return prog;
  }

  // --- Common GLSL 3D Simplex / Value Noise Snippet ---
  const GLSL_NOISE = `
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

    float snoise(vec3 v) {
      const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
      const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy));
      vec3 x0 = v - i + dot(i, C.xxx);
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min(g.xyz, l.zxy);
      vec3 i2 = max(g.xyz, l.zxy);
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod289(i);
      vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
              + i.y + vec4(0.0, i1.y, i2.y, 1.0))
              + i.x + vec4(0.0, i1.x, i2.x, 1.0));
      float n_ = 0.142857142857;
      vec3 ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_);
      vec4 x = x_ * ns.x + ns.yyyy;
      vec4 y = y_ * ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4(x.xy, y.xy);
      vec4 b1 = vec4(x.zw, y.zw);
      vec4 s0 = floor(b0) * 2.0 + 1.0;
      vec4 s1 = floor(b1) * 2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
      vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
      vec3 p0 = vec3(a0.xy, h.x);
      vec3 p1 = vec3(a0.zw, h.y);
      vec3 p2 = vec3(a1.xy, h.z);
      vec3 p3 = vec3(a1.zw, h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }

    float fbm(vec3 p) {
      float f = 0.0;
      float amp = 0.5;
      for (int i = 0; i < 4; i++) {
        f += amp * snoise(p);
        p = p * 2.03 + vec3(13.1, 7.7, 3.3);
        amp *= 0.5;
      }
      return f;
    }
  `;

  // --- 1. Background Nebula & Galactic Dust Dome Shader ---
  const bgProgram = createProgram(`
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = aPos;
      gl_Position = vec4(aPos, 0.9999, 1.0);
    }
  `, `
    precision highp float;
    varying vec2 vUv;
    uniform vec3 uCamForward;
    uniform vec3 uCamRight;
    uniform vec3 uCamUp;
    uniform float uAspect;
    uniform float uTime;
    ${GLSL_NOISE}

    void main() {
      vec3 rd = normalize(uCamForward * 1.65 + uCamRight * (vUv.x * uAspect) + uCamUp * vUv.y);

      // Deep cosmic gradient
      vec3 col = vec3(0.005, 0.008, 0.02);

      // Galactic plane band tilted in sky
      vec3 galCoord = vec3(
        rd.x * 0.86 - rd.y * 0.5,
        rd.x * 0.5 + rd.y * 0.86,
        rd.z
      );
      float band = exp(-abs(galCoord.y) * 4.2);
      float n1 = fbm(galCoord * 2.5 + vec3(0.0, 0.0, 1.2));
      float n2 = fbm(galCoord * 5.5 - vec3(n1 * 0.8));
      float dustRift = smoothstep(-0.2, 0.35, fbm(galCoord * 4.2 + vec3(4.0)));

      vec3 nebulaWarm = vec3(0.16, 0.08, 0.22) * smoothstep(-0.3, 0.6, n1);
      vec3 nebulaCool = vec3(0.03, 0.11, 0.24) * smoothstep(-0.2, 0.7, n2);
      vec3 coreGlow = vec3(0.22, 0.15, 0.10) * pow(max(0.0, dot(galCoord, normalize(vec3(0.7, 0.0, -0.7)))), 3.0);

      col += (nebulaWarm + nebulaCool + coreGlow) * band * (0.35 + 0.65 * dustRift) * 0.55;

      // Subtle vignette
      float vig = 1.0 - 0.28 * dot(vUv, vUv);
      col *= clamp(vig, 0.0, 1.0);

      gl_FragColor = vec4(col, 1.0);
    }
  `);

  // --- 2. Planet & Sun Surface Shader ---
  const planetProgram = createProgram(`
    attribute vec3 aPos;
    varying vec3 vLocalPos;
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;

    uniform mat4 uModel;
    uniform mat4 uVP;
    uniform mat4 uRotOnly;

    void main() {
      vLocalPos = aPos;
      vec4 wp = uModel * vec4(aPos, 1.0);
      vWorldPos = wp.xyz;
      vWorldNormal = normalize((uRotOnly * vec4(aPos, 0.0)).xyz);
      gl_Position = uVP * wp;
    }
  `, `
    precision highp float;
    varying vec3 vLocalPos;
    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;

    uniform int uPlanetId;
    uniform float uTime;
    uniform vec3 uCamPos;
    uniform vec3 uPlanetCenter;
    uniform float uPlanetRadius;

    ${GLSL_NOISE}

    void main() {
      vec3 N = normalize(vWorldNormal);
      vec3 p = normalize(vLocalPos);
      vec3 V = normalize(uCamPos - vWorldPos);

      // Sun is ID 0
      if (uPlanetId == 0) {
        float gran1 = fbm(p * 6.5 + vec3(uTime * 0.18, -uTime * 0.14, uTime * 0.1));
        float gran2 = snoise(p * 18.0 - vec3(uTime * 0.35));
        float spots = snoise(p * 3.2 + vec3(0.0, uTime * 0.08, 0.0));
        float heat = clamp(0.58 + 0.32 * gran1 + 0.15 * gran2 - 0.18 * smoothstep(0.45, 0.75, spots), 0.0, 1.2);

        float ndv = max(0.0, dot(N, V));
        // Limb darkening with fiery rim
        vec3 coreCol = vec3(1.0, 0.97, 0.82);
        vec3 midCol  = vec3(1.0, 0.65, 0.14);
        vec3 edgeCol = vec3(0.92, 0.24, 0.03);

        vec3 col = mix(edgeCol, midCol, pow(ndv, 0.45));
        col = mix(col, coreCol, smoothstep(0.35, 1.0, heat * (0.55 + 0.45 * ndv)));
        // Bright solar prominence rim
        col += vec3(1.0, 0.45, 0.1) * pow(1.0 - ndv, 3.0) * 0.9;
        gl_FragColor = vec4(col, 1.0);
        return;
      }

      // Direction toward the Sun at origin (0,0,0)
      vec3 L = normalize(-vWorldPos);
      float ndl = dot(N, L);
      float ndv = max(0.0, dot(N, V));
      float diff = smoothstep(-0.18, 0.88, ndl);
      // Ambient floor so night-sides remain subtly readable against deep space
      float light = mix(0.11, 1.0, diff);

      vec3 surfaceCol = vec3(0.5);
      vec3 atmoCol = vec3(0.0);
      float specIntensity = 0.0;
      float roughness = 32.0;
      vec3 nightLights = vec3(0.0);

      if (uPlanetId == 1) {
        // MERCURY: cratered silicate regolith
        float c1 = fbm(p * 5.0);
        float c2 = abs(snoise(p * 14.0));
        float craters = smoothstep(0.15, 0.55, c2);
        surfaceCol = mix(vec3(0.38, 0.36, 0.35), vec3(0.68, 0.65, 0.62), 0.5 + 0.5 * c1);
        surfaceCol *= (0.78 + 0.22 * craters);
        atmoCol = vec3(0.45, 0.42, 0.38) * 0.15;
      }
      else if (uPlanetId == 2) {
        // VENUS: thick golden sulfuric cloud bands with swirling super-rotation
        vec3 q = vec3(p.x, p.y * 2.2, p.z);
        float swirl = fbm(q * 3.0 + vec3(uTime * 0.05, 0.0, 0.0));
        float bands = sin(p.y * 9.0 + swirl * 3.2) * 0.5 + 0.5;
        surfaceCol = mix(vec3(0.76, 0.50, 0.22), vec3(0.97, 0.84, 0.55), bands * 0.7 + swirl * 0.3);
        atmoCol = vec3(1.0, 0.76, 0.38) * 0.65;
      }
      else if (uPlanetId == 3) {
        // EARTH: oceans, continents, polar ice caps, dynamic cloud layer & city glow on nightside
        float cont = fbm(p * 2.6 + vec3(1.4, -0.8, 2.1));
        float detail = snoise(p * 9.0) * 0.12;
        float height = cont + detail;
        float isLand = smoothstep(0.02, 0.08, height);
        float ice = smoothstep(0.70, 0.85, abs(p.y) + 0.12 * cont);

        vec3 ocean = mix(vec3(0.03, 0.16, 0.44), vec3(0.06, 0.38, 0.68), smoothstep(-0.35, 0.04, height));
        vec3 lowland = vec3(0.14, 0.42, 0.18);
        vec3 highland = vec3(0.56, 0.46, 0.28);
        vec3 mountain = vec3(0.75, 0.73, 0.70);

        vec3 land = mix(lowland, highland, smoothstep(0.06, 0.32, height + abs(p.y) * 0.15));
        land = mix(land, mountain, smoothstep(0.32, 0.52, height));

        surfaceCol = mix(ocean, land, isLand);
        surfaceCol = mix(surfaceCol, vec3(0.95, 0.97, 1.0), ice);

        // Clouds
        float clouds = smoothstep(0.08, 0.55, fbm(p * 3.8 + vec3(uTime * 0.04, 0.0, -uTime * 0.02)));
        surfaceCol = mix(surfaceCol, vec3(0.98, 0.99, 1.0), clouds * 0.72);

        specIntensity = (1.0 - isLand) * (1.0 - clouds) * (1.0 - ice) * 0.85;
        roughness = 28.0;
        atmoCol = vec3(0.24, 0.62, 1.0) * 0.85;

        // Subtle golden city clusters on dark side continents
        float cityMask = isLand * (1.0 - ice) * (1.0 - clouds) * smoothstep(0.35, 0.65, snoise(p * 20.0));
        nightLights = vec3(1.0, 0.72, 0.32) * cityMask * smoothstep(0.05, -0.35, ndl) * 0.45;
      }
      else if (uPlanetId == 4) {
        // MARS: rusty iron oxide plains, dark basaltic basins (Syrtis Major), and polar ice caps
        float terrain = fbm(p * 3.2 + vec3(4.2));
        float darkBasin = smoothstep(-0.4, 0.15, terrain);
        vec3 rust = vec3(0.84, 0.37, 0.18);
        vec3 ochre = vec3(0.92, 0.58, 0.34);
        vec3 basalt = vec3(0.42, 0.20, 0.13);

        surfaceCol = mix(basalt, rust, darkBasin);
        surfaceCol = mix(surfaceCol, ochre, smoothstep(0.15, 0.55, terrain));
        float polarIce = smoothstep(0.82, 0.91, abs(p.y) + 0.06 * snoise(p * 8.0));
        surfaceCol = mix(surfaceCol, vec3(0.95, 0.92, 0.90), polarIce);
        atmoCol = vec3(0.92, 0.48, 0.26) * 0.42;
      }
      else if (uPlanetId == 5) {
        // JUPITER: rich zonal bands, turbulent eddies, and the Great Red Spot
        float turb = fbm(vec3(p.x * 2.5, p.y * 8.0, p.z * 2.5)) * 0.12;
        float lat = p.y + turb;
        float b1 = sin(lat * 26.0);
        float b2 = cos(lat * 13.0 + 0.8);

        vec3 zone = vec3(0.93, 0.86, 0.74);
        vec3 beltDark = vec3(0.66, 0.37, 0.21);
        vec3 beltWarm = vec3(0.84, 0.58, 0.38);

        surfaceCol = mix(beltWarm, zone, smoothstep(-0.6, 0.5, b1));
        surfaceCol = mix(surfaceCol, beltDark, smoothstep(0.35, 0.85, b2));

        // Great Red Spot at southern latitude
        vec3 spotPos = normalize(vec3(0.82, -0.36, 0.44));
        float distSpot = length((p - spotPos) * vec3(1.0, 1.85, 1.0));
        float spotMask = smoothstep(0.32, 0.08, distSpot);
        float spotSwirl = snoise(p * 14.0 + vec3(uTime * 0.1));
        vec3 redSpotCol = mix(vec3(0.82, 0.24, 0.14), vec3(0.95, 0.48, 0.28), 0.5 + 0.5 * spotSwirl);
        surfaceCol = mix(surfaceCol, redSpotCol, spotMask * 0.9);

        atmoCol = vec3(0.90, 0.72, 0.50) * 0.45;
      }
      else if (uPlanetId == 6) {
        // SATURN: silky golden-butterscotch atmospheric bands + ring shadow cast on sphere
        float turb = fbm(vec3(p.x * 2.0, p.y * 10.0, p.z * 2.0)) * 0.05;
        float lat = p.y + turb;
        float bands = sin(lat * 22.0) * 0.5 + 0.5;
        float subBands = cos(lat * 45.0) * 0.5 + 0.5;

        vec3 cA = vec3(0.94, 0.84, 0.62);
        vec3 cB = vec3(0.79, 0.66, 0.45);
        vec3 pole = vec3(0.56, 0.58, 0.54);

        surfaceCol = mix(cB, cA, bands * 0.75 + subBands * 0.25);
        surfaceCol = mix(surfaceCol, pole, smoothstep(0.72, 0.96, abs(p.y)));
        atmoCol = vec3(0.95, 0.82, 0.56) * 0.45;
      }
      else if (uPlanetId == 7) {
        // URANUS: serene cyan-aquamarine ice giant with subtle polar hood
        float lat = p.y + 0.03 * snoise(p * 4.0);
        float bands = sin(lat * 16.0) * 0.5 + 0.5;
        vec3 aqua = vec3(0.46, 0.86, 0.91);
        vec3 paleCyan = vec3(0.68, 0.94, 0.96);
        surfaceCol = mix(aqua, paleCyan, bands * 0.4 + smoothstep(0.3, 0.9, abs(lat)) * 0.45);
        atmoCol = vec3(0.45, 0.92, 1.0) * 0.65;
      }
      else if (uPlanetId == 8) {
        // NEPTUNE: deep cobalt-azure with high-altitude methane cirrus streaks & dark vortex
        float turb = fbm(vec3(p.x * 3.0, p.y * 9.0, p.z * 3.0)) * 0.08;
        float lat = p.y + turb;
        float bands = sin(lat * 20.0) * 0.5 + 0.5;

      const theta = (lat * Math.PI) / latBands;
      const sinTheta = Math.sin(theta);
      const cosTheta = Math.cos(theta);

      for (let lon = 0; lon <= lonBands; lon++) {
        const phi = (lon * 2 * Math.PI) / lonBands;
        const x = Math.cos(phi) * sinTheta;
        const y = cosTheta;
        const z = Math.sin(phi) * sinTheta;
        positions.push(x, y, z);
      }
    }

    for (let lat = 0; lat < latBands; lat++) {
      for (let lon = 0; lon < lonBands; lon++) {
        const first = lat * (lonBands + 1) + lon;
        const second = first + lonBands + 1;
        indices.push(first, second, first + 1);
        indices.push(second, second + 1, first + 1);

    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(positions), gl.STATIC_DRAW);

    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    const IndexArray = uintExt ? Uint32Array : Uint16Array;
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new IndexArray(indices), gl.STATIC_DRAW);

      idxBuf,

    coronaProgram,
    ['aOffset'],
    ['uVP', 'uCamRight', 'uCamUp', 'uCenter', 'uRadius', 'uTime', 'uInnerColor', 'uOuterColor', 'uIntensity', 'uIsSun']
  );

  // --- Resize Handling ---
  let width = 0;
  let height = 0;
  let pixelRatio = 1;

  function resize() {
    pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(window.innerWidth * pixelRatio);
    const h = Math.floor(window.innerHeight * pixelRatio);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      width = w;
      height = h;
      gl.viewport(0, 0, width, height);
    }
  }
  window.addEventListener('resize', resize);
  resize();

  // --- Reusable Matrices & Vectors ---
  const projMat = mat4.create();
  const viewMat = mat4.create();
  const vpMat = mat4.create();
  const modelMat = mat4.create();
  const rotMat = mat4.create();
  const zeroVec = [0, 0, 0];
  const moonPos = [0, 0, 0];

  const startTime = performance.now();

  // --- Main Render Loop ---
  function render(now) {
    resize();

    const t = (now - startTime) * 0.001;
    const aspect = width / height;

    // Slowly moving cinematic camera:
    // Orbits gently around the solar system while smoothly varying elevation and distance,
    // keeping the Sun and all 8 planetary orbits framed inside the 1080x1080 square viewport.
    const camAzimuth = 0.65 + t * 0.055;
    const camElevation = 0.56 + 0.19 * Math.sin(t * 0.075); // ~21 deg to ~43 deg above ecliptic
    const camDist = 136.0 + 11.0 * Math.cos(t * 0.062);

    // Adjust field-of-view gracefully if viewport is narrower than 1:1
    const baseFov = aspect < 1.0
      ? 2.0 * Math.atan(Math.tan((53.0 * Math.PI) / 360.0) / aspect)
      : (53.0 * Math.PI) / 180.0;

    const cosEl = Math.cos(camElevation);
    const camPos = [
      camDist * cosEl * Math.cos(camAzimuth),
      camDist * Math.sin(camElevation),
      camDist * cosEl * Math.sin(camAzimuth)
    ];

    // Subtle pan of the lookAt target around the solar barycenter
    const lookTarget = [
      2.2 * Math.sin(t * 0.04),
      -1.2 + 0.8 * Math.cos(t * 0.05),
      2.2 * Math.cos(t * 0.04)
    ];
    const upVec = [
      0.04 * Math.sin(t * 0.03),
      1.0,
      0.04 * Math.cos(t * 0.03)
    ];

    mat4.perspective(projMat, baseFov, aspect, 1.0, 750.0);
    mat4.lookAt(viewMat, camPos, lookTarget, upVec);
    mat4.multiply(vpMat, projMat, viewMat);

    // Extract camera basis vectors from view matrix for skybox & billboarding
    const camRight = [viewMat[0], viewMat[4], viewMat[8]];
    const camUp = [viewMat[1], viewMat[5], viewMat[9]];
    const camForward = [-viewMat[2], -viewMat[6], -viewMat[10]];

    gl.clearColor(0.005, 0.008, 0.02, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // 1. Draw Cosmic Nebula Background Dome
    gl.disable(gl.DEPTH_TEST);
    gl.disable(gl.BLEND);
    gl.useProgram(bgLoc.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(bgLoc.a.aPos);
    gl.vertexAttribPointer(bgLoc.a.aPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniform3fv(bgLoc.u.uCamForward, camForward);
    gl.uniform3fv(bgLoc.u.uCamRight, camRight);
    gl.uniform3fv(bgLoc.u.uCamUp, camUp);
    gl.uniform1f(bgLoc.u.uAspect, aspect);
    gl.uniform1f(bgLoc.u.uTime, t);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // 2. Draw Twinkling Starfield
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(starLoc.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, starField.buf);
    const starStride = 8 * 4;
    gl.enableVertexAttribArray(starLoc.a.aPos);
    gl.vertexAttribPointer(starLoc.a.aPos, 3, gl.FLOAT, false, starStride, 0);
    gl.enableVertexAttribArray(starLoc.a.aColor);
    gl.vertexAttribPointer(starLoc.a.aColor, 3, gl.FLOAT, false, starStride, 12);
    gl.enableVertexAttribArray(starLoc.a.aSize);
    gl.vertexAttribPointer(starLoc.a.aSize, 1, gl.FLOAT, false, starStride, 24);
    gl.enableVertexAttribArray(starLoc.a.aPhase);
    gl.vertexAttribPointer(starLoc.a.aPhase, 1, gl.FLOAT, false, starStride, 28);
    gl.uniformMatrix4fv(starLoc.u.uVP, false, vpMat);
    gl.uniform1f(starLoc.u.uTime, t);
    gl.uniform1f(starLoc.u.uPixelRatio, pixelRatio);
    gl.drawArrays(gl.POINTS, 0, starField.count);

    // Update planet orbital positions for current frame
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      p.currentAngle = (p.initialAngle + t * p.orbitSpeed) % (Math.PI * 2);
      getOrbitPosition(p, p.currentAngle, p.currentPos);
    }

    // 3. Draw Asteroid Belt & Kuiper Belt Particles (depth-tested, additive/alpha)
    gl.enable(gl.DEPTH_TEST);
    gl.depthMask(false);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

    for (let i = 0; i < numAsteroids; i++) {
      const m = asteroidMeta[i];
      const ang = m.angle0 + t * m.speed;
      const r = m.radius * (1.0 - m.ecc * Math.cos(ang));
      const idx = i * 8;
      asteroidVertexData[idx] = Math.cos(ang) * r;
      asteroidVertexData[idx + 1] = m.yOffset * Math.sin(ang * 2.0 + m.angle0);
      asteroidVertexData[idx + 2] = -Math.sin(ang) * r;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, asteroidBuf);
    gl.bufferData(gl.ARRAY_BUFFER, asteroidVertexData, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(starLoc.a.aPos);
    gl.vertexAttribPointer(starLoc.a.aPos, 3, gl.FLOAT, false, starStride, 0);
    gl.enableVertexAttribArray(starLoc.a.aColor);
    gl.vertexAttribPointer(starLoc.a.aColor, 3, gl.FLOAT, false, starStride, 12);
    gl.enableVertexAttribArray(starLoc.a.aSize);
    gl.vertexAttribPointer(starLoc.a.aSize, 1, gl.FLOAT, false, starStride, 24);
    gl.enableVertexAttribArray(starLoc.a.aPhase);
    gl.vertexAttribPointer(starLoc.a.aPhase, 1, gl.FLOAT, false, starStride, 28);
    gl.drawArrays(gl.POINTS, 0, numAsteroids);

    gl.disableVertexAttribArray(starLoc.a.aColor);
    gl.disableVertexAttribArray(starLoc.a.aSize);
    gl.disableVertexAttribArray(starLoc.a.aPhase);

    // 4. Draw Planetary Orbit Trails with Luminous Wake
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(orbitLoc.prog);
    gl.uniformMatrix4fv(orbitLoc.u.uVP, false, vpMat);

    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      gl.bindBuffer(gl.ARRAY_BUFFER, p.orbitBuf);
      gl.enableVertexAttribArray(orbitLoc.a.aPos);
      gl.vertexAttribPointer(orbitLoc.a.aPos, 3, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(orbitLoc.a.aAngle);
      gl.vertexAttribPointer(orbitLoc.a.aAngle, 1, gl.FLOAT, false, 16, 12);

      gl.uniform1f(orbitLoc.u.uPlanetAngle, p.currentAngle);
      gl.uniform3fv(orbitLoc.u.uColor, p.orbitColor);
      gl.uniform1f(orbitLoc.u.uBaseAlpha, 0.46);
      gl.drawArrays(gl.LINE_STRIP, 0, p.orbitVertexCount);
    }
    gl.disableVertexAttribArray(orbitLoc.a.aAngle);

    // 5. Draw Opaque Spheres: The Sun, All 8 Planets, and Major Moons
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);

    gl.useProgram(planetLoc.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, sphereGeo.posBuf);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, sphereGeo.idxBuf);
    gl.enableVertexAttribArray(planetLoc.a.aPos);
    gl.vertexAttribPointer(planetLoc.a.aPos, 3, gl.FLOAT, false, 0, 0);

    gl.uniformMatrix4fv(planetLoc.u.uVP, false, vpMat);
    gl.uniform1f(planetLoc.u.uTime, t);
    gl.uniform3fv(planetLoc.u.uCamPos, camPos);

    // 5a. Draw the Sun at the center (0, 0, 0)
    mat4.fromTranslationRotationScale(modelMat, zeroVec, 0, 0, t * 0.12, sunRadius);
    mat4.fromTranslationRotationScale(rotMat, zeroVec, 0, 0, t * 0.12, 1.0);
    gl.uniformMatrix4fv(planetLoc.u.uModel, false, modelMat);
    gl.uniformMatrix4fv(planetLoc.u.uRotOnly, false, rotMat);
    gl.uniform1i(planetLoc.u.uPlanetId, 0);
    gl.uniform3fv(planetLoc.u.uPlanetCenter, zeroVec);
    gl.uniform1f(planetLoc.u.uPlanetRadius, sunRadius);
    gl.drawElements(gl.TRIANGLES, sphereGeo.count, sphereGeo.indexType, 0);

    // 5b. Draw All 8 Planets & Their Moons
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      const spin = t * p.spinSpeed;

      mat4.fromTranslationRotationScale(modelMat, p.currentPos, p.tiltX, p.tiltZ, spin, p.radius);
      mat4.fromTranslationRotationScale(rotMat, zeroVec, p.tiltX, p.tiltZ, spin, 1.0);

      gl.uniformMatrix4fv(planetLoc.u.uModel, false, modelMat);
      gl.uniformMatrix4fv(planetLoc.u.uRotOnly, false, rotMat);
      gl.uniform1i(planetLoc.u.uPlanetId, p.id);
      gl.uniform3fv(planetLoc.u.uPlanetCenter, p.currentPos);
      gl.uniform1f(planetLoc.u.uPlanetRadius, p.radius);
      gl.drawElements(gl.TRIANGLES, sphereGeo.count, sphereGeo.indexType, 0);

      // Render moons orbiting this planet
      for (let m = 0; m < p.moons.length; m++) {
        const moon = p.moons[m];
        const mAngle = moon.phase + t * moon.speed;
        moonPos[0] = p.currentPos[0] + Math.cos(mAngle) * moon.dist;
        moonPos[1] = p.currentPos[1] + Math.sin(mAngle) * moon.dist * Math.sin(moon.inc);
        moonPos[2] = p.currentPos[2] - Math.sin(mAngle) * moon.dist * Math.cos(moon.inc);

        mat4.fromTranslationRotationScale(modelMat, moonPos, 0, 0, mAngle, moon.radius);
        mat4.fromTranslationRotationScale(rotMat, zeroVec, 0, 0, mAngle, 1.0);
        gl.uniformMatrix4fv(planetLoc.u.uModel, false, modelMat);
        gl.uniformMatrix4fv(planetLoc.u.uRotOnly, false, rotMat);
        gl.uniform1i(planetLoc.u.uPlanetId, 99);
        gl.uniform3fv(planetLoc.u.uPlanetCenter, moonPos);
        gl.uniform1f(planetLoc.u.uPlanetRadius, moon.radius);
        gl.drawElements(gl.TRIANGLES, sphereGeo.count, sphereGeo.indexType, 0);
      }
    }

    // 6. Draw Transparent Planetary Rings (Saturn & Uranus)
    gl.disable(gl.CULL_FACE);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);

    gl.useProgram(ringLoc.prog);
    gl.uniformMatrix4fv(ringLoc.u.uVP, false, vpMat);

    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      if (!p.ringType) continue;

      const geo = p.ringType === 1 ? saturnRingGeo : uranusRingGeo;
      gl.bindBuffer(gl.ARRAY_BUFFER, geo.vbo);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, geo.ibo);
      gl.enableVertexAttribArray(ringLoc.a.aPos);
      gl.vertexAttribPointer(ringLoc.a.aPos, 3, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(ringLoc.a.aRadiusNorm);
      gl.vertexAttribPointer(ringLoc.a.aRadiusNorm, 1, gl.FLOAT, false, 16, 12);

      mat4.fromTranslationRotationScale(modelMat, p.currentPos, p.tiltX, p.tiltZ, 0.0, p.radius);
      gl.uniformMatrix4fv(ringLoc.u.uModel, false, modelMat);
      gl.uniform3fv(ringLoc.u.uPlanetCenter, p.currentPos);
      gl.uniform1f(ringLoc.u.uPlanetRadius, p.radius);
      gl.uniform1i(ringLoc.u.uRingType, p.ringType);

      gl.drawElements(gl.TRIANGLES, geo.count, gl.UNSIGNED_SHORT, 0);
    }
    gl.disableVertexAttribArray(ringLoc.a.aRadiusNorm);

    // 7. Draw Additive Solar Corona & Subtle Planetary Atmospheric Halos
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(coronaLoc.prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(coronaLoc.a.aOffset);
    gl.vertexAttribPointer(coronaLoc.a.aOffset, 2, gl.FLOAT, false, 0, 0);

    gl.uniformMatrix4fv(coronaLoc.u.uVP, false, vpMat);
    gl.uniform3fv(coronaLoc.u.uCamRight, camRight);
    gl.uniform3fv(coronaLoc.u.uCamUp, camUp);
    gl.uniform1f(coronaLoc.u.uTime, t);

    // Inner + outer solar corona layers
    gl.uniform3fv(coronaLoc.u.uCenter, zeroVec);
    gl.uniform1f(coronaLoc.u.uRadius, sunRadius * 3.6);
    gl.uniform3f(coronaLoc.u.uInnerColor, 1.0, 0.88, 0.45);
    gl.uniform3f(coronaLoc.u.uOuterColor, 0.95, 0.32, 0.04);
    gl.uniform1f(coronaLoc.u.uIntensity, 0.92);
    gl.uniform1i(coronaLoc.u.uIsSun, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    gl.uniform1f(coronaLoc.u.uRadius, sunRadius * 7.5);
    gl.uniform3f(coronaLoc.u.uInnerColor, 1.0, 0.55, 0.16);
    gl.uniform3f(coronaLoc.u.uOuterColor, 0.45, 0.12, 0.02);
    gl.uniform1f(coronaLoc.u.uIntensity, 0.35);
    gl.uniform1i(coronaLoc.u.uIsSun, 1);
    gl.drawArrays(gl.TRIANGLES, 0, 6);

    // Subtle atmospheric glow around each planet for crisp readability in 1080x1080
    gl.uniform1i(coronaLoc.u.uIsSun, 0);
    for (let i = 0; i < planets.length; i++) {
      const p = planets[i];
      gl.uniform3fv(coronaLoc.u.uCenter, p.currentPos);
      gl.uniform1f(coronaLoc.u.uRadius, p.radius * 2.35);
      gl.uniform3fv(coronaLoc.u.uInnerColor, p.haloColor);
      gl.uniform3fv(coronaLoc.u.uOuterColor, p.orbitColor);
      gl.uniform1f(coronaLoc.u.uIntensity, 0.36);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    gl.depthMask(true);
    requestAnimationFrame(render);
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
