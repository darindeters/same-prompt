<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fireworks Show</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040510;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Offscreen buffer for the upper scene (sky + fireworks + city) to reflect cleanly & fast in the river
  const skyCanvas = document.createElement('canvas');
  const skyCtx = skyCanvas.getContext('2d', { alpha: false });

  // Static backdrop buffer (night sky gradient, stars, distant haze, moon)
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d', { alpha: false });

  // City silhouette + lit windows + bridges buffer
  const cityCanvas = document.createElement('canvas');
  const cityCtx = cityCanvas.getContext('2d');

  let W = 1080;
  let H = 1080;
  let DPR = 1;
  let horizonY = 720; // ~66.7% down the screen

  // Vivid, hyper-saturated color palettes designed to pop on OLED / mobile screens
  const PALETTES = [
    { name: 'magentaGold', primary: '#ff1e8a', secondary: '#ffdf22', core: '#ffffff', glow: [255, 30, 138] },
    { name: 'cyanLime', primary: '#00f6ff', secondary: '#5eff29', core: '#e8ffff', glow: [0, 246, 255] },
    { name: 'electricViolet', primary: '#b829ff', secondary: '#00e5ff', core: '#ffe6ff', glow: [184, 41, 255] },
    { name: 'solarFlare', primary: '#ff3b1f', secondary: '#ffbe0b', core: '#fffbe0', glow: [255, 90, 20] },
    { name: 'emeraldGold', primary: '#00ff88', secondary: '#ffe63b', core: '#eafff5', glow: [0, 255, 136] },
    { name: 'coralPink', primary: '#ff2a6d', secondary: '#ff9e00', core: '#fff0f5', glow: [255, 42, 109] },
    { name: 'royalNeon', primary: '#3a86ff', secondary: '#ff007f', core: '#eef6ff', glow: [58, 134, 255] },
    { name: 'rainbow', primary: '#ff2e93', secondary: '#00f5d4', core: '#ffffff', glow: [255, 180, 60], multi: ['#ff1e56', '#ff9f1c', '#ffea00', '#00f5d4', '#00bbf9', '#b5179e'] }
  ];

  const rockets = [];
  const particles = [];
  const flashes = [];
  const smokePuffs = [];
  const buildings = [];
  const stars = [];
  const boats = [];

  let time = 0;
  let lastLaunchTime = 0;
  let nextSalvoDelay = 0.6;
  let finaleTimer = 0;

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function randInt(min, max) {
    return Math.floor(rand(min, max + 1));
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function hexToRgb(hex) {
    const v = parseInt(hex.slice(1), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(320, Math.floor(window.innerWidth * DPR));
    H = Math.max(320, Math.floor(window.innerHeight * DPR));
    canvas.width = W;
    canvas.height = H;

    horizonY = Math.floor(H * 0.67);

    skyCanvas.width = W;
    skyCanvas.height = horizonY;

    bgCanvas.width = W;
    bgCanvas.height = horizonY;

    cityCanvas.width = W;
    cityCanvas.height = horizonY;

    buildBackdrop();
    buildCityline();
    initBoats();
  }

  function buildBackdrop() {
    // Rich deep night sky gradient
    const skyGrad = bgCtx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0.0, '#03040f');
    skyGrad.addColorStop(0.42, '#080b24');
    skyGrad.addColorStop(0.76, '#13163b');
    skyGrad.addColorStop(0.93, '#221b47');
    skyGrad.addColorStop(1.0, '#33204f');
    bgCtx.fillStyle = skyGrad;
    bgCtx.fillRect(0, 0, W, horizonY);

    // Subtle warm city horizon glow
    const cityGlow = bgCtx.createRadialGradient(
      W * 0.5, horizonY, W * 0.05,
      W * 0.5, horizonY, W * 0.65
    );
    cityGlow.addColorStop(0, 'rgba(255, 115, 70, 0.24)');
    cityGlow.addColorStop(0.5, 'rgba(180, 50, 120, 0.12)');
    cityGlow.addColorStop(1, 'rgba(20, 10, 40, 0)');
    bgCtx.fillStyle = cityGlow;
    bgCtx.fillRect(0, 0, W, horizonY);

    // Stars
    stars.length = 0;
    const starCount = Math.floor((W * horizonY) / 4200);
    for (let i = 0; i < starCount; i++) {
      const yRatio = Math.pow(Math.random(), 1.6) * 0.72;
      stars.push({
        x: Math.random() * W,
        y: yRatio * horizonY,
        r: rand(0.6, 1.9) * DPR,
        baseAlpha: rand(0.25, 0.85),
        phase: rand(0, Math.PI * 2),
        speed: rand(1.2, 3.5),
        tint: pick(['#ffffff', '#ffe9c4', '#c7e2ff', '#ffd6f6'])
      });
    }

    // Crescent Moon in upper left/right corner
    const moonX = W * 0.14;
    const moonY = horizonY * 0.2;
    const moonR = Math.min(W, H) * 0.028;

    const moonHalo = bgCtx.createRadialGradient(moonX, moonY, moonR * 0.5, moonX, moonY, moonR * 4.2);
    moonHalo.addColorStop(0, 'rgba(255, 240, 200, 0.22)');
    moonHalo.addColorStop(0.4, 'rgba(255, 220, 175, 0.07)');
    moonHalo.addColorStop(1, 'rgba(255, 220, 175, 0)');
    bgCtx.fillStyle = moonHalo;
    bgCtx.beginPath();
    bgCtx.arc(moonX, moonY, moonR * 4.2, 0, Math.PI * 2);
    bgCtx.fill();

    bgCtx.save();
    bgCtx.beginPath();
    bgCtx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
    bgCtx.fillStyle = '#fff5d6';
    bgCtx.fill();
    bgCtx.globalCompositeOperation = 'destination-out';
    bgCtx.beginPath();
    bgCtx.arc(moonX + moonR * 0.42, moonY - moonR * 0.2, moonR * 0.88, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.restore();

    // Re-fill the crescent cutout with the sky color behind it
    bgCtx.save();
    bgCtx.globalCompositeOperation = 'destination-over';
    bgCtx.fillStyle = skyGrad;
    bgCtx.fillRect(0, 0, W, horizonY);
    bgCtx.restore();
  }

  function buildCityline() {
    cityCtx.clearRect(0, 0, W, horizonY);
    buildings.length = 0;

    const scale = Math.min(W, H) / 1080;

    // Suspension bridge on the right third
    drawSuspensionBridge(cityCtx, W * 0.62, W * 0.98, horizonY, scale);

    // 3 layers of buildings: back, mid, front
    const layers = [
      { count: 28, minW: 36, maxW: 85, minH: 95, maxH: 255, color: '#141530', winColor: ['#ffcf6b', '#5ce1e6', '#ff85a1'], winChance: 0.22, alpha: 0.7 },
      { count: 22, minW: 42, maxW: 96, minH: 80, maxH: 230, color: '#0c0d21', winColor: ['#ffd97d', '#00f5d4', '#ff9ebb', '#ffbe0b'], winChance: 0.34, alpha: 0.88 },
      { count: 18, minW: 46, maxW: 108, minH: 55, maxH: 185, color: '#060714', winColor: ['#ffe699', '#ffc145', '#48cae4', '#ff5d8f'], winChance: 0.42, alpha: 1.0 }
    ];

    // Iconic spire tower near center-left
    const spireX = W * 0.36;
    const spireW = 68 * scale;
    const spireH = 310 * scale;
    drawLandmarkTower(cityCtx, spireX, horizonY, spireW, spireH, scale);

    // Iconic Ferris wheel on the waterfront
    drawFerrisWheel(cityCtx, W * 0.18, horizonY, 64 * scale, scale);

    layers.forEach((layer, layerIdx) => {
      let x = -15 * scale;
      while (x < W * 0.76) {
        // Leave breathing room around the Ferris wheel & bridge view
        if (layerIdx === 2 && x > W * 0.12 && x < W * 0.23) {
          x += 45 * scale;
          continue;
        }
        const bw = rand(layer.minW, layer.maxW) * scale;
        // Taper height near edges and bridge
        const centerFactor = 1 - Math.abs((x / (W * 0.72)) - 0.48) * 0.85;
        const bh = rand(layer.minH, layer.maxH) * scale * Math.max(0.45, centerFactor);
        const by = horizonY - bh;

        buildings.push({ x, y: by, w: bw, h: bh, layer: layerIdx });

        // Building body
        cityCtx.fillStyle = layer.color;
        cityCtx.fillRect(x, by, bw, bh);

        // Roof architectures (stepped crown, slant, or spire)
        const roofStyle = Math.random();
        if (roofStyle < 0.28) {
          const cw = bw * 0.64;
          const ch = rand(10, 24) * scale;
          cityCtx.fillRect(x + (bw - cw) * 0.5, by - ch, cw, ch);
          if (Math.random() < 0.6) {
            cityCtx.fillRect(x + bw * 0.48, by - ch - 26 * scale, Math.max(2, 2.5 * scale), 26 * scale);
            // Red aviation beacon
            cityCtx.fillStyle = '#ff2a55';
            cityCtx.beginPath();
            cityCtx.arc(x + bw * 0.49, by - ch - 26 * scale, 2.8 * scale, 0, Math.PI * 2);
            cityCtx.fill();
          }
        } else if (roofStyle < 0.46) {
          cityCtx.beginPath();
          cityCtx.moveTo(x, by);
          cityCtx.lineTo(x + bw * 0.5, by - 22 * scale);
          cityCtx.lineTo(x + bw, by);
          cityCtx.closePath();
          cityCtx.fill();
        }

        // Lit windows grid
        const winW = Math.max(2, Math.floor(3.6 * scale));
        const winH = Math.max(3, Math.floor(5.2 * scale));
        const stepX = Math.max(5, Math.floor(7.8 * scale));
        const stepY = Math.max(7, Math.floor(10.5 * scale));
        const padX = Math.floor(6 * scale);
        const padY = Math.floor(8 * scale);

        for (let wy = by + padY; wy < horizonY - 12 * scale; wy += stepY) {
          const floorLit = Math.random() < 0.82;
          if (!floorLit) continue;
          for (let wx = x + padX; wx < x + bw - padX - winW; wx += stepX) {
            if (Math.random() < layer.winChance) {
              cityCtx.fillStyle = pick(layer.winColor);
              cityCtx.globalAlpha = rand(0.45, 0.95) * layer.alpha;
              cityCtx.fillRect(wx, wy, winW, winH);
            }
          }
        }
        cityCtx.globalAlpha = 1;

        x += bw * rand(0.68, 1.08);
      }
    });

    // Waterfront promenade lights along the embankment
    cityCtx.fillStyle = '#05050f';
    cityCtx.fillRect(0, horizonY - 6 * scale, W, 6 * scale);

    for (let lx = 12 * scale; lx < W; lx += 26 * scale) {
      const col = lx > W * 0.62 ? '#ffaa33' : pick(['#ffcf56', '#00f5d4', '#ff4d8d', '#ffd166']);
      const grad = cityCtx.createRadialGradient(lx, horizonY - 3 * scale, 0.5, lx, horizonY - 3 * scale, 9 * scale);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, col);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      cityCtx.fillStyle = grad;
      cityCtx.beginPath();
      cityCtx.arc(lx, horizonY - 3 * scale, 9 * scale, 0, Math.PI * 2);
      cityCtx.fill();
    }
  }

  function drawLandmarkTower(c, cx, baseY, w, h, scale) {
    const left = cx - w * 0.5;
    const topY = baseY - h;

    // Tapered skyscraper body
    c.fillStyle = '#090b1e';
    c.beginPath();
    c.moveTo(left, baseY);
    c.lineTo(cx - w * 0.26, topY + h * 0.2);
    c.lineTo(cx + w * 0.26, topY + h * 0.2);
    c.lineTo(left + w, baseY);
    c.closePath();
    c.fill();

    // Illuminated crown tiers
    const tiers = 4;
    for (let i = 0; i < tiers; i++) {
      const tw = w * (0.48 - i * 0.09);
      const th = h * 0.042;
      const ty = topY + h * 0.2 - (i + 1) * th;
      c.fillStyle = '#0b0e26';
      c.fillRect(cx - tw * 0.5, ty, tw, th);
      c.fillStyle = '#00f6ff';
      c.fillRect(cx - tw * 0.46, ty + 2 * scale, tw * 0.92, 2.2 * scale);
    }

    // Tall needle spire
    const spireTop = topY - h * 0.12;
    c.strokeStyle = '#00f6ff';
    c.lineWidth = Math.max(1.5, 2.5 * scale);
    c.beginPath();
    c.moveTo(cx, topY + h * 0.04);
    c.lineTo(cx, spireTop);
    c.stroke();

    // Glowing beacon at tip
    const beacon = c.createRadialGradient(cx, spireTop, 1, cx, spireTop, 14 * scale);
    beacon.addColorStop(0, '#ffffff');
    beacon.addColorStop(0.35, '#ff1e8a');
    beacon.addColorStop(1, 'rgba(255, 30, 138, 0)');
    c.fillStyle = beacon;
    c.beginPath();
    c.arc(cx, spireTop, 14 * scale, 0, Math.PI * 2);
    c.fill();

    // Diagonal LED strips on landmark tower
    c.strokeStyle = 'rgba(0, 246, 255, 0.55)';
    c.lineWidth = Math.max(1, 1.6 * scale);
    for (let i = 0; i < 6; i++) {
      const y1 = topY + h * (0.24 + i * 0.12);
      const y2 = y1 + h * 0.09;
      const hw1 = w * (0.26 + i * 0.035);
      const hw2 = w * (0.29 + i * 0.035);
      c.beginPath();
      c.moveTo(cx - hw1, y1);
      c.lineTo(cx + hw2, y2);
      c.moveTo(cx + hw1, y1);
      c.lineTo(cx - hw2, y2);
      c.stroke();
    }
  }

  function drawFerrisWheel(c, cx, baseY, radius, scale) {
    const cy = baseY - radius - 14 * scale;

    // Support legs
    c.strokeStyle = '#090a1a';
    c.lineWidth = Math.max(2, 4.5 * scale);
    c.beginPath();
    c.moveTo(cx - radius * 0.55, baseY);
    c.lineTo(cx, cy);
    c.lineTo(cx + radius * 0.55, baseY);
    c.stroke();

    // Neon rim
    c.strokeStyle = '#ff1e8a';
    c.lineWidth = Math.max(1.5, 3 * scale);
    c.beginPath();
    c.arc(cx, cy, radius, 0, Math.PI * 2);
    c.stroke();

    c.strokeStyle = '#00f6ff';
    c.lineWidth = Math.max(1, 1.8 * scale);
    c.beginPath();
    c.arc(cx, cy, radius * 0.82, 0, Math.PI * 2);
    c.stroke();

    // Spokes & glowing capsules
    const spokes = 16;
    for (let i = 0; i < spokes; i++) {
      const ang = (i / spokes) * Math.PI * 2;
      const rx = cx + Math.cos(ang) * radius;
      const ry = cy + Math.sin(ang) * radius;
      c.strokeStyle = 'rgba(184, 41, 255, 0.45)';
      c.lineWidth = Math.max(1, 1.2 * scale);
      c.beginPath();
      c.moveTo(cx, cy);
      c.lineTo(rx, ry);
      c.stroke();

      c.fillStyle = i % 2 === 0 ? '#ffdf22' : '#00f6ff';
      c.beginPath();
      c.arc(rx, ry, 2.8 * scale, 0, Math.PI * 2);
      c.fill();
    }
  }

  function drawSuspensionBridge(c, startX, endX, baseY, scale) {
    const span = endX - startX;
    const t1X = startX + span * 0.28;
    const t2X = startX + span * 0.74;
    const deckY = baseY - 26 * scale;
    const towerTopY = baseY - 145 * scale;

    // Cables
    c.strokeStyle = '#181c3a';
    c.lineWidth = Math.max(1.5, 2.5 * scale);
    c.beginPath();
    c.moveTo(startX, deckY);
    c.quadraticCurveTo(startX + (t1X - startX) * 0.55, deckY - 10 * scale, t1X, towerTopY);
    c.quadraticCurveTo((t1X + t2X) * 0.5, deckY - 12 * scale, t2X, towerTopY);
    c.quadraticCurveTo(t2X + (endX - t2X) * 0.45, deckY - 10 * scale, endX, deckY);
    c.stroke();

    // Vertical suspender cables + necklace lights
    const steps = 34;
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const x = startX + span * t;
      let cableY;
      if (x < t1X) {
        const u = (x - startX) / (t1X - startX);
        cableY = (1 - u) * (1 - u) * deckY + 2 * (1 - u) * u * (deckY - 10 * scale) + u * u * towerTopY;
      } else if (x < t2X) {
        const u = (x - t1X) / (t2X - t1X);
        cableY = (1 - u) * (1 - u) * towerTopY + 2 * (1 - u) * u * (deckY - 12 * scale) + u * u * towerTopY;
      } else {
        const u = (x - t2X) / (endX - t2X);
        cableY = (1 - u) * (1 - u) * towerTopY + 2 * (1 - u) * u * (deckY - 10 * scale) + u * u * deckY;
      }

      c.strokeStyle = 'rgba(90, 110, 175, 0.28)';
      c.lineWidth = Math.max(0.8, 1 * scale);
      c.beginPath();
      c.moveTo(x, cableY);
      c.lineTo(x, deckY);
      c.stroke();

      // Necklace light on main cable
      c.fillStyle = '#ffbe0b';
      c.beginPath();
      c.arc(x, cableY, 1.8 * scale, 0, Math.PI * 2);
      c.fill();
    }

    // Bridge deck
    c.fillStyle = '#090a18';
    c.fillRect(startX, deckY, span, 6 * scale);

    // Towers
    [t1X, t2X].forEach(tx => {
      const tw = 10 * scale;
      c.fillStyle = '#0a0b1d';
      c.fillRect(tx - tw * 0.5, towerTopY, tw, baseY - towerTopY);
      // Red warning light on top of bridge towers
      c.fillStyle = '#ff2a55';
      c.beginPath();
      c.arc(tx, towerTopY, 2.8 * scale, 0, Math.PI * 2);
      c.fill();
    });
  }

  function initBoats() {
    boats.length = 0;
    const scale = Math.min(W, H) / 1080;
    const riverH = H - horizonY;
    for (let i = 0; i < 4; i++) {
      boats.push({
        x: rand(W * 0.08, W * 0.9),
        y: horizonY + rand(0.14, 0.52) * riverH,
        vx: (i % 2 === 0 ? 1 : -1) * rand(8, 18) * scale,
        len: rand(28, 52) * scale,
        color: pick(['#00f6ff', '#ffbe0b', '#ff2a6d'])
      });
    }
  }

  // Launch a rocket with specific or random burst choreography
  function launchRocket(opts = {}) {
    const scale = Math.min(W, H) / 1080;
    const startX = opts.x !== undefined ? opts.x : rand(W * 0.1, W * 0.9);
    const startY = horizonY - rand(4, 18) * scale;
    const targetX = opts.targetX !== undefined ? opts.targetX : startX + rand(-75, 75) * scale;
    const targetY = opts.targetY !== undefined ? opts.targetY : rand(horizonY * 0.14, horizonY * 0.54);

    const flightTime = rand(0.88, 1.28);
    const gravity = 290 * scale;
    const vx = (targetX - startX) / flightTime;
    const vy = (targetY - startY - 0.5 * gravity * flightTime * flightTime) / flightTime;

    const shapes = ['chrysanthemum', 'peony', 'heart', 'star', 'ring', 'saturn', 'willow', 'doubleSpiral', 'crossette'];
    const shape = opts.shape || pick(shapes);
    const palette = opts.palette || pick(PALETTES);

    rockets.push({
      x: startX,
      y: startY,
      vx,
      vy,
      gravity,
      age: 0,
      flightTime,
      shape,
      palette,
      scale,
      wobbleFreq: rand(12, 22),
      wobbleAmp: rand(8, 28) * scale,
      trailTimer: 0
    });
  }

  // Spawn an explosion of a given shape and palette
  function explodeRocket(r) {
    const { x, y, shape, palette, scale } = r;

    // Sky illumination flash
    flashes.push({
      x,
      y,
      radius: rand(260, 440) * scale,
      rgb: palette.glow,
      alpha: 0.55,
      decay: 2.6
    });

    // Subtle smoke cloud illuminated by subsequent bursts
    smokePuffs.push({
      x,
      y,
      radius: rand(35, 65) * scale,
      vx: rand(-12, 12) * scale,
      vy: rand(-8, 4) * scale,
      alpha: 0.12,
      rgb: palette.glow,
      age: 0,
      life: rand(2.5, 4.2)
    });

    const baseSpeed = rand(210, 310) * scale;

    if (shape === 'chrysanthemum' || shape === 'peony') {
      const count = shape === 'chrysanthemum' ? 130 : 95;
      for (let i = 0; i < count; i++) {
        // Uniform spherical projection
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const speedMult = Math.sin(phi) * rand(0.88, 1.08);
        const spd = baseSpeed * speedMult;
        const color = palette.multi
          ? pick(palette.multi)
          : (speedMult > 0.72 ? palette.primary : palette.secondary);

        spawnParticle({
          x, y,
          vx: Math.cos(theta) * spd,
          vy: Math.sin(theta) * spd,
          color,
          coreColor: palette.core,
          size: rand(2.4, 4.0) * scale,
          drag: shape === 'chrysanthemum' ? 0.978 : 0.968,
          gravity: 115 * scale,
          life: rand(1.35, 1.95),
          trailLength: shape === 'chrysanthemum' ? 11 : 6,
          glitter: Math.random() < 0.35
        });
      }
      // Bright inner pistil core
      for (let i = 0; i < 36; i++) {
        const ang = (i / 36) * Math.PI * 2 + rand(-0.05, 0.05);
        const spd = baseSpeed * rand(0.28, 0.46);
        spawnParticle({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: palette.secondary,
          coreColor: '#ffffff',
          size: 2.5 * scale,
          drag: 0.965,
          gravity: 95 * scale,
          life: rand(0.85, 1.25),
          trailLength: 5,
          glitter: true
        });
      }
    } else if (shape === 'heart') {
      const count = 96;
      const tilt = rand(-0.22, 0.22);
      const cosT = Math.cos(tilt);
      const sinT = Math.sin(tilt);
      const heartScale = baseSpeed * 0.062;

      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        // Parametric heart curve
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const rx = hx * cosT - hy * sinT;
        const ry = hx * sinT + hy * cosT;

        spawnParticle({
          x, y,
          vx: rx * heartScale * rand(0.95, 1.05),
          vy: ry * heartScale * rand(0.95, 1.05),
          color: palette.primary,
          coreColor: palette.core,
          size: 3.3 * scale,
          drag: 0.962,
          gravity: 75 * scale,
          life: rand(1.4, 1.85),
          trailLength: 8,
          glitter: i % 3 === 0
        });
      }
      // Inner mini-heart
      for (let i = 0; i < 44; i++) {
        const t = (i / 44) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const rx = hx * cosT - hy * sinT;
        const ry = hx * sinT + hy * cosT;

        spawnParticle({
          x, y,
          vx: rx * heartScale * 0.5,
          vy: ry * heartScale * 0.5,
          color: palette.secondary,
          coreColor: '#ffffff',
          size: 2.5 * scale,
          drag: 0.962,
          gravity: 75 * scale,
          life: rand(1.1, 1.45),
          trailLength: 5,
          glitter: true
        });
      }
    } else if (shape === 'star') {
      const points = 5;
      const total = 105;
      const rot = rand(0, Math.PI * 2);
      for (let i = 0; i < total; i++) {
        const frac = (i / total) * points;
        const seg = Math.floor(frac);
        const u = frac - seg; // 0..1 along two edges of one star point
        const aOuter1 = rot + (seg / points) * Math.PI * 2;
        const aInner = rot + ((seg + 0.5) / points) * Math.PI * 2;
        const aOuter2 = rot + ((seg + 1) / points) * Math.PI * 2;

        const rOuter = baseSpeed * 1.08;
        const rInner = baseSpeed * 0.42;

        let vx, vy;
        if (u < 0.5) {
          const k = u * 2;
          vx = (1 - k) * Math.cos(aOuter1) * rOuter + k * Math.cos(aInner) * rInner;
          vy = (1 - k) * Math.sin(aOuter1) * rOuter + k * Math.sin(aInner) * rInner;
        } else {
          const k = (u - 0.5) * 2;
          vx = (1 - k) * Math.cos(aInner) * rInner + k * Math.cos(aOuter2) * rOuter;
          vy = (1 - k) * Math.sin(aInner) * rInner + k * Math.sin(aOuter2) * rOuter;
        }

        const isTip = u < 0.12 || u > 0.88;
        spawnParticle({
          x, y,
          vx: vx * rand(0.96, 1.04),
          vy: vy * rand(0.96, 1.04),
          color: isTip ? palette.secondary : palette.primary,
          coreColor: '#ffffff',
          size: (isTip ? 3.8 : 2.9) * scale,
          drag: 0.964,
          gravity: 80 * scale,
          life: rand(1.35, 1.8),
          trailLength: 8,
          glitter: isTip
        });
      }
    } else if (shape === 'ring' || shape === 'saturn') {
      const ringCount = 72;
      const tilt = rand(-0.4, 0.4);
      const squash = shape === 'saturn' ? rand(0.32, 0.48) : 1.0;
      const cosT = Math.cos(tilt);
      const sinT = Math.sin(tilt);

      for (let i = 0; i < ringCount; i++) {
        const ang = (i / ringCount) * Math.PI * 2;
        const ex = Math.cos(ang) * baseSpeed * 1.05;
        const ey = Math.sin(ang) * baseSpeed * 1.05 * squash;
        const vx = ex * cosT - ey * sinT;
        const vy = ex * sinT + ey * cosT;

        spawnParticle({
          x, y,
          vx,
          vy,
          color: palette.multi ? palette.multi[i % palette.multi.length] : palette.secondary,
          coreColor: '#ffffff',
          size: 3.2 * scale,
          drag: 0.966,
          gravity: 85 * scale,
          life: rand(1.35, 1.75),
          trailLength: 7,
          glitter: i % 2 === 0
        });
      }

      if (shape === 'saturn') {
        // Central planet sphere
        for (let i = 0; i < 65; i++) {
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const spd = baseSpeed * 0.52 * Math.sin(phi);
          spawnParticle({
            x, y,
            vx: Math.cos(theta) * spd,
            vy: Math.sin(theta) * spd,
            color: palette.primary,
            coreColor: palette.core,
            size: 2.8 * scale,
            drag: 0.968,
            gravity: 95 * scale,
            life: rand(1.2, 1.65),
            trailLength: 6,
            glitter: false
          });
        }
      } else {
        // Inner counter-ring
        for (let i = 0; i < 40; i++) {
          const ang = (i / 40) * Math.PI * 2;
          spawnParticle({
            x, y,
            vx: Math.cos(ang) * baseSpeed * 0.55,
            vy: Math.sin(ang) * baseSpeed * 0.55,
            color: palette.primary,
            coreColor: '#ffffff',
            size: 2.8 * scale,
            drag: 0.966,
            gravity: 85 * scale,
            life: rand(1.15, 1.5),
            trailLength: 6,
            glitter: true
          });
        }
      }
    } else if (shape === 'willow') {
      const count = 95;
      for (let i = 0; i < count; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const spd = baseSpeed * 0.85 * Math.sin(phi) * rand(0.75, 1.08);
        spawnParticle({
          x, y,
          vx: Math.cos(theta) * spd,
          vy: Math.sin(theta) * spd,
          color: i % 3 === 0 ? palette.primary : '#ffdf6b',
          coreColor: '#ffffff',
          size: rand(2.5, 3.6) * scale,
          drag: 0.982,
          gravity: 165 * scale, // Droops gracefully like golden willow branches
          life: rand(1.9, 2.65),
          trailLength: 15,
          glitter: true
        });
      }
    } else if (shape === 'doubleSpiral') {
      const arms = 4;
      const perArm = 26;
      const rot = rand(0, Math.PI * 2);
      for (let a = 0; a < arms; a++) {
        const armBase = rot + (a / arms) * Math.PI * 2;
        const col = a % 2 === 0 ? palette.primary : palette.secondary;
        for (let j = 0; j < perArm; j++) {
          const frac = (j + 1) / perArm;
          const ang = armBase + frac * 2.2;
          const spd = baseSpeed * (0.22 + frac * 0.88);
          spawnParticle({
            x, y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            color: col,
            coreColor: '#ffffff',
            size: (2.2 + frac * 1.6) * scale,
            drag: 0.968,
            gravity: 90 * scale,
            life: rand(1.3, 1.8),
            trailLength: 9,
            glitter: j > perArm - 6
          });
        }
      }
    } else if (shape === 'crossette') {
      // Heavy comets that split into 4 mini-bursts mid-air
      const count = 26;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + rand(-0.08, 0.08);
        const spd = baseSpeed * rand(0.72, 1.02);
        spawnParticle({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: palette.primary,
          coreColor: '#ffffff',
          size: 3.8 * scale,
          drag: 0.974,
          gravity: 105 * scale,
          life: rand(0.68, 0.88),
          trailLength: 10,
          glitter: false,
          splitOnDeath: true,
          splitColor: palette.secondary,
          scale
        });
      }
    }
  }

  function spawnParticle(p) {
    const history = [];
    for (let i = 0; i < (p.trailLength || 7); i++) {
      history.push({ x: p.x, y: p.y });
    }
    particles.push({
      x: p.x,
      y: p.y,
      vx: p.vx,
      vy: p.vy,
      color: p.color,
      coreColor: p.coreColor || '#ffffff',
      size: p.size,
      drag: p.drag || 0.97,
      gravity: p.gravity || 110,
      age: 0,
      life: p.life || 1.5,
      history,
      glitter: !!p.glitter,
      glitterPhase: rand(0, Math.PI * 2),
      splitOnDeath: !!p.splitOnDeath,
      splitColor: p.splitColor || p.color,
      scale: p.scale || 1
    });
  }

  // Choreographed salvos so the show always feels dynamic, musical, and alive
  function scheduleShow(dt) {
    lastLaunchTime += dt;
    finaleTimer += dt;

    if (lastLaunchTime < nextSalvoDelay) return;
    lastLaunchTime = 0;

    const pattern = Math.random();

    if (finaleTimer > 14) {
      // Periodic grand fan salvo across the skyline
      finaleTimer = 0;
      const count = 5;
      const pal1 = pick(PALETTES);
      const pal2 = pick(PALETTES);
      const shape = pick(['chrysanthemum', 'heart', 'star', 'saturn', 'willow']);
      for (let i = 0; i < count; i++) {
        const frac = (i + 0.5) / count;
        const x = W * (0.14 + frac * 0.72);
        const arch = Math.sin(frac * Math.PI);
        launchRocket({
          x,
          targetX: x + (frac - 0.5) * W * 0.12,
          targetY: horizonY * (0.44 - arch * 0.24),
          shape: i === 2 ? 'heart' : shape,
          palette: i % 2 === 0 ? pal1 : pal2
        });
      }
      nextSalvoDelay = rand(1.6, 2.2);
    } else if (pattern < 0.35) {
      // Twin symmetrical launch
      const offset = rand(0.16, 0.34);
      const targetY = rand(horizonY * 0.18, horizonY * 0.44);
      const shape = pick(['heart', 'star', 'saturn', 'doubleSpiral', 'ring', 'crossette']);
      const palette = pick(PALETTES);
      launchRocket({ x: W * (0.5 - offset), targetX: W * (0.5 - offset * 1.05), targetY, shape, palette });
      launchRocket({ x: W * (0.5 + offset), targetX: W * (0.5 + offset * 1.05), targetY, shape, palette });
      nextSalvoDelay = rand(0.85, 1.35);
    } else if (pattern < 0.65) {
      // Dual contrast combo (high + mid)
      const x = rand(W * 0.2, W * 0.8);
      launchRocket({
        x,
        targetX: x + rand(-40, 40),
        targetY: rand(horizonY * 0.15, horizonY * 0.32),
        shape: pick(['chrysanthemum', 'willow', 'crossette', 'doubleSpiral'])
      });
      launchRocket({
        x: clampX(x + rand(-W * 0.24, W * 0.24)),
        targetY: rand(horizonY * 0.32, horizonY * 0.5),
        shape: pick(['heart', 'star', 'saturn', 'ring'])
      });
      nextSalvoDelay = rand(0.75, 1.25);
    } else {
      // Single hero launch
      launchRocket();
      nextSalvoDelay = rand(0.45, 0.85);
    }
  }

  function clampX(x) {
    return Math.max(W * 0.1, Math.min(W * 0.9, x));
  }

  function update(dt) {
    time += dt;
    scheduleShow(dt);

    // Update boats on the river
    for (let i = 0; i < boats.length; i++) {
      const b = boats[i];
      b.x += b.vx * dt;
      if (b.vx > 0 && b.x > W + b.len) b.x = -b.len;
      if (b.vx < 0 && b.x < -b.len) b.x = W + b.len;
    }

    // Update rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.age += dt;
      r.vy += r.gravity * dt;

      const wobble = Math.cos(r.age * r.wobbleFreq) * r.wobbleAmp;
      r.x += (r.vx + wobble) * dt;
      r.y += r.vy * dt;

      // Ascending golden spark trail
      r.trailTimer += dt;
      if (r.trailTimer > 0.016) {
        r.trailTimer = 0;
        spawnParticle({
          x: r.x,
          y: r.y,
          vx: rand(-22, 22) * r.scale,
          vy: rand(20, 65) * r.scale,
          color: '#ffbe0b',
          coreColor: '#fff6cc',
          size: rand(1.6, 2.6) * r.scale,
          drag: 0.92,
          gravity: 60 * r.scale,
          life: rand(0.22, 0.38),
          trailLength: 4,
          glitter: true
        });
      }

      if (r.age >= r.flightTime || r.vy >= -15 * r.scale) {
        explodeRocket(r);
        rockets.splice(i, 1);
      }
    }

    // Update flashes
    for (let i = flashes.length - 1; i >= 0; i--) {
      const f = flashes[i];
      f.alpha -= f.decay * dt;
      if (f.alpha <= 0) flashes.splice(i, 1);
    }

    // Update smoke puffs
    for (let i = smokePuffs.length - 1; i >= 0; i--) {
      const s = smokePuffs[i];
      s.age += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.radius += 8 * dt;
      if (s.age >= s.life) smokePuffs.splice(i, 1);
    }

    // Update firework particles
    const frameFactor = dt * 60;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life) {
        if (p.splitOnDeath) {
          // Crossette 4-way split
          const spd = 85 * p.scale;
          for (let k = 0; k < 4; k++) {
            const a = (k / 4) * Math.PI * 2 + rand(-0.2, 0.2);
            spawnParticle({
              x: p.x,
              y: p.y,
              vx: p.vx * 0.25 + Math.cos(a) * spd,
              vy: p.vy * 0.25 + Math.sin(a) * spd,
              color: p.splitColor,
              coreColor: '#ffffff',
              size: p.size * 0.78,
              drag: 0.955,
              gravity: p.gravity,
              life: rand(0.45, 0.68),
              trailLength: 5,
              glitter: true
            });
          }
        }
        particles.splice(i, 1);
        continue;
      }

      // Shift trail history
      for (let h = p.history.length - 1; h > 0; h--) {
        p.history[h].x = p.history[h - 1].x;
        p.history[h].y = p.history[h - 1].y;
      }
      p.history[0].x = p.x;
      p.history[0].y = p.y;

      const dragFactor = Math.pow(p.drag, frameFactor);
      p.vx *= dragFactor;
      p.vy = p.vy * dragFactor + p.gravity * dt;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function renderSkyScene() {
    // 1. Static sky + moon + horizon glow
    skyCtx.globalCompositeOperation = 'source-over';
    skyCtx.globalAlpha = 1;
    skyCtx.drawImage(bgCanvas, 0, 0);

    // 2. Twinkling stars
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      const twinkle = 0.65 + 0.35 * Math.sin(time * st.speed + st.phase);
      skyCtx.globalAlpha = st.baseAlpha * twinkle;
      skyCtx.fillStyle = st.tint;
      skyCtx.beginPath();
      skyCtx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      skyCtx.fill();
    }
    skyCtx.globalAlpha = 1;

    // 3. Illuminated ambient smoke puffs
    skyCtx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < smokePuffs.length; i++) {
      const s = smokePuffs[i];
      const lifeRatio = 1 - s.age / s.life;
      const alpha = s.alpha * Math.sin(lifeRatio * Math.PI);
      const grad = skyCtx.createRadialGradient(s.x, s.y, 1, s.x, s.y, s.radius);
      grad.addColorStop(0, `rgba(${s.rgb[0]}, ${s.rgb[1]}, ${s.rgb[2]}, ${alpha})`);
      grad.addColorStop(1, `rgba(${s.rgb[0]}, ${s.rgb[1]}, ${s.rgb[2]}, 0)`);
      skyCtx.fillStyle = grad;
      skyCtx.beginPath();
      skyCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      skyCtx.fill();
    }

    // 4. Burst flashes lighting up the night sky
    for (let i = 0; i < flashes.length; i++) {
      const f = flashes[i];
      const grad = skyCtx.createRadialGradient(f.x, f.y, 2, f.x, f.y, f.radius);
      grad.addColorStop(0, `rgba(255, 255, 255, ${f.alpha * 0.9})`);
      grad.addColorStop(0.25, `rgba(${f.rgb[0]}, ${f.rgb[1]}, ${f.rgb[2]}, ${f.alpha * 0.55})`);
      grad.addColorStop(1, `rgba(${f.rgb[0]}, ${f.rgb[1]}, ${f.rgb[2]}, 0)`);
      skyCtx.fillStyle = grad;
      skyCtx.beginPath();
      skyCtx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
      skyCtx.fill();
    }

    // 5. Ascending rockets
    for (let i = 0; i < rockets.length; i++) {
      const r = rockets[i];
      skyCtx.fillStyle = '#ffffff';
      skyCtx.beginPath();
      skyCtx.arc(r.x, r.y, 2.8 * r.scale, 0, Math.PI * 2);
      skyCtx.fill();

      const glow = skyCtx.createRadialGradient(r.x, r.y, 1, r.x, r.y, 16 * r.scale);
      glow.addColorStop(0, 'rgba(255, 220, 130, 0.85)');
      glow.addColorStop(1, 'rgba(255, 120, 30, 0)');
      skyCtx.fillStyle = glow;
      skyCtx.beginPath();
      skyCtx.arc(r.x, r.y, 16 * r.scale, 0, Math.PI * 2);
      skyCtx.fill();
    }

    // 6. Firework burst particles & luminous trails
    skyCtx.lineCap = 'round';
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const progress = p.age / p.life;
      const fade = Math.pow(1 - progress, 1.35);

      let alpha = fade;
      if (p.glitter && progress > 0.35) {
        const strobe = Math.sin(time * 38 + p.glitterPhase);
        alpha *= strobe > 0 ? 1.15 : 0.2;
      }
      if (alpha <= 0.02) continue;

      const tail = p.history[p.history.length - 1];
      skyCtx.globalAlpha = Math.min(1, alpha * 0.88);
      skyCtx.strokeStyle = p.color;
      skyCtx.lineWidth = p.size * (0.45 + 0.55 * fade);
      skyCtx.beginPath();
      skyCtx.moveTo(tail.x, tail.y);
      skyCtx.lineTo(p.x, p.y);
      skyCtx.stroke();

      // Glowing tip
      skyCtx.globalAlpha = Math.min(1, alpha);
      skyCtx.fillStyle = p.coreColor;
      skyCtx.beginPath();
      skyCtx.arc(p.x, p.y, p.size * 0.62, 0, Math.PI * 2);
      skyCtx.fill();
    }

    skyCtx.globalAlpha = 1;
    skyCtx.globalCompositeOperation = 'source-over';

    // 7. City skyline silhouette & glowing windows in front of lower sky
    skyCtx.drawImage(cityCanvas, 0, 0);
  }

  function renderRiverReflection() {
    const riverH = H - horizonY;
    const scale = Math.min(W, H) / 1080;

    // Base dark water gradient
    const waterGrad = ctx.createLinearGradient(0, horizonY, 0, H);
    waterGrad.addColorStop(0, '#09091e');
    waterGrad.addColorStop(0.45, '#050615');
    waterGrad.addColorStop(1, '#020208');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, horizonY, W, riverH);

    // Horizontal ripple strip reflections of the entire skyCanvas (fireworks + skyline + lights)
    ctx.save();
    const stripBase = Math.max(1, Math.floor(2 * DPR));
    let y = 0;
    while (y < riverH) {
      const depth = y / riverH; // 0 at shoreline -> 1 at bottom of screen
      const stripH = Math.max(stripBase, Math.floor((1.5 + depth * 4.5) * DPR));

      // Map river y to vertical coordinate in skyCanvas (flipped vertically, slightly compressed)
      const skyY = Math.floor(horizonY - 1 - (y * (horizonY / riverH) * 0.92));
      if (skyY >= 0 && skyY < horizonY) {
        const srcH = Math.max(1, Math.min(horizonY - skyY, Math.ceil(stripH * 1.4)));
        // Animated harmonic water wave displacement
        const wave =
          Math.sin(y * 0.14 - time * 4.2) * (1.5 + depth * 18) * scale +
          Math.cos(y * 0.05 + time * 2.7) * (1.0 + depth * 9) * scale;

        ctx.globalAlpha = Math.max(0.12, (1 - depth * 0.68) * 0.82);
        ctx.drawImage(
          skyCanvas,
          0, skyY, W, srcH,
          wave, horizonY + y, W, stripH
        );
      }
      y += stripH;
    }
    ctx.restore();

    // Specular horizontal water shimmer streaks from active bursts & city lights
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < flashes.length; i++) {
      const f = flashes[i];
      const reflGrad = ctx.createRadialGradient(
        f.x, horizonY + (horizonY - f.y) * 0.42, 4 * scale,
        f.x, horizonY + (horizonY - f.y) * 0.42, f.radius * 0.85
      );
      reflGrad.addColorStop(0, `rgba(${f.rgb[0]}, ${f.rgb[1]}, ${f.rgb[2]}, ${f.alpha * 0.42})`);
      reflGrad.addColorStop(1, `rgba(${f.rgb[0]}, ${f.rgb[1]}, ${f.rgb[2]}, 0)`);
      ctx.fillStyle = reflGrad;
      ctx.fillRect(0, horizonY, W, riverH);
    }

    // Crisp glittering water ripples triggered by bright overhead firework particles
    const step = Math.max(1, Math.floor(particles.length / 90));
    for (let i = 0; i < particles.length; i += step) {
      const p = particles[i];
      const progress = p.age / p.life;
      if (progress > 0.82) continue;
      const relY = (horizonY - p.y) / horizonY;
      if (relY < 0 || relY > 1) continue;

      const ry = horizonY + relY * riverH * 0.92;
      const shimmerW = (6 + relY * 26) * scale * (1 - progress);
      const shimmerH = Math.max(1.2, 2.0 * scale);
      const waveOffset = Math.sin(ry * 0.22 - time * 5.5 + i) * (3 + relY * 14) * scale;

      ctx.globalAlpha = (1 - progress) * 0.48;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x + waveOffset - shimmerW * 0.5, ry, shimmerW, shimmerH);
    }
    ctx.restore();

    // Dark water trough overlay lines for realistic river texture
    ctx.save();
    ctx.fillStyle = 'rgba(2, 3, 12, 0.34)';
    const lineCount = 46;
    for (let i = 0; i < lineCount; i++) {
      const t = i / lineCount;
      const wy = horizonY + Math.pow(t, 1.35) * riverH;
      const h = (1.0 + t * 2.8) * DPR;
      const shift = Math.sin(t * 25 + time * 1.8) * 30 * scale;
      ctx.fillRect(0, wy, W, h * 0.55);
      ctx.clearRect((W * ((i * 0.37) % 1) + shift + W) % W, wy, 45 * scale, h * 0.6);
    }
    ctx.restore();

    // Slowly gliding river boats & their warm water reflections
    for (let i = 0; i < boats.length; i++) {
      const b = boats[i];
      const hullH = 4.5 * scale;
      // Boat reflection on water
      const rgb = hexToRgb(b.color);
      const bGlow = ctx.createRadialGradient(b.x, b.y + 6 * scale, 1, b.x, b.y + 6 * scale, b.len * 0.8);
      bGlow.addColorStop(0, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.45)`);
      bGlow.addColorStop(1, `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0)`);
      ctx.fillStyle = bGlow;
      ctx.fillRect(b.x - b.len, b.y, b.len * 2, 18 * scale);

      // Boat silhouette
      ctx.fillStyle = '#050612';
      ctx.beginPath();
      ctx.moveTo(b.x - b.len * 0.5, b.y);
      ctx.lineTo(b.x + b.len * 0.5, b.y);
      ctx.lineTo(b.x + b.len * 0.38, b.y + hullH);
      ctx.lineTo(b.x - b.len * 0.38, b.y + hullH);
      ctx.closePath();
      ctx.fill();

      // Cabin lights
      ctx.fillStyle = b.color;
      for (let k = -2; k <= 2; k++) {
        ctx.fillRect(b.x + k * b.len * 0.14 - 1.5 * scale, b.y - 2.2 * scale, 3 * scale, 2 * scale);
      }
    }

    // Shoreline divider sheen
    const shoreGrad = ctx.createLinearGradient(0, horizonY - 2 * scale, 0, horizonY + 8 * scale);
    shoreGrad.addColorStop(0, 'rgba(255, 190, 110, 0.35)');
    shoreGrad.addColorStop(0.4, 'rgba(15, 20, 50, 0.85)');
    shoreGrad.addColorStop(1, 'rgba(5, 6, 20, 0)');
    ctx.fillStyle = shoreGrad;
    ctx.fillRect(0, horizonY - 2 * scale, W, 10 * scale);
  }

  function startImmediateShow() {
    const scale = Math.min(W, H) / 1080;
    // Immediately burst 3 vivid fireworks in the sky so frame 1 is already spectacular
    const initialBursts = [
      { x: W * 0.28, y: horizonY * 0.30, shape: 'chrysanthemum', palette: PALETTES[0] },
      { x: W * 0.72, y: horizonY * 0.26, shape: 'saturn', palette: PALETTES[1] },
      { x: W * 0.50, y: horizonY * 0.22, shape: 'heart', palette: PALETTES[7] }
    ];

    initialBursts.forEach((b, idx) => {
      explodeRocket({
        x: b.x,
        y: b.y,
        shape: b.shape,
        palette: b.palette,
        scale
      });
      // Advance initial particles slightly so the bursts are already bloomed at t=0
      const simSteps = idx === 2 ? 8 : 16;
      for (let s = 0; s < simSteps; s++) {
        update(0.016);
      }
    });

    // Also launch 2 ascending rockets right away
    launchRocket({ x: W * 0.2, targetX: W * 0.24, targetY: horizonY * 0.34, shape: 'star' });
    launchRocket({ x: W * 0.8, targetX: W * 0.76, targetY: horizonY * 0.32, shape: 'willow' });
  }

  window.addEventListener('resize', resize);
  resize();
  startImmediateShow();

  let prevNow = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - prevNow) / 1000));
    prevNow = now;

    update(dt);
    renderSkyScene();

    // Draw upper sky + city onto main canvas
    ctx.drawImage(skyCanvas, 0, 0);

    // Draw reflected river scene on lower canvas
    renderRiverReflection();

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
