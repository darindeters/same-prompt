<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fireworks over the River</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    user-select: none;
    cursor: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  // Offscreen canvases for static city layer and dynamic sky/fireworks layer
  const skyBuffer = document.createElement('canvas');
  const skyCtx = skyBuffer.getContext('2d', { alpha: false });

  const cityBuffer = document.createElement('canvas');
  const cityCtx = cityBuffer.getContext('2d');

  const cityReflectBuffer = document.createElement('canvas');
  const cityReflectCtx = cityReflectBuffer.getContext('2d');

  let width = 1080;
  let height = 1080;
  let dpr = 1;
  let horizonY = 720; // ~66.7% down the screen

  // Deterministic PRNG for procedural city layout
  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  let stars = [];
  let buildings = [];
  let bridgeLights = [];
  let boats = [];
  let rockets = [];
  let particles = [];
  let shockwaves = [];
  let ambientFlash = { r: 0, g: 0, b: 0, a: 0 };

  // Rich curated firework palettes
  const PALETTES = [
    { name: 'gold_willow', hues: [42, 46, 38], sat: 95, light: 68, secondary: 32 },
    { name: 'crimson_gold', hues: [352, 358, 45], sat: 95, light: 62, secondary: 45 },
    { name: 'cyber_cyan_magenta', hues: [188, 195, 315, 325], sat: 100, light: 65, secondary: 190 },
    { name: 'emerald_silver', hues: [142, 152, 165], sat: 92, light: 65, secondary: 180 },
    { name: 'royal_violet_amber', hues: [272, 282, 38, 45], sat: 95, light: 66, secondary: 42 },
    { name: 'sakura_pearl', hues: [332, 342, 200], sat: 90, light: 74, secondary: 338 },
    { name: 'solar_flare', hues: [16, 28, 44, 52], sat: 100, light: 64, secondary: 35 },
    { name: 'sapphire_champagne', hues: [212, 224, 44], sat: 94, light: 68, secondary: 44 },
    { name: 'rainbow_brocade', hues: [0, 45, 130, 195, 275, 320], sat: 95, light: 65, secondary: 50 }
  ];

  const BURST_SHAPES = [
    'chrysanthemum',
    'peony',
    'willow',
    'double_ring',
    'heart',
    'star',
    'spiral',
    'palm',
    'crossette',
    'saturn'
  ];

  function generateSceneGeometry() {
    const rand = mulberry32(20261022);
    horizonY = Math.round(height * 0.675);

    // 1. Generate twinkling stars
    stars = [];
    const starCount = Math.floor((width * horizonY) / 3800);
    for (let i = 0; i < starCount; i++) {
      const y = rand() * (horizonY * 0.88);
      const heightFactor = 1 - (y / horizonY);
      stars.push({
        x: rand() * width,
        y,
        r: (0.5 + rand() * 1.3) * (width / 1080),
        baseAlpha: (0.2 + rand() * 0.65) * heightFactor,
        phase: rand() * Math.PI * 2,
        speed: 0.8 + rand() * 2.5,
        hue: rand() < 0.3 ? 215 : (rand() < 0.5 ? 38 : 0)
      });
    }

    // 2. Generate layered skyline buildings (back, mid, front)
    buildings = [];
    const scale = width / 1080;

    // Layer 0: Distant blue-black silhouettes
    let x = -20 * scale;
    while (x < width + 20 * scale) {
      const bw = (38 + rand() * 58) * scale;
      const centerWeight = 1 - Math.abs((x + bw * 0.5) / width - 0.5) * 1.15;
      const bh = (65 + rand() * 165 * Math.max(0.35, centerWeight)) * scale;
      buildings.push({
        layer: 0,
        x,
        w: bw,
        h: bh,
        color: '#080e1f',
        edgeColor: '#121d38',
        roofType: rand() < 0.35 ? 'stepped' : 'flat',
        windows: createWindows(x, horizonY - bh, bw, bh, 0, rand, scale)
      });
      x += bw - (4 + rand() * 8) * scale;
    }

    // Layer 1: Midground architectural towers
    x = -15 * scale;
    while (x < width + 15 * scale) {
      const bw = (34 + rand() * 56) * scale;
      const distFromCenter = Math.abs((x + bw * 0.5) / width - 0.5);
      const skylineCurve = Math.max(0.28, 1 - Math.pow(distFromCenter * 1.55, 1.6));
      let bh = (55 + rand() * 210 * skylineCurve) * scale;

      // Keep a suspension bridge corridor slightly lower on the right-center
      const normX = (x + bw * 0.5) / width;
      if (normX > 0.62 && normX < 0.84) {
        bh *= 0.42;
      }

      const roofRoll = rand();
      let roofType = 'flat';
      if (roofRoll < 0.22) roofType = 'spire';
      else if (roofRoll < 0.44) roofType = 'crown';
      else if (roofRoll < 0.62) roofType = 'slanted';
      else if (roofRoll < 0.78) roofType = 'dome';

      buildings.push({
        layer: 1,
        x,
        w: bw,
        h: bh,
        color: '#050914',
        edgeColor: '#0e182e',
        roofType,
        beacon: bh > 170 * scale && rand() < 0.75,
        beaconPhase: rand() * Math.PI * 2,
        windows: createWindows(x, horizonY - bh, bw, bh, 1, rand, scale)
      });
      x += bw + (rand() * 14 - 4) * scale;
    }

    // Hero Landmark Tower (left-center supertall spire)
    const heroX = width * 0.27;
    const heroW = 54 * scale;
    const heroH = 295 * scale;
    buildings.push({
      layer: 1,
      x: heroX,
      w: heroW,
      h: heroH,
      color: '#040812',
      edgeColor: '#162544',
      roofType: 'supertall',
      beacon: true,
      beaconPhase: 0,
      windows: createWindows(heroX, horizonY - heroH, heroW, heroH, 1, rand, scale, true)
    });

    // Layer 2: Foreground crisp dark buildings and waterfront warehouses
    x = -10 * scale;
    while (x < width + 10 * scale) {
      const bw = (28 + rand() * 48) * scale;
      const normX = (x + bw * 0.5) / width;
      let bh = (28 + rand() * 92) * scale;
      if (normX > 0.60 && normX < 0.86) {
        bh = (14 + rand() * 22) * scale;
      }
      buildings.push({
        layer: 2,
        x,
        w: bw,
        h: bh,
        color: '#03050c',
        edgeColor: '#0a1122',
        roofType: rand() < 0.3 ? 'stepped' : 'flat',
        beacon: false,
        windows: createWindows(x, horizonY - bh, bw, bh, 2, rand, scale)
      });
      x += bw + (rand() * 18 - 2) * scale;
    }

    // 3. Generate riverboats drifting slowly
    boats = [
      { x: width * 0.22, y: horizonY + 34 * scale, dir: 1, speed: 6 * scale, len: 36 * scale, color: '#ffcf70' },
      { x: width * 0.68, y: horizonY + 62 * scale, dir: -1, speed: 4.5 * scale, len: 46 * scale, color: '#ff9e5e' },
      { x: width * 0.45, y: horizonY + 19 * scale, dir: 1, speed: 3.2 * scale, len: 26 * scale, color: '#7ce8ff' }
    ];

    renderStaticCityBuffers();
  }

  function createWindows(bx, by, bw, bh, layer, rand, scale, isHero = false) {
    const wins = [];
    const style = isHero ? 2 : Math.floor(rand() * 3); // 0: grid, 1: horizontal bands, 2: vertical strips
    const padX = 5 * scale;
    const padY = 8 * scale;
    const innerW = bw - padX * 2;
    const innerH = bh - padY * 2;
    if (innerW <= 4 || innerH <= 8) return wins;

    const warmColors = ['#ffdfa0', '#ffcc73', '#ffeac2', '#ffae52', '#a8d8ff', '#7ec4ff'];

    if (style === 0) {
      const colW = (4.2 + (layer === 0 ? 1 : 0)) * scale;
      const rowH = 5.5 * scale;
      const cols = Math.max(1, Math.floor(innerW / colW));
      const rows = Math.max(1, Math.floor(innerH / rowH));
      for (let r = 0; r < rows; r++) {
        const floorLit = rand() < 0.65;
        for (let c = 0; c < cols; c++) {
          if (floorLit && rand() < (layer === 0 ? 0.25 : 0.42)) {
            const color = warmColors[Math.floor(rand() * warmColors.length)];
            wins.push({
              x: bx + padX + c * colW,
              y: by + padY + r * rowH,
              w: Math.max(1.2, colW * 0.52),
              h: Math.max(1.5, rowH * 0.55),
              color,
              alpha: (layer === 0 ? 0.28 : 0.52) + rand() * 0.35
            });
          }
        }
      }
    } else if (style === 1) {
      const rowH = 7.5 * scale;
      const rows = Math.max(1, Math.floor(innerH / rowH));
      for (let r = 0; r < rows; r++) {
        if (rand() < 0.48) {
          const segs = 1 + Math.floor(rand() * 2);
          for (let s = 0; s < segs; s++) {
            const sw = (innerW / segs) * (0.4 + rand() * 0.45);
            const sx = bx + padX + s * (innerW / segs) + rand() * 3 * scale;
            const color = warmColors[Math.floor(rand() * warmColors.length)];
            wins.push({
              x: sx,
              y: by + padY + r * rowH,
              w: sw,
              h: 2.1 * scale,
              color,
              alpha: 0.35 + rand() * 0.45
            });
          }
        }
      }
    } else {
      const cols = Math.max(2, Math.floor(innerW / (6 * scale)));
      const colSpan = innerW / cols;
      for (let c = 0; c < cols; c++) {
        if (isHero || rand() < 0.65) {
          const segH = 10 * scale;
          const rows = Math.floor(innerH / segH);
          for (let r = 0; r < rows; r++) {
            if (rand() < (isHero ? 0.72 : 0.5)) {
              const color = isHero && (c === 0 || c === cols - 1) ? '#7ce8ff' : warmColors[Math.floor(rand() * warmColors.length)];
              wins.push({
                x: bx + padX + c * colSpan + colSpan * 0.25,
                y: by + padY + r * segH,
                w: Math.max(1.3, colSpan * 0.4),
                h: segH * 0.72,
                color,
                alpha: 0.4 + rand() * 0.45
              });
            }
          }
        }
      }
    }
    return wins;
  }

  function renderStaticCityBuffers() {
    cityBuffer.width = width;
    cityBuffer.height = height;
    cityCtx.clearRect(0, 0, width, height);

    const scale = width / 1080;

    // Distant urban horizon glow
    const cityGlow = cityCtx.createLinearGradient(0, horizonY - 190 * scale, 0, horizonY);
    cityGlow.addColorStop(0, 'rgba(18, 30, 68, 0)');
    cityGlow.addColorStop(0.65, 'rgba(38, 52, 98, 0.22)');
    cityGlow.addColorStop(1, 'rgba(255, 175, 95, 0.26)');
    cityCtx.fillStyle = cityGlow;
    cityCtx.fillRect(0, horizonY - 190 * scale, width, 190 * scale);

    // Draw suspension bridge on the right corridor (x: 0.58 to 0.88)
    drawSuspensionBridge(cityCtx, scale);

    // Draw buildings sorted by layer
    for (let layer = 0; layer <= 2; layer++) {
      for (const b of buildings) {
        if (b.layer !== layer) continue;
        const by = horizonY - b.h;

        // Building body
        const bGrad = cityCtx.createLinearGradient(b.x, by, b.x + b.w, horizonY);
        bGrad.addColorStop(0, b.edgeColor);
        bGrad.addColorStop(0.25, b.color);
        bGrad.addColorStop(1, '#020409');
        cityCtx.fillStyle = bGrad;
        cityCtx.fillRect(b.x, by, b.w, b.h);

        // Subtle rim highlight on roof and left edge
        cityCtx.strokeStyle = 'rgba(110, 150, 230, 0.14)';
        cityCtx.lineWidth = 1 * scale;
        cityCtx.strokeRect(b.x + 0.5, by + 0.5, b.w - 1, b.h - 1);

        // Roof details
        cityCtx.fillStyle = b.color;
        if (b.roofType === 'stepped') {
          cityCtx.fillRect(b.x + b.w * 0.16, by - 9 * scale, b.w * 0.68, 9 * scale);
          cityCtx.fillRect(b.x + b.w * 0.32, by - 16 * scale, b.w * 0.36, 7 * scale);
        } else if (b.roofType === 'spire') {
          cityCtx.fillRect(b.x + b.w * 0.22, by - 10 * scale, b.w * 0.56, 10 * scale);
          cityCtx.beginPath();
          cityCtx.moveTo(b.x + b.w * 0.46, by - 10 * scale);
          cityCtx.lineTo(b.x + b.w * 0.5, by - 46 * scale);
          cityCtx.lineTo(b.x + b.w * 0.54, by - 10 * scale);
          cityCtx.closePath();
          cityCtx.fill();
        } else if (b.roofType === 'crown') {
          cityCtx.beginPath();
          cityCtx.moveTo(b.x + b.w * 0.1, by);
          cityCtx.lineTo(b.x + b.w * 0.25, by - 18 * scale);
          cityCtx.lineTo(b.x + b.w * 0.75, by - 18 * scale);
          cityCtx.lineTo(b.x + b.w * 0.9, by);
          cityCtx.closePath();
          cityCtx.fill();
          // Illuminated crown trim
          cityCtx.strokeStyle = 'rgba(255, 215, 145, 0.45)';
          cityCtx.lineWidth = 1.4 * scale;
          cityCtx.stroke();
        } else if (b.roofType === 'slanted') {
          cityCtx.beginPath();
          cityCtx.moveTo(b.x, by);
          cityCtx.lineTo(b.x + b.w, by - 22 * scale);
          cityCtx.lineTo(b.x + b.w, by);
          cityCtx.closePath();
          cityCtx.fill();
        } else if (b.roofType === 'dome') {
          cityCtx.beginPath();
          cityCtx.arc(b.x + b.w * 0.5, by, b.w * 0.36, Math.PI, 0);
          cityCtx.fill();
        } else if (b.roofType === 'supertall') {
          // Tiered setback crown + tall needle
          cityCtx.fillRect(b.x + b.w * 0.14, by - 22 * scale, b.w * 0.72, 22 * scale);
          cityCtx.fillRect(b.x + b.w * 0.28, by - 42 * scale, b.w * 0.44, 20 * scale);
          cityCtx.strokeStyle = 'rgba(130, 225, 255, 0.55)';
          cityCtx.lineWidth = 1.6 * scale;
          cityCtx.strokeRect(b.x + b.w * 0.14, by - 22 * scale, b.w * 0.72, 22 * scale);
          cityCtx.strokeRect(b.x + b.w * 0.28, by - 42 * scale, b.w * 0.44, 20 * scale);

          cityCtx.fillStyle = '#89dcff';
          cityCtx.beginPath();
          cityCtx.moveTo(b.x + b.w * 0.47, by - 42 * scale);
          cityCtx.lineTo(b.x + b.w * 0.5, by - 102 * scale);
          cityCtx.lineTo(b.x + b.w * 0.53, by - 42 * scale);
          cityCtx.closePath();
          cityCtx.fill();
        }

        // Windows
        for (const w of b.windows) {
          cityCtx.globalAlpha = w.alpha;
          cityCtx.fillStyle = w.color;
          cityCtx.fillRect(w.x, w.y, w.w, w.h);
        }
        cityCtx.globalAlpha = 1;
      }
    }

    // Waterfront embankment & glowing promenade lamps
    cityCtx.fillStyle = '#040710';
    cityCtx.fillRect(0, horizonY - 5 * scale, width, 6 * scale);
    cityCtx.fillStyle = 'rgba(255, 200, 120, 0.35)';
    cityCtx.fillRect(0, horizonY - 1 * scale, width, 1.2 * scale);

    const lampStep = 26 * scale;
    for (let lx = 12 * scale; lx < width; lx += lampStep) {
      const isCyan = Math.floor(lx / lampStep) % 5 === 0;
      const col = isCyan ? 'rgba(130, 230, 255, 0.85)' : 'rgba(255, 205, 125, 0.9)';
      cityCtx.fillStyle = col;
      cityCtx.beginPath();
      cityCtx.arc(lx, horizonY - 2.5 * scale, 1.6 * scale, 0, Math.PI * 2);
      cityCtx.fill();

      const halo = cityCtx.createRadialGradient(lx, horizonY - 2.5 * scale, 0, lx, horizonY - 2.5 * scale, 9 * scale);
      halo.addColorStop(0, isCyan ? 'rgba(130, 230, 255, 0.38)' : 'rgba(255, 190, 100, 0.38)');
      halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
      cityCtx.fillStyle = halo;
      cityCtx.beginPath();
      cityCtx.arc(lx, horizonY - 2.5 * scale, 9 * scale, 0, Math.PI * 2);
      cityCtx.fill();
    }

    // Prepare vertically flipped reflection buffer of the static city
    cityReflectBuffer.width = width;
    cityReflectBuffer.height = height - horizonY;
    cityReflectCtx.clearRect(0, 0, width, cityReflectBuffer.height);
    cityReflectCtx.save();
    cityReflectCtx.translate(0, horizonY);
    cityReflectCtx.scale(1, -1);
    cityReflectCtx.drawImage(cityBuffer, 0, 0);
    cityReflectCtx.restore();
  }

  function drawSuspensionBridge(c, scale) {
    const startX = width * 0.56;
    const endX = width * 0.90;
    const span = endX - startX;
    const deckY = horizonY - 24 * scale;
    const t1X = startX + span * 0.26;
    const t2X = startX + span * 0.74;
    const towerTopY = horizonY - 122 * scale;

    c.save();
    c.strokeStyle = '#12203f';
    c.fillStyle = '#0c162c';

    // Towers
    const towerW = 7 * scale;
    for (const tx of [t1X, t2X]) {
      c.fillRect(tx - towerW * 0.5, towerTopY, towerW, horizonY - towerTopY);
      // Cross braces
      for (let y = towerTopY + 18 * scale; y < deckY; y += 22 * scale) {
        c.fillRect(tx - towerW * 0.6, y, towerW * 1.2, 2.5 * scale);
      }
      // Red aviation beacon on bridge towers
      const g = c.createRadialGradient(tx, towerTopY, 0, tx, towerTopY, 8 * scale);
      g.addColorStop(0, 'rgba(255, 90, 90, 0.95)');
      g.addColorStop(1, 'rgba(255, 50, 50, 0)');
      c.fillStyle = g;
      c.beginPath();
      c.arc(tx, towerTopY, 8 * scale, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#0c162c';
    }

    // Main catenary cables & vertical suspenders
    c.strokeStyle = 'rgba(90, 145, 220, 0.42)';
    c.lineWidth = 1.8 * scale;

    const getCableY = (x) => {
      if (x < t1X) {
        const u = (x - startX) / (t1X - startX);
        return deckY - Math.pow(u, 1.75) * (deckY - towerTopY);
      } else if (x <= t2X) {
        const u = ((x - t1X) / (t2X - t1X)) * 2 - 1; // -1 to 1
        const sag = deckY - 6 * scale;
        return sag - (1 - u * u) * (sag - towerTopY) * -1 + (towerTopY - sag);
      } else {
        const u = 1 - (x - t2X) / (endX - t2X);
        return deckY - Math.pow(Math.max(0, u), 1.75) * (deckY - towerTopY);
      }
    };

    // Correct parabola between towers
    const cableHeightAt = (x) => {
      if (x < t1X) {
        const u = (x - startX) / (t1X - startX);
        return deckY - Math.pow(u, 1.7) * (deckY - towerTopY);
      }
      if (x <= t2X) {
        const u = ((x - t1X) / (t2X - t1X)) * 2 - 1;
        const lowY = deckY - 7 * scale;
        return lowY - (u * u) * (lowY - towerTopY);
      }
      const u = 1 - (x - t2X) / (endX - t2X);
      return deckY - Math.pow(Math.max(0, u), 1.7) * (deckY - towerTopY);
    };

    c.beginPath();
    for (let x = startX; x <= endX; x += 3 * scale) {
      const cy = cableHeightAt(x);
      if (x === startX) c.moveTo(x, cy);
      else c.lineTo(x, cy);
    }
    c.stroke();

    // Vertical suspender cables + necklace lights
    c.lineWidth = 0.8 * scale;
    c.strokeStyle = 'rgba(80, 130, 200, 0.24)';
    bridgeLights = [];
    for (let x = startX + 8 * scale; x < endX; x += 10 * scale) {
      const cy = cableHeightAt(x);
      c.beginPath();
      c.moveTo(x, cy);
      c.lineTo(x, deckY);
      c.stroke();

      c.fillStyle = 'rgba(255, 220, 150, 0.75)';
      c.beginPath();
      c.arc(x, cy, 1.1 * scale, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = 'rgba(255, 190, 110, 0.8)';
      c.beginPath();
      c.arc(x, deckY, 1.2 * scale, 0, Math.PI * 2);
      c.fill();
    }

    // Bridge deck
    c.fillStyle = '#0c1528';
    c.fillRect(startX, deckY, span, 3.2 * scale);
    c.restore();
  }

  // Firework Rocket & Particle Engine
  function hslToRgb(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s /= 100;
    l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(255 * f(0)), Math.round(255 * f(8)), Math.round(255 * f(4))];
  }

  function launchRocket(options = {}) {
    const scale = width / 1080;
    const palette = options.palette || PALETTES[Math.floor(Math.random() * PALETTES.length)];
    const shape = options.shape || BURST_SHAPES[Math.floor(Math.random() * BURST_SHAPES.length)];

    const startX = options.x !== undefined ? options.x : width * (0.12 + Math.random() * 0.76);
    const targetX = options.targetX !== undefined ? options.targetX : startX + (Math.random() - 0.5) * 110 * scale;
    const targetY = options.targetY !== undefined ? options.targetY : horizonY * (0.15 + Math.random() * 0.44);

    const startY = horizonY - 6 * scale;
    const flightDuration = 0.95 + Math.random() * 0.35; // seconds
    const gravity = 190 * scale;

    const vx = (targetX - startX) / flightDuration;
    const vy = (targetY - startY - 0.5 * gravity * flightDuration * flightDuration) / flightDuration;

    const hue = palette.hues[Math.floor(Math.random() * palette.hues.length)];

    rockets.push({
      x: startX,
      y: startY,
      prevX: startX,
      prevY: startY,
      vx,
      vy,
      gravity,
      age: 0,
      flightDuration,
      palette,
      shape,
      hue,
      wobbleFreq: 14 + Math.random() * 10,
      wobbleAmp: (shape === 'spiral' || Math.random() < 0.3) ? (22 + Math.random() * 25) * scale : 4 * scale,
      wobblePhase: Math.random() * Math.PI * 2,
      scale: options.burstScale || (0.88 + Math.random() * 0.36)
    });
  }

  function addParticle(p) {
    particles.push(p);
  }

  function explodeRocket(r) {
    const scale = (width / 1080) * r.scale;
    const { x, y, palette, shape } = r;

    const primaryHue = palette.hues[Math.floor(Math.random() * palette.hues.length)];
    const secondaryHue = palette.secondary !== undefined ? palette.secondary : palette.hues[(palette.hues.indexOf(primaryHue) + 1) % palette.hues.length];
    const [cr, cg, cb] = hslToRgb(primaryHue, palette.sat, palette.light);

    // Add expanding illumination flash & shockwave
    ambientFlash.r = Math.min(255, ambientFlash.r * 0.6 + cr * 0.55);
    ambientFlash.g = Math.min(255, ambientFlash.g * 0.6 + cg * 0.55);
    ambientFlash.b = Math.min(255, ambientFlash.b * 0.6 + cb * 0.55);
    ambientFlash.a = Math.min(0.45, ambientFlash.a + 0.16 * r.scale);

    shockwaves.push({
      x,
      y,
      radius: 2 * scale,
      maxRadius: (145 + Math.random() * 75) * scale,
      hue: primaryHue,
      sat: palette.sat,
      light: palette.light,
      alpha: 0.75,
      age: 0,
      duration: 0.55
    });

    const spawnSpark = (vx, vy, hue, opts = {}) => {
      const histLen = opts.trailLength || 7;
      const history = [];
      for (let i = 0; i < histLen; i++) history.push({ x, y });

      addParticle({
        x,
        y,
        vx,
        vy,
        drag: opts.drag || 0.968,
        gravity: opts.gravity !== undefined ? opts.gravity : 98 * scale,
        hue: (hue + (Math.random() - 0.5) * 8 + 360) % 360,
        sat: opts.sat !== undefined ? opts.sat : palette.sat,
        light: opts.light !== undefined ? opts.light : palette.light,
        size: (opts.size || (1.8 + Math.random() * 1.1)) * (width / 1080),
        age: 0,
        life: opts.life || (1.45 + Math.random() * 0.65),
        history,
        twinkle: opts.twinkle || false,
        crackle: opts.crackle || false,
        splitAt: opts.splitAt || 0,
        hasSplit: false
      });
    };

    if (shape === 'heart') {
      const count = 110;
      const tilt = (Math.random() - 0.5) * 0.38;
      const cosT = Math.cos(tilt);
      const sinT = Math.sin(tilt);
      const speedScale = 14.5 * scale;

      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const rx = hx * cosT - hy * sinT;
        const ry = hx * sinT + hy * cosT;
        const jitter = 0.94 + Math.random() * 0.12;
        spawnSpark(rx * speedScale * jitter, ry * speedScale * jitter, primaryHue, {
          drag: 0.962,
          gravity: 72 * scale,
          life: 1.65 + Math.random() * 0.35,
          size: 2.3,
          trailLength: 8,
          twinkle: true
        });
      }
      // Inner shimmer core
      for (let i = 0; i < 36; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = (25 + Math.random() * 65) * scale;
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, secondaryHue, {
          drag: 0.955,
          life: 1.1 + Math.random() * 0.3,
          size: 1.6,
          light: 82
        });
      }
    } else if (shape === 'star') {
      const points = 5 + (Math.random() < 0.35 ? 1 : 0);
      const count = 120;
      const rot = (Math.random() - 0.5) * 0.6 - Math.PI / 2;
      const maxSp = 240 * scale;
      const minSp = 95 * scale;

      for (let i = 0; i < count; i++) {
        const u = (i / count) * points;
        const seg = Math.floor(u);
        const frac = u - seg;
        const a1 = rot + (seg / points) * Math.PI * 2;
        const aMid = rot + ((seg + 0.5) / points) * Math.PI * 2;
        const a2 = rot + ((seg + 1) / points) * Math.PI * 2;

        let vx, vy;
        if (frac < 0.5) {
          const k = frac * 2;
          vx = Math.cos(a1) * maxSp * (1 - k) + Math.cos(aMid) * minSp * k;
          vy = Math.sin(a1) * maxSp * (1 - k) + Math.sin(aMid) * minSp * k;
        } else {
          const k = (frac - 0.5) * 2;
          vx = Math.cos(aMid) * minSp * (1 - k) + Math.cos(a2) * maxSp * k;
          vy = Math.sin(aMid) * minSp * (1 - k) + Math.sin(a2) * maxSp * k;
        }
        const jitter = 0.94 + Math.random() * 0.12;
        spawnSpark(vx * jitter, vy * jitter, primaryHue, {
          drag: 0.964,
          gravity: 76 * scale,
          life: 1.6 + Math.random() * 0.35,
          size: 2.2,
          trailLength: 8,
          twinkle: true
        });
      }
      // Inner ring accent
      for (let i = 0; i < 42; i++) {
        const a = (i / 42) * Math.PI * 2;
        const sp = 85 * scale;
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, secondaryHue, {
          drag: 0.96,
          life: 1.25,
          size: 1.8,
          light: 78
        });
      }
    } else if (shape === 'double_ring' || shape === 'saturn') {
      const outerCount = 78;
      const outerSpeed = 225 * scale;
      for (let i = 0; i < outerCount; i++) {
        const a = (i / outerCount) * Math.PI * 2;
        const sp = outerSpeed * (0.96 + Math.random() * 0.08);
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, primaryHue, {
          drag: 0.964,
          gravity: 80 * scale,
          life: 1.6 + Math.random() * 0.3,
          size: 2.2,
          trailLength: 8,
          twinkle: true
        });
      }

      if (shape === 'saturn') {
        // Tilted elliptical ring + dense central sphere
        const tilt = (Math.random() - 0.5) * 0.7;
        const cosT = Math.cos(tilt);
        const sinT = Math.sin(tilt);
        for (let i = 0; i < 72; i++) {
          const a = (i / 72) * Math.PI * 2;
          const rx = Math.cos(a) * 270 * scale;
          const ry = Math.sin(a) * 78 * scale;
          const vx = rx * cosT - ry * sinT;
          const vy = rx * sinT + ry * cosT;
          spawnSpark(vx, vy, secondaryHue, {
            drag: 0.966,
            gravity: 74 * scale,
            life: 1.7 + Math.random() * 0.25,
            size: 2.1,
            light: 75,
            trailLength: 9
          });
        }
        for (let i = 0; i < 65; i++) {
          const a = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          const sp = 115 * scale * Math.sin(phi);
          spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, primaryHue, {
            drag: 0.96,
            life: 1.35 + Math.random() * 0.3,
            size: 1.9
          });
        }
      } else {
        // Concentric inner ring + glitter core
        const innerCount = 54;
        const innerSpeed = 128 * scale;
        for (let i = 0; i < innerCount; i++) {
          const a = (i / innerCount) * Math.PI * 2;
          const sp = innerSpeed * (0.96 + Math.random() * 0.08);
          spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, secondaryHue, {
            drag: 0.962,
            gravity: 80 * scale,
            life: 1.4 + Math.random() * 0.25,
            size: 2.0,
            light: 76,
            trailLength: 7
          });
        }
      }
    } else if (shape === 'willow') {
      const count = 135;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const sp = (60 + 175 * Math.sin(phi) * (0.75 + Math.random() * 0.25)) * scale;
        const hue = Math.random() < 0.78 ? 42 : secondaryHue;
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp - 22 * scale, hue, {
          drag: 0.977,
          gravity: 122 * scale,
          life: 2.35 + Math.random() * 0.85,
          size: 2.0,
          sat: 92,
          light: 72,
          trailLength: 13,
          twinkle: true
        });
      }
    } else if (shape === 'palm') {
      const fronds = 7 + Math.floor(Math.random() * 4);
      const baseAngle = Math.random() * Math.PI * 2;
      for (let f = 0; f < fronds; f++) {
        const frondAngle = baseAngle + (f / fronds) * Math.PI * 2 + (Math.random() - 0.5) * 0.14;
        const subCount = 16;
        for (let s = 1; s <= subCount; s++) {
          const frac = s / subCount;
          const sp = (65 + frac * 210) * scale;
          const spread = (Math.random() - 0.5) * 0.09 * (1 - frac * 0.5);
          const a = frondAngle + spread;
          spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp - 18 * scale, primaryHue, {
            drag: 0.972,
            gravity: 118 * scale,
            life: 1.55 + frac * 0.75,
            size: 1.6 + frac * 1.4,
            trailLength: 11,
            twinkle: s === subCount
          });
        }
      }
      // Golden pistil burst
      for (let i = 0; i < 38; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = (30 + Math.random() * 75) * scale;
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, secondaryHue, {
          drag: 0.955,
          life: 1.0 + Math.random() * 0.4,
          size: 1.5,
          light: 82
        });
      }
    } else if (shape === 'spiral') {
      const arms = 3 + (Math.random() < 0.5 ? 1 : 0);
      const perArm = 36;
      const baseRot = Math.random() * Math.PI * 2;
      for (let arm = 0; arm < arms; arm++) {
        const armHue = palette.hues[arm % palette.hues.length];
        for (let i = 0; i < perArm; i++) {
          const frac = (i + 1) / perArm;
          const theta = baseRot + (arm / arms) * Math.PI * 2 + frac * Math.PI * 1.85;
          const sp = (35 + frac * 225) * scale;
          spawnSpark(Math.cos(theta) * sp, Math.sin(theta) * sp, armHue, {
            drag: 0.965,
            gravity: 78 * scale,
            life: 1.45 + frac * 0.55,
            size: 1.6 + frac * 1.1,
            trailLength: 9,
            twinkle: true
          });
        }
      }
    } else if (shape === 'crossette') {
      const count = 42;
      for (let i = 0; i < count; i++) {
        const a = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.08;
        const sp = (155 + Math.random() * 65) * scale;
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, primaryHue, {
          drag: 0.972,
          gravity: 85 * scale,
          life: 1.45 + Math.random() * 0.3,
          size: 2.5,
          trailLength: 9,
          splitAt: 0.52 + Math.random() * 0.2
        });
      }
    } else {
      // Chrysanthemum / Multi-layered Peony
      const count = shape === 'chrysanthemum' ? 145 : 120;
      const trailLen = shape === 'chrysanthemum' ? 11 : 7;
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const ringFactor = Math.sin(phi);
        const sp = (180 + Math.random() * 75) * ringFactor * scale;
        const hue = palette.hues[i % palette.hues.length];
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, hue, {
          drag: shape === 'chrysanthemum' ? 0.972 : 0.964,
          gravity: 92 * scale,
          life: (shape === 'chrysanthemum' ? 1.85 : 1.55) + Math.random() * 0.45,
          size: 2.0 + Math.random() * 0.8,
          trailLength: trailLen,
          twinkle: Math.random() < 0.45,
          crackle: Math.random() < 0.18
        });
      }
      // Inner pistil core
      for (let i = 0; i < 45; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = (40 + Math.random() * 75) * scale;
        spawnSpark(Math.cos(a) * sp, Math.sin(a) * sp, secondaryHue, {
          drag: 0.958,
          life: 1.15 + Math.random() * 0.3,
          size: 1.7,
          light: 80,
          trailLength: 6
        });
      }
    }
  }

  // Choreographed Show Director
  let directorTimer = 0;
  let patternTimer = 2.6;
  let elapsedTime = 0;

  function updateDirector(dt) {
    directorTimer -= dt;
    patternTimer -= dt;

    // Continuous cadence of solo or duo bursts
    if (directorTimer <= 0) {
      const activeBursts = rockets.length + (particles.length / 95);
      if (activeBursts < 9) {
        launchRocket();
        if (Math.random() < 0.38) {
          launchRocket();
        }
      }
      directorTimer = 0.55 + Math.random() * 0.65;
    }

    // Coordinated symmetric / fan / wave sequences
    if (patternTimer <= 0) {
      const patternRoll = Math.floor(Math.random() * 4);
      const palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      const specialShapes = ['heart', 'star', 'double_ring', 'saturn', 'willow', 'palm', 'spiral', 'crossette'];
      const shape = specialShapes[Math.floor(Math.random() * specialShapes.length)];

      if (patternRoll === 0) {
        // Twin mirrored bursts framing the skyline
        const offset = 0.18 + Math.random() * 0.14;
        const targetY = horizonY * (0.20 + Math.random() * 0.24);
        launchRocket({
          x: width * offset,
          targetX: width * (offset + 0.03),
          targetY,
          palette,
          shape,
          burstScale: 1.08
        });
        launchRocket({
          x: width * (1 - offset),
          targetX: width * (1 - offset - 0.03),
          targetY,
          palette,
          shape,
          burstScale: 1.08
        });
      } else if (patternRoll === 1) {
        // 3-shot architectural crown fan
        const centerShape = specialShapes[Math.floor(Math.random() * specialShapes.length)];
        const sideShape = 'double_ring';
        launchRocket({
          x: width * 0.5,
          targetX: width * 0.26,
          targetY: horizonY * 0.30,
          palette,
          shape: sideShape,
          burstScale: 0.95
        });
        launchRocket({
          x: width * 0.5,
          targetX: width * 0.5,
          targetY: horizonY * 0.19,
          palette,
          shape: centerShape,
          burstScale: 1.22
        });
        launchRocket({
          x: width * 0.5,
          targetX: width * 0.74,
          targetY: horizonY * 0.30,
          palette,
          shape: sideShape,
          burstScale: 0.95
        });
      } else if (patternRoll === 2) {
        // Sweeping waterfront barrage (4 rockets across the skyline)
        const dir = Math.random() < 0.5 ? 1 : -1;
        for (let i = 0; i < 4; i++) {
          const u = dir === 1 ? i / 3 : 1 - i / 3;
          const xPos = width * (0.18 + u * 0.64);
          const archY = horizonY * (0.22 + Math.abs(u - 0.5) * 0.28);
          launchRocket({
            x: xPos,
            targetX: xPos,
            targetY: archY,
            palette: PALETTES[( PALETTES.indexOf(palette) + i ) % PALETTES.length],
            shape: BURST_SHAPES[(i * 2) % BURST_SHAPES.length],
            burstScale: 0.95
          });
        }
      } else {
        // Grand high-altitude willow + heart/star centerpiece
        launchRocket({
          x: width * 0.48,
          targetX: width * 0.48,
          targetY: horizonY * 0.22,
          palette: PALETTES[0],
          shape: 'willow',
          burstScale: 1.28
        });
        launchRocket({
          x: width * 0.52,
          targetX: width * 0.52,
          targetY: horizonY * 0.26,
          palette,
          shape: Math.random() < 0.5 ? 'heart' : 'star',
          burstScale: 1.05
        });
      }

      patternTimer = 3.6 + Math.random() * 2.2;
    }
  }

  function updatePhysics(dt) {
    const scale = width / 1080;

    // Fade ambient sky flash
    ambientFlash.a *= Math.pow(0.08, dt);

    // Update boats on the river
    for (const boat of boats) {
      boat.x += boat.dir * boat.speed * dt;
      if (boat.dir > 0 && boat.x > width + 60 * scale) boat.x = -60 * scale;
      if (boat.dir < 0 && boat.x < -60 * scale) boat.x = width + 60 * scale;
    }

    // Update ascending rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.prevX = r.x;
      r.prevY = r.y;
      r.age += dt;
      r.vy += r.gravity * dt;

      const wobble = Math.cos(r.age * r.wobbleFreq + r.wobblePhase) * r.wobbleAmp;
      r.x += (r.vx + wobble) * dt;
      r.y += r.vy * dt;

      // Emit golden ascending tail sparks
      if (Math.random() < 0.85) {
        const hist = [{ x: r.x, y: r.y }, { x: r.prevX, y: r.prevY }];
        particles.push({
          x: r.x + (Math.random() - 0.5) * 2 * scale,
          y: r.y + (Math.random() - 0.5) * 2 * scale,
          vx: (Math.random() - 0.5) * 24 * scale - r.vx * 0.12,
          vy: (20 + Math.random() * 35) * scale,
          drag: 0.92,
          gravity: 60 * scale,
          hue: 40 + (Math.random() - 0.5) * 14,
          sat: 95,
          light: 74,
          size: (1.2 + Math.random() * 0.9) * scale,
          age: 0,
          life: 0.25 + Math.random() * 0.22,
          history: hist,
          twinkle: false,
          crackle: false,
          splitAt: 0,
          hasSplit: true
        });
      }

      if (r.age >= r.flightDuration || r.vy >= -12 * scale) {
        explodeRocket(r);
        rockets.splice(i, 1);
      }
    }

    // Update shockwaves
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.age += dt;
      if (sw.age >= sw.duration) {
        shockwaves.splice(i, 1);
        continue;
      }
      const p = sw.age / sw.duration;
      sw.radius = sw.maxRadius * (1 - Math.pow(1 - p, 3));
      sw.alpha = (1 - p) * 0.65;
    }

    // Update burst particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.age += dt;
      if (p.age >= p.life || p.y > horizonY + 8 * scale) {
        particles.splice(i, 1);
        continue;
      }

      // Crossette secondary splitting
      if (p.splitAt > 0 && !p.hasSplit && p.age >= p.life * p.splitAt) {
        p.hasSplit = true;
        const subSpeed = 68 * scale;
        const baseA = Math.atan2(p.vy, p.vx);
        for (let k = 0; k < 4; k++) {
          const a = baseA + (k * Math.PI) / 2 + (Math.random() - 0.5) * 0.2;
          const hist = [];
          for (let h = 0; h < 5; h++) hist.push({ x: p.x, y: p.y });
          particles.push({
            x: p.x,
            y: p.y,
            vx: p.vx * 0.35 + Math.cos(a) * subSpeed,
            vy: p.vy * 0.35 + Math.sin(a) * subSpeed,
            drag: 0.955,
            gravity: p.gravity,
            hue: (p.hue + 35) % 360,
            sat: 95,
            light: 78,
            size: p.size * 0.78,
            age: 0,
            life: 0.55 + Math.random() * 0.25,
            history: hist,
            twinkle: true,
            crackle: false,
            splitAt: 0,
            hasSplit: true
          });
        }
      }

      // Advance trail history
      for (let h = p.history.length - 1; h > 0; h--) {
        p.history[h].x = p.history[h - 1].x;
        p.history[h].y = p.history[h - 1].y;
      }
      p.history[0].x = p.x;
      p.history[0].y = p.y;

      const dragStep = Math.pow(p.drag, dt * 60);
      p.vx *= dragStep;
      p.vy = p.vy * dragStep + p.gravity * dt;

      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  function renderSkyToBuffer(time) {
    const scale = width / 1080;

    // 1. Night sky gradient with persistence trail fade
    const skyGrad = skyCtx.createLinearGradient(0, 0, 0, horizonY);
    skyGrad.addColorStop(0, 'rgba(3, 5, 15, 0.28)');
    skyGrad.addColorStop(0.55, 'rgba(6, 11, 28, 0.30)');
    skyGrad.addColorStop(1, 'rgba(15, 22, 48, 0.34)');
    skyCtx.fillStyle = skyGrad;
    skyCtx.fillRect(0, 0, width, horizonY);

    // Ambient firework flash illuminating the sky
    if (ambientFlash.a > 0.005) {
      skyCtx.fillStyle = `rgba(${Math.round(ambientFlash.r)}, ${Math.round(ambientFlash.g)}, ${Math.round(ambientFlash.b)}, ${ambientFlash.a.toFixed(3)})`;
      skyCtx.fillRect(0, 0, width, horizonY);
    }

    // 2. Twinkling stars
    for (const s of stars) {
      const tw = 0.65 + 0.35 * Math.sin(time * s.speed + s.phase);
      const a = s.baseAlpha * tw;
      skyCtx.fillStyle = s.hue === 0
        ? `rgba(255, 255, 255, ${a.toFixed(3)})`
        : `hsla(${s.hue}, 80%, 85%, ${a.toFixed(3)})`;
      skyCtx.beginPath();
      skyCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      skyCtx.fill();
    }

    // 3. Additive rendering for shockwaves, rockets, and firework particles
    skyCtx.save();
    skyCtx.globalCompositeOperation = 'lighter';
    skyCtx.lineCap = 'round';

    // Shockwave blooms
    for (const sw of shockwaves) {
      const grad = skyCtx.createRadialGradient(sw.x, sw.y, 0, sw.x, sw.y, sw.radius);
      grad.addColorStop(0, `hsla(${sw.hue}, ${sw.sat}%, 92%, ${(sw.alpha * 0.65).toFixed(3)})`);
      grad.addColorStop(0.45, `hsla(${sw.hue}, ${sw.sat}%, ${sw.light}%, ${(sw.alpha * 0.28).toFixed(3)})`);
      grad.addColorStop(1, `hsla(${sw.hue}, ${sw.sat}%, 50%, 0)`);
      skyCtx.fillStyle = grad;
      skyCtx.beginPath();
      skyCtx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      skyCtx.fill();
    }

    // Ascending rockets
    for (const r of rockets) {
      skyCtx.strokeStyle = `hsla(${r.hue}, 95%, 80%, 0.9)`;
      skyCtx.lineWidth = 2.6 * scale;
      skyCtx.beginPath();
      skyCtx.moveTo(r.prevX, r.prevY);
      skyCtx.lineTo(r.x, r.y);
      skyCtx.stroke();

      const headGlow = skyCtx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 12 * scale);
      headGlow.addColorStop(0, 'rgba(255, 250, 220, 0.95)');
      headGlow.addColorStop(0.4, `hsla(${r.hue}, 100%, 70%, 0.45)`);
      headGlow.addColorStop(1, 'rgba(0,0,0,0)');
      skyCtx.fillStyle = headGlow;
      skyCtx.beginPath();
      skyCtx.arc(r.x, r.y, 12 * scale, 0, Math.PI * 2);
      skyCtx.fill();
    }

    // Firework burst sparks
    for (const p of particles) {
      const lifeRatio = 1 - p.age / p.life;
      if (lifeRatio <= 0) continue;

      let alpha = Math.pow(lifeRatio, 0.78);
      if (p.twinkle && lifeRatio < 0.65) {
        if (Math.sin(p.age * 42 + p.x) < -0.25) alpha *= 0.2;
      }

      const tail = p.history[p.history.length - 1];
      const mid = p.history[Math.floor(p.history.length * 0.45)];

      // Luminous Comet Trail
      skyCtx.strokeStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${(alpha * 0.72).toFixed(3)})`;
      skyCtx.lineWidth = p.size * (0.55 + 0.55 * lifeRatio);
      skyCtx.beginPath();
      skyCtx.moveTo(tail.x, tail.y);
      skyCtx.quadraticCurveTo(mid.x, mid.y, p.x, p.y);
      skyCtx.stroke();

      // Hot Incandescent Core
      skyCtx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${Math.min(97, p.light + 24)}%, ${alpha.toFixed(3)})`;
      skyCtx.beginPath();
      skyCtx.arc(p.x, p.y, p.size * (0.65 + 0.45 * lifeRatio), 0, Math.PI * 2);
      skyCtx.fill();

      // Crackle micro-flash near end of life
      if (p.crackle && lifeRatio < 0.28 && Math.random() < 0.18) {
        skyCtx.fillStyle = 'rgba(255, 252, 235, 0.95)';
        skyCtx.beginPath();
        skyCtx.arc(
          p.x + (Math.random() - 0.5) * 9 * scale,
          p.y + (Math.random() - 0.5) * 9 * scale,
          1.4 * scale,
          0,
          Math.PI * 2
        );
        skyCtx.fill();
      }
    }

    skyCtx.restore();
  }

  function renderFrame(timestamp) {
    const t = timestamp * 0.001;
    const dt = Math.min(0.05, elapsedTime === 0 ? 0.016 : t - elapsedTime);
    elapsedTime = t;

    const scale = width / 1080;

    updateDirector(dt);
    updatePhysics(dt);
    renderSkyToBuffer(t);

    // 1. Draw the sky buffer onto the main canvas
    ctx.drawImage(skyBuffer, 0, 0, width, horizonY, 0, 0, width, horizonY);

    // 2. Draw the static city skyline buffer
    ctx.drawImage(cityBuffer, 0, 0);

    // 3. Animated tower aviation beacons
    for (const b of buildings) {
      if (!b.beacon) continue;
      const by = horizonY - b.h;
      let bx = b.x + b.w * 0.5;
      let topY = by;
      if (b.roofType === 'spire') topY = by - 46 * scale;
      else if (b.roofType === 'supertall') topY = by - 102 * scale;
      else if (b.roofType === 'crown') topY = by - 18 * scale;

      const pulse = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * 3.2 + b.beaconPhase), 2);
      const rGlow = ctx.createRadialGradient(bx, topY, 0, bx, topY, 9 * scale);
      rGlow.addColorStop(0, `rgba(255, 70, 70, ${pulse.toFixed(3)})`);
      rGlow.addColorStop(1, 'rgba(255, 30, 30, 0)');
      ctx.fillStyle = rGlow;
      ctx.beginPath();
      ctx.arc(bx, topY, 9 * scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4. Render the River Reflection below horizonY
    const riverH = height - horizonY;

    // Deep water base gradient
    const waterGrad = ctx.createLinearGradient(0, horizonY, 0, height);
    waterGrad.addColorStop(0, '#050a18');
    waterGrad.addColorStop(0.45, '#030712');
    waterGrad.addColorStop(1, '#010308');
    ctx.fillStyle = waterGrad;
    ctx.fillRect(0, horizonY, width, riverH);

    // Slice-by-slice horizontal water ripple reflection of the sky/fireworks + city
    const verticalCompression = 0.88;
    let wy = horizonY;
    while (wy < height) {
      const dist = wy - horizonY;
      const normDist = dist / riverH; // 0 at shoreline -> 1 at bottom of window
      const sliceH = dist < 55 * scale ? 1 : (dist < 160 * scale ? 2 : 3);

      // Perspective-scaled wave displacement
      const wave1 = Math.sin(dist * 0.24 - t * 4.2) * (1.2 + normDist * 13.5) * scale;
      const wave2 = Math.cos(dist * 0.11 + t * 2.7) * (0.8 + normDist * 8.0) * scale;
      const dx = wave1 + wave2;

      // Vertical chop jitter in source sampling
      const chop = Math.sin(dist * 0.42 - t * 5.8) * (1.5 + normDist * 7.5) * scale;
      const srcY = Math.max(0, Math.min(horizonY - sliceH - 1, Math.round(horizonY - dist / verticalCompression + chop)));

      // Reflected sky & fireworks slice
      ctx.globalAlpha = Math.max(0.12, (1 - normDist * 0.62) * 0.78);
      ctx.drawImage(
        skyBuffer,
        0, srcY, width, sliceH,
        dx, wy, width, sliceH
      );

      // Reflected city silhouette & window lights slice
      const citySrcY = Math.min(cityReflectBuffer.height - sliceH, Math.max(0, Math.floor(dist / verticalCompression)));
      ctx.globalAlpha = Math.max(0.08, (1 - normDist * 0.72) * 0.68);
      ctx.drawImage(
        cityReflectBuffer,
        0, citySrcY, width, sliceH,
        dx * 0.55, wy, width, sliceH
      );

      wy += sliceH;
    }
    ctx.globalAlpha = 1;

    // 5. Shimmering specular water streaks from active bursts & shockwaves
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    for (const sw of shockwaves) {
      const reflCenterY = horizonY + (horizonY - sw.y) * verticalCompression;
      const streakW = sw.radius * 0.95;
      const streakH = Math.min(riverH * 0.75, sw.radius * 1.35);
      const g = ctx.createRadialGradient(sw.x, reflCenterY, 0, sw.x, reflCenterY, streakH);
      g.addColorStop(0, `hsla(${sw.hue}, ${sw.sat}%, 80%, ${(sw.alpha * 0.35).toFixed(3)})`);
      g.addColorStop(0.5, `hsla(${sw.hue}, ${sw.sat}%, 60%, ${(sw.alpha * 0.14).toFixed(3)})`);
      g.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(sw.x, reflCenterY, streakW, streakH * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Crisp horizontal glints on water wave crests directly beneath bright particles
    for (let i = 0; i < particles.length; i += 2) {
      const p = particles[i];
      const lifeRatio = 1 - p.age / p.life;
      if (lifeRatio <= 0.15) continue;

      const reflY = horizonY + (horizonY - p.y) * verticalCompression;
      if (reflY <= horizonY || reflY >= height) continue;

      const normDist = (reflY - horizonY) / riverH;
      const waveShift = Math.sin((reflY - horizonY) * 0.28 - t * 4.5 + i) * (2.5 + normDist * 16) * scale;
      const streakWidth = (4 + normDist * 22) * (0.5 + 0.5 * lifeRatio) * scale;
      const alpha = lifeRatio * (1 - normDist * 0.65) * 0.42;

      ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${Math.min(92, p.light + 15)}%, ${alpha.toFixed(3)})`;
      ctx.fillRect(p.x + waveShift - streakWidth * 0.5, reflY, streakWidth, (1.1 + normDist * 1.4) * scale);
    }

    ctx.restore();

    // 6. Subtle dark water trough lines for texture & depth
    ctx.fillStyle = 'rgba(2, 4, 12, 0.32)';
    for (let y = horizonY + 3 * scale; y < height; y += (3.5 + ((y - horizonY) / riverH) * 6.5) * scale) {
      const norm = (y - horizonY) / riverH;
      const shift = Math.sin(y * 0.15 + t * 1.8) * 18 * scale;
      ctx.fillRect(shift - 20 * scale, y, width + 40 * scale, (0.9 + norm * 1.6) * scale);
    }

    // 7. Drifting river vessels and their warm water reflections
    for (const boat of boats) {
      const bx = boat.x;
      const by = boat.y;
      const len = boat.len;

      // Boat hull silhouette
      ctx.fillStyle = '#040812';
      ctx.beginPath();
      ctx.moveTo(bx - len * 0.5, by);
      ctx.lineTo(bx + len * 0.5, by);
      ctx.lineTo(bx + len * 0.38, by + 3.8 * scale);
      ctx.lineTo(bx - len * 0.42, by + 3.8 * scale);
      ctx.closePath();
      ctx.fill();

      // Cabin lights & reflection
      const lightCount = 4;
      for (let l = 0; l < lightCount; l++) {
        const lx = bx - len * 0.26 + (l / (lightCount - 1)) * len * 0.52;
        ctx.fillStyle = boat.color;
        ctx.fillRect(lx, by - 1.6 * scale, 2.2 * scale, 1.5 * scale);

        // Shimmering reflection beneath boat light
        ctx.fillStyle = boat.color;
        ctx.globalAlpha = 0.28;
        for (let r = 1; r <= 4; r++) {
          const rw = (3.5 + r * 1.5) * scale;
          const rx = lx + Math.sin(t * 5 + r + l) * 2 * scale;
          ctx.fillRect(rx - rw * 0.4, by + (3.8 + r * 2.2) * scale, rw, 1.1 * scale);
        }
        ctx.globalAlpha = 1;
      }
    }

    // 8. Shoreline shadow vignette to anchor foreground and water interface
    const shoreShadow = ctx.createLinearGradient(0, horizonY - 2 * scale, 0, horizonY + 14 * scale);
    shoreShadow.addColorStop(0, 'rgba(2, 4, 10, 0.75)');
    shoreShadow.addColorStop(0.3, 'rgba(2, 5, 14, 0.45)');
    shoreShadow.addColorStop(1, 'rgba(2, 5, 14, 0)');
    ctx.fillStyle = shoreShadow;
    ctx.fillRect(0, horizonY - 2 * scale, width, 16 * scale);

    requestAnimationFrame(renderFrame);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(320, Math.floor(window.innerWidth * dpr));
    height = Math.max(320, Math.floor(window.innerHeight * dpr));

    canvas.width = width;
    canvas.height = height;

    skyBuffer.width = width;
    skyBuffer.height = height;

    generateSceneGeometry();

    // Fill initial night sky in buffer
    const initSky = skyCtx.createLinearGradient(0, 0, 0, horizonY);
    initSky.addColorStop(0, '#03050f');
    initSky.addColorStop(0.6, '#060b1c');
    initSky.addColorStop(1, '#0f1630');
    skyCtx.fillStyle = initSky;
    skyCtx.fillRect(0, 0, width, horizonY);
  }

  function startOpeningSalvo() {
    const scale = width / 1080;

    // Immediate opening bursts already unfolding as soon as page loads
    const openingShots = [
      { x: width * 0.30, y: horizonY * 0.26, palette: PALETTES[2], shape: 'double_ring', burstScale: 1.08 },
      { x: width * 0.70, y: horizonY * 0.28, palette: PALETTES[1], shape: 'heart', burstScale: 1.05 },
      { x: width * 0.50, y: horizonY * 0.19, palette: PALETTES[0], shape: 'willow', burstScale: 1.25 }
    ];

    for (const shot of openingShots) {
      explodeRocket({
        x: shot.x,
        y: shot.y,
        palette: shot.palette,
        shape: shot.shape,
        scale: shot.burstScale
      });
    }

    // Plus ascending rockets right at launch
    launchRocket({
      x: width * 0.20,
      targetX: width * 0.24,
      targetY: horizonY * 0.32,
      palette: PALETTES[4],
      shape: 'star',
      burstScale: 1.05
    });
    launchRocket({
      x: width * 0.80,
      targetX: width * 0.76,
      targetY: horizonY * 0.25,
      palette: PALETTES[3],
      shape: 'saturn',
      burstScale: 1.08
    });
    launchRocket({
      x: width * 0.48,
      targetX: width * 0.52,
      targetY: horizonY * 0.22,
      palette: PALETTES[6],
      shape: 'spiral',
      burstScale: 1.12
    });
  }

  window.addEventListener('resize', resize);
  resize();
  startOpeningSalvo();
  requestAnimationFrame(renderFrame);
})();
</script>
</body>
</html>
