<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fireworks over the river</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030617; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated fireworks over a city skyline reflected in a river"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, horizon, last = 0, launchTimer = 0, time = 0;
  let buildings = [], stars = [], rockets = [], particles = [], flashes = [];
  const colors = ['#ff3b83', '#ffbd32', '#42e9ff', '#b765ff', '#ff633d', '#72ffaf', '#fff1a1'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  function resize() {
    w = innerWidth; h = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    horizon = h * .725;
    makeCity();
    stars = Array.from({length: Math.max(55, Math.floor(w * h / 9500))}, () => ({
      x: Math.random() * w, y: Math.random() * horizon * .88,
      r: rand(.35, 1.35), phase: rand(0, 7), alpha: rand(.2, .75)
    }));
  }

  function makeCity() {
    buildings = [];
    let x = -10;
    while (x < w + 20) {
      const bw = rand(w * .035, w * .075);
      const bh = rand(h * .065, h * .19) * (x > w * .35 && x < w * .75 ? 1.12 : 1);
      const windows = [];
      for (let wx = 6; wx < bw - 4; wx += Math.max(7, w * .009)) {
        for (let wy = 9; wy < bh - 5; wy += Math.max(9, h * .012)) {
          if (Math.random() < .38) windows.push([wx, wy, Math.random()]);
        }
      }
      buildings.push({x, bw, bh, windows, top: Math.random(), shade: pick(['#080d25', '#0a1029', '#0c112b', '#070d20'])});
      x += bw - 1;
    }
  }

  function launch(initial = false) {
    const x = rand(w * .1, w * .9), targetY = rand(h * .12, h * .48);
    const startY = horizon + rand(0, h * .025);
    const duration = rand(0.85, 1.35);
    rockets.push({x, startY, targetY, age: initial ? rand(.3, .85) * duration : 0, duration,
      drift: rand(-w * .035, w * .035), color: pick(colors), size: rand(.8, 1.2), shape: Math.floor(rand(0, 5))});
  }

  function burst(r) {
    const x = r.x + r.drift, y = r.targetY;
    const radius = Math.min(w, h) * rand(.075, .135) * r.size;
    const count = Math.floor(rand(65, 95));
    const second = pick(colors.filter(c => c !== r.color));
    flashes.push({x, y, color: r.color, age: 0, life: .6, radius});
    for (let i = 0; i < count; i++) {
      const a = Math.PI * 2 * i / count + rand(-.035, .035);
      let vx, vy, speed = radius * rand(.85, 1.15);
      if (r.shape === 1) { // heart
        const hx = 16 * Math.pow(Math.sin(a), 3) / 17;
        const hy = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) / 17;
        vx = hx * speed; vy = hy * speed;
      } else if (r.shape === 2) { // five-point star
        const edge = .48 + .52 * Math.pow(Math.abs(Math.cos(2.5 * a)), 5);
        vx = Math.cos(a) * speed * edge; vy = Math.sin(a) * speed * edge;
      } else if (r.shape === 3) { // concentric rings
        const ring = i % 3 === 0 ? .52 : 1;
        vx = Math.cos(a) * speed * ring; vy = Math.sin(a) * speed * ring;
      } else if (r.shape === 4) { // willow
        vx = Math.cos(a) * speed * .85; vy = Math.sin(a) * speed * .85 - radius * .15;
      } else {
        vx = Math.cos(a) * speed; vy = Math.sin(a) * speed;
      }
      particles.push({x, y, px: x, py: y, vx, vy, color: i % 5 === 0 ? second : r.color,
        age: 0, life: rand(1.4, 2.35), size: rand(1.1, 2.7), drag: r.shape === 4 ? .38 : .65,
        gravity: h * (r.shape === 4 ? .105 : .065), sparkle: Math.random() < .3});
    }
    // A bright core gives each explosion a brief, luminous center.
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), s = rand(8, radius * .35);
      particles.push({x, y, px: x, py: y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, color: '#fff3d0',
        age: 0, life: rand(.35, .8), size: rand(1, 2.2), drag: 1, gravity: h * .035, sparkle: false});
    }
  }

  function update(dt) {
    time += dt; launchTimer -= dt;
    if (launchTimer <= 0) {
      launch();
      if (Math.random() < .32) launch();
      launchTimer = rand(.48, .95);
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.age += dt;
      if (r.age >= r.duration) { burst(r); rockets.splice(i, 1); }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.age += dt;
      if (p.age >= p.life) { particles.splice(i, 1); continue; }
      p.px = p.x; p.py = p.y;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const drag = Math.exp(-p.drag * dt); p.vx *= drag; p.vy = p.vy * drag + p.gravity * dt;
    }
    flashes = flashes.filter(f => (f.age += dt) < f.life);
  }

  function background() {
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#030516'); sky.addColorStop(.55, '#101139'); sky.addColorStop(1, '#38244a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, horizon);
    const glow = ctx.createRadialGradient(w*.5, horizon, 0, w*.5, horizon, w*.7);
    glow.addColorStop(0, 'rgba(255,100,100,.17)'); glow.addColorStop(.45, 'rgba(117,66,160,.08)'); glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, horizon);
    for (const s of stars) {
      ctx.globalAlpha = s.alpha * (.7 + .3 * Math.sin(time * 1.6 + s.phase));
      ctx.fillStyle = '#d3e4ff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function fireworks() {
    ctx.save(); ctx.globalCompositeOperation = 'screen';
    for (const f of flashes) {
      const a = (1 - f.age / f.life) * .23;
      const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.radius * 1.45);
      g.addColorStop(0, f.color); g.addColorStop(1, 'transparent');
      ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(f.x-f.radius*1.5, f.y-f.radius*1.5, f.radius*3, f.radius*3);
    }
    for (const r of rockets) {
      const t = Math.min(r.age / r.duration, 1), eased = 1 - Math.pow(1-t, 1.5);
      const x = r.x + r.drift * eased, y = r.startY + (r.targetY-r.startY)*eased;
      const tail = Math.min(h*.045, (r.startY-y)*.35);
      const g = ctx.createLinearGradient(x, y, x-r.drift*.03, y+tail);
      g.addColorStop(0, '#fff7dd'); g.addColorStop(.25, r.color); g.addColorStop(1, 'transparent');
      ctx.globalAlpha = .9; ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-r.drift*.03, y+tail); ctx.stroke();
      ctx.shadowBlur = 14; ctx.shadowColor = r.color; ctx.fillStyle = '#fff9e8'; ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
    ctx.lineCap = 'round';
    for (const p of particles) {
      const fade = Math.pow(1 - p.age/p.life, .8) * (p.sparkle ? .65 + .35*Math.sin(p.age*28) : 1);
      ctx.globalAlpha = Math.max(0, fade); ctx.strokeStyle = p.color; ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.px - p.vx*.025, p.py - p.vy*.025); ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size*.55, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  function city() {
    // Distant silhouette and haze behind the nearer buildings.
    ctx.fillStyle = '#17152f';
    for (let x = 0; x < w; x += w*.035) {
      const bh = h*(.035 + .035*(.5+.5*Math.sin(x*.08)));
      ctx.fillRect(x, horizon-bh, w*.03, bh);
    }
    for (const b of buildings) {
      const y = horizon - b.bh;
      ctx.fillStyle = b.shade; ctx.fillRect(b.x, y, b.bw, b.bh);
      if (b.top < .25) { ctx.fillRect(b.x+b.bw*.2, y-5, b.bw*.6, 6); }
      if (b.top > .9) { ctx.fillRect(b.x+b.bw*.48, y-14, 2, 14); }
      for (const [wx, wy, v] of b.windows) {
        ctx.fillStyle = v < .2 ? 'rgba(96,191,255,.55)' : v < .6 ? 'rgba(255,194,111,.65)' : 'rgba(255,231,167,.4)';
        ctx.fillRect(b.x+wx, y+wy, Math.max(2, w*.0025), Math.max(3, h*.004));
      }
    }
    ctx.fillStyle = '#060a1b'; ctx.fillRect(0, horizon-3, w, 6);
    ctx.fillStyle = 'rgba(255,193,153,.6)';
    for (let x = 0; x < w; x += Math.max(14, w*.025)) ctx.fillRect(x, horizon-2, 3, 1.5);
  }

  function water() {
    const water = ctx.createLinearGradient(0, horizon, 0, h);
    water.addColorStop(0, '#15132d'); water.addColorStop(.35, '#0a102a'); water.addColorStop(1, '#030817');
    ctx.fillStyle = water; ctx.fillRect(0, horizon, w, h-horizon);
    ctx.save(); ctx.beginPath(); ctx.rect(0, horizon, w, h-horizon); ctx.clip(); ctx.globalCompositeOperation = 'screen';
    // Broken horizontal glints evoke reflections without a literal mirror image.
    for (const p of particles) {
      const depth = (horizon - p.y) / horizon;
      const ry = horizon + depth * (h-horizon) * .9;
      if (ry < horizon || ry > h) continue;
      const alpha = Math.pow(1-p.age/p.life, 1.4) * .28;
      const shift = Math.sin(time*2.2 + ry*.16 + p.x*.03) * (3 + depth*9);
      ctx.globalAlpha = alpha; ctx.fillStyle = p.color;
      ctx.fillRect(p.x + shift - (2+depth*7), ry, 4+depth*14, Math.max(1, h*.0018));
    }
    for (const b of buildings) {
      for (const [wx, wy, v] of b.windows) {
        if (v > .35 || wy > b.bh*.55) continue;
        const yy = horizon + (b.bh-wy)*.35;
        ctx.globalAlpha = .15; ctx.fillStyle = '#ffbe7b';
        ctx.fillRect(b.x+wx + Math.sin(time+yy*.2)*2, yy, 3, 1);
      }
    }
    ctx.globalAlpha = 1; ctx.restore();
    ctx.strokeStyle = 'rgba(159,166,223,.09)'; ctx.lineWidth = 1;
    for (let i = 0; i < 28; i++) {
      const y = horizon + (i/28)*(h-horizon), len = w*(.025 + (i%5)*.015);
      const x = ((i*137.3 + Math.sin(time*.4+i)*12) % (w+len))-len;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke();
    }
  }

  function frame(now) {
    const dt = last ? Math.min((now-last)/1000, .04) : 0; last = now;
    update(dt); background(); fireworks(); city(); water();
    requestAnimationFrame(frame);
  }
  resize();
  for (let i = 0; i < 3; i++) launch(true);
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
