<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #050014;
    overflow: hidden;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const view = document.getElementById("c");
  const ctx = view.getContext("2d", { alpha: false });
  const scene = document.createElement("canvas");
  const sctx = scene.getContext("2d", { alpha: false });
  const city = document.createElement("canvas");
  const cctx = city.getContext("2d");

  const PAL = [
    [255, 20, 70],
    [255, 60, 0],
    [255, 170, 0],
    [255, 230, 20],
    [190, 255, 0],
    [0, 255, 120],
    [0, 240, 255],
    [40, 130, 255],
    [150, 60, 255],
    [255, 40, 190],
    [255, 80, 40],
    [120, 255, 60],
    [255, 50, 120],
    [0, 190, 255],
    [255, 210, 60]
  ];

  const SHAPES = [
    "peony", "peony", "chrys", "chrys", "ring", "dblring", "saturn",
    "willow", "willow", "star", "heart", "palm", "spiral", "crackle",
    "cross", "rainbow"
  ];

  let W = 0;
  let H = 0;
  let dpr = 1;
  let u = 1;
  let horizon = 0;
  let stars = [];
  let flickers = [];
  let beacons = [];
  let boards = [];
  const rockets = [];
  const particles = [];
  const flashes = [];
  let showTime = 0;
  let launchIn = 0.35;
  let finaleAt = 7.5;
  let finaleN = 0;
  let last = 0;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const rgba = (c, a) => "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";

  function hash(a, b, c) {
    const n = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453;
    return n - Math.floor(n);
  }

  function sampleMotion(x, y, vx, vy, grav, drag, t) {
    if (t <= 0) return { x, y, vx, vy };
    if (drag < 1e-4) {
      return {
        x: x + vx * t,
        y: y + vy * t + 0.5 * grav * t * t,
        vx,
        vy: vy + grav * t
      };
    }
    const e = Math.exp(-drag * t);
    const gv = grav / drag;
    return {
      x: x + (vx * (1 - e)) / drag,
      y: y + ((vy - gv) * (1 - e)) / drag + gv * t,
      vx: vx * e,
      vy: (vy - gv) * e + gv
    };
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    u = Math.min(W, H) / 1080;
    horizon = H * 0.6;
    const bw = Math.round(W * dpr);
    const bh = Math.round(H * dpr);
    view.width = bw;
    view.height = bh;
    scene.width = bw;
    scene.height = bh;
    city.width = bw;
    city.height = bh;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
    buildCity();
  }

  function buildStars() {
    const area = (W * H) / (1080 * 1080);
    const n = clamp(Math.round(130 * area), 50, 180);
    stars = [];
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * horizon * 0.9,
        r: Math.random() < 0.07 ? rand(1.5, 2.3) * u : rand(0.4, 1.15) * u,
        p: Math.random() * Math.PI * 2,
        s: rand(0.6, 2.4),
        a: rand(0.35, 1),
        spike: Math.random() < 0.08
      });
    }
  }

  function pushWindows(g, rect, b, far) {
    const winW = Math.max(1.5, 2.15 * u);
    const winH = Math.max(2, 3.1 * u);
    const gapX = Math.max(1.6, 2.7 * u);
    const gapY = Math.max(2, 3.6 * u);
    const x0 = rect.x + Math.max(2, 3 * u);
    const x1 = rect.x + rect.w - Math.max(2, 3 * u) - winW;
    const y0 = rect.y + Math.max(3, 4 * u);
    const y1 = rect.y + rect.h - Math.max(3, 4 * u) - winH;
    let col = 0;
    for (let x = x0; x <= x1; x += winW + gapX, col++) {
      let row = 0;
      for (let y = y0; y <= y1; y += winH + gapY, row++) {
        const n = hash(b.seed, col, row);
        if (n > b.lit) continue;
        if (covered(x, y, winW, winH)) continue;
        const tint = hash(b.seed + 4, col, row);
        let color;
        if (far) {
          color = tint < 0.12 ? "#6e8cff" : tint < 0.3 ? "#c4a06a" : "#8d734c";
        } else if (tint < 0.06) {
          color = "#7af6ff";
        } else if (tint < 0.11) {
          color = "#ff4d9a";
        } else if (tint < 0.18) {
          color = "#ffe38a";
        } else if (tint < 0.72) {
          color = "#ffc14a";
        } else {
          color = "#fff1c4";
        }
        const flicker = !far && hash(b.seed + 9, col, row) > 0.975 && flickers.length < 48;
        if (flicker) {
          flickers.push({
            x, y, w: winW, h: winH, color,
            phase: hash(b.seed, row, col) * 6.28
          });
        } else {
          g.fillStyle = color;
          g.fillRect(x, y, winW, winH);
        }
      }
    }
  }

  function covered(x, y, w, h) {
    for (let i = 0; i < boards.length; i++) {
      const b = boards[i];
      if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return true;
    }
    return false;
  }

  function paintBlock(g, rect, fill) {
    g.fillStyle = fill;
    g.fillRect(rect.x, rect.y, rect.w, rect.h);
    g.fillStyle = "rgba(255, 186, 130, 0.22)";
    g.fillRect(rect.x, rect.y, rect.w, Math.max(1, 1.4 * u));
    g.fillStyle = "rgba(170, 200, 255, 0.05)";
    g.fillRect(rect.x, rect.y, Math.max(1, u), rect.h);
  }

  function addBuilding(g, x, bw, bh, far) {
    const bodyTop = horizon - bh;
    const fill = far
      ? "rgb(" + (10 + ((x * 0.02) | 0) % 8) + "," + (14 + ((x * 0.01) | 0) % 6) + ",32)"
      : "rgb(" + (6 + ((bw) | 0) % 6) + "," + (8 + ((x) | 0) % 5) + ",18)";
    const b = {
      seed: rand(1, 900),
      lit: far ? rand(0.28, 0.5) : rand(0.62, 0.9)
    };
    const style = far ? (Math.random() < 0.3 ? 1 : 0) : (Math.random() * 5) | 0;
    const blocks = [];

    if (!far && style === 1) {
      const podiumH = bh * rand(0.28, 0.42);
      blocks.push({ x, y: horizon - podiumH, w: bw, h: podiumH });
      const tw = bw * rand(0.5, 0.68);
      const tx = x + (bw - tw) * 0.5;
      blocks.push({ x: tx, y: bodyTop, w: tw, h: bh - podiumH + 1 });
    } else {
      blocks.push({ x, y: bodyTop, w: bw, h: bh });
    }

    for (const rect of blocks) paintBlock(g, rect, fill);

    if (!far && style === 2) {
      const apex = bodyTop - rand(28, 58) * u;
      g.fillStyle = fill;
      g.beginPath();
      g.moveTo(x + bw * 0.32, bodyTop + 1);
      g.lineTo(x + bw * 0.5, apex);
      g.lineTo(x + bw * 0.68, bodyTop + 1);
      g.closePath();
      g.fill();
      beacons.push({ x: x + bw * 0.5, y: apex, phase: Math.random() * 6 });
    }

    if (!far && (style === 3 || Math.random() < 0.22)) {
      const ax = x + bw * (0.35 + Math.random() * 0.3);
      const ay = bodyTop - rand(16, 42) * u;
      g.strokeStyle = "rgba(210, 220, 240, 0.55)";
      g.lineWidth = Math.max(1, u);
      g.beginPath();
      g.moveTo(ax, bodyTop);
      g.lineTo(ax, ay);
      g.stroke();
      beacons.push({ x: ax, y: ay, phase: Math.random() * 6 });
    }

    if (!far && style === 4 && bw > 28 * u) {
      const nx = Math.random() < 0.5 ? x + 1.5 * u : x + bw - Math.max(2.5, 3 * u);
      g.fillStyle = Math.random() < 0.5 ? "#00f2ff" : "#ff2bd6";
      g.shadowColor = g.fillStyle;
      g.shadowBlur = 12 * u;
      g.fillRect(nx, bodyTop + 8 * u, Math.max(2, 2.2 * u), bh * 0.55);
      g.shadowBlur = 0;
    }

    if (!far && Math.random() < 0.16 && bw > 34 * u && bh > 90 * u) {
      const pad = bw * 0.14;
      const board = {
        x: x + pad,
        y: bodyTop + bh * rand(0.14, 0.28),
        w: bw - pad * 2,
        h: Math.min(bh * 0.14, 26 * u),
        color: pick(["#ff2d78", "#00e8ff", "#ffe14a", "#7dff3a", "#c44dff", "#ff6a00"])
      };
      g.fillStyle = board.color;
      g.shadowColor = board.color;
      g.shadowBlur = 14 * u;
      g.fillRect(board.x, board.y, board.w, board.h);
      g.shadowBlur = 0;
      g.fillStyle = "rgba(255,255,255,0.38)";
      g.fillRect(board.x, board.y + board.h * 0.72, board.w, Math.max(1, 1.3 * u));
      boards.push(board);
    }

    for (const rect of blocks) pushWindows(g, rect, b, far);

    if (!far && Math.random() < 0.35 && bh > 70 * u) {
      beacons.push({
        x: x + bw * 0.5,
        y: blocks[blocks.length - 1].y,
        phase: Math.random() * 6
      });
    }
  }

  function buildCity() {
    flickers = [];
    beacons = [];
    boards = [];
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cctx.clearRect(0, 0, W, H);
    cctx.shadowBlur = 0;

    const lay = (far) => {
      let x = far ? -12 * u : -6 * u;
      while (x < W + 12 * u) {
        const landmark = !far && Math.random() < 0.14;
        const bw = Math.max(8, (landmark ? rand(50, 84) : rand(16, 42)) * u);
        const nx = clamp((x + bw * 0.5) / Math.max(1, W), 0, 1);
        const downtown = Math.exp(-((nx - 0.5) * (nx - 0.5)) / 0.05);
        const side = Math.exp(-((nx - 0.22) * (nx - 0.22)) / 0.012) * 0.55
          + Math.exp(-((nx - 0.78) * (nx - 0.78)) / 0.012) * 0.55;
        let bh = (rand(48, 110) + downtown * rand(70, 160) + side * rand(16, 70)) * u;
        if (far) bh = (rand(26, 72) + downtown * rand(24, 70)) * u;
        const maxH = Math.max(48 * u, horizon - H * (far ? 0.34 : 0.22));
        bh = clamp(bh, 32 * u, maxH);
        addBuilding(cctx, x, bw, bh, far);
        const gap = far ? rand(0, 3) * u : (Math.random() < 0.55 ? rand(0, 2) * u : rand(3, 9) * u);
        x += bw + gap;
      }
    };

    lay(true);
    lay(false);

    cctx.fillStyle = "rgba(255, 176, 96, 0.45)";
    cctx.fillRect(0, horizon - Math.max(1.5, 2 * u), W, Math.max(1.5, 2 * u));
  }

  function makeParticle(x, y, vx, vy, color, opt) {
    const life = opt.life;
    const p = {
      x, y, vx, vy,
      cr: color[0], cg: color[1], cb: color[2],
      life, max: life,
      size: opt.size,
      drag: opt.drag,
      grav: opt.grav,
      trail: opt.trail ? [] : null,
      kind: opt.kind || "spark",
      splitAt: opt.splitAt || 0,
      did: false
    };
    if (opt.age > 0) {
      const aged = sampleMotion(x, y, vx, vy, p.grav, p.drag, opt.age);
      if (p.trail) {
        for (let i = 1; i <= 6; i++) {
          const t = opt.age * (i / 6);
          const s = sampleMotion(x, y, vx, vy, p.grav, p.drag, t);
          p.trail.unshift({ x: s.x, y: s.y });
        }
      }
      p.x = aged.x;
      p.y = aged.y;
      p.vx = aged.vx;
      p.vy = aged.vy;
      p.life -= opt.age;
    }
    if (p.life > 0) particles.push(p);
  }

  function emit(shape, x, y, color, scale, color2, age) {
    scale = scale || 1;
    age = age || 0;
    const c2 = color2 || pick(PAL);
    flashes.push({
      x, y,
      color,
      life: 0.38,
      max: 0.38,
      r0: 6 * u * scale,
      r1: (70 + 40 * scale) * u
    });

    const add = (ang, speed, col, opt) => {
      makeParticle(
        x, y,
        Math.cos(ang) * speed,
        Math.sin(ang) * speed,
        col,
        opt
      );
    };

    const spark = (extra) => ({
      life: extra.life,
      size: extra.size,
      drag: extra.drag,
      grav: extra.grav,
      trail: extra.trail || false,
      kind: extra.kind || "spark",
      splitAt: extra.splitAt || 0,
      age
    });

    if (shape === "peony" || shape === "chrys") {
      const count = shape === "chrys" ? 150 : 96;
      const fast = shape === "chrys";
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + rand(-0.02, 0.02);
        const speed = (fast ? rand(120, 250) : rand(80, 190)) * u * scale;
        const col = i % 7 === 0 ? c2 : color;
        add(ang, speed, col, spark({
          life: rand(fast ? 1.15 : 0.9, fast ? 1.7 : 1.35),
          size: (fast ? rand(1.15, 1.9) : rand(1.7, 2.7)) * u,
          drag: fast ? 0.42 : 0.72,
          grav: (fast ? 28 : 46) * u,
          trail: fast && i % 2 === 0
        }));
      }
      return;
    }

    if (shape === "ring" || shape === "dblring" || shape === "rainbow") {
      const rings = shape === "dblring"
        ? [{ sp: 120, col: color }, { sp: 190, col: c2 }]
        : [{ sp: 160, col: color }];
      for (const ring of rings) {
        const count = shape === "rainbow" ? 108 : 80;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2;
          const col = shape === "rainbow" ? PAL[i % PAL.length] : ring.col;
          add(ang, ring.sp * u * scale * rand(0.97, 1.03), col, spark({
            life: rand(1.15, 1.55),
            size: (shape === "rainbow" ? 2.15 : 1.9) * u,
            drag: 0.22,
            grav: 10 * u
          }));
        }
      }
      return;
    }

    if (shape === "saturn") {
      for (let i = 0; i < 36; i++) {
        const ang = (i / 36) * Math.PI * 2;
        add(ang, rand(20, 70) * u * scale, color, spark({
          life: rand(0.8, 1.15),
          size: 2 * u,
          drag: 0.8,
          grav: 20 * u
        }));
      }
      const tilt = rand(-0.5, 0.5);
      for (let i = 0; i < 90; i++) {
        const ang = (i / 90) * Math.PI * 2;
        const sp = 175 * u * scale;
        const vx = Math.cos(ang) * sp * 1.35;
        const vy = Math.sin(ang) * sp * 0.42;
        const ca = Math.cos(tilt);
        const sa = Math.sin(tilt);
        makeParticle(x, y, vx * ca - vy * sa, vx * sa + vy * ca, c2, spark({
          life: rand(1.2, 1.6),
          size: 1.8 * u,
          drag: 0.18,
          grav: 8 * u
        }));
      }
      return;
    }

    if (shape === "willow") {
      const count = 70;
      for (let i = 0; i < count; i++) {
        const ang = (i / count) * Math.PI * 2 + rand(-0.04, 0.04);
        add(ang, rand(70, 210) * u * scale, color, spark({
          life: rand(1.7, 2.35),
          size: rand(1.3, 2) * u,
          drag: 0.22,
          grav: 92 * u,
          trail: true
        }));
      }
      return;
    }

    if (shape === "star" || shape === "cross") {
      const points = shape === "cross" ? 4 : 5 + ((Math.random() * 3) | 0);
      const rot = shape === "cross" ? Math.PI / 4 * (Math.random() < 0.5 ? 1 : 0) : Math.random() * Math.PI;
      for (let i = 0; i < points; i++) {
        const ang = rot + (i * Math.PI * 2) / points;
        const steps = 15;
        for (let k = 0; k < steps; k++) {
          add(ang + rand(-0.025, 0.025), (28 + k * 14) * u * scale, k % 5 === 0 ? c2 : color, spark({
            life: rand(1.05, 1.4),
            size: (k > steps - 3 ? 2.8 : 1.55) * u,
            drag: 0.26,
            grav: 14 * u
          }));
        }
      }
      return;
    }

    if (shape === "heart") {
      const count = 90;
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        const hx = 16 * Math.sin(t) ** 3;
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
        const sp = (9.2 * u * scale);
        makeParticle(x, y, hx * sp, hy * sp, i % 4 === 0 ? [255, 255, 255] : color, spark({
          life: rand(1.2, 1.55),
          size: 2 * u,
          drag: 0.4,
          grav: 16 * u
        }));
      }
      return;
    }

    if (shape === "palm") {
      const fronds = 7;
      for (let f = 0; f < fronds; f++) {
        const base = -Math.PI / 2 + (f - (fronds - 1) / 2) * 0.32;
        for (let k = 0; k < 16; k++) {
          add(base + rand(-0.04, 0.04), (36 + k * 13) * u * scale, k % 6 === 0 ? c2 : color, spark({
            life: 1.35 + k * 0.025,
            size: 1.7 * u,
            drag: 0.38,
            grav: 78 * u,
            trail: true
          }));
        }
      }
      return;
    }

    if (shape === "spiral") {
      for (let arm = 0; arm < 2; arm++) {
        for (let i = 0; i < 70; i++) {
          const ang = arm * Math.PI + i * 0.42;
          add(ang, (24 + i * 2.6) * u * scale, arm === 0 ? color : c2, spark({
            life: rand(1.15, 1.5),
            size: 1.8 * u,
            drag: 0.48,
            grav: 22 * u
          }));
        }
      }
      return;
    }

    if (shape === "crackle") {
      for (let i = 0; i < 64; i++) {
        const ang = (i / 64) * Math.PI * 2 + rand(-0.05, 0.05);
        add(ang, rand(90, 180) * u * scale, color, spark({
          life: rand(1.05, 1.35),
          size: 2 * u,
          drag: 0.65,
          grav: 40 * u,
          kind: "crackle",
          splitAt: rand(0.42, 0.62)
        }));
      }
    }
  }

  function queueRocket(delay, opt) {
    opt = opt || {};
    if (rockets.length > 14 || particles.length > 1700) return;
    const shape = opt.shape || pick(SHAPES);
    const x = clamp(opt.x == null ? rand(W * 0.06, W * 0.94) : opt.x, 12 * u, W - 12 * u);
    let targetY;
    if (shape === "willow" || shape === "palm") targetY = rand(H * 0.16, H * 0.36);
    else if (shape === "heart" || shape === "ring" || shape === "rainbow" || shape === "saturn") targetY = rand(H * 0.07, H * 0.24);
    else targetY = rand(H * 0.06, H * 0.32);
    const y = horizon - 2 * u;
    const g = 360 * u;
    const fall = Math.max(50 * u, y - targetY);
    const t = Math.sqrt((2 * fall) / g);
    const color = pick(PAL);
    let color2 = pick(PAL);
    if (color2 === color) color2 = pick(PAL);
    rockets.push({
      x,
      y,
      vx: rand(-28, 28) * u,
      vy: -g * t,
      targetY,
      color,
      color2,
      shape,
      scale: rand(0.82, 1.22),
      wait: delay || 0,
      trail: [],
      g,
      lit: false
    });
  }

  function muzzle(x, y, color) {
    for (let i = 0; i < 10; i++) {
      makeParticle(
        x + rand(-4, 4) * u,
        y,
        rand(-40, 40) * u,
        rand(-120, -30) * u,
        i % 2 ? color : [255, 236, 180],
        {
          life: rand(0.18, 0.36),
          size: rand(1.2, 2) * u,
          drag: 1.4,
          grav: 40 * u,
          trail: false,
          age: 0
        }
      );
    }
  }

  function simParticles(dt) {
    const born = [];
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.vy += p.grav * dt;
      const damp = Math.exp(-p.drag * dt);
      p.vx *= damp;
      p.vy *= damp;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.trail) {
        const h = p.trail[0];
        const minD = 8 * u;
        if (!h || (h.x - p.x) * (h.x - p.x) + (h.y - p.y) * (h.y - p.y) > minD * minD) {
          p.trail.unshift({ x: p.x, y: p.y });
          if (p.trail.length > 8) p.trail.pop();
        }
      }
      if (p.kind === "crackle" && !p.did && p.max - p.life > p.splitAt) {
        p.did = true;
        for (let k = 0; k < 7; k++) {
          const ang = Math.random() * Math.PI * 2;
          const sp = rand(50, 130) * u;
          born.push({
            x: p.x,
            y: p.y,
            vx: Math.cos(ang) * sp,
            vy: Math.sin(ang) * sp,
            cr: 255, cg: 250, cb: 220,
            life: 0.42,
            max: 0.42,
            size: 1.5 * u,
            drag: 1.5,
            grav: 36 * u,
            trail: null,
            kind: "spark",
            splitAt: 0,
            did: true
          });
        }
      }
    }
    let w = 0;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.life > 0 && p.x > -80 && p.x < W + 80 && p.y < horizon + 40) particles[w++] = p;
    }
    particles.length = w;
    for (let i = 0; i < born.length; i++) particles.push(born[i]);

    for (let i = flashes.length - 1; i >= 0; i--) {
      flashes[i].life -= dt;
      if (flashes[i].life <= 0) flashes.splice(i, 1);
    }
  }

  function update(dt) {
    showTime += dt;
    launchIn -= dt;
    if (launchIn <= 0) {
      const n = Math.random() < 0.2 ? 2 + (Math.random() < 0.35 ? 1 : 0) : 1;
      for (let i = 0; i < n; i++) queueRocket(i * rand(0.05, 0.12));
      launchIn = rand(0.32, 0.85);
    }
    if (showTime >= finaleAt) {
      finaleAt = showTime + rand(11, 16);
      const shapes = ["rainbow", "heart", "star", "chrys", "dblring", "willow", "saturn", "palm"];
      const left = rand(0.08, 0.16);
      for (let i = 0; i < 8; i++) {
        queueRocket(i * 0.075, {
          x: W * (left + i * 0.095),
          shape: shapes[(i + finaleN) % shapes.length]
        });
      }
      finaleN++;
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      if (r.wait > 0) {
        r.wait -= dt;
        if (r.wait > 0) continue;
      }
      if (!r.lit) {
        r.lit = true;
        muzzle(r.x, r.y, r.color);
      }
      r.vy += r.g * dt;
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      const head = r.trail[0];
      const minD = 6 * u;
      if (!head || (head.x - r.x) * (head.x - r.x) + (head.y - r.y) * (head.y - r.y) > minD * minD) {
        r.trail.unshift({ x: r.x, y: r.y });
        if (r.trail.length > 16) r.trail.pop();
      }
      if (r.vy >= 0) {
        emit(r.shape, r.x, r.y, r.color, r.scale, r.color2, 0);
        rockets.splice(i, 1);
      }
    }

    simParticles(dt);
  }

  function drawSky() {
    const g = sctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070018");
    g.addColorStop(0.38, "#160842");
    g.addColorStop(0.62, "#31125e");
    g.addColorStop(horizon / H, "#5a2458");
    g.addColorStop(1, "#1a1028");
    sctx.fillStyle = g;
    sctx.fillRect(0, 0, W, H);

    const glow = sctx.createRadialGradient(W * 0.5, horizon, H * 0.02, W * 0.5, horizon, W * 0.72);
    glow.addColorStop(0, "rgba(255, 92, 36, 0.5)");
    glow.addColorStop(0.28, "rgba(190, 30, 110, 0.2)");
    glow.addColorStop(1, "rgba(80, 0, 60, 0)");
    sctx.fillStyle = glow;
    sctx.fillRect(0, horizon - H * 0.5, W, H * 0.55);

    const mx = W * 0.8;
    const my = H * 0.13;
    const mr = 34 * u;
    const halo = sctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 4.2);
    halo.addColorStop(0, "rgba(255, 248, 220, 0.95)");
    halo.addColorStop(0.16, "rgba(255, 236, 180, 0.35)");
    halo.addColorStop(0.4, "rgba(255, 200, 120, 0.08)");
    halo.addColorStop(1, "rgba(255, 180, 80, 0)");
    sctx.fillStyle = halo;
    sctx.beginPath();
    sctx.arc(mx, my, mr * 4.2, 0, Math.PI * 2);
    sctx.fill();
    sctx.fillStyle = "#fff6d4";
    sctx.beginPath();
    sctx.arc(mx, my, mr, 0, Math.PI * 2);
    sctx.fill();
    sctx.fillStyle = "rgba(255, 244, 210, 0.35)";
    sctx.beginPath();
    sctx.arc(mx - mr * 0.28, my - mr * 0.22, mr * 0.72, 0, Math.PI * 2);
    sctx.fill();
  }

  function drawStars(t) {
    sctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      const a = s.a * tw;
      sctx.fillStyle = "rgba(255, 252, 245," + a + ")";
      sctx.beginPath();
      sctx.arc(s.x, s.y, Math.max(0.4, s.r), 0, Math.PI * 2);
      sctx.fill();
      if (s.spike && a > 0.55) {
        sctx.strokeStyle = "rgba(255, 250, 240," + (a * 0.45) + ")";
        sctx.lineWidth = Math.max(0.6, u * 0.7);
        const L = s.r * 5.5;
        sctx.beginPath();
        sctx.moveTo(s.x - L, s.y);
        sctx.lineTo(s.x + L, s.y);
        sctx.moveTo(s.x, s.y - L);
        sctx.lineTo(s.x, s.y + L);
        sctx.stroke();
      }
    }
    sctx.globalCompositeOperation = "source-over";
  }

  function drawFireworks() {
    sctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < flashes.length; i++) {
      const f = flashes[i];
      const k = f.life / f.max;
      const radius = f.r0 + (f.r1 - f.r0) * (1 - k);
      const grad = sctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, radius);
      grad.addColorStop(0, "rgba(255,255,255," + (0.7 * k) + ")");
      grad.addColorStop(0.22, rgba(f.color, 0.45 * k));
      grad.addColorStop(1, rgba(f.color, 0));
      sctx.fillStyle = grad;
      sctx.fillRect(f.x - radius, f.y - radius, radius * 2, radius * 2);
    }

    sctx.lineCap = "round";
    for (let i = 0; i < rockets.length; i++) {
      const r = rockets[i];
      if (r.wait > 0 || !r.lit) continue;
      const trail = r.trail;
      for (let j = trail.length - 1; j >= 0; j--) {
        const p = trail[j];
        const k = 1 - j / Math.max(1, trail.length);
        sctx.fillStyle = rgba(r.color, 0.08 + k * 0.4);
        sctx.beginPath();
        sctx.arc(p.x, p.y, (1 + k * 2.1) * u, 0, Math.PI * 2);
        sctx.fill();
      }
      sctx.fillStyle = rgba(r.color, 0.9);
      sctx.beginPath();
      sctx.arc(r.x, r.y, 5.5 * u, 0, Math.PI * 2);
      sctx.fill();
      sctx.fillStyle = "rgba(255,255,255,0.95)";
      sctx.beginPath();
      sctx.arc(r.x, r.y, 2.1 * u, 0, Math.PI * 2);
      sctx.fill();
    }

    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (!p.trail || p.trail.length < 2 || p.y > horizon) continue;
      const fade = Math.max(0, p.life / p.max);
      sctx.strokeStyle = "rgba(" + p.cr + "," + p.cg + "," + p.cb + "," + (0.45 * fade) + ")";
      sctx.lineWidth = Math.max(1, p.size * 0.85);
      sctx.beginPath();
      sctx.moveTo(p.x, p.y);
      for (let j = 0; j < p.trail.length; j++) sctx.lineTo(p.trail[j].x, p.trail[j].y);
      sctx.stroke();
    }

    const groups = new Map();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      if (p.life <= 0 || p.y > horizon + 8) continue;
      const key = p.cr + "," + p.cg + "," + p.cb;
      let bucket = groups.get(key);
      if (!bucket) groups.set(key, bucket = []);
      bucket.push(p);
    }

    for (const [key, arr] of groups) {
      sctx.fillStyle = "rgba(" + key + ",0.2)";
      sctx.beginPath();
      for (let i = 0; i < arr.length; i++) {
        const p = arr[i];
        const fade = p.life / p.max;
        const rad = Math.max(2.4 * Math.max(u, 0.45), p.size * 3.6 * (0.45 + fade));
        sctx.moveTo(p.x + rad, p.y);
        sctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      }
      sctx.fill();

      sctx.fillStyle = "rgba(" + key + ",0.95)";
      sctx.beginPath();
      for (let i = 0; i < arr.length; i++) {
        const p = arr[i];
        const fade = p.life / p.max;
        const rad = Math.max(1.15, p.size * (0.55 + 0.7 * fade));
        sctx.moveTo(p.x + rad, p.y);
        sctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      }
      sctx.fill();
    }

    sctx.fillStyle = "rgba(255,255,255,0.92)";
    sctx.beginPath();
    let hot = false;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const k = p.life / p.max;
      if (k < 0.78 || p.y > horizon) continue;
      const rad = Math.max(0.7, p.size * 0.48);
      sctx.moveTo(p.x + rad, p.y);
      sctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      hot = true;
    }
    if (hot) sctx.fill();

    sctx.globalCompositeOperation = "source-over";
  }

  function drawCity(t) {
    sctx.drawImage(city, 0, 0, city.width, city.height, 0, 0, W, H);
    for (let i = 0; i < flickers.length; i++) {
      const f = flickers[i];
      const on = 0.5 + 0.5 * Math.sin(t * 3.2 + f.phase);
      if (on < 0.35) continue;
      sctx.globalAlpha = on;
      sctx.fillStyle = f.color;
      sctx.fillRect(f.x, f.y, f.w, f.h);
    }
    sctx.globalAlpha = 1;
    sctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < boards.length; i++) {
      const b = boards[i];
      const pulse = 0.08 + 0.12 * (0.5 + 0.5 * Math.sin(t * 1.6 + i));
      sctx.fillStyle = "rgba(255,255,255," + pulse + ")";
      sctx.fillRect(b.x, b.y, b.w, b.h);
    }
    for (let i = 0; i < beacons.length; i++) {
      const b = beacons[i];
      const blink = Math.sin(t * 3.4 + b.phase) > -0.15;
      if (!blink) continue;
      sctx.fillStyle = "rgba(255, 36, 48, 0.95)";
      sctx.beginPath();
      sctx.arc(b.x, b.y, Math.max(1.3, 1.8 * u), 0, Math.PI * 2);
      sctx.fill();
      sctx.fillStyle = "rgba(255, 80, 70, 0.35)";
      sctx.beginPath();
      sctx.arc(b.x, b.y, 4.5 * u, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalCompositeOperation = "source-over";
  }

  function drawReflection(t) {
    const riverH = H - horizon;
    ctx.fillStyle = "#03101c";
    ctx.fillRect(0, horizon - 1, W, riverH + 1);

    const strip = Math.max(2, Math.round(2.5 * u));
    for (let y = 0; y < riverH; y += strip) {
      const srcBottom = horizon - y;
      const srcY = srcBottom - strip;
      if (srcY < 0) break;
      const depth = y / riverH;
      const amp = (1.6 + depth * 13) * u;
      const shift = Math.sin(y * 0.045 + t * 1.35) * amp
        + Math.sin(y * 0.013 - t * 0.85) * amp * 0.4
        + Math.sin(y * 0.18 + t * 2.6) * 1.1 * u;
      const alpha = 0.86 * (1 - depth * 0.48);
      const sh = strip;
      const sy = Math.max(0, Math.round(srcY * dpr));
      const she = Math.max(1, Math.round(sh * dpr));
      ctx.globalAlpha = alpha;
      ctx.drawImage(scene, 0, sy, scene.width, she, shift, horizon + y, W, sh);
      if (shift > 0.5) ctx.drawImage(scene, 0, sy, scene.width, she, shift - W, horizon + y, W, sh);
      else if (shift < -0.5) ctx.drawImage(scene, 0, sy, scene.width, she, shift + W, horizon + y, W, sh);
    }
    ctx.globalAlpha = 1;

    const wash = ctx.createLinearGradient(0, horizon, 0, H);
    wash.addColorStop(0, "rgba(6, 28, 48, 0.08)");
    wash.addColorStop(0.25, "rgba(3, 16, 36, 0.18)");
    wash.addColorStop(1, "rgba(0, 6, 16, 0.5)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, horizon, W, riverH);

    const shore = ctx.createLinearGradient(0, horizon, 0, horizon + 36 * u);
    shore.addColorStop(0, "rgba(255, 168, 96, 0.28)");
    shore.addColorStop(0.35, "rgba(80, 170, 255, 0.08)");
    shore.addColorStop(1, "rgba(80, 170, 255, 0)");
    ctx.fillStyle = shore;
    ctx.fillRect(0, horizon, W, 40 * u);

    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = Math.max(1, u);
    for (let i = 0; i < 9; i++) {
      const speed = 18 + (i % 4) * 9;
      const y = horizon + ((t * speed * u + i * riverH * 0.17) % riverH);
      ctx.strokeStyle = "rgba(170, 230, 255," + (0.035 + (i % 3) * 0.02) + ")";
      ctx.beginPath();
      for (let x = 0; x <= W; x += 16) {
        const yy = y + Math.sin(x * 0.018 + t * 1.7 + i) * 1.4 * u;
        if (x === 0) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    for (let i = 0; i < 16; i++) {
      const seed = i * 19.7;
      const gx = ((seed * 131 + t * (18 + (i % 5) * 10) * u) % (W + 80)) - 40;
      const gy = horizon + 8 * u + ((seed * 47) % Math.max(1, riverH - 16 * u));
      const len = (14 + (i % 6) * 10) * u;
      const flick = 0.08 + 0.1 * (0.5 + 0.5 * Math.sin(t * 2.4 + seed));
      ctx.fillStyle = i % 3 === 0
        ? "rgba(120, 255, 255," + flick + ")"
        : "rgba(255, 210, 140," + flick + ")";
      ctx.fillRect(gx, gy, len, Math.max(1, u));
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function render(t) {
    drawSky();
    drawStars(t);
    drawFireworks();

    const haze = sctx.createLinearGradient(0, horizon - 90 * u, 0, horizon);
    haze.addColorStop(0, "rgba(255, 120, 70, 0)");
    haze.addColorStop(1, "rgba(255, 100, 50, 0.16)");
    sctx.fillStyle = haze;
    sctx.fillRect(0, horizon - 90 * u, W, 90 * u);
    drawCity(t);

    const srcH = Math.max(1, Math.round((horizon + 1) * dpr));
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(scene, 0, 0, scene.width, srcH, 0, 0, W, horizon + 1);
    drawReflection(t);
  }

  function warmStart() {
    const seeds = [
      { x: 0.2, y: 0.16, shape: "peony", c: 0, c2: 6, age: 0.42, scale: 1.05 },
      { x: 0.48, y: 0.11, shape: "chrys", c: 7, c2: 3, age: 0.28, scale: 1.15 },
      { x: 0.74, y: 0.2, shape: "ring", c: 9, c2: 4, age: 0.5, scale: 1 },
      { x: 0.36, y: 0.2, shape: "willow", c: 3, c2: 1, age: 0.62, scale: 1.1 },
      { x: 0.62, y: 0.15, shape: "star", c: 6, c2: 14, age: 0.22, scale: 1 },
      { x: 0.84, y: 0.12, shape: "heart", c: 12, c2: 3, age: 0.18, scale: 0.95 }
    ];
    for (let i = 0; i < seeds.length; i++) {
      const s = seeds[i];
      emit(s.shape, s.x * W, s.y * H, PAL[s.c], s.scale, PAL[s.c2], s.age);
    }
    for (let i = 0; i < 3; i++) {
      queueRocket(0, {
        x: W * (0.25 + i * 0.22),
        shape: ["palm", "dblring", "crackle"][i]
      });
      const r = rockets[rockets.length - 1];
      r.lit = true;
      r.y = rand(H * 0.28, H * 0.46);
      r.vy = rand(-260, -90) * u;
      r.trail = [
        { x: r.x, y: r.y + 36 * u },
        { x: r.x - r.vx * 0.05, y: r.y + 18 * u }
      ];
    }
  }

  window.addEventListener("resize", () => {
    resize();
    render(showTime);
  });

  resize();
  warmStart();
  render(0);
  last = performance.now();
  requestAnimationFrame(function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016);
    last = now;
    update(dt);
    render(now / 1000);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
