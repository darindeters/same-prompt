<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030516">
<title>Midnight Fireworks</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030516; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas aria-label="Colorful fireworks over a city skyline reflected in a river at night" role="img"></canvas>
<script>
(() => {
  'use strict';
  const canvas = document.querySelector('canvas');
  const ctx = canvas.getContext('2d', { alpha: false });
  const scene = document.createElement('canvas');
  const s = scene.getContext('2d');
  const trails = document.createElement('canvas');
  const t = trails.getContext('2d');
  const city = document.createElement('canvas');
  const c = city.getContext('2d');
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const palettes = [[335, 20], [185, 225], [275, 320], [42, 18], [145, 180], [12, 48]];
  let w, h, scale, horizon, stars, buildings, last = 0, clock = 0, next = 0.2, count = 0;
  let particles = [], rockets = [], flashes = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.6);
    w = Math.round(innerWidth * dpr); h = Math.round(innerHeight * dpr);
    for (const layer of [canvas, scene, trails, city]) { layer.width = w; layer.height = h; }
    scale = Math.min(w, h); horizon = h * 0.685;
    stars = Array.from({ length: 140 }, () => ({ x: rand(0, w), y: rand(0, horizon * 0.88), r: rand(0.35, 1.1) * scale / 1080, a: rand(0.12, 0.65), phase: rand(0, TAU) }));
    particles = []; rockets = []; flashes = [];
    buildCity();
    burst(w * 0.28, h * 0.27, 'peony', [335, 20]);
    burst(w * 0.73, h * 0.18, 'ring', [185, 225]);
    launch(w * 0.57, h * 0.31, 'willow', [42, 18]);
  }

  function buildCity() {
    c.clearRect(0, 0, w, h);
    const u = scale / 1080;
    buildings = [];
    // Distant towers form a softer second layer behind the waterfront.
    for (let x = -20 * u; x < w;) {
      const bw = rand(22, 60) * u, bh = rand(30, 105) * u;
      c.fillStyle = '#11162e'; c.fillRect(x, horizon - bh, bw, bh);
      x += bw + rand(2, 9) * u;
    }
    for (let x = -12 * u; x < w;) {
      const bw = rand(26, 69) * u;
      const center = (x + bw / 2) / w;
      let bh = rand(55, 155) * u;
      if (center > 0.42 && center < 0.6) bh += 65 * u;
      const top = horizon - bh;
      c.fillStyle = '#050a18'; c.fillRect(x, top, bw, bh);
      c.fillStyle = '#0b1226'; c.fillRect(x + bw * 0.74, top, bw * 0.26, bh);
      if (Math.random() < 0.5) {
        c.fillStyle = '#060b19'; c.fillRect(x + bw * 0.22, top - 10 * u, bw * 0.56, 12 * u);
      }
      if (bh > 135 * u) {
        c.strokeStyle = '#24314d'; c.lineWidth = u;
        c.beginPath(); c.moveTo(x + bw / 2, top); c.lineTo(x + bw / 2, top - rand(15, 35) * u); c.stroke();
        c.fillStyle = '#ff487c'; c.fillRect(x + bw / 2 - u, top - 19 * u, 2 * u, 2 * u);
      }
      for (let yy = top + 9 * u; yy < horizon - 5 * u; yy += 8 * u) {
        for (let xx = x + 5 * u; xx < x + bw - 4 * u; xx += 7 * u) {
          if (Math.random() > 0.51) {
            c.fillStyle = Math.random() < 0.16 ? 'rgba(95,205,255,0.65)' : `rgba(255,209,135,${rand(0.2, 0.7)})`;
            c.fillRect(xx, yy, 2.2 * u, 3 * u);
          }
        }
      }
      buildings.push({x, top, bw, bh});
      x += bw + rand(3, 12) * u;
    }
    // A slim illuminated landmark anchors the center of the skyline.
    const lx = w * 0.535, ly = horizon - 265 * u;
    c.fillStyle = '#070d1e';
    c.beginPath(); c.moveTo(lx - 23*u, horizon); c.lineTo(lx - 18*u, ly + 45*u); c.lineTo(lx - 7*u, ly + 28*u); c.lineTo(lx, ly); c.lineTo(lx + 7*u, ly + 28*u); c.lineTo(lx + 18*u, ly + 45*u); c.lineTo(lx + 23*u, horizon); c.fill();
    c.strokeStyle = '#547f9b'; c.lineWidth = 1.2 * u;
    c.beginPath(); c.moveTo(lx, ly - 31*u); c.lineTo(lx, ly + 8*u); c.stroke();
    c.strokeStyle = '#3b6d89';
    c.beginPath(); c.moveTo(lx - 15*u, ly + 48*u); c.lineTo(lx - 20*u, horizon); c.moveTo(lx + 15*u, ly + 48*u); c.lineTo(lx + 20*u, horizon); c.stroke();
    for (let yy = ly + 48*u; yy < horizon; yy += 8*u) {
      c.fillStyle = 'rgba(138,222,255,0.45)'; c.fillRect(lx - 9*u, yy, 18*u, 1.2*u);
    }
    c.fillStyle = '#020610'; c.fillRect(0, horizon - 3*u, w, 8*u);
    for (let x = 0; x < w; x += 17*u) {
      c.fillStyle = 'rgba(255,206,131,0.85)'; c.fillRect(x, horizon - 2*u, 2*u, 1.5*u);
    }
  }

  function launch(x, y, shape, palette) {
    rockets.push({ x: x + rand(-0.08, 0.08)*scale, y: horizon + 3, tx: x, ty: y, shape, palette, life: 0, duration: rand(0.7, 1.1), sx: x + rand(-0.09, 0.09)*scale, sy: horizon });
  }

  function burst(x, y, shape, palette) {
    flashes.push({x, y, hue: palette[0], life: 0.32});
    const n = shape === 'willow' ? 145 : shape === 'heart' ? 110 : 165;
    const radius = rand(0.105, 0.165) * scale;
    for (let i = 0; i < n; i++) {
      const a = TAU * i / n + rand(-0.025, 0.025);
      let dx, dy, speed = radius * rand(0.83, 1.05);
      if (shape === 'heart') {
        dx = Math.pow(Math.sin(a), 3) * radius;
        dy = -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a)) / 16 * radius;
      } else {
        if (shape === 'peony' || shape === 'willow') speed *= Math.sqrt(Math.random());
        if (shape === 'star') speed *= 0.68 + 0.32 * Math.cos(a * 5);
        dx = Math.cos(a) * speed;
        dy = Math.sin(a) * speed * (shape === 'ring' ? 0.52 : 1);
      }
      const life = shape === 'willow' ? rand(2.1, 3.7) : rand(1.25, 2.35);
      particles.push({x, y, vx: dx * 1.65, vy: dy * 1.65, life, total: life,
        hue: i % 5 === 0 ? palette[1] : palette[0] + rand(-9, 9),
        size: rand(1.1, 2.2) * scale / 1080, drag: shape === 'willow' ? 1.15 : 1.7,
        gravity: (shape === 'willow' ? 29 : 22) * scale / 1080, flicker: rand(0, TAU), willow: shape === 'willow'});
    }
    // A contrasting inner bloom gives each shell a luminous center.
    if (shape !== 'heart' && shape !== 'star') {
      for (let i = 0; i < 36; i++) {
        const a = TAU*i/36, life = rand(0.65, 1.3);
        particles.push({x, y, vx: Math.cos(a)*radius*0.55, vy: Math.sin(a)*radius*0.55, life, total: life, hue: palette[1], size: 1.5*scale/1080, drag: 1.5, gravity: 22*scale/1080, flicker: i, willow: false});
      }
    }
    if (particles.length > 2800) particles.splice(0, particles.length - 2800);
  }

  function update(dt) {
    t.globalCompositeOperation = 'destination-out';
    t.fillStyle = `rgba(0,0,0,${1-Math.exp(-dt*7)})`; t.fillRect(0, 0, w, h);
    t.globalCompositeOperation = 'lighter';
    t.lineCap = 'round';
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i], ox = r.x, oy = r.y;
      r.life += dt;
      const f = Math.min(r.life/r.duration, 1), ease = 1 - Math.pow(1-f, 1.65);
      r.x = r.sx + (r.tx-r.sx)*ease; r.y = r.sy + (r.ty-r.sy)*ease;
      t.strokeStyle = `hsla(${r.palette[0]},100%,78%,0.85)`; t.lineWidth = 1.8*scale/1080;
      t.beginPath(); t.moveTo(ox,oy); t.lineTo(r.x,r.y); t.stroke();
      if (f >= 1) { burst(r.tx,r.ty,r.shape,r.palette); rockets.splice(i,1); }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.life -= dt;
      if (p.life <= 0) { particles.splice(i,1); continue; }
      const ox = p.x, oy = p.y;
      const drag = Math.exp(-p.drag*dt);
      p.vx *= drag; p.vy = p.vy*drag + p.gravity*dt;
      p.x += p.vx*dt; p.y += p.vy*dt;
      const fade = Math.min(1, p.life*1.7), age = 1-p.life/p.total;
      const twinkle = age > 0.55 ? 0.45 + 0.55*Math.pow(Math.sin(clock*22+p.flicker),2) : 1;
      t.strokeStyle = `hsla(${p.hue + (p.willow ? age*12 : 0)},100%,${68-age*17}%,${fade*twinkle})`;
      t.lineWidth = p.size * (1-age*0.35);
      t.beginPath(); t.moveTo(ox,oy); t.lineTo(p.x + (p.x-ox)*0.25,p.y + (p.y-oy)*0.25); t.stroke();
      if (age < 0.18) {
        t.fillStyle = `rgba(255,249,229,${(1-age/0.18)*0.8})`;
        t.fillRect(p.x,p.y,p.size*0.7,p.size*0.7);
      }
    }
    next -= dt;
    if (next <= 0) {
      count++;
      const shape = ['peony','ring','willow','heart','peony','star'][count % 6];
      const palette = palettes[count % palettes.length];
      const x = rand(0.18,0.82)*w, y = rand(0.16,0.39)*h;
      launch(x,y,shape,palette);
      if (count % 4 === 0) launch(w-x, y+0.08*h, 'peony', palettes[(count+2)%palettes.length]);
      next = rand(0.8,1.4);
    }
  }

  function draw(dt) {
    const sky = s.createLinearGradient(0,0,0,horizon);
    sky.addColorStop(0,'#020311'); sky.addColorStop(0.58,'#080b25'); sky.addColorStop(1,'#19152d');
    s.fillStyle = sky; s.fillRect(0,0,w,h);
    for (const star of stars) {
      s.fillStyle = `rgba(177,207,255,${star.a*(0.75+0.25*Math.sin(clock*0.7+star.phase))})`;
      s.beginPath(); s.arc(star.x,star.y,star.r,0,TAU); s.fill();
    }
    for (let i = flashes.length-1; i >= 0; i--) {
      const f = flashes[i]; f.life -= dt;
      if (f.life <= 0) { flashes.splice(i,1); continue; }
      const g = s.createRadialGradient(f.x,f.y,0,f.x,f.y,scale*0.3);
      g.addColorStop(0,`hsla(${f.hue},100%,60%,${f.life*0.18})`); g.addColorStop(1,`hsla(${f.hue},100%,50%,0)`);
      s.fillStyle = g; s.fillRect(0,0,w,horizon);
    }
    s.drawImage(trails,0,0);
    s.drawImage(city,0,0);
    ctx.drawImage(scene,0,0);
    const water = ctx.createLinearGradient(0,horizon,0,h);
    water.addColorStop(0,'#0c1125'); water.addColorStop(1,'#020713');
    ctx.fillStyle = water; ctx.fillRect(0,horizon,w,h-horizon);
    // Mirrored strips drift independently, stretching light into rippling ribbons.
    ctx.save();
    ctx.beginPath(); ctx.rect(0,horizon,w,h-horizon); ctx.clip();
    const band = Math.max(1.5,scale/420);
    for (let y = horizon; y < h; y += band) {
      const depth = (y-horizon)/(h-horizon);
      const sourceY = horizon - (y-horizon)*1.38;
      if (sourceY < 0) continue;
      const shift = (Math.sin(y/scale*150+clock*1.3)*2 + Math.sin(y/scale*340-clock*1.8)*1.2) * (0.4+depth*3.5)*scale/1080;
      ctx.globalAlpha = (0.52-depth*0.25)*(0.65+0.35*Math.sin(y*0.41+clock*0.8)**2);
      ctx.drawImage(scene,0,Math.max(0,sourceY),w,band*1.38,shift,y,w,band+0.5);
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(2,7,20,0.23)'; ctx.fillRect(0,horizon,w,h-horizon);
    for (let i=0; i<65; i++) {
      const depth = (i+1)/66, y = horizon+(h-horizon)*depth;
      const x = ((Math.sin(i*127.1)*43758.5453)%1+1)%1*w;
      ctx.strokeStyle = `rgba(94,139,178,${0.025+0.035*Math.sin(i+clock*0.6)**2})`;
      ctx.lineWidth = scale/1080;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+scale*(0.008+depth*0.045),y); ctx.stroke();
    }
    ctx.restore();
    const vignette = ctx.createRadialGradient(w/2,h*0.4,scale*0.28,w/2,h*0.45,Math.max(w,h)*0.8);
    vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(1,'rgba(0,0,8,0.42)');
    ctx.fillStyle = vignette; ctx.fillRect(0,0,w,h);
  }

  function frame(time) {
    const dt = Math.min((time-last)/1000 || 1/60,0.035);
    last = time; clock += dt;
    update(dt); draw(dt);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize);
  document.addEventListener('visibilitychange',() => { last = performance.now(); });
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
