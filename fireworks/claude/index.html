<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fireworks</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#03040f;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const bg = document.createElement('canvas');   // static: sky, stars, skyline, water base
  const bctx = bg.getContext('2d');
  const fx = document.createElement('canvas');   // fireworks with persistent trails
  const fctx = fx.getContext('2d');

  let W = 0, H = 0, DPR = 1, horizon = 0, unit = 1;
  let beacons = [];

  // Deterministic RNG so the city looks the same after a resize.
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    unit = Math.min(W, H) / 1080;
    horizon = Math.round(H * 0.72);
    for (const c of [canvas, bg, fx]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); }
    for (const c of [ctx, bctx, fctx]) c.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();
  }

  function drawBackground() {
    const g = bctx;
    g.clearRect(0, 0, W, H);

    // Night sky
    const sky = g.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0, '#02041a');
    sky.addColorStop(0.5, '#090e3a');
    sky.addColorStop(0.82, '#1b1350');
    sky.addColorStop(1, '#3b1c60');
    g.fillStyle = sky;
    g.fillRect(0, 0, W, horizon);

    // Warm city glow on the horizon
    const haze = g.createRadialGradient(W * 0.5, horizon, 0, W * 0.5, horizon, Math.max(W, H) * 0.6);
    haze.addColorStop(0, 'rgba(255,130,70,0.28)');
    haze.addColorStop(0.5, 'rgba(255,90,120,0.08)');
    haze.addColorStop(1, 'rgba(255,90,120,0)');
    g.fillStyle = haze;
    g.fillRect(0, 0, W, horizon);

    // Stars
    const sr = rng(1234);
    const n = Math.round(W * H / 2200);
    for (let i = 0; i < n; i++) {
      const x = sr() * W, y = sr() * horizon * 0.92, s = sr();
      const sz = s > 0.94 ? 2.2 * unit + 0.6 : s > 0.72 ? 1.4 * unit + 0.4 : 0.8;
      g.fillStyle = `rgba(${200 + sr() * 55 | 0},${215 + sr() * 40 | 0},255,${0.25 + s * 0.7})`;
      g.fillRect(x, y, sz, sz);
    }

    // Moon
    const mx = W * 0.8, my = horizon * 0.2, mr = 34 * unit + 8;
    const mg = g.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 4);
    mg.addColorStop(0, 'rgba(255,245,210,0.35)');
    mg.addColorStop(1, 'rgba(255,245,210,0)');
    g.fillStyle = mg;
    g.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    g.fillStyle = '#fff6d8';
    g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#0a0f3c';
    g.beginPath(); g.arc(mx - mr * 0.42, my - mr * 0.18, mr * 0.86, 0, Math.PI * 2); g.fill();

    // Water base
    const wat = g.createLinearGradient(0, horizon, 0, H);
    wat.addColorStop(0, '#0d1348');
    wat.addColorStop(0.4, '#060a2a');
    wat.addColorStop(1, '#02030c');
    g.fillStyle = wat;
    g.fillRect(0, horizon, W, H - horizon);

    // Skyline: a far hazy layer, then a near dark layer with lit windows.
    beacons = [];
    skyline(g, rng(77), '#151d5a', 0.06, 0.2, 14, 44, false);
    skyline(g, rng(99), '#05071a', 0.08, 0.34, 22, 78, true);

    // Shoreline glint
    g.fillStyle = 'rgba(255,180,110,0.55)';
    g.fillRect(0, horizon - 1, W, 1.5);
  }

  function skyline(g, r, color, hmin, hmax, wmin, wmax, near) {
    const scale = Math.max(unit, 0.45);
    let x = -10;
    while (x < W + 10) {
      const w = (wmin + r() * (wmax - wmin)) * scale;
      let h = H * (hmin + r() * (hmax - hmin));
      if (r() < 0.12) h *= 1.3;
      const top = horizon - h;
      const style = r();
      g.fillStyle = color;
      g.fillRect(x, top, w, h);
      if (style < 0.28) {                 // stepped crown
        const w2 = w * (0.4 + r() * 0.3), h2 = h * 0.1;
        g.fillRect(x + (w - w2) / 2, top - h2, w2, h2);
        if (r() < 0.5) { const w3 = w2 * 0.5; g.fillRect(x + (w - w3) / 2, top - h2 * 1.7, w3, h2 * 0.7); }
      } else if (style < 0.55) {          // antenna spire
        const sh = h * (0.15 + r() * 0.15);
        g.fillRect(x + w / 2 - 1, top - sh, 2, sh);
        if (near) beacons.push({ x: x + w / 2, y: top - sh, p: r() * 6.28 });
      } else if (style < 0.7) {           // pointed roof
        g.beginPath(); g.moveTo(x, top); g.lineTo(x + w / 2, top - h * 0.14); g.lineTo(x + w, top); g.fill();
      }
      if (near) {
        const cw = Math.max(5, 8 * scale), ch = Math.max(7, 11 * scale);
        const ww = cw * 0.45, wh = ch * 0.5;
        const warm = r() < 0.7;
        const density = 0.35 + r() * 0.4;
        const cols = Math.floor((w - cw * 0.5) / cw), rows = Math.floor((h - ch * 0.5) / ch);
        for (let c = 0; c < cols; c++) {
          for (let rr = 0; rr < rows; rr++) {
            if (r() > density) continue;
            const a = 0.35 + r() * 0.6;
            const k = r();
            g.fillStyle = warm
              ? (k < 0.75 ? `rgba(255,214,120,${a})` : `rgba(255,170,80,${a})`)
              : (k < 0.75 ? `rgba(150,225,255,${a})` : `rgba(255,255,255,${a})`);
            g.fillRect(x + cw * 0.5 + c * cw + (cw - ww) / 2, top + ch * 0.6 + rr * ch, ww, wh);
          }
        }
      }
      x += w + (r() < 0.35 ? r() * 10 * scale : 0) + 1;
    }
  }

  // ---------- Fireworks ----------
  const parts = [];     // sparks
  const rockets = [];
  const MAX_PARTS = 7000;
  const HUES = [0, 18, 42, 58, 118, 150, 180, 198, 225, 262, 288, 315, 338];
  const TYPES = ['peony', 'peony', 'ring', 'heart', 'star', 'willow', 'crossette', 'chrys', 'palm', 'glitter', 'twotone'];

  function pick(a) { return a[Math.random() * a.length | 0]; }
  function farHue(h) { let k; do { k = pick(HUES); } while (Math.abs(((k - h) % 360 + 540) % 360 - 180) < 110); return k; }

  function addPart(p) {
    if (parts.length >= MAX_PARTS) return;
    p.px = p.x; p.py = p.y;
    p.maxLife = p.life;
    parts.push(p);
  }

  function launch() {
    const x = W * (0.1 + Math.random() * 0.8);
    const ty = H * (0.1 + Math.random() * 0.4);
    const g = H * 0.45;
    const vy = -Math.sqrt(2 * g * (horizon - ty));
    rockets.push({
      x, y: horizon + 4, vx: (Math.random() - 0.5) * W * 0.05, vy, g,
      hue: pick(HUES), type: pick(TYPES)
    });
  }

  function flash(x, y, hue) {
    const R = Math.min(W, H) * 0.3;
    const gr = fctx.createRadialGradient(x, y, 0, x, y, R);
    gr.addColorStop(0, `hsla(${hue},100%,75%,0.55)`);
    gr.addColorStop(0.3, `hsla(${hue},100%,60%,0.18)`);
    gr.addColorStop(1, `hsla(${hue},100%,60%,0)`);
    fctx.globalCompositeOperation = 'lighter';
    fctx.fillStyle = gr;
    fctx.fillRect(x - R, y - R, R * 2, R * 2);
  }

  function explode(x, y, type, hue) {
    flash(x, y, hue);
    const base = H * (0.16 + Math.random() * 0.12);
    const G = H * 0.12;
    const rot = Math.random() * Math.PI * 2;
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const tilt = 0.35 + Math.random() * 0.65;
    const spread = () => (Math.random() - 0.5) * base * 0.05;

    const sphere = (n, fn) => {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, u = Math.random() * 2 - 1;
        const s = Math.sqrt(1 - u * u) * (0.55 + 0.45 * Math.random());
        fn(Math.cos(a) * s, Math.sin(a) * s, s);
      }
    };
    const outline = (pts, n, fn) => {
      for (let i = 0; i < n; i++) {
        const [ox, oy] = pts(i / n);
        const vx = ox * cr - oy * sr, vy = ox * sr + oy * cr;
        fn(vx, vy * tilt, 1);
      }
    };

    switch (type) {
      case 'peony':
        sphere(170, (vx, vy) => addPart({ x, y, vx: vx * base + spread(), vy: vy * base + spread(),
          life: 1.4 + Math.random() * 0.6, h: hue, l: 62, size: 2.4 * unit + 0.8, g: G, drag: 1.4 }));
        break;
      case 'twotone': {
        const h2 = farHue(hue);
        sphere(190, (vx, vy, s) => addPart({ x, y, vx: vx * base + spread(), vy: vy * base + spread(),
          life: 1.5 + Math.random() * 0.5, h: s > 0.6 ? hue : h2, l: 62, size: 2.4 * unit + 0.8, g: G, drag: 1.4 }));
        break;
      }
      case 'ring':
        outline(t => [Math.cos(t * 6.2832), Math.sin(t * 6.2832)], 110, (vx, vy) => addPart({ x, y,
          vx: vx * base * 1.05 + spread() * 0.4, vy: vy * base * 1.05 + spread() * 0.4,
          life: 1.5 + Math.random() * 0.4, h: hue, l: 62, size: 2.6 * unit + 0.8, g: G * 0.8, drag: 1.5 }));
        if (Math.random() < 0.6) {
          const h2 = farHue(hue);
          outline(t => [Math.cos(t * 6.2832) * 0.5, Math.sin(t * 6.2832) * 0.5], 60, (vx, vy) => addPart({ x, y,
            vx: vx * base + spread() * 0.4, vy: vy * base + spread() * 0.4,
            life: 1.5 + Math.random() * 0.4, h: h2, l: 65, size: 2.6 * unit + 0.8, g: G * 0.8, drag: 1.5 }));
        }
        break;
      case 'heart':
        outline(t => { const a = t * 6.2832; return [16 * Math.pow(Math.sin(a), 3) / 17,
          -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) / 17]; }, 140,
          (vx, vy) => addPart({ x, y, vx: vx * base * 0.95 + spread() * 0.3, vy: vy * base * 0.95 + spread() * 0.3,
            life: 1.6 + Math.random() * 0.4, h: Math.random() < 0.5 ? 338 : 0, l: 62, size: 2.6 * unit + 0.8, g: G * 0.6, drag: 1.5 }));
        break;
      case 'star':
        outline(t => {
          const k = t * 10, i = Math.floor(k), f = k - i;
          const ang = a => a * Math.PI / 5 - Math.PI / 2;
          const r0 = i % 2 ? 0.42 : 1, r1 = (i + 1) % 2 ? 0.42 : 1;
          const x0 = Math.cos(ang(i)) * r0, y0 = Math.sin(ang(i)) * r0;
          const x1 = Math.cos(ang(i + 1)) * r1, y1 = Math.sin(ang(i + 1)) * r1;
          return [x0 + (x1 - x0) * f, y0 + (y1 - y0) * f];
        }, 130, (vx, vy) => addPart({ x, y, vx: vx * base + spread() * 0.3, vy: vy * base + spread() * 0.3,
          life: 1.6 + Math.random() * 0.4, h: Math.random() < 0.7 ? 52 : hue, l: 64, size: 2.6 * unit + 0.8, g: G * 0.6, drag: 1.5 }));
        break;
      case 'willow':
        sphere(110, (vx, vy) => addPart({ x, y, vx: vx * base * 0.8 + spread(), vy: vy * base * 0.8 + spread(),
          life: 2.6 + Math.random() * 0.8, h: 42 + Math.random() * 14, l: 60, size: 2 * unit + 0.6, g: G * 1.3, drag: 1.1, trail: 0.5 }));
        break;
      case 'chrys':
        sphere(150, (vx, vy) => addPart({ x, y, vx: vx * base + spread(), vy: vy * base + spread(),
          life: 1.7 + Math.random() * 0.5, h: hue, l: 62, size: 2.2 * unit + 0.7, g: G, drag: 1.4, trail: 0.3 }));
        break;
      case 'palm':
        sphere(16, (vx, vy) => addPart({ x, y, vx: vx * base * 1.1 + spread(), vy: (vy - 0.25) * base * 1.1 + spread(),
          life: 1.6 + Math.random() * 0.4, h: hue, l: 62, size: 4 * unit + 1.2, g: G * 1.1, drag: 1.3, trail: 1.5 }));
        break;
      case 'crossette':
        sphere(26, (vx, vy) => addPart({ x, y, vx: vx * base * 0.9 + spread(), vy: vy * base * 0.9 + spread(),
          life: 1.9 + Math.random() * 0.3, h: hue, l: 62, size: 3 * unit + 1, g: G, drag: 1.4, split: true }));
        break;
      case 'glitter':
        sphere(200, (vx, vy) => addPart({ x, y, vx: vx * base + spread(), vy: vy * base + spread(),
          life: 2 + Math.random() * 0.8, h: Math.random() < 0.6 ? hue : 55, l: 70, size: 2.2 * unit + 0.7, g: G * 0.9, drag: 1.5, flicker: true }));
        break;
    }
  }

  function spark(p, speed, life, size) {
    addPart({ x: p.x, y: p.y, vx: p.vx * 0.3 + (Math.random() - 0.5) * speed, vy: p.vy * 0.3 + (Math.random() - 0.5) * speed,
      life, h: p.h, l: 70, size, g: p.g, drag: 2.5 });
  }

  function update(dt) {
    // Rockets
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += r.g * dt;
      r.x += r.vx * dt; r.y += r.vy * dt;
      // trail
      for (let k = 0; k < 2; k++) addPart({ x: r.x, y: r.y, vx: (Math.random() - 0.5) * 30 * unit, vy: 40 * unit + Math.random() * 60 * unit,
        life: 0.25 + Math.random() * 0.35, h: 40, l: 72, size: 1.8 * unit + 0.6, g: 0, drag: 1 });
      if (r.vy > -H * 0.04) { explode(r.x, r.y, r.type, r.hue); rockets.splice(i, 1); }
    }
    // Sparks
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.px = p.x; p.py = p.y;
      p.vy += p.g * dt;
      const d = Math.exp(-p.drag * dt);
      p.vx *= d; p.vy *= d;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.life -= dt;
      if (p.trail && Math.random() < p.trail * dt * 60 * 0.5) spark(p, 20 * unit, 0.35 + Math.random() * 0.35, 1.4 * unit + 0.5);
      if (p.split && p.life < p.maxLife * 0.55) {
        p.split = false; p.life = 0;
        const h2 = Math.random() < 0.5 ? p.h : farHue(p.h);
        const s = H * 0.09;
        for (let k = 0; k < 5; k++) {
          const a = k * Math.PI * 2 / 5 + Math.random() * 0.3;
          addPart({ x: p.x, y: p.y, vx: p.vx * 0.3 + Math.cos(a) * s, vy: p.vy * 0.3 + Math.sin(a) * s,
            life: 0.8 + Math.random() * 0.4, h: h2, l: 64, size: 2.2 * unit + 0.7, g: p.g, drag: 1.6 });
        }
      }
      if (p.life <= 0 || p.y > H + 20) { parts[i] = parts[parts.length - 1]; parts.pop(); }
    }
  }

  function renderFx() {
    fctx.globalCompositeOperation = 'destination-out';
    fctx.fillStyle = 'rgba(0,0,0,0.2)';
    fctx.fillRect(0, 0, W, H);
    fctx.globalCompositeOperation = 'lighter';
    fctx.lineCap = 'round';
    for (const r of rockets) {
      fctx.strokeStyle = 'rgba(255,230,180,0.95)';
      fctx.lineWidth = 2.5 * unit + 0.8;
      fctx.beginPath(); fctx.moveTo(r.x - r.vx * 0.02, r.y - r.vy * 0.02); fctx.lineTo(r.x, r.y); fctx.stroke();
    }
    for (const p of parts) {
      let a = p.life / p.maxLife;
      a = a < 0.5 ? a * 2 : 1;
      if (p.flicker && Math.random() < 0.6) a *= 0.12;
      if (a < 0.02) continue;
      fctx.strokeStyle = `hsla(${p.h},100%,${p.l}%,${a})`;
      fctx.lineWidth = p.size;
      fctx.beginPath(); fctx.moveTo(p.px, p.py); fctx.lineTo(p.x, p.y); fctx.stroke();
    }
  }

  function composite(t) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.drawImage(bg, 0, 0, bg.width, bg.height, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(fx, 0, 0, fx.width, Math.round(horizon * DPR), 0, 0, W, horizon);

    // River reflection: strips of the sky and fireworks, flipped, wobbled and dimmed.
    const RH = H - horizon, step = 3;
    for (let y = horizon; y < H; y += step) {
      const dist = y - horizon, f = dist / RH;
      const sy = horizon - dist * 1.25 - step;
      if (sy < 0) break;
      const off = Math.sin(dist * 0.11 + t * 2.4) * (0.8 + f * 6 * unit)
                + Math.sin(dist * 0.37 - t * 3.3 + f * 4) * 1.4 * unit;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.5 - 0.32 * f;
      ctx.drawImage(bg, 0, sy * DPR, bg.width, step * DPR, off, y, W, step);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.75 - 0.45 * f;
      ctx.drawImage(fx, 0, sy * DPR, fx.width, step * DPR, off, y, W, step);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // Blinking red beacons on antennas
    for (const b of beacons) {
      if (Math.sin(t * 3 + b.p) > 0.3) {
        ctx.fillStyle = 'rgba(255,50,50,0.95)';
        ctx.beginPath(); ctx.arc(b.x, b.y, 1.6 * unit + 0.8, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  // ---------- Scheduling & loop ----------
  let last = performance.now(), t = 0, nextLaunch = 0.4;
  const queue = [];

  function schedule(dt) {
    nextLaunch -= dt;
    if (nextLaunch <= 0) {
      if (Math.random() < 0.2) {
        const n = 3 + (Math.random() * 4 | 0);
        for (let i = 0; i < n; i++) queue.push(t + i * 0.16);
        nextLaunch = 2.4 + Math.random() * 1.4;
      } else {
        queue.push(t);
        nextLaunch = 0.35 + Math.random() * 0.9;
      }
    }
    for (let i = queue.length - 1; i >= 0; i--) if (queue[i] <= t) { launch(); queue.splice(i, 1); }
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now; t += dt;
    schedule(dt);
    update(dt);
    renderFx();
    composite(t);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  // Open with bursts already in the sky, then keep launching.
  explode(W * 0.35, H * 0.3, 'peony', pick(HUES));
  explode(W * 0.65, H * 0.22, 'ring', pick(HUES));
  launch(); launch();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
